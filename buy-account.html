<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T.B Agar.io Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
body { background:#f3f4f6; }
.modal{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background-color:rgba(0,0,0,0.5);}
.hidden{display:none;}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="bg-gray-900 text-white p-4 flex justify-between items-center">
  <span class="font-bold text-lg">T.B Agar.io Admin Panel</span>
  <button id="logoutBtn" class="bg-red-500 px-3 py-2 rounded hidden">Logout</button>
</header>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
  <div class="bg-white p-6 rounded w-full max-w-sm relative">
    <h2 class="text-xl font-bold mb-4">Admin Login</h2>
    <input id="adminPassword" type="password" placeholder="Password" class="w-full mb-2 px-3 py-2 border rounded">
    <button id="loginBtn" class="bg-blue-500 text-white w-full py-2 rounded">Login</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden p-6 max-w-6xl mx-auto">

  <div class="flex gap-4 mb-4">
    <button id="ordersBtn" class="bg-purple-600 px-3 py-2 rounded text-white">Orders</button>
    <button id="usersBtn" class="bg-green-600 px-3 py-2 rounded text-white">Users</button>
  </div>

  <!-- USERS MODAL -->
  <div id="usersModal" class="modal hidden">
    <div class="bg-white p-6 rounded w-full max-w-3xl relative">
      <span class="absolute top-2 right-2 text-2xl cursor-pointer" onclick="closeUsers()">×</span>
      <h2 class="text-xl font-bold mb-4">Users</h2>
      <div id="usersList" class="space-y-3"></div>
    </div>
  </div>

  <!-- ORDERS MODAL -->
  <div id="ordersModal" class="modal hidden">
    <div class="bg-white p-6 rounded w-full max-w-lg relative">
      <span class="absolute top-2 right-2 text-2xl cursor-pointer" onclick="closeOrders()">×</span>
      <h2 class="text-xl font-bold mb-4">Orders</h2>
      <div id="ordersList" class="space-y-3"></div>
    </div>
  </div>

</div>

<script>
feather.replace();

/* =====================
   DATA
===================== */
let users = JSON.parse(localStorage.getItem("users") || "[]");
let orders = JSON.parse(localStorage.getItem("orders") || "[]");

/* =====================
   ADMIN LOGIN
===================== */
const adminPasswordValue = "admin123"; // stel hier je admin wachtwoord in
const loginModal = document.getElementById("loginModal");
const loginBtn = document.getElementById("loginBtn");
const adminPanel = document.getElementById("adminPanel");
const logoutBtn = document.getElementById("logoutBtn");

loginBtn.onclick = () => {
    const pass = document.getElementById("adminPassword").value;
    if(pass === adminPasswordValue){
        alert("Login successful!");
        loginModal.classList.add("hidden");
        adminPanel.classList.remove("hidden");
        logoutBtn.classList.remove("hidden");
    } else {
        alert("Wrong password!");
    }
};

logoutBtn.onclick = () => {
    adminPanel.classList.add("hidden");
    logoutBtn.classList.add("hidden");
    loginModal.classList.remove("hidden");
};

/* =====================
   USERS PANEL
===================== */
const usersBtn = document.getElementById("usersBtn");
const usersModal = document.getElementById("usersModal");
const usersList = document.getElementById("usersList");

usersBtn.onclick = () => {
    usersModal.classList.remove("hidden");
    renderUsers();
};

function closeUsers(){ usersModal.classList.add("hidden"); }

function renderUsers(){
    usersList.innerHTML = "";
    users.forEach((u, idx) => {
        const div = document.createElement("div");
        div.className = "border p-3 rounded flex justify-between bg-gray-100 items-center";

        div.innerHTML = `
            <div>
                <div><strong>Name:</strong> <input value="${u.name}" class="border px-1 py-1 rounded" /></div>
                <div><strong>Email:</strong> <input value="${u.email}" class="border px-1 py-1 rounded" /></div>
                <div><strong>UID:</strong> <input value="${u.uid}" class="border px-1 py-1 rounded" /></div>
                <div><strong>Password:</strong> <input value="${u.password}" class="border px-1 py-1 rounded" /></div>
                <div><strong>Key:</strong> ${u.key}</div>
                <div><strong>Balance:</strong> <input type="number" value="${u.balance}" class="border px-1 py-1 rounded w-24" /></div>
            </div>
            <div>
                <button class="save bg-green-600 text-white px-2 py-1 rounded">Save</button>
                <button class="delete bg-red-600 text-white px-2 py-1 rounded">Delete</button>
            </div>
        `;

        const inputs = div.querySelectorAll("input");
        div.querySelector(".save").onclick = () => {
            u.name = inputs[0].value;
            u.email = inputs[1].value;
            u.uid = inputs[2].value;
            u.password = inputs[3].value;
            u.balance = parseFloat(inputs[4].value);
            users[idx] = u;
            localStorage.setItem("users", JSON.stringify(users));
            alert("User updated!");
        };

        div.querySelector(".delete").onclick = () => {
            if(confirm("Delete this user?")){
                users.splice(idx, 1);
                localStorage.setItem("users", JSON.stringify(users));
                renderUsers();
            }
        };

        usersList.appendChild(div);
    });
}

/* =====================
   ORDERS PANEL
===================== */
const ordersBtn = document.getElementById("ordersBtn");
const ordersModal = document.getElementById("ordersModal");
const ordersList = document.getElementById("ordersList");

ordersBtn.onclick = () => {
    ordersModal.classList.remove("hidden");
    renderOrders();
};

function closeOrders(){ ordersModal.classList.add("hidden"); }

function renderOrders(){
    ordersList.innerHTML = "";
    orders.forEach((order, idx) => {
        const div = document.createElement("div");
        div.className = "border p-3 rounded flex justify-between items-center bg-white";

        div.innerHTML = `
            <div>
                <div><strong>User:</strong> ${order.user.name}</div>
                <div><strong>UID:</strong> ${order.user.uid}</div>
                <div><strong>Skins:</strong> ${order.items.map(i => i.name + " x" + i.qty).join(", ")}</div>
                <div><strong>Total:</strong> $${order.total.toFixed(2)}</div>
            </div>
            <div class="flex gap-2">
                <button class="process bg-green-600 text-white px-2 py-1 rounded">Process</button>
                <button class="delete bg-red-600 text-white px-2 py-1 rounded">Delete</button>
            </div>
        `;

        div.querySelector(".process").onclick = () => {
            generateKassaBon(order);
            orders.splice(idx, 1);
            localStorage.setItem("orders", JSON.stringify(orders));
            renderOrders();
        };

        div.querySelector(".delete").onclick = () => {
            if(confirm("Delete this order?")){
                orders.splice(idx,1);
                localStorage.setItem("orders", JSON.stringify(orders));
                renderOrders();
            }
        };

        ordersList.appendChild(div);
    });
}

/* =====================
   KASSA BON GENERATOR
===================== */
function generateKassaBon(order){
    let itemsText = "";
    order.items.forEach(i => {
        itemsText += `${i.name} x${i.qty}\n`;
    });

    const bon = `
T.B Agar.io
------------------------
Paid skins
UID: ${order.user.uid}
${itemsText}------------------------
Total Paid: $${order.total.toFixed(2)}
------------------------
Your order is being processed, please wait 2 - 3 days.
If your order hasn't arrived in-game, contact us on Instagram: @t.bagar.io
`;

    const win = window.open("", "Kassa Bon", "width=400,height=600");
    win.document.write(`<pre style="font-family:monospace">${bon}</pre>`);
    win.document.close();
    win.focus();
}
</script>
</body>
</html>
