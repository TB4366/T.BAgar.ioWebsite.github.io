<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>T.B Agar.io VIP</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#fff; margin:0; }
    header { display:flex; align-items:center; gap:15px; background:#1e1e1e; padding:15px; }
    header img { height:40px; }
    h1 { font-size:20px; margin:0; }
    main { padding:20px; max-width:600px; margin:auto; }
    hr { margin:25px 0; border:0; border-top:1px solid #333; }
    input, select, button { width:100%; padding:10px; margin-top:10px; border-radius:5px; border:none; }
    button { background:#00c853; color:#000; font-weight:bold; cursor:pointer; }
    button:hover { background:#00e676; }
    .skins { display:flex; gap:15px; margin-top:15px; }
    .skin { flex:1; background:#222; padding:10px; text-align:center; border-radius:8px; cursor:pointer; border:2px solid transparent; }
    .skin.selected { border-color:#00c853; }
    .note { font-size:12px; color:#aaa; margin-top:10px; }
  </style>
</head>
<body>

<header>
  <img src="https://agar.io/favicon.ico" alt="Agar.io" />
  <h1>T.B Agar.io VIP</h1>
</header>

<main>
  <h2>AGAR.IO PAID SKINS OFFICIEEL</h2>
  <hr />

  <label>Vul je UID in</label>
  <input id="uid" placeholder="Bijv. 123456789" />

  <h3>Selecteer een skin</h3>
  <div class="skins">
    <div class="skin" data-item="skin_shadowfire">Shadowfire<br>€4,99</div>
    <div class="skin" data-item="skin_voidstalker">Voidstalker<br>€4,99</div>
  </div>

  <button onclick="betalen()">Betalen</button>

  <div class="note">Betaling verloopt veilig via Xsolla</div>
</main>

<script>
let selectedItem = null;

document.querySelectorAll('.skin').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.skin').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
    selectedItem = el.dataset.item;
  });
});

async function betalen() {
  const uid = document.getElementById('uid').value.trim();
  if (!uid || !selectedItem) {
    alert('Vul UID in en selecteer een skin');
    return;
  }

  const res = await fetch('http://localhost:3000/create-payment', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid, item: selectedItem })
  });

  const data = await res.json();
  if (data.paymentUrl) {
    window.location.href = data.paymentUrl;
  } else {
    alert('Fout bij aanmaken betaling');
  }
}
</script>

</body>
</html>
