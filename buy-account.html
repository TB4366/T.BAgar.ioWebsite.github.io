<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Special Deals — Agar.io skins</title>
  <style>
    :root{--orange:#f08b2d;--muted:#f7f2ea;--text:#222}
    body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:#fff;padding:24px;color:var(--text)}
    h1{font-size:28px;margin:0 0 18px}
    .panel{max-width:980px;margin:0 auto}
    .uid-row{display:flex;gap:12px;align-items:center;margin-bottom:16px}
    .uid-row input[type=text]{flex:1;padding:12px;border:1px solid #ddd;border-radius:4px;font-family:monospace}
    label{font-size:14px}
    .offer-title{font-size:22px;margin:18px 0}
    .offer{background:var(--orange);border-radius:8px;padding:18px;color:white;display:flex;gap:18px;align-items:center}
    .coins{flex:0 0 420px;background:linear-gradient(180deg,#ffcc4d,#f4b400);border-radius:8px;padding:18px;display:flex;align-items:center}
    .coins .stack{width:220px;height:120px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="120"></svg>') no-repeat center/cover}
    .price{font-weight:700;font-size:22px;margin-left:auto}
    .skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:20px}
    .skin{background:#fff;border:1px solid #e6e6e6;padding:6px;border-radius:8px;display:flex;flex-direction:column;align-items:center}
    .skin img{width:120px;height:120px;object-fit:contain}
    .buy-btn{margin-top:8px;background:var(--orange);border:none;color:white;padding:8px 12px;border-radius:6px;cursor:pointer}
    .footer-note{background:#fff3d9;border-left:4px solid #e6c08b;padding:12px;margin-top:12px;border-radius:4px}
    .controls{display:flex;gap:8px;margin-top:10px;align-items:center}
    .tiny{font-size:13px;color:#666}
    .error{color:#b00020}
  </style>
</head>
<body>
  <div class="panel">
    <h1>Special Deals</h1>

    <div class="uid-row">
      <input id="encodedUid" type="text" placeholder="GFRTIMZY..." value="" />
      <label><input id="friendEncoded" type="checkbox" /> Friend Encoded uid</label>
    </div>

    <div class="offer-title">purchase <strong>125000</strong> coins <span style="font-weight:400;font-size:16px">(click on the orange icon to buy)</span> <span class="price">99.99 $</span></div>

    <div class="offer">
      <div class="coins">
        <div style="flex:1;">
          <h3 style="margin:0 0 8px">125000 C</h3>
          <p style="margin:0 0 12px">Bonus skins included</p>
        </div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/8d/Coins_icon.png" alt="coins" style="width:110px;height:110px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,0.2);padding:6px"/>
      </div>

      <div style="flex:1;padding:8px 6px">
        <div style="font-size:14px;margin-bottom:6px">125000_coins = 99.99 $</div>
        <div style="font-size:14px">Valuta:
          <select id="currencySelect">
            <option>USD</option>
            <option>EUR</option>
          </select>
        </div>

        <div style="margin-top:12px">
          <input id="configUrl" type="text" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px" value="https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json" />
        </div>

        <div class="controls">
          <button id="loadBtn" class="buy-btn">Laad skins</button>
          <div class="tiny">For some payment methods Library</div>
        </div>

        <div class="footer-note">
          To make purchases, you must be logged in to your account…<br>
          Encoded UID: <span id="uidPreview" style="font-family:monospace;color:#0b6">(enter above)</span>
        </div>
      </div>
    </div>

    <h2 style="margin-top:22px">Alle skins in deze config</h2>
    <div id="skinsContainer" class="skin-grid"></div>

    <div id="status" class="tiny" style="margin-top:12px"></div>
  </div>

  <script>
    // Best-effort loader: tries to fetch the provided JSON and locate arrays of image URLs or skin definitions.
    async function loadConfig(url){
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Loading...';

      try{
        const res = await fetch(url);
        if(!res.ok) throw new Error('Fetch failed: ' + res.status);
        const data = await res.json();

        // Search the object for arrays that look like skins
        const images = [];
        function walk(node){
          if(!node) return;
          if(Array.isArray(node)){
            // if array of strings that look like image urls
            if(node.length>0 && node.every(it => typeof it === 'string')){
              node.forEach(it=>{
                if(/https?:.*\.(png|jpg|jpeg|gif|svg)(\?.*)?$/i.test(it) || /^(data:image\/)/.test(it)) images.push(it);
              });
            } else {
              node.forEach(walk);
            }
          } else if(typeof node === 'object'){
            Object.values(node).forEach(walk);
          }
        }
        walk(data);

        // Some configs have objects with 'skins' keyed entries where images are relative paths or ids.
        // Also collect entries that contain 'skin' or 'image' in the key with a string value.
        function walkForStrings(obj){
          if(!obj) return;
          if(typeof obj === 'string'){
            if(/https?:.*\.(png|jpg|jpeg|gif|svg)(\?.*)?$/i.test(obj) || /^(data:image\/)/.test(obj)) images.push(obj);
            return;
          }
          if(Array.isArray(obj)) obj.forEach(walkForStrings);
          else if(typeof obj === 'object'){
            for(const [k,v] of Object.entries(obj)){
              if(/skin|image|url/i.test(k) && typeof v === 'string'){
                if(/https?:.*\.(png|jpg|jpeg|gif|svg)/i.test(v)) images.push(v);
              }
              walkForStrings(v);
            }
          }
        }
        walkForStrings(data);

        // Deduplicate and show
        const uniq = Array.from(new Set(images));
        if(uniq.length===0){
          statusEl.innerHTML = '<span class="error">Geen directe skin-afbeeldingen gevonden in de config. Mogelijk gebruikt de config relatieve paden of ids. Je kunt de JSON handmatig openen en de skinlijst plakken in het veld.</span>';
          return [];
        }
        statusEl.textContent = 'Gevonden ' + uniq.length + ' skins.';
        return uniq;
      }catch(err){
        statusEl.innerHTML = '<span class="error">Kan config niet laden — controleer CORS of de URL. Error: ' + err.message + '</span>';
        return [];
      }
    }

    function renderSkins(urls){
      const container = document.getElementById('skinsContainer');
      container.innerHTML = '';
      urls.forEach(u=>{
        const card = document.createElement('div'); card.className='skin';
        const img = document.createElement('img'); img.src = u; img.alt = 'skin';
        const name = document.createElement('div'); name.className='tiny'; name.textContent = u.split('/').pop().split('?')[0];
        const btn = document.createElement('button'); btn.className='buy-btn'; btn.textContent='Buy';
        btn.addEventListener('click', ()=>{
          const uid = document.getElementById('encodedUid').value.trim();
          if(!uid) return alert('Voer eerst je Encoded UID in.');
          // Simple demo action
          alert('Koopt ' + name.textContent + ' voor account: ' + uid + '\n(dit is een demo)');
        });
        card.appendChild(img); card.appendChild(name); card.appendChild(btn);
        container.appendChild(card);
      });
    }

    document.getElementById('loadBtn').addEventListener('click', async ()=>{
      const url = document.getElementById('configUrl').value.trim();
      if(!url) return alert('Voer de config-URL in');
      const skins = await loadConfig(url);
      renderSkins(skins);
    });

    // show uid preview
    document.getElementById('encodedUid').addEventListener('input', e=>{
      const v = e.target.value.trim();
      document.getElementById('uidPreview').textContent = v || '(enter above)';
    });

    // Auto-attempt load the default URL once (best-effort)
    (async ()=>{
      const defaultUrl = document.getElementById('configUrl').value;
      try{ const skins = await loadConfig(defaultUrl); renderSkins(skins);}catch(e){}
    })();
  </script>
</body>
</html>
