<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Koop Skin</title>
</head>
<body>
<h1>Kies je skin</h1>
<div id="skins"></div>

<script>
// Voorbeeld mapping: productId -> Xsolla PID
const skinToXsollaPID = {
    "skin_olympus_hades": 3175,
    "skin_olympus_ares": 3176,
    "skin_olympus_zeus": 3177,
    "skin_nvr_zap": 3178,
    "skin_nvr_silent_fox": 3179,
    // Voeg hier al je skins en hun PIDs toe
};

// Voorbeeld skins uit config
const skins = [
    {name: "Olympus Hades", productId: "skin_olympus_hades"},
    {name: "Olympus Ares", productId: "skin_olympus_ares"},
    {name: "Olympus Zeus", productId: "skin_olympus_zeus"},
    {name: "NVR Zap", productId: "skin_nvr_zap"},
    {name: "NVR Silent Fox", productId: "skin_nvr_silent_fox"},
];

const skinsContainer = document.getElementById("skins");

// Voeg knoppen toe voor alle skins
skins.forEach(skin => {
    const btn = document.createElement("button");
    btn.innerText = skin.name;
    btn.onclick = () => {
        const pid = skinToXsollaPID[skin.productId];
        if(!pid) {
            alert("Geen Xsolla PID gevonden voor deze skin!");
            return;
        }

        // Bouw dynamische Xsolla URL
        const url = `https://secure.xsolla.com/paystation3/desktop/payment/?access_token=ryolptUISLKE3SmWGBP9MQ05xHBvub5j_lc_en&additional=${btoa(JSON.stringify({pid: pid}))}&preferences=${btoa(JSON.stringify({itemProportions: []}))}&sessional=${btoa(JSON.stringify({history:[["savedmethod"],["list",true],["payment",true,{pid: pid}]]}))}`;

        window.open(url, "_blank");
    };
    skinsContainer.appendChild(btn);
});
</script>
</body>
</html>
