<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy Account</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; background: #0f1220; color: #fff; }

    /* Top bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: #151935;
      border-bottom: 1px solid #2a2f55;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #333;
    }

    .logo span {
      font-size: 20px;
      font-weight: bold;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    /* Main content */
    main { padding: 30px 20px; }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 20px;
    }

    hr {
      border: none;
      border-top: 1px solid #2a2f55;
      margin: 30px 0;
    }

    /* Account grid */
    .accounts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .account {
      background: #151935;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .account:hover {
      transform: translateY(-5px);
      background: #1c2147;
    }

    .account img {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      background: #333;
      object-fit: cover;
    }

    .account h3 { margin: 10px 0 5px; }
    .account p { margin: 0; color: #cfcfe6; }

    /* Settings panel */
    .settings {
      margin-top: 40px;
      background: #151935;
      padding: 20px;
      border-radius: 12px;
    }

    .setting {
      margin-bottom: 15px;
    }

    .setting label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #cfcfe6;
    }

    input[type=range], input[type=number] {
      width: 100%;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .buttons button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .search-btn { background: #3b82f6; color: #fff; }
    .create-btn { background: #22c55e; color: #000; }

    .checkout {
      margin-top: 20px;
      text-align: right;
    }

    .checkout a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      background: #e1306c;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    @media (max-width: 900px) {
      .accounts { grid-template-columns: 1fr; }
      .buttons { flex-direction: column; gap: 10px; }
      .checkout { text-align: left; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="https://via.placeholder.com/40" alt="Logo" />
    <span>T.B Agar.io</span>
  </div>
  <button class="settings-btn">⚙️</button>
</header>

<main>
  <h1>CHOOSE YOUR PERFECT ACCOUNT THAT SUITS YOU!</h1>

  <hr />

  <section class="accounts">
    <div class="account" onclick="alert('Account information')">
      <img src="https://via.placeholder.com/300x140" />
      <h3>Starter Account</h3>
      <p>Level 25 • €9.99</p>
    </div>
    <div class="account" onclick="alert('Account information')">
      <img src="https://via.placeholder.com/300x140" />
      <h3>Pro Account</h3>
      <p>Level 75 • €24.99</p>
    </div>
    <div class="account" onclick="alert('Account information')">
      <img src="https://via.placeholder.com/300x140" />
      <h3>Legend Account</h3>
      <p>Level 150 • €49.99</p>
    </div>
  </section>

  <div class="settings">
    <div class="setting">
      <label>Coins (0 – 10,000,000)</label>
      <input type="range" min="0" max="10000000" />
    </div>
    <div class="setting">
      <label>DNA (0 – 650,000)</label>
      <input type="range" min="0" max="650000" />
    </div>
    <div class="setting">
      <label>Emoji Amount</label>
      <input type="number" min="0" />
    </div>
    <div class="setting">
      <label>Paid Skins (0 – 50)</label>
      <input type="range" min="0" max="50" />
    </div>
    <div class="setting">
      <label>Premium Skins (0 – 250)</label>
      <input type="range" min="0" max="250" />
    </div>
    <div class="setting">
      <label>4K Custom Skins (Forever Upload)</label>
      <select style="width:100%">
        <option>4K Custom Skins Forever</option>
        <option>No 4K Custom Skins</option>
      </select>
    </div>
    <div class="setting">
      <label>Level (0 – 150)</label>
      <input type="range" min="0" max="150" />
    </div>

    <hr />

    <div class="buttons">
      <button class="search-btn">Search My Account</button>
      <button class="create-btn">Create My Account</button>
    </div>

    <div class="checkout">
      <strong>Total Amount: €0.00</strong><br />
      <span>Contact T.B</span><br />
      <a href="https://www.instagram.com/t.bagar.io/" target="_blank">Instagram</a>
    </div>
  </div>
</main>

</body>
</html>
