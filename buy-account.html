<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body{background:#0b1220;color:white;font-family:Arial;padding:20px;}
input,button{padding:8px;margin:5px;border-radius:6px;border:none;}
table{width:100%;margin-top:20px;border-collapse:collapse;}
th,td{border:1px solid #334155;padding:10px;text-align:center;}
button{cursor:pointer;font-weight:bold;}
.add{background:#22c55e;}
.del{background:#ef4444;}
.edit{background:#facc15;color:#111;}
</style>
</head>

<body>

<h1>👑 Admin Panel</h1>

<h2>Add User</h2>
<input id="newUser" placeholder="Username">
<input id="newKey" placeholder="Key">
<button class="add" onclick="addUser()">Add</button>

<h2>Users</h2>
<table>
<thead>
<tr><th>Username</th><th>Key</th><th>Actions</th></tr>
</thead>
<tbody id="userTable"></tbody>
</table>

<script>
function getUsers(){
  return JSON.parse(localStorage.getItem("users") || "[]");
}
function saveUsers(users){
  localStorage.setItem("users", JSON.stringify(users));
}

function render(){
  const table = document.getElementById("userTable");
  table.innerHTML = "";
  getUsers().forEach((u,i)=>{
    table.innerHTML += `
      <tr>
        <td>${u.username}</td>
        <td>${u.key}</td>
        <td>
          <button class="edit" onclick="editUser(${i})">Edit</button>
          <button class="del" onclick="deleteUser(${i})">Delete</button>
        </td>
      </tr>`;
  });
}

function addUser(){
  const user=document.getElementById("newUser").value.trim();
  const key=document.getElementById("newKey").value.trim();
  if(!user||!key)return alert("Fill all fields");
  const users=getUsers();
  users.push({username:user,key:key});
  saveUsers(users);
  render();
}

function deleteUser(i){
  const users=getUsers();
  users.splice(i,1);
  saveUsers(users);
  render();
}

function editUser(i){
  const users=getUsers();
  const newUser=prompt("New username",users[i].username);
  const newKey=prompt("New key",users[i].key);
  if(newUser && newKey){
    users[i]={username:newUser,key:newKey};
    saveUsers(users);
    render();
  }
}

render();
</script>

</body>
</html>
