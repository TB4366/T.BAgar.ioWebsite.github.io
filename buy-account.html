<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agar.io Shop – B2 Orange UI</title>
<style>
    body {
        margin: 0;
        background: #181818;
        font-family: Arial, sans-serif;
        color: white;
        overflow-x: hidden;
    }
    .topbar {
        background: #ff7b00;
        padding: 15px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
    }
    .uid-box {
        width: 100%;
        padding: 15px;
        background: #222;
        display: flex;
        gap: 10px;
        justify-content: center;
    }
    .uid-box input {
        width: 280px;
        padding: 10px;
        border-radius: 6px;
        border: none;
        outline: none;
        font-size: 14px;
    }
    .uid-box button {
        background: #ff7b00;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        color: white;
    }
    .section-title {
        font-size: 20px;
        margin: 20px 0 10px 20px;
    }
    .carousel {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding: 15px 20px;
    }
    .item {
        background: #202020;
        width: 160px;
        border-radius: 10px;
        padding: 12px;
        text-align: center;
        cursor: pointer;
        border: 2px solid #ff7b00;
    }
    .item img {
        width: 90px;
        height: 90px;
        object-fit: contain;
    }
    .item .price {
        margin-top: 10px;
        background: #ff7b00;
        padding: 6px;
        border-radius: 5px;
        font-weight: bold;
    }
    /* Modal */
    .modal-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: none;
        justify-content: center;
        align-items: center;
    }
    .modal {
        background: #222;
        padding: 20px;
        border-radius: 12px;
        max-width: 350px;
        border: 2px solid #ff7b00;
        text-align: center;
    }
    .modal img {
        width: 130px;
    }
    .buy-btn {
        background: #ff7b00;
        padding: 12px 25px;
        border-radius: 8px;
        display: inline-block;
        cursor: pointer;
        margin-top: 10px;
        color: white;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="topbar">Agar.io Shop – Orange B2</div>

<div class="uid-box">
    <input id="uidInput" placeholder="Voer je Encoded UID in" />
    <button onclick="loadSkins()">Laad skins</button>
</div>

<div id="skinsContainer"></div>

<!-- Modal -->
<div class="modal-bg" id="modalBG" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <img id="modalImg" />
        <h2 id="modalName"></h2>
        <div class="price" id="modalPrice"></div>
        <div class="buy-btn" id="buyButton">Buy</div>
    </div>
</div>

<script>
const CONFIG_URL = "https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json";
let SKINS = [];
let CURRENT_SKIN = null;

async function loadSkins() {
    document.getElementById("skinsContainer").innerHTML = "<div class='section-title'>Loading...</div>";

    const res = await fetch(CONFIG_URL);
    const data = await res.json();

    SKINS = data.skins.skins;
    renderAllSkins();
}

function renderAllSkins() {
    let html = `<div class='section-title'>Alle Agar.io skins</div><div class='carousel'>`;

    SKINS.forEach(s => {
        const img = getSkinImage(s.id);
        html += `
        <div class='item' onclick="openSkin('${s.id}')">
            <img src="${img}" />
            <div class='price'>$?</div>
        </div>`;
    });

    html += `</div>`;

    document.getElementById("skinsContainer").innerHTML = html;
}

function getSkinImage(id) {
    return `https://configs-web.agario.miniclippt.com/live/v15/10850/skins/${id}.png`;
}

function openSkin(id) {
    CURRENT_SKIN = SKINS.find(s => s.id === id);

    document.getElementById("modalImg").src = getSkinImage(id);
    document.getElementById("modalName").innerText = CURRENT_SKIN.id;
    document.getElementById("modalPrice").innerText = "Original price: ?";

    document.getElementById("buyButton").onclick = () => buySkin(id);

    document.getElementById("modalBG").style.display = "flex";
}

function closeModal() {
    document.getElementById("modalBG").style.display = "none";
}

function buySkin(id) {
    const uid = document.getElementById("uidInput").value.trim();
    if (!uid) return alert("Vul eerst je UID in!");

    const url =
        `https://secure.xsolla.com/paystation3/desktop/list/?item_id=${id}&uid=${uid}&user_id=${uid}&user_external_id=${uid}`;

    window.open(url, "_blank");
}
</script>

</body>
</html>
