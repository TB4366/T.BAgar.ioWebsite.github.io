<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Special Deals — Agar.io Skin</title>
  <style>
    /* (zelfde CSS als in je vorige kaart) */
    body { font-family: Inter, Arial; background: #fff; padding: 24px; color: #222; }
    .panel { max-width: 980px; margin: 0 auto; }
    .header { font-size: 28px; margin-bottom: 12px; }
    .uid-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
    .uid-row input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; }

    .offer-card { border-radius: 6px; padding: 14px; }
    .offer-title { font-size: 26px; display: flex; justify-content: space-between; align-items: center; }
    .offer-title .price { font-size: 22px; font-weight: 700; }

    .offer-visual { background: #f28d2b; border-radius: 8px; padding: 16px; display: flex; align-items: center; gap: 14px; position: relative; }
    .coins-area { flex: 0 0 58%; display: flex; align-items: center; gap: 14px; }
    .coins-stack { width: 220px; height: 120px; background-size: contain; background-repeat: no-repeat; background-image: url('…'); }
    .coin-bubble { background: #fff; padding: 8px 12px; border-radius: 22px; font-weight: 700; }

    .plus { font-size: 64px; font-weight: 700; color: #ffd77a; }

    .skins-circle { flex: 0 0 120px; display: flex; gap: 8px; }
    .skin-circle { width: 84px; height: 84px; border-radius: 50%; overflow: hidden; border: 4px solid rgba(255,255,255,0.4); background: #fff; display: flex; align-items: center; justify-content: center; }
    .skin-circle img { width: 80px; height: 80px; object-fit: cover; }

    .buy-btn-overlay { position: absolute; left: 18px; bottom: 18px; background: #ff7f24; border-radius: 30px; padding: 8px 14px; color: #fff; border: none; cursor: pointer; font-weight:700; }

    .offer-info { background: #fff; border: 1px solid #e6e6e6; border-radius: 6px; padding: 10px; margin-top: 10px; }

    .controls { margin-top: 12px; display: flex; gap: 8px; }
    .controls select, .controls input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }

    .note { margin-top: 12px; background: #fff3d9; border-left: 4px solid #e6c08b; padding: 12px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">Special Deals</div>

    <div class="uid-row">
      <input id="encodedUid" type="text" placeholder="Encoded UID" />
    </div>

    <div class="offer-card">
      <div class="offer-title">
        <div class="title-left">Special Skin Pack</div>
        <div class="price" id="offerPrice">$5</div>
      </div>

      <div class="offer-visual">
        <div class="coins-area">
          <div style="flex:1">
            <div class="coins-stack" id="coinsImg"></div>
          </div>
          <div>
            <div class="coin-bubble" id="coinBubble">—</div>
          </div>
          <div class="plus">+</div>
          <div class="skins-circle">
            <div class="skin-circle"><img id="skin1" src="" /></div>
          </div>
        </div>
        <button class="buy-btn-overlay" id="buyOverlayBtn">Buy</button>
      </div>

      <div class="offer-info" id="offerInfoText">special_skin = 5 $</div>

      <div class="controls">
        <select id="currencySelect"><option>USD</option><option>EUR</option></select>
      </div>

      <div class="note">
        Om te kopen, moet je je echte speler-UID invullen.<br>
        Encoded UID: <span id="uidPreview" style="font-family:monospace;color:#0b6">(enter UID)</span>
      </div>
    </div>
  </div>

  <script>
    const XSOLLA_BASE = 'https://secure.xsolla.com/paystation3/desktop/list/';
    const XSOLLA_PARAMS = {
      access_token: 'ryolptUISLKE3SmWGBP9MQ05xHBvub5j_lc_en',
      preferences: 'eyJpdGVtUHJvbW90aW9ucyI6IltdIn0-',
      sessional: 'eyJoaXN0b3J5IjpbWyJzYXZlZG1ldGhvZCJdLFsibGlzdCIsdHJ1ZV1dfQ--'
    };

    // Jouw skin gegevens
    const mySkin = {
      id: 'skin_voidmaster',   // pas dit aan naar de juiste skin-id
      price: 5,
      xsollaItemId: 'skin_voidmaster_5usd',
      imageUrl: 'https://configs-web.agario.miniclippt.com/live/v15/10850/assets/skins/skin_voidmaster.png',
      name: 'Voidmaster'
    };

    // UI invul
    document.getElementById('skin1').src = mySkin.imageUrl;
    document.getElementById('offerPrice').textContent = mySkin.price + ' $';
    document.getElementById('offerInfoText').textContent = `${mySkin.id} = ${mySkin.price} $`;

    document.getElementById('buyOverlayBtn').addEventListener('click', () => {
      const uid = document.getElementById('encodedUid').value.trim();
      if (!uid) {
        alert('Voer eerst je Encoded UID in.');
        return;
      }
      const params = new URLSearchParams(XSOLLA_PARAMS);
      params.set('uid', uid);
      params.set('user_id', uid);
      params.set('user_external_id', uid);
      params.set('item_id', mySkin.xsollaItemId);

      const url = XSOLLA_BASE + '?' + params.toString();
      window.open(url, '_blank');
    });

    document.getElementById('encodedUid').addEventListener('input', (e) => {
      document.getElementById('uidPreview').textContent = e.target.value || '(enter UID)';
    });
  </script>
</body>
</html>
