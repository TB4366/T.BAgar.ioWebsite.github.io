<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paid Skins Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<style>
img{border-radius:9999px;object-fit:cover}
</style>
</head>

<body class="bg-gray-100">

<header class="bg-gray-900 text-white p-4 text-center text-xl font-bold">
  Paid Skins Admin Panel
</header>

<main class="max-w-6xl mx-auto p-6 grid md:grid-cols-2 gap-6">

<!-- ADD / EDIT -->
<section class="bg-white p-4 rounded shadow">
  <h2 class="font-bold text-lg mb-3">Add / Edit Skin</h2>

  <input id="nameEN" class="w-full border p-2 mb-2" placeholder="Name (EN)">
  <input id="nameNL" class="w-full border p-2 mb-2" placeholder="Name (NL)">

  <textarea id="descEN" class="w-full border p-2 mb-2" placeholder="Description (EN)"></textarea>
  <textarea id="descNL" class="w-full border p-2 mb-2" placeholder="Description (NL)"></textarea>

  <input id="price" type="number" step="0.01" class="w-full border p-2 mb-2" placeholder="Price">

  <input id="img1" class="w-full border p-2 mb-2" placeholder="Image 1 (required)">
  <input id="img2" class="w-full border p-2 mb-2" placeholder="Image 2 (optional)">

  <input id="sold" type="number" class="w-full border p-2 mb-2" placeholder="Sold count">

  <button onclick="saveSkin()" class="w-full bg-green-600 text-white py-2 rounded">
    Save Skin
  </button>

  <button onclick="resetForm()" class="w-full bg-gray-400 text-white py-2 rounded mt-2">
    Clear
  </button>
</section>

<!-- LIST -->
<section class="bg-white p-4 rounded shadow">
  <h2 class="font-bold text-lg mb-3">Skins</h2>
  <div id="list" class="space-y-3"></div>
</section>

</main>

<script>
let skins = JSON.parse(localStorage.getItem("skins") || "[]");
let editId = null;

function saveSkin(){
  const skin={
    id: editId ?? Date.now(),
    name:{en:nameEN.value,nl:nameNL.value},
    desc:{en:descEN.value,nl:descNL.value},
    price:parseFloat(price.value||0),
    image1:img1.value,
    image2:img2.value || null,
    sold:parseInt(sold.value||0)
  };

  if(!skin.image1){
    alert("Image 1 is required");
    return;
  }

  if(editId){
    skins = skins.map(s=>s.id===editId?skin:s);
  }else{
    skins.push(skin);
  }

  localStorage.setItem("skins",JSON.stringify(skins));
  resetForm();
  render();
}

function render(){
  list.innerHTML="";
  skins.forEach(s=>{
    const d=document.createElement("div");
    d.className="flex items-center justify-between border p-2 rounded";

    d.innerHTML=`
      <div class="flex items-center gap-3">
        <img src="${s.image1}" width="50" height="50">
        <div>
          <div class="font-bold">${s.name.en}</div>
          <div class="text-sm text-gray-500">$${s.price}</div>
        </div>
      </div>
      <div class="flex gap-2">
        <button class="bg-blue-500 text-white px-3 py-1 rounded" onclick="edit(${s.id})">Edit</button>
        <button class="bg-red-600 text-white px-3 py-1 rounded" onclick="remove(${s.id})">Delete</button>
      </div>
    `;
    list.appendChild(d);
  });
}

function edit(id){
  const s=skins.find(x=>x.id===id);
  editId=id;
  nameEN.value=s.name.en;
  nameNL.value=s.name.nl;
  descEN.value=s.desc.en;
  descNL.value=s.desc.nl;
  price.value=s.price;
  img1.value=s.image1;
  img2.value=s.image2||"";
  sold.value=s.sold;
}

function remove(id){
  if(confirm("Delete this skin?")){
    skins=skins.filter(s=>s.id!==id);
    localStorage.setItem("skins",JSON.stringify(skins));
    render();
  }
}

function resetForm(){
  editId=null;
  document.querySelectorAll("input,textarea").forEach(i=>i.value="");
}

render();
</script>

</body>
</html>
