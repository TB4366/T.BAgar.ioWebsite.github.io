<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Agar.io Shop + Xsolla</title>
</head>
<body>
  <h1>Agar.io Shop</h1>

  <div>
    <label for="agarUid">Voer je Agar.io UID in:</label>
    <input type="text" id="agarUid" placeholder="Bijv. 12345678" />
    <button id="saveUidBtn">Sla UID op</button>
  </div>

  <hr />

  <div id="productsContainer">
    <!-- Producten komen hier -->
    <p>Producten laden…</p>
  </div>

  <script>
    // De config URL die je gaf
    const configUrl = "https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json";

    // Globale variabelen
    let agarUid = null;
    let config = null;

    // Stap 1: laad config
    async function loadConfig() {
      try {
        const resp = await fetch(configUrl);
        if (!resp.ok) throw new Error("Kan config niet laden");
        config = await resp.json();
        console.log("Config geladen:", config);
        renderProducts();
      } catch (err) {
        console.error("Error bij laden config:", err);
        document.getElementById("productsContainer").innerText = "Fout bij laden producten.";
      }
    }

    // Stap 2: sla UID op
    document.getElementById("saveUidBtn").addEventListener("click", () => {
      const input = document.getElementById("agarUid").value.trim();
      if (!input) {
        alert("Voer een geldige UID in!");
        return;
      }
      agarUid = input;
      alert("UID opgeslagen: " + agarUid);
      // Optioneel: sla in localStorage
      localStorage.setItem("agarUid", agarUid);
    });

    // Stap 3: render producten op basis van config
    function renderProducts() {
      if (!config) return;

      const container = document.getElementById("productsContainer");
      container.innerHTML = ""; // leeg eerst

      // Stel: in config heb je iets als config.items of config.store
      // Hier moet je aanpassen op basis van hoe jouw GameConfiguration.json is opgebouwd
      const items = config.items || config.storeItems || config.shopItems;
      if (!items || !Array.isArray(items)) {
        container.innerText = "Geen producten gevonden in config.";
        return;
      }

      items.forEach(item => {
        // We nemen aan dat elk item een id, naam en prijs heeft in config
        const div = document.createElement("div");
        div.style.border = "1px solid #333";
        div.style.padding = "10px";
        div.style.margin = "5px";

        const name = document.createElement("h3");
        name.innerText = item.name || ("Product " + item.id);

        const desc = document.createElement("p");
        desc.innerText = item.description || "";

        const price = document.createElement("p");
        price.innerText = "Prijs: " + (item.price ? item.price : "n.v.t.");

        const buyBtn = document.createElement("button");
        buyBtn.innerText = "Koop";
        buyBtn.addEventListener("click", () => {
          if (!agarUid) {
            alert("Voer eerst je Agar.io UID in!");
            return;
          }
          openXsollaPayment(item);
        });

        div.appendChild(name);
        div.appendChild(desc);
        div.appendChild(price);
        div.appendChild(buyBtn);

        container.appendChild(div);
      });
    }

    // Stap 4: Xsolla integratie - open Pay Station
    function openXsollaPayment(item) {
      // Hier moet je van je backend een token opvragen dat je Xsolla gebruikt
      // Bijvoorbeeld: via fetch("/create_xsolla_token", { method: "POST", body: JSON.stringify({ agarUid, itemId: item.id }) })
      // Voor demo doen we alsof we de token al hebben:
      const accessToken = "JE_ACCESS_TOKEN_VAN_BACKEND";

      // Laad het Xsolla-widget script asynchroon
      const s = document.createElement("script");
      s.type = "text/javascript";
      s.async = true;
      s.src = "https://cdn.xsolla.net/payments-bucket-prod/embed/1.5.0/widget.min.js";
      s.addEventListener("load", () => {
        XPayStationWidget.init({
          access_token: accessToken,
          sandbox: true, // zet false als je live bent
          settings: {
            user: {
              id: {
                value: agarUid,
                hidden: true
              }
            },
            purchase: {
              virtual_currency: {
                // of purchase.checkout, afhankelijk hoe je Xsolla hebt ingesteld
                // Hieronder een voorbeeld met checkout
                checkout: {
                  external_id: item.id.toString()
                }
              }
            }
          }
        });

        // Open widget
        XPayStationWidget.open();
      });
      document.getElementsByTagName("head")[0].appendChild(s);
    }

    // Bij het laden van de pagina: check of we al een UID in localStorage hebben
    window.addEventListener("load", () => {
      const stored = localStorage.getItem("agarUid");
      if (stored) {
        agarUid = stored;
        document.getElementById("agarUid").value = agarUid;
      }
      loadConfig();
    });
  </script>
</body>
</html>
