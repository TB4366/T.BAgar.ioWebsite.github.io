<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>T.B Agario Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;

background:#ececec;

background-image:
linear-gradient(#d8d8d8 1px,transparent 1px),
linear-gradient(90deg,#d8d8d8 1px,transparent 1px);

background-size:40px 40px;
}

/* TOPBAR */

.topbar{

position:fixed;
top:0;
left:0;
right:0;

height:75px;

background:#18a8ff;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 20px;

color:white;

z-index:1000;
}

.logo{

display:flex;
align-items:center;

gap:10px;

font-size:30px;
font-weight:bold;
}

.cart{

font-size:35px;
cursor:pointer;
}

/* CENTER */

.center{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

text-align:center;
}

.center h1{

font-size:120px;
color:#666;
}

.play-buttons{

display:flex;
gap:20px;

margin-top:30px;
}

.classic{

width:300px;
height:160px;

background:#ff6a00;

border:none;

border-radius:20px;

font-size:50px;
font-weight:bold;

color:white;
}

.more{

width:300px;
height:160px;

background:#2081ff;

border:none;

border-radius:20px;

font-size:50px;
font-weight:bold;

color:white;
}

/* EVENT */

.event-banner{

position:absolute;

left:20px;
bottom:20px;

width:420px;
height:120px;

background:
linear-gradient(135deg,#5f00ff,#ff00c8);

border-radius:20px;

display:flex;
justify-content:center;
align-items:center;

font-size:38px;
font-weight:bold;

color:white;

cursor:pointer;
}

/* POPUPS */

.overlay{

display:none;

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.7);

justify-content:center;
align-items:center;
}

.modal{

width:95%;
max-width:1200px;

background:white;

border-radius:25px;

padding:25px;

position:relative;
}

.close{

position:absolute;

right:20px;
top:10px;

font-size:35px;

cursor:pointer;
color:red;
}

.skin-layout{

display:flex;
justify-content:space-between;
align-items:center;

gap:20px;
}

.arrow{

width:70px;
height:70px;

border:none;

border-radius:50%;

font-size:40px;

cursor:pointer;
}

.skin-preview{

text-align:center;
flex:1;
}

.skin-image{

width:250px;
height:250px;

object-fit:contain;
}

.skin-name{

font-size:45px;
margin-top:10px;
}

.ingredients{

width:320px;

background:#f4d48a;

padding:20px;

border-radius:20px;
}

.buy-btn{

width:100%;

height:80px;

background:#00d84d;

border:none;

border-radius:15px;

font-size:40px;

color:white;

font-weight:bold;

cursor:pointer;
}

</style>
</head>
<body>

<div class="topbar">

<div class="logo">

🧫 T.B Agario - Store

</div>

<div class="cart" onclick="openCart()">

🛒

</div>

</div>

<div class="center">

<h1>agar.io</h1>

<div class="play-buttons">

<button class="classic">
Classic
</button>

<button class="more">
More
</button>

</div>

</div>

<div
class="event-banner"
onclick="openStore()">

SKINS CAULDRON

</div>

<!-- STORE POPUP -->

<div
class="overlay"
id="storePopup">

<div class="modal">

<div
class="close"
onclick="closeStore()">

✖

</div>

<h1 style="text-align:center;">
SKINS CAULDRON
</h1>

<div class="skin-layout">

<button
class="arrow"
onclick="prevSkin()">

❮

</button>

<div class="skin-preview">

<img
id="skinImage"
class="skin-image">

<h2
id="skinName"
class="skin-name">

Gemclaw Skin

</h2>

</div>

<div class="ingredients">

<h2>Voordelen</h2>

<div id="skinBenefits">

</div>

<br>

<button
class="buy-btn"
onclick="startPurchase()">

€7.99

</button>

</div>

<button
class="arrow"
onclick="nextSkin()">

❯

</button>

</div>

</div>

</div><!-- WINKELWAGEN -->

<div
class="overlay"
id="cartPopup">

<div class="modal">

<div
class="close"
onclick="closeCart()">

✖

</div>

<h1 style="text-align:center;">

Jouw Winkelwagen

</h1>

<br>

<div id="cartItems">

Jouw winkelwagen is leeg.

</div>

<br>

<h2 id="cartTotal">

Totaal bedrag: €0.00

</h2>

<br>

<button
class="buy-btn"
onclick="checkout()">

Betalen

</button>

</div>

</div>

<!-- KASSABON -->

<div
class="overlay"
id="receiptPopup">

<div class="modal">

<h2>

1. Neem contact op via Instagram
@t.bagar.io

</h2>

<br>

<h3>

2. Download de kassabon en stuur
de afbeelding naar T.B

</h3>

<br>

<div id="receiptContent">

</div>

<br>

<button
class="buy-btn"
onclick="downloadReceipt()">

Download Kassabon

</button>

<br><br>

<button
class="buy-btn"
onclick="finishOrder()">

Okay

</button>

</div>

</div>

<script>

/* =====================
SKINS
===================== */

const skins = [

{
name:"Gemclaw Skin",

price:7.99,

image:"skins/gemclaw.png",

benefits:[
"🪙 10.500 Coins",
"🧬 780 DNA",
"⚡ 3x Mass Boost 24h"
]
},

{
name:"Shadow Dragon",

price:9.99,

image:"skins/shadowdragon.png",

benefits:[
"🪙 20.000 Coins",
"🧬 1500 DNA",
"⚡ 5x Mass Boost"
]
},

{
name:"Toxic Reaper",

price:12.99,

image:"skins/toxicreaper.png",

benefits:[
"🪙 35.000 Coins",
"🧬 3000 DNA",
"⚡ 10x Mass Boost"
]
},

{
name:"Crystal Beast",

price:14.99,

image:"skins/crystalbeast.png",

benefits:[
"🪙 50.000 Coins",
"🧬 4500 DNA",
"⚡ Premium Reward"
]
},

{
name:"Inferno King",

price:19.99,

image:"skins/infernoking.png",

benefits:[
"🪙 100.000 Coins",
"🧬 10.000 DNA",
"⚡ Ultimate Pack"
]
}

];

let currentSkin = 0;

let cart =
JSON.parse(
localStorage.getItem("tb_cart")
) || [];

/* =====================
LOAD SKIN
===================== */

function loadSkin(){

const skin =
skins[currentSkin];

document.getElementById(
"skinName"
).innerHTML =
skin.name;

document.getElementById(
"skinImage"
).src =
skin.image;

document.querySelector(
".buy-btn"
).innerHTML =
"€"+skin.price;

let html="";

skin.benefits.forEach(item=>{

html +=
"<p>"+item+"</p><br>";

});

document.getElementById(
"skinBenefits"
).innerHTML=
html;

}

/* =====================
ARROWS
===================== */

function nextSkin(){

currentSkin++;

if(
currentSkin >= skins.length
){

currentSkin=0;

}

loadSkin();

}

function prevSkin(){

currentSkin--;

if(
currentSkin < 0
){

currentSkin =
skins.length-1;

}

loadSkin();

}

/* =====================
POPUPS
===================== */

function openStore(){

document.getElementById(
"storePopup"
).style.display="flex";

loadSkin();

}

function closeStore(){

document.getElementById(
"storePopup"
).style.display="none";

}

function openCart(){

document.getElementById(
"cartPopup"
).style.display="flex";

renderCart();

}

function closeCart(){

document.getElementById(
"cartPopup"
).style.display="none";

}
  /* =====================
LOADING + KOPEN
===================== */

function startPurchase(){

const skin =
skins[currentSkin];

document.getElementById(
"skinBenefits"
).innerHTML=
`
<div style="
text-align:center;
font-size:40px;
font-weight:bold;
padding:50px;
">
Loading...
</div>
`;

setTimeout(()=>{

document.getElementById(
"skinBenefits"
).innerHTML=
`

<h2>
Wil je dit toevoegen aan je winkelwagen?
</h2>

<br>

<button
class="buy-btn"
onclick="confirmPurchase()">

Ja

</button>

<br><br>

<button
class="buy-btn"
style="background:red"
onclick="loadSkin()">

Nee

</button>

`;

},5000);

}

/* =====================
BEVESTIG KOPEN
===================== */

function confirmPurchase(){

document.getElementById(
"skinBenefits"
).innerHTML=
`
<div style="
text-align:center;
font-size:40px;
font-weight:bold;
padding:50px;
">
Loading...
</div>
`;

setTimeout(()=>{

const skin =
skins[currentSkin];

cart.push({

name:skin.name,

price:skin.price

});

saveCart();

document.getElementById(
"skinBenefits"
).innerHTML=
`

<h2>

Dit product is toegevoegd
aan jouw winkelwagen ✅

</h2>

<br>

<button
class="buy-btn"
onclick="loadSkin()">

OK

</button>

`;

},5000);

}

/* =====================
OPSLAAN
===================== */

function saveCart(){

localStorage.setItem(
"tb_cart",
JSON.stringify(cart)
);

}

/* =====================
WINKELWAGEN
===================== */

function renderCart(){

const items =
document.getElementById(
"cartItems"
);

if(cart.length===0){

items.innerHTML=
"Jouw winkelwagen is leeg.";

document.getElementById(
"cartTotal"
).innerHTML=
"Totaal bedrag: €0.00";

return;

}

let html="";
let total=0;

cart.forEach((item,index)=>{

total += item.price;

html +=
`

<div style="
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#f3f3f3;
border-radius:12px;
margin-bottom:10px;
">

<div>

<b>${item.name}</b>

<br>

€${item.price.toFixed(2)}

</div>

<button

onclick="removeItem(${index})"

style="
background:red;
color:white;
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
">

Verwijderen

</button>

</div>

`;

});

items.innerHTML=
html;

document.getElementById(
"cartTotal"
).innerHTML=
"Totaal bedrag: €"+
total.toFixed(2);

}

/* =====================
VERWIJDEREN
===================== */

function removeItem(index){

cart.splice(index,1);

saveCart();

renderCart();

}
  /* =====================
AFREKENEN
===================== */

function checkout(){

if(cart.length===0){

alert(
"Jouw winkelwagen is leeg."
);

return;

}

let total=0;

let receiptHTML=
`

<h2 style="text-align:center;">

T.B Agario Store

</h2>

<hr>

`;

cart.forEach(item=>{

total += item.price;

receiptHTML +=
`

<div style="
display:flex;
justify-content:space-between;
padding:10px 0;
">

<span>

${item.name}

</span>

<span>

€${item.price.toFixed(2)}

</span>

</div>

`;

});

receiptHTML +=
`

<hr>

<h2>

Totaal:
€${total.toFixed(2)}

</h2>

`;

document.getElementById(
"receiptContent"
).innerHTML=
receiptHTML;

document.getElementById(
"receiptPopup"
).style.display=
"flex";

}

/* =====================
DOWNLOAD KASSABON
===================== */

function downloadReceipt(){

const text =
document.getElementById(
"receiptContent"
).innerText;

const blob =
new Blob(
[text],
{type:"text/plain"}
);

const a =
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"TBAgario-Kassabon.txt";

a.click();

}

/* =====================
BESTELLING AFRONDEN
===================== */

function finishOrder(){

cart=[];

saveCart();

renderCart();

document.getElementById(
"receiptPopup"
).style.display=
"none";

document.getElementById(
"cartPopup"
).style.display=
"none";

alert(
"Bedankt voor je bestelling!"
);

}

/* =====================
SLUITEN BUITEN POPUP
===================== */

window.onclick=function(e){

const store =
document.getElementById(
"storePopup"
);

const cart =
document.getElementById(
"cartPopup"
);

const receipt =
document.getElementById(
"receiptPopup"
);

if(e.target===store){

store.style.display=
"none";

}

if(e.target===cart){

cart.style.display=
"none";

}

if(e.target===receipt){

receipt.style.display=
"none";

}

}

/* =====================
START
===================== */

loadSkin();

renderCart();
  </script>

</body>
</html>
