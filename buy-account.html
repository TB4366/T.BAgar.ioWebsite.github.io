<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Agar.io Skin Shop</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .skinCard {
      display: inline-block;
      width: 160px;
      border: 1px solid #444;
      background: #f2f2f2;
      padding: 10px;
      margin: 6px;
      border-radius: 8px;
      text-align: center;
    }
    .skinCard img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      display: block;
      margin: auto;
    }
  </style>
</head>
<body>

  <h1>Agar.io Skin Shop</h1>

  <label>Voer je Agar.io UID in:</label>
  <input type="text" id="uid" placeholder="Bijv. 123456789" />
  <button onclick="saveUID()">Sla UID op</button>

  <hr>

  <h2>Alle Skins</h2>
  <div id="skins">Skins laden...</div>

<script>

const CONFIG_URL = "https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json";
const BASE_URL = CONFIG_URL.substring(0, CONFIG_URL.lastIndexOf("/") + 1);

let USER_UID = null;

function saveUID() {
  const v = document.getElementById("uid").value.trim();
  if (!v) return alert("UID is leeg.");
  USER_UID = v;
  localStorage.setItem("agar_uid", v);
  alert("UID opgeslagen: " + v);
}

window.onload = async () => {

  // laad UID
  const saved = localStorage.getItem("agar_uid");
  if (saved) {
    USER_UID = saved;
    document.getElementById("uid").value = saved;
  }

  // laad skins
  try {
    const r = await fetch(CONFIG_URL);
    const data = await r.json();

    // Zoek skins array in de JSON
    const skins = findSkinsArray(data);

    if (!skins) {
      document.getElementById("skins").innerText = "Geen skin-sectie gevonden.";
      return;
    }

    displaySkins(skins);
  } 
  catch (e) {
    document.getElementById("skins").innerText = "Fout bij laden JSON.";
    console.error(e);
  }
};

// Automatische detectie van jouw skin-lijst
function findSkinsArray(json) {
  // 1. Zoek arrays met skinType == "premium"
  function scan(obj) {
    if (Array.isArray(obj)) {
      if (obj.length > 3 && obj[0].productId && obj[0].image) return obj;
    }
    if (typeof obj === "object") {
      for (let k in obj) {
        let f = scan(obj[k]);
        if (f) return f;
      }
    }
    return null;
  }
  return scan(json);
}

// Skins weergeven
function displaySkins(skins) {
  const container = document.getElementById("skins");
  container.innerHTML = "";

  skins.forEach(skin => {
    const div = document.createElement("div");
    div.className = "skinCard";

    // IMG
    const img = document.createElement("img");
    img.src = BASE_URL + skin.image;
    div.appendChild(img);

    // Titel
    const title = document.createElement("p");
    title.innerHTML = "<b>" + skin.productId + "</b>";
    div.appendChild(title);

    // Gameplay ID
    const gid = document.createElement("p");
    gid.innerText = "Gameplay ID: " + skin.gameplayId;
    div.appendChild(gid);

    // Koopknop
    const btn = document.createElement("button");
    btn.innerText = "Koop Skin";
    btn.onclick = () => buySkin(skin);
    div.appendChild(btn);

    container.appendChild(div);
  });
}

function buySkin(skin) {
  if (!USER_UID) return alert("Voer eerst je UID in!");

  alert("Skin kopen: " + skin.productId + "\nUID: " + USER_UID);

  // Hier plaats je later jouw Xsolla betaling
}

</script>

</body>
</html>
