<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Panel - T.B Agar.io</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
body { background:#f3f4f6; }
.header { background:#111827; color:white; padding:1rem; display:flex; justify-content:space-between; align-items:center; }
.search { flex:1; margin-left:1rem; }
.table-container { max-width:1200px; margin:2rem auto; background:white; border-radius:0.5rem; padding:1rem; }
.table { width:100%; border-collapse:collapse; }
.table th, .table td { padding:0.75rem; border-bottom:1px solid #e5e7eb; text-align:left; }
.button { padding:0.5rem 1rem; border-radius:0.375rem; cursor:pointer; }
.edit-input { width:100%; padding:0.25rem; border:1px solid #d1d5db; border-radius:0.25rem; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:50; }
.modal-content { background:white; padding:2rem; border-radius:0.5rem; width:400px; position:relative; }
.close { position:absolute; top:0.5rem; right:0.5rem; font-size:1.5rem; cursor:pointer; }
</style>
</head>
<body>

<header class="header">
  <h1 class="font-bold text-xl">Admin Panel - T.B Agar.io</h1>
  <input type="text" id="searchUser" placeholder="Zoek gebruiker..." class="search px-3 py-2 rounded">
</header>

<div class="table-container">
  <table class="table" id="usersTable">
    <thead>
      <tr>
        <th>Naam</th>
        <th>E-mail</th>
        <th>Agario UID</th>
        <th>Geld</th>
        <th>Acties</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- MODAL GEBRUIKER BEHEREN -->
<div class="modal hidden" id="userModal">
  <div class="modal-content">
    <span class="close" id="closeUserModal">&times;</span>
    <h2 class="font-bold text-xl mb-4">Gebruiker beheren</h2>
    <div>
      <label>Naam</label>
      <input type="text" id="editName" class="edit-input" disabled>
    </div>
    <div class="mt-2">
      <label>E-mail</label>
      <input type="email" id="editEmail" class="edit-input">
    </div>
    <div class="mt-2">
      <label>Agario UID</label>
      <input type="text" id="editUID" class="edit-input">
    </div>
    <div class="mt-2">
      <label>Wachtwoord</label>
      <input type="text" id="editPassword" class="edit-input">
    </div>
    <div class="mt-2">
      <label>Geld</label>
      <input type="number" id="editMoney" class="edit-input">
    </div>
    <div class="mt-4 flex justify-between">
      <button class="button bg-green-500 text-white" id="saveUser">Opslaan</button>
      <button class="button bg-blue-500 text-white" id="addMoney">Stort geld</button>
    </div>
  </div>
</div>

<script>
feather.replace();

// USERS ARRAY
let users = JSON.parse(localStorage.getItem("users") || "[]");

// SELECT ELEMENTEN
const usersTableBody = document.querySelector("#usersTable tbody");
const searchInput = document.getElementById("searchUser");
const userModal = document.getElementById("userModal");
const closeUserModal = document.getElementById("closeUserModal");
const editName = document.getElementById("editName");
const editEmail = document.getElementById("editEmail");
const editUID = document.getElementById("editUID");
const editPassword = document.getElementById("editPassword");
const editMoney = document.getElementById("editMoney");
const saveUser = document.getElementById("saveUser");
const addMoney = document.getElementById("addMoney");

let selectedUserIndex = null;

// RENDER USERS
function renderUsers(list){
  usersTableBody.innerHTML = "";
  list.forEach((u,i)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.name}</td>
      <td>${u.email}</td>
      <td>${u.uid}</td>
      <td>$${u.money.toFixed(2)}</td>
      <td><button class="button bg-gray-500 text-white manageBtn">Beheer</button></td>
    `;
    tr.querySelector(".manageBtn").onclick = ()=>openUserModal(i);
    usersTableBody.appendChild(tr);
  });
}

// OPEN MODAL
function openUserModal(index){
  selectedUserIndex = index;
  const u = users[index];
  editName.value = u.name;
  editEmail.value = u.email;
  editUID.value = u.uid;
  editPassword.value = u.password;
  editMoney.value = u.money;
  userModal.classList.remove("hidden");
}

// CLOSE MODAL
closeUserModal.onclick = ()=> userModal.classList.add("hidden");

// SAVE USER INFO
saveUser.onclick = ()=>{
  if(selectedUserIndex === null) return;
  const u = users[selectedUserIndex];
  u.email = editEmail.value.trim();
  u.uid = editUID.value.trim();
  u.password = editPassword.value;
  u.money = parseFloat(editMoney.value) || 0;
  localStorage.setItem("users",JSON.stringify(users));
  renderUsers(users);
  alert("Gebruiker bijgewerkt!");
}

// ADD MONEY
addMoney.onclick = ()=>{
  if(selectedUserIndex === null) return;
  let amount = parseFloat(prompt("Voer bedrag in om toe te voegen:"));
  if(isNaN(amount)) return alert("Ongeldig bedrag");
  users[selectedUserIndex].money += amount;
  localStorage.setItem("users",JSON.stringify(users));
  renderUsers(users);
  editMoney.value = users[selectedUserIndex].money;
  alert(`$${amount.toFixed(2)} toegevoegd!`);
}

// SEARCH
searchInput.oninput = e=>{
  const q = e.target.value.toLowerCase();
  renderUsers(users.filter(u=>u.name.toLowerCase().includes(q)));
}

// INIT
renderUsers(users);
</script>
</body>
</html>
