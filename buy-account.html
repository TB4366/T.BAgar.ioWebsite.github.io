<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Agar Style Menu</title>

<style>
body{
    margin:0;
    font-family:Arial;
    overflow:hidden;
    background:#f0f0f0;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

.menu{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    text-align:center;
}

.logo{
    font-size:60px;
    color:#555;
}

.nickname{
    padding:12px;
    width:250px;
    font-size:18px;
    margin:15px;
    border-radius:8px;
    border:1px solid #ccc;
}

.buttons{
    display:flex;
    gap:20px;
    justify-content:center;
}

.btn{
    border:none;
    padding:20px 40px;
    font-size:20px;
    border-radius:10px;
    cursor:pointer;
}

.orange{
    background:#ff6a00;
    color:white;
}

.blue{
    background:#2b6cff;
    color:white;
}

.small{
    margin-top:15px;
    background:#ff8c3a;
    color:white;
}
</style>

</head>

<body>

<canvas id="bg"></canvas>

<div class="menu">
<h1 class="logo">Agar.io</h1>

<input type="text" placeholder="Nickname" class="nickname">

<div class="buttons">
<button class="btn orange">Classic</button>
<button class="btn blue">More</button>
</div>

<button class="btn small">Start Big</button>
</div>

<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let dots=[];

for(let i=0;i<80;i++){
dots.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:3+Math.random()*5,
dx:(Math.random()-0.5)*1,
dy:(Math.random()-0.5)*1,
color:`hsl(${Math.random()*360},70%,60%)`
});
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

dots.forEach(d=>{
ctx.beginPath();
ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
ctx.fillStyle=d.color;
ctx.fill();

d.x+=d.dx;
d.y+=d.dy;

if(d.x<0||d.x>canvas.width) d.dx*=-1;
if(d.y<0||d.y>canvas.height) d.dy*=-1;
});

requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
