<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - T.B Agar.io</title>
<style>
body{margin:0; font-family:Arial, sans-serif; background:#111; color:#fff; padding:20px;}
h1{color:#ffbb55;}
label{display:block; margin-top:12px; font-weight:700;}
select, input[type=color]{margin-top:4px; padding:6px; border-radius:6px; border:none;}
button{margin-top:20px; padding:10px 18px; border:none; border-radius:8px; background:#ff6600; color:#120000; font-weight:700; cursor:pointer;}
.button-row{margin-top:12px;}
.background-preview{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;}
.bg-option{width:120px; height:70px; border:2px solid #fff; border-radius:6px; cursor:pointer; background-size:cover; background-position:center;}
.bg-selected{border:3px solid #ffbb55;}
</style>
</head>
<body>

<h1>Admin Panel - Homepagina Instellingen</h1>

<!-- Achtergrond instellen -->
<label>Achtergrond Thema</label>
<select id="themeSelect">
  <option value="">Geen thema (kleur kiezen)</option>
  <option value="zomer">Zomer</option>
  <option value="lente">Lente</option>
  <option value="herfst">Herfst</option>
  <option value="winter">Winter</option>
  <option value="halloween">Halloween</option>
  <option value="kerst">Kerst</option>
  <option value="pasen">Pasen</option>
  <option value="blackfriday">Black Friday</option>
</select>

<div class="background-preview" id="bgPreview"></div>

<label>Achtergrondkleur (als geen thema)</label>
<input type="color" id="bgColor">

<!-- Tekstkleur -->
<label>Tekstkleur</label>
<input type="color" id="textColor">

<!-- Figuren -->
<label>Figuren</label>
<select id="figuresSelect">
  <option value="off">Uit</option>
  <option value="on">Aan</option>
</select>

<div id="figureOptions" style="margin-top:8px; display:none;">
  <label>Selecteer thema voor figuren</label>
  <select id="figureTheme">
    <option value="zomer">Zomer</option>
    <option value="lente">Lente</option>
    <option value="herfst">Herfst</option>
    <option value="winter">Winter</option>
    <option value="halloween">Halloween</option>
    <option value="kerst">Kerst</option>
    <option value="pasen">Pasen</option>
    <option value="blackfriday">Black Friday</option>
  </select>
</div>

<button onclick="publishSettings()">Publiceren</button>

<script>
// Voorbeeldachtergronden per thema
const bgImages={
  zomer:["zomer1.jpg","zomer2.jpg"],
  lente:["lente1.jpg","lente2.jpg"],
  herfst:["herfst1.jpg","herfst2.jpg"],
  winter:["winter1.jpg","winter2.jpg"],
  halloween:["halloween1.jpg","halloween2.jpg"],
  kerst:["kerst1.jpg","kerst2.jpg"],
  pasen:["pasen1.jpg","pasen2.jpg"],
  blackfriday:["blackfriday1.jpg","blackfriday2.jpg"]
};

const themeSelect=document.getElementById('themeSelect');
const bgPreview=document.getElementById('bgPreview');
const bgColor=document.getElementById('bgColor');
const textColor=document.getElementById('textColor');
const figuresSelect=document.getElementById('figuresSelect');
const figureOptions=document.getElementById('figureOptions');
const figureTheme=document.getElementById('figureTheme');

// Update preview als thema geselecteerd
themeSelect.addEventListener('change',()=>{
  const val=themeSelect.value;
  bgPreview.innerHTML='';
  if(val && bgImages[val]){
    bgImages[val].forEach(src=>{
      const div=document.createElement('div');
      div.className='bg-option';
      div.style.backgroundImage=`url(${src})`;
      div.addEventListener('click',()=>{
        document.querySelectorAll('.bg-option').forEach(el=>el.classList.remove('bg-selected'));
        div.classList.add('bg-selected');
        div.dataset.selected='true';
      });
      bgPreview.appendChild(div);
    });
  }
});

// Figuren aan/uit
figuresSelect.addEventListener('change',()=>{
  figureOptions.style.display = figuresSelect.value==='on'?'block':'none';
});

// Publiceren
function publishSettings(){
  const selectedBgDiv = document.querySelector('.bg-option.bg-selected');
  const selectedBg = selectedBgDiv?selectedBgDiv.style.backgroundImage.slice(5,-2):'';
  const settings={
    theme:themeSelect.value || figureTheme.value,
    background:selectedBg || '',
    color:(!themeSelect.value)?bgColor.value:'',
    textColor:textColor.value,
    figures:figuresSelect.value
  };
  localStorage.setItem('siteSettings', JSON.stringify(settings));
  alert('Instellingen gepubliceerd! Ga naar de homepagina om ze te zien.');
}
</script>

</body>
</html>
