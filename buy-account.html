<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agar.io Skin Shop — Paid Skins</title>
  <style>
    body{font-family:Inter,Arial;background:#fff;padding:24px;color:#222}
    h1{font-size:28px;margin-bottom:18px}
    .panel{max-width:980px;margin:0 auto}
    .uid-row{display:flex;gap:12px;margin-bottom:16px}
    .uid-row input{flex:1;padding:12px;border:1px solid #ddd;border-radius:4px;font-family:monospace}
    .skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:20px}
    .skin{border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center}
    .skin img{width:130px;height:130px;object-fit:contain}
    .buy-btn{margin-top:8px;background:#f08b2d;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
    .tiny{font-size:13px;color:#666}
    .error{color:#b00020}
  </style>
</head>
<body>
<div class="panel">
  <h1>Paid Skins — Agar.io Shop</h1>

  <div class="uid-row">
    <input id="encodedUid" type="text" placeholder="GFRTIMZY..." />
  </div>

  <div>
    <input id="configUrl" type="text" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px" 
      value="https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json" />
    <button id="loadBtn" class="buy-btn" style="margin-top:10px">Laad betaalde skins</button>
  </div>

  <h2 style="margin-top:22px">Betaalde skins</h2>
  <div id="skinsContainer" class="skin-grid"></div>
  <div id="status" class="tiny" style="margin-top:12px"></div>
</div>

<script>
// === AUTO SHOP FOR ALL PAID MINICLIP SKINS ===
// Loads Miniclip config, extracts paid skins, displays them with correct prices, and assigns XSolla item IDs.

async function loadConfig(url){
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Config laden...';

  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();

    // Miniclip location of paid skins in GameConfiguration.json
    const shop = data?.shop?.offers ?? [];
    const skins = shop.filter(s => s.family === 'wallet_promo_skin');

    statusEl.textContent = `Betaalde skins gevonden: ${skins.length}`;
    return skins;
  }catch(e){
    document.getElementById('status').textContent = 'Fout bij laden: '+e.message;
    return [];
  }
}

// === AUTO XSOLLA ID GENERATOR ===
function convertToXsollaId(id){
  return id.toLowerCase().replace(/[^a-z0-9]+/g, '_');
}

function renderSkins(skins){
  const container = document.getElementById('skinsContainer');
  container.innerHTML = '';

  skins.forEach(s => {
    // image extraction
    let img = s.imageUrl || s.url || s.img || '';
    if(img.startsWith('//')) img = 'https:' + img;

    const xsollaItemId = convertToXsollaId(s.id);
    const priceUSD = s.currencyAmount || 5;

    const card = document.createElement('div');
    card.className = 'skin';

    const i = document.createElement('img');
    i.src = img;
    i.alt = s.id;

    const name = document.createElement('div');
    name.className = 'tiny';
    name.textContent = s.id;

    const btn = document.createElement('button');
    btn.className = 'buy-btn';
    btn.textContent = `Buy ($${priceUSD})`;

    btn.addEventListener('click', ()=>{
      const uid = document.getElementById('encodedUid').value.trim();
      if(!uid) return alert('Voer eerst je Encoded UID in');

      const payUrl = `https://secure.xsolla.com/paystation3/desktop/list/?access_token=ryol6nje1VCMIVwX232Zi4YsTToU8wim_lc_en&user[id]=${uid}&item_id=${xsollaItemId}`;
      window.open(payUrl, '_blank');
    });

    card.appendChild(i);
    card.appendChild(name);
    card.appendChild(btn);
    container.appendChild(card);
  });
}

document.getElementById('loadBtn').addEventListener('click', async () => {
  const url = document.getElementById('configUrl').value.trim();
  const skins = await loadConfig(url);
  renderSkins(skins);
});

window.addEventListener('load', async () => {
  const url = document.getElementById('configUrl').value;
  const skins = await loadConfig(url);
  renderSkins(skins);
});
</script>
</body>
</html>
