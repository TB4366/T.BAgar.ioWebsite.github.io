<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - T.B Agar.io</title>
<style>
body{margin:0; font-family:Arial, sans-serif; background:#111; color:#fff; padding:20px;}
h1{color:#ffbb55;}
label{display:block; margin-top:12px; font-weight:700;}
input, select, textarea{margin-top:4px; padding:6px; border-radius:6px; border:none; width:100%;}
button{margin-top:12px; padding:10px 18px; border:none; border-radius:8px; background:#ff6600; color:#120000; font-weight:700; cursor:pointer;}
.section{border:1px solid #444; padding:12px; margin-top:16px; border-radius:10px;}
.preview-skins, .preview-videos{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;}
.skin-item, .video-item{border:2px solid #fff; border-radius:6px; padding:6px; position:relative;}
.skin-item img{width:120px; height:120px; object-fit:cover; display:block;}
.remove-btn{position:absolute; top:2px; right:2px; background:red; color:#fff; border:none; cursor:pointer; border-radius:4px; padding:2px 6px; font-size:12px;}
.editor{border:1px solid #555; padding:12px; border-radius:8px; margin-top:8px; background:#222; min-height:200px;}
.editor *{color:#fff;}
</style>
</head>
<body>

<h1>Admin Panel - T.B Agar.io</h1>

<!-- Achtergrond & Figuren -->
<div class="section">
  <h2>Achtergrond & Figuren</h2>
  <label>Thema achtergrond</label>
  <select id="themeSelect">
    <option value="">Geen thema (kleur kiezen)</option>
    <option value="zomer">Zomer</option>
    <option value="lente">Lente</option>
    <option value="herfst">Herfst</option>
    <option value="winter">Winter</option>
    <option value="halloween">Halloween</option>
    <option value="kerst">Kerst</option>
    <option value="pasen">Pasen</option>
    <option value="blackfriday">Black Friday</option>
  </select>
  <div class="background-preview" id="bgPreview"></div>
  <label>Achtergrondkleur</label>
  <input type="color" id="bgColor">

  <label>Tekstkleur</label>
  <input type="color" id="textColor">

  <label>Figuren aan/uit</label>
  <select id="figuresSelect">
    <option value="off">Uit</option>
    <option value="on">Aan</option>
  </select>

  <div id="figureOptions" style="margin-top:8px; display:none;">
    <label>Selecteer thema voor figuren</label>
    <select id="figureTheme">
      <option value="zomer">Zomer</option>
      <option value="lente">Lente</option>
      <option value="herfst">Herfst</option>
      <option value="winter">Winter</option>
      <option value="halloween">Halloween</option>
      <option value="kerst">Kerst</option>
      <option value="pasen">Pasen</option>
      <option value="blackfriday">Black Friday</option>
    </select>
  </div>
</div>

<!-- Skins beheer -->
<div class="section">
  <h2>Skins beheren</h2>
  <label>Nieuwe skin link</label>
  <input type="text" id="newSkinLink" placeholder="Voer URL van de skin in">
  <button onclick="addSkin()">Voeg skin toe</button>
  <div class="preview-skins" id="skinsPreview"></div>
</div>

<!-- YouTube beheer -->
<div class="section">
  <h2>YouTube Video’s</h2>
  <label>Nieuwe video link</label>
  <input type="text" id="newVideoLink" placeholder="YouTube embed link">
  <button onclick="addVideo()">Voeg video toe</button>
  <div class="preview-videos" id="videosPreview"></div>
</div>

<!-- Live editor -->
<div class="section">
  <h2>Live website bewerken</h2>
  <div class="editor" id="liveEditor" contenteditable="true">
    <!-- Hier wordt de live content geladen -->
  </div>
  <button onclick="saveEditor()">Opslaan en homepagina bijwerken</button>
</div>

<script>
// Achtergrond & Figuren
const bgImages={
  zomer:["zomer1.jpg","zomer2.jpg"],
  lente:["lente1.jpg","lente2.jpg"],
  herfst:["herfst1.jpg","herfst2.jpg"],
  winter:["winter1.jpg","winter2.jpg"],
  halloween:["halloween1.jpg","halloween2.jpg"],
  kerst:["kerst1.jpg","kerst2.jpg"],
  pasen:["pasen1.jpg","pasen2.jpg"],
  blackfriday:["blackfriday1.jpg","blackfriday2.jpg"]
};

const themeSelect=document.getElementById('themeSelect');
const bgPreview=document.getElementById('bgPreview');
const bgColor=document.getElementById('bgColor');
const textColor=document.getElementById('textColor');
const figuresSelect=document.getElementById('figuresSelect');
const figureOptions=document.getElementById('figureOptions');
const figureTheme=document.getElementById('figureTheme');

themeSelect.addEventListener('change',()=>{
  const val=themeSelect.value;
  bgPreview.innerHTML='';
  if(val && bgImages[val]){
    bgImages[val].forEach(src=>{
      const div=document.createElement('div');
      div.className='bg-option';
      div.style.backgroundImage=`url(${src})`;
      div.addEventListener('click',()=>{
        document.querySelectorAll('.bg-option').forEach(el=>el.classList.remove('bg-selected'));
        div.classList.add('bg-selected');
      });
      bgPreview.appendChild(div);
    });
  }
});

figuresSelect.addEventListener('change',()=>{figureOptions.style.display = figuresSelect.value==='on'?'block':'none';});

// Skins
let skins = JSON.parse(localStorage.getItem('skins')) || [];
const skinsPreview=document.getElementById('skinsPreview');
function renderSkins(){
  skinsPreview.innerHTML='';
  skins.forEach((link,i)=>{
    const div=document.createElement('div');
    div.className='skin-item';
    const img=document.createElement('img');
    img.src=link;
    div.appendChild(img);
    const btn=document.createElement('button');
    btn.textContent='X';
    btn.className='remove-btn';
    btn.onclick=()=>{skins.splice(i,1); renderSkins();}
    div.appendChild(btn);
    skinsPreview.appendChild(div);
  });
}
function addSkin(){
  const link=document.getElementById('newSkinLink').value;
  if(link){skins.push(link); renderSkins(); document.getElementById('newSkinLink').value='';}
}
renderSkins();

// YouTube
let videos = JSON.parse(localStorage.getItem('videos')) || [];
const videosPreview=document.getElementById('videosPreview');
function renderVideos(){
  videosPreview.innerHTML='';
  videos.forEach((link,i)=>{
    const div=document.createElement('div');
    div.className='video-item';
    div.textContent=link;
    const btn=document.createElement('button');
    btn.textContent='X';
    btn.className='remove-btn';
    btn.onclick=()=>{videos.splice(i,1); renderVideos();}
    div.appendChild(btn);
    videosPreview.appendChild(div);
  });
}
function addVideo(){
  const link=document.getElementById('newVideoLink').value;
  if(link){videos.push(link); renderVideos(); document.getElementById('newVideoLink').value='';}
}
renderVideos();

// Live editor
const liveEditor=document.getElementById('liveEditor');
liveEditor.innerHTML = localStorage.getItem('homeContent') || '<p>Bewerk hier de homepagina content...</p>';
function saveEditor(){
  const settings={
    theme:themeSelect.value,
    background:document.querySelector('.bg-option.bg-selected')?.style.backgroundImage || '',
    bgColor:bgColor.value,
    textColor:textColor.value,
    figures:figuresSelect.value,
    figureTheme:figureTheme.value
  };
  localStorage.setItem('siteSettings',JSON.stringify(settings));
  localStorage.setItem('skins',JSON.stringify(skins));
  localStorage.setItem('videos',JSON.stringify(videos));
  localStorage.setItem('homeContent',liveEditor.innerHTML);
  alert('Homepagina instellingen en content opgeslagen!');
}
</script>

</body>
</html>
