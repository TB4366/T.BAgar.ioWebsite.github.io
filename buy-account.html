<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel – Website Editor</title>
<style>
  body{margin:0;font-family:Arial;background:#111;color:#fff}
  .wrap{max-width:1100px;margin:auto;padding:20px}
  h1{color:#ffae42;margin:0}
  .panel{background:#181818;border:1px solid #333;padding:15px;border-radius:10px;margin-top:15px}
  .btn{background:#ff6600;color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
  .btn.danger{background:#b11111}
  .btn.secondary{background:#333}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #editor{min-height:260px;border:1px dashed #444;border-radius:8px;background:#0e0e0e;padding:10px;margin-top:10px}
  .block{background:#0c0c0c;border:1px solid #222;padding:10px;margin:8px 0;border-radius:8px;position:relative}
  .toolbar{position:absolute;top:6px;right:6px;display:flex;gap:6px}
  .toolbar button{padding:4px 6px;font-size:12px}
  #preview{background:#00000022;border-radius:10px;min-height:180px;padding:15px;margin-top:10px}
  label{display:block;margin:6px 0}
  input,select{width:100%;padding:8px;border-radius:6px;border:1px solid #333;background:#0c0c0c;color:white}
</style>
</head>
<body>
<div class="wrap">

<h1>Admin Website Editor</h1>

<!-- ADD ITEMS -->
<div class="panel">
  <h3>Inhoud toevoegen</h3>
  <div class="controls">
    <button class="btn" onclick="addBlock('h2')">+ Titel</button>
    <button class="btn" onclick="addBlock('p')">+ Tekst</button>
    <button class="btn" id="imgBtn">+ Afbeelding</button>
    <button class="btn" onclick="addVideo()">+ Video</button>
    <button class="btn" onclick="addLink()">+ Link</button>
    <button class="btn" onclick="addHR()">+ Lijn</button>
    <button class="btn secondary" onclick="clearAll()">🧹 Alles wissen</button>
    <button class="btn" onclick="saveContent()">💾 Opslaan</button>
  </div>

  <div id="editor"></div>
</div>

<!-- SETTINGS -->
<div class="panel">
  <h3>Achtergrond & Thema</h3>
  <label>Kleur</label>
  <input type="color" id="bgColor">
  <label>Achtergrond afbeelding (URL)</label>
  <input type="text" id="bgImage" placeholder="https://...">

  <label>Zwevende figuren</label>
  <select id="theme">
    <option value="none">Geen</option>
    <option value="zomer">Zomer</option>
    <option value="lente">Lente</option>
    <option value="herfst">Herfst</option>
    <option value="winter">Winter</option>
    <option value="halloween">Halloween</option>
    <option value="kerst">Kerst</option>
    <option value="pasen">Pasen</option>
    <option value="oudnieuw">Oud & Nieuw</option>
  </select>

  <button class="btn" style="margin-top:10px" onclick="saveSettings()">Instellingen opslaan</button>
</div>

<!-- PREVIEW -->
<div class="panel">
  <h3>Preview</h3>
  <div id="preview"></div>
</div>

</div>

<input type="file" id="imgPicker" accept="image/*" style="display:none">

<script>
/* ====================================================
   LOAD CONTENT
==================================================== */
const editor = document.getElementById('editor');

function loadContent(){
  const saved = localStorage.getItem('homeContent') || '';
  editor.innerHTML = '';

  if(saved.trim() !== ''){
    const temp = document.createElement('div');
    temp.innerHTML = saved;

    [...temp.childNodes].forEach(n => createBlock(n.outerHTML || n.textContent));
  } else {
    addBlock('h2','Welkom op de site!');
  }

  updatePreview();
}

/* ====================================================
   CREATE BLOCK + CONTROLS
==================================================== */
function createBlock(html){
  const block = document.createElement('div');
  block.className = 'block';
  block.innerHTML = html;

  const bar = document.createElement('div');
  bar.className = 'toolbar';

  const del = document.createElement('button');
  del.className = 'btn danger';
  del.textContent = 'X';
  del.onclick = () => { block.remove(); saveContent(); };

  bar.appendChild(del);
  block.prepend(bar);

  editor.appendChild(block);
}

/* ====================================================
   ADD BLOCK TYPES
==================================================== */
function addBlock(type, txt){
  if(type === 'h2') createBlock(`<h2 contenteditable="true">${txt||'Nieuwe Titel'}</h2>`);
  if(type === 'p') createBlock(`<p contenteditable="true">${txt||'Nieuwe tekst...'}</p>`);
  if(type === 'hr') createBlock(`<hr>`);
  saveContent();
}

/* IMAGE */
document.getElementById('imgBtn').onclick = () => document.getElementById('imgPicker').click();
document.getElementById('imgPicker').onchange = e => {
  const file = e.target.files[0];
  const r = new FileReader();
  r.onload = () => createBlock(`<img src="${r.result}" style="max-width:100%;border-radius:10px">`);
  r.readAsDataURL(file);
  saveContent();
};

/* VIDEO */
function addVideo(){
  const url = prompt('YouTube link:');
  if(!url) return;
  const embed = url.replace('watch?v=','embed/').replace('youtu.be/','youtube.com/embed/');
  createBlock(`<iframe width="560" height="315" src="${embed}" allowfullscreen></iframe>`);
  saveContent();
}

/* LINK */
function addLink(){
  const t = prompt('Tekst:');
  const u = prompt('URL:');
  if(!t||!u) return;
  createBlock(`<a href="${u}" target="_blank" style="color:#ffae42">${t}</a>`);
  saveContent();
}

/* CLEAR */
function clearAll(){
  if(confirm('Alles verwijderen?')){
    editor.innerHTML = '';
    saveContent();
  }
}

/* ====================================================
   SAVE
==================================================== */
function saveContent(){
  const html = [...editor.children].map(b=>{
    let copy = b.cloneNode(true);
    copy.querySelector('.toolbar')?.remove();
    return copy.innerHTML;
  }).join('\n');

  localStorage.setItem('homeContent', html);
  updatePreview();
}

/* ====================================================
   SETTINGS
==================================================== */
function saveSettings(){
  const st = {
    bgColor: document.getElementById('bgColor').value,
    bgImage: document.getElementById('bgImage').value,
    theme: document.getElementById('theme').value
  };
  localStorage.setItem('siteSettings', JSON.stringify(st));
  updatePreview();
  alert('Instellingen opgeslagen!');
}

function loadSettings(){
  const st = JSON.parse(localStorage.getItem('siteSettings')||'{}');
  if(st.bgColor) document.getElementById('bgColor').value = st.bgColor;
  if(st.bgImage) document.getElementById('bgImage').value = st.bgImage;
  if(st.theme) document.getElementById('theme').value = st.theme;
}

/* ====================================================
   PREVIEW
==================================================== */
function updatePreview(){
  const html = localStorage.getItem('homeContent') || '';
  const st = JSON.parse(localStorage.getItem('siteSettings')||'{}');
  const p = document.getElementById('preview');

  p.innerHTML = html;
  p.style.backgroundColor = st.bgColor || '';
  p.style.backgroundImage = st.bgImage ? `url(${st.bgImage})` : '';
}

/* ====================================================
   INIT
==================================================== */
loadSettings();
loadContent();
</script>

</body>
</html>
