<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Agar.io Special Deals</title>
<style>
    body {
        background: #111;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        padding-top: 40px;
        color: #000;
    }

    .window {
        width: 420px;
        background: #fff;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .title {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    input[type=text] {
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 6px;
        border: 1px solid #bbb;
        font-size: 14px;
    }

    label {
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
    }

    select {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        font-size: 14px;
        border: 1px solid #aaa;
        margin-bottom: 15px;
    }

    .card {
        background: #FF8E00;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
        color: #fff;
        margin-bottom: 20px;
        cursor: pointer;
        position: relative;
    }
    .card:hover {
        opacity: 0.9;
    }

    .buy-button {
        display: block;
        width: 100%;
        padding: 13px;
        font-size: 17px;
        border: none;
        border-radius: 10px;
        background: #6e3eff;
        color: #fff;
        cursor: pointer;
        font-weight: bold;
    }
    .buy-button:hover {
        background: #532ed0;
    }

    .warning-box {
        background: #fff9d6;
        border: 1px solid #f2e79e;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        margin-top: 15px;
    }
</style>
</head>

<body>

<div class="window">
    <div class="title">Special Deals</div>

    <!-- UID invoerveld -->
    <input type="text" id="uid" placeholder="%3D">

    <label>
        <input type="checkbox" id="frienduid">
        Friend Encoded UID
    </label>

    <!-- Select menu EXACT zoals screenshot -->
    <select id="productSelect">
        <option value="125000">125000_coins = 99.99 $</option>
        <option value="30000">30000_coins_1_skin_blue_swirl = 9.99 $</option>
        <option value="16000">16000_coins_1_skin_blue_swirl = 4.99 $</option>
        <option value="3250">3250_coins_1_skin_king_lion = 1.99 $</option>
        <option value="7000">7000_coins_1_skin_zodiac_2017_libra = 4.99 $</option>
        <option value="1800">1800_dna_1_skin_special = 1.99 $</option>
    </select>

    <!-- OFFER KAART -->
    <div class="card" onclick="openXsolla()">
        <div style="font-size: 35px;">💰 + 🎁</div>
        <div style="margin-top: 10px; font-size: 20px;">Klik om te kopen</div>
    </div>

    <!-- Betaal knop -->
    <button class="buy-button" onclick="openXsolla()">Koop nu</button>

    <!-- Config link info -->
    <div class="warning-box">
        Om aankoop te doen moet je ingelogd zijn.<br>
        Config geladen van:<br>
        <b>https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json</b><br><br>
        Encoded UID wordt gebruikt om de skin aan jouw account toe te voegen.
    </div>
</div>

<script>
function openXsolla() {
    const uid = document.getElementById("uid").value.trim();
    if (!uid) {
        alert("Voer eerst je UID in!");
        return;
    }

    // “Open nieuw venster + toestaan popup” EXACT zoals op iPad
    window.open("https://secure.xsolla.com/paystation3/", "_blank");
}
</script>

</body>
</html>
