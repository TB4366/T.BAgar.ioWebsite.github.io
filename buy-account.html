<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Control</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,Arial,sans-serif;background:#0b0d12;color:#f5f7fb;
  min-height:100vh;display:flex;justify-content:center;padding:28px 14px
}
.panel{width:min(760px,100%);background:#11151d;border:1px solid #242b38;border-radius:18px;box-shadow:0 18px 60px #0008;overflow:hidden}
.header{padding:22px 24px;border-bottom:1px solid #252c38;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}.status{font-size:12px;color:#8993a5}
.content{padding:22px}
.section{margin-bottom:22px}
.section h2{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:#8f9aae;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field{background:#171c25;border:1px solid #293140;border-radius:11px;padding:10px}
label{display:block;font-size:11px;color:#8993a5;margin-bottom:7px}
input,select{
  width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:14px
}
select option{background:#171c25}
.row{display:flex;gap:10px}
.row>*{flex:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
button{
  border:0;border-radius:11px;padding:14px;font-weight:800;font-size:14px;cursor:pointer;
  transition:.15s transform,.15s opacity
}
button:active{transform:scale(.98)}
.start{background:#2fbe72;color:#06140c}.stop{background:#e24b55;color:#fff}
.secondary{background:#202733;color:#dfe5ef;border:1px solid #303949}
.message{margin-top:14px;padding:12px;border-radius:10px;background:#171c25;color:#aeb8c9;font-size:13px;min-height:42px}
.switch{display:flex;align-items:center;gap:10px;color:#c8cfdb;font-size:13px}
.switch input{width:auto}
@media(max-width:560px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.header{padding:18px}.content{padding:16px}}
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <div><h1>BOT CONTROL</h1><div class="status" id="status">Ready</div></div>
    <div>🤖</div>
  </div>

  <div class="content">
    <div class="section">
      <h2>Account</h2>
      <div class="grid">
        <div class="field">
          <label>UID</label>
          <input id="uid" placeholder="Enter UID" autocomplete="off">
        </div>
        <div class="field">
          <label>Token</label>
          <input id="token" type="password" placeholder="Enter your token" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Game Settings</h2>
      <div class="grid">
        <div class="field">
          <label>REGION</label>
          <select id="region">
            <option>Europe</option><option>North America</option><option>South America</option>
            <option>Asia</option><option>Oceania</option>
          </select>
        </div>
        <div class="field">
          <label>GAME MODE</label>
          <select id="mode"><option>Classic</option><option>Burst</option></select>
        </div>
        <div class="field">
          <label>BOT NAME</label>
          <input id="name" placeholder="Bot">
        </div>
        <div class="field">
          <label>PARTY</label>
          <input id="party" placeholder="Party code">
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Bot Settings</h2>
      <div class="grid">
        <div class="field">
          <label>BOT COUNT</label>
          <input id="count" type="number" min="1" max="500" value="10">
        </div>
        <div class="field">
          <label>BOT MODE</label>
          <select id="botsMode">
            <option>Farm</option><option>Track</option><option>Virus Shooter</option><option>Helper</option>
          </select>
        </div>
        <div class="field">
          <label>TARGET UID</label>
          <input id="targetUid" placeholder="Optional target UID">
        </div>
        <div class="field">
          <label>SPEED</label>
          <input id="speed" type="number" min="1" max="100" value="50">
        </div>
      </div>
      <div style="margin-top:12px" class="switch">
        <input id="ignoreViruses" type="checkbox">
        <span>Ignore viruses</span>
      </div>
    </div>

    <div class="actions">
      <button class="start" id="start">START BOTS</button>
      <button class="stop" id="stop">STOP BOTS</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="secondary" id="save">SAVE SETTINGS</button>
      <button class="secondary" id="reset">RESET</button>
    </div>

    <div class="message" id="message">No bot process is running.</div>
  </div>
</div>

<script>
const ids = ["uid","token","region","mode","name","party","count","botsMode","targetUid","speed","ignoreViruses"];
const $ = id => document.getElementById(id);

function getSettings(){
  const s={};
  ids.forEach(id => s[id] = $(id).type === "checkbox" ? $(id).checked : $(id).value);
  return s;
}
function setSettings(s){
  ids.forEach(id=>{
    if(s[id] !== undefined){
      if($(id).type === "checkbox") $(id).checked = !!s[id];
      else $(id).value = s[id];
    }
  });
}
function save(){
  localStorage.setItem("botControlSettings", JSON.stringify(getSettings()));
  $("message").textContent="Settings saved locally.";
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem("botControlSettings")||"null");
    if(s) setSettings(s);
  }catch(e){}
}
function setRunning(r){
  $("status").textContent=r?"Running":"Stopped";
  $("status").style.color=r?"#55d98b":"#e24b55";
  $("message").textContent=r
    ? "Bot configuration loaded. This standalone HTML interface is ready."
    : "Bots stopped.";
}
$("save").onclick=save;
$("reset").onclick=()=>{
  localStorage.removeItem("botControlSettings");
  location.reload();
};
$("start").onclick=()=>{
  const s=getSettings();
  if(!s.uid){$("message").textContent="Enter a UID first.";return;}
  if(!s.token){$("message").textContent="Enter your token first.";return;}
  if(!s.party){$("message").textContent="Enter a party code first.";return;}
  save();
  setRunning(true);
};
$("stop").onclick=()=>setRunning(false);
$("botsMode").onchange=()=>{
  $("message").textContent="Bot mode changed to: "+$("botsMode").value;
};
load();
</script>
</body>
</html>
