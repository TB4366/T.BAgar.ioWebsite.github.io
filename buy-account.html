<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>T.B Agar.io VIP</title>
<style>
body { font-family: Arial; background:#111; color:#fff; margin:0; }
header { display:flex; align-items:center; gap:15px; background:#1e1e1e; padding:15px; }
header img { height:40px; }
h1 { font-size:20px; margin:0; }
main { padding:20px; max-width:1200px; margin:auto; }
hr { margin:25px 0; border:0; border-top:1px solid #333; }
input, button { width:100%; padding:10px; margin-top:10px; border-radius:5px; border:none; }
button { background:#00c853; color:#000; font-weight:bold; cursor:pointer; }
button:hover { background:#00e676; }
.tabs { display:flex; gap:10px; margin-top:10px; }
.tab { flex:1; text-align:center; padding:10px; background:#222; cursor:pointer; border-radius:6px; }
.tab.active { background:#00c853; color:#000; }
.items { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:15px; margin-top:15px; }
.item { background:#222; padding:10px; text-align:center; border-radius:8px; cursor:pointer; border:2px solid transparent; }
.item.selected { border-color:#00c853; }
.note { font-size:12px; color:#aaa; margin-top:10px; }
</style>
</head>
<body>
<header>
<img src="https://agar.io/favicon.ico" alt="Agar.io" />
<h1>T.B Agar.io VIP</h1>
</header>
<main>
<h2>AGAR.IO PAID SKINS OFFICIEEL</h2>
<hr />
<label>Vul je UID in</label>
<input id="uid" placeholder="Bijv. 123456789" />

<div class="tabs">
  <div class="tab active" data-type="skins">Skins</div>
  <div class="tab" data-type="emoji">Emoji</div>
</div>

<div id="items" class="items"></div>
<button onclick="betalen()">Betalen</button>
<div class="note">Betaling verloopt veilig via Xsolla</div>

<script>
let catalog = { skins: [], emoji: [] };
let selectedItem = null;
let currentType = 'skins';

// Catalog ophalen van officiële Agar.io config
async function loadCatalog() {
    try {
        const res = await fetch('https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json');
        const data = await res.json();
        const skinsSet = new Set();
        const emojiSet = new Set();

        // Door alle shopItems lopen
        if(data.shopItems){
            data.shopItems.forEach(item => {
                if(item.productId){
                    if(item.productId.startsWith('skin_')) skinsSet.add(item.productId);
                    if(item.productId.startsWith('emoji_')) emojiSet.add(item.productId);
                }
            });
        }

        catalog.skins = Array.from(skinsSet).sort();
        catalog.emoji = Array.from(emojiSet).sort();
        render();
    } catch(err){
        console.error('Kon catalog niet laden:', err);
        document.getElementById('items').innerHTML = '<p>Kon catalogus niet laden</p>';
    }
}

// Render grid
function render() {
    const wrap = document.getElementById('items');
    wrap.innerHTML='';
    selectedItem=null;
    catalog[currentType].forEach(it=>{
        const d = document.createElement('div');
        d.className='item';
        d.innerText=it.replace(currentType+'_','').replace(/_/g,' ');
        d.title=it;
        d.onclick=()=>{
            document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));
            d.classList.add('selected');
            selectedItem=it;
        };
        wrap.appendChild(d);
    });
}

// Tab switching
document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        currentType=t.dataset.type;
        render();
    };
});

// Betalen knop
async function betalen(){
    const uid = document.getElementById('uid').value.trim();
    if(!uid || !selectedItem){ alert('Vul UID in en selecteer een item'); return; }

    try {
        const res = await fetch('/create-payment',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({ uid, item:selectedItem })
        });
        const data = await res.json();
        if(data.paymentUrl) window.location.href = data.paymentUrl;
        else alert('Fout bij aanmaken betaling');
    } catch(e){ console.error(e); alert('Serverfout'); }
}

loadCatalog();
</script>
</main>
</body>
</html>
