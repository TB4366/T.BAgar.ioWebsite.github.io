<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Achtergrond & Figuren</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    padding: 20px;
  }
  h1 {
    color: #ffae42;
    text-shadow: 0 0 8px #ff6600;
  }
  select, button {
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
  }
  button {
    background: #ff6600;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover {
    background: #ff8c1a;
  }
  .preview {
    display: flex;
    gap: 15px;
    margin-top: 10px;
  }
  .preview img {
    width: 180px;
    height: 100px;
    border-radius: 8px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.3s, border-color 0.3s;
  }
  .preview img:hover {
    transform: scale(1.05);
  }
  .preview img.selected {
    border-color: #ff6600;
  }
  .figuren-sectie {
    margin-top: 30px;
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 10px;
  }
</style>
</head>
<body>

<h1>🌄 Admin Paneel – Achtergrond & Figuren</h1>

<label for="themeSelect">Kies een seizoen of feestdag:</label><br>
<select id="themeSelect">
  <option value="">-- Kies thema --</option>
  <option value="zomer">☀️ Zomer</option>
  <option value="herfst">🍂 Herfst</option>
  <option value="winter">❄️ Winter</option>
  <option value="lente">🌸 Lente</option>
  <option value="halloween">🎃 Halloween</option>
  <option value="kerst">🎄 Kerst</option>
  <option value="pasen">🐣 Pasen</option>
  <option value="blackfriday">🛍️ Black Friday</option>
  <option value="nieuwjaar">🎆 Oud & Nieuw</option>
</select>

<div id="backgroundPreview" class="preview"></div>

<div class="figuren-sectie">
  <h3>🎈 Figuren</h3>
  <label><input type="checkbox" id="figurenToggle"> Figuren inschakelen</label>
  <div id="figurenThema" style="display:none; margin-top:10px;">
    <label for="figurenSelect">Kies figuren-thema:</label><br>
    <select id="figurenSelect">
      <option value="zomer">☀️ Zomer</option>
      <option value="herfst">🍂 Herfst</option>
      <option value="winter">❄️ Winter</option>
      <option value="lente">🌸 Lente</option>
      <option value="halloween">🎃 Halloween</option>
      <option value="kerst">🎄 Kerst</option>
      <option value="pasen">🐣 Pasen</option>
      <option value="blackfriday">🛍️ Black Friday</option>
      <option value="nieuwjaar">🎆 Oud & Nieuw</option>
    </select>
  </div>
</div>

<br><button onclick="publiceer()">✅ Publiceren</button>

<script>
const themeSelect = document.getElementById("themeSelect");
const previewDiv = document.getElementById("backgroundPreview");
const figurenToggle = document.getElementById("figurenToggle");
const figurenThemaDiv = document.getElementById("figurenThema");
const figurenSelect = document.getElementById("figurenSelect");

// Achtergrondvoorbeelden per thema
const achtergrondOpties = {
  zomer: ["images/zomer1.jpg","images/zomer2.jpg"],
  herfst: ["images/herfst1.jpg","images/herfst2.jpg"],
  winter: ["images/winter1.jpg","images/winter2.jpg"],
  lente: ["images/lente1.jpg","images/lente2.jpg"],
  halloween: ["images/halloween1.jpg","images/halloween2.jpg"],
  kerst: ["images/kerst1.jpg","images/kerst2.jpg"],
  pasen: ["images/pasen1.jpg","images/pasen2.jpg"],
  blackfriday: ["images/blackfriday1.jpg","images/blackfriday2.jpg"],
  nieuwjaar: ["images/nieuwjaar1.jpg","images/nieuwjaar2.jpg"]
};

let geselecteerdeAchtergrond = null;

// Achtergrond previews tonen
themeSelect.addEventListener("change", () => {
  const thema = themeSelect.value;
  previewDiv.innerHTML = "";
  geselecteerdeAchtergrond = null;
  if (thema && achtergrondOpties[thema]) {
    achtergrondOpties[thema].forEach(url => {
      const img = document.createElement("img");
      img.src = url;
      img.onclick = () => {
        document.querySelectorAll(".preview img").forEach(i => i.classList.remove("selected"));
        img.classList.add("selected");
        geselecteerdeAchtergrond = url;
      };
      previewDiv.appendChild(img);
    });
  }
});

// Figuren toggle
figurenToggle.addEventListener("change", () => {
  figurenThemaDiv.style.display = figurenToggle.checked ? "block" : "none";
});

// Publiceren
function publiceer() {
  if (!geselecteerdeAchtergrond) {
    alert("⚠️ Kies eerst een achtergrond voordat je publiceert!");
    return;
  }
  const figurenAan = figurenToggle.checked;
  const figurenThema = figurenAan ? figurenSelect.value : null;

  localStorage.setItem("selectedBackground", geselecteerdeAchtergrond);
  localStorage.setItem("figuresEnabled", figurenAan);
  localStorage.setItem("selectedFiguresTheme", figurenThema);

  alert("✅ Achtergrond en figuren gepubliceerd!");
  window.open("index.html", "_blank");
}
</script>

</body>
</html>
