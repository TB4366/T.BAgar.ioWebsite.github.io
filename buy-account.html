<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<style>
body{font-family:Arial;background:#111;color:#fff}
.user{padding:8px;border-bottom:1px solid #333;cursor:pointer}
</style>
</head>
<body>

<h2>Admin Panel</h2>
<input id="search" placeholder="Search user"><br><br>

<h3>Users</h3>
<div id="usersList"></div>

<h3>Orders <span id="orderCount"></span></h3>
<div id="ordersList"></div>

<script>
let users=JSON.parse(localStorage.getItem("users")||"[]");
let orders=JSON.parse(localStorage.getItem("orders")||"[]");

function renderUsers(){
usersList.innerHTML="";
users.forEach((u,i)=>{
if(search.value && !u.name.toLowerCase().includes(search.value.toLowerCase()))return;
let d=document.createElement("div");
d.className="user";
d.textContent=u.name;
d.onclick=()=>editUser(i);
usersList.appendChild(d);
});
}

function editUser(i){
let u=users[i];
let bal=prompt("Set balance:",u.balance);
if(bal!==null) u.balance=Number(bal);
let pass=prompt("Change password:",u.password);
if(pass!==null) u.password=pass;
if(confirm("Delete user?")) users.splice(i,1);
localStorage.setItem("users",JSON.stringify(users));
renderUsers();
}

function renderOrders(){
orderCount.textContent="("+orders.length+")";
ordersList.innerHTML="";
orders.forEach((o,i)=>{
ordersList.innerHTML+=`<div>
${o.name} (${o.uid}) - ${o.method} - ${o.status}
<button onclick="process(${i})">Process</button>
</div>`;
});
}

function process(i){
orders[i].status="processed";
localStorage.setItem("orders",JSON.stringify(orders));
renderOrders();
}

search.oninput=renderUsers;
renderUsers();
renderOrders();
</script>
</body>
</html>
