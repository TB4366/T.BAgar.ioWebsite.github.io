<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>T.B Agar.io - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top, #263d68, #101722 55%, #090d14);

            color: white;
        }

        .container {
            width: 420px;
            max-width: calc(100% - 30px);
        }

        .card {
            padding: 35px;
            border-radius: 20px;

            background: rgba(20, 28, 42, .96);

            box-shadow:
                0 20px 60px rgba(0,0,0,.45);

            border: 1px solid rgba(255,255,255,.08);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(135deg, #4da3ff, #1769d1);

            font-size: 23px;
            font-weight: 900;

            box-shadow: 0 8px 30px rgba(35,125,255,.35);
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #9ba8ba;
            margin: 10px 0 28px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 11px;

            padding: 14px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: .2s;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .facebook {
            background: #1877f2;
            color: white;
        }

        .logout {
            margin-top: 15px;
            background: #303a49;
            color: white;
        }

        .continue {
            margin-top: 12px;
            background: #42a5f5;
            color: white;
        }

        input {
            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #39465a;

            background: #111925;

            color: white;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #42a5f5;
        }

        .profile {
            text-align: center;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
            margin: 10px 0 5px;
        }

        .status {
            color: #63d471;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .section {
            margin-top: 20px;
            text-align: left;
        }

        .section label {
            display: block;
            font-size: 13px;
            color: #aab5c4;
            margin-bottom: 8px;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #8fd3ff;
        }

        .agario {
            margin-top: 15px;
            padding: 12px;

            border-radius: 10px;

            background: #111925;

            text-align: center;
        }

        .agario span {
            display: block;
            color: #8f9aaa;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .agario strong {
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="loginCard" class="card">

        <div class="logo">
            T.B
        </div>

        <h1>Welcome back</h1>

        <p class="subtitle">
            Log in to continue to T.B Agar.io
        </p>

        <button
            class="facebook"
            onclick="facebookLogin()">
            🔵 Continue with Facebook
        </button>

        <div id="loginMessage" class="message"></div>

    </div>


    <!-- AGARIO LINK -->
    <div id="linkCard" class="card hidden">

        <div class="logo">
            T.B
        </div>

        <h1>Link your Agar.io account</h1>

        <p class="subtitle">
            Connect your Agar.io player name to your Facebook account.
        </p>

        <div class="section">

            <label>
                Agar.io player name
            </label>

            <input
                id="agarioName"
                type="text"
                placeholder="Enter your Agar.io name"
                maxlength="40">

            <button
                class="continue"
                onclick="linkAgario()">
                Continue
            </button>

        </div>

        <div id="linkMessage" class="message"></div>

    </div>


    <!-- LOGGED IN -->
    <div id="accountCard" class="card hidden">

        <div class="profile">

            <div class="logo">
                T.B
            </div>

            <h1>You're logged in</h1>

            <div class="profile-name" id="facebookName">
                Facebook User
            </div>

            <div class="status">
                ● Facebook account connected
            </div>

        </div>

        <div class="agario">

            <span>
                Agar.io player
            </span>

            <strong id="playerName">
                -
            </strong>

        </div>

        <button
            class="logout"
            onclick="logout()">
            Log out
        </button>

        <div id="accountMessage" class="message"></div>

    </div>

</div>


<script>

async function checkSession() {

    try {

        const response = await fetch("/api/session");

        const data = await response.json();

        if (!data.loggedIn) {

            showLogin();

            return;
        }

        if (!data.user.agarioName) {

            showLinkScreen(data.user);

            return;
        }

        showAccount(data.user);

    } catch (error) {

        console.error(error);

        showLogin();
    }
}


function facebookLogin() {

    window.location.href = "/auth/facebook";
}


function showLogin() {

    document
        .getElementById("loginCard")
        .classList.remove("hidden");

    document
        .getElementById("linkCard")
        .classList.add("hidden");

    document
        .getElementById("accountCard")
        .classList.add("hidden");
}


function showLinkScreen(user) {

    document
        .getElementById("loginCard")
        .classList.add("hidden");

    document
        .getElementById("accountCard")
        .classList.add("hidden");

    document
        .getElementById("linkCard")
        .classList.remove("hidden");
}


function showAccount(user) {

    document
        .getElementById("loginCard")
        .classList.add("hidden");

    document
        .getElementById("linkCard")
        .classList.add("hidden");

    document
        .getElementById("accountCard")
        .classList.remove("hidden");

    document.getElementById("facebookName").textContent =
        user.facebookName;

    document.getElementById("playerName").textContent =
        user.agarioName;
}


async function linkAgario() {

    const input =
        document.getElementById("agarioName");

    const message =
        document.getElementById("linkMessage");

    const agarioName =
        input.value.trim();

    if (!agarioName) {

        message.textContent =
            "Please enter your Agar.io player name.";

        return;
    }

    try {

        const response = await fetch(
            "/api/link-agario",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    agarioName
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            message.textContent =
                data.message || "Something went wrong.";

            return;
        }

        checkSession();

    } catch (error) {

        console.error(error);

        message.textContent =
            "Connection error.";
    }
}


async function logout() {

    try {

        const response = await fetch(
            "/api/logout",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (data.success) {

            showLogin();

        }

    } catch (error) {

        console.error(error);
    }
}


checkSession();

</script>

</body>
</html>
