<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
body { background:#f0f0f0; font-family:sans-serif; }
.container { max-width:1000px; margin:auto; padding:20px; }
.table { width:100%; border-collapse:collapse; }
.table th, .table td { border:1px solid #ccc; padding:8px; text-align:left; }
.table th { background:#eee; }
button { cursor:pointer; }
.modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; }
.hidden { display:none; }
.modal-content { background:white; padding:20px; border-radius:10px; width:400px; max-height:80%; overflow:auto; }
</style>
</head>
<body>

<div class="container">
  <h1 class="text-2xl font-bold mb-4">Admin Panel</h1>
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>UID</th>
        <th>Password</th>
        <th>Key</th>
        <th>Balance</th>
        <th>Orders</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <h2 class="text-xl font-bold mb-2">Edit User</h2>
    <label>Name</label>
    <input id="editName" class="w-full mb-2 px-2 py-1 border rounded">
    <label>Email</label>
    <input id="editEmail" class="w-full mb-2 px-2 py-1 border rounded">
    <label>UID</label>
    <input id="editUID" class="w-full mb-2 px-2 py-1 border rounded">
    <label>Password</label>
    <input id="editPass" class="w-full mb-2 px-2 py-1 border rounded">
    <label>Balance</label>
    <input id="editBalance" type="number" class="w-full mb-4 px-2 py-1 border rounded">
    <div class="flex justify-end gap-2">
      <button id="saveBtn" class="bg-green-500 text-white px-3 py-1 rounded">Save</button>
      <button id="cancelBtn" class="bg-red-500 text-white px-3 py-1 rounded">Cancel</button>
    </div>
  </div>
</div>

<!-- VIEW ORDERS MODAL -->
<div id="ordersModal" class="modal hidden">
  <div class="modal-content">
    <h2 class="text-xl font-bold mb-2">User Orders</h2>
    <div id="ordersList"></div>
    <div class="flex justify-end mt-4">
      <button id="closeOrdersBtn" class="bg-red-500 text-white px-3 py-1 rounded">Close</button>
    </div>
  </div>
</div>

<script>
feather.replace();

/* =====================
   DATA
===================== */
let users = JSON.parse(localStorage.getItem("users") || "[]");
let orders = JSON.parse(localStorage.getItem("orders") || "[]"); // all orders
let currentEditIndex = null;

/* =====================
   RENDER TABLE
===================== */
function renderTable(){
  const tbody = document.getElementById("userTable");
  tbody.innerHTML = "";

  users.forEach((u,i)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.name}</td>
      <td>${u.email}</td>
      <td>${u.uid}</td>
      <td>${u.password}</td>
      <td>${u.key}</td>
      <td>$${u.balance}</td>
      <td><button onclick="viewOrders(${i})" class="bg-blue-500 text-white px-2 py-1 rounded">View</button></td>
      <td><button onclick="editUser(${i})" class="bg-yellow-500 text-white px-2 py-1 rounded">Edit</button></td>
    `;
    tbody.appendChild(tr);
  });
}

renderTable();

/* =====================
   EDIT USER
===================== */
function editUser(index){
  currentEditIndex = index;
  const u = users[index];

  document.getElementById("editName").value = u.name;
  document.getElementById("editEmail").value = u.email;
  document.getElementById("editUID").value = u.uid;
  document.getElementById("editPass").value = u.password;
  document.getElementById("editBalance").value = u.balance;

  document.getElementById("editModal").classList.remove("hidden");
}

document.getElementById("cancelBtn").onclick = ()=>{
  document.getElementById("editModal").classList.add("hidden");
};

document.getElementById("saveBtn").onclick = ()=>{
  if(currentEditIndex===null) return;
  const u = users[currentEditIndex];
  u.name = document.getElementById("editName").value.trim();
  u.email = document.getElementById("editEmail").value.trim();
  u.uid = document.getElementById("editUID").value.trim();
  u.password = document.getElementById("editPass").value;
  u.balance = parseFloat(document.getElementById("editBalance").value);

  // Update users in localStorage
  localStorage.setItem("users", JSON.stringify(users));

  // Update current user if logged in
  let currentUser = JSON.parse(localStorage.getItem("currentUser") || null);
  if(currentUser && currentUser.email === u.email){
    localStorage.setItem("currentUser", JSON.stringify(u));
  }

  document.getElementById("editModal").classList.add("hidden");
  renderTable();
  alert("User updated successfully!");
};

/* =====================
   VIEW ORDERS
===================== */
function viewOrders(index){
  const u = users[index];
  const userOrders = orders.filter(o => o.userEmail === u.email);
  const ordersList = document.getElementById("ordersList");
  ordersList.innerHTML = "";

  if(userOrders.length === 0){
    ordersList.textContent = "No orders for this user.";
  } else {
    userOrders.forEach((o, i)=>{
      const div = document.createElement("div");
      div.className = "border p-2 mb-2 rounded";
      div.innerHTML = `<strong>Order #${i+1}</strong> - Total: $${o.total.toFixed(2)} <br> Date: ${o.date}<br> Items: ${o.items.map(s=>s.name+" ($"+s.price+")").join(", ")}`;
      ordersList.appendChild(div);
    });
  }

  document.getElementById("ordersModal").classList.remove("hidden");
}

document.getElementById("closeOrdersBtn").onclick = ()=>{
  document.getElementById("ordersModal").classList.add("hidden");
};
</script>

</body>
</html>
