<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Panel - T.B Agar.io Paid Skins</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
.hidden{display:none;}
</style>
</head>
<body class="bg-gray-100">

<header class="bg-gray-900 text-white p-4 flex justify-between items-center">
  <h1 class="font-bold text-lg">Admin Panel</h1>
  <button id="logoutBtn" class="bg-red-500 px-3 py-1 rounded">Logout</button>
</header>

<main class="max-w-6xl mx-auto p-6 space-y-6">

  <!-- ADMIN LOGIN -->
  <div id="loginSection">
    <h2 class="text-xl font-bold mb-4">Admin Login</h2>
    <input id="adminPassword" type="password" placeholder="Password" class="border p-2 rounded mb-2 w-full">
    <button id="adminLoginBtn" class="bg-blue-500 text-white px-4 py-2 rounded w-full">Login</button>
  </div>

  <!-- USERS PANEL -->
  <div id="adminPanel" class="hidden space-y-4">

    <!-- SEARCH -->
    <input id="userSearch" placeholder="Search users by name/email/UID..." class="border p-2 rounded w-full">

    <!-- USERS TABLE -->
    <table class="min-w-full border border-gray-300">
      <thead class="bg-gray-200">
        <tr>
          <th class="border p-2">Name</th>
          <th class="border p-2">Email</th>
          <th class="border p-2">UID</th>
          <th class="border p-2">Key</th>
          <th class="border p-2">Balance</th>
          <th class="border p-2">Orders</th>
          <th class="border p-2">Actions</th>
        </tr>
      </thead>
      <tbody id="usersTable" class="bg-white"></tbody>
    </table>

  </div>
</main>

<script>
feather.replace();

// =====================
// ADMIN DATA
// =====================
let users = JSON.parse(localStorage.getItem("users") || "[]");
let carts = JSON.parse(localStorage.getItem("cart") || "[]");
let currentAdmin = JSON.parse(localStorage.getItem("currentAdmin") || null);

// Dummy admin password
const ADMIN_PASSWORD = "admin123";

// =====================
// LOGIN
// =====================
const loginSection = document.getElementById("loginSection");
const adminPanel = document.getElementById("adminPanel");
const adminLoginBtn = document.getElementById("adminLoginBtn");
const logoutBtn = document.getElementById("logoutBtn");

adminLoginBtn.onclick = () => {
  let pass = document.getElementById("adminPassword").value;

  if(pass === ADMIN_PASSWORD){
    currentAdmin = {email: "admin@tbskins.com"};
    localStorage.setItem("currentAdmin", JSON.stringify(currentAdmin));
    loginSection.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    renderUsers(users);
  } else {
    alert("Invalid admin password.");
  }
};

logoutBtn.onclick = () => {
  currentAdmin = null;
  localStorage.setItem("currentAdmin", null);
  loginSection.classList.remove("hidden");
  adminPanel.classList.add("hidden");
};

// =====================
// RENDER USERS
// =====================
const usersTable = document.getElementById("usersTable");
const userSearch = document.getElementById("userSearch");

function renderUsers(list){
  usersTable.innerHTML = "";
  list.forEach((u, index) => {
    const tr = document.createElement("tr");
    tr.className = "border";

    const orders = carts.filter(c => c.userEmail === u.email);

    tr.innerHTML = `
      <td class="border p-2"><input type="text" value="${u.name}" class="border p-1 w-full" data-field="name" data-index="${index}"></td>
      <td class="border p-2"><input type="text" value="${u.email}" class="border p-1 w-full" data-field="email" data-index="${index}"></td>
      <td class="border p-2"><input type="text" value="${u.uid}" class="border p-1 w-full" data-field="uid" data-index="${index}"></td>
      <td class="border p-2">${u.key}</td>
      <td class="border p-2"><input type="number" value="${u.balance}" class="border p-1 w-full" data-field="balance" data-index="${index}"></td>
      <td class="border p-2">
        ${orders.length} order(s)
        <button class="bg-blue-500 text-white px-2 py-1 rounded ml-2" data-index="${index}" onclick="viewOrders(${index})">View</button>
      </td>
      <td class="border p-2">
        <button class="bg-green-500 text-white px-2 py-1 rounded saveBtn" data-index="${index}">Save</button>
      </td>
    `;

    usersTable.appendChild(tr);
  });

  // SAVE BUTTONS
  document.querySelectorAll(".saveBtn").forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.index);
      const tr = usersTable.children[i];
      const inputs = tr.querySelectorAll("input");
      inputs.forEach(inp => {
        const field = inp.dataset.field;
        users[i][field] = field === "balance" ? parseFloat(inp.value) : inp.value;
      });
      localStorage.setItem("users", JSON.stringify(users));
      alert("User updated.");
    };
  });
}

// =====================
// VIEW ORDERS
// =====================
function viewOrders(index){
  const user = users[index];
  const userOrders = carts.filter(c => c.userEmail === user.email);
  if(userOrders.length === 0){ alert("No orders."); return; }

  let msg = `Orders for ${user.name}:\n`;
  userOrders.forEach((o,i)=>{
    msg += `${i+1}. ${o.name} - $${o.price}\n`;
  });
  alert(msg);
}

// =====================
// SEARCH USERS
// =====================
userSearch.oninput = () => {
  const query = userSearch.value.toLowerCase();
  const filtered = users.filter(u => 
    u.name.toLowerCase().includes(query) ||
    u.email.toLowerCase().includes(query) ||
    u.uid.toLowerCase().includes(query)
  );
  renderUsers(filtered);
};

// =====================
// AUTO LOGIN IF ADMIN SESSION
// =====================
if(currentAdmin){
  loginSection.classList.add("hidden");
  adminPanel.classList.remove("hidden");
  renderUsers(users);
}

</script>
</body>
</html>
