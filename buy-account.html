<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agar.io Special Deals – Live Skins</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f0f0;
  padding: 20px;
}

.special-deals {
  background: #fff;
  max-width: 600px;
  margin: auto;
  padding: 20px;
  border-radius: 6px;
  box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

h2 {
  margin-top: 0;
}

label {
  font-weight: bold;
  margin-top: 15px;
  display: block;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
}

.preview {
  margin-top: 20px;
  text-align: center;
}

.preview img {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 4px solid #ddd;
  background: #222;
}

.note {
  margin-top: 15px;
  font-size: 12px;
  color: #666;
}
</style>
</head>

<body>

<div class="special-deals">
  <h2>Special Deals</h2>

  <label>Encoded UID</label>
  <input type="text" placeholder="Paste Encoded UID here">

  <label>Select Skin (live from config)</label>
  <select id="skinSelect">
    <option>Loading skins...</option>
  </select>

  <div class="preview">
    <img id="skinPreview" src="" alt="Skin preview">
  </div>

  <div class="note">
    Skins geladen uit:<br>
    <code>GameConfiguration.json (v15/10850)</code>
  </div>
</div>

<script>
const CONFIG_URL =
  "https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json";

const SKIN_BASE_URL = "https://agar.io/skins/";

async function loadGameConfig() {
  const res = await fetch(CONFIG_URL);
  return await res.json();
}

function extractAllSkins(config) {
  const skins = new Set();

  if (config.skins) {
    Object.keys(config.skins).forEach(id => skins.add(id));
  }

  if (config.skinPackages) {
    Object.values(config.skinPackages).forEach(pkg => {
      if (Array.isArray(pkg.skins)) {
        pkg.skins.forEach(s => skins.add(s));
      }
    });
  }

  if (config.shopOffers) {
    Object.values(config.shopOffers).forEach(offer => {
      if (Array.isArray(offer.skins)) {
        offer.skins.forEach(s => skins.add(s));
      }
    });
  }

  return Array.from(skins).sort();
}

function loadSkinPreview(skinId) {
  const img = document.getElementById("skinPreview");
  img.src = SKIN_BASE_URL + skinId + ".png";

  img.onerror = () => {
    img.src = "";
  };
}

async function init() {
  const select = document.getElementById("skinSelect");
  select.innerHTML = "";

  try {
    const config = await loadGameConfig();
    const skins = extractAllSkins(config);

    skins.forEach(skinId => {
      const option = document.createElement("option");
      option.value = skinId;
      option.textContent = skinId;
      select.appendChild(option);
    });

    if (skins.length > 0) {
      loadSkinPreview(skins[0]);
    }

    select.addEventListener("change", () => {
      loadSkinPreview(select.value);
    });

  } catch (e) {
    select.innerHTML = "<option>Error loading skins</option>";
    console.error(e);
  }
}

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
