<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#1b0000;
  color:#fff;
  padding:20px;
}
h1{color:#ffae42;}
label{display:block; margin:10px 0 4px;}
select, button{padding:8px 12px; border-radius:6px; border:none; margin-bottom:12px;}
#preview{margin-top:20px; width:100%; max-width:600px; height:300px; background-size:cover; background-position:center; border:2px solid #ffae42; border-radius:12px; position:relative;}
.floating-preview{
  position:absolute; font-size:24px; pointer-events:none; user-select:none; transform:translate(-50%,-50%);
}
</style>
</head>
<body>

<h1>Admin Panel - Homepagina Instellingen</h1>

<label for="backgroundSelect">Selecteer Achtergrond:</label>
<select id="backgroundSelect">
  <option value="">-- Kies een achtergrond --</option>
  <option value="zomer.jpg">Zomer</option>
  <option value="lente.jpg">Lente</option>
  <option value="herfst.jpg">Herfst</option>
  <option value="winter.jpg">Winter</option>
  <option value="halloween.jpg">Halloween</option>
  <option value="kerst.jpg">Kerst</option>
  <option value="pasen.jpg">Pasen</option>
  <option value="blackfriday.jpg">Black Friday</option>
  <option value="oudnieuw.jpg">Oud & Nieuw</option>
</select>

<label>Figuren:</label>
<input type="radio" name="figuresToggle" value="on" id="figuresOn"> <label for="figuresOn" style="display:inline">Aan</label>
<input type="radio" name="figuresToggle" value="off" id="figuresOff"> <label for="figuresOff" style="display:inline">Uit</label>

<label for="themeSelect">Kies thema voor figuren:</label>
<select id="themeSelect">
  <option value="">-- Kies thema --</option>
  <option value="zomer">Zomer</option>
  <option value="lente">Lente</option>
  <option value="herfst">Herfst</option>
  <option value="winter">Winter</option>
  <option value="halloween">Halloween</option>
  <option value="kerst">Kerst</option>
  <option value="pasen">Pasen</option>
  <option value="blackfriday">Black Friday</option>
</select>

<button id="publishBtn">Publiceer</button>

<div id="preview"></div>

<script>
const backgroundSelect = document.getElementById('backgroundSelect');
const figuresOn = document.getElementById('figuresOn');
const figuresOff = document.getElementById('figuresOff');
const themeSelect = document.getElementById('themeSelect');
const publishBtn = document.getElementById('publishBtn');
const preview = document.getElementById('preview');

let floatingPreview = [];

// Functie om preview figuren te tonen
function showPreviewFigures(theme){
  // eerst verwijderen
  floatingPreview.forEach(f => f.remove());
  floatingPreview = [];
  if(!theme) return;

  const icons = {
    zomer: ["☀️","🌴","🌊","🕶️"],
    lente: ["🌸","🌼","🐝","🌷"],
    herfst: ["🍁","🍂","🌰","🦔"],
    winter: ["❄️","⛄","🎿","🌨️"],
    halloween: ["🎃","👻","🦇","🕷️"],
    kerst: ["🎅","🎄","❄️","🎁"],
    pasen: ["🐰","🥚","🌸","🐣"],
    blackfriday: ["🛒","💰","📦"]
  };
  const selectedIcons = icons[theme] || ["⭐"];
  for(let i=0;i<15;i++){
    const span = document.createElement('span');
    span.textContent = selectedIcons[Math.floor(Math.random()*selectedIcons.length)];
    span.className='floating-preview';
    span.style.left = Math.random()*preview.offsetWidth+'px';
    span.style.top = Math.random()*preview.offsetHeight+'px';
    preview.appendChild(span);
    floatingPreview.push(span);
  }
}

// Update preview
backgroundSelect.addEventListener('change',()=>{
  const bg = backgroundSelect.value;
  if(bg) preview.style.backgroundImage = `url('${bg}')`;
  else preview.style.backgroundImage='';
});

themeSelect.addEventListener('change',()=>{
  if(figuresOn.checked) showPreviewFigures(themeSelect.value);
});

figuresOn.addEventListener('change',()=>{
  if(figuresOn.checked) showPreviewFigures(themeSelect.value);
});
figuresOff.addEventListener('change',()=>{
  floatingPreview.forEach(f => f.remove());
  floatingPreview = [];
});

// Publiceer knop
publishBtn.addEventListener('click',()=>{
  const bg = backgroundSelect.value;
  const figures = figuresOn.checked?'on':'off';
  const theme = themeSelect.value;

  const settings = { background: bg, figures, theme };
  localStorage.setItem('siteSettings', JSON.stringify(settings));
  alert('Instellingen gepubliceerd! De homepage zal de wijzigingen tonen.');
});
</script>

</body>
</html>
