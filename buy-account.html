<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Paneel - Achtergrondbeheer</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    padding: 30px;
    text-align: center;
  }
  select, button {
    padding: 10px;
    font-size: 1rem;
    margin: 10px;
    border-radius: 8px;
    border: none;
  }
  select {
    background: #222;
    color: #fff;
  }
  .preview-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .preview {
    width: 300px;
    height: 180px;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 3px solid transparent;
    transition: 0.3s;
  }
  .preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .preview.selected {
    border-color: #ff6600;
    box-shadow: 0 0 15px #ff6600;
  }
  button.publish {
    background: #ff6600;
    color: #000;
    font-weight: bold;
    margin-top: 20px;
    cursor: pointer;
  }
  button.publish:hover {
    background: #ffaa33;
  }
</style>
</head>
<body>
  <h1>🌍 Admin Paneel</h1>
  <p>Kies een thema en achtergrond voor de homepagina:</p>

  <label for="themeSelect">Seizoen of Feestdag:</label>
  <select id="themeSelect" onchange="loadPreviews()">
    <option value="">-- Selecteer Thema --</option>
    <option value="zomer">☀️ Zomer</option>
    <option value="herfst">🍂 Herfst</option>
    <option value="winter">❄️ Winter</option>
    <option value="lente">🌸 Lente</option>
    <option value="halloween">🎃 Halloween</option>
    <option value="kerst">🎄 Kerst</option>
    <option value="pasen">🐣 Pasen</option>
    <option value="blackfriday">🛒 Black Friday</option>
    <option value="oudennieuw">🎆 Oud & Nieuw</option>
  </select>

  <div class="preview-container" id="previewContainer"></div>

  <button class="publish" onclick="publishBackground()">Publiceren</button>

<script>
const backgrounds = {
  zomer: ["zomer1.jpg", "zomer2.jpg"],
  herfst: ["herfst1.jpg", "herfst2.jpg"],
  winter: ["winter1.jpg", "winter2.jpg"],
  lente: ["lente1.jpg", "lente2.jpg"],
  halloween: ["halloween1.jpg", "halloween2.jpg"],
  kerst: ["kerst1.jpg", "kerst2.jpg"],
  pasen: ["pasen1.jpg", "pasen2.jpg"],
  blackfriday: ["black1.jpg", "black2.jpg"],
  oudennieuw: ["oud1.jpg", "nieuw2.jpg"]
};

let selectedBackground = null;

function loadPreviews() {
  const container = document.getElementById("previewContainer");
  container.innerHTML = "";
  const theme = document.getElementById("themeSelect").value;
  if (!theme) return;

  backgrounds[theme].forEach(src => {
    const div = document.createElement("div");
    div.className = "preview";
    div.innerHTML = `<img src="${src}" alt="">`;
    div.onclick = () => selectPreview(div, src);
    container.appendChild(div);
  });
}

function selectPreview(div, src) {
  document.querySelectorAll(".preview").forEach(p => p.classList.remove("selected"));
  div.classList.add("selected");
  selectedBackground = src;
}

function publishBackground() {
  if (!selectedBackground) {
    alert("Kies eerst een achtergrond!");
    return;
  }
  localStorage.setItem("selectedBackground", selectedBackground);
  alert("Achtergrond succesvol gepubliceerd!");
}
</script>
</body>
</html>
