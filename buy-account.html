<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Agar.io Shop</title>
  <style>
    body {
      font-family: Arial;
      background: #f1f1f1;
      padding: 20px;
    }
    .product {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ccc;
    }
    .product h3 { margin: 0 0 5px 0; }
    #products { margin-top: 20px; }
  </style>
</head>
<body>

  <h1>Agar.io Shop</h1>

  <label>Voer je Agar.io UID in:</label><br>
  <input id="uidInput" type="text" placeholder="123456789" style="padding:5px;width:200px;">
  <button onclick="saveUid()">Opslaan</button>

  <h2>Producten</h2>
  <div id="products">Laden…</div>

<script>
const CONFIG_URL = "https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json";

let agarUid = null;
let configData = null;

// -------------------------------
// 1. UID Opslaan
// -------------------------------
function saveUid() {
  const uid = document.getElementById("uidInput").value.trim();

  if (!uid) return alert("Voer een geldige UID in!");

  agarUid = uid;
  localStorage.setItem("agarUid", uid);

  alert("UID opgeslagen!");
}

// -------------------------------
// 2. Laden Agar.io Config
// -------------------------------
async function loadConfig() {
  try {
    const resp = await fetch(CONFIG_URL);
    configData = await resp.json();
    renderProducts();
  } catch (e) {
    document.getElementById("products").innerHTML = "Fout bij laden config!";
  }
}

// -------------------------------
// 3. Producten tonen
// -------------------------------
function renderProducts() {
  const container = document.getElementById("products");
  container.innerHTML = "";

  const store = configData?.monetization?.store;

  if (!store) {
    container.innerHTML = "Geen store data gevonden.";
    return;
  }

  store.forEach(item => {
    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <h3>${item.title}</h3>
      <p>${item.description || ""}</p>
      <p><b>Prijs:</b> ${item.price.amount} ${item.price.currency}</p>
      <button onclick='buy(${JSON.stringify(item)})'>Koop</button>
    `;

    container.appendChild(div);
  });
}

// -------------------------------
// 4. Koop functie → Xsolla Widget
// -------------------------------
function buy(item) {
  if (!agarUid) return alert("Voer eerst een UID in!");

  // In echt scenario moet hier een server-token komen
  const fakeXsollaToken = "DEMO_TOKEN_HIER";

  alert(
    "Xsolla betaling starten voor item:\n" + 
    item.title +
    "\n\nLET OP: Je moet een backend token hebben voor echte betalingen."
  );

  // Hier zou je normaliter Xsolla Widget openen:
  // XPayStationWidget.init({ access_token: fakeXsollaToken, ... })
}

// -------------------------------
// 5. UID uit localStorage zetten
// -------------------------------
window.onload = () => {
  const stored = localStorage.getItem("agarUid");
  if (stored) {
    agarUid = stored;
    document.getElementById("uidInput").value = stored;
  }
  loadConfig();
};
</script>

</body>
</html>
