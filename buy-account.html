<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Panel - T.B Agar.io Paid Skins</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
body{background:#f0f0f0;}
.table{width:100%;border-collapse:collapse;}
.table th,.table td{border:1px solid #ccc;padding:8px;text-align:left;}
.table th{background:#333;color:#fff;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background-color:rgba(0,0,0,0.5);}
.hidden{display:none;}
</style>
</head>
<body>

<header class="bg-gray-900 text-white p-4 flex justify-between items-center">
  <h1 class="font-bold text-lg">Admin Panel</h1>
  <button id="ordersBtn" class="bg-blue-600 px-3 py-1 rounded">Orders</button>
</header>

<!-- LOGIN -->
<div id="loginDiv" class="p-6 max-w-sm mx-auto mt-10 bg-white rounded shadow">
  <h2 class="font-bold text-xl mb-4">Admin Login</h2>
  <input id="adminPassword" type="password" placeholder="Password" class="w-full mb-2 px-3 py-2 border rounded">
  <button id="loginAdminBtn" class="bg-green-500 text-white w-full py-2 rounded">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden p-6 max-w-6xl mx-auto">
  <h2 class="font-bold text-xl mb-4">Users</h2>
  <table class="table mb-6">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>UID</th>
        <th>Password</th>
        <th>Key</th>
        <th>Balance</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="usersTable"></tbody>
  </table>
</div>

<!-- ORDERS MODAL -->
<div id="ordersModal" class="modal hidden">
  <div class="bg-white w-full max-w-xl p-6 rounded relative">
    <button id="closeOrders" class="absolute right-4 top-2 text-2xl">&times;</button>
    <h2 class="text-2xl font-bold text-center mb-4">Orders</h2>
    <div id="ordersList" class="space-y-3"></div>
  </div>
</div>

<script>
feather.replace();

// ==== ADMIN PASSWORD ====
const ADMIN_PASSWORD = "admin123"; // wijzig dit naar jouw eigen wachtwoord
const loginDiv = document.getElementById("loginDiv");
const adminPanel = document.getElementById("adminPanel");
const loginAdminBtn = document.getElementById("loginAdminBtn");
const ordersBtn = document.getElementById("ordersBtn");
const ordersModal = document.getElementById("ordersModal");
const closeOrders = document.getElementById("closeOrders");
const ordersList = document.getElementById("ordersList");

let users = JSON.parse(localStorage.getItem("users") || "[]");
let orders = JSON.parse(localStorage.getItem("orders") || "[]"); // alle orders van users

// ==== ADMIN LOGIN ====
loginAdminBtn.onclick = () => {
  const pass = document.getElementById("adminPassword").value;
  if(pass !== ADMIN_PASSWORD){ alert("Wrong password"); return; }
  alert("Welcome Admin");
  loginDiv.classList.add("hidden");
  adminPanel.classList.remove("hidden");
  renderUsers();
};

// ==== RENDER USERS ====
function renderUsers(){
  const tbody = document.getElementById("usersTable");
  tbody.innerHTML="";
  users.forEach((u,index)=>{
    const tr = document.createElement("tr");
    tr.innerHTML=`
      <td><input value="${u.name}" data-index="${index}" data-field="name" class="border px-1 w-full"></td>
      <td><input value="${u.email}" data-index="${index}" data-field="email" class="border px-1 w-full"></td>
      <td><input value="${u.uid}" data-index="${index}" data-field="uid" class="border px-1 w-full"></td>
      <td><input value="${u.password}" data-index="${index}" data-field="password" class="border px-1 w-full"></td>
      <td>${u.key}</td>
      <td><input value="${u.balance}" data-index="${index}" data-field="balance" class="border px-1 w-full"></td>
      <td><button data-index="${index}" class="saveBtn bg-green-500 text-white px-2 py-1 rounded">Save</button></td>
    `;
    tbody.appendChild(tr);
  });

  document.querySelectorAll(".saveBtn").forEach(btn=>{
    btn.onclick = ()=>{
      const idx = btn.getAttribute("data-index");
      ["name","email","uid","password","balance"].forEach(f=>{
        const val = document.querySelector(`input[data-index='${idx}'][data-field='${f}']`).value;
        if(f==="balance") users[idx][f] = parseFloat(val);
        else users[idx][f] = val;
      });
      localStorage.setItem("users",JSON.stringify(users));
      alert("User updated!");
    };
  });
}

// ==== ORDERS MODAL ====
ordersBtn.onclick = ()=>{
  ordersList.innerHTML="";
  if(orders.length===0){ ordersList.innerHTML="<p>No orders yet.</p>"; }
  orders.forEach(o=>{
    const div = document.createElement("div");
    div.className="border p-2 rounded";
    div.innerHTML=`<strong>User:</strong> ${o.user} <br> <strong>Product:</strong> ${o.product} - $${o.price.toFixed(2)} <br> <strong>Date:</strong> ${o.date}`;
    ordersList.appendChild(div);
  });
  ordersModal.classList.remove("hidden");
};

closeOrders.onclick = ()=>{ ordersModal.classList.add("hidden"); };

</script>
</body>
</html>
