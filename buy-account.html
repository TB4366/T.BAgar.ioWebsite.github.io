<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T.B Agar.io Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
.hidden{display:none;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background-color:rgba(0,0,0,0.5);}
.modal-content{background:white;padding:20px;border-radius:10px;max-width:600px;width:100%;}
.button{padding:10px 15px;border-radius:5px;color:white;cursor:pointer;}
.button-blue{background:blue;}
.button-red{background:red;}
.button-green{background:green;}
</style>
</head>
<body class="bg-gray-100">

<header class="bg-gray-900 text-white p-4 flex justify-between items-center">
  <h1 class="font-bold text-lg">Admin Panel</h1>
  <div>
    <button id="ordersBtn" class="button button-blue relative">Orders <span id="orderCount" class="bg-red-500 text-white rounded-full px-2 py-0 text-sm">0</span></button>
    <button id="logoutBtn" class="button button-red">Logout</button>
  </div>
</header>

<main class="p-4">
  <table class="w-full border-collapse" border="1">
    <thead>
      <tr class="bg-gray-200">
        <th>Name</th>
        <th>Email</th>
        <th>UID</th>
        <th>Password</th>
        <th>Key</th>
        <th>Balance</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>
</main>

<!-- Orders Modal -->
<div id="ordersModal" class="modal hidden">
  <div class="modal-content relative">
    <span onclick="ordersModal.classList.add('hidden')" class="absolute top-2 right-4 text-2xl cursor-pointer">×</span>
    <h2 class="font-bold text-xl mb-4">Orders</h2>
    <div id="ordersList" class="space-y-2 max-h-96 overflow-y-auto"></div>
  </div>
</div>

<script>
feather.replace();

// DATA
let users = JSON.parse(localStorage.getItem("users") || "[]");
let orders = JSON.parse(localStorage.getItem("orders") || "[]");

// DOM
const userTable = document.getElementById("userTable");
const ordersBtn = document.getElementById("ordersBtn");
const ordersModal = document.getElementById("ordersModal");
const ordersList = document.getElementById("ordersList");
const orderCount = document.getElementById("orderCount");
const logoutBtn = document.getElementById("logoutBtn");

// RENDER USERS
function renderUsers(){
  userTable.innerHTML = "";
  users.forEach((u,i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td contenteditable="true" onblur="updateUser(${i}, 'name', this.textContent)">${u.name}</td>
      <td contenteditable="true" onblur="updateUser(${i}, 'email', this.textContent)">${u.email}</td>
      <td contenteditable="true" onblur="updateUser(${i}, 'uid', this.textContent)">${u.uid}</td>
      <td contenteditable="true" onblur="updateUser(${i}, 'password', this.textContent)">${u.password}</td>
      <td>${u.key}</td>
      <td contenteditable="true" onblur="updateUser(${i}, 'balance', parseFloat(this.textContent) || 0)">${u.balance}</td>
    `;
    userTable.appendChild(tr);
  });
}
renderUsers();

// UPDATE USER FUNCTION
function updateUser(index, field, value){
  users[index][field] = value;
  localStorage.setItem("users", JSON.stringify(users));
}

// LOGOUT
logoutBtn.onclick = () => {
  alert("Logged out");
  location.reload();
}

// ORDERS BUTTON
function renderOrders(){
  ordersList.innerHTML = "";
  if(orders.length === 0){
    ordersList.innerHTML = "<p>No orders yet.</p>";
  } else {
    orders.forEach(o => {
      const div = document.createElement("div");
      div.className = "border p-2 rounded";
      div.innerHTML = `
        <strong>${o.userName}</strong> bought 
        <strong>${o.itemName}</strong> for $${parseFloat(o.itemPrice).toFixed(2)}
      `;
      ordersList.appendChild(div);
    });
  }
  orderCount.textContent = orders.length;
}

ordersBtn.onclick = () => {
  orders = JSON.parse(localStorage.getItem("orders") || "[]"); // refresh orders
  renderOrders();
  ordersModal.classList.remove("hidden");
}

// INIT
renderOrders();
</script>

</body>
</html>
