<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Website Editor</title>
<style>
 body{font-family:Arial;background:#111;color:#fff;margin:0;padding:20px}
 h1{color:#ffa33a;text-shadow:0 0 8px #ff4500}
 .panel{background:#1b1b1b;padding:15px;border-radius:10px;margin-bottom:20px;box-shadow:0 0 10px rgba(255,120,0,0.3)}
 button{padding:10px 14px;border:none;border-radius:8px;background:#ff9933;color:#fff;font-weight:bold;margin:4px;cursor:pointer}
 button:hover{background:#ff7b00}
 input,select{padding:8px;border-radius:6px;border:none;margin:4px}
 #preview{background:#222;padding:20px;border-radius:12px;margin-top:20px;min-height:300px}
 .item{background:#333;padding:10px;border-radius:8px;margin:8px 0;cursor:grab}
</style>
</head>
<body>
<h1>Admin Paneel</h1>

<div class="panel">
 <h2>Achtergrond</h2>
 <label>Kleur:</label>
 <input type="color" id="bgColor">
 <button onclick="saveBG()">Opslaan</button>
</div>

<div class="panel">
 <h2>Zwevende Figuren</h2>
 <label>Thema:</label>
 <select id="figureTheme">
   <option value="zomer">Zomer</option>
   <option value="lente">Lente</option>
   <option value="herfst">Herfst</option>
   <option value="winter">Winter</option>
   <option value="halloween">Halloween</option>
   <option value="kerst">Kerst</option>
   <option value="pasen">Pasen</option>
 </select>
 <button onclick="saveFigures()">Opslaan</button>
</div>

<div class="panel">
 <h2>Home inhoud toevoegen</h2>
 <button onclick="addText()">+ Tekst</button>
 <button onclick="addLine()">+ Lijn</button>
 <button onclick="addVideo()">+ YouTube Video</button>
 <button onclick="addImage()">+ Afbeelding</button>
</div>

<div class="panel">
 <h2>Inhoud volgorde</h2>
 <div id="editor"></div>
 <button onclick="saveHome()">💾 Opslaan</button>
</div>

<h2>Voorbeeld</h2>
<div id="preview"></div>

<script>
let items = JSON.parse(localStorage.getItem('homeItems') || '[]');
render();

function addText(){ let t = prompt("Typ tekst"); if(!t) return; items.push({type:'text',value:t}); render(); }
function addLine(){ items.push({type:'line'}); render(); }
function addVideo(){ let v = prompt("YouTube embed link?"); if(!v) return; items.push({type:'video',value:v}); render(); }
function addImage(){ let url = prompt("Afbeelding URL"); if(!url) return; items.push({type:'img',value:url}); render(); }

function render(){
 document.getElementById('editor').innerHTML = '';
 document.getElementById('preview').innerHTML = '';
 items.forEach((item,i)=>{
   let box = document.createElement('div');
   box.className='item';
   box.innerHTML = item.type.toUpperCase()+" – Slepen mogelijk";
   box.draggable = true;
   box.ondragstart = e => e.dataTransfer.setData('index',i);
   box.ondragover = e => e.preventDefault();
   box.ondrop = e => { let from = e.dataTransfer.getData('index'); let to = i; let temp = items[from]; items[from]=items[to]; items[to]=temp; render(); }
   document.getElementById('editor').appendChild(box);

   let prev = document.createElement('div');
   if(item.type==='text') prev.innerHTML = `<p>${item.value}</p>`;
   if(item.type==='line') prev.innerHTML = `<hr style='border:1px solid #ff7f00'>`;
   if(item.type==='video') prev.innerHTML = `<iframe width='360' height='215' src='${item.value}'></iframe>`;
   if(item.type==='img') prev.innerHTML = `<img src='${item.value}' style='max-width:200px;border-radius:8px'>`;
   document.getElementById('preview').appendChild(prev);
 });
}

function saveHome(){
 localStorage.setItem('homeItems', JSON.stringify(items));
 alert("Opgeslagen!");
}

function saveBG(){ let c = document.getElementById('bgColor').value; localStorage.setItem('bgColor',c); alert("Opslagen!"); }
function saveFigures(){ let f = document.getElementById('figureTheme').value; localStorage.setItem('figureTheme',f); alert("Figuur-thema opgeslagen!"); }
</script>
</body>
</html>
