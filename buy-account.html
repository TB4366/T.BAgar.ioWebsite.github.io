<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Panel - T.B Agar.io</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-3xl font-bold mb-6">Admin Panel</h1>

<!-- LOGIN -->
<div id="loginBox" class="bg-white p-6 rounded max-w-sm">
  <input id="adminPass" type="password" placeholder="Admin Password"
    class="border p-2 w-full mb-4">
  <button onclick="adminLogin()" class="bg-black text-white w-full py-2 rounded">
    Login
  </button>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">

  <!-- ORDERS -->
  <h2 class="text-2xl font-bold mt-8 mb-4">Orders</h2>
  <div id="orders"></div>

  <!-- USERS -->
  <h2 class="text-2xl font-bold mt-10 mb-4">Users</h2>
  <div id="users"></div>

</div>

<script>
const ADMIN_PASSWORD = "admin123"; // <<< VERANDER DIT

function adminLogin(){
  if(document.getElementById("adminPass").value !== ADMIN_PASSWORD){
    alert("Wrong password");
    return;
  }
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  loadOrders();
  loadUsers();
}

/* =====================
   ORDERS
===================== */
function loadOrders(){
  const orders = JSON.parse(localStorage.getItem("orders") || "[]");
  const box = document.getElementById("orders");
  box.innerHTML = "";

  if(!orders.length){
    box.innerHTML = "<p class='text-gray-500'>No orders</p>";
    return;
  }

  orders.forEach((o,i)=>{
    box.innerHTML += `
    <div class="bg-white p-4 rounded mb-4 shadow">
      <div class="font-bold mb-2">
        ${o.user.name} (${o.user.email})
      </div>
      <div class="text-sm mb-1">UID: ${o.user.uid}</div>
      <div class="text-sm mb-1">Date: ${o.date}</div>
      <div class="text-sm mb-1">Total: $${o.total}</div>

      <div class="mt-2 mb-2">
        ${o.items.map(s=>`<span class="inline-block bg-gray-200 px-2 py-1 rounded mr-2 mb-1">${s.name}</span>`).join("")}
      </div>

      <select onchange="changeStatus(${i},this.value)"
        class="border px-2 py-1 rounded">
        <option ${o.status==="Pending"?"selected":""}>Pending</option>
        <option ${o.status==="Done"?"selected":""}>Done</option>
      </select>
    </div>`;
  });
}

function changeStatus(index,status){
  let orders = JSON.parse(localStorage.getItem("orders"));
  orders[index].status = status;
  localStorage.setItem("orders",JSON.stringify(orders));
}

/* =====================
   USERS
===================== */
function loadUsers(){
  const users = JSON.parse(localStorage.getItem("users") || "[]");
  const box = document.getElementById("users");
  box.innerHTML = "";

  if(!users.length){
    box.innerHTML = "<p class='text-gray-500'>No users</p>";
    return;
  }

  users.forEach((u,i)=>{
    box.innerHTML += `
    <div class="bg-white p-4 rounded mb-3 shadow flex justify-between items-center">
      <div>
        <div class="font-bold">${u.name}</div>
        <div class="text-sm">${u.email}</div>
        <div class="text-sm">UID: ${u.uid}</div>
        <div class="text-sm">Balance: $${u.balance}</div>
      </div>

      <div class="flex gap-2">
        <input type="number" value="${u.balance}"
          onchange="updateBalance(${i},this.value)"
          class="border w-24 px-2 py-1 rounded">

        <button onclick="deleteUser(${i})"
          class="bg-red-600 text-white px-3 py-1 rounded">
          Delete
        </button>
      </div>
    </div>`;
  });
}

function updateBalance(index,value){
  let users = JSON.parse(localStorage.getItem("users"));
  users[index].balance = parseFloat(value) || 0;
  localStorage.setItem("users",JSON.stringify(users));

  let current = JSON.parse(localStorage.getItem("currentUser"));
  if(current && current.email === users[index].email){
    localStorage.setItem("currentUser",JSON.stringify(users[index]));
  }
}

function deleteUser(index){
  if(!confirm("Delete this user?")) return;
  let users = JSON.parse(localStorage.getItem("users"));
  users.splice(index,1);
  localStorage.setItem("users",JSON.stringify(users));
  loadUsers();
}
</script>

</body>
</html>
