<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.B Agario Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#ececec;
}

/* TOP BALK */
.topbar{
height:70px;
background:#1e88e5;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
color:white;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:24px;
font-weight:bold;
}

.logo-icon{
font-size:35px;
}

.cart-btn{
font-size:35px;
cursor:pointer;
}

/* EVENT BANNER */
.event-banner{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:400px;
height:100px;
background:linear-gradient(purple,#ff00aa);
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:30px;
cursor:pointer;
}

/* POPUPS */
.popup{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
z-index:999;
}

.popup-content{
background:white;
padding:25px;
border-radius:15px;
max-width:700px;
width:95%;
text-align:center;
position:relative;
}

.close{
position:absolute;
right:15px;
top:10px;
font-size:30px;
cursor:pointer;
color:red;
}

.product-box{
margin-top:20px;
padding:20px;
background:#f5f5f5;
border-radius:10px;
}

.buy-btn{
background:#00c853;
color:white;
border:none;
padding:15px 30px;
font-size:25px;
border-radius:10px;
cursor:pointer;
margin-top:15px;
}

.cart-item{
display:flex;
justify-content:space-between;
margin:10px 0;
padding:10px;
background:#f5f5f5;
border-radius:8px;
}

.remove{
background:red;
color:white;
border:none;
padding:5px 10px;
cursor:pointer;
}

.total{
margin-top:15px;
font-size:22px;
font-weight:bold;
}

.pay-btn{
margin-top:15px;
background:#2196f3;
color:white;
border:none;
padding:15px 30px;
font-size:20px;
cursor:pointer;
border-radius:10px;
}

.loading{
font-size:30px;
font-weight:bold;
}

.receipt{
text-align:left;
padding:15px;
background:#f7f7f7;
margin-top:20px;
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">
<div class="logo-icon">🧫</div>
<div>T.B Agario - Store</div>
</div>

<div class="cart-btn" onclick="openCart()">🛒</div>
</div>

<!-- EVENT BANNER -->
<div class="event-banner" onclick="openEvent()">
SKINS CAULDRON
</div>

<!-- EVENT POPUP -->
<div class="popup" id="eventPopup">
<div class="popup-content">

<span class="close" onclick="closeEvent()">✖</span>

<h1>SKINS CAULDRON</h1>

<div class="product-box">
<h2>Gemclaw Skin</h2>
<p>Coins: 10.500</p>
<p>DNA: 780</p>
<p>3x Mass Boost 24h</p>

<button class="buy-btn" onclick="startPurchase()">
€ 7.99
</button>
</div>

</div>
</div>

<!-- CART -->
<div class="popup" id="cartPopup">
<div class="popup-content">

<h1>Jouw Winkelwagen</h1>

<div id="cartItems">
Jouw winkelwagen is leeg.
</div>

<div class="total" id="totalPrice">
Totaal bedrag: €0.00
</div>

<button class="pay-btn" onclick="checkout()">
Betalen
</button>

</div>
</div>

<!-- RECEIPT -->
<div class="popup" id="receiptPopup">
<div class="popup-content">

<h2>Betaling Informatie</h2>

<p>
1. Neem contact op via Instagram @t.bagar.io
</p>

<p>
2. Download de kassabon en stuur deze naar T.B.
</p>

<div id="receiptContent" class="receipt"></div>

<button class="pay-btn" onclick="downloadReceipt()">
Download Kassabon
</button>

<br><br>

<button class="buy-btn" onclick="finishOrder()">
Okay
</button>

</div>
</div>

<script>

let cart=[];

function openEvent(){
document.getElementById("eventPopup").style.display="flex";
}

function closeEvent(){
document.getElementById("eventPopup").style.display="none";
}

function openCart(){
document.getElementById("cartPopup").style.display="flex";
renderCart();
}

function startPurchase(){

let popup=document.querySelector("#eventPopup .popup-content");

popup.innerHTML=`
<div class="loading">Loading...</div>
`;

setTimeout(()=>{

popup.innerHTML=`
<h2>Wil je dit toevoegen aan je winkelwagen?</h2>

<button class="buy-btn" onclick="confirmAdd()">
Ja
</button>

<button class="buy-btn" style="background:red"
onclick="closeEvent()">
Nee
</button>
`;

},5000);

}

function confirmAdd(){

let popup=document.querySelector("#eventPopup .popup-content");

popup.innerHTML=`
<div class="loading">Loading...</div>
`;

setTimeout(()=>{

cart.push({
name:"Gemclaw Skin",
price:7.99
});

popup.innerHTML=`
<h2>
Dit product is toegevoegd aan jouw winkelwagen ✅
</h2>

<button class="buy-btn" onclick="closeEvent()">
OK
</button>
`;

},5000);

}

function renderCart(){

let container=document.getElementById("cartItems");

if(cart.length===0){

container.innerHTML=
"Jouw winkelwagen is leeg.";

document.getElementById("totalPrice")
.innerHTML="Totaal bedrag: €0.00";

return;
}

let html="";
let total=0;

cart.forEach((item,index)=>{

total+=item.price;

html+=`
<div class="cart-item">
<span>${item.name} - €${item.price.toFixed(2)}</span>

<button class="remove"
onclick="removeItem(${index})">
Verwijderen
</button>
</div>
`;

});

container.innerHTML=html;

document.getElementById("totalPrice")
.innerHTML=
"Totaal bedrag: €"+total.toFixed(2);

}

function removeItem(index){
cart.splice(index,1);
renderCart();
}

function checkout(){

if(cart.length===0){
alert("Winkelwagen is leeg.");
return;
}

let total=0;

let receipt="";

cart.forEach(item=>{
receipt+=item.name+
" - €"+item.price.toFixed(2)+"<br>";
total+=item.price;
});

receipt+=`
<hr>
<b>Totaal: €${total.toFixed(2)}</b>
`;

document.getElementById("receiptContent")
.innerHTML=receipt;

document.getElementById("receiptPopup")
.style.display="flex";
}

function downloadReceipt(){

let text=
document.getElementById("receiptContent")
.innerText;

let blob=
new Blob([text],{type:"text/plain"});

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="kassabon.txt";

a.click();
}

function finishOrder(){

cart=[];

document.getElementById("receiptPopup")
.style.display="none";

document.getElementById("cartPopup")
.style.display="none";

renderCart();
}

</script>

</body>
</html>
