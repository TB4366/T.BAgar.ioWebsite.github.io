<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Agar.io simpele clone</title>
<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:#f0f0f0;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    background:white;
    padding:10px 15px;
    border-radius:10px;
    box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

canvas{
    display:block;
}
</style>
</head>
<body>

<div id="ui">
<b>Agar.io mini clone</b><br>
Beweeg je muis om te bewegen.<br>
Eet de kleine bolletjes!
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let mouse = {x:canvas.width/2,y:canvas.height/2};

canvas.addEventListener("mousemove",e=>{
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

let player = {
    x:canvas.width/2,
    y:canvas.height/2,
    r:30,
    color:"#ff6a00"
};

let pellets = [];

function spawnPellets(){
    for(let i=0;i<200;i++){
        pellets.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height,
            r:4+Math.random()*4,
            color:`hsl(${Math.random()*360},70%,60%)`
        });
    }
}
spawnPellets();

function update(){

    let dx = mouse.x - player.x;
    let dy = mouse.y - player.y;

    player.x += dx * 0.02;
    player.y += dy * 0.02;

    pellets.forEach((p,i)=>{

        let dist = Math.hypot(player.x-p.x, player.y-p.y);

        if(dist < player.r){
            player.r += 0.3;

            pellets.splice(i,1);

            pellets.push({
                x:Math.random()*canvas.width,
                y:Math.random()*canvas.height,
                r:4+Math.random()*4,
                color:`hsl(${Math.random()*360},70%,60%)`
            });
        }

    });
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    pellets.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.color;
        ctx.fill();
    });

    ctx.beginPath();
    ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
    ctx.fillStyle=player.color;
    ctx.fill();
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
