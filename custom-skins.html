<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.B Agar.io Website</title>

<style>
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1220;
  color:white;
  transition:background-color 0.3s ease,color 0.3s ease;
}
body.dark{background:#f0f0f0;color:#222;}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  background:#0f172a;
  position:relative;
}
body.dark header{background:#e0e0e0;}

.left-header{display:flex;align-items:center;gap:12px;}
.logo{width:45px;height:45px;border-radius:50%;object-fit:cover;}
.site-title{font-size:1.3rem;font-weight:bold;}

.toggle-btn-header{
  background:none;border:none;cursor:pointer;font-size:22px;color:#0077b6;
}

.menu-btn{cursor:pointer;font-size:26px;background:none;border:none;color:white;}
.menu{
  display:none;
  position:absolute;
  top:65px;
  right:20px;
  background:#1e293b;
  border-radius:8px;
  min-width:170px;
  z-index:50;
}
.menu a{
  display:block;
  padding:12px;
  color:white;
  text-decoration:none;
  border-bottom:1px solid #334155;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  max-width:900px;
  margin:20px auto;
}

.skin{
  width:220px;
  margin:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:0.2s;
}

.skin img{
  width:220px;
  height:220px;
  border-radius:50%;
  border:4px solid #222;
  object-fit:cover;
}

.skin.selected img{
  border-color:#22c55e;
  box-shadow:0 0 0 6px rgba(34,197,94,0.4);
}

.skin-actions{
  display:flex;
  gap:10px;
  width:100%;
  margin-top:8px;
}

.share-btn{
  flex:1;
  background:#22c55e;
  border:none;
  border-radius:8px;
  padding:6px;
  font-weight:700;
  cursor:pointer;
}

.download-btn{
  flex:1;
  background:#0ea5e9;
  border:none;
  border-radius:8px;
  padding:6px;
  font-weight:700;
  cursor:pointer;
}

.lock-overlay{
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  background:rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  color:white;
}

.lock-btn{
  margin-top:8px;
  background:#ef4444;
  border:none;
  border-radius:8px;
  padding:6px 12px;
  font-weight:700;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div class="left-header">
    <img src="IMG_2718.png" class="logo">
    <span class="site-title">T.B Agar.io</span>
    <button class="toggle-btn-header" id="themeToggleBtn">🌙</button>
  </div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="menu" id="menu">
    <a href="index.html">🏠 Home</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
  </div>
</header>

<main>
  <h1 style="text-align:center">Custom Skins</h1>
  <div class="grid" id="gallery"></div>
</main>

<script>
function toggleMenu(){
  const m=document.getElementById('menu');
  m.style.display=m.style.display==='block'?'none':'block';
}

const toggleBtn=document.getElementById('themeToggleBtn');
const body=document.body;
toggleBtn.onclick=()=>{
  body.classList.toggle('dark');
  toggleBtn.textContent=body.classList.contains('dark')?'☀️':'🌙';
};

const skins=[
  {name:"evil halloween spider",url:"A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg"},
  {name:"haloween man",url:"3AA1ECAC-EEE1-4FCA-9023-57B45AE56968.jpeg"},
  {name:"evil halloween cat",url:"610F52D4-2662-4912-B9BE-C90D35B901A9.jpeg"},
  {name:"Baby Dragon",url:"IMG_4073.png"},
  {name:"Thor Hamer",url:"IMG_4027.jpeg"},
  {name:"Sting wasp",url:"IMG_4028.jpeg"}
];

const gallery=document.getElementById('gallery');

function renderGallery(){
  gallery.innerHTML='';
  skins.forEach(skin=>{
    const card=document.createElement('div');
    card.className='skin';

    const img=document.createElement('img');
    img.src=skin.url;
    card.appendChild(img);

    card.onclick=()=>{
      document.querySelectorAll('.skin').forEach(s=>s.classList.remove('selected'));
      card.classList.add('selected');
    };

    const actions=document.createElement('div');
    actions.className='skin-actions';

    const shareBtn=document.createElement('button');
    shareBtn.className='share-btn';
    shareBtn.textContent='Share';
    shareBtn.onclick=e=>{
      e.stopPropagation();
      navigator.clipboard.writeText(skin.url);
      alert('Skin gekopieerd!');
    };

    const downloadBtn=document.createElement('button');
    downloadBtn.className='download-btn';
    downloadBtn.textContent='Download';
    downloadBtn.onclick=e=>{
      e.stopPropagation();
      const a=document.createElement('a');
      a.href=skin.url;
      a.download=skin.url;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    actions.appendChild(shareBtn);
    actions.appendChild(downloadBtn);
    card.appendChild(actions);

    gallery.appendChild(card);
  });
}

renderGallery();
</script>

</body>
</html>
