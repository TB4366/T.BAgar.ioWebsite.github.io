<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.B Agar.io Website</title>

<style>
:root{
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#111;
}

/* DARK MODE */
.dark{
  --bg:#0b1220;
  --card:#0f172a;
  --text:white;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  background:var(--card);
}

.left-header{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:45px;
  height:45px;
  border-radius:50%;
}

.site-title{
  font-size:1.3rem;
  font-weight:bold;
}

.right-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.menu-btn, .theme-btn{
  cursor:pointer;
  font-size:22px;
  background:none;
  border:none;
  color:var(--text);
}

/* MENU */
.menu{
  display:none;
  position:absolute;
  top:65px;
  right:20px;
  background:var(--card);
  border-radius:8px;
  min-width:170px;
}

.menu a{
  display:block;
  padding:12px;
  color:var(--text);
  text-decoration:none;
  border-bottom:1px solid #ccc;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:25px;
  max-width:1100px;
  margin:30px auto;
}

/* SKIN */
.skin{
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  transition:transform 0.25s ease;
}

/* HOVER EFFECT */
.skin:hover{
  transform:scale(1.08);
}

/* IMAGE */
.skin img{
  width:110px;
  height:110px;
  border-radius:50%;
  border:4px solid transparent;
  transition:all 0.25s ease;
}

/* GESELECTEERD (alleen groter) */
.skin.selected{
  transform:scale(1.25);
  z-index:2;
}

/* NAAM */
.skin-name{
  margin-top:8px;
  font-size:14px;
  text-align:center;
}

/* DOWNLOAD BUTTON */
.download-btn{
  margin-top:6px;
  padding:6px 10px;
  border:none;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
  background:#38bdf8;
  color:white;
  font-weight:bold;
}

.download-btn:hover{
  opacity:0.8;
}
</style>
</head>

<body>

<header>
  <div class="left-header">
    <img src="IMG_2718.png" class="logo">
    <span class="site-title">T.B Agar.io</span>
  </div>

  <div class="right-header">
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
  </div>

  <div class="menu" id="menu">
    <a href="index.html">🏠 Home</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
  </div>
</header>

<main>
  <h1 style="text-align:center;margin-top:20px;">Custom Skins</h1>
  <div class="grid" id="gallery"></div>
</main>

<script>
/* MENU */
function toggleMenu(){
  const m=document.getElementById('menu');
  m.style.display=m.style.display==='block'?'none':'block';
}

/* DARK / LIGHT MODE */
function toggleTheme(){
  const body=document.body;
  const btn=document.getElementById("themeBtn");

  body.classList.toggle("dark");

  if(body.classList.contains("dark")){
    btn.textContent="☀️";
  }else{
    btn.textContent="🌙";
  }
}

/* SKINS */
const skins=[
  {name:"Christmas bauble",url:"42DD3307-96F0-430C-9763-307B5BF4547C.jpeg"},
  {name:"Winter T Wolf",url:"C5AA44C2-3232-4796-99D9-23B58C03F165.jpeg"},
  {name:"Magic Mushroom",url:"8994DECF-36B1-48B3-AD95-8BBC6D4A0206.jpeg"},
  {name:"Bat",url:"6DE891A5-0CF7-4520-8052-688CF2BE29C2.jpeg"},
  {name:"evil halloween spider",url:"A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg"},
  {name:"haloween man",url:"3AA1ECAC-EEE1-4FCA-9023-57B45AE56968.jpeg"},
  {name:"evil halloween cat",url:"610F52D4-2662-4912-B9BE-C90D35B901A9.jpeg"},
  {name:"Baby Dragon",url:"IMG_4073.png"},
  {name:"Thor Hamer",url:"IMG_4027.jpeg"},
  {name:"Sting wasp",url:"IMG_4028.jpeg"},
  {name:"fire wolf",url:"IMG_4025.jpeg"}  
];

const gallery=document.getElementById('gallery');

/* RENDER */
function renderGallery(){
  gallery.innerHTML='';

  skins.forEach(skin=>{
    const card=document.createElement('div');
    card.className='skin';

    const img=document.createElement('img');
    img.src=skin.url;

    /* SELECT */
    card.onclick=()=>{
      document.querySelectorAll('.skin').forEach(s=>s.classList.remove('selected'));
      card.classList.add('selected');
    };

    /* NAME */
    const name=document.createElement('div');
    name.className='skin-name';
    name.textContent=skin.name;

    /* DOWNLOAD */
    const btn=document.createElement('button');
    btn.className='download-btn';
    btn.textContent='Download';

    btn.onclick=(e)=>{
      e.stopPropagation();
      const a=document.createElement('a');
      a.href=skin.url;
      a.download=skin.url;
      a.click();
    };

    card.appendChild(img);
    card.appendChild(name);
    card.appendChild(btn);

    gallery.appendChild(card);
  });
}

renderGallery();
</script>

</body>
</html>
