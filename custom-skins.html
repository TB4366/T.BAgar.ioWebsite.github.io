<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button { padding:6px; margin:5px; border-radius:4px; border:none; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
#editor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.skinRow { margin-bottom:20px; }
.skinRow input, .skinRow label { margin:3px; }
.previewContainer { border-radius:50%; overflow:hidden; position:relative; background:#333; margin-top:10px; }
.skinPreview { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); min-width:100%; min-height:100%; object-fit:cover; border-radius:50%; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<!-- Knop voor Skin Editor -->
<div style="margin-top:20px;">
  <button onclick="openSkinEditor()">Edit Skins</button>
</div>

<h3>Add New Key</h3>
<input id="newName" placeholder="Enter Name">
<button onclick="addNewKey()">Add Key</button>

<h3>All Keys</h3>
<table id="keysTable">
<tr>
  <th>Key</th>
  <th>Name</th>
  <th>Coins</th>
  <th>Purchased Skins</th>
  <th>Actions</th>
</tr>
</table>

<!-- Skin Editor -->
<div id="editor">
  <h2>Skin Editor</h2>
  <button onclick="saveSkins()">Save Skins</button>
  <button onclick="publishSkins()">Publish Skins</button>
  <button onclick="addSkin()">Add Skin</button>
  <div id="skinsEditor"></div>
</div>

<script>
// =======================
// Key management
// =======================
function loadAllKeys(){
  const table = document.getElementById('keysTable');
  table.innerHTML='<tr><th>Key</th><th>Name</th><th>Coins</th><th>Purchased Skins</th><th>Actions</th></tr>';
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data = JSON.parse(localStorage.getItem(k));
      const row = table.insertRow();
      row.insertCell(0).innerText = k.replace('skinshop_','');
      row.insertCell(1).innerText = data.name || '';
      row.insertCell(2).innerText = data.coins || 0;
      row.insertCell(3).innerText = data.owned ? data.owned.join(', ') : '';
      const actions = row.insertCell(4);
      actions.innerHTML=`
        <button onclick="editKey('${k}')">Edit</button>
        <button onclick="deleteKey('${k}')">Delete</button>
      `;
    }
  }
}

function showMessage(msg){ document.getElementById('message').textContent=msg; }

function addNewKey(){
  const name = document.getElementById('newName').value.trim();
  if(!name) return showMessage('Enter a name');
  const key = Math.random().toString(36).substring(2,10);
  localStorage.setItem('skinshop_'+key, JSON.stringify({name:name, coins:0, owned:[]}));
  showMessage('✅ New key created: '+key);
  document.getElementById('newName').value='';
  loadAllKeys();
}

function editKey(storageKey){
  const options = prompt('Choose an option:\n1 - Manage Coins\n2 - Change Key\n3 - Change Name');
  if(!options) return;
  const data = JSON.parse(localStorage.getItem(storageKey));
  switch(options){
    case '1':
      const action = prompt('Type "add" to add coins or "remove" to remove coins');
      if(!action) return;
      const amount = parseInt(prompt('Enter amount'));
      if(isNaN(amount)) return showMessage('Invalid amount');
      if(action.toLowerCase() === 'add'){
        data.coins = (data.coins||0)+amount;
      } else if(action.toLowerCase() === 'remove'){
        data.coins = Math.max((data.coins||0)-amount,0);
      } else return showMessage('Invalid action');
      localStorage.setItem(storageKey, JSON.stringify(data));
      showMessage('✅ Coins updated');
      break;
    case '2':
      const newKey = prompt('Enter new key:', storageKey.replace('skinshop_',''));
      if(!newKey) return;
      const newStorageKey = 'skinshop_'+newKey;
      localStorage.setItem(newStorageKey, JSON.stringify(data));
      if(newStorageKey!==storageKey) localStorage.removeItem(storageKey);
      showMessage('✅ Key updated');
      break;
    case '3':
      const newName = prompt('Enter new name:', data.name);
      if(!newName) return;
      data.name = newName;
      localStorage.setItem(storageKey, JSON.stringify(data));
      showMessage('✅ Name updated');
      break;
    default: showMessage('Invalid option'); break;
  }
  loadAllKeys();
}

function deleteKey(storageKey){
  if(confirm('Are you sure you want to delete this key?')){
    localStorage.removeItem(storageKey);
    showMessage('✅ Key deleted');
    loadAllKeys();
  }
}

loadAllKeys();

// =======================
// Skin Editor with Upload + Crop + Zoom + Circle Resize
// =======================
function openSkinEditor(){
  document.getElementById('editor').style.display='block';
  renderSkinEditor();
}

function getSkins(){
  const skins = localStorage.getItem('skinsData');
  return skins ? JSON.parse(skins) : [];
}

function saveSkins(){
  const container = document.getElementById('skinsEditor');
  const skinElements = container.querySelectorAll('.skinRow');
  const skinsArr = [];
  skinElements.forEach(row=>{
    skinsArr.push({
      id: row.dataset.id,
      name: row.querySelector('.skinName').value,
      price: parseInt(row.querySelector('.skinPrice').value)||0,
      image: row.querySelector('.skinPreview').src
    });
  });
  localStorage.setItem('skinsData', JSON.stringify(skinsArr));
  showMessage('✅ Skins saved!');
  publishSkins();
}

function publishSkins(){
  localStorage.setItem('skinsDataPublished', JSON.stringify(getSkins()));
  showMessage('✅ Skins published for users!');
}

function renderSkinEditor(){
  const container = document.getElementById('skinsEditor');
  container.innerHTML='';
  const skins = getSkins();
  skins.forEach(skin=>{
    createSkinRow(skin.id, skin.name, skin.price, skin.image);
  });
}

function addSkin(){
  const id = 'skin'+Date.now();
  createSkinRow(id,'','', '');
}

function createSkinRow(id, name='', price='', image=''){
  const container = document.getElementById('skinsEditor');
  const div = document.createElement('div');
  div.className='skinRow';
  div.dataset.id = id;
  div.innerHTML=`
    <input class="skinName" placeholder="Name" value="${name}">
    <input class="skinPrice" placeholder="Price" value="${price}">
    <input type="file" accept="image/*" class="skinFile">
    <div class="previewContainer" style="width:150px;height:150px;border-radius:50%;overflow:hidden;margin-top:10px;position:relative;background:#333;">
      <img src="${image}" class="skinPreview">
    </div>
    <div>
      <label>Move X: <input type="range" class="posX" min="-50" max="50" value="0"></label>
      <label>Move Y: <input type="range" class="posY" min="-50" max="50" value="0"></label>
      <label>Zoom: <input type="range" class="scale" min="0.5" max="3" step="0.01" value="1"></label>
      <label>Circle size: <input type="range" class="circleSize" min="50" max="300" value="150"></label>
      <button onclick="this.parentElement.parentElement.remove()">Delete Skin</button>
    </div>
  `;
  container.appendChild(div);

  const fileInput = div.querySelector('.skinFile');
  const img = div.querySelector('.skinPreview');
  const posX = div.querySelector('.posX');
  const posY = div.querySelector('.posY');
  const scale = div.querySelector('.scale');
  const circleSize = div.querySelector('.circleSize');
  const previewContainer = div.querySelector('.previewContainer');

  fileInput.addEventListener('change', e=>{
    const reader = new FileReader();
    reader.onload = function(ev){
      img.src = ev.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
  });

  function updateTransform(){
    const tx = posX.value;
    const ty = posY.value;
    const sc = scale.value;
    img.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${sc})`;
  }

  posX.addEventListener('input', updateTransform);
  posY.addEventListener('input', updateTransform);
  scale.addEventListener('input', updateTransform);

  circleSize.addEventListener('input', ()=>{
    const size = circleSize.value;
    previewContainer.style.width = size+'px';
    previewContainer.style.height = size+'px';
  });

  updateTransform();
}
</script>

</body>
</html>
