<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Admin - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button { padding:6px; margin:3px; border-radius:4px; border:none; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; }
th { background:#333; }
</style>
</head>
<body>
<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<h3>Coins toevoegen</h3>
<input id="adminKey" placeholder="Key">
<input id="adminCoins" type="number" placeholder="Aantal coins">
<button onclick="addCoins()">Voeg coins toe</button>

<h3>Alle keys</h3>
<table id="keysTable">
<tr><th>Key</th><th>Owner</th><th>Coins</th><th>Gekochte skins</th></tr>
</table>

<script>
function loadAllKeys() {
  const table = document.getElementById('keysTable');
  table.innerHTML = '<tr><th>Key</th><th>Owner</th><th>Coins</th><th>Gekochte skins</th></tr>';
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data = JSON.parse(localStorage.getItem(k));
      const owned = data.owned ? data.owned.join(', ') : '';
      const row = table.insertRow();
      row.insertCell(0).innerText = k.replace('skinshop_','');
      row.insertCell(1).innerText = data.owner || '';
      row.insertCell(2).innerText = data.coins || 0;
      row.insertCell(3).innerText = owned;
    }
  }
}

function addCoins() {
  const key = document.getElementById('adminKey').value.trim();
  const amount = parseInt(document.getElementById('adminCoins').value);
  if(!key || !amount) return showMessage('Vul key en coins in');
  const data = JSON.parse(localStorage.getItem('skinshop_'+key) || '{}');
  if(!data.owner) return showMessage('Ongeldige key');
  data.coins = (data.coins||0)+amount;
  localStorage.setItem('skinshop_'+key, JSON.stringify(data));
  showMessage('✅ Coins toegevoegd');
  loadAllKeys();
}

function showMessage(msg){
  document.getElementById('message').textContent = msg;
}

loadAllKeys();
</script>
</body>
</html>
