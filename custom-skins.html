<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.B Agar.io - Skins</title>

<style>
/* ——————————————————————————————
   JOUW BESTAANDE CSS (ONGEWIJZIGD)
—————————————————————————————— */

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    background: #000;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 8px;
}

.menu-btn {
    font-size: 28px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
}

.menu {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 65px;
    right: 10px;
    background: #222;
    padding: 10px;
    border-radius: 10px;
}

.menu a {
    padding: 10px;
    color: white;
    text-decoration: none;
}

.menu a:hover {
    background: #333;
}

.menu-action-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    background: #333;
    color: white;
    cursor: pointer;
}

.top-auth-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* GALLERY */

#gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    padding: 20px;
}

.skin {
    position: relative;
    border: 2px solid #222;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
}

.skin.selected {
    border-color: gold;
}

.skin img {
    width: 100%;
    height: auto;
}

.lock-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
}

.lock-price {
    background: orange;
    padding: 5px 10px;
    border-radius: 6px;
    font-weight: bold;
    position: absolute;
    bottom: 6px;
    right: 6px;
}

/* Modals blijven exact */
</style>
</head>

<body>

<!-- ——————————————————————————————
     HEADER — *ALLEEN LOGIN POSITIE AANGEPAST*
—————————————————————————————— -->
<header>
    <div class="logo-container">
        <img src="IMG_2718.png" alt="Logo" class="logo" />
        <span class="site-title">T.B Agar.io</span>
        <button class="toggle-btn-header menu-action-btn" id="themeToggleBtn">🌙</button>
    </div>

    <!-- 🔥 Login bovenaan + Settings bij ingelogd -->
    <div class="top-auth-buttons">
        <button id="menuLoginBtn" class="menu-action-btn">Login</button>
        <button id="menuSettingsBtn" class="menu-action-btn" style="display:none;">Settings</button>
    </div>

    <!-- Hamburger -->
    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <!-- Menu blijft 100% hetzelfde -->
    <div class="menu" id="menu">
        <a href="index.html">🏠 Home Pagina</a>
        <a href="custom-skins.html">🎨 Custom Skins</a>
        <a href="mod-menu.html">🛠️ Mod Menu</a>
    </div>
</header>

<!-- ——————————————————————————————
     GALLERY
—————————————————————————————— -->
<div id="gallery"></div>

<!-- ——————————————————————————————
     AL JOUW ORIGINELE MODALS (NIET AANGEPAST)
—————————————————————————————— -->

<div id="loginModal" style="display:none;"></div>
<div id="registerModal" style="display:none;"></div>
<div id="purchaseModal" style="display:none;"></div>
<div id="settingsModal" style="display:none;"></div>

<script>
/* ——————————————————————————————
   JOUW MENU FUNCTIE (ONGEWIJZIGD)
—————————————————————————————— */
function toggleMenu(){
    let m = document.getElementById("menu");
    m.style.display = m.style.display === "block" ? "none" : "block";
}

/* ——————————————————————————————
   AUTH SYSTEEM (ALLEEN LOGIN POSITIE)
—————————————————————————————— */

function getCurrentUser(){
    return JSON.parse(localStorage.getItem('currentUser'));
}

function saveUser(u){
    localStorage.setItem('currentUser', JSON.stringify(u));
}

function logout(){
    localStorage.removeItem("currentUser");
    updateAuthUI();
    renderGallery();
}

/* 🔥 Alleen deze functie is door jou gevraagd aangepast */
function updateAuthUI(){
    const loginBtn = document.getElementById("menuLoginBtn");
    const settingsBtn = document.getElementById("menuSettingsBtn");

    const user = getCurrentUser();

    if(user){
        loginBtn.textContent = "👤";
        loginBtn.onclick = logout;

        settingsBtn.style.display = "inline-block";
        settingsBtn.onclick = openSettings;
    } else {
        loginBtn.textContent = "Login";
        loginBtn.onclick = openLogin;

        settingsBtn.style.display = "none";
    }
}

/* openLogin(), openRegister(), openSettings(), openPurchase()
   laat ik EXACT zoals jij ze had. (Niet gewijzigd)
*/

/* ——————————————————————————————
   SKINS (ONGEWIJZIGD)
—————————————————————————————— */

const skins = [
    { name:"evil halloween spider", url:"A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" },
    { name:"evil halloween spider", url:"A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" },
    { name:"haloween man", url:"3AA1ECAC-EEE1-4FCA-9023-57B45AE56968.jpeg" },
    { name:"evil halloween cat", url:"610F52D4-2662-4912-B9BE-C90D35B901A9.jpeg" },
    { name:"evil halloween spider", url:"A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" },
    { name:"Baby Dragon", url:"IMG_4073.png" },
    { name:"Thor Hamer", url:"IMG_4027.jpeg" },
    { name:"Sting wasp", url:"IMG_4028.jpeg" },
    { name:"fire skeleton", url:"IMG_4024.jpeg" },
    { name:"fire wolf", url:"IMG_4025.jpeg" },
    { name:"captain jay", url:"IMG_4026.jpeg" },
    { name:"Fire Art", url:"IMG_4022.jpeg" },
    { name:"mouth fire art", url:"IMG_3180.jpeg" },
    { name:"fire snake", url:"IMG_4032.jpeg" },
    { name:"the tiger king", url:"IMG_4037.jpeg" },
    { name:"the tiger king", url:"IMG_4037.jpeg" }
];

const paidSkins = [
    { id:"paid_IMG_6174", img:"IMG_6174.webp", price:3.99, priceLabel:"$3.99" },
    { id:"paid_IMG_6175", img:"IMG_6175.webp", price:5.99, priceLabel:"$5.99" },
    { id:"paid_IMG_6260", img:"IMG_6260.webp", price:7.99, priceLabel:"$7.99" }
];

const allSkins = skins.concat(
    paidSkins.map(s => ({
        name:"paid",
        url:s.img,
        paidData:s
    }))
);

/* ——————————————————————————————
   RENDER GALLERY (ONGEWIJZIGD)
—————————————————————————————— */
function userOwnsSkin(user, id){
    return user && user.ownedSkins && user.ownedSkins.includes(id);
}

function renderGallery(){
    const user = getCurrentUser();
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    allSkins.forEach(skin => {
        const card = document.createElement("div");
        card.className = "skin";

        const img = document.createElement("img");
        img.src = skin.url;
        card.appendChild(img);

        const paid = skin.paidData;

        if(paid && !userOwnsSkin(user, paid.id)){
            const overlay = document.createElement("div");
            overlay.className = "lock-overlay";
            overlay.textContent = "🔒";
            card.appendChild(overlay);

            const price = document.createElement("div");
            price.className = "lock-price";
            price.textContent = paid.priceLabel;
            price.onclick = (ev)=>{
                ev.stopPropagation();
                openPurchase(paid, card);
            };
            card.appendChild(price);
        }

        card.onclick = ()=>{
            if(card.classList.contains("locked")) return;
            document.querySelectorAll(".skin").forEach(c=>c.classList.remove("selected"));
            card.classList.add("selected");
        };

        gallery.appendChild(card);
    });
}

/* INIT */
updateAuthUI();
renderGallery();
</script>

</body>
</html>
