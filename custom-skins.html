<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.B Agar.io Website</title>

<style>
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1220;
  color:white;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  background:#0f172a;
}

.left-header{display:flex;align-items:center;gap:12px;}
.logo{width:45px;height:45px;border-radius:50%;object-fit:cover;}
.site-title{font-size:1.3rem;font-weight:bold;}

.menu-btn{cursor:pointer;font-size:26px;background:none;border:none;color:white;}
.menu{
  display:none;
  position:absolute;
  top:65px;
  right:20px;
  background:#1e293b;
  border-radius:8px;
  min-width:170px;
}
.menu a{
  display:block;
  padding:12px;
  color:white;
  text-decoration:none;
  border-bottom:1px solid #334155;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  max-width:900px;
  margin:30px auto;
}

.skin{
  width:220px;
  margin:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:transform 0.25s ease;
}

.skin img{
  width:220px;
  height:220px;
  border-radius:50%;
  border:4px solid #222;
  object-fit:cover;
  transition:all 0.25s ease;
}

/* geselecteerde skin */
.skin.selected img{
  border-color:#facc15; /* geel */
  box-shadow:0 0 0 8px rgba(250,204,21,0.4);
}

.skin.selected{
  transform:scale(1.08);
}

/* Download button */
.skin-actions{
  width:100%;
  margin-top:10px;
}

.download-btn{
  width:100%;
  background:linear-gradient(135deg,#38bdf8,#0284c7);
  border:none;
  border-radius:10px;
  padding:10px;
  font-size:15px;
  font-weight:700;
  color:white;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,0.4);
  transition:transform 0.2s,box-shadow 0.2s;
}

.download-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<header>
  <div class="left-header">
    <img src="IMG_2718.png" class="logo">
    <span class="site-title">T.B Agar.io</span>
  </div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="menu" id="menu">
    <a href="index.html">🏠 Home</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
  </div>
</header>

<main>
  <h1 style="text-align:center;margin-top:20px;">Custom Skins</h1>
  <div class="grid" id="gallery"></div>
</main>

<script>
function toggleMenu(){
  const m=document.getElementById('menu');
  m.style.display=m.style.display==='block'?'none':'block';
}

const skins=[
  
  {name:"Bat",url:"6DE891A5-0CF7-4520-8052-688CF2BE29C2.jpeg"},
  {name:"evil halloween spider",url:"A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg"},
  {name:"haloween man",url:"3AA1ECAC-EEE1-4FCA-9023-57B45AE56968.jpeg"},
  {name:"evil halloween cat",url:"610F52D4-2662-4912-B9BE-C90D35B901A9.jpeg"},
  {name:"Baby Dragon",url:"IMG_4073.png"},
  {name:"Thor Hamer",url:"IMG_4027.jpeg"},
  {name:"Sting wasp",url:"IMG_4028.jpeg"},
  {name:"fire wolf",url:"IMG_4025.jpeg"}  
];

const gallery=document.getElementById('gallery');

function renderGallery(){
  gallery.innerHTML='';
  skins.forEach(skin=>{
    const card=document.createElement('div');
    card.className='skin';

    const img=document.createElement('img');
    img.src=skin.url;
    card.appendChild(img);

    card.onclick=()=>{
      document.querySelectorAll('.skin').forEach(s=>s.classList.remove('selected'));
      card.classList.add('selected');
    };

    const actions=document.createElement('div');
    actions.className='skin-actions';

    const downloadBtn=document.createElement('button');
    downloadBtn.className='download-btn';
    downloadBtn.textContent='⬇ Download Skin';
    downloadBtn.onclick=e=>{
      e.stopPropagation();
      const a=document.createElement('a');
      a.href=skin.url;
      a.download=skin.url;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    actions.appendChild(downloadBtn);
    card.appendChild(actions);

    gallery.appendChild(card);
  });
}

renderGallery();
</script>

</body>
</html>
