<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.B Agar.io Website</title>
<style>
body {margin:0;font-family:Arial,sans-serif;background:#0b1220;color:white;transition:background-color 0.3s ease,color 0.3s ease;}
body.dark{background:#f0f0f0;color:#222;}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#0f172a;position:relative;transition:background-color 0.3s ease;}
body.dark header{background:#e0e0e0;}
.logo{width:45px;height:45px;border-radius:50%;object-fit:cover;}
.site-title{font-size:1.3rem;font-weight:bold;}
.toggle-btn-header{background:none;border:none;cursor:pointer;font-size:22px;color:#0077b6;padding:6px 10px;border-radius:8px;transition:background-color 0.3s ease,color 0.3s ease;}
.menu-btn{cursor:pointer;font-size:26px;background:none;border:none;color:white;}
.menu{display:none;position:absolute;top:65px;right:20px;background:#1e293b;border-radius:8px;overflow:hidden;min-width:170px;z-index:50;}
.menu a{display:block;padding:12px;color:white;text-decoration:none;border-bottom:1px solid #334155;}
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; max-width: 900px; margin: 20px auto; padding: 0 10px; }
.skin { cursor: pointer; width: 220px; height: 220px; margin: auto; border-radius: 50%; overflow: hidden; border: 4px solid #222; transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; position: relative; background: transparent; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
.skin img { width: 100%; height: 100%; object-fit: cover; object-position: center; border-radius: 50%; display:block; }
.skin.selected { transform: scale(1.15); border-color: #ffb300; box-shadow: 0 0 25px #ffb300; }
.skin.locked img { filter: grayscale(100%) brightness(0.5); pointer-events: none; }
.lock-overlay { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:5; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
.lock-icon { width:56px; height:56px; background:rgba(0,0,0,0.4); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:28px; color:white; border:2px solid rgba(255,255,255,0.08); }
.lock-price { position:absolute; left:50%; transform:translateX(-50%); bottom:-18px; background:#ef4444; color:white; padding:6px 12px; border-radius:10px; font-weight:700; cursor:pointer; }
@media (max-width:720px){ .grid { grid-template-columns: repeat(2, 1fr); } .skin{width:170px;height:170px;} }
@media (max-width:420px){ .grid { grid-template-columns: repeat(1, 1fr); } .skin{width:140px;height:140px;} }
</style>
</head>
<body>

<header>
<div class="logo-container">
  <img src="IMG_2718.png" alt="Logo" class="logo" />
  <span class="site-title">T.B Agar.io</span>
  <button class="toggle-btn-header" id="themeToggleBtn">🌙</button>
</div>
<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="menu" id="menu">
  <a href="index.html">🏠 Home Page</a>
  <a href="custom-skins.html">🎨 Custom Skins</a>
  <a href="mod-menu.html">🛠️ Mod Menu</a>
</div>
</header>

<main>
  <h1 style="text-align:center;margin-top:18px;">Custom Skins</h1>
  <div class="grid" id="gallery"></div>
</main>

<script>
/* ---------- Theme + menu ---------- */
function toggleMenu(){const m=document.getElementById('menu');m.style.display=m.style.display==='block'?'none':'block';}
const toggleBtn=document.getElementById('themeToggleBtn');const body=document.body;
const savedTheme=localStorage.getItem('theme');
if(savedTheme==='dark'){body.classList.add('dark');toggleBtn.textContent='☀️';}
toggleBtn.addEventListener('click',()=>{body.classList.toggle('dark');toggleBtn.textContent=body.classList.contains('dark')?'☀️':'🌙';localStorage.setItem('theme',body.classList.contains('dark')?'dark':'light');});

/* ---------- Auth + users ---------- */
const loginBtn=document.createElement('button'); loginBtn.id='loginBtn'; loginBtn.textContent='Login'; document.body.prepend(loginBtn);
let settingsBtn=document.createElement('button'); settingsBtn.id='settingsBtn'; settingsBtn.textContent='Settings'; settingsBtn.style.display='none'; document.body.prepend(settingsBtn);

function getUsers(){ return JSON.parse(localStorage.getItem('users')||'[]'); }
function saveUsers(users){ localStorage.setItem('users', JSON.stringify(users)); }
function getCurrentUser(){ return JSON.parse(localStorage.getItem('currentUser')||'null'); }
function setCurrentUser(u){ localStorage.setItem('currentUser', JSON.stringify(u)); updateAuthUI(); }
function formatMoney(n){ return '$' + (Number(n).toFixed(2)); }

function updateAuthUI(){
  const user=getCurrentUser();
  if(user){ loginBtn.textContent='Logout'; loginBtn.onclick=()=>{ localStorage.removeItem('currentUser'); updateAuthUI(); renderGallery(); settingsBtn.style.display='inline-block'; }; }
  else{ loginBtn.textContent='Login'; loginBtn.onclick=()=>{ const email=prompt('Email'); const password=prompt('Password'); const users=getUsers(); const u=users.find(x=>x.email===email && x.password===password); if(u){ setCurrentUser(u); renderGallery(); alert('Logged in!'); } else alert('Invalid email or password'); }; settingsBtn.style.display='none'; }
}

/* ---------- Skins ---------- */
const paidSkins = [
  { id:"paid_IMG_6174", img:"IMG_6174.webp", price:3.99 },
  { id:"paid_IMG_6175", img:"IMG_6175.webp", price:5.99 },
  { id:"paid_IMG_6260", img:"IMG_6260.webp", price:7.99 }
];

const skins = [
    { name: "evil halloween spider", url: "A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" },
    { name: "haloween man", url: "3AA1ECAC-EEE1-4FCA-9023-57B45AE56968.jpeg" },
    { name: "evil halloween cat", url: "610F52D4-2662-4912-B9BE-C90D35B901A9.jpeg" },
    { name: "Baby Dragon", url: "IMG_4073.png" },
    { name: "Thor Hamer", url: "IMG_4027.jpeg" },
    { name: "Sting wasp", url: "IMG_4028.jpeg" }
];

const allSkins = skins.concat(paidSkins.map(s=>({ name:'paid', url:s.img, paidData:s })));
const gallery=document.getElementById('gallery');

function userOwnsSkin(user, paidId){ if(!user) return false; return Array.isArray(user.ownedSkins)&&user.ownedSkins.includes(paidId); }

function openPurchase(paidEntry){
  const user = getCurrentUser();
  if(!user){ alert('Please login first'); return; }
  const confirmBuy = confirm(`Do you want to buy this skin for $${paidEntry.price.toFixed(2)}?`);
  if(!confirmBuy) return;

  if((user.money||0) < paidEntry.price){
    alert('Insufficient balance.');
    return;
  }

  user.money -= paidEntry.price;
  user.ownedSkins = user.ownedSkins || [];
  if(!user.ownedSkins.includes(paidEntry.id)) user.ownedSkins.push(paidEntry.id);

  const users = getUsers(); const idx = users.findIndex(u=>u.uid===user.uid);
  if(idx>=0){ users[idx]=user; saveUsers(users); setCurrentUser(user); }
  alert('Payment successful!');
  renderGallery();
}

function renderGallery(){
  gallery.innerHTML='';
  const user=getCurrentUser();
  allSkins.forEach(skin=>{
    const card=document.createElement('div'); card.className='skin';
    const img=document.createElement('img'); img.src=skin.url; img.alt=skin.name||''; card.appendChild(img);

    const paidEntry = paidSkins.find(p=>p.img === skin.url || p.img === (skin.paidData && skin.paidData.img));
    if(paidEntry){
      const priceTag = document.createElement('div');
      priceTag.textContent = `$${paidEntry.price.toFixed(2)}`;
      priceTag.style.textAlign='center';
      priceTag.style.marginTop='6px';
      priceTag.style.fontWeight='700';
      card.appendChild(priceTag);

      if(!userOwnsSkin(user, paidEntry.id)) card.classList.add('locked');
    }

    card.addEventListener('click',()=>{
      if(card.classList.contains('locked') && paidEntry){ openPurchase(paidEntry); }
      else{
        const prev=document.querySelector('.skin.selected');
        if(prev && prev!==card) prev.classList.remove('selected');
        card.classList.toggle('selected');
      }
    });

    gallery.appendChild(card);
  });
}

updateAuthUI();
renderGallery();
</script>

</body>
</html>
