<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.B Agar.io Website</title>
<style>
/* ---------- basis (ongewijzigd uiterlijk) ---------- */
body {margin:0;font-family:Arial,sans-serif;background:#0b1220;color:white;transition:background-color 0.3s ease,color 0.3s ease;}
body.dark{background:#f0f0f0;color:#222;}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#0f172a;position:relative;transition:background-color 0.3s ease;}
body.dark header{background:#e0e0e0;}
.left-header{display:flex;align-items:center;gap:12px;}
.logo{width:45px;height:45px;border-radius:50%;object-fit:cover;}
.site-title{font-size:1.3rem;font-weight:bold;}
.search-bar input{padding:8px 12px;border-radius:6px;border:none;outline:none;font-size:14px;width:180px;}
.toggle-btn-header{background:none;border:none;cursor:pointer;font-size:22px;color:#0077b6;padding:6px 10px;border-radius:8px;transition:background-color 0.3s ease,color 0.3s ease;}
.menu-btn{cursor:pointer;font-size:26px;background:none;border:none;color:white;}
.menu{display:none;position:absolute;top:65px;right:20px;background:#1e293b;border-radius:8px;overflow:hidden;min-width:170px;z-index:50;}
.menu a{display:block;padding:12px;color:white;text-decoration:none;border-bottom:1px solid #334155;}
.main-video{display:flex;justify-content:center;margin-top:20px;}
.video-grid{display:flex;justify-content:center;gap:20px;margin:20px;flex-wrap:wrap;}
iframe{border:none;border-radius:12px;}
.divider{max-width:900px;margin:40px auto 10px auto;border-top:2px solid #48cae4;}
.highlight-title{text-align:center;font-size:1.8rem;font-weight:bold;margin:20px 0 30px 0;color:#48cae4;}
/* ---------- skins area (kept look + added lock visuals) ---------- */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; max-width: 900px; margin: 20px auto; padding: 0 10px; }

.skin { cursor: pointer; width: 220px; height: 220px; margin: auto; border-radius: 50%; overflow: hidden; border: 4px solid #222; transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; position: relative; background: transparent; }
.skin img { width: 100%; height: 100%; object-fit: cover; object-position: center; border-radius: 50%; display:block; }
.skin.selected { transform: scale(1.15); border-color: #ffb300; box-shadow: 0 0 25px #ffb300; }

/* locked visuals */
.skin.locked img { filter: grayscale(100%) brightness(0.5); pointer-events: none; }
.skin .lock-overlay { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:5; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
.lock-icon { width:56px; height:56px; background:rgba(0,0,0,0.4); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:28px; color:white; border:2px solid rgba(255,255,255,0.08); }
.lock-price { position:absolute; left:50%; transform:translateX(-50%); bottom:-18px; background:#ef4444; color:white; padding:6px 12px; border-radius:10px; font-weight:700; z-index:6; cursor:pointer; }

/* hide skin-name as before */
.skin-name { display:none; }

/* modals + settings additions */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;display:none;}
.modal{background:#071028;padding:20px;border-radius:12px;max-width:520px;width:92%;box-shadow:0 8px 30px rgba(0,0,0,0.6);color:white;position:relative;}
.modal h2{margin:0 0 10px 0;font-size:1.2rem;}
.modal label{display:block;margin-top:10px;font-size:0.9rem;color:#cbd5e1;}
.modal input{width:100%;padding:10px;border-radius:8px;border:1px solid #2b394b;margin-top:6px;background:transparent;color:inherit;box-sizing:border-box;}
.modal .actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.modal .actions button{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:700;}
.modal .actions .cancel{background:transparent;color:#9ca3af;}
.modal .actions .confirm{background:#06b6d4;color:#02111a;}
.small{font-size:0.9rem;color:#cbd5e1;margin-top:8px;}
.money-display{font-weight:700;margin-top:8px;color:#ffd166;}
/* paypal button style small */
.paypal-btn{display:inline-block;background:#003087;color:white;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700;}
/* responsive tweak */
@media (max-width:720px){ .grid { grid-template-columns: repeat(2, 1fr); } .skin{width:170px;height:170px;} }
@media (max-width:420px){ .grid { grid-template-columns: repeat(1, 1fr); } .skin{width:140px;height:140px;} }

/* menu buttons for login/settings */
.menu-action-btn{
  background:#06b6d4;color:#02111a;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:700;font-size:14px;
  transition: background 0.2s ease;
}
.menu-action-btn:hover{ background:#38bdf8; }
</style>
</head>
<body>

<header>
<div class="logo-container">
  <img src="IMG_2718.png" alt="Logo" class="logo" />
  <span class="site-title">T.B Agar.io</span>

</div>

<main>

    </div>
  </div>
</div>

<!-- Login/Register/Settings modals (kept as before) -->
<!-- ... your loginModal, registerModal, settingsModal as in your original script ... -->

<script>
/* ---------- utilities (menu + darkmode) ---------- */
function toggleMenu(){const m=document.getElementById('menu');m.style.display=m.style.display==='block'?'none':'block';}
const toggleBtn=document.getElementById('themeToggleBtn');const body=document.body;
const savedTheme=localStorage.getItem('theme');
if(savedTheme==='dark'){body.classList.add('dark');toggleBtn.textContent='☀️';}
toggleBtn.addEventListener('click',()=>{body.classList.toggle('dark');toggleBtn.textContent=body.classList.contains('dark')?'☀️':'🌙';localStorage.setItem('theme',body.classList.contains('dark')?'dark':'light');});

/* ---------- AUTH / ACCOUNT ---------- */
const loginModal=document.getElementById('loginModal');
const registerModal=document.getElementById('registerModal');
const settingsModal=document.getElementById('settingsModal');
document.getElementById('openRegisterFromLogin').addEventListener('click',e=>{e.preventDefault();closeLogin();openRegister();});

function openLogin(){loginModal.style.display='flex';}
function closeLogin(){loginModal.style.display='none';}
function openRegister(){registerModal.style.display='flex';}
function closeRegister(){registerModal.style.display='none';}
function openSettings(){settingsModal.style.display='flex';loadSettingsFields();}
function closeSettings(){settingsModal.style.display='none';}

/* Storage helpers */
function getUsers(){ return JSON.parse(localStorage.getItem('users')||'[]'); }
function saveUsers(users){ localStorage.setItem('users', JSON.stringify(users)); }
function getCurrentUser(){ return JSON.parse(localStorage.getItem('currentUser')||'null'); }
function setCurrentUser(u){ localStorage.setItem('currentUser', JSON.stringify(u)); updateAuthUI(); }

/* Update UI */
function updateAuthUI(){
  const user = getCurrentUser();
  
  const menuLoginBtn = document.getElementById('menuLoginBtn');
  const menuSettingsBtn = document.getElementById('menuSettingsBtn');

  if(user){
    menuLoginBtn.textContent = 'Logout';
    menuLoginBtn.onclick = logout;
    menuSettingsBtn.style.display = 'inline-block';
    menuSettingsBtn.onclick = openSettings;
  } else {
    menuLoginBtn.textContent = 'Login';
    menuLoginBtn.onclick = openLogin;
    menuSettingsBtn.style.display = 'none';
  }

  const sm = document.getElementById('settingsMoney');
  if(sm && user) sm.textContent = formatMoney(user.money || 0);
}

/* Registration/Login logic */
document.getElementById('doRegisterBtn').addEventListener('click', ()=>{
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const uid=document.getElementById('regUid').value.trim();
  const pass1=document.getElementById('regPassword').value;
  const pass2=document.getElementById('regPassword2').value;
  const errorDiv=document.getElementById('regError'); errorDiv.style.display='none';
  if(!name||!email||!uid||!pass1||!pass2){ errorDiv.style.display='block'; errorDiv.textContent='All fields required.'; return; }
  if(pass1!==pass2){ errorDiv.style.display='block'; errorDiv.textContent='Passwords do not match.'; return; }
  const users = getUsers();
  if(users.find(u=>u.email===email)){ errorDiv.style.display='block'; errorDiv.textContent='Email already exists.'; return; }
  const newUser = { name, email, uid, password: pass1, money: 0, ownedSkins: [] };
  users.push(newUser); saveUsers(users); setCurrentUser(newUser); updateAuthUI(); closeRegister();
});

document.getElementById('doLoginBtn').addEventListener('click', ()=>{
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const users=getUsers();
  const user=users.find(u=>u.email===email && u.password===password);
  if(user){ setCurrentUser(user); updateAuthUI(); closeLogin(); } else { alert('Invalid email or password'); }
});

document.getElementById('doSaveSettingsBtn').addEventListener('click', ()=>{
  const user=getCurrentUser(); if(!user) return;
  const users=getUsers();
  const name=document.getElementById('settingsName').value.trim();
  const email=document.getElementById('settingsEmail').value.trim();
  const password=document.getElementById('settingsPassword').value;
  user.name=name; user.email=email; user.password=password;
  const idx=users.findIndex(u=>u.uid===user.uid);
  if(idx>=0){ users[idx]=user; saveUsers(users); setCurrentUser(user); updateAuthUI(); closeSettings(); }
});

function loadSettingsFields(){
  const user=getCurrentUser(); if(!user) return;
  document.getElementById('settingsName').value = user.name || '';
  document.getElementById('settingsEmail').value = user.email || '';
  document.getElementById('settingsPassword').value = user.password || '';
  document.getElementById('settingsUid').value = user.uid || '';
  document.getElementById('settingsMoney').textContent = formatMoney(user.money || 0);
}

/* logout */
function logout(){ localStorage.removeItem('currentUser'); updateAuthUI(); }

/* helper money formatting */
function formatMoney(n){ return '$' + (Number(n).toFixed(2)); }

/* ---------- SKINS / PURCHASE LOGIC ---------- */
/* ... keep all your skins, paidSkins, renderGallery, purchase modal, redeem code logic exactly as in your original script ... */
  /* ---------- SKINS: render + locked logic (paid skins locked) ---------- */
/* Define paid skins (locked by default) */
const paidSkins = [
  { id:"paid_IMG_6174", img:"IMG_6174.webp", price:3.99, priceLabel:"$3.99" },
  { id:"paid_IMG_6175", img:"IMG_6175.webp", price:5.99, priceLabel:"$5.99" },
  { id:"paid_IMG_6260", img:"IMG_6260.webp", price:7.99, priceLabel:"$7.99" }
];

/* Your existing skins list */
const skins = [
    { name: "evil halloween spider", url: "A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" },
    { name: "evil halloween spider", url: "A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" },
    { name: "haloween man", url: "3AA1ECAC-EEE1-4FCA-9023-57B45AE56968.jpeg" },
    { name: "evil halloween cat", url: "610F52D4-2662-4912-B9BE-C90D35B901A9.jpeg" },
    { name: "evil halloween spider", url: "A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" },
    { name: "Baby Dragon", url: "IMG_4073.png" },
    { name: "Thor Hamer", url: "IMG_4027.jpeg" },
    { name: "Sting wasp", url: "IMG_4028.jpeg" },
    { name: "fire skeleton", url: "IMG_4024.jpeg" },
    { name: "fire wolf", url: "IMG_4025.jpeg" },
    { name: "captain jay", url: "IMG_4026.jpeg" },
    { name: "Fire Art", url: "IMG_4022.jpeg" },
    { name: "mouth fire art", url: "IMG_3180.jpeg" },
    { name: "fire snake", url: "IMG_4032.jpeg" },
    { name: "the tiger king", url: "IMG_4037.jpeg" },
    { name: "the tiger king", url: "IMG_4037.jpeg" },
    { name: "the tiger king", url: "IMG_4037.jpeg" },
    { name: "the tiger king", url: "IMG_4037.jpeg" },
    { name: "the tiger king", url: "IMG_4037.jpeg" },
    { name: "the tiger king", url: "IMG_4037.jpeg" },
    { name: "the tiger king", url: "IMG_4037.jpeg" }
];

/* Merge skins + paidSkins */
const allSkins = skins.concat(paidSkins.map(s=>({ name: 'paid', url: s.img, paidData: s })));

/* Render gallery */
const gallery = document.getElementById('gallery');

function userOwnsSkin(user, paidId){
  if(!user) return false;
  return Array.isArray(user.ownedSkins) && user.ownedSkins.includes(paidId);
}

function renderGallery(){
  gallery.innerHTML = '';
  const user = getCurrentUser();

  allSkins.forEach(skin=>{
    const card = document.createElement('div');
    card.className = 'skin';
    const paidEntry = paidSkins.find(p=>p.img === skin.url || p.img === (skin.paidData && skin.paidData.img));
    if(paidEntry){
      card.classList.add('locked');
      const img = document.createElement('img'); img.src = skin.url; img.alt = paidEntry.id;
      card.appendChild(img);
      if(userOwnsSkin(user, paidEntry.id)) card.classList.remove('locked');
      else{
        const overlay = document.createElement('div'); overlay.className='lock-overlay';
        const lockIcon = document.createElement('div'); lockIcon.className='lock-icon'; lockIcon.innerHTML='🔒';
        overlay.appendChild(lockIcon);
        card.appendChild(overlay);
        const priceTag = document.createElement('div'); priceTag.className='lock-price'; priceTag.textContent=paidEntry.priceLabel;
        priceTag.addEventListener('click',(ev)=>{ev.stopPropagation();openPurchase(paidEntry, card);});
        card.appendChild(priceTag);
      }
    } else {
      const img = document.createElement('img'); img.src=skin.url; img.alt=skin.name||''; card.appendChild(img);
    }
    card.addEventListener('click',()=>{
      if(card.classList.contains('locked')) return;
      const prev=document.querySelector('.skin.selected');
      if(prev && prev!==card) prev.classList.remove('selected');
      card.classList.toggle('selected');
    });
    gallery.appendChild(card);
  });
}

renderGallery();


/* ---------- startup UI ---------- */
updateAuthUI();
renderGallery();
</script>
</body>
</html>
