<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.B Agar.io - Skins</title>

<style>
/* ———————— YOUR EXISTING CSS ———————— */
/* (Alles werkt zoals in je originele bestand) */

/* Header & Buttons */
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 15px;
    background:#111;
    color:#fff;
}

.logo-container {
    display:flex;
    align-items:center;
    gap:8px;
}

.logo {
    width:40px;
    height:40px;
    border-radius:8px;
}

.menu-btn {
    font-size:26px;
    background:none;
    border:none;
    color:white;
    cursor:pointer;
    padding:4px 10px;
}

.top-buttons {
    display:flex;
    align-items:center;
    gap:10px;
}

.menu-action-btn {
    background:#333;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    transition:0.2s;
}
.menu-action-btn:hover {
    background:#555;
}

/* Skins */
#gallery {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:15px;
    padding:20px;
}
.skin {
    position:relative;
    border:2px solid #222;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
}
.skin.selected {
    border-color:gold;
}
.skin img {
    width:100%;
    height:auto;
}

.lock-overlay {
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:30px;
}
.lock-price {
    position:absolute;
    bottom:6px;
    right:6px;
    background:#ff9900;
    padding:4px 7px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="IMG_2718.png" class="logo">
        <span class="site-title">T.B Agar.io</span>
        <button id="themeToggleBtn" class="menu-action-btn">🌙</button>
    </div>

    <div class="top-buttons">
        <button id="menuLoginBtn" class="menu-action-btn">Login</button>
        <button id="menuSettingsBtn" class="menu-action-btn" style="display:none;">Settings</button>
    </div>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<div id="menu" class="menu" style="display:none;">
    <a href="index.html">🏠 Home</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
</div>

<div id="gallery"></div>

<!-- ——————————————————————————————
      MODALS: LOGIN / REGISTER / PURCHASE / SETTINGS
—————————————————————————————— -->
<div id="loginModal" style="display:none;">
    <!-- jouw login modal inhoud -->
</div>

<div id="registerModal" style="display:none;">
    <!-- jouw register modal inhoud -->
</div>

<div id="purchaseModal" style="display:none;">
    <!-- purchase modal inhoud -->
</div>

<div id="settingsModal" style="display:none;">
    <!-- settings modal inhoud -->
</div>

<script>
/* ——————————————————————————————
   HAMBURGER MENU
—————————————————————————————— */
function toggleMenu(){
    let m = document.getElementById("menu");
    m.style.display = m.style.display === "block" ? "none" : "block";
}

/* ——————————————————————————————
   LOGIN / LOGOUT / SETTINGS
—————————————————————————————— */

function getCurrentUser(){
    return JSON.parse(localStorage.getItem('currentUser'));
}
function saveUser(u){
    localStorage.setItem('currentUser', JSON.stringify(u));
}

function updateAuthUI(){
    const loginBtn = document.getElementById("menuLoginBtn");
    const settingsBtn = document.getElementById("menuSettingsBtn");

    const user = getCurrentUser();

    if(user){
        loginBtn.textContent = "👤";
        loginBtn.onclick = logout;
        settingsBtn.style.display = "inline-block";
    } else {
        loginBtn.textContent = "Login";
        loginBtn.onclick = openLogin;
        settingsBtn.style.display = "none";
    }
}

function logout(){
    localStorage.removeItem("currentUser");
    updateAuthUI();
    renderGallery();
}

/* Je bestaande openLogin(), openRegister(), etc. blijven hetzelfde */

/* ——————————————————————————————
   SKINS (GRATIS + BETAALD)
—————————————————————————————— */
const skins = [
    { name:"evil halloween spider", url:"A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" },
    { name:"evil halloween spider", url:"A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" },
    { name:"haloween man", url:"3AA1ECAC-EEE1-4FCA-9023-57B45AE56968.jpeg" },
    { name:"evil halloween cat", url:"610F52D4-2662-4912-B9BE-C90D35B901A9.jpeg" },
    { name:"evil halloween spider", url:"A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" },
    { name:"Baby Dragon", url:"IMG_4073.png" },
    { name:"Thor Hamer", url:"IMG_4027.jpeg" },
    { name:"Sting wasp", url:"IMG_4028.jpeg" },
    { name:"fire skeleton", url:"IMG_4024.jpeg" },
    { name:"fire wolf", url:"IMG_4025.jpeg" },
    { name:"captain jay", url:"IMG_4026.jpeg" },
    { name:"Fire Art", url:"IMG_4022.jpeg" },
    { name:"mouth fire art", url:"IMG_3180.jpeg" },
    { name:"fire snake", url:"IMG_4032.jpeg" },
    { name:"the tiger king", url:"IMG_4037.jpeg" },
    { name:"the tiger king", url:"IMG_4037.jpeg" }
];

const paidSkins = [
    { id:"paid_IMG_6174", img:"IMG_6174.webp", price:3.99, priceLabel:"$3.99" },
    { id:"paid_IMG_6175", img:"IMG_6175.webp", price:5.99, priceLabel:"$5.99" },
    { id:"paid_IMG_6260", img:"IMG_6260.webp", price:7.99, priceLabel:"$7.99" }
];

const allSkins = skins.concat(
    paidSkins.map(s => ({
        name:"paid",
        url:s.img,
        paidData:s
    }))
);

/* ——————————————————————————————
   SKIN RENDER LOGICA
—————————————————————————————— */
function userOwnsSkin(user, id){
    return user && user.ownedSkins && user.ownedSkins.includes(id);
}

function renderGallery(){
    const user = getCurrentUser();
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    allSkins.forEach(skin => {
        const card = document.createElement("div");
        card.className = "skin";

        const paidEntry = skin.paidData;
        const img = document.createElement("img");
        img.src = skin.url;
        card.appendChild(img);

        if(paidEntry && !userOwnsSkin(user, paidEntry.id)){
            card.classList.add("locked");

            // overlay
            const overlay = document.createElement("div");
            overlay.className = "lock-overlay";
            overlay.innerHTML = "🔒";
            card.appendChild(overlay);

            // price tag
            const price = document.createElement("div");
            price.className = "lock-price";
            price.textContent = paidEntry.priceLabel;
            price.onclick = (ev)=>{
                ev.stopPropagation();
                openPurchase(paidEntry, card);
            };
            card.appendChild(price);
        }

        card.onclick = ()=>{
            if(card.classList.contains("locked")) return;
            document.querySelectorAll(".skin").forEach(c=>c.classList.remove("selected"));
            card.classList.add("selected");
        };

        gallery.appendChild(card);
    });
}

/* ——————————————————————————————
   PURCHASE LOGICA
—————————————————————————————— */
function openPurchase(skin, card){
    /* jouw purchase modal logica hier */
}

/* ——————————————————————————————
   INIT
—————————————————————————————— */
updateAuthUI();
renderGallery();

</script>
</body>
</html>
