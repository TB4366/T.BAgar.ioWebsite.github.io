<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button { padding:6px; margin:5px; border-radius:4px; border:none; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
#websiteEditor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.editable { border:1px dashed #0af; padding:5px; margin:5px; cursor:text; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<!-- Knop voor Website Editor -->
<div style="margin-top:20px;">
  <button onclick="openWebsiteEditor()">Edit Website</button>
</div>

<h3>Add New Key</h3>
<input id="newName" placeholder="Enter Name">
<button onclick="addNewKey()">Add Key</button>

<h3>All Keys</h3>
<table id="keysTable">
<tr>
  <th>Key</th>
  <th>Name</th>
  <th>Coins</th>
  <th>Purchased Skins</th>
  <th>Actions</th>
</tr>
</table>

<!-- Website Editor Sectie -->
<div id="websiteEditor">
  <h2>Website Editor</h2>
  <button onclick="saveWebsite()">Save</button>
  <button onclick="publishWebsite()">Publish</button>
  <button onclick="addText()">Add Text</button>
  <button onclick="addImage()">Add Image</button>
  <button onclick="addLine()">Add Line</button>
  <div id="websiteContent" style="margin-top:10px; background:#222; padding:10px; min-height:200px;">
    <div class="editable" contenteditable="true">Welcome to the Skin Shop!</div>
  </div>
</div>

<script>
// =======================
// Key management (bestaand)
// =======================
function loadAllKeys(){
  const table = document.getElementById('keysTable');
  table.innerHTML='<tr><th>Key</th><th>Name</th><th>Coins</th><th>Purchased Skins</th><th>Actions</th></tr>';
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data = JSON.parse(localStorage.getItem(k));
      const row = table.insertRow();
      row.insertCell(0).innerText = k.replace('skinshop_','');
      row.insertCell(1).innerText = data.name || '';
      row.insertCell(2).innerText = data.coins || 0;
      row.insertCell(3).innerText = data.owned ? data.owned.join(', ') : '';
      const actions = row.insertCell(4);
      actions.innerHTML=`
        <button onclick="editKey('${k}')">Edit</button>
        <button onclick="deleteKey('${k}')">Delete</button>
      `;
    }
  }
}

function showMessage(msg){
  document.getElementById('message').textContent=msg;
}

function addNewKey(){
  const name = document.getElementById('newName').value.trim();
  if(!name) return showMessage('Enter a name');
  const key = Math.random().toString(36).substring(2,10);
  localStorage.setItem('skinshop_'+key, JSON.stringify({name:name, coins:0, owned:[]}));
  showMessage('✅ New key created: '+key);
  document.getElementById('newName').value='';
  loadAllKeys();
}

function editKey(storageKey){
  const options = prompt('Choose an option:\n1 - Manage Coins\n2 - Change Key\n3 - Change Name');
  if(!options) return;
  const data = JSON.parse(localStorage.getItem(storageKey));

  switch(options){
    case '1':
      const action = prompt('Type "add" to add coins or "remove" to remove coins');
      if(!action) return;
      const amount = parseInt(prompt('Enter amount'));
      if(isNaN(amount)) return showMessage('Invalid amount');
      if(action.toLowerCase() === 'add'){
        data.coins = (data.coins||0)+amount;
      } else if(action.toLowerCase() === 'remove'){
        data.coins = Math.max((data.coins||0)-amount,0);
      } else return showMessage('Invalid action');
      localStorage.setItem(storageKey, JSON.stringify(data));
      showMessage('✅ Coins updated');
      break;

    case '2':
      const newKey = prompt('Enter new key:', storageKey.replace('skinshop_',''));
      if(!newKey) return;
      const newStorageKey = 'skinshop_'+newKey;
      localStorage.setItem(newStorageKey, JSON.stringify(data));
      if(newStorageKey!==storageKey) localStorage.removeItem(storageKey);
      showMessage('✅ Key updated');
      break;

    case '3':
      const newName = prompt('Enter new name:', data.name);
      if(!newName) return;
      data.name = newName;
      localStorage.setItem(storageKey, JSON.stringify(data));
      showMessage('✅ Name updated');
      break;

    default:
      showMessage('Invalid option');
      break;
  }

  loadAllKeys();
}

function deleteKey(storageKey){
  if(confirm('Are you sure you want to delete this key?')){
    localStorage.removeItem(storageKey);
    showMessage('✅ Key deleted');
    loadAllKeys();
  }
}

// Initial load
loadAllKeys();

// =======================
// Website Editor functionaliteit
// =======================
function openWebsiteEditor(){
  document.getElementById('websiteEditor').style.display='block';
  showMessage('Website Editor opened. Only admins can edit.');
}

function saveWebsite(){
  const content = document.getElementById('websiteContent').innerHTML;
  localStorage.setItem('adminSavedContent', content);
  showMessage('Website changes saved locally.');
}

function publishWebsite(){
  const content = document.getElementById('websiteContent').innerHTML;
  localStorage.setItem('websitePublishedContent', content);
  showMessage('Website changes published for all users.');
}

function addText(){
  const text = prompt('Enter text:');
  if(text){
    const div = document.createElement('div');
    div.className = 'editable';
    div.contentEditable = "true";
    div.textContent = text;
    document.getElementById('websiteContent').appendChild(div);
  }
}

function addImage(){
  const url = prompt('Enter image URL:');
  if(url){
    const div = document.createElement('div');
    div.className='editable';
    div.contentEditable="false";
    const img = document.createElement('img');
    img.src = url;
    img.style.maxWidth='300px';
    img.style.margin='5px';
    div.appendChild(img);
    document.getElementById('websiteContent').appendChild(div);
  }
}

function addLine(){
  const hr = document.createElement('hr');
  document.getElementById('websiteContent').appendChild(hr);
}

// Optioneel: admin preview van opgeslagen content
const savedContent = localStorage.getItem('adminSavedContent');
if(savedContent){
  document.getElementById('websiteContent').innerHTML = savedContent;
}
</script>

</body>
</html>
