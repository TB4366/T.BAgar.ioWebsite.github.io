<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T.B Agar.io — Editor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1e293b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #14213d;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #48cae4;
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #0096c7;
      color: #fff;
    }
    .preview {
      margin-top: 30px;
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
    }
    iframe {
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      width: 100%;
      max-width: 360px;
      height: 215px;
    }
    .video-item {
      border-bottom: 1px solid #334155;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .delete-btn {
      margin-top: 10px;
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .delete-btn:hover {
      background: #dc2626;
    }
    a.back {
      color: #fff;
      text-decoration: none;
      background: #48cae4;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
    }
    a.back:hover {
      background: #0096c7;
      color: #fff;
    }
  </style>
</head>
<body>

<header>
  <h1>🎥 Website Editor</h1>
  <a href="index.html" class="back">⬅️ Terug naar website</a>
</header>

<div class="container">
  <h2>Voeg nieuwe video toe</h2>

  <label for="videoUrl">YouTube video URL</label>
  <input type="text" id="videoUrl" placeholder="Bijv. https://www.youtube.com/watch?v=xxxxxx" />

  <label for="videoTitle">Titel van video</label>
  <input type="text" id="videoTitle" placeholder="Titel..." />

  <button onclick="addVideo()">➕ Video toevoegen</button>

  <div class="preview">
    <h3>📺 Toegevoegde video’s</h3>
    <div id="videoList"></div>
  </div>
</div>

<script>
  const videoListEl = document.getElementById('videoList');

  // Laad video's uit localStorage bij opstart
  let videos = JSON.parse(localStorage.getItem('videos') || '[]');

  function extractVideoId(url) {
    const regex1 = /[?&]v=([^&]+)/;
    const regex2 = /youtu\\.be\\/([^?]+)/;
    const match = url.match(regex1) || url.match(regex2);
    return match ? match[1] : null;
  }

  function saveVideos() {
    localStorage.setItem('videos', JSON.stringify(videos));
  }

  function renderVideos() {
    videoListEl.innerHTML = '';
    if (videos.length === 0) {
      videoListEl.innerHTML = '<p>Geen video’s toegevoegd.</p>';
      return;
    }

    videos.forEach((v, index) => {
      const div = document.createElement('div');
      div.className = 'video-item';

      const title = document.createElement('h4');
      title.textContent = v.title || '(Geen titel)';
      div.appendChild(title);

      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${v.id}`;
      div.appendChild(iframe);

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '❌ Verwijderen';
      del.onclick = () => {
        videos.splice(index, 1);
        saveVideos();
        renderVideos();
      };
      div.appendChild(del);

      videoListEl.appendChild(div);
    });
  }

  function addVideo() {
    const url = document.getElementById('videoUrl').value.trim();
    const title = document.getElementById('videoTitle').value.trim();
    const id = extractVideoId(url);

    if (!id) {
      alert('⚠️ Ongeldige YouTube-link!');
      return;
    }

    videos.push({ id, title });
    saveVideos();
    renderVideos();

    // Velden leegmaken
    document.getElementById('videoUrl').value = '';
    document.getElementById('videoTitle').value = '';
  }

  renderVideos();
</script>

</body>
</html>
