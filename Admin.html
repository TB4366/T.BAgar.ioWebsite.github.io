<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button, select { padding:6px; margin:5px; border-radius:4px; border:none; font-size:14px; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
#editor, #eventEditor, #dealEditor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.skinRow, .eventRow, .dealRow { margin-bottom:10px; }
.skinRow input, .eventRow input, .dealRow input, .dealRow select { margin:3px; }
.adminControls { margin-top:10px; border-top:1px solid #0af; padding-top:10px; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<h3>Add New Key</h3>
<input id="newName" placeholder="Enter Name">
<button onclick="addNewKey()">Add Key</button>

<h3>All Keys</h3>
<table id="keysTable">
<tr>
  <th>Key</th>
  <th>Name</th>
  <th>Coins</th>
  <th>Money</th>
  <th>Purchased Skins</th>
  <th>Actions</th>
</tr>
</table>

<!-- Skin Editor -->
<div style="margin-top:20px;">
  <button onclick="openSkinEditor()">Edit Skins</button>
</div>
<div id="editor">
  <h2>Skin Editor</h2>
  <button onclick="saveSkins()">Save Skins</button>
  <button onclick="publishSkins()">Publish Skins</button>
  <button onclick="addSkin()">Add Skin</button>
  <div id="skinsEditor"></div>
</div>

<!-- Event Editor -->
<div style="margin-top:20px;">
  <button onclick="openEventEditor()">Manage Events</button>
</div>
<div id="eventEditor">
  <h2>Event Editor</h2>
  <button onclick="addEvent()">Add Event</button>
  <button onclick="publishEvents()">Publish Events</button>
  <div id="eventsList"></div>
</div>

<!-- Deal Editor -->
<div style="margin-top:20px;">
  <button onclick="openDealEditor()">Manage Deals</button>
</div>
<div id="dealEditor">
  <h2>Deal Editor</h2>
  <button onclick="addDeal()">Add Deal</button>
  <button onclick="publishDeals()">Publish Deals</button>
  <div id="dealsList"></div>
</div>

<script>
// =======================
// Admin Key & Mode
// =======================
let adminMode = true;

// =======================
// Key Management
// =======================
function loadAllKeys(){
  const table = document.getElementById('keysTable');
  table.innerHTML='<tr><th>Key</th><th>Name</th><th>Coins</th><th>Money</th><th>Purchased Skins</th><th>Actions</th></tr>';
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data = JSON.parse(localStorage.getItem(k));
      const row = table.insertRow();
      row.insertCell(0).innerText = k.replace('skinshop_','');
      row.insertCell(1).innerText = data.name || '';
      row.insertCell(2).innerText = data.coins || 0;
      row.insertCell(3).innerText = data.money ? data.money.toFixed(2) : '0.00';
      row.insertCell(4).innerText = data.owned ? data.owned.join(', ') : '';
      const actions = row.insertCell(5);
      actions.innerHTML=`
        <button onclick="editKey('${k}')">Edit</button>
        <button onclick="deleteKey('${k}')">Delete</button>
      `;
    }
  }
}

function addNewKey(){
  const name = document.getElementById('newName').value.trim();
  if(!name) return alert('Enter a name');
  const key = Math.random().toString(36).substring(2,10);
  localStorage.setItem('skinshop_'+key, JSON.stringify({name:name, coins:0, money:0, owned:[]}));
  document.getElementById('newName').value='';
  loadAllKeys();
}

function editKey(storageKey){
  const data = JSON.parse(localStorage.getItem(storageKey));
  const option = prompt('Choose:\n1 - Coins/Money\n2 - Change Key\n3 - Change Name');
  switch(option){
    case '1':
      const type = prompt('Coins or Money?').toLowerCase();
      const action = prompt('Add or Remove?').toLowerCase();
      const amount = parseFloat(prompt('Amount:'));
      if(type==='coins'){
        if(action==='add') data.coins += amount; else data.coins = Math.max(0, data.coins - amount);
      } else if(type==='money'){
        if(action==='add') data.money += amount; else data.money = Math.max(0, data.money - amount);
      }
      break;
    case '2':
      const newKey = prompt('New Key:', storageKey.replace('skinshop_',''));
      localStorage.setItem('skinshop_'+newKey, JSON.stringify(data));
      localStorage.removeItem(storageKey);
      break;
    case '3':
      const newName = prompt('New Name:', data.name);
      data.name = newName;
      break;
    default: return alert('Invalid option');
  }
  localStorage.setItem(storageKey, JSON.stringify(data));
  loadAllKeys();
}

function deleteKey(storageKey){
  if(confirm('Are you sure?')) { localStorage.removeItem(storageKey); loadAllKeys(); }
}

loadAllKeys();

// =======================
// Skin Editor
// =======================
function openSkinEditor(){
  document.getElementById('editor').style.display='block';
  renderSkinEditor();
}
function getSkins(){ return JSON.parse(localStorage.getItem('skinsData')||'[]'); }
function renderSkinEditor(){
  const container=document.getElementById('skinsEditor'); container.innerHTML='';
  getSkins().forEach(skin=>{
    const div=document.createElement('div'); div.className='skinRow'; div.dataset.id=skin.id;
    div.innerHTML=`
      <input class="skinName" value="${skin.name}" placeholder="Name">
      <input class="skinPrice" value="${skin.price}" placeholder="Price">
      <input class="skinStart" type="datetime-local" value="${new Date(skin.startTime).toISOString().slice(0,16)}">
      <input class="skinEnd" type="datetime-local" value="${new Date(skin.endTime).toISOString().slice(0,16)}">
      <input class="skinImage" value="${skin.image}" placeholder="Image URL">
      <input type="file" onchange="uploadSkinImage(this,'${skin.id}')">
      <button onclick="deleteSkin('${skin.id}')">Delete</button>
    `;
    container.appendChild(div);
  });
}

function addSkin(){
  const id='skin'+Date.now();
  const container=document.getElementById('skinsEditor');
  const div=document.createElement('div'); div.className='skinRow'; div.dataset.id=id;
  div.innerHTML=`
    <input class="skinName" placeholder="Name">
    <input class="skinPrice" placeholder="Price">
    <input class="skinStart" type="datetime-local">
    <input class="skinEnd" type="datetime-local">
    <input class="skinImage" placeholder="Image URL">
    <input type="file" onchange="uploadSkinImage(this,'${id}')">
    <button onclick="deleteSkin('${id}')">Delete</button>
  `;
  container.appendChild(div);
}

function uploadSkinImage(input,id){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>document.querySelector(`.skinRow[data-id='${id}'] .skinImage`).value=e.target.result;
  reader.readAsDataURL(file);
}

function saveSkins(){
  const container=document.getElementById('skinsEditor'); const arr=[];
  container.querySelectorAll('.skinRow').forEach(div=>{
    arr.push({
      id: div.dataset.id,
      name: div.querySelector('.skinName').value,
      price: parseInt(div.querySelector('.skinPrice').value)||0,
      startTime: new Date(div.querySelector('.skinStart').value).getTime(),
      endTime: new Date(div.querySelector('.skinEnd').value).getTime(),
      image: div.querySelector('.skinImage').value
    });
  });
  localStorage.setItem('skinsData', JSON.stringify(arr));
  alert('Skins saved!');
}

function publishSkins(){ localStorage.setItem('skinsDataPublished', localStorage.getItem('skinsData')); alert('Skins published!'); }
function deleteSkin(id){ document.querySelector(`.skinRow[data-id='${id}']`).remove(); }

// =======================
// Event Editor
// =======================
function openEventEditor(){ document.getElementById('eventEditor').style.display='block'; renderEventEditor(); }
function getEvents(){ return JSON.parse(localStorage.getItem('eventData')||'[]'); }
function renderEventEditor(){
  const container=document.getElementById('eventsList'); container.innerHTML='';
  getEvents().forEach((event,i)=>{
    const div=document.createElement('div'); div.className='eventRow'; div.dataset.index=i;
    div.innerHTML=`
      <input class="eventName" value="${event.name}" placeholder="Name">
      <input class="eventDesc" value="${event.desc}" placeholder="Description">
      <select class="eventStatus">
        <option value="active" ${event.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${event.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${event.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <input class="eventStart" type="datetime-local" value="${new Date(event.startTime).toISOString().slice(0,16)}">
      <input class="eventEnd" type="datetime-local" value="${new Date(event.endTime).toISOString().slice(0,16)}">
      <input class="eventBarImage" value="${event.barImage||''}" placeholder="Bar Image URL">
      <input class="eventImage" value="${event.image||''}" placeholder="Active Image URL">
      <input type="file" onchange="uploadEventImage(this,'${i}')">
      <input class="eventComingImage" value="${event.comingImage||''}" placeholder="Coming Soon Image URL">
      <input class="eventComingBg" value="${event.comingBg||''}" placeholder="Coming Soon Background URL">
      <button onclick="deleteEvent(${i})">Delete</button>
    `;
    container.appendChild(div);
  });
}

function uploadEventImage(input,i){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{ const events=getEvents(); events[i].image=e.target.result; localStorage.setItem('eventData', JSON.stringify(events)); renderEventEditor(); };
  reader.readAsDataURL(file);
}

function addEvent(){
  const events=getEvents();
  events.push({id:'event'+Date.now(),name:'New Event',desc:'Desc',status:'coming',startTime:Date.now(),endTime:Date.now()+3600000,barImage:'',image:'',comingImage:'',comingBg:''});
  localStorage.setItem('eventData', JSON.stringify(events));
  renderEventEditor();
}

function deleteEvent(i){ const events=getEvents(); events.splice(i,1); localStorage.setItem('eventData', JSON.stringify(events)); renderEventEditor(); }

function publishEvents(){
  const container=document.getElementById('eventsList'); const arr=[];
  container.querySelectorAll('.eventRow').forEach(div=>{
    arr.push({
      id: getEvents()[div.dataset.index]?.id || 'event'+Date.now(),
      name: div.querySelector('.eventName').value,
      desc: div.querySelector('.eventDesc').value,
      status: div.querySelector('.eventStatus').value,
      startTime: new Date(div.querySelector('.eventStart').value).getTime(),
      endTime: new Date(div.querySelector('.eventEnd').value).getTime(),
      barImage: div.querySelector('.eventBarImage').value,
      image: div.querySelector('.eventImage').value,
      comingImage: div.querySelector('.eventComingImage').value,
      comingBg: div.querySelector('.eventComingBg').value
    });
  });
  localStorage.setItem('eventData', JSON.stringify(arr));
  localStorage.setItem('eventDataPublished', JSON.stringify(arr));
  alert('Events published!');
}

// =======================
// Deal Editor
// =======================
function openDealEditor(){ document.getElementById('dealEditor').style.display='block'; renderDealEditor(); }
function getDeals(){ return JSON.parse(localStorage.getItem('dealData')||'[]'); }
function renderDealEditor(){
  const container=document.getElementById('dealsList'); container.innerHTML='';
  const events=getEvents();
  getDeals().forEach((deal,i)=>{
    const div=document.createElement('div'); div.className='dealRow'; div.dataset.index=i;
    let eventOptions=events.map(e=>`<option value="${e.id}" ${deal.eventId===e.id?'selected':''}>${e.name}</option>`).join('');
    div.innerHTML=`
      <input class="dealName" value="${deal.name}" placeholder="Name">
      <input class="dealDesc" value="${deal.desc}" placeholder="Description">
      <select class="dealStatus">
        <option value="active" ${deal.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${deal.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${deal.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <input class="dealStart" type="datetime-local" value="${new Date(deal.startTime).toISOString().slice(0,16)}">
      <input class="dealEnd" type="datetime-local" value="${new Date(deal.endTime).toISOString().slice(0,16)}">
      <select class="dealEvent">${eventOptions}</select>
      <input class="dealImage" value="${deal.image||''}" placeholder="Image URL">
      <input type="file" onchange="uploadDealImage(this,${i})">
      <input class="dealPrice" value="${deal.price||0}" placeholder="Price">
      <input class="dealURL" value="${deal.url||''}" placeholder="Link URL">
      <button onclick="deleteDeal(${i})">Delete</button>
    `;
    container.appendChild(div);
  });
}

function addDeal(){
  const deals=getDeals();
  deals.push({name:'New Deal',desc:'Desc',status:'coming',startTime:Date.now(),endTime:Date.now()+3600000,eventId:'',image:'',price:0,url:''});
  localStorage.setItem('dealData', JSON.stringify(deals));
  renderDealEditor();
}

function uploadDealImage(input,i){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{ const deals=getDeals(); deals[i].image=e.target.result; localStorage.setItem('dealData', JSON.stringify(deals)); renderDealEditor(); };
  reader.readAsDataURL(file);
}

function deleteDeal(i){ const deals=getDeals(); deals.splice(i,1); localStorage.setItem('dealData', JSON.stringify(deals)); renderDealEditor(); }

function publishDeals(){
  const container=document.getElementById('dealsList'); const arr=[];
  container.querySelectorAll('.dealRow').forEach(div=>{
    arr.push({
      name: div.querySelector('.dealName').value,
      desc: div.querySelector('.dealDesc').value,
      status: div.querySelector('.dealStatus').value,
      startTime: new Date(div.querySelector('.dealStart').value).getTime(),
      endTime: new Date(div.querySelector('.dealEnd').value).getTime(),
      eventId: div.querySelector('.dealEvent').value,
      image: div.querySelector('.dealImage').value,
      price: parseFloat(div.querySelector('.dealPrice').value)||0,
      url: div.querySelector('.dealURL').value
    });
  });
  localStorage.setItem('dealData', JSON.stringify(arr));
  localStorage.setItem('dealDataPublished', JSON.stringify(arr));
  alert('Deals published!');
}
</script>
</body>
</html>
