<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button, select { padding:6px; margin:5px; border-radius:4px; border:none; font-size:14px; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
.skinThumb { width:40px; height:40px; border-radius:50%; margin:2px; cursor:pointer; border:2px solid transparent; }
.skinThumb.selected { border-color:#0af; opacity:1; }
.skinThumb.locked { opacity:0.4; }
#editor, #eventEditor, #dealEditor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.skinRow, .eventRow, .dealRow { margin-bottom:10px; }
.skinRow input, .skinRow select, .eventRow input, .eventRow select, .dealRow input, .dealRow select { margin:3px; }
.adminControls { margin-top:10px; border-top:1px solid #0af; padding-top:10px; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<h3>Add New Key</h3>
<input id="newName" placeholder="Enter Name">
<button onclick="addNewKey()">Add Key</button>

<h3>All Keys</h3>
<table id="keysTable">
<tr>
  <th>Key</th>
  <th>Name</th>
  <th>Coins</th>
  <th>Money</th>
  <th>Purchased Skins</th>
  <th>Actions</th>
</tr>
</table>

<!-- Skin Editor -->
<div style="margin-top:20px;">
  <button onclick="openSkinEditor()">Edit Skins</button>
</div>
<div id="editor">
  <h2>Skin Editor</h2>
  <button onclick="saveSkins()">Save Skins</button>
  <button onclick="publishSkins()">Publish Skins</button>
  <button onclick="addSkin()">Add Skin</button>
  <div id="skinsEditor"></div>
</div>

<!-- Event Editor -->
<div style="margin-top:20px;">
  <button onclick="openEventEditor()">Manage Events</button>
</div>
<div id="eventEditor">
  <h2>Event Editor</h2>
  <button onclick="addEvent()">Add Event</button>
  <button onclick="publishEvents()">Publish Events</button>
  <div id="eventsList"></div>
</div>

<!-- Deal Editor -->
<div style="margin-top:20px;">
  <button onclick="openDealEditor()">Manage Deals</button>
</div>
<div id="dealEditor">
  <h2>Deal Editor</h2>
  <button onclick="addDeal()">Add Deal</button>
  <button onclick="publishDeals()">Publish Deals</button>
  <div id="dealsList"></div>
</div>

<script>
// ======= Utility =======
function showMessage(msg){ document.getElementById('message').textContent = msg; }

// ======= Key Management =======
function loadAllKeys(){
  const table = document.getElementById('keysTable');
  table.innerHTML = '<tr><th>Key</th><th>Name</th><th>Coins</th><th>Money</th><th>Purchased Skins</th><th>Actions</th></tr>';
  const skinsData = JSON.parse(localStorage.getItem('skinsDataPublished') || '[]');

  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data = JSON.parse(localStorage.getItem(k));
      const row = table.insertRow();
      row.dataset.storageKey = k;

      const keyCell = row.insertCell(0);
      keyCell.innerHTML = `<input value="${k.replace('skinshop_','')}" style="width:80px" onchange="updateKey('${k}', this.value)">`;

      const nameCell = row.insertCell(1);
      nameCell.innerHTML = `<input value="${data.name || ''}" onchange="updateField('${k}','name',this.value)">`;

      const coinsCell = row.insertCell(2);
      coinsCell.innerHTML = `<input type="number" value="${data.coins||0}" style="width:60px" onchange="updateField('${k}','coins',parseInt(this.value))">`;

      const moneyCell = row.insertCell(3);
      moneyCell.innerHTML = `<input type="number" step="0.01" value="${data.money||0}" style="width:60px" onchange="updateField('${k}','money',parseFloat(this.value))">`;

      const skinsCell = row.insertCell(4);
      skinsCell.innerHTML = '';
      const userOwned = data.owned || [];
      skinsData.forEach(skin=>{
        const img = document.createElement('img');
        img.src = skin.image || '';
        img.title = skin.name;
        img.className = 'skinThumb '+(userOwned.includes(skin.id)?'selected':'locked');
        img.onclick = ()=> toggleUserSkin(k, skin.id, img);
        skinsCell.appendChild(img);
      });

      const actions = row.insertCell(5);
      actions.innerHTML = `<button onclick="deleteKey('${k}')">Delete</button>`;
    }
  }
}

function addNewKey(){
  const name = document.getElementById('newName').value.trim();
  if(!name) return showMessage('Enter a name');
  const key = Math.random().toString(36).substring(2,10);
  localStorage.setItem('skinshop_'+key, JSON.stringify({name:name, coins:0, money:0, owned:[]}));
  document.getElementById('newName').value='';
  showMessage('✅ New key created: '+key);
  loadAllKeys();
}

function updateKey(oldKey, newKey){
  if(!newKey) return showMessage('Key cannot be empty');
  const data = JSON.parse(localStorage.getItem(oldKey));
  const newStorageKey = 'skinshop_' + newKey;
  localStorage.setItem(newStorageKey, JSON.stringify(data));
  if(newStorageKey!==oldKey) localStorage.removeItem(oldKey);
  showMessage('✅ Key updated');
  loadAllKeys();
}

function updateField(key, field, value){
  const data = JSON.parse(localStorage.getItem(key));
  data[field] = value;
  localStorage.setItem(key, JSON.stringify(data));
  showMessage('✅ Field updated');
}

function toggleUserSkin(key, skinId, imgEl){
  const data = JSON.parse(localStorage.getItem(key));
  if(!data.owned) data.owned=[];
  if(data.owned.includes(skinId)){
    data.owned = data.owned.filter(s=>s!==skinId);
    imgEl.classList.remove('selected'); imgEl.classList.add('locked');
  } else {
    data.owned.push(skinId);
    imgEl.classList.remove('locked'); imgEl.classList.add('selected');
  }
  localStorage.setItem(key, JSON.stringify(data));
}

function deleteKey(storageKey){
  if(confirm('Are you sure you want to delete this key?')){
    localStorage.removeItem(storageKey);
    showMessage('✅ Key deleted');
    loadAllKeys();
  }
}

// ======= Skin Editor =======
function openSkinEditor(){ document.getElementById('editor').style.display='block'; renderSkinEditor(); }
function getSkins(){ return JSON.parse(localStorage.getItem('skinsData')||'[]'); }

function renderSkinEditor(){
  const container=document.getElementById('skinsEditor'); container.innerHTML='';
  getSkins().forEach(skin=>{
    const div=document.createElement('div'); div.className='skinRow'; div.dataset.id=skin.id;
    div.innerHTML=`
      <input class="skinName" value="${skin.name}" placeholder="Name">
      <input class="skinPrice" value="${skin.price}" placeholder="Price">
      <select class="skinUseFor">
        <option value="coins" ${skin.useFor==='coins'?'selected':''}>Coins</option>
        <option value="deals" ${skin.useFor==='deals'?'selected':''}>Deals</option>
      </select>
      <input class="skinImage" value="${skin.image}" placeholder="Image URL">
      <input type="file" accept="image/*" onchange="uploadSkinImage(this,'${skin.id}')">
      <button onclick="deleteSkin('${skin.id}')">Delete</button>
    `;
    container.appendChild(div);
  });
}

function addSkin(){
  const id='skin'+Date.now();
  const container=document.getElementById('skinsEditor');
  const div=document.createElement('div'); div.className='skinRow'; div.dataset.id=id;
  div.innerHTML=`
    <input class="skinName" placeholder="Name">
    <input class="skinPrice" placeholder="Price">
    <select class="skinUseFor">
      <option value="coins">Coins</option>
      <option value="deals">Deals</option>
    </select>
    <input class="skinImage" placeholder="Image URL">
    <input type="file" accept="image/*" onchange="uploadSkinImage(this,'${id}')">
    <button onclick="deleteSkin('${id}')">Delete</button>
  `;
  container.appendChild(div);
}

function uploadSkinImage(input,id){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){ document.querySelector(`.skinRow[data-id='${id}'] .skinImage`).value=e.target.result; }
  reader.readAsDataURL(file);
}

function saveSkins(){
  const container=document.getElementById('skinsEditor');
  const skinElements=container.querySelectorAll('.skinRow');
  const skinsArr=[];
  skinElements.forEach(row=>{
    skinsArr.push({
      id: row.dataset.id,
      name: row.querySelector('.skinName').value,
      price: parseInt(row.querySelector('.skinPrice').value)||0,
      image: row.querySelector('.skinImage').value,
      useFor: row.querySelector('.skinUseFor').value
    });
  });
  localStorage.setItem('skinsData', JSON.stringify(skinsArr));
  alert('✅ Skins saved!');
}

function publishSkins(){ localStorage.setItem('skinsDataPublished', localStorage.getItem('skinsData')); alert('✅ Skins published!'); }

// ======= Event Editor =======
function openEventEditor(){ document.getElementById('eventEditor').style.display='block'; renderEventEditor(); }
function getEvents(){ return JSON.parse(localStorage.getItem('eventData')||'[]'); }

function renderEventEditor(){
  const container=document.getElementById('eventsList'); container.innerHTML='';
  getEvents().forEach((event,index)=>{
    const div=document.createElement('div'); div.className='eventRow'; div.dataset.index=index;
    const startVal=new Date(event.startTime).toISOString().slice(0,16);
    const endVal=new Date(event.endTime).toISOString().slice(0,16);
    div.innerHTML=`
      <input class="eventName" value="${event.name}" placeholder="Event Name">
      <input class="eventDesc" value="${event.desc}" placeholder="Event Description">
      <label>Status:</label>
      <select class="eventStatus">
        <option value="active" ${event.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${event.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${event.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <label>Start:</label><input class="eventStart" type="datetime-local" value="${startVal}">
      <label>End:</label><input class="eventEnd" type="datetime-local" value="${endVal}">
      <label>Image URL:</label><input class="eventImage" value="${event.image||''}" placeholder="Image URL">
      <input type="file" accept="image/*" onchange="uploadEventImage(this,${index})">
      <button onclick="deleteEvent(${index})">Delete</button>
    `;
    container.appendChild(div);
  });
}

function addEvent(){
  const events=getEvents();
  const id='event'+Date.now();
  events.push({id:id,name:'New Event',desc:'Description',status:'coming',startTime:Date.now(),endTime:Date.now()+3600000,image:''});
  localStorage.setItem('eventData', JSON.stringify(events));
  renderEventEditor();
}

function deleteEvent(index){ const events=getEvents(); events.splice(index,1); localStorage.setItem('eventData', JSON.stringify(events)); renderEventEditor(); }

function uploadEventImage(input,index){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){ const events=getEvents(); events[index].image=e.target.result; localStorage.setItem('eventData', JSON.stringify(events)); renderEventEditor(); }
  reader.readAsDataURL(file);
}

function publishEvents(){
  const container=document.getElementById('eventsList'); const events=[];
  container.querySelectorAll('.eventRow').forEach((div,index)=>{
    const startInput=div.querySelector('.eventStart').value;
    const endInput=div.querySelector('.eventEnd').value;
    const uniqueId=getEvents()[index]?.id || 'event'+Date.now();
    events.push({
      id:uniqueId,
      name:div.querySelector('.eventName').value,
      desc:div.querySelector('.eventDesc').value,
      status:div.querySelector('.eventStatus').value,
      startTime:new Date(startInput).getTime(),
      endTime:new Date(endInput).getTime(),
      image:div.querySelector('.eventImage').value
    });
  });
  localStorage.setItem('eventData', JSON.stringify(events));
  localStorage.setItem('eventDataPublished', JSON.stringify(events));
  alert('✅ Events published!');
}

// ======= Deal Editor =======
function openDealEditor(){ document.getElementById('dealEditor').style.display='block'; renderDealEditor(); }
function getDeals(){ return JSON.parse(localStorage.getItem('dealData')||'[]'); }

function renderDealEditor(){
  const container=document.getElementById('dealsList'); container.innerHTML='';
  const events=getEvents();
  const skins=getSkins();
  getDeals().forEach((deal,index)=>{
    const div=document.createElement('div'); div.className='dealRow'; div.dataset.index=index;
    const startVal=new Date(deal.startTime).toISOString().slice(0,16);
    const endVal=new Date(deal.endTime).toISOString().slice(0,16);
    const eventOptions=events.map(e=>`<option value="${e.id}" ${deal.eventId===e.id?'selected':''}>${e.name}</option>`).join('');
    const skinOptions=skins.map(s=>`<option value="${s.id}" ${deal.skins && deal.skins.includes(s.id)?'selected':''}>${s.name}</option>`).join('');
    div.innerHTML=`
      <input class="dealName" value="${deal.name}" placeholder="Deal Name">
      <input class="dealDesc" value="${deal.desc}" placeholder="Description">
      <input class="dealPrice" type="number" value="${deal.price||0}" placeholder="Price">
      <label>Status:</label>
      <select class="dealStatus">
        <option value="active" ${deal.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${deal.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${deal.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <label>Start:</label><input class="dealStart" type="datetime-local" value="${startVal}">
      <label>End:</label><input class="dealEnd" type="datetime-local" value="${endVal}">
      <label>Event:</label><select class="dealEvent">${eventOptions}</select>
      <label>Image URL:</label><input class="dealImage" value="${deal.image||''}" placeholder="Image URL">
      <input type="file" accept="image/*" onchange="uploadDealImage(this,${index})">
      <label>Assign Skins:</label>
      <select class="dealSkins" multiple style="width:200px;">${skinOptions}</select>
      <button onclick="deleteDeal(${index})">Delete</button>
    `;
    container.appendChild(div);
  });
}

function addDeal(){
  const deals=getDeals();
  deals.push({name:'New Deal',desc:'Description',status:'coming',startTime:Date.now(),endTime:Date.now()+3600000,price:0,eventId:'',image:'',skins:[]});
  localStorage.setItem('dealData', JSON.stringify(deals));
  renderDealEditor();
}

function uploadDealImage(input,index){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){ const deals=getDeals(); deals[index].image=e.target.result; localStorage.setItem('dealData', JSON.stringify(deals)); renderDealEditor(); }
  reader.readAsDataURL(file);
}

function deleteDeal(index){ const deals=getDeals(); deals.splice(index,1); localStorage.setItem('dealData', JSON.stringify(deals)); renderDealEditor(); }

function publishDeals(){
  const container=document.getElementById('dealsList'); const deals=[];
  container.querySelectorAll('.dealRow').forEach((div,index)=>{
    const startTime=new Date(div.querySelector('.dealStart').value).getTime();
    const endTime=new Date(div.querySelector('.dealEnd').value).getTime();
    const selectedSkins=[...div.querySelector('.dealSkins').selectedOptions].map(o=>o.value);
    deals.push({
      name:div.querySelector('.dealName').value,
      desc:div.querySelector('.dealDesc').value,
      price:parseFloat(div.querySelector('.dealPrice').value)||0,
      status:div.querySelector('.dealStatus').value,
      startTime:startTime,
      endTime:endTime,
      eventId:div.querySelector('.dealEvent').value,
      image:div.querySelector('.dealImage').value,
      skins:selectedSkins
    });
  });
  localStorage.setItem('dealData', JSON.stringify(deals));
  localStorage.setItem('dealDataPublished', JSON.stringify(deals));
  alert('✅ Deals published!');
}

// ======= Skin Delete =======
function deleteSkin(id){
  let skins=getSkins();
  skins=skins.filter(s=>s.id!==id);
  localStorage.setItem('skinsData', JSON.stringify(skins));
  renderSkinEditor();
}

// ======= Init =======
loadAllKeys();
</script>

</body>
</html>
