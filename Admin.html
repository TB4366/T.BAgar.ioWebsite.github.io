<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
label { display:block; margin-top:10px; }
input, select, textarea { width:100%; padding:8px; margin-top:5px; border-radius:5px; border:none; }
button { margin-top:10px; padding:10px 20px; border-radius:5px; border:none; cursor:pointer; background:#0af; color:#fff; }
.section { border:1px solid #555; padding:15px; margin:15px 0; border-radius:10px; background:#222; }
</style>
</head>
<body>

<h1>Admin Panel</h1>

<!-- ==================== SKINS ==================== -->
<div class="section">
  <h2>Skins</h2>
  <label>Name:</label><input id="skinName">
  <label>Price (Coins):</label><input id="skinPrice" type="number">
  <label>Image URL:</label><input id="skinImage">
  <button onclick="addSkin()">Add Skin</button>
  <button onclick="publishSkins()">Publish Skins</button>
  <ul id="skinList"></ul>
</div>

<!-- ==================== EVENTS ==================== -->
<div class="section">
  <h2>Events</h2>
  <label>Event Name:</label><input id="eventName">
  <label>Status:</label>
  <select id="eventStatus">
    <option value="coming">Coming Soon</option>
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
  </select>
  <label>Start Time:</label><input id="eventStart" type="datetime-local">
  <label>End Time:</label><input id="eventEnd" type="datetime-local">
  <label>Event Image (Active/Bar):</label><input id="eventImage">
  <label>Coming Soon Image (Optional):</label><input id="eventComingImage">
  <button onclick="addEvent()">Add Event</button>
  <button onclick="publishEvents()">Publish Events</button>
  <ul id="eventList"></ul>
</div>

<!-- ==================== DEALS ==================== -->
<div class="section">
  <h2>Deals</h2>
  <label>Name:</label><input id="dealName">
  <label>Description:</label><textarea id="dealDesc"></textarea>
  <label>Price (Money):</label><input id="dealPrice" type="number" step="0.01">
  <label>Image URL:</label><input id="dealImage">
  <label>Event:</label><select id="dealEvent"></select>
  <label>Status:</label>
  <select id="dealStatus">
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
  </select>
  <label>Start Time:</label><input id="dealStart" type="datetime-local">
  <label>End Time:</label><input id="dealEnd" type="datetime-local">
  <button onclick="addDeal()">Add Deal</button>
  <button onclick="publishDeals()">Publish Deals</button>
  <ul id="dealList"></ul>
</div>

<script>
let skins=[], events=[], deals=[];

// ==================== SKINS ====================
function addSkin(){
  const name=document.getElementById('skinName').value;
  const price=parseInt(document.getElementById('skinPrice').value);
  const image=document.getElementById('skinImage').value;
  if(!name||!price||!image){ alert("Fill all fields"); return; }
  skins.push({id:Date.now(), name, price, image});
  renderSkins();
}
function renderSkins(){
  const ul=document.getElementById('skinList'); ul.innerHTML='';
  skins.forEach(s=>{ const li=document.createElement('li'); li.textContent=`${s.name} - ${s.price}`; ul.appendChild(li); });
}
function publishSkins(){ localStorage.setItem('skinsDataPublished',JSON.stringify(skins)); alert("✅ Skins published!"); }

// ==================== EVENTS ====================
function addEvent(){
  const name=document.getElementById('eventName').value;
  let status=document.getElementById('eventStatus').value;
  const start=document.getElementById('eventStart').value;
  const end=document.getElementById('eventEnd').value;
  const image=document.getElementById('eventImage').value;
  const comingImage=document.getElementById('eventComingImage').value;

  if(!name||!status||!image){ alert("Fill all required fields"); return; }
  if(status==="coming" && (!comingImage || !start)){ alert("Coming Soon requires Coming Image and Start Time"); return; }

  let startTime=start?new Date(start).getTime():null;
  let endTime=end?new Date(end).getTime():null;

  // Automatische statuscontrole
  const now=Date.now();
  if(status==="coming" && startTime && now>=startTime){ status="active"; }

  events.push({
    id:Date.now(),
    name,
    status,
    startTime,
    endTime,
    image,
    comingImage
  });
  renderEvents();
  updateDealEventOptions();
}
function renderEvents(){
  const ul=document.getElementById('eventList'); ul.innerHTML='';
  const now=Date.now();
  events.forEach(ev=>{
    // check of event moet overschakelen
    if(ev.status==="coming" && ev.startTime && now>=ev.startTime){ ev.status="active"; }
    const li=document.createElement('li'); li.textContent=`${ev.name} - ${ev.status}`; ul.appendChild(li);
  });
}
function publishEvents(){ 
  // check ook bij publish
  const now=Date.now();
  events.forEach(ev=>{
    if(ev.status==="coming" && ev.startTime && now>=ev.startTime){ ev.status="active"; }
  });
  localStorage.setItem('eventDataPublished',JSON.stringify(events)); 
  alert("✅ Events published!"); 
}

// ==================== DEALS ====================
function addDeal(){
  const name=document.getElementById('dealName').value;
  const desc=document.getElementById('dealDesc').value;
  const price=parseFloat(document.getElementById('dealPrice').value);
  const image=document.getElementById('dealImage').value;
  const eventId=document.getElementById('dealEvent').value;
  const status=document.getElementById('dealStatus').value;
  const start=document.getElementById('dealStart').value;
  const end=document.getElementById('dealEnd').value;
  if(!name||!price||!image||!eventId){ alert("Fill all required fields"); return; }

  deals.push({
    id:Date.now(),
    name, desc, price, image,
    eventId:parseInt(eventId),
    status,
    startTime:start?new Date(start).getTime():null,
    endTime:end?new Date(end).getTime():null
  });
  renderDeals();
}
function renderDeals(){
  const ul=document.getElementById('dealList'); ul.innerHTML='';
  deals.forEach(d=>{ const li=document.createElement('li'); li.textContent=`${d.name} - ${d.status}`; ul.appendChild(li); });
}
function publishDeals(){ localStorage.setItem('dealDataPublished',JSON.stringify(deals)); alert("✅ Deals published!"); }

// ==================== Helper ====================
function updateDealEventOptions(){
  const sel=document.getElementById('dealEvent'); sel.innerHTML='';
  events.forEach(ev=>{ const opt=document.createElement('option'); opt.value=ev.id; opt.textContent=ev.name; sel.appendChild(opt); });
}
</script>
</body>
</html>
