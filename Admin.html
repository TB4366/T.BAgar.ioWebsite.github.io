<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button, select, textarea { padding:6px; margin:5px; border-radius:4px; border:none; font-size:14px; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
#editor, #eventEditor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.dealRow { margin-bottom:10px; display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
.dealRow input, .dealRow select, .dealRow textarea { flex:1; min-width:120px; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<!-- Event Editor -->
<div style="margin-top:20px;">
  <button onclick="openEventEditor()">Manage Deals / Events</button>
</div>

<div id="eventEditor">
  <h2>Deal / Event Editor</h2>
  <button onclick="addDeal()">Add New Deal</button>
  <button onclick="publishDeals()">Publish Deals</button>
  <div id="dealsList"></div>
</div>

<script>
// =======================
// Deal / Event Editor
// =======================
function getDeals(){ return JSON.parse(localStorage.getItem('dealData')||'[]'); }

function openEventEditor(){
  document.getElementById('eventEditor').style.display='block';
  renderDeals();
}

function renderDeals(){
  const container=document.getElementById('dealsList');
  container.innerHTML='';
  getDeals().forEach((deal,index)=>{
    const div=document.createElement('div');
    div.className='dealRow';
    div.dataset.index=index;

    const startVal = new Date(deal.startTime).toISOString().slice(0,16);
    const endVal = new Date(deal.endTime).toISOString().slice(0,16);

    div.innerHTML=`
      <input class="dealName" placeholder="Deal Name" value="${deal.name}">
      <textarea class="dealDesc" placeholder="Description">${deal.desc}</textarea>
      <input type="datetime-local" class="dealStart" value="${startVal}">
      <input type="datetime-local" class="dealEnd" value="${endVal}">
      <input class="dealImage" placeholder="Image URL" value="${deal.image}">
      <input type="file" accept="image/*" onchange="uploadDealImage(this, ${index})">
      <select class="dealStatus">
        <option value="active" ${deal.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${deal.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${deal.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <button onclick="deleteDeal(${index})">Delete</button>
    `;
    container.appendChild(div);
  });
}

function addDeal(){
  const deals = getDeals();
  deals.push({
    name:'New Deal',
    desc:'Description here',
    startTime: Date.now() + 60000,
    endTime: Date.now() + 3600000,
    image:'',
    status:'coming'
  });
  localStorage.setItem('dealData', JSON.stringify(deals));
  renderDeals();
}

function deleteDeal(index){
  const deals=getDeals();
  deals.splice(index,1);
  localStorage.setItem('dealData', JSON.stringify(deals));
  renderDeals();
}

function uploadDealImage(input, index){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const div=document.querySelector(`.dealRow[data-index='${index}']`);
    div.querySelector('.dealImage').value=e.target.result;
  }
  reader.readAsDataURL(file);
}

function publishDeals(){
  const container=document.getElementById('dealsList');
  const deals=[];
  container.querySelectorAll('.dealRow').forEach(div=>{
    const startInput=div.querySelector('.dealStart').value;
    const endInput=div.querySelector('.dealEnd').value;
    deals.push({
      name: div.querySelector('.dealName').value,
      desc: div.querySelector('.dealDesc').value,
      startTime: new Date(startInput).getTime(),
      endTime: new Date(endInput).getTime(),
      image: div.querySelector('.dealImage').value,
      status: div.querySelector('.dealStatus').value
    });
  });
  localStorage.setItem('dealData', JSON.stringify(deals)); // admin kopie
  localStorage.setItem('dealDataPublished', JSON.stringify(deals)); // user kopie
  alert('✅ Deals published for users!');
}
</script>

</body>
</html>
