<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button, select { padding:6px; margin:5px; border-radius:4px; border:none; font-size:14px; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
#editor, #eventEditor, #dealEditor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.skinRow, .eventRow, .dealRow { margin-bottom:10px; }
.skinRow input, .eventRow input, .dealRow input, .dealRow select { margin:3px; }

/* Circle for coming soon deals */
.dealCircle { width:80px; height:80px; border-radius:50%; overflow:hidden; margin-bottom:5px; border:2px solid #ff0; }
.dealCircle img { width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<h3>Add New Key</h3>
<input id="newName" placeholder="Enter Name">
<button onclick="addNewKey()">Add Key</button>

<h3>All Keys</h3>
<table id="keysTable">

  <th>Key</th>

  <th>Coins</th>
  <th>Money</th>
  <th>Purchased Skins</th>
  <th>Actions</th>
</tr>
</table>

<div style="margin-top:20px;">
  <button onclick="openSkinEditor()">Edit Skins</button>
</div>
<div id="editor">
  <h2>Skin Editor</h2>
  <button onclick="saveSkins()">Save Skins</button>
  <button onclick="publishSkins()">Publish Skins</button>
  <button onclick="addSkin()">Add Skin</button>
  <div id="skinsEditor"></div>
</div>

<!-- Event Editor -->
<div style="margin-top:20px;">
  <button onclick="openEventEditor()">Manage Events</button>
</div>
<div id="eventEditor">
  <h2>Event Editor</h2>
  <button onclick="addEvent()">Add Event</button>
  <button onclick="publishEvents()">Publish Events</button>
  <div id="eventsList"></div>
</div>

<!-- Deal Editor -->
<div style="margin-top:20px;">
  <button onclick="openDealEditor()">Manage Deals</button>
</div>
<div id="dealEditor">
  <h2>Deal Editor</h2>
  <button onclick="addDeal()">Add Deal</button>
  <button onclick="publishDeals()">Publish Deals</button>
  <div id="dealsList"></div>
</div>

<script>
// =======================
// Key Management
// =======================
function loadAllKeys(){ /* unchanged */ }
function showMessage(msg){ document.getElementById('message').textContent=msg; }
function addNewKey(){ /* unchanged */ }
function editKey(storageKey){ /* unchanged */ }
function deleteKey(storageKey){ /* unchanged */ }
loadAllKeys();

// =======================
// Skin Editor
// =======================
function openSkinEditor(){ /* unchanged */ }
function getSkins(){ return JSON.parse(localStorage.getItem('skinsData')||'[]'); }
function renderSkinEditor(){ /* unchanged */ }
function addSkin(){ /* unchanged */ }
function uploadSkinImage(input, id){ /* unchanged */ }
function saveSkins(){ /* unchanged */ }
function publishSkins(){ /* unchanged */ }
function deleteSkin(id){ /* unchanged */ }

// =======================
// Event Editor
// =======================
function openEventEditor(){ /* unchanged */ }
function getEvents(){ return JSON.parse(localStorage.getItem('eventData')||'[]'); }
function renderEventEditor(){ /* unchanged */ }
function addEvent(){ /* unchanged */ }
function deleteEvent(index){ /* unchanged */ }
function publishEvents(){ /* unchanged */ }

// =======================
// Deal Editor
// =======================
function openDealEditor(){ renderDealEditor(); document.getElementById('dealEditor').style.display='block'; }
function getDeals(){ return JSON.parse(localStorage.getItem('dealData')||'[]'); }

function renderDealEditor(){
  const container = document.getElementById('dealsList');
  container.innerHTML='';
  const events = getEvents();

  getDeals().forEach((deal,index)=>{
    const div = document.createElement('div');
    div.className='dealRow';
    div.dataset.index=index;

    const startVal = new Date(deal.startTime).toISOString().slice(0,16);
    const endVal = new Date(deal.endTime).toISOString().slice(0,16);

    let eventOptions = events.map(e=>`<option value="${e.id}" ${deal.eventId===e.id?'selected':''}>${e.name}</option>`).join('');

    div.innerHTML=`
      <div style="margin-bottom:10px; padding:5px; border:1px solid #0af; border-radius:5px;">
        <div class="dealCircle"><img src="${deal.image||''}"></div>
        <input class="dealName" placeholder="Deal Name" value="${deal.name}">
        <input class="dealDesc" placeholder="Description" value="${deal.desc}">
        <label>Status:</label>
        <select class="dealStatus">
          <option value="active" ${deal.status==='active'?'selected':''}>Active</option>
          <option value="coming" ${deal.status==='coming'?'selected':''}>Coming Soon</option>
          <option value="inactive" ${deal.status==='inactive'?'selected':''}>Inactive</option>
        </select>
        <label>Start:</label>
        <input class="dealStart" type="datetime-local" value="${startVal}">
        <label>End:</label>
        <input class="dealEnd" type="datetime-local" value="${endVal}">
        <label>Event:</label>
        <select class="dealEvent">${eventOptions}</select>
        <label>Image URL:</label>
        <input class="dealImage" placeholder="Image URL" value="${deal.image||''}">
        <input type="file" accept="image/*" onchange="uploadDealImage(this, ${index})">
        <label>Price:</label>
        <input class="dealPrice" type="number" placeholder="Price" value="${deal.price||0}">
        <label>URL Link:</label>
        <input class="dealURL" placeholder="Enter URL" value="${deal.url||''}">
        <button onclick="deleteDeal(${index})">Delete</button>
      </div>
    `;
    container.appendChild(div);
  });
}

function addDeal(){
  const deals = getDeals();
  deals.push({
    name:'New Deal', desc:'Description', status:'coming',
    startTime:Date.now() + 60000,
    endTime:Date.now() + 3600000,
    image:'', price:0, url:'', eventId:''
  });
  localStorage.setItem('dealData', JSON.stringify(deals));
  renderDealEditor();
}

function uploadDealImage(input, index){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const deals = getDeals();
    deals[index].image = e.target.result;
    localStorage.setItem('dealData', JSON.stringify(deals));
    renderDealEditor();
  }
  reader.readAsDataURL(file);
}

function deleteDeal(index){
  const deals = getDeals();
  deals.splice(index,1);
  localStorage.setItem('dealData', JSON.stringify(deals));
  renderDealEditor();
}

function publishDeals(){
  const container = document.getElementById('dealsList');
  const deals = [];
  container.querySelectorAll('.dealRow').forEach((div,index)=>{
    const startTime = new Date(div.querySelector('.dealStart').value).getTime();
    const endTime = new Date(div.querySelector('.dealEnd').value).getTime();
    deals.push({
      id:'deal'+Date.now()+index,
      name: div.querySelector('.dealName').value,
      desc: div.querySelector('.dealDesc').value,
      status: div.querySelector('.dealStatus').value,
      startTime: startTime,
      endTime: endTime,
      image: div.querySelector('.dealImage').value,
      price: parseFloat(div.querySelector('.dealPrice').value)||0,
      url: div.querySelector('.dealURL').value || '',
      eventId: div.querySelector('.dealEvent').value
    });
  });

  // Check missing event
  let missingEvent = deals.filter(d => !d.eventId || d.eventId.trim() === '');
  if(missingEvent.length > 0){ alert(`${missingEvent.length} deal(s) hebben geen event geselecteerd.`); return; }

  localStorage.setItem('dealData', JSON.stringify(deals));
  localStorage.setItem('dealDataPublished', JSON.stringify(deals));
  alert('✅ Deals published for users!');
}
</script>
</body>
</html>
