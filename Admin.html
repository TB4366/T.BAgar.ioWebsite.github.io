<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button, select { padding:6px; margin:5px; border-radius:4px; border:none; font-size:14px; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
#editor, #eventEditor, #dealEditor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.skinRow, .eventRow, .dealRow { margin-bottom:10px; }
.skinRow input, .eventRow input, .dealRow input, .dealRow select { margin:3px; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<h3>Add New Key</h3>
<input id="newName" placeholder="Enter Name">
<button onclick="addNewKey()">Add Key</button>

<h3>All Keys</h3>
<table id="keysTable">
<tr>
  <th>Key</th>
  <th>Name</th>
  <th>Coins</th>
  <th>Money</th>
  <th>Purchased Skins</th>
  <th>Actions</th>
</tr>
</table>

<!-- Skin Editor -->
<div style="margin-top:20px;">
  <button onclick="openSkinEditor()">Edit Skins</button>
</div>
<div id="editor">
  <h2>Skin Editor</h2>
  <button onclick="saveSkins()">Save Skins</button>
  <button onclick="publishSkins()">Publish Skins</button>
  <button onclick="addSkin()">Add Skin</button>
  <div id="skinsEditor"></div>
</div>

<!-- Event Editor -->
<div style="margin-top:20px;">
  <button onclick="openEventEditor()">Manage Events</button>
</div>
<div id="eventEditor">
  <h2>Event Editor</h2>
  <button onclick="addEvent()">Add Event</button>
  <button onclick="publishEvents()">Publish Events</button>
  <div id="eventsList"></div>
</div>

<!-- Deal Editor -->
<div style="margin-top:20px;">
  <button onclick="openDealEditor()">Manage Deals</button>
</div>
<div id="dealEditor">
  <h2>Deal Editor</h2>
  <button onclick="addDeal()">Add Deal</button>
  <button onclick="publishDeals()">Publish Deals</button>
  <div id="dealsList"></div>
</div>

<script>
/* =======================
   Key Management
======================= */
function loadAllKeys(){
  const table = document.getElementById('keysTable');
  table.innerHTML='<tr><th>Key</th><th>Name</th><th>Coins</th><th>Money</th><th>Purchased Skins</th><th>Actions</th></tr>';
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data = JSON.parse(localStorage.getItem(k));
      const row = table.insertRow();
      row.insertCell(0).innerText = k.replace('skinshop_','');
      row.insertCell(1).innerText = data.name || '';
      row.insertCell(2).innerText = data.coins || 0;
      row.insertCell(3).innerText = data.money ? data.money.toFixed(2) : '0.00';
      row.insertCell(4).innerText = data.owned ? data.owned.join(', ') : '';
      const actions = row.insertCell(5);
      actions.innerHTML=`
        <button onclick="editKey('${k}')">Edit</button>
        <button onclick="deleteKey('${k}')">Delete</button>
      `;
    }
  }
}
function showMessage(msg){ document.getElementById('message').textContent=msg; }
function addNewKey(){
  const name = document.getElementById('newName').value.trim();
  if(!name) return showMessage('Enter a name');
  const key = Math.random().toString(36).substring(2,10);
  localStorage.setItem('skinshop_'+key, JSON.stringify({name:name, coins:0, money:0, owned:[]}));
  showMessage('✅ New key created: '+key);
  document.getElementById('newName').value='';
  loadAllKeys();
}
function editKey(storageKey){
  const options = prompt('Choose an option:\n1 - Manage Coins/Money\n2 - Change Key\n3 - Change Name');
  if(!options) return;
  const data = JSON.parse(localStorage.getItem(storageKey));
  switch(options){
    case '1':
      const action = prompt('Type "add" to add or "remove" to remove');
      if(!action) return;
      const amount = parseFloat(prompt('Enter amount'));
      if(isNaN(amount)) return showMessage('Invalid amount');
      const type = prompt('Type "coins" or "money"');
      if(type==='coins'){
        if(action.toLowerCase() === 'add') data.coins = (data.coins||0)+amount;
        else data.coins = Math.max((data.coins||0)-amount,0);
      } else if(type==='money'){
        if(action.toLowerCase() === 'add') data.money = (data.money||0)+amount;
        else data.money = Math.max((data.money||0)-amount,0);
      } else return showMessage('Invalid type');
      localStorage.setItem(storageKey, JSON.stringify(data));
      showMessage('✅ Coins/Money updated');
      break;
    case '2':
      const newKey = prompt('Enter new key:', storageKey.replace('skinshop_',''));
      if(!newKey) return;
      const newStorageKey = 'skinshop_'+newKey;
      localStorage.setItem(newStorageKey, JSON.stringify(data));
      if(newStorageKey!==storageKey) localStorage.removeItem(storageKey);
      showMessage('✅ Key updated');
      break;
    case '3':
      const newName = prompt('Enter new name:', data.name);
      if(!newName) return;
      data.name = newName;
      localStorage.setItem(storageKey, JSON.stringify(data));
      showMessage('✅ Name updated');
      break;
    default: showMessage('Invalid option'); break;
  }
  loadAllKeys();
}
function deleteKey(storageKey){
  if(confirm('Are you sure you want to delete this key?')){
    localStorage.removeItem(storageKey);
    showMessage('✅ Key deleted');
    loadAllKeys();
  }
}
loadAllKeys();

/* =======================
   Skin Editor
======================= */
function openSkinEditor(){ document.getElementById('editor').style.display='block'; renderSkinEditor(); }
function getSkins(){ return JSON.parse(localStorage.getItem('skinsData')||'[]'); }
function renderSkinEditor(){
  const container = document.getElementById('skinsEditor'); container.innerHTML='';
  getSkins().forEach(skin=>{
    const div = document.createElement('div'); div.className='skinRow'; div.dataset.id = skin.id;
    div.innerHTML=`
      <input class="skinName" value="${skin.name}" placeholder="Name">
      <input class="skinPrice" value="${skin.price}" placeholder="Price">
      <input class="skinImage" value="${skin.image}" placeholder="Image URL">
      <input type="file" accept="image/*" onchange="uploadSkinImage(this, '${skin.id}')">
      <button onclick="deleteSkin('${skin.id}')">Delete</button>`;
    container.appendChild(div);
  });
}
function addSkin(){
  const id = 'skin'+Date.now(); const container = document.getElementById('skinsEditor');
  const div = document.createElement('div'); div.className='skinRow'; div.dataset.id = id;
  div.innerHTML=`
    <input class="skinName" placeholder="Name">
    <input class="skinPrice" placeholder="Price">
    <input class="skinImage" placeholder="Image URL">
    <input type="file" accept="image/*" onchange="uploadSkinImage(this, '${id}')">
    <button onclick="deleteSkin('${id}')">Delete</button>`;
  container.appendChild(div);
}
function uploadSkinImage(input, id){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{ const row = document.querySelector(\`.skinRow[data-id='${id}'] .skinImage\`); row.value = e.target.result; };
  reader.readAsDataURL(file);
}
function saveSkins(){
  const container = document.getElementById('skinsEditor'); const skinsArr = [];
  container.querySelectorAll('.skinRow').forEach(row=>{
    skinsArr.push({ id: row.dataset.id, name: row.querySelector('.skinName').value, price: parseInt(row.querySelector('.skinPrice').value)||0, image: row.querySelector('.skinImage').value });
  });
  localStorage.setItem('skinsData', JSON.stringify(skinsArr)); alert('✅ Skins saved!');
}
function publishSkins(){ localStorage.setItem('skinsDataPublished', localStorage.getItem('skinsData')); alert('✅ Skins published for users!'); }
function deleteSkin(id){ const row = document.querySelector(\`.skinRow[data-id='${id}']\`); if(row) row.remove(); }

/* =======================
   Event Editor
======================= */
function openEventEditor(){ document.getElementById('eventEditor').style.display='block'; renderEventEditor(); }
function getEvents(){ return JSON.parse(localStorage.getItem('eventData')||'[]'); }
function renderEventEditor(){
  const container = document.getElementById('eventsList'); container.innerHTML='';
  getEvents().forEach((event,index)=>{
    const div = document.createElement('div'); div.className='eventRow'; div.dataset.index = index;
    const startVal = new Date(event.startTime).toISOString().slice(0,16);
    const endVal = new Date(event.endTime).toISOString().slice(0,16);
    div.innerHTML=`
      <input class="eventName" value="${event.name}">
      <input class="eventDesc" value="${event.desc}">
      <label>Status:</label>
      <select class="eventStatus">
        <option value="active" ${event.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${event.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${event.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <label>Start:</label><input class="eventStart" type="datetime-local" value="${startVal}">
      <label>End:</label><input class="eventEnd" type="datetime-local" value="${endVal}">
      <label>Bar Image:</label><input class="eventBarImage" value="${event.barImage||''}">
      <label>Active Image:</label><input class="eventImage" value="${event.image||''}">
      <label>Coming Soon Image:</label><input class="eventComingImage" value="${event.comingImage||''}">
      <button onclick="deleteEvent(${index})">Delete</button>`;
    container.appendChild(div);
  });
}
function addEvent(){
  const events = getEvents(); const id = 'event'+Date.now();
  events.push({ id, name:'New Event', desc:'Description', status:'active', startTime: Date.now()+60000, endTime: Date.now()+3600000, barImage:'', image:'', comingImage:'' });
  localStorage.setItem('eventData', JSON.stringify(events)); renderEventEditor();
}
function deleteEvent(index){ const events = getEvents(); events.splice(index,1); localStorage.setItem('eventData', JSON.stringify(events)); renderEventEditor(); }
function publishEvents(){
  const container = document.getElementById('eventsList'); const events = [];
  container.querySelectorAll('.eventRow').forEach((div,index)=>{
    const startInput = div.querySelector('.eventStart').value; const endInput = div.querySelector('.eventEnd').value;
    const uniqueId = getEvents()[index]?.id || 'event'+Date.now();
    events.push({ id:uniqueId, name:div.querySelector('.eventName').value, desc:div.querySelector('.eventDesc').value, status:div.querySelector('.eventStatus').value,
      startTime:new Date(startInput).getTime(), endTime:new Date(endInput).getTime(), barImage:div.querySelector('.eventBarImage').value,
      image:div.querySelector('.eventImage').value, comingImage:div.querySelector('.eventComingImage').value });
  });
  localStorage.setItem('eventData', JSON.stringify(events)); localStorage.setItem('eventDataPublished', JSON.stringify(events));
  alert('✅ Events published for users!');
}

/* =======================
   Deal Editor
======================= */
function openDealEditor(){ document.getElementById('dealEditor').style.display='block'; renderDealEditor(); }
function getDeals(){ return JSON.parse(localStorage.getItem('dealData')||'[]'); }
function renderDealEditor(){
  const container = document.getElementById('dealsList'); container.innerHTML=''; const events = getEvents();
  getDeals().forEach((deal,index)=>{
    const div = document.createElement('div'); div.className='dealRow'; div.dataset.index=index;
    const startVal = new Date(deal.startTime).toISOString().slice(0,16); const endVal = new Date(deal.endTime).toISOString().slice(0,16);
    let eventOptions = events.map(e=>`<option value="${e.id}" ${deal.eventId===e.id?'selected':''}>${e.name}</option>`).join('');
    let rowStyle = (!deal.eventId || deal.eventId.trim()==='') ? 'background:#440000; padding:5px; border-radius:5px;' : '';
    div.innerHTML=`
      <div style="${rowStyle}">
      <input class="dealName" value="${deal.name}">
      <input class="dealDesc" value="${deal.desc}">
      <label>Status:</label>
      <select class="dealStatus">
        <option value="active" ${deal.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${deal.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${deal.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <label>Start:</label><input class="dealStart" type="datetime-local" value="${startVal}">
      <label>End:</label><input class="dealEnd" type="datetime-local" value="${endVal}">
      <label>Event:</label><select class="dealEvent">${eventOptions}</select>
      <label>Image:</label><input class="dealImage" value="${deal.image||''}">
      <input type="file" accept="image/*" onchange="uploadDealImage(this, ${index}, 'active')">
      <label>Price:</label><input class="dealPrice" type="number" value="${deal.price||0}">
      <label>URL:</label><input class="dealURL" value="${deal.url||''}">
      <button onclick="deleteDeal(${index})">Delete</button>
      </div>`;
    container.appendChild(div);
  });
}
function addDeal(){ const deals = getDeals(); deals.push({ name:'New Deal', desc:'Description', status:'coming', startTime:Date.now()+60000, endTime:Date.now()+3600000, image:'', price:0, url:'', eventId:'' });
  localStorage.setItem('dealData', JSON.stringify(deals)); renderDealEditor(); }
function uploadDealImage(input,index){ const file = input.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = e=>{ const deals=getDeals(); deals[index].image=e.target.result; localStorage.setItem('dealData',JSON.stringify(deals)); renderDealEditor(); }; reader.readAsDataURL(file); }
function deleteDeal(index){ const deals=getDeals(); deals.splice(index,1); localStorage.setItem('dealData',JSON.stringify(deals)); renderDealEditor(); }
function publishDeals(){
  const container=document.getElementById('dealsList'); const deals=[];
  container.querySelectorAll('.dealRow').forEach((div,index)=>{
    deals.push({ name:div.querySelector('.dealName').value, desc:div.querySelector('.dealDesc').value, status:div.querySelector('.dealStatus').value,
      startTime:new Date(div.querySelector('.dealStart').value).getTime(), endTime:new Date(div.querySelector('.dealEnd').value).getTime(),
      image:div.querySelector('.dealImage').value, price:parseFloat(div.querySelector('.dealPrice').value)||0, url:div.querySelector('.dealURL').value||'', eventId:div.querySelector('.dealEvent').value });
  });
  let missingEvent=deals.filter(d=>!d.eventId||d.eventId.trim()===''); if(missingEvent.length>0){ alert(`⚠ ${missingEvent.length} deal(s) have no event linked. Please select an event before publishing.`); return; }
  localStorage.setItem('dealData',JSON.stringify(deals)); localStorage.setItem('dealDataPublished',JSON.stringify(deals));
  alert('✅ Deals published for users!');
}
</script>
</body>
</html>
