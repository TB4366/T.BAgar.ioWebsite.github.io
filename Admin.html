<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Admin Panel - Skin Shop</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#0b0b0b; color:#eee; padding:18px; }
  h1 { color:#0af; margin-bottom:6px; }
  input, button, select { padding:7px 10px; border-radius:6px; border:0; font-size:14px; }
  button { cursor:pointer; background:#0af; color:#000; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th, td { border:1px solid rgba(255,255,255,0.06); padding:8px; text-align:left; vertical-align:middle; }
  th { background:#111; color:#9fdcff; }
  .skinPreview { width:48px; height:48px; border-radius:8px; object-fit:cover; border:2px solid #0af; margin-right:4px; }
  .userSkins { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

  /* editors */
  #editor, #eventEditor, #dealEditor { display:none; margin-top:18px; border:2px solid #0af; padding:12px; border-radius:8px; background:#0f0f0f; }
  .skinRow, .eventRow, .dealRow { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }

  /* user-skins modal (gallery) */
  #userSkinsModal {
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:820px;
    max-width:94%;
    max-height:86vh;
    overflow:auto;
    background:#0f1112;
    border:2px solid #0af;
    padding:14px;
    z-index:9999;
    border-radius:10px;
  }
  #userSkinsModal h3{ margin:0 0 10px 0; color:#9ff; }
  .skinsGrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap:12px; }
  .skinCard {
    background:#121212; border-radius:10px; padding:8px; text-align:center; cursor:pointer; position:relative;
    transition: transform .08s, box-shadow .08s;
    border:2px solid transparent;
  }
  .skinCard:hover { transform:translateY(-4px); box-shadow:0 6px 22px rgba(0,0,0,0.6); }
  .skinCard img { width:96px; height:96px; object-fit:cover; border-radius:50%; display:block; margin:0 auto 6px; }
  .skinCard .skinName { font-size:13px; color:#ddd; }
  .skinCard.grayed { opacity:0.48; filter:grayscale(80%); }
  .skinCard.selected { border-color:#ffd700; box-shadow:0 0 0 4px rgba(255,215,0,0.08); }
  .modalActions { display:flex; justify-content:space-between; gap:8px; margin-top:10px; }
  .closeBtn { background:#222; color:#fff; border-radius:8px; padding:8px 10px; border:1px solid rgba(255,255,255,0.06); }

  /* small */
  @media (max-width:560px){ .skinCard img{ width:72px; height:72px; } .skinCard { padding:6px; } }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow; margin-bottom:8px;"></div>

<!-- Keys -->
<section>
  <h3>Nieuwe key toevoegen</h3>
  <input id="newName" placeholder="Vul naam in">
  <button onclick="addNewKey()">Add Key</button>

  <h3 style="margin-top:16px;">Alle Keys</h3>
  <table id="keysTable" aria-live="polite">
    <tr>
      <th>Key</th>
      <th>Naam</th>
      <th>Coins</th>
      <th>Money</th>
      <th>Gekochte skins</th>
      <th>Acties</th>
    </tr>
  </table>
</section>

<!-- Skin Editor -->
<section style="margin-top:20px;">
  <button onclick="openSkinEditor()">Edit Skins</button>
  <div id="editor" aria-hidden="true">
    <h2>Skin Editor</h2>
    <div style="margin-bottom:8px;">
      <button onclick="saveSkins()">Save Skins</button>
      <button onclick="publishSkins()">Publish Skins</button>
      <button onclick="addSkin()">Add Skin</button>
    </div>
    <div id="skinsEditor"></div>
  </div>
</section>

<!-- Event Editor -->
<section style="margin-top:20px;">
  <button onclick="openEventEditor()">Manage Events</button>
  <div id="eventEditor" aria-hidden="true">
    <h2>Event Editor</h2>
    <div style="margin-bottom:8px;">
      <button onclick="addEvent()">Add Event</button>
      <button onclick="publishEvents()">Publish Events</button>
    </div>
    <div id="eventsList"></div>
  </div>
</section>

<!-- Deal Editor -->
<section style="margin-top:20px;">
  <button onclick="openDealEditor()">Manage Deals</button>
  <div id="dealEditor" aria-hidden="true">
    <h2>Deal Editor</h2>
    <div style="margin-bottom:8px;">
      <button onclick="addDeal()">Add Deal</button>
      <button onclick="publishDeals()">Publish Deals</button>
    </div>
    <div id="dealsList"></div>
  </div>
</section>

<!-- User skins modal -->
<div id="userSkinsModal" role="dialog" aria-modal="true" aria-labelledby="userSkinsTitle">
  <h3 id="userSkinsTitle">Manage user skins</h3>
  <div id="userSkinsInfo" style="margin-bottom:8px; color:#ccc;"></div>
  <div class="skinsGrid" id="allSkinsGallery"></div>
  <div class="modalActions">
    <div>
      <button class="closeBtn" onclick="saveAndCloseUserSkins()">Save & Close</button>
      <button class="closeBtn" onclick="closeUserSkinsModal()">Close</button>
    </div>
    <div style="color:#9cf; align-self:center;">Klik op een skin om te toggle (toevoegen / verwijderen)</div>
  </div>
</div>

<script>
/*
Admin HTML full: 
- Keys editable (inline): name, coins, money
- Manage user skins opens gallery with all skins
  * owned skins: normal
  * unowned skins: grayed (opacity)
  * clicking toggles ownership immediately in UI and persists to storage when saving
- Skin/Event/Deal editors unchanged except integration with published lists
*/

// --- Helpers / storage getters ---
function showMessage(msg){ document.getElementById('message').textContent = msg; setTimeout(()=>{ document.getElementById('message').textContent=''; },3500); }

function getSkins(){ return JSON.parse(localStorage.getItem('skinsData') || '[]'); }
function getPublishedSkins(){ return JSON.parse(localStorage.getItem('skinsDataPublished') || '[]'); }
function getDeals(){ return JSON.parse(localStorage.getItem('dealData') || '[]'); }
function getEvents(){ return JSON.parse(localStorage.getItem('eventData') || '[]'); }

// --- Load Keys table ---
function loadAllKeys(){
  const table = document.getElementById('keysTable');
  table.innerHTML = '<tr><th>Key</th><th>Naam</th><th>Coins</th><th>Money</th><th>Gekochte skins</th><th>Acties</th></tr>';
  // iterate storage keys
  for(let i=0;i<localStorage.length;i++){
    const storageKey = localStorage.key(i);
    if(!storageKey) continue;
    if(!storageKey.startsWith('skinshop_')) continue;
    let data;
    try { data = JSON.parse(localStorage.getItem(storageKey)); } catch(e){ data = null; }
    if(!data) continue;
    const row = table.insertRow();
    row.insertCell(0).innerText = storageKey.replace('skinshop_','');

    // name inline input
    const nameCell = row.insertCell(1);
    const nameInput = document.createElement('input');
    nameInput.value = data.name || '';
    nameInput.onchange = ()=> updateKeyField(storageKey, 'name', nameInput.value);
    nameCell.appendChild(nameInput);

    // coins
    const coinsCell = row.insertCell(2);
    const coinsInput = document.createElement('input');
    coinsInput.type='number'; coinsInput.value = data.coins || 0;
    coinsInput.onchange = ()=> updateKeyField(storageKey, 'coins', parseInt(coinsInput.value) || 0);
    coinsCell.appendChild(coinsInput);

    // money
    const moneyCell = row.insertCell(3);
    const moneyInput = document.createElement('input');
    moneyInput.type='number'; moneyInput.step='0.01'; moneyInput.value = data.money || 0;
    moneyInput.onchange = ()=> updateKeyField(storageKey, 'money', parseFloat(moneyInput.value) || 0);
    moneyCell.appendChild(moneyInput);

    // purchased skins preview
    const purchasedCell = row.insertCell(4);
    const container = document.createElement('div'); container.className='userSkins';
    const published = getPublishedSkins();
    (data.owned || []).forEach(sid=>{
      const s = published.find(x=>x.id===sid) || getSkins().find(x=>x.id===sid);
      if(s){
        const img = document.createElement('img');
        img.src = s.image || '';
        img.alt = s.name || sid;
        img.className = 'skinPreview';
        container.appendChild(img);
      } else {
        // if skin not in published list (maybe admin removed) still show placeholder
        const placeholder = document.createElement('div');
        placeholder.style.cssText='width:48px;height:48px;border-radius:8px;background:#222;display:inline-block;line-height:48px;text-align:center;color:#888;border:2px solid #333';
        placeholder.textContent = sid;
        container.appendChild(placeholder);
      }
    });
    purchasedCell.appendChild(container);

    // actions
    const actionsCell = row.insertCell(5);
    const manageBtn = document.createElement('button'); manageBtn.textContent='Manage Skins';
    manageBtn.onclick = ()=> openUserSkinsModal(storageKey);
    const delBtn = document.createElement('button'); delBtn.textContent='Delete'; delBtn.onclick = ()=> { if(confirm('Delete this key?')){ localStorage.removeItem(storageKey); loadAllKeys(); } };
    actionsCell.appendChild(manageBtn); actionsCell.appendChild(document.createTextNode(' ')); actionsCell.appendChild(delBtn);
  }
}

// update inline field on key object
function updateKeyField(storageKey, field, value){
  const data = JSON.parse(localStorage.getItem(storageKey) || '{}');
  data[field] = value;
  localStorage.setItem(storageKey, JSON.stringify(data));
  showMessage('✅ Key updated');
  // refresh previews
  loadAllKeys();
}

// --- User skins modal logic ---
let currentUserKeyForModal = null;
let modalOwnedSet = new Set();

function openUserSkinsModal(storageKey){
  currentUserKeyForModal = storageKey;
  const data = JSON.parse(localStorage.getItem(storageKey) || '{}');
  const owned = data.owned || [];
  modalOwnedSet = new Set(owned);

  document.getElementById('userSkinsInfo').textContent = `User: ${storageKey.replace('skinshop_','')} — klik skins om te toggle ownership`;
  renderAllSkinsGallery();
  document.getElementById('userSkinsModal').style.display = 'block';
  // focus
  document.getElementById('userSkinsModal').scrollTop = 0;
}

function closeUserSkinsModal(){
  document.getElementById('userSkinsModal').style.display = 'none';
  currentUserKeyForModal = null;
  modalOwnedSet = new Set();
}

// Render gallery showing all skins with states
function renderAllSkinsGallery(){
  const gallery = document.getElementById('allSkinsGallery');
  gallery.innerHTML = '';
  const allSk = getSkins();
  // ensure deterministic order
  allSk.sort((a,b)=> (a.name||'').localeCompare(b.name||''));
  allSk.forEach(skin=>{
    const card = document.createElement('div');
    card.className = 'skinCard';
    // if not owned by user -> grayed
    if(!modalOwnedSet.has(skin.id)) card.classList.add('grayed');
    if(modalOwnedSet.has(skin.id)) card.classList.add('selected');

    card.dataset.skinId = skin.id;
    const img = document.createElement('img'); img.src = skin.image || ''; img.alt = skin.name || skin.id;
    const nameDiv = document.createElement('div'); nameDiv.className='skinName'; nameDiv.textContent = skin.name || skin.id;

    card.appendChild(img);
    card.appendChild(nameDiv);

    // click toggles owned state in modal set and visually
    card.addEventListener('click', ()=>{
      const sid = card.dataset.skinId;
      if(modalOwnedSet.has(sid)){
        modalOwnedSet.delete(sid);
        card.classList.remove('selected');
        card.classList.add('grayed');
      } else {
        modalOwnedSet.add(sid);
        card.classList.add('selected');
        card.classList.remove('grayed');
      }
    });

    gallery.appendChild(card);
  });

  // If there are no skins at all, show message
  if(allSk.length === 0){
    gallery.innerHTML = '<div style="color:#bbb;">Geen skins beschikbaar. Voeg eerst skins toe in Skin Editor.</div>';
  }
}

// Save and close: persist changes to user's owned array
function saveAndCloseUserSkins(){
  if(!currentUserKeyForModal) return closeUserSkinsModal();
  const data = JSON.parse(localStorage.getItem(currentUserKeyForModal) || '{}');
  data.owned = Array.from(modalOwnedSet);
  localStorage.setItem(currentUserKeyForModal, JSON.stringify(data));
  showMessage('✅ User skins updated');
  closeUserSkinsModal();
  loadAllKeys();
}

// --- Skin Editor (unchanged core behavior) ---
function openSkinEditor(){
  document.getElementById('editor').style.display = 'block';
  renderSkinEditor();
}
function renderSkinEditor(){
  const container = document.getElementById('skinsEditor');
  container.innerHTML = '';
  const skins = getSkins();
  skins.forEach(skin=>{
    const div = document.createElement('div'); div.className='skinRow'; div.dataset.id = skin.id;
    div.innerHTML = `
      <input class="skinName" value="${skin.name||''}" placeholder="Name">
      <input class="skinPrice" value="${skin.price||0}" placeholder="Price">
      <select class="skinUseFor">
        <option value="coins" ${skin.useFor==='coins'?'selected':''}>Coins</option>
        <option value="deals" ${skin.useFor==='deals'?'selected':''}>Deals</option>
      </select>
      <input class="skinImage" value="${skin.image||''}" placeholder="Image URL">
      <input type="file" accept="image/*">
      <button class="saveSkinBtn">Save</button>
      <button class="deleteSkinBtn">Delete</button>
    `;
    // file change -> read dataURL into image input
    const fileIn = div.querySelector('input[type=file]');
    fileIn.onchange = (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = (ev)=> { div.querySelector('.skinImage').value = ev.target.result; };
      r.readAsDataURL(f);
    };
    // save button: update immediate
    div.querySelector('.saveSkinBtn').onclick = ()=>{
      const skinsArr = getSkins();
      const idx = skinsArr.findIndex(s=>s.id===skin.id);
      if(idx>=0){
        skinsArr[idx].name = div.querySelector('.skinName').value;
        skinsArr[idx].price = parseInt(div.querySelector('.skinPrice').value) || 0;
        skinsArr[idx].useFor = div.querySelector('.skinUseFor').value;
        skinsArr[idx].image = div.querySelector('.skinImage').value;
        localStorage.setItem('skinsData', JSON.stringify(skinsArr));
        showMessage('✅ Skin saved');
        renderSkinEditor();
      }
    };
    // delete button: remove from master skinsData only (users keep theirs)
    div.querySelector('.deleteSkinBtn').onclick = ()=>{
      if(!confirm('Delete this skin from master list? Users who already own it keep it.')) return;
      let skinsArr = getSkins().filter(s=>s.id!==skin.id);
      localStorage.setItem('skinsData', JSON.stringify(skinsArr));
      renderSkinEditor();
      loadAllKeys(); // update preview images
    };

    container.appendChild(div);
  });

  if(skins.length === 0){
    container.innerHTML = '<div style="color:#ddd;">Nog geen skins. Gebruik "Add Skin" om een skin toe te voegen.</div>';
  }
}
function addSkin(){
  const skins = getSkins();
  const id = 'skin'+Date.now();
  skins.push({ id:id, name:'Nieuwe skin', price:0, image:'', useFor:'coins' });
  localStorage.setItem('skinsData', JSON.stringify(skins));
  renderSkinEditor();
}
function saveSkins(){
  // saves all rows - same as clicking each Save
  const container = document.getElementById('skinsEditor');
  const rows = container.querySelectorAll('.skinRow');
  const skinsArr = [];
  rows.forEach(row=>{
    skinsArr.push({
      id: row.dataset.id,
      name: row.querySelector('.skinName').value,
      price: parseInt(row.querySelector('.skinPrice').value) || 0,
      image: row.querySelector('.skinImage').value,
      useFor: row.querySelector('.skinUseFor').value
    });
  });
  localStorage.setItem('skinsData', JSON.stringify(skinsArr));
  showMessage('✅ All skins saved');
  renderSkinEditor();
}
function publishSkins(){
  localStorage.setItem('skinsDataPublished', localStorage.getItem('skinsData') || '[]');
  showMessage('✅ Skins published');
}

// --- Events (editor) ---
function openEventEditor(){ document.getElementById('eventEditor').style.display = 'block'; renderEventEditor(); }
function renderEventEditor(){
  const container = document.getElementById('eventsList');
  container.innerHTML = '';
  const events = getEvents();
  events.forEach((ev, idx)=>{
    const row = document.createElement('div'); row.className='eventRow'; row.dataset.index=idx;
    const startVal = new Date(ev.startTime).toISOString().slice(0,16);
    const endVal = new Date(ev.endTime).toISOString().slice(0,16);
    row.innerHTML = `
      <input class="eventName" value="${ev.name||''}" placeholder="Name">
      <input class="eventDesc" value="${ev.desc||''}" placeholder="Desc">
      <select class="eventStatus">
        <option value="active" ${ev.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${ev.status==='coming'?'selected':''}>Coming</option>
        <option value="inactive" ${ev.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <input class="eventStart" type="datetime-local" value="${startVal}">
      <input class="eventEnd" type="datetime-local" value="${endVal}">
      <input class="eventImage" value="${ev.image||''}" placeholder="Image URL">
      <input type="file" accept="image/*">
      <button class="deleteEventBtn">Delete</button>
    `;
    // file upload
    const fileIn = row.querySelector('input[type=file]');
    fileIn.onchange = (e)=> {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = (evr) => { row.querySelector('.eventImage').value = evr.target.result; };
      r.readAsDataURL(f);
    };
    row.querySelector('.deleteEventBtn').onclick = ()=> { if(confirm('Delete event?')){ let arr = getEvents(); arr.splice(idx,1); localStorage.setItem('eventData', JSON.stringify(arr)); renderEventEditor(); } };
    container.appendChild(row);
  });
  if(events.length===0) container.innerHTML = '<div style="color:#ccc;">Geen events. Voeg er een toe.</div>';
}
function addEvent(){ const evs = getEvents(); evs.push({ id:'event'+Date.now(), name:'Nieuw event', desc:'', status:'coming', startTime:Date.now(), endTime:Date.now()+3600000, image:'' }); localStorage.setItem('eventData', JSON.stringify(evs)); renderEventEditor(); }
function publishEvents(){
  // collect from DOM rows
  const rows = document.querySelectorAll('#eventsList .eventRow');
  const arr = [];
  rows.forEach((r, idx)=>{
    const startVal = new Date(r.querySelector('.eventStart').value).getTime();
    const endVal = new Date(r.querySelector('.eventEnd').value).getTime();
    const id = getEvents()[idx]?.id || 'event'+Date.now();
    arr.push({
      id:id,
      name:r.querySelector('.eventName').value,
      desc:r.querySelector('.eventDesc').value,
      status:r.querySelector('.eventStatus').value,
      startTime: startVal,
      endTime: endVal,
      image: r.querySelector('.eventImage').value
    });
  });
  localStorage.setItem('eventData', JSON.stringify(arr));
  localStorage.setItem('eventDataPublished', JSON.stringify(arr));
  showMessage('✅ Events published');
}

// --- Deals (editor) ---
function openDealEditor(){ document.getElementById('dealEditor').style.display = 'block'; renderDealEditor(); }
function renderDealEditor(){
  const container = document.getElementById('dealsList'); container.innerHTML = '';
  const deals = getDeals();
  const events = getEvents();
  const skins = getSkins();
  deals.forEach((deal, idx)=>{
    const row = document.createElement('div'); row.className='dealRow'; row.dataset.index=idx;
    const startVal = new Date(deal.startTime).toISOString().slice(0,16);
    const endVal = new Date(deal.endTime).toISOString().slice(0,16);
    const eventOptions = events.map(e=>`<option value="${e.id}" ${deal.eventId===e.id?'selected':''}>${e.name}</option>`).join('');
    const skinOptions = skins.map(s=>`<option value="${s.id}" ${deal.skins && deal.skins.includes(s.id)?'selected':''}>${s.name}</option>`).join('');
    row.innerHTML = `
      <input class="dealName" value="${deal.name||''}" placeholder="Deal name">
      <input class="dealDesc" value="${deal.desc||''}" placeholder="Description">
      <input class="dealPrice" type="number" value="${deal.price||0}" placeholder="Price">
      <select class="dealStatus">
        <option value="active" ${deal.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${deal.status==='coming'?'selected':''}>Coming</option>
        <option value="inactive" ${deal.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <input class="dealStart" type="datetime-local" value="${startVal}">
      <input class="dealEnd" type="datetime-local" value="${endVal}">
      <select class="dealEvent">${eventOptions}</select>
      <input class="dealImage" value="${deal.image||''}" placeholder="Image URL">
      <input type="file" accept="image/*">
      <select class="dealSkins" multiple style="width:220px">${skinOptions}</select>
      <button class="deleteDealBtn">Delete</button>
    `;
    // file upload
    const fileIn = row.querySelector('input[type=file]');
    fileIn.onchange = (e)=> {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = (evr) => { row.querySelector('.dealImage').value = evr.target.result; };
      r.readAsDataURL(f);
    };
    row.querySelector('.deleteDealBtn').onclick = ()=> { if(confirm('Delete deal?')){ let arr = getDeals(); arr.splice(idx,1); localStorage.setItem('dealData', JSON.stringify(arr)); renderDealEditor(); } };
    container.appendChild(row);
  });
  if(deals.length===0) container.innerHTML = '<div style="color:#ccc;">Geen deals. Voeg er een toe.</div>';
}
function addDeal(){ const arr=getDeals(); arr.push({ name:'Nieuwe deal', desc:'', price:0, status:'coming', startTime:Date.now(), endTime:Date.now()+3600000, eventId:'', image:'', skins:[] }); localStorage.setItem('dealData', JSON.stringify(arr)); renderDealEditor(); }
function publishDeals(){
  const rows = document.querySelectorAll('#dealsList .dealRow');
  const arr=[];
  rows.forEach((r, idx)=>{
    const startTime = new Date(r.querySelector('.dealStart').value).getTime();
    const endTime = new Date(r.querySelector('.dealEnd').value).getTime();
    const skinsSelected = [...r.querySelector('.dealSkins').selectedOptions].map(o=>o.value);
    arr.push({
      name: r.querySelector('.dealName').value,
      desc: r.querySelector('.dealDesc').value,
      price: parseFloat(r.querySelector('.dealPrice').value) || 0,
      status: r.querySelector('.dealStatus').value,
      startTime: startTime,
      endTime: endTime,
      eventId: r.querySelector('.dealEvent').value,
      image: r.querySelector('.dealImage').value,
      skins: skinsSelected
    });
  });
  localStorage.setItem('dealData', JSON.stringify(arr));
  localStorage.setItem('dealDataPublished', JSON.stringify(arr));
  showMessage('✅ Deals published');
}

// init
loadAllKeys();
</script>
</body>
</html>
