<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>T.B Agar.io Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    h1, h2 {
      color: #58a6ff;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 12px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: white;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      font-weight: bold;
      cursor: pointer;
      margin: 3px;
    }

    .primary {
      background: #238636;
      color: white;
    }

    .blue {
      background: #1f6feb;
      color: white;
    }

    .danger {
      background: #da3633;
      color: white;
    }

    .gray {
      background: #30363d;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 12px;
      color: #f2cc60;
      white-space: pre-wrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .stat {
      background: #21262d;
      padding: 20px;
      border-radius: 10px;
    }

    .stat-value {
      font-size: 28px;
      color: #f2cc60;
      margin-top: 8px;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 750px;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #30363d;
    }

    th {
      color: #58a6ff;
    }

    .coin-input {
      width: 120px;
      margin: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    a {
      color: #58a6ff;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ADMIN LOGIN -->
  <div id="loginPanel" class="panel">

    <h1>T.B Agar.io Admin</h1>

    <p>Enter the administrator code.</p>

    <form id="loginForm">

      <input
        type="password"
        id="adminCode"
        placeholder="Admin code"
        required
      >

      <button class="primary" type="submit">
        Login
      </button>

    </form>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="panel">

      <div class="topbar">

        <div>
          <h1>Admin Dashboard</h1>
          <p>T.B Agar.io administration</p>
        </div>

        <div>

          <button class="gray" onclick="refreshEverything()">
            Refresh
          </button>

          <button class="danger" onclick="logoutAdmin()">
            Logout
          </button>

        </div>

      </div>

    </div>


    <!-- STATISTICS -->
    <div class="panel">

      <h2>Statistics</h2>

      <div class="stats">

        <div class="stat">
          Registered users
          <div id="userCount" class="stat-value">
            0
          </div>
        </div>

        <div class="stat">
          Total coins
          <div id="coinCount" class="stat-value">
            0
          </div>
        </div>

        <div class="stat">
          Purchases
          <div id="purchaseCount" class="stat-value">
            0
          </div>
        </div>

      </div>

    </div>


    <!-- USERS -->
    <div class="panel">

      <h2>Users</h2>

      <input
        type="search"
        id="searchUsers"
        placeholder="Search username..."
      >

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Username</th>
              <th>Coins</th>
              <th>Registered</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>

          </thead>

          <tbody id="usersTable"></tbody>

        </table>

      </div>

      <div id="userMessage" class="message"></div>

    </div>


    <!-- PURCHASES -->
    <div class="panel">

      <h2>Purchase History</h2>

      <button
        class="blue"
        onclick="loadPurchases()"
      >
        Refresh purchases
      </button>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>User</th>
              <th>Products</th>
              <th>Total</th>
              <th>Date / Time</th>
            </tr>

          </thead>

          <tbody id="purchaseTable"></tbody>

        </table>

      </div>

      <div id="purchaseMessage" class="message"></div>

    </div>

  </div>

</div>


<script>

  /*
    IMPORTANT:

    Change this to the address where your backend is hosted.

    Example:

    const API_BASE =
      "https://api.tbagario.com";

    Do NOT put a slash at the end.
  */

  const API_BASE = "https://YOUR-BACKEND-URL.com";


  let users = [];
  let purchases = [];


  const loginPanel =
    document.getElementById("loginPanel");

  const dashboard =
    document.getElementById("dashboard");

  const loginMessage =
    document.getElementById("loginMessage");

  const userMessage =
    document.getElementById("userMessage");

  const purchaseMessage =
    document.getElementById("purchaseMessage");


  /*
  ========================================
  ADMIN LOGIN
  ========================================
  */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      loginAdmin
    );


  async function loginAdmin(event) {

    event.preventDefault();

    loginMessage.textContent = "";

    const code =
      document
        .getElementById("adminCode")
        .value
        .trim();

    if (!code) {

      loginMessage.textContent =
        "Please enter the admin code.";

      return;
    }


    try {

      const response =
        await fetch(
          API_BASE + "/api/admin/login",
          {
            method: "POST",

            credentials: "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              code: code
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        loginMessage.textContent =
          data.message ||
          "Admin login failed.";

        return;
      }


      loginPanel.classList.add(
        "hidden"
      );

      dashboard.classList.remove(
        "hidden"
      );


      document
        .getElementById("adminCode")
        .value = "";


      await refreshEverything();


    } catch (error) {

      loginMessage.textContent =
        "Could not connect to the backend.\n\n" +
        "Check API_BASE and make sure your backend is online.";

    }

  }


  /*
  ========================================
  LOGOUT
  ========================================
  */

  async function logoutAdmin() {

    try {

      await fetch(
        API_BASE + "/api/admin/logout",
        {
          method: "POST",
          credentials: "include"
        }
      );

    } catch (error) {

      console.error(error);

    }


    users = [];
    purchases = [];


    dashboard.classList.add(
      "hidden"
    );

    loginPanel.classList.remove(
      "hidden"
    );

  }


  /*
  ========================================
  LOAD USERS
  ========================================
  */

  async function loadUsers() {

    userMessage.textContent = "";

    try {

      const response =
        await fetch(
          API_BASE + "/api/admin/users",
          {
            credentials: "include"
          }
        );


      if (response.status === 401 ||
          response.status === 403) {

        adminSessionExpired();

        return;

      }


      const data =
        await response.json();


      if (!response.ok) {

        userMessage.textContent =
          data.message ||
          "Could not load users.";

        return;

      }


      users = data;


      renderUsers();

      updateStats();


    } catch (error) {

      userMessage.textContent =
        "Could not connect to the backend.";

    }

  }


  /*
  ========================================
  RENDER USERS
  ========================================
  */

  function renderUsers() {

    const search =
      document
        .getElementById(
          "searchUsers"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =
      users.filter(
        user =>
          String(
            user.username
          )
          .toLowerCase()
          .includes(search)
      );


    const table =
      document.getElementById(
        "usersTable"
      );


    if (filtered.length === 0) {

      table.innerHTML = `
        <tr>
          <td colspan="5">
            No users found.
          </td>
        </tr>
      `;

      return;

    }


    table.innerHTML =
      filtered
        .map(user => {

          const date =
            user.createdAt
              ? new Date(
                  user.createdAt
                ).toLocaleString()
              : "-";


          return `

            <tr>

              <td>
                ${escapeHtml(
                  user.username
                )}
              </td>

              <td>
                ${formatNumber(
                  user.coins
                )}
              </td>

              <td>
                ${escapeHtml(date)}
              </td>

              <td>

                <input
                  class="coin-input"
                  id="coins-${escapeAttribute(
                    user.id
                  )}"
                  type="number"
                  min="0"
                  step="1"
                  value="100"
                >

              </td>

              <td>

                <button
                  class="primary"
                  onclick="addCoins(
                    '${escapeJs(user.id)}'
                  )"
                >
                  Add coins
                </button>


                <button
                  class="blue"
                  onclick="setCoins(
                    '${escapeJs(user.id)}'
                  )"
                >
                  Set coins
                </button>

              </td>

            </tr>

          `;

        })
        .join("");

  }


  document
    .getElementById(
      "searchUsers"
    )
    .addEventListener(
      "input",
      renderUsers
    );


  /*
  ========================================
  ADD COINS
  ========================================
  */

  async function addCoins(userId) {

    const input =
      document.getElementById(
        "coins-" + userId
      );


    const amount =
      Number(input.value);


    if (
      !Number.isSafeInteger(amount) ||
      amount <= 0
    ) {

      userMessage.textContent =
        "Enter a positive whole number.";

      return;

    }


    await changeCoins(
      userId,
      "add",
      amount
    );

  }


  /*
  ========================================
  SET COINS
  ========================================
  */

  async function setCoins(userId) {

    const input =
      document.getElementById(
        "coins-" + userId
      );


    const amount =
      Number(input.value);


    if (
      !Number.isSafeInteger(amount) ||
      amount < 0
    ) {

      userMessage.textContent =
        "Enter a valid whole number.";

      return;

    }


    await changeCoins(
      userId,
      "set",
      amount
    );

  }


  /*
  ========================================
  COIN UPDATE REQUEST
  ========================================
  */

  async function changeCoins(
    userId,
    operation,
    amount
  ) {

    userMessage.textContent =
      "Updating coins...";


    try {

      const response =
        await fetch(

          API_BASE +
          "/api/admin/users/" +
          encodeURIComponent(
            userId
          ) +
          "/coins",

          {

            method: "PATCH",

            credentials: "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              operation:
                operation,

              amount:
                amount

            })

          }

        );


      if (
        response.status === 401 ||
        response.status === 403
      ) {

        adminSessionExpired();

        return;

      }


      const data =
        await response.json();


      if (!response.ok) {

        userMessage.textContent =
          data.message ||
          "Could not update coins.";

        return;

      }


      userMessage.textContent =
        "Coins updated successfully.";


      await loadUsers();


    } catch (error) {

      userMessage.textContent =
        "Could not connect to the backend.";

    }

  }


  /*
  ========================================
  PURCHASE HISTORY
  ========================================
  */

  async function loadPurchases() {

    purchaseMessage.textContent = "";


    try {

      const response =
        await fetch(
          API_BASE +
          "/api/admin/purchases",
          {
            credentials: "include"
          }
        );


      if (
        response.status === 401 ||
        response.status === 403
      ) {

        adminSessionExpired();

        return;

      }


      const data =
        await response.json();


      if (!response.ok) {

        purchaseMessage.textContent =
          data.message ||
          "Could not load purchases.";

        return;

      }


      purchases = data;


      renderPurchases();

      updateStats();


    } catch (error) {

      purchaseMessage.textContent =
        "Could not connect to the backend.";

    }

  }


  /*
  ========================================
  RENDER PURCHASES
  ========================================
  */

  function renderPurchases() {

    const table =
      document.getElementById(
        "purchaseTable"
      );


    if (purchases.length === 0) {

      table.innerHTML = `
        <tr>
          <td colspan="4">
            No purchases yet.
          </td>
        </tr>
      `;

      return;

    }


    table.innerHTML =
      purchases
        .map(purchase => {

          const productText =
            Array.isArray(
              purchase.products
            )
              ? purchase.products
                  .map(product => {

                    return (
                      product.name +
                      " × " +
                      product.quantity
                    );

                  })
                  .join(", ")

              : "-";


          const date =
            purchase.createdAt
              ? new Date(
                  purchase.createdAt
                ).toLocaleString()
              : "-";


          return `

            <tr>

              <td>
                ${escapeHtml(
                  purchase.username
                )}
              </td>

              <td>
                ${escapeHtml(
                  productText
                )}
              </td>

              <td>
                ${formatNumber(
                  purchase.totalCoins
                )} coins
              </td>

              <td>
                ${escapeHtml(
                  date
                )}
              </td>

            </tr>

          `;

        })
        .join("");

  }


  /*
  ========================================
  STATISTICS
  ========================================
  */

  function updateStats() {

    const totalCoins =
      users.reduce(
        (total, user) =>
          total +
          Number(
            user.coins || 0
          ),
        0
      );


    document
      .getElementById(
        "userCount"
      )
      .textContent =
        formatNumber(
          users.length
        );


    document
      .getElementById(
        "coinCount"
      )
      .textContent =
        formatNumber(
          totalCoins
        );


    document
      .getElementById(
        "purchaseCount"
      )
      .textContent =
        formatNumber(
          purchases.length
        );

  }


  /*
  ========================================
  REFRESH
  ========================================
  */

  async function refreshEverything() {

    await loadUsers();

    await loadPurchases();

  }


  /*
  ========================================
  SESSION EXPIRED
  ========================================
  */

  function adminSessionExpired() {

    dashboard.classList.add(
      "hidden"
    );

    loginPanel.classList.remove(
      "hidden"
    );

    loginMessage.textContent =
      "Admin session expired. Please log in again.";

  }


  /*
  ========================================
  HELPERS
  ========================================
  */

  function formatNumber(number) {

    return Number(
      number || 0
    ).toLocaleString();

  }


  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function escapeAttribute(value) {

    return String(value)
      .replace(
        /[^A-Za-z0-9_-]/g,
        ""
      );

  }


  function escapeJs(value) {

    return String(value)
      .replaceAll(
        "\\",
        "\\\\"
      )
      .replaceAll(
        "'",
        "\\'"
      );

  }

</script>

</body>
</html>
