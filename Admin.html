<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button { padding:6px; margin:5px; border-radius:4px; border:none; font-size:14px; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
#editor, #eventEditor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.skinRow, .eventRow { margin-bottom:10px; }
.skinRow input, .eventRow input { margin:3px; width:150px; }
.eventRow img { width:80px; height:40px; object-fit:cover; border:1px solid #0af; margin-right:5px; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<h3>Add New Key</h3>
<input id="newName" placeholder="Enter Name">
<button onclick="addNewKey()">Add Key</button>

<h3>All Keys</h3>
<table id="keysTable">
<tr>
  <th>Key</th>
  <th>Name</th>
  <th>Coins</th>
  <th>Money</th>
  <th>Purchased Skins</th>
  <th>Actions</th>
</tr>
</table>

<!-- Skin Editor -->
<div style="margin-top:20px;">
  <button onclick="openSkinEditor()">Edit Skins</button>
</div>
<div id="editor">
  <h2>Skin Editor</h2>
  <button onclick="saveSkins()">Save Skins</button>
  <button onclick="publishSkins()">Publish Skins</button>
  <button onclick="addSkin()">Add Skin</button>
  <div id="skinsEditor"></div>
</div>

<!-- Event Editor -->
<div style="margin-top:20px;">
  <button onclick="openEventEditor()">Manage Events</button>
</div>
<div id="eventEditor">
  <h2>Event Editor</h2>
  <button onclick="addEvent()">Add Event</button>
  <button onclick="publishEvents()">Publish Events</button>
  <div id="eventsList"></div>
</div>

<script>
// =======================
// Key Management
// =======================
function loadAllKeys(){
  const table=document.getElementById('keysTable');
  table.innerHTML='<tr><th>Key</th><th>Name</th><th>Coins</th><th>Money</th><th>Purchased Skins</th><th>Actions</th></tr>';
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data=JSON.parse(localStorage.getItem(k));
      const row=table.insertRow();
      row.insertCell(0).innerText=k.replace('skinshop_','');
      row.insertCell(1).innerText=data.name||'';
      row.insertCell(2).innerText=data.coins||0;
      row.insertCell(3).innerText=data.money?.toFixed(2)||0;
      row.insertCell(4).innerText=data.owned?data.owned.join(', '):'';
      const actions=row.insertCell(5);
      actions.innerHTML=`
        <button onclick="editKey('${k}')">Edit</button>
        <button onclick="deleteKey('${k}')">Delete</button>
      `;
    }
  }
}

function showMessage(msg){ document.getElementById('message').textContent=msg; }

function addNewKey(){
  const name=document.getElementById('newName').value.trim();
  if(!name) return showMessage('Enter a name');
  const key=Math.random().toString(36).substring(2,10);
  localStorage.setItem('skinshop_'+key, JSON.stringify({name:name, coins:0, money:0, owned:[]}));
  showMessage('✅ New key created: '+key);
  document.getElementById('newName').value='';
  loadAllKeys();
}

function editKey(storageKey){
  const options=prompt('Choose an option:\n1 - Manage Coins\n2 - Manage Money\n3 - Change Key\n4 - Change Name');
  if(!options) return;
  const data=JSON.parse(localStorage.getItem(storageKey));
  switch(options){
    case '1':
      const action1=prompt('Type "add" to add coins or "remove" to remove coins'); if(!action1) return;
      const amount1=parseInt(prompt('Enter amount')); if(isNaN(amount1)) return showMessage('Invalid amount');
      if(action1.toLowerCase()==='add') data.coins=(data.coins||0)+amount1; else if(action1.toLowerCase()==='remove') data.coins=Math.max((data.coins||0)-amount1,0); else return showMessage('Invalid action');
      showMessage('✅ Coins updated'); break;
    case '2':
      const action2=prompt('Type "add" to add money or "remove" to remove money'); if(!action2) return;
      const amount2=parseFloat(prompt('Enter amount')); if(isNaN(amount2)) return showMessage('Invalid amount');
      if(action2.toLowerCase()==='add') data.money=(data.money||0)+amount2; else if(action2.toLowerCase()==='remove') data.money=Math.max((data.money||0)-amount2,0); else return showMessage('Invalid action');
      showMessage('✅ Money updated'); break;
    case '3':
      const newKey=prompt('Enter new key:', storageKey.replace('skinshop_','')); if(!newKey) return;
      const newStorageKey='skinshop_'+newKey; localStorage.setItem(newStorageKey, JSON.stringify(data)); if(newStorageKey!==storageKey) localStorage.removeItem(storageKey); showMessage('✅ Key updated'); break;
    case '4':
      const newName=prompt('Enter new name:', data.name); if(!newName) return; data.name=newName; showMessage('✅ Name updated'); break;
    default: showMessage('Invalid option'); break;
  }
  localStorage.setItem(storageKey, JSON.stringify(data));
  loadAllKeys();
}

function deleteKey(storageKey){ if(confirm('Are you sure?')){ localStorage.removeItem(storageKey); showMessage('✅ Key deleted'); loadAllKeys(); } }

loadAllKeys();

// =======================
// Skin Editor
// =======================
function openSkinEditor(){ document.getElementById('editor').style.display='block'; renderSkinEditor(); }
function getSkins(){ return JSON.parse(localStorage.getItem('skinsData')||'[]'); }
function renderSkinEditor(){
  const container=document.getElementById('skinsEditor'); container.innerHTML='';
  getSkins().forEach(skin=>{
    const div=document.createElement('div'); div.className='skinRow'; div.dataset.id=skin.id;
    div.innerHTML=`
      <input class="skinName" value="${skin.name}" placeholder="Name">
      <input class="skinPrice" value="${skin.price}" placeholder="Price">
      <input class="skinImage" value="${skin.image}" placeholder="Image URL">
      <input type="file" accept="image/*" onchange="uploadImage(this, '${skin.id}')">
      <button onclick="deleteSkin('${skin.id}')">Delete</button>
    `;
    container.appendChild(div);
  });
}
function addSkin(){ const id='skin'+Date.now(); const container=document.getElementById('skinsEditor'); const div=document.createElement('div'); div.className='skinRow'; div.dataset.id=id;
div.innerHTML=`<input class="skinName" placeholder="Name"><input class="skinPrice" placeholder="Price"><input class="skinImage" placeholder="Image URL"><input type="file" accept="image/*" onchange="uploadImage(this, '${id}')"><button onclick="deleteSkin('${id}')">Delete</button>`;
container.appendChild(div);}
function uploadImage(input,id){ const file=input.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=function(e){ const row=document.querySelector(`.skinRow[data-id='${id}'] .skinImage`); row.value=e.target.result;} ; reader.readAsDataURL(file);}
function saveSkins(){ const container=document.getElementById('skinsEditor'); const skinElements=container.querySelectorAll('.skinRow'); const skinsArr=[]; skinElements.forEach(row=>{ skinsArr.push({id:row.dataset.id, name:row.querySelector('.skinName').value, price:parseInt(row.querySelector('.skinPrice').value)||0, image:row.querySelector('.skinImage').value});}); localStorage.setItem('skinsData', JSON.stringify(skinsArr)); alert('✅ Skins saved!');}
function publishSkins(){ localStorage.setItem('skinsDataPublished', localStorage.getItem('skinsData')); alert('✅ Skins published for users!'); }
function deleteSkin(id){ const row=document.querySelector(`.skinRow[data-id='${id}']`); if(row) row.remove(); }

// =======================
// Event Editor
// =======================
function openEventEditor(){ document.getElementById('eventEditor').style.display='block'; renderEventEditor(); }
function getEvents(){ return JSON.parse(localStorage.getItem('eventData')||'[]'); }
function renderEventEditor(){
  const container=document.getElementById('eventsList'); container.innerHTML='';
  getEvents().forEach((event,index)=>{
    const div=document.createElement('div'); div.className='eventRow'; div.dataset.index=index;
    const startVal=new Date(event.startTime).toISOString().slice(0,16); const endVal=new Date(event.endTime).toISOString().slice(0,16);
    div.innerHTML=`
      <input class="eventName" placeholder="Event Name" value="${event.name}">
      <input class="eventDesc" placeholder="Event Description" value="${event.desc}">
      <label>Start:</label>
      <input class="eventStart" type="datetime-local" value="${startVal}">
      <label>End:</label>
      <input class="eventEnd" type="datetime-local" value="${endVal}">
      <label>Active Image URL:</label>
      <input class="eventImage" placeholder="Active Event Image" value="${event.image||''}">
      <label>Bar Image URL:</label>
      <input class="eventBarImage" placeholder="Bar Image" value="${event.barImage||''}">
      <label>Status:</label>
      <select class="eventStatus">
        <option value="active" ${event.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${event.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${event.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <label>Price (€):</label>
      <input class="eventPrice" type="number" step="0.01" value="${event.price||0}">
      <button onclick="deleteEvent(${index})">Delete</button>
      <img src="${event.barImage||event.image||''}" alt="Bar Preview">
    `;
    container.appendChild(div);
  });
}
function addEvent(){
  const events=getEvents();
  events.push({name:'New Event', desc:'Description', startTime:Date.now()+60000, endTime:Date.now()+3600000, image:'', barImage:'', status:'active', price:0});
  localStorage.setItem('eventData', JSON.stringify(events)); renderEventEditor();
}
function deleteEvent(index){ const events=getEvents(); events.splice(index,1); localStorage.setItem('eventData', JSON.stringify(events)); renderEventEditor(); }
function publishEvents(){
  const container=document.getElementById('eventsList'); const events=[];
  container.querySelectorAll('.eventRow').forEach(div=>{
    const startInput=div.querySelector('.eventStart').value;
    const endInput=div.querySelector('.eventEnd').value;
    events.push({
      name:div.querySelector('.eventName').value,
      desc:div.querySelector('.eventDesc').value,
      startTime:new Date(startInput).getTime(),
      endTime:new Date(endInput).getTime(),
      image:div.querySelector('.eventImage').value,
      barImage:div.querySelector('.eventBarImage').value,
      status:div.querySelector('.eventStatus').value,
      price:parseFloat(div.querySelector('.eventPrice').value)||0
    });
  });
  localStorage.setItem('eventData', JSON.stringify(events));
  localStorage.setItem('eventDataPublished', JSON.stringify(events));
  alert('✅ Events published for users!');
}
</script>

</body>
</html>
