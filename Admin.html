<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button, select { padding:6px; margin:5px; border-radius:4px; border:none; font-size:14px; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
#editor, #eventEditor, #dealEditor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.skinRow, .eventRow, .dealRow { margin-bottom:10px; }
.skinRow input, .eventRow input, .dealRow input, .dealRow select { margin:3px; }
.adminControls { margin-top:10px; border-top:1px solid #0af; padding-top:10px; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<!-- Add New Key -->
<h3>Add New Key</h3>
<div>
  <input id="newKey" placeholder="Key">
  <input id="newName" placeholder="Name">
  <input id="newCoins" type="number" placeholder="Coins">
  <input id="newMoney" type="number" step="0.01" placeholder="Money">
  <button onclick="addNewKey()">Add Key</button>
</div>

<h3>All Keys</h3>
<table id="keysTable">
<tr>
  <th>Key</th>
  <th>Name</th>
  <th>Coins</th>
  <th>Money</th>
  <th>Purchased Skins</th>
  <th>Actions</th>
</tr>
</table>

<!-- Skin Editor -->
<div style="margin-top:20px;">
  <button onclick="openSkinEditor()">Edit Skins</button>
</div>
<div id="editor">
  <h2>Skin Editor</h2>
  <button onclick="saveSkins()">Save Skins</button>
  <button onclick="publishSkins()">Publish Skins</button>
  <button onclick="addSkin()">Add Skin</button>
  <div id="skinsEditor"></div>
</div>

<!-- Event Editor -->
<div style="margin-top:20px;">
  <button onclick="openEventEditor()">Manage Events</button>
</div>
<div id="eventEditor">
  <h2>Event Editor</h2>
  <button onclick="addEvent()">Add Event</button>
  <button onclick="publishEvents()">Publish Events</button>
  <div id="eventsList"></div>
</div>

<!-- Deal Editor -->
<div style="margin-top:20px;">
  <button onclick="openDealEditor()">Manage Deals</button>
</div>
<div id="dealEditor">
  <h2>Deal Editor</h2>
  <button onclick="addDeal()">Add Deal</button>
  <button onclick="publishDeals()">Publish Deals</button>
  <div id="dealsList"></div>
</div>

<script>
// =======================
// Key Management
// =======================
function loadAllKeys(){
  const table = document.getElementById('keysTable');
  table.innerHTML='<tr><th>Key</th><th>Name</th><th>Coins</th><th>Money</th><th>Purchased Skins</th><th>Actions</th></tr>';
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data = JSON.parse(localStorage.getItem(k));
      const row = table.insertRow();
      row.insertCell(0).innerHTML=`<input value="${k.replace('skinshop_','')}" id="key_${k}">`;
      row.insertCell(1).innerHTML=`<input value="${data.name}" id="name_${k}">`;
      row.insertCell(2).innerHTML=`<input type="number" value="${data.coins}" id="coins_${k}">`;
      row.insertCell(3).innerHTML=`<input type="number" value="${data.money}" step="0.01" id="money_${k}">`;
      row.insertCell(4).innerText = data.owned ? data.owned.join(', ') : '';
      const actions = row.insertCell(5);
      actions.innerHTML=`
        <button onclick="saveKey('${k}')">Save</button>
        <button onclick="deleteKey('${k}')">Delete</button>
      `;
    }
  }
}

function saveKey(storageKey){
  const newKey = document.getElementById('key_'+storageKey).value.trim();
  const name = document.getElementById('name_'+storageKey).value.trim();
  const coins = parseFloat(document.getElementById('coins_'+storageKey).value) || 0;
  const money = parseFloat(document.getElementById('money_'+storageKey).value) || 0;
  const data = JSON.parse(localStorage.getItem(storageKey));
  data.name=name;
  data.coins=coins;
  data.money=money;
  const newStorageKey = 'skinshop_'+newKey;
  localStorage.setItem(newStorageKey, JSON.stringify(data));
  if(newStorageKey!==storageKey) localStorage.removeItem(storageKey);
  alert('✅ Key saved!');
  loadAllKeys();
}

function deleteKey(storageKey){
  if(confirm('Are you sure you want to delete this key?')){
    localStorage.removeItem(storageKey);
    alert('✅ Key deleted');
    loadAllKeys();
  }
}

function addNewKey(){
  const key = document.getElementById('newKey').value.trim();
  const name = document.getElementById('newName').value.trim();
  const coins = parseFloat(document.getElementById('newCoins').value) || 0;
  const money = parseFloat(document.getElementById('newMoney').value) || 0;
  if(!key) { alert('⚠ Please enter a key'); return; }
  const storageKey = 'skinshop_'+key;
  if(localStorage.getItem(storageKey)){ alert('⚠ Key already exists'); return; }
  localStorage.setItem(storageKey, JSON.stringify({name:name, coins:coins, money:money, owned:[]})); 
  alert('✅ New key added!');
  loadAllKeys();
  document.getElementById('newKey').value='';
  document.getElementById('newName').value='';
  document.getElementById('newCoins').value='';
  document.getElementById('newMoney').value='';
}

loadAllKeys();

// =======================
// Skin Editor
// =======================
function openSkinEditor(){
  document.getElementById('editor').style.display='block';
  renderSkinEditor();
}
function getSkins(){ return JSON.parse(localStorage.getItem('skinsData')||'[]'); }
function renderSkinEditor(){
  const container = document.getElementById('skinsEditor'); container.innerHTML='';
  getSkins().forEach(skin=>{
    const div = document.createElement('div'); div.className='skinRow'; div.dataset.id=skin.id;
    div.innerHTML=`
      <input class="skinName" value="${skin.name}" placeholder="Name">
      <input class="skinPrice" value="${skin.price}" placeholder="Price">
      <input class="skinImage" value="${skin.image}" placeholder="Image URL">
      <button onclick="deleteSkin('${skin.id}')">Delete</button>
    `;
    container.appendChild(div);
  });
}
function addSkin(){
  const id = 'skin'+Date.now(); const container=document.getElementById('skinsEditor');
  const div=document.createElement('div'); div.className='skinRow'; div.dataset.id=id;
  div.innerHTML=`
    <input class="skinName" placeholder="Name">
    <input class="skinPrice" placeholder="Price">
    <input class="skinImage" placeholder="Image URL">
    <button onclick="deleteSkin('${id}')">Delete</button>
  `;
  container.appendChild(div);
}
function saveSkins(){
  const container=document.getElementById('skinsEditor');
  const skinElements=container.querySelectorAll('.skinRow'); const skinsArr=[];
  skinElements.forEach(row=>{
    skinsArr.push({
      id: row.dataset.id,
      name: row.querySelector('.skinName').value,
      price: parseInt(row.querySelector('.skinPrice').value)||0,
      image: row.querySelector('.skinImage').value
    });
  });
  localStorage.setItem('skinsData', JSON.stringify(skinsArr));
  alert('✅ Skins saved!');
}
function publishSkins(){ localStorage.setItem('skinsDataPublished', localStorage.getItem('skinsData')); alert('✅ Skins published for users!'); }
function deleteSkin(id){ const row=document.querySelector(`.skinRow[data-id='${id}']`); if(row) row.remove(); }

// =======================
// Event Editor
// =======================
function openEventEditor(){ document.getElementById('eventEditor').style.display='block'; renderEventEditor(); }
function getEvents(){ return JSON.parse(localStorage.getItem('eventData')||'[]'); }
function renderEventEditor(){
  const container=document.getElementById('eventsList'); container.innerHTML='';
  getEvents().forEach((event,index)=>{
    const div=document.createElement('div'); div.className='eventRow'; div.dataset.index=index;
    div.innerHTML=`
      <input class="eventName" value="${event.name}" placeholder="Event Name">
      <input class="eventDesc" value="${event.desc}" placeholder="Description">
      <select class="eventStatus">
        <option value="active" ${event.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${event.status==='coming'?'selected':''}>Coming</option>
        <option value="inactive" ${event.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <input class="eventStartTime" value="${event.startTime}" placeholder="StartTime(ms)">
      <input class="eventEndTime" value="${event.endTime}" placeholder="EndTime(ms)">
      <input class="eventImage" value="${event.image}" placeholder="Event Image URL">
      <button onclick="deleteEvent(${index})">Delete</button>
    `;
    container.appendChild(div);
  });
}
function addEvent(){
  const events = getEvents(); events.push({name:'New Event', desc:'', status:'coming', startTime:Date.now(), endTime:Date.now()+86400000, image:''});
  localStorage.setItem('eventData', JSON.stringify(events)); renderEventEditor();
}
function publishEvents(){ localStorage.setItem('eventDataPublished', localStorage.getItem('eventData')); alert('✅ Events published for users!'); }
function deleteEvent(index){ const events = getEvents(); events.splice(index,1); localStorage.setItem('eventData', JSON.stringify(events)); renderEventEditor(); }

// =======================
// Deal Editor
// =======================
function openDealEditor(){ document.getElementById('dealEditor').style.display='block'; renderDealEditor(); }
function getDeals(){ return JSON.parse(localStorage.getItem('dealData')||'[]'); }
function renderDealEditor(){
  const container=document.getElementById('dealsList'); container.innerHTML='';
  getDeals().forEach((deal,index)=>{
    const div=document.createElement('div'); div.className='dealRow'; div.dataset.index=index;
    div.innerHTML=`
      <input class="dealName" value="${deal.name}" placeholder="Deal Name">
      <input class="dealDesc" value="${deal.desc}" placeholder="Description">
      <input class="dealPrice" value="${deal.price}" placeholder="Price">
      <input class="dealImage" value="${deal.image}" placeholder="Image URL">
      <input class="dealEventId" value="${deal.eventId}" placeholder="Event ID">
      <select class="dealStatus">
        <option value="active" ${deal.status==='active'?'selected':''}>Active</option>
        <option value="inactive" ${deal.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <input class="dealEndTime" value="${deal.endTime}" placeholder="EndTime(ms)">
      <button onclick="deleteDeal(${index})">Delete</button>
    `;
    container.appendChild(div);
  });
}
function addDeal(){ const deals=getDeals(); deals.push({name:'New Deal', desc:'', price:0, image:'', eventId:'', status:'inactive', endTime:Date.now()+86400000}); localStorage.setItem('dealData', JSON.stringify(deals)); renderDealEditor(); }
function publishDeals(){ localStorage.setItem('dealDataPublished', localStorage.getItem('dealData')); alert('✅ Deals published for users!'); }
function deleteDeal(index){ const deals=getDeals(); deals.splice(index,1); localStorage.setItem('dealData', JSON.stringify(deals)); renderDealEditor(); }
</script>
</body>
</html>
