<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button, select { padding:6px; margin:5px; border-radius:4px; border:none; font-size:14px; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
#editor, #eventEditor, #dealEditor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.skinRow, .eventRow, .dealRow { margin-bottom:10px; }
.skinRow input, .eventRow input, .dealRow input, .dealRow select { margin:3px; }
.adminControls { margin-top:10px; border-top:1px solid #0af; padding-top:10px; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<h3>All Keys</h3>
<table id="keysTable">
<tr>
  <th>Key</th>
  <th>Name</th>
  <th>Coins</th>
  <th>Money</th>
  <th>Purchased Skins</th>
  <th>Actions</th>
</tr>
</table>

<!-- Skin Editor -->
<div style="margin-top:20px;">
  <button onclick="openSkinEditor()">Edit Skins</button>
</div>
<div id="editor">
  <h2>Skin Editor</h2>
  <button onclick="saveSkins()">Save Skins</button>
  <button onclick="publishSkins()">Publish Skins</button>
  <button onclick="addSkin()">Add Skin</button>
  <div id="skinsEditor"></div>
</div>

<!-- Event Editor -->
<div style="margin-top:20px;">
  <button onclick="openEventEditor()">Manage Events</button>
</div>
<div id="eventEditor">
  <h2>Event Editor</h2>
  <button onclick="addEvent()">Add Event</button>
  <button onclick="publishEvents()">Publish Events</button>
  <div id="eventsList"></div>
</div>

<!-- Deal Editor -->
<div style="margin-top:20px;">
  <button onclick="openDealEditor()">Manage Deals</button>
</div>
<div id="dealEditor">
  <h2>Deal Editor</h2>
  <button onclick="addDeal()">Add Deal</button>
  <button onclick="publishDeals()">Publish Deals</button>
  <div id="dealsList"></div>
</div>

<script>
// =======================
// Key Management
// =======================
function loadAllKeys(){
  const table=document.getElementById('keysTable');
  table.innerHTML='<tr><th>Key</th><th>Name</th><th>Coins</th><th>Money</th><th>Purchased Skins</th><th>Actions</th></tr>';
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data=JSON.parse(localStorage.getItem(k));
      const row=table.insertRow();
      row.insertCell(0).innerText=k.replace('skinshop_','');
      row.insertCell(1).innerText=data.name||'';
      row.insertCell(2).innerText=data.coins||0;
      row.insertCell(3).innerText=data.money||0;
      row.insertCell(4).innerText=data.owned?data.owned.join(', '):'';
      const actions=row.insertCell(5);
      actions.innerHTML=`
        <button onclick="editKey('${k}')">Edit</button>
        <button onclick="deleteKey('${k}')">Delete</button>
      `;
    }
  }
}
function showMessage(msg){ document.getElementById('message').textContent=msg; }
function editKey(storageKey){
  const data=JSON.parse(localStorage.getItem(storageKey));
  const newName=prompt('Enter new name:', data.name);
  if(newName) data.name=newName;
  const coins=parseFloat(prompt('Enter coins:', data.coins||0));
  if(!isNaN(coins)) data.coins=coins;
  const money=parseFloat(prompt('Enter money:', data.money||0));
  if(!isNaN(money)) data.money=money;
  localStorage.setItem(storageKey, JSON.stringify(data));
  loadAllKeys();
}
function deleteKey(storageKey){ if(confirm('Delete key?')){ localStorage.removeItem(storageKey); loadAllKeys(); } }
loadAllKeys();

// =======================
// Skin Editor
// =======================
function openSkinEditor(){ document.getElementById('editor').style.display='block'; renderSkinEditor(); }
function getSkins(){ return JSON.parse(localStorage.getItem('skinsData')||'[]'); }
function renderSkinEditor(){
  const container=document.getElementById('skinsEditor'); container.innerHTML='';
  getSkins().forEach(skin=>{
    const div=document.createElement('div'); div.className='skinRow';
    div.innerHTML=`
      <input class="skinName" value="${skin.name}" placeholder="Name">
      <input class="skinPrice" value="${skin.price}" placeholder="Price">
      <input class="skinImage" value="${skin.image}" placeholder="Image URL">
      <input type="file" onchange="uploadSkinImage(this,'${skin.id}')">
      <input type="datetime-local" class="skinStart" value="${skin.startTime?new Date(skin.startTime).toISOString().slice(0,16):''}">
      <input type="datetime-local" class="skinEnd" value="${skin.endTime?new Date(skin.endTime).toISOString().slice(0,16):''}">
      <button onclick="deleteSkin('${skin.id}')">Delete</button>
    `;
    container.appendChild(div);
  });
}
function addSkin(){
  const id='skin'+Date.now();
  const container=document.getElementById('skinsEditor');
  const div=document.createElement('div'); div.className='skinRow';
  div.innerHTML=`
    <input class="skinName" placeholder="Name">
    <input class="skinPrice" placeholder="Price">
    <input class="skinImage" placeholder="Image URL">
    <input type="file" onchange="uploadSkinImage(this,'${id}')">
    <input type="datetime-local" class="skinStart">
    <input type="datetime-local" class="skinEnd">
    <button onclick="deleteSkin('${id}')">Delete</button>
  `;
  container.appendChild(div);
}
function uploadSkinImage(input,id){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader(); reader.onload=e=>{ const row=document.querySelector(`.skinRow[data-id='${id}'] .skinImage`); if(row) row.value=e.target.result; }; reader.readAsDataURL(file);
}
function saveSkins(){
  const container=document.getElementById('skinsEditor'); const skinsArr=[];
  container.querySelectorAll('.skinRow').forEach(row=>{
    const id=row.dataset.id||'skin'+Date.now();
    skinsArr.push({
      id:id,
      name:row.querySelector('.skinName').value,
      price:parseFloat(row.querySelector('.skinPrice').value)||0,
      image:row.querySelector('.skinImage').value,
      startTime:new Date(row.querySelector('.skinStart').value).getTime(),
      endTime:new Date(row.querySelector('.skinEnd').value).getTime()
    });
  });
  localStorage.setItem('skinsData', JSON.stringify(skinsArr));
  alert('✅ Skins saved!');
}
function publishSkins(){ localStorage.setItem('skinsDataPublished', localStorage.getItem('skinsData')); alert('✅ Skins published!'); }
function deleteSkin(id){ const row=document.querySelector(`.skinRow[data-id='${id}']`); if(row) row.remove(); }

// =======================
// Event Editor
// =======================
function openEventEditor(){ document.getElementById('eventEditor').style.display='block'; renderEventEditor(); }
function getEvents(){ return JSON.parse(localStorage.getItem('eventData')||'[]'); }
function renderEventEditor(){
  const container=document.getElementById('eventsList'); container.innerHTML='';
  getEvents().forEach((event,index)=>{
    const div=document.createElement('div'); div.className='eventRow';
    div.innerHTML=`
      <input class="eventName" value="${event.name}" placeholder="Event Name">
      <input class="eventDesc" value="${event.desc}" placeholder="Description">
      <input class="eventBarImage" value="${event.barImage||''}" placeholder="Bar Image URL">
      <input class="eventImage" value="${event.image||''}" placeholder="Active Image URL">
      <input class="eventComingImage" value="${event.comingImage||''}" placeholder="Coming Soon Image URL">
      <input class="eventComingBg" value="${event.comingBg||''}" placeholder="Coming Soon Background URL">
      <select class="eventStatus">
        <option value="active" ${event.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${event.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${event.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <input type="datetime-local" class="eventStart" value="${event.startTime?new Date(event.startTime).toISOString().slice(0,16):''}">
      <input type="datetime-local" class="eventEnd" value="${event.endTime?new Date(event.endTime).toISOString().slice(0,16):''}">
      <button onclick="deleteEvent(${index})">Delete</button>
    `;
    container.appendChild(div);
  });
}
function addEvent(){ const events=getEvents(); events.push({name:'New Event',desc:'Description',status:'coming',startTime:Date.now(),endTime:Date.now()+86400000,barImage:'',image:'',comingImage:'',comingBg:''}); localStorage.setItem('eventData',JSON.stringify(events)); renderEventEditor(); }
function publishEvents(){ localStorage.setItem('eventDataPublished', localStorage.getItem('eventData')); alert('✅ Events published!'); }
function deleteEvent(index){ const events=getEvents(); events.splice(index,1); localStorage.setItem('eventData',JSON.stringify(events)); renderEventEditor(); }

// =======================
// Deal Editor
// =======================
function openDealEditor(){ document.getElementById('dealEditor').style.display='block'; renderDealEditor(); }
function getDeals(){ return JSON.parse(localStorage.getItem('dealData')||'[]'); }
function renderDealEditor(){
  const container=document.getElementById('dealsList'); container.innerHTML='';
  const events=getEvents();
  getDeals().forEach((deal,index)=>{
    let eventOptions=events.map(e=>`<option value="${e.id}" ${deal.eventId===e.id?'selected':''}>${e.name}</option>`).join('');
    const div=document.createElement('div'); div.className='dealRow';
    div.innerHTML=`
      <input class="dealName" value="${deal.name}" placeholder="Deal Name">
      <input class="dealDesc" value="${deal.desc}" placeholder="Description">
      <input class="dealPrice" value="${deal.price}" placeholder="Price">
      <input class="dealImage" value="${deal.image}" placeholder="Image URL">
      <input type="file" onchange="uploadDealImage(this,${index})">
      <input type="datetime-local" class="dealStart" value="${deal.startTime?new Date(deal.startTime).toISOString().slice(0,16):''}">
      <input type="datetime-local" class="dealEnd" value="${deal.endTime?new Date(deal.endTime).toISOString().slice(0,16):''}">
      <select class="dealEvent">${eventOptions}</select>
      <select class="dealStatus">
        <option value="active" ${deal.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${deal.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${deal.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <button onclick="deleteDeal(${index})">Delete</button>
    `;
    container.appendChild(div);
  });
}
function addDeal(){ const deals=getDeals(); deals.push({name:'',desc:'',price:0,image:'',startTime:Date.now(),endTime:Date.now()+86400000,eventId:'',status:'inactive'}); localStorage.setItem('dealData',JSON.stringify(deals)); renderDealEditor(); }
function uploadDealImage(input,index){ const file=input.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=e=>{ const deals=getDeals(); deals[index].image=e.target.result; localStorage.setItem('dealData',JSON.stringify(deals)); renderDealEditor(); }; reader.readAsDataURL(file); }
function publishDeals(){ localStorage.setItem('dealDataPublished', localStorage.getItem('dealData')); alert('✅ Deals published!'); }
function deleteDeal(index){ const deals=getDeals(); deals.splice(index,1); localStorage.setItem('dealData',JSON.stringify(deals)); renderDealEditor(); }
</script>
</body>
</html>
