<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
input, button, select { padding:6px; margin:5px; border-radius:4px; border:none; font-size:14px; }
button { cursor:pointer; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #555; padding:5px; text-align:left; }
th { background:#333; }
#editor, #eventEditor, #dealEditor { display:none; margin-top:20px; border:1px solid #0af; padding:10px; }
.skinRow, .eventRow, .dealRow { margin-bottom:10px; display:flex; align-items:center; gap:5px; }
.skinRow input, .skinRow select, .eventRow input, .eventRow select, .dealRow input, .dealRow select { margin:3px; }
.skinPreview { width:50px; height:50px; object-fit:cover; border:1px solid #0af; border-radius:6px; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<div id="message" style="color:yellow;"></div>

<h3>Add New Key</h3>
<input id="newKeyName" placeholder="Enter Name">
<button onclick="addNewKey()">Add Key</button>

<h3>All Keys</h3>
<table id="keysTable">
<tr>
  <th>Key</th>
  <th>Name</th>
  <th>Coins</th>
  <th>Money</th>
  <th>Purchased Skins</th>
  <th>Actions</th>
</tr>
</table>

<!-- Skin Editor -->
<div style="margin-top:20px;">
  <button onclick="openSkinEditor()">Edit Skins</button>
</div>
<div id="editor">
  <h2>Skin Editor</h2>
  <button onclick="addSkin()">Add Skin</button>
  <div id="skinsEditor"></div>
</div>

<!-- Event Editor -->
<div style="margin-top:20px;">
  <button onclick="openEventEditor()">Manage Events</button>
</div>
<div id="eventEditor">
  <h2>Event Editor</h2>
  <button onclick="addEvent()">Add Event</button>
  <button onclick="publishEvents()">Publish Events</button>
  <div id="eventsList"></div>
</div>

<!-- Deal Editor -->
<div style="margin-top:20px;">
  <button onclick="openDealEditor()">Manage Deals</button>
</div>
<div id="dealEditor">
  <h2>Deal Editor</h2>
  <button onclick="addDeal()">Add Deal</button>
  <button onclick="publishDeals()">Publish Deals</button>
  <div id="dealsList"></div>
</div>

<script>
// =======================
// Key Management Inline
// =======================
function showMessage(msg){ document.getElementById('message').textContent = msg; }

function loadAllKeys(){
  const table = document.getElementById('keysTable');
  table.innerHTML='<tr><th>Key</th><th>Name</th><th>Coins</th><th>Money</th><th>Purchased Skins</th><th>Actions</th></tr>';
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data = JSON.parse(localStorage.getItem(k));
      const row = table.insertRow();
      
      // Key field
      const keyCell = row.insertCell(0);
      const keyInput = document.createElement('input'); keyInput.value = k.replace('skinshop_','');
      keyInput.onchange = () => {
        const newKey = keyInput.value.trim();
        if(!newKey) return showMessage('Key cannot be empty');
        const newStorageKey = 'skinshop_'+newKey;
        if(newStorageKey !== k){
          localStorage.setItem(newStorageKey, JSON.stringify(data));
          localStorage.removeItem(k);
          loadAllKeys();
          showMessage('✅ Key updated inline');
        }
      }
      keyCell.appendChild(keyInput);
      
      // Name field
      const nameCell = row.insertCell(1);
      const nameInput = document.createElement('input'); nameInput.value = data.name || '';
      nameInput.onchange = ()=>{ data.name = nameInput.value; localStorage.setItem('skinshop_'+keyInput.value, JSON.stringify(data)); }
      nameCell.appendChild(nameInput);

      // Coins
      const coinsCell = row.insertCell(2);
      const coinsInput = document.createElement('input'); coinsInput.type='number'; coinsInput.value = data.coins||0;
      coinsInput.onchange = ()=>{ data.coins = parseFloat(coinsInput.value)||0; localStorage.setItem('skinshop_'+keyInput.value, JSON.stringify(data)); }
      coinsCell.appendChild(coinsInput);

      // Money
      const moneyCell = row.insertCell(3);
      const moneyInput = document.createElement('input'); moneyInput.type='number'; moneyInput.step="0.01"; moneyInput.value = data.money||0;
      moneyInput.onchange = ()=>{ data.money = parseFloat(moneyInput.value)||0; localStorage.setItem('skinshop_'+keyInput.value, JSON.stringify(data)); }
      moneyCell.appendChild(moneyInput);

      // Purchased skins preview
      const skinCell = row.insertCell(4);
      if(data.owned && data.owned.length){
        data.owned.forEach(sid=>{
          const skinData = getSkins().find(s=>s.id===sid);
          if(skinData){
            const img = document.createElement('img');
            img.src = skinData.image||''; img.alt = skinData.name||''; img.className='skinPreview';
            skinCell.appendChild(img);
          }
        });
      }

      // Actions
      const actions = row.insertCell(5);
      const delBtn = document.createElement('button'); delBtn.textContent='Delete';
      delBtn.onclick=()=>{ if(confirm('Delete this key?')){ localStorage.removeItem('skinshop_'+keyInput.value); loadAllKeys(); } }
      actions.appendChild(delBtn);
    }
  }
}

function addNewKey(){
  const name = document.getElementById('newKeyName').value.trim();
  if(!name) return showMessage('Enter a name');
  const key = Math.random().toString(36).substring(2,10);
  localStorage.setItem('skinshop_'+key, JSON.stringify({name:name, coins:0, money:0, owned:[]}));
  showMessage('✅ New key created: '+key);
  document.getElementById('newKeyName').value='';
  loadAllKeys();
}

// =======================
// Skin Editor Inline
// =======================
function openSkinEditor(){ document.getElementById('editor').style.display='block'; renderSkinEditor(); }
function getSkins(){ return JSON.parse(localStorage.getItem('skinsData')||'[]'); }
function renderSkinEditor(){
  const container = document.getElementById('skinsEditor');
  container.innerHTML='';
  getSkins().forEach(skin=>{
    const div = document.createElement('div'); div.className='skinRow'; div.dataset.id = skin.id;
    div.innerHTML=`
      <input class="skinName" value="${skin.name}" placeholder="Name">
      <input class="skinPrice" value="${skin.price}" placeholder="Price">
      <select class="skinUseFor">
        <option value="coins" ${skin.useFor==='coins'?'selected':''}>Coins</option>
        <option value="deals" ${skin.useFor==='deals'?'selected':''}>Deals</option>
      </select>
      <input class="skinImage" value="${skin.image}" placeholder="Image URL">
      <input type="file" accept="image/*">
      <button>Delete</button>
    `;
    // inline save
    div.querySelector('.skinName').onchange = ()=> saveSkinInline(skin.id, div);
    div.querySelector('.skinPrice').onchange = ()=> saveSkinInline(skin.id, div);
    div.querySelector('.skinUseFor').onchange = ()=> saveSkinInline(skin.id, div);
    div.querySelector('.skinImage').onchange = ()=> saveSkinInline(skin.id, div);
    // file upload
    div.querySelector('input[type=file]').onchange = (e)=> uploadSkinImage(e, skin.id, div);
    // delete
    div.querySelector('button').onclick = ()=> deleteSkin(skin.id);
    container.appendChild(div);
  });
}

function saveSkinInline(id, div){
  const skins = getSkins();
  const skin = skins.find(s=>s.id===id);
  if(!skin) return;
  skin.name = div.querySelector('.skinName').value;
  skin.price = parseInt(div.querySelector('.skinPrice').value)||0;
  skin.useFor = div.querySelector('.skinUseFor').value;
  skin.image = div.querySelector('.skinImage').value;
  localStorage.setItem('skinsData', JSON.stringify(skins));
  showMessage('✅ Skin updated inline');
}

function uploadSkinImage(input,id,div){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    div.querySelector('.skinImage').value=e.target.result;
    saveSkinInline(id,div);
  }
  reader.readAsDataURL(file);
}

function addSkin(){
  const skins = getSkins();
  const id='skin'+Date.now();
  skins.push({id:id,name:'New Skin',price:0,image:'',useFor:'coins'});
  localStorage.setItem('skinsData', JSON.stringify(skins));
  renderSkinEditor();
}

function deleteSkin(id){
  const skins = getSkins().filter(s=>s.id!==id);
  localStorage.setItem('skinsData', JSON.stringify(skins));
  renderSkinEditor();
}

// =======================
// Event Editor
// =======================
function openEventEditor(){ document.getElementById('eventEditor').style.display='block'; renderEventEditor(); }
function getEvents(){ return JSON.parse(localStorage.getItem('eventData')||'[]'); }
function renderEventEditor(){
  const container=document.getElementById('eventsList'); container.innerHTML='';
  getEvents().forEach((event,index)=>{
    const div=document.createElement('div'); div.className='eventRow'; div.dataset.index=index;
    const startVal=new Date(event.startTime).toISOString().slice(0,16);
    const endVal=new Date(event.endTime).toISOString().slice(0,16);
    div.innerHTML=`
      <input class="eventName" value="${event.name}">
      <input class="eventDesc" value="${event.desc}">
      <select class="eventStatus">
        <option value="active" ${event.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${event.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${event.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <input class="eventStart" type="datetime-local" value="${startVal}">
      <input class="eventEnd" type="datetime-local" value="${endVal}">
      <input class="eventImage" value="${event.image||''}">
      <input type="file">
      <button>Delete</button>
    `;
    // inline save
    div.querySelectorAll('input,select').forEach(inp=>{
      inp.onchange = ()=> saveEventInline(index, div);
    });
    // file upload
    div.querySelector('input[type=file]').onchange=(e)=> uploadEventImage(e,index,div);
    // delete
    div.querySelector('button').onclick = ()=> deleteEvent(index);
    container.appendChild(div);
  });
}

function saveEventInline(index,div){
  const events = getEvents();
  const ev = events[index];
  ev.name = div.querySelector('.eventName').value;
  ev.desc = div.querySelector('.eventDesc').value;
  ev.status = div.querySelector('.eventStatus').value;
  ev.startTime = new Date(div.querySelector('.eventStart').value).getTime();
  ev.endTime = new Date(div.querySelector('.eventEnd').value).getTime();
  ev.image = div.querySelector('.eventImage').value;
  localStorage.setItem('eventData', JSON.stringify(events));
}

function uploadEventImage(input,index,div){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    div.querySelector('.eventImage').value=e.target.result;
    saveEventInline(index,div);
  }
  reader.readAsDataURL(file);
}

function addEvent(){
  const events=getEvents();
  events.push({id:'event'+Date.now(),name:'New Event',desc:'Desc',status:'coming',startTime:Date.now(),endTime:Date.now()+3600000,image:''});
  localStorage.setItem('eventData', JSON.stringify(events));
  renderEventEditor();
}

function deleteEvent(index){
  const events = getEvents(); events.splice(index,1); localStorage.setItem('eventData', JSON.stringify(events));
  renderEventEditor();
}

function publishEvents(){ localStorage.setItem('eventDataPublished', localStorage.getItem('eventData')); alert('✅ Events published'); }

// =======================
// Deal Editor
// =======================
function openDealEditor(){ document.getElementById('dealEditor').style.display='block'; renderDealEditor(); }
function getDeals(){ return JSON.parse(localStorage.getItem('dealData')||'[]'); }
function renderDealEditor(){
  const container = document.getElementById('dealsList'); container.innerHTML='';
  const events = getEvents();
  const skins = getSkins();
  getDeals().forEach((deal,index)=>{
    const div=document.createElement('div'); div.className='dealRow'; div.dataset.index=index;
    const startVal=new Date(deal.startTime).toISOString().slice(0,16);
    const endVal=new Date(deal.endTime).toISOString().slice(0,16);
    const eventOptions = events.map(e=>`<option value="${e.id}" ${deal.eventId===e.id?'selected':''}>${e.name}</option>`).join('');
    const skinOptions = skins.map(s=>`<option value="${s.id}" ${deal.skins && deal.skins.includes(s.id)?'selected':''}>${s.name}</option>`).join('');
    div.innerHTML=`
      <input class="dealName" value="${deal.name}">
      <input class="dealDesc" value="${deal.desc}">
      <input class="dealPrice" type="number" value="${deal.price||0}">
      <select class="dealStatus">
        <option value="active" ${deal.status==='active'?'selected':''}>Active</option>
        <option value="coming" ${deal.status==='coming'?'selected':''}>Coming Soon</option>
        <option value="inactive" ${deal.status==='inactive'?'selected':''}>Inactive</option>
      </select>
      <input class="dealStart" type="datetime-local" value="${startVal}">
      <input class="dealEnd" type="datetime-local" value="${endVal}">
      <select class="dealEvent">${eventOptions}</select>
      <input class="dealImage" value="${deal.image||''}" disabled>
      <label>Assign Skins:</label>
      <select class="dealSkins" multiple style="width:200px;">${skinOptions}</select>
      <button>Delete</button>
    `;
    // inline save
    div.querySelectorAll('input,select').forEach(inp=>{
      inp.onchange = ()=> saveDealInline(index,div);
    });
    div.querySelector('button').onclick = ()=> deleteDeal(index);
    container.appendChild(div);
  });
}

function saveDealInline(index,div){
  const deals = getDeals();
  const deal = deals[index];
  deal.name = div.querySelector('.dealName').value;
  deal.desc = div.querySelector('.dealDesc').value;
  deal.price = parseFloat(div.querySelector('.dealPrice').value)||0;
  deal.status = div.querySelector('.dealStatus').value;
  deal.startTime = new Date(div.querySelector('.dealStart').value).getTime();
  deal.endTime = new Date(div.querySelector('.dealEnd').value).getTime();
  deal.eventId = div.querySelector('.dealEvent').value;
  deal.skins = [...div.querySelector('.dealSkins').selectedOptions].map(o=>o.value);
  localStorage.setItem('dealData', JSON.stringify(deals));
}

function addDeal(){
  const deals = getDeals();
  deals.push({name:'New Deal',desc:'Description',status:'coming',startTime:Date.now(),endTime:Date.now()+3600000,price:0,eventId:'',image:'',skins:[]});
  localStorage.setItem('dealData', JSON.stringify(deals));
  renderDealEditor();
}

function deleteDeal(index){
  const deals = getDeals(); deals.splice(index,1); localStorage.setItem('dealData', JSON.stringify(deals));
  renderDealEditor();
}

function publishDeals(){ localStorage.setItem('dealDataPublished', localStorage.getItem('dealData')); alert('✅ Deals published'); }

loadAllKeys();
</script>
</body>
</html>
