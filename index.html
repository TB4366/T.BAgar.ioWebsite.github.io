<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.B AGAR.IO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

/* BASIS (geen background hier meer!) */
body{
    color:white;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
}

/* DONKER */
.dark-mode{
    background: linear-gradient(135deg,#1e293b,#334155,#475569,#64748b);
}

/* LICHT */
.light-mode{
    background: linear-gradient(135deg,#ffffff,#e0f2fe,#bae6fd,#7dd3fc);
}

/* GLOW */
body::after{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    background:radial-gradient(circle,#0ea5e9,transparent 70%);
    top:-200px;
    right:-200px;
    opacity:0.2;
    z-index:-1;
    animation:moveGlow 10s infinite alternate;
}

@keyframes moveGlow{
    from{transform:translate(0,0)}
    to{transform:translate(-100px,100px)}
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 30px;
    background:rgba(15,23,42,0.6);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:45px;
    height:45px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 15px #0ea5e9;
}

.site-name{
    font-size:22px;
    font-weight:bold;
    text-shadow:0 0 15px rgba(0,140,255,0.9);
}

.search input{
    padding:8px 12px;
    border-radius:8px;
    border:none;
    outline:none;
}

.menu-btn{
    background:none;
    border:none;
    font-size:24px;
    cursor:pointer;
    color:white;
}

.theme-btn{
    background:none;
    border:none;
    font-size:22px;
    cursor:pointer;
    color:white;
    margin-left:10px;
}

.menu{
    display:none;
    position:absolute;
    top:70px;
    right:30px;
    background:rgba(15,23,42,0.9);
    backdrop-filter:blur(10px);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 25px rgba(0,0,0,0.6);
}

.menu a{
    display:block;
    padding:14px 20px;
    text-decoration:none;
    color:white;
    border-bottom:1px solid rgba(255,255,255,0.1);
    transition:0.3s;
}

.menu a:hover{
    background:rgba(0,140,255,0.4);
}

/* MAIN */
main{
    text-align:center;
    padding:50px 20px;
}

h1,h2{
    text-shadow:0 0 20px #0ea5e9;
}

hr{
    width:80%;
    margin:40px auto;
    border:1px solid rgba(255,255,255,0.2);
}

/* VIDEOS */
.videos{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:30px 0;
}

iframe{
    width:420px;
    height:236px;
    border:none;
    border-radius:14px;
    box-shadow:0 0 25px rgba(0,140,255,0.5);
}

/* OPTIONS */
.options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
    max-width:1000px;
    margin:40px auto;
}

.option{
    padding:35px;
    border-radius:18px;
    cursor:pointer;
    font-weight:bold;
    backdrop-filter: blur(10px);
    background:linear-gradient(135deg,#1e3a8a,#0ea5e9);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 25px rgba(0,0,0,0.4);
    transition:0.3s;
}

.option:hover{
    transform:translateY(-8px) scale(1.07);
    box-shadow:0 0 35px rgba(0,140,255,0.9);
}

/* SOCIAL BUTTONS */
.social-buttons{
    display:flex;
    justify-content:center;
    gap:25px;
    margin:40px 0;
    flex-wrap:wrap;
}

.social-buttons a{
    padding:14px 30px;
    border-radius:12px;
    font-weight:bold;
    text-decoration:none;
    color:white;
    transition:0.3s;
    box-shadow:0 0 15px rgba(0,0,0,0.5);
}

.social-buttons a:hover{
    transform:scale(1.1);
}

.youtube{background:#ff0000;}
.instagram{background:linear-gradient(45deg,#f97316,#facc15);}
.discord{background:#5865F2;}

.particle{
    position:fixed;
    width:6px;
    height:6px;
    background:#0ea5e9;
    border-radius:50%;
    opacity:0.4;
    animation:float 10s linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh)}
    to{transform:translateY(-10vh)}
}

</style>
</head>

<body class="dark-mode">

<header>
    <div class="left">
        <div class="logo">
            <img src="74BF9245-C3FD-4FAE-9CE1-D1AA11CFA7FF.jpeg">
        </div>
        <div class="site-name">T.B AGAR.IO</div>
        <div class="search">
            <input type="text" placeholder="Search...">
        </div>
    </div>

    <div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌞</button>
    </div>

    <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="custom-skins.html">Custom Skins</a>
        <a href="key-access.html">Keys</a>
        <a href="mod-menu.html">Mod Menu</a>
        <a href="paidskins.html">Paid Skins</a>
        <a href="buy-account.html">Buy Account</a>
        <a href="agar.io-skins.html">Agar.io Skins</a>
    </div>
</header>

<main>
    <h1>WELCOME!</h1>
</main>

<script>
function toggleMenu(){
    const m=document.getElementById("menu");
    m.style.display = m.style.display==="block" ? "none" : "block";
}

/* FIXED THEME */
function toggleTheme(){
    const body=document.body;
    const btn=document.getElementById("themeBtn");

    if(body.classList.contains("dark-mode")){
        body.classList.remove("dark-mode");
        body.classList.add("light-mode");
        btn.textContent="🌙";
    }else{
        body.classList.remove("light-mode");
        body.classList.add("dark-mode");
        btn.textContent="🌞";
    }
}

// PARTICLES
for(let i=0;i<25;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(5+Math.random()*10)+"s";
    document.body.appendChild(p);
}
</script>

</body>
</html>
