<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.B AGAR.IO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
    background:#0b1220;
    color:white;
    transition:0.3s;
}
body.light{
    background:#f1f5f9;
    color:#111;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 20px;
    background:#0f172a;
    position:relative;
}
body.light header{background:#e2e8f0;}

.left{
    display:flex;
    align-items:center;
    gap:10px;
}
.logo{
    width:40px;height:40px;border-radius:50%;
    background:#48cae4;
}
.site-name{font-size:20px;font-weight:bold;}
.search input{
    padding:6px 10px;
    border-radius:6px;
    border:none;
    outline:none;
}

.right{
    display:flex;
    gap:10px;
    align-items:center;
}
.login-btn{
    padding:6px 14px;
    border:none;
    border-radius:6px;
    background:#48cae4;
    font-weight:bold;
    cursor:pointer;
}
.toggle-theme,.menu-btn{
    background:none;
    border:none;
    font-size:22px;
    cursor:pointer;
}

/* MENU */
.menu{
    display:none;
    position:absolute;
    top:60px;
    right:20px;
    background:#1e293b;
    border-radius:8px;
    overflow:hidden;
}
body.light .menu{background:#cbd5e1;}
.menu a{
    display:block;
    padding:12px 16px;
    text-decoration:none;
    color:white;
    border-bottom:1px solid #334155;
}
body.light .menu a{color:#111;}
.menu a:hover{background:#334155;}
body.light .menu a:hover{background:#94a3b8;}

/* MAIN */
main{text-align:center;padding:40px 20px;}
hr{width:80%;margin:30px auto;border:1px solid #334155;}
body.light hr{border-color:#94a3b8;}

/* VIDEOS */
.videos{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:30px 0;
}
iframe{
    width:420px;
    height:236px;
    border:none;
    border-radius:12px;
}

/* OPTIONS */
.options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    max-width:900px;
    margin:30px auto;
}
.option{
    padding:30px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
    color:white;
}
.option:hover{transform:scale(1.05);}

.opt1{background:#06b6d4;}
.opt2{background:#22c55e;}
.opt3{background:#a855f7;}
.opt4{background:#facc15;color:#111;}
.opt5{background:#ef4444;}
.opt6{background:#3b82f6;}

/* SOCIAL BUTTONS */
.social-buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:30px 0;
    flex-wrap:wrap;
}
.social-buttons a{
    padding:14px 26px;
    border-radius:10px;
    font-weight:bold;
    text-decoration:none;
    color:white;
    transition:0.3s;
}
.social-buttons a:hover{transform:scale(1.08);}

.youtube{background:#ff0000;}
.instagram{background:linear-gradient(45deg,#f97316,#facc15);}
.discord{background:#5865F2;}
</style>
</head>

<body>

<header>
    <div class="left">
        <div class="logo"></div>
        <div class="site-name">T.B AGAR.IO</div>
        <div class="search"><input type="text" placeholder="Search..."></div>
    </div>

    <div class="right">
        <button class="login-btn" id="loginBtn">Login</button>
        <button class="toggle-theme" id="themeBtn">🌙</button>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="custom-skins.html">Custom Skins</a>
        <a href="key-access.html">Keys</a>
        <a href="mod-menu.html">Mod Menu</a>
        <a href="paidskins.html">Paid Skins</a>
    </div>
</header>

<main>
    <h1>WELCOME!</h1>

    <hr>

    <h2>T.B CHANNEL</h2>

    <div class="videos">
        <iframe src="https://www.youtube.com/embed/02x2YFHWh2o" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/d8DluzJAd2w" allowfullscreen></iframe>
    </div>

    <hr>

    <h2>Choose your option!</h2>

    <div class="options">
        <div class="option opt1" onclick="location.href='custom-skins.html'">Custom Skins</div>
        <div class="option opt2" onclick="location.href='key-access.html'">Keys</div>
        <div class="option opt3" onclick="location.href='mod-menu.html'">Mod Menu</div>
        <div class="option opt4" onclick="location.href='paidskins.html'">Paid Skins</div>
        <div class="option opt5" onclick="location.href='buy-account.html'">Buy Account</div>
        <div class="option opt6" onclick="location.href='agar.io-skins.html'">Agar.io Skins</div>
    </div>

    <hr>

    <div class="social-buttons">
        <a class="youtube" href="https://www.youtube.com/@T.B6" target="_blank">YouTube</a>
        <a class="instagram" href="https://www.instagram.com/t.bagar.io/" target="_blank">Instagram</a>
        <a class="discord" href="https://discord.gg/qhuXPrVzBx" target="_blank">Discord</a>
    </div>
</main>

<!-- LOGIN MODAL -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#0f172a;padding:25px;border-radius:14px;width:320px;text-align:center;">
    <h2>Login</h2>
    <hr style="border:1px solid #334155;margin:15px 0;">
    <input id="loginUser" placeholder="Username" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none;">
    <input id="loginKey" placeholder="Key" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none;">
    <button onclick="doLogin()" style="margin-top:12px;padding:10px 20px;border:none;border-radius:8px;background:#48cae4;font-weight:bold;">Login</button>
    <br><br>
    <button onclick="closeLogin()" style="background:none;border:none;color:#94a3b8;">Cancel</button>
  </div>
</div>

<script>
function toggleMenu(){
    const m=document.getElementById("menu");
    m.style.display=m.style.display==="block"?"none":"block";
}

/* DARK MODE */
const btn=document.getElementById("themeBtn");
if(localStorage.getItem("theme")==="light"){
    document.body.classList.add("light");
    btn.textContent="☀️";
}
btn.onclick=()=>{
    document.body.classList.toggle("light");
    const light=document.body.classList.contains("light");
    btn.textContent=light?"☀️":"🌙";
    localStorage.setItem("theme",light?"light":"dark");
};

/* LOGIN SYSTEM */
const loginModal=document.getElementById("loginModal");
const loginBtnEl = document.getElementById("loginBtn");

// Open login modal
loginBtnEl.onclick=()=>loginModal.style.display="flex";

// Close login modal
function closeLogin(){loginModal.style.display="none";}

// Users from localStorage
function getUsers(){
  return JSON.parse(localStorage.getItem("users")||"[]");
}

// LOGIN - blijft op dezelfde pagina
function doLogin(){
  const u=document.getElementById("loginUser").value.trim();
  const k=document.getElementById("loginKey").value.trim();
  const users=getUsers();
  const found=users.find(x=>x.username===u && x.key===k);
  if(found){
    localStorage.setItem("loggedUser", u);
    updateLoginButton();
    closeLogin();
    alert("Welkom, " + u + "! Je bent ingelogd."); // blijft op dezelfde pagina
  } else {
    alert("Wrong username or key");
  }
}

// UPDATE LOGIN BUTTON TO LOGOUT
function updateLoginButton() {
  const loggedUser = localStorage.getItem("loggedUser");
  if(loggedUser){
    loginBtnEl.textContent = "Logout";
    loginBtnEl.onclick = () => {
      localStorage.removeItem("loggedUser");
      loginBtnEl.textContent = "Login";
      loginBtnEl.onclick = () => loginModal.style.display="flex";
      alert("Je bent uitgelogd");
      location.reload();
    }
  } else {
    loginBtnEl.textContent = "Login";
    loginBtnEl.onclick = () => loginModal.style.display="flex";
  }
}

// RUN ON PAGE LOAD
updateLoginButton();
</script>

</body>
</html>
