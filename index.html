<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>T.B Agar.io Website</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: #0f172a;
  }

  .left-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
  }

  .site-title {
    font-size: 1.4rem;
    font-weight: bold;
  }

  .search-bar input {
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    width: 180px;
  }

  .menu-btn {
    font-size: 26px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
  }

  .menu {
    display: none;
    position: absolute;
    right: 20px;
    top: 65px;
    background: #1e293b;
    border-radius: 10px;
    overflow: hidden;
    width: 170px;
  }

  .menu a {
    color: white;
    padding: 12px;
    display: block;
    text-decoration: none;
    border-bottom: 1px solid #334155;
  }

  .divider {
    max-width: 900px;
    margin: 40px auto;
    border-top: 2px solid #48cae4;
  }

  .highlight-title {
    text-align: center;
    font-size: 1.8rem;
    font-weight: bold;
    margin-bottom: 25px;
    color: #48cae4;
  }

  .skins-circles {
    max-width: 900px;
    margin: 0 auto 40px auto;
    display: flex;
    justify-content: center;
    gap: 35px;
    flex-wrap: wrap;
  }

  .circle-block {
    text-align: center;
    position: relative;
  }

  .circle {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 15px #48cae4;
  }

  .circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .skin-name {
    margin-top: 10px;
    font-size: 1rem;
    font-weight: bold;
  }

  .price-badge {
    margin-top: 8px;
    background: #ef4444;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    display: inline-block;
  }

  .best-deal-badge {
    position: absolute;
    top: -10px;
    left: -10px;
    background: gold;
    color: black;
    padding: 5px 8px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.8rem;
  }

  .btn {
    display: inline-block;
    background: #06b6d4;
    color: black;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
  }

  .main-video {
    display: flex;
    justify-content: center;
    margin-top: 25px;
  }

  iframe {
    border: none;
    border-radius: 12px;
  }
</style>
</head>

<body>

<header>
  <div class="left-header">
    <img src="IMG_2718.png" class="logo" />
    <span class="site-title">T.B Agar.io</span>

    <div class="search-bar">
      <input type="text" placeholder="Search..." />
    </div>
  </div>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="menu" id="menu">
    <a href="index.html">🏠 Home</a>
    <a href="agar.io-skins.html">🎱 Agar.io Skins</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
    <a href="key-access.html">🔑 Keys</a>
    <a href="buy-account.html">💰 Buy Account</a>
    <a href="paidskins.html">💎 Paid Skins</a>
  </div>
</header>

<main>

<div class="divider"></div>
<div class="highlight-title">Paid Skins Deals</div>

<div class="skins-circles" id="paidSkinsContainer"></div>

<div style="text-align:center; margin-bottom:40px;">
  <a href="paidskins.html" class="btn">View All Skins</a>
</div>

<div class="divider"></div>

<div class="main-video">
  <iframe width="560" height="315" src="https://www.youtube.com/embed/OEkurL8aaZk" allowfullscreen></iframe>
</div>

</main>

<script>
function toggleMenu() {
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

const paidSkins = [
  {
    id: "skin_1",
    name: "Cyber Dragon",
    img: "IMG_6174.webp",
    price: "$4.99",
    best: true
  },
  {
    id: "skin_2",
    name: "Neon Reaper",
    img: "IMG_6175.webp",
    price: "$6.99",
    best: false
  },
  {
    id: "skin_3",
    name: "Mecha Skull",
    img: "IMG_6260.webp",
    price: "$3.49",
    best: false
  }
];

const container = document.getElementById("paidSkinsContainer");

paidSkins.forEach(skin => {
  const block = document.createElement("div");
  block.className = "circle-block";

  const circle = document.createElement("div");
  circle.className = "circle";

  const img = document.createElement("img");
  img.src = skin.img;
  circle.appendChild(img);

  if (skin.best) {
    const badge = document.createElement("div");
    badge.className = "best-deal-badge";
    badge.textContent = "Best Deal";
    block.appendChild(badge);
  }

  const name = document.createElement("div");
  name.className = "skin-name";
  name.textContent = skin.name;

  const price = document.createElement("div");
  price.className = "price-badge";
  price.textContent = skin.price;
  price.onclick = () => {
    localStorage.setItem("addSkinId", skin.id);
    window.location.href = "paidskins.html";
  };

  block.appendChild(circle);
  block.appendChild(name);
  block.appendChild(price);

  container.appendChild(block);
});
</script>

</body>
</html>
