<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>T.B Agar.io — Home</title>
<style>
  :root{
    --bg:#0b1220;
    --header:#0f172a;
    --accent:#48cae4;
    --muted:#334155;
    --sale:#ef4444;
    --gold:#f6c85f;
  }
  /* Basic */
  *{box-sizing:border-box}
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: #fff;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 20px;
    background:var(--header);
    position:relative;
  }
  .left-header{display:flex;align-items:center;gap:12px}
  .logo{width:45px;height:45px;border-radius:50%;object-fit:cover}
  .site-title{font-size:1.25rem;font-weight:700}
  .search-bar input{
    padding:8px 12px;border-radius:6px;border:none;outline:none;font-size:14px;width:180px;margin-left:12px;
  }
  .toggle-btn-header{background:none;border:none;cursor:pointer;font-size:20px;color:#07a9d6;padding:6px 8px;border-radius:8px}
  .menu-btn{font-size:26px;background:none;border:none;color:white;cursor:pointer}
  .menu{
    display:none;
    position:absolute;
    top:60px;right:20px;
    background:#162033;border-radius:8px;overflow:hidden;min-width:180px;box-shadow:0 8px 30px rgba(0,0,0,0.6);
  }
  .menu a{display:block;padding:12px;color:#fff;text-decoration:none;border-bottom:1px solid var(--muted)}
  .menu a:hover{background:#243142}
  /* Layout */
  main{max-width:1100px;margin:0 auto;padding:20px}
  .divider{max-width:900px;margin:30px auto;border-top:2px solid var(--accent)}
  .highlight-title{text-align:center;font-size:1.8rem;font-weight:700;margin:18px 0;color:var(--accent)}
  /* Paid skins */
  .skins-circles{max-width:900px;margin:0 auto 30px;display:flex;justify-content:center;gap:32px;flex-wrap:wrap}
  .circle-block{text-align:center;position:relative;width:180px}
  .circle{
    width:150px;height:150px;border-radius:50%;overflow:hidden;margin:0 auto;
    background:#000;box-shadow:0 0 18px rgba(72,202,228,0.15);display:flex;align-items:center;justify-content:center;
  }
  .circle img{width:100%;height:100%;object-fit:cover;display:block}
  .skin-name{margin-top:10px;font-weight:700}
  .price-badge{
    margin-top:8px;background:var(--sale);color:white;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;display:inline-block;
    transition:transform .12s ease;
  }
  .price-badge:hover{transform:scale(1.04)}
  .best-deal-badge{
    position:absolute;left:-6px;top:-8px;background:var(--gold);color:#111;padding:6px 8px;border-radius:8px;font-weight:800;font-size:0.8rem;box-shadow:0 6px 18px rgba(0,0,0,0.2)
  }
  /* Videos */
  .main-video{display:flex;justify-content:center;margin-top:20px}
  .video-grid{display:flex;justify-content:center;gap:20px;margin:20px;flex-wrap:wrap}
  iframe{border:none;border-radius:12px}
  /* Custom skins (carousel circles) - keep same size as original + improved style */
  .custom-section{max-width:900px;margin:20px auto;display:flex;flex-direction:column;align-items:center;gap:8px}
  .custom-circles{display:flex;gap:36px;justify-content:center;flex-wrap:wrap}
  .custom-circle{width:150px;height:150px;border-radius:50%;overflow:hidden;background:#000;position:relative;box-shadow:0 0 30px rgba(72,202,228,0.12)}
  .custom-circle img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease}
  .custom-circle img.show{opacity:1}
  .custom-label{text-align:center;color:#cfeefd;margin-top:8px;font-weight:600}
  /* footer buttons (view all) */
  .cta-wrap{text-align:center;margin:20px 0}
  .btn{display:inline-block;background:#06b6d4;color:#02111a;padding:10px 18px;border-radius:8px;font-weight:800;text-decoration:none}
  /* responsive */
  @media (max-width:720px){
    .skins-circles{gap:18px}
    .circle-block{width:140px}
    .circle{width:130px;height:130px}
    .custom-circle{width:130px;height:130px}
  }
</style>
</head>
<body>

<header>
  <div class="left-header">
    <img src="IMG_2718.png" alt="logo" class="logo" />
    <div>
      <div class="site-title">T.B Agar.io</div>
    </div>

    <div class="search-bar">
      <input id="siteSearch" type="text" placeholder="Zoeken..." />
    </div>

    <button class="toggle-btn-header" id="themeToggleBtn" title="Toggle theme">🌙</button>
  </div>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <nav class="menu" id="menu">
    <a href="index.html">🏠 Home Pagina</a>
    <a href="agar.io-skins.html">🎱 Agar.io Skins</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
    <a href="key-access.html">🔑 Keys</a>
    <a href="buy-account.html">💰 Buy Account</a>
    <a href="paidskins.html">💎 Paid Skins</a>
  </nav>
</header>

<main>
  <!-- Paid skins -->
  <div class="divider"></div>
  <div class="highlight-title">Paid Skins Deals</div>

  <div class="skins-circles" id="paidSkinsContainer">
    <!-- JS will inject 3 paid skins here -->
  </div>

  <div class="cta-wrap">
    <a href="paidskins.html" class="btn">View All Skins</a>
  </div>

  <div class="divider"></div>

  <!-- Main Video -->
  <div class="main-video">
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OEkurL8aaZk" allowfullscreen></iframe>
  </div>

  <!-- Two smaller videos -->
  <div class="video-grid">
    <iframe width="360" height="215" src="https://www.youtube.com/embed/diAuO3IC8Hg" allowfullscreen></iframe>
    <iframe width="360" height="215" src="https://www.youtube.com/embed/m0DEe4RhgSw" allowfullscreen></iframe>
  </div>

  <div class="divider"></div>

  <!-- Custom skins improved (version B look) -->
  <div class="highlight-title">The Best Custom Skins</div>

  <section class="custom-section">
    <div class="custom-circles">
      <div class="custom-circle" id="customCircle1" aria-label="custom circle 1"></div>
      <div class="custom-circle" id="customCircle2" aria-label="custom circle 2"></div>
      <div class="custom-circle" id="customCircle3" aria-label="custom circle 3"></div>
    </div>
    <div style="display:flex;gap:40px;justify-content:center;width:100%;flex-wrap:wrap;margin-top:8px;">
      <div class="custom-label">Circle 1</div>
      <div class="custom-label">Circle 2</div>
      <div class="custom-label">Circle 3</div>
    </div>
  </section>

  <div class="divider"></div>
  <div class="highlight-title">T.B Keys</div>

</main>

<script>
/* ---------- Header / small utils ---------- */
function toggleMenu(){
  const m=document.getElementById('menu');
  m.style.display = m.style.display === 'block' ? 'none' : 'block';
}
/* dark mode */
const themeBtn=document.getElementById('themeToggleBtn');
const body=document.body;
const saved = localStorage.getItem('tb_theme');
if(saved==='light'){ body.classList.add('light-mode'); themeBtn.textContent='🌙';}
if(saved==='dark'){ body.style.background='#f0f0f0'; body.style.color='#111'; themeBtn.textContent='☀️'; }
themeBtn.addEventListener('click', ()=>{
  // simple toggle for background/text (keeps original design mostly)
  if(body.style.background === 'var(--bg)' || body.style.background === ''){
    body.style.background = '#f0f0f0';
    body.style.color = '#111';
    themeBtn.textContent='☀️';
    localStorage.setItem('tb_theme','dark');
  } else {
    body.style.background = '';
    body.style.color = '';
    themeBtn.textContent='🌙';
    localStorage.setItem('tb_theme','light');
  }
});

/* ---------- Paid skins data (the three we agreed) ---------- */
const paidSkins = [
  { id: 'skin_1', name: 'Cyber Dragon', img: 'IMG_6174.webp', price: '$4.99', best: true },
  { id: 'skin_2', name: 'Neon Reaper', img: 'IMG_6175.webp', price: '$6.99', best: false },
  { id: 'skin_3', name: 'Mecha Skull', img: 'IMG_6260.webp', price: '$3.49', best: false }
];

const paidContainer = document.getElementById('paidSkinsContainer');

function renderPaidSkins(){
  paidContainer.innerHTML = '';
  paidSkins.forEach(skin => {
    const wrapper = document.createElement('div');
    wrapper.className = 'circle-block';

    const circle = document.createElement('div');
    circle.className = 'circle';

    const img = document.createElement('img');
    img.src = skin.img;
    img.alt = skin.name;
    circle.appendChild(img);

    // best badge appended on wrapper so it overlaps nicely
    if(skin.best){
      const badge = document.createElement('div');
      badge.className = 'best-deal-badge';
      badge.textContent = 'BEST DEAL';
      wrapper.appendChild(badge);
    }

    const nameDiv = document.createElement('div');
    nameDiv.className = 'skin-name';
    nameDiv.textContent = skin.name;

    const priceBtn = document.createElement('div');
    priceBtn.className = 'price-badge';
    priceBtn.textContent = skin.price + ' - Buy Now';
    priceBtn.title = 'Buy ' + skin.name;
    priceBtn.addEventListener('click', ()=>{
      // store selected skin id so paidskins.html can pick it up and auto-add to cart
      localStorage.setItem('addSkinId', skin.id);
      // optionally store name/price for convenience
      localStorage.setItem('addSkinName', skin.name);
      localStorage.setItem('addSkinPrice', skin.price);
      // redirect to paid skins page
      window.location.href = 'paidskins.html';
    });

    wrapper.appendChild(circle);
    wrapper.appendChild(nameDiv);
    wrapper.appendChild(priceBtn);
    paidContainer.appendChild(wrapper);
  });
}
renderPaidSkins();

/* ---------- Custom skins carousel (3 circles, each 3 images) ---------- */
/* images per your list */
const circleImages = {
  circle1: ['IMG_2978.jpeg','IMG_3164.png','FB2EDDE2.png'],
  circle2: ['IMG_3156.jpeg','IMG_2718.png','IMG_2819.png'],
  circle3: ['IMG_3520.png','IMG_3533.png','IMG_3512.webp']
};

function initCustomCircle(id, images, intervalMs){
  const el = document.getElementById(id);
  let idx = 0;
  // pre-create img elements
  images.forEach((src,i)=>{
    const img = document.createElement('img');
    img.src = src;
    img.alt = id + ' skin ' + (i+1);
    if(i===0) img.classList.add('show');
    el.appendChild(img);
  });
  const imgs = el.querySelectorAll('img');
  // set up interval
  setInterval(()=>{
    imgs[idx].classList.remove('show');
    idx = (idx+1) % imgs.length;
    imgs[idx].classList.add('show');
  }, intervalMs);
  // small hover pause
  el.addEventListener('mouseenter', ()=> clearInterval(el._timer));
  el.addEventListener('mouseleave', ()=> {
    el._timer = setInterval(()=>{
      imgs[idx].classList.remove('show');
      idx = (idx+1) % imgs.length;
      imgs[idx].classList.add('show');
    }, intervalMs);
  });
  // set a stored timer ref
  el._timer = setInterval(()=>{
    imgs[idx].classList.remove('show');
    idx = (idx+1) % imgs.length;
    imgs[idx].classList.add('show');
  }, intervalMs);
}

// initialize with same sizes/behavior as original but improved timings
initCustomCircle('customCircle1', circleImages.circle1, 3600);
initCustomCircle('customCircle2', circleImages.circle2, 4200);
initCustomCircle('customCircle3', circleImages.circle3, 4800);

/* ---------- Simple search for paid skins (header search) ---------- */
document.getElementById('siteSearch').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ renderPaidSkins(); return; }
  const filtered = paidSkins.filter(s => s.name.toLowerCase().includes(q));
  // temporarily show filtered set
  paidContainer.innerHTML = '';
  filtered.forEach(skin => {
    const w = document.createElement('div'); w.className='circle-block';
    const c = document.createElement('div'); c.className='circle';
    const im = document.createElement('img'); im.src = skin.img; im.alt=skin.name; c.appendChild(im);
    const n = document.createElement('div'); n.className='skin-name'; n.textContent = skin.name;
    const p = document.createElement('div'); p.className='price-badge'; p.textContent = skin.price + ' - Buy Now';
    p.addEventListener('click', ()=>{ localStorage.setItem('addSkinId', skin.id); window.location.href='paidskins.html'; });
    w.appendChild(c); w.appendChild(n); w.appendChild(p);
    paidContainer.appendChild(w);
  });
});
</script>

</body>
</html>
