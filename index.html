<!-- Event balkje onderaan -->
<div id="eventBar" class="event-bar"></div>

<!-- Popup overlay voor deals -->
<div id="dealPopup" class="popup-overlay">
  <div class="popup-content">
    <span class="close-btn" onclick="closePopup()">✖</span>
    <div class="deal-slider">
      <button class="nav-btn left" onclick="prevSlide()">◀</button>
      <div class="deal-slide-container" id="dealSlides"></div>
      <button class="nav-btn right" onclick="nextSlide()">▶</button>
    </div>
  </div>
</div>

<style>
  /* Event balkje */
  .event-bar {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: #7c2ae8;
    color: white;
    padding: 8px 14px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-weight: bold;
    z-index: 900;
  }
  .event-bar img {
    width: 40px; height: 40px;
    border-radius: 8px;
  }
  .event-info {
    display: flex; flex-direction: column;
    font-size: 14px;
  }
  .event-title { font-size: 14px; }
  .countdown { font-size: 12px; color: #ffd700; }

  /* Popup */
  .popup-overlay {
    display: none;
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 999;
    justify-content: center; align-items: center;
  }
  .popup-content {
    background: #222;
    color: #fff;
    width: 90%; max-width: 800px;
    border-radius: 12px;
    position: relative;
    padding: 20px;
  }
  .close-btn {
    position: absolute; top: 15px; right: 20px;
    font-size: 24px; cursor: pointer;
  }
  .deal-slider {
    display: flex; align-items: center; justify-content: center;
  }
  .deal-slide-container {
    width: 100%; overflow: hidden;
  }
  .deal-slide {
    display: none;
    text-align: center;
  }
  .deal-slide img {
    max-width: 100%; border-radius: 12px; margin-bottom: 10px;
  }
  .deal-title { font-size: 22px; margin: 10px 0; }
  .deal-desc { font-size: 14px; margin-bottom: 8px; }
  .deal-price {
    display: inline-block;
    background: #28a745; color: #fff;
    padding: 12px 20px; border-radius: 8px;
    font-size: 18px; cursor: pointer;
    margin-top: 12px;
  }
  .nav-btn {
    background: none; border: none;
    font-size: 28px; cursor: pointer;
    color: white; margin: 0 10px;
  }
</style>

<script>
  const events = [
    {
      title: "Skins Cauldron",
      img: "IMG_5287.png", // kleine versie
      start: "2025-09-13T10:00:00",
      end: "2025-09-17T18:00:00",
      deals: [
        {
          img: "IMG_5289.png",
          title: "Nuturcuse Pack",
          desc: "24.000 Coins, 1400 DNA, 3x Mass Boost 24h, Skin Nutcurse",
          price: "$14.99"
        },
        {
          img: "IMG_5288.png",
          title: "Jaws Potion Pack",
          desc: "12.000 Coins, 800 DNA, 3x XP Boost 24h, Skin Jaws Potion",
          price: "$9.99"
        }
      ]
    }
  ];

  let currentEventDeals = [];
  let currentSlide = 0;

  function formatTime(ms) {
    let sec = Math.floor(ms / 1000);
    let d = Math.floor(sec / 86400);
    let h = Math.floor((sec % 86400) / 3600);
    let m = Math.floor((sec % 3600) / 60);
    let s = sec % 60;
    return `${d}d ${h}h ${m}m ${s}s`;
  }

  function renderEventBar() {
    const bar = document.getElementById("eventBar");
    const now = Date.now();
    const ev = events[0]; // voor nu maar 1 event
    const start = new Date(ev.start).getTime();
    const end = new Date(ev.end).getTime();

    if (now >= start && now <= end) {
      bar.innerHTML = `
        <img src="${ev.img}" alt="${ev.title}">
        <div class="event-info">
          <span class="event-title">${ev.title}</span>
          <span class="countdown" id="countdown"></span>
        </div>
      `;
      bar.onclick = () => openPopup(ev);

      const countdownElem = document.getElementById("countdown");
      setInterval(() => {
        const now = Date.now();
        if (now <= end) {
          countdownElem.textContent = formatTime(end - now);
        } else {
          bar.style.display = "none";
        }
      }, 1000);
    } else {
      bar.style.display = "none";
    }
  }

  function openPopup(event) {
    currentEventDeals = event.deals;
    currentSlide = 0;
    showSlide();
    document.getElementById("dealPopup").style.display = "flex";
  }

  function closePopup() {
    document.getElementById("dealPopup").style.display = "none";
  }

  function showSlide() {
    const container = document.getElementById("dealSlides");
    container.innerHTML = "";
    const deal = currentEventDeals[currentSlide];
    const slide = document.createElement("div");
    slide.className = "deal-slide";
    slide.style.display = "block";
    slide.innerHTML = `
      <img src="${deal.img}" alt="${deal.title}">
      <div class="deal-title">${deal.title}</div>
      <div class="deal-desc">${deal.desc}</div>
      <div class="deal-price">${deal.price}</div>
    `;
    container.appendChild(slide);
  }

  function nextSlide() {
    currentSlide = (currentSlide + 1) % currentEventDeals.length;
    showSlide();
  }

  function prevSlide() {
    currentSlide = (currentSlide - 1 + currentEventDeals.length) % currentEventDeals.length;
    showSlide();
  }

  window.onload = renderEventBar;
</script>
