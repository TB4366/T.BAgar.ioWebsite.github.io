<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>T.B Agar.io Halloween Edition 🎃</title>
<style>
  body {
    margin: 0;
    font-family: 'Creepster', cursive, Arial, sans-serif;
    background: linear-gradient(180deg, #1a001a, #2d0033, #0d0d0d);
    color: #ff7518;
    transition: background-color 0.3s ease, color 0.3s ease;
    overflow-x: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: #1a001a;
    border-bottom: 3px solid #ff7518;
    box-shadow: 0 0 15px #ff6600;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    filter: drop-shadow(0 0 8px #ff6600);
  }

  .site-title {
    font-size: 1.5rem;
    font-weight: bold;
    color: #ff7518;
    text-shadow: 0 0 5px #ff6600;
  }

  .menu-btn {
    cursor: pointer;
    font-size: 24px;
    background: none;
    border: none;
    color: #ff7518;
    transition: transform 0.3s ease;
  }
  .menu-btn:hover {
    transform: scale(1.2);
    color: #ffa94d;
  }

  .menu {
    display: none;
    position: absolute;
    top: 60px;
    right: 20px;
    background: #2b001f;
    border: 2px solid #ff7518;
    border-radius: 10px;
    overflow: hidden;
    z-index: 10;
    box-shadow: 0 0 15px #ff6600;
  }

  .menu a {
    display: block;
    padding: 12px;
    text-decoration: none;
    color: #ffcc99;
    border-bottom: 1px solid #ff7518;
  }
  .menu a:hover {
    background: #ff6600;
    color: #1a001a;
  }

  .main-video {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  iframe {
    border: none;
    border-radius: 12px;
    box-shadow: 0 0 25px #ff6600;
  }

  .youtube-link a {
    display: inline-block;
    padding: 12px 20px;
    background: #ff6600;
    color: black;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    box-shadow: 0 0 10px #ff6600;
  }
  .youtube-link a:hover {
    background: #ff8533;
  }

  .highlight-title {
    text-align: center;
    font-size: 2rem;
    font-weight: bold;
    margin: 20px 0 30px;
    color: #ffa94d;
    text-shadow: 0 0 15px #ff6600;
  }

  .circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    overflow: hidden;
    background: black;
    box-shadow: 0 0 30px #ff6600;
    filter: brightness(0.8);
    animation: pulse 3s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { filter: brightness(0.8); }
    50% { filter: brightness(1.2); }
  }

  /* Halloween Mist effect */
  .mist {
    position: fixed;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background: url('https://i.imgur.com/npWfY1T.png') repeat;
    opacity: 0.1;
    animation: mistMove 60s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes mistMove {
    from { transform: translate(0, 0); }
    to { transform: translate(-50%, -50%); }
  }

  /* 🎃 Halloween pop button */
  .halloween-button {
    display: inline-block;
    background: #ff7518;
    color: black;
    font-size: 1.2rem;
    font-weight: bold;
    padding: 14px 28px;
    border-radius: 12px;
    text-decoration: none;
    box-shadow: 0 0 20px #ff6600;
    margin: 50px auto;
    transition: transform 0.3s ease, background 0.3s ease;
  }
  .halloween-button:hover {
    background: #ffa94d;
    transform: scale(1.1);
  }

  .halloween-pop {
    text-align: center;
    margin-top: 40px;
  }

  /* Jump scare effect */
  @keyframes flash {
    0%, 100% { background-color: transparent; }
    50% { background-color: white; }
  }
</style>
</head>
<body>

<div class="mist"></div>

<header>
  <div class="logo-container">
    <img src="IMG_2718.png" alt="Logo" class="logo" />
    <span class="site-title">T.B Agar.io 🎃</span>
  </div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="menu" id="menu">
    <a href="index.html">🏠 Home</a>
    <a href="agar.io-skins.html">🎱 Skins</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
    <a href="key-access.html">🔑 Keys</a>
  </div>
</header>

<main>
  <div class="main-video">
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OEkurL8aaZk" allowfullscreen></iframe>
  </div>

  <div class="youtube-link">
    <a href="https://www.youtube.com/@T.B6/featured" target="_blank">Visit My Haunted Channel 👻</a>
  </div>

  <div class="highlight-title">The Best Haunted Skins</div>
  <div style="display:flex; justify-content:center; gap:40px;">
    <div class="circle"><img src="IMG_2978.jpeg" width="100%" height="100%"></div>
    <div class="circle"><img src="IMG_3156.jpeg" width="100%" height="100%"></div>
    <div class="circle"><img src="IMG_3520.png" width="100%" height="100%"></div>
  </div>

  <div class="halloween-pop">
    <a href="#" class="halloween-button" onclick="scarySurprise()">🎃 Click here for a scary surprise!</a>
  </div>
</main>

<script>
  function toggleMenu() {
    const menu = document.getElementById('menu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  }

  function scarySurprise() {
    document.body.style.animation = 'flash 0.4s ease 3';
    const scream = new Audio('https://www.myinstants.com/media/sounds/wilhelm_scream.mp3');
    scream.play();
    alert("😱 BOO! Happy Halloween! 🎃");
  }
</script>

</body>
</html>
