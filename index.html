<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.B Agar.io</title>
<style>
html, body { margin:0; padding:0; height:100%; font-family:Arial, sans-serif; color:#fff; overflow-x:hidden; transition:color 0.5s;}
body { background-size:cover; background-position:center; transition:background 0.5s, background-color 0.5s; }

header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  background:rgba(0,0,0,0.7);
  position:fixed;
  width:100%;
  top:0;
  z-index:1000;
  backdrop-filter:blur(8px);
  box-shadow:0 0 15px rgba(255,100,0,0.3);
}
.logo-container { display:flex; align-items:center; gap:12px; }
.logo { width:50px; height:50px; border-radius:50%; object-fit:cover; }
.site-title { font-size:1.3rem; font-weight:bold; color:#ffae42; text-shadow:0 0 8px #ff4500; transition: color 0.5s; }

.menu-btn { font-size:26px; background:none; border:none; cursor:pointer; transition:transform 0.3s; position:relative; left:-10px; /* hamburger iets naar links */ }
.menu-btn:hover{ transform:scale(1.2);}

.menu { position:absolute; top:70px; right:20px; background:rgba(30,20,20,0.95); border-radius:12px; box-shadow:0 0 20px rgba(255,100,0,0.4); overflow:hidden; display:none; flex-direction:column; min-width:180px; }
.menu a { display:block; padding:12px; color:white; text-decoration:none; border-bottom:1px solid rgba(255,255,255,0.1); transition:0.3s;}
.menu a:hover { background: rgba(255,100,0,0.2); padding-left:18px;}

main{display:flex;justify-content:center;padding:120px 16px 80px;position:relative; z-index:10;}
.content-wrapper{ width:100%; max-width:1180px; background:rgba(0,0,0,0.62); border-radius:14px; padding:28px; box-shadow:0 10px 40px rgba(0,0,0,0.6); position:relative; z-index:20;}
.highlight-title{ text-align:center; font-size:1.9rem; margin:6px 0 18px; color:#ffbb55; text-shadow:0 0 12px #ff6600; transition: color 0.5s; }

.skins-circles{display:flex; justify-content:center; gap:36px; flex-wrap:wrap; margin-bottom:10px;}
.circle{width:160px;height:160px;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 22px rgba(255,102,0,0.25);position:relative;}
.circle img{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 900ms ease-in-out;}
.circle img.active{opacity:1;}

.video-grid{display:flex; justify-content:center; gap:18px; flex-wrap:wrap; margin:20px 0;}
iframe{border:none; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.6);}

.socials{display:flex; justify-content:center; gap:14px; margin-top:18px; flex-wrap:wrap;}
.socials a{display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px; text-decoration:none; color:white; font-weight:700; box-shadow:0 8px 18px rgba(0,0,0,0.45);}
.discord{background:#5865F2;} .instagram{background:#E1306C;} .youtube{background:#FF0000;}

.floating{position:absolute; pointer-events:none; user-select:none; z-index:5; opacity:0.95; transform:translate(-50%,-50%); will-change:transform;}
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="IMG_2718.png" alt="Logo" class="logo" />
    <span class="site-title" id="siteTitle">T.B Agar.io</span>
  </div>
  <button class="menu-btn" id="hamburgerBtn" onclick="toggleMenu()">☰</button>
  <div class="menu" id="menu">
    <a href="index.html">🏠 Home Pagina</a>
    <a href="agar.io-skins.html">🎱 Agar.io Skins</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
    <a href="key-access.html">🔑 Keys</a>
    <a href="buy-account.html">💰 Buy Account</a>
  </div>
</header>

<main>
  <div class="content-wrapper">

    <!-- Skins -->
    <div class="highlight-title" id="highlightTitle">Top 9 Skins</div>
    <div class="skins-circles">
      <div class="circle" id="circle1">
        <img src="A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg" class="active">
        <img src="610F52D4-2662-4912-B9BE-C90D35B901A9.jpeg">
        <img src="3AA1ECAC-EEE1-4FCA-9023-57B45AE56968.jpeg">
      </div>
      <div class="circle" id="circle2">
        <img src="IMG_5981.png" class="active">
        <img src="IMG_5993.png">
        <img src="IMG_5983.png">
      </div>
      <div class="circle" id="circle3">
        <img src="IMG_6066.png" class="active">
        <img src="A9F2A2DB-0EC6-4A75-ADBB-D637F27D8761.jpeg">
        <img src="610F52D4-2662-4912-B9BE-C90D35B901A9.jpeg">
      </div>
    </div>

    <!-- YouTube -->
    <div class="video-grid">
      <iframe width="360" height="215" src="https://www.youtube.com/embed/vDoeUtuUdo4" allowfullscreen></iframe>
      <iframe width="360" height="215" src="https://www.youtube.com/embed/REqb_bq0Qvk" allowfullscreen></iframe>
      <iframe width="560" height="315" src="https://www.youtube.com/embed/d8DluzJAd2w" allowfullscreen></iframe>
    </div>

    <!-- Socials -->
    <div class="socials">
      <a href="https://discord.gg/jTwx5U8hDV" class="discord" target="_blank">Discord</a>
      <a href="https://www.instagram.com/t.bagar.io/" class="instagram" target="_blank">Instagram</a>
      <a href="https://www.youtube.com/@T.B6" class="youtube" target="_blank">YouTube</a>
    </div>

  </div>
</main>

<script>
/* Menu toggle */
function toggleMenu(){
  const menu=document.getElementById('menu');
  menu.style.display = menu.style.display==='flex'?'none':'flex';
}

/* Skins slideshow */
function cycleSkins(circleId,interval){
  const circle=document.getElementById(circleId);
  const imgs=Array.from(circle.querySelectorAll('img'));
  let idx=0;
  setInterval(()=>{
    imgs[idx].classList.remove('active');
    idx=(idx+1)%imgs.length;
    imgs[idx].classList.add('active');
  }, interval);
}
cycleSkins('circle1',4000);
cycleSkins('circle2',5000);
cycleSkins('circle3',6000);

/* Load admin settings */
const settings = JSON.parse(localStorage.getItem('siteSettings')) || {};

/* Achtergrond */
if(settings.background){
  document.body.style.backgroundImage=`url('${settings.background}')`;
  document.body.style.backgroundColor='';
}else if(settings.color){
  document.body.style.backgroundColor=settings.color;
  document.body.style.backgroundImage='';
}

/* Tekstkleur instellen */
if(settings.textColor){
  document.getElementById('siteTitle').style.color=settings.textColor;
  document.getElementById('highlightTitle').style.color=settings.textColor;
  document.getElementById('hamburgerBtn').style.color=settings.textColor;
}

/* Figuren */
if(settings.figures==='on' && settings.theme){
  const icons={
    zomer:["☀️","🌴","🌊","🕶️"],
    lente:["🌸","🌼","🐝","🌷"],
    herfst:["🍁","🍂","🌰","🦔"],
    winter:["❄️","⛄","🎿","🌨️"],
    halloween:["🎃","👻","🦇","🕷️"],
    kerst:["🎅","🎄","❄️","🎁"],
    pasen:["🐰","🥚","🌸","🐣"],
    blackfriday:["🛒","💰","📦"]
  };
  const selectedIcons=icons[settings.theme] || ["⭐"];
  const floats=[];
  for(let i=0;i<50;i++){
    const span=document.createElement('span');
    span.textContent = selectedIcons[Math.floor(Math.random()*selectedIcons.length)];
    span.className='floating';
    span.style.fontSize=(12+Math.random()*24)+'px';
    span.style.left=Math.random()*window.innerWidth+'px';
    span.style.top=Math.random()*window.innerHeight+'px';
    document.body.appendChild(span);
    span.speed=(0.3+Math.random()*1.2)*(Math.random()>0.5?1:-1);
    floats.push(span);
  }
  function animateFloats(){
    for(const f of floats){
      let x=parseFloat(f.style.left);
      let y=parseFloat(f.style.top);
      x+=f.speed; y+=f.speed/2;
      if(x>window.innerWidth) x=0; if(x<0) x=window.innerWidth;
      if(y>window.innerHeight) y=0; if(y<0) y=window.innerHeight;
      f.style.left=x+'px'; f.style.top=y+'px';
    }
    requestAnimationFrame(animateFloats);
  }
  animateFloats();
}
</script>
</body>
</html>
