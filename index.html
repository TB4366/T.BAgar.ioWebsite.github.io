<script>
function toggleMenu() {
  const menu = document.getElementById('menu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

// DARK MODE
const toggleBtn = document.getElementById('themeToggleBtn');
const body = document.body;
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') {
  body.classList.add('dark');
  toggleBtn.textContent = '☀️';
}

toggleBtn.addEventListener('click', () => {
  body.classList.toggle('dark');
  toggleBtn.textContent = body.classList.contains('dark') ? '☀️' : '🌙';
  localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
});

// SKIN CAROUSEL
const skinsCircle1 = ['IMG_2978.jpeg','IMG_3164.png','FB2EDDE2.png'];
const skinsCircle2 = ['IMG_3156.jpeg','IMG_2718.png','IMG_2819.png'];
const skinsCircle3 = ['IMG_3520.png','IMG_3533.png','IMG_3512.webp'];

function cycle(circleId, images, time) {
  const circle = document.getElementById(circleId);
  let i = 0;
  images.forEach((src, index) => {
    const img = document.createElement('img');
    img.src = src;
    if (index===0) img.classList.add('active');
    circle.appendChild(img);
  });
  setInterval(()=>{
    const imgs = circle.querySelectorAll('img');
    imgs[i].classList.remove('active');
    i = (i+1)%imgs.length;
    imgs[i].classList.add('active');
  }, time);
}

cycle('circle1', skinsCircle1, 4000);
cycle('circle2', skinsCircle2, 4500);
cycle('circle3', skinsCircle3, 5000);
</script>
