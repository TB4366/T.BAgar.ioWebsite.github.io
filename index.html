<head>

<title>T.B Agar.io Halloween Edition 🎃</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #ff8c00, #8b0000);
    color: #fff3e0;
    overflow-x: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: rgba(30,0,0,0.9);
    border-bottom: 3px solid #ff7518;
    box-shadow: 0 0 15px #ff6600;
    position: relative;
    z-index: 2;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    filter: drop-shadow(0 0 8px #ff6600);
  }

  .site-title {
    font-size: 1.5rem;
    font-weight: bold;
    color: #ffbb55;
    text-shadow: 0 0 5px #ff6600;
  }

  .menu-btn {
    cursor: pointer;
    font-size: 24px;
    background: none;
    border: none;
    color: #ffbb55;
  }

  .menu {
    display: none;
    position: absolute;
    top: 60px;
    right: 20px;
    background: rgba(50, 0, 0, 0.95);
    border: 2px solid #ff7518;
    border-radius: 10px;
    overflow: hidden;
    z-index: 10;
    box-shadow: 0 0 15px #ff6600;
  }

  .menu a {
    display: block;
    padding: 12px;
    text-decoration: none;
    color: #ffddaa;
    border-bottom: 1px solid #ff7518;
  }
  .menu a:hover {
    background: #ff6600;
    color: #1a001a;
  }

  main {
    position: relative;
    z-index: 1;
    padding: 50px 20px;
    display: flex;
    justify-content: center;
  }

  .content-wrapper {
    position: relative;
    z-index: 2;
    background: rgba(0,0,0,0.55);
    padding: 30px;
    border-radius: 15px;
    max-width: 1200px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  iframe {
    border: none;
    border-radius: 12px;
    box-shadow: 0 0 20px #ff6600;
  }

  .main-video, .video-grid {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .youtube-link {
    text-align: center;
  }
  .youtube-link a {
    display: inline-block;
    padding: 12px 20px;
    background: #ff6600;
    color: black;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    box-shadow: 0 0 10px #ff6600;
  }
  .youtube-link a:hover {
    background: #ff8533;
  }

  .highlight-title {
    text-align: center;
    font-size: 2rem;
    font-weight: bold;
    margin: 20px 0;
    color: #ffbb55;
    text-shadow: 0 0 15px #ff6600;
  }

  .skins-circles {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
  }

  .circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    overflow: hidden;
    background: black;
    box-shadow: 0 0 25px #ff6600;
    position: relative;
  }

  .circle img {
    position: absolute;
    top:0; left:0;
    width:100%; height:100%;
    object-fit: cover;
    opacity:0;
    transition: opacity 1s ease-in-out;
  }

  .circle img.active {
    opacity:1;
  }

  /* Halloween floating objects */
  .floating {
    position: absolute;
    font-size: 2.5rem;
    opacity: 0.85;
    z-index: 1;
  }

  .halloween-pop {
    text-align: center;
  }

  .halloween-button {
    display: inline-block;
    background: #ff7518;
    color: black;
    font-size: 1.2rem;
    font-weight: bold;
    padding: 14px 28px;
    border-radius: 12px;
    text-decoration: none;
    box-shadow: 0 0 20px #ff6600;
    transition: transform 0.3s ease, background 0.3s ease;
  }

  .halloween-button:hover {
    background: #ffa94d;
    transform: scale(1.1);
  }

  /* Social buttons */
  .socials {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .socials a {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    padding: 12px 20px;
    border-radius: 12px;
    box-shadow: 0 0 10px #ff6600;
  }

  .discord { background-color: #5865F2; }
  .instagram { background-color: #E1306C; }
  .youtube { background-color: #FF0000; }

  .socials a:hover {
    opacity: 0.85;
  }

  @keyframes flash {
    0%, 100% { background-color: transparent; }
    50% { background-color: white; }
  }
</style>
</head>
