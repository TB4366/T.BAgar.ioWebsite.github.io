<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T.B Agar.io - Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* Navigatiebalk */
    .navbar {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background: #222;
      color: white;
    }

    .navbar img {
      height: 40px;
      margin-right: 10px;
    }

    .site-name {
      font-size: 20px;
      font-weight: bold;
      margin-right: 20px;
    }

    .searchbar {
      flex: 1;
    }

    .searchbar input {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .hamburger {
      margin-left: 20px;
      cursor: pointer;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background: white;
      margin: 5px 0;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <img src="logo.png" alt="Logo" />
    <div class="site-name">T.B Agar.io</div>

    <div class="searchbar">
      <input type="text" placeholder="Zoeken..." />
    </div>

    <a href="volgende_pagina.html" class="hamburger">
      <div></div>
      <div></div>
      <div></div>
    </a>
  </div>

  <h1 style="padding: 20px; text-align:center;">Welcome to the website!</h1>
  <hr style="margin: 0 20px;">

  <div class="circle-container" style="display:flex; justify-content:center; gap:40px; padding:40px 0;">
    <div class="circle" style="width:150px; height:150px; border-radius:50%; overflow:hidden; position:relative; animation: fade 3s infinite alternate;">
      <img src="skin1a.png" style="width:100%; height:100%; object-fit:cover;">
      <img src="skin1b.png" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; opacity:0; animation: fade 3s infinite alternate;">
      <img src="skin1c.png" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; opacity:0; animation: fade 3s infinite alternate-reverse;">
    </div>

    <div class="circle" style="width:150px; height:150px; border-radius:50%; overflow:hidden; position:relative; animation: fade 3s infinite alternate;">
      <img src="skin2a.png" style="width:100%; height:100%; object-fit:cover;">
      <img src="skin2b.png" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; opacity:0; animation: fade 3s infinite alternate;">
      <img src="skin2c.png" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; opacity:0; animation: fade 3s infinite alternate-reverse;">
    </div>

    <div class="circle" style="width:150px; height:150px; border-radius:50%; overflow:hidden; position:relative; animation: fade 3s infinite alternate;">
      <img src="skin3a.png" style="width:100%; height:100%; object-fit:cover;">
      <img src="skin3b.png" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; opacity:0; animation: fade 3s infinite alternate;">
      <img src="skin3c.png" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; opacity:0; animation: fade 3s infinite alternate-reverse;">
    </div>
  </div>

  <style>
    @keyframes fade {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <hr style="margin: 0 20px;">

  <div style="padding:20px; text-align:center;">
    <video controls width="600">
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
</body>
</html>
