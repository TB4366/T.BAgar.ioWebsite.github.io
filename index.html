<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>T.B Agar.io Website</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  body.dark {
    background: #f0f0f0;
    color: #222;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: #0f172a;
    position: relative;
    transition: background-color 0.3s ease;
  }
  body.dark header { background: #e0e0e0; }
  .logo-container { display: flex; align-items: center; gap: 12px; }
  .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
  .site-title { font-size: 1.2rem; font-weight: bold; }
  .toggle-btn-header {
    background: none; border: none; cursor: pointer; font-size: 22px; color: #0077b6;
    padding: 6px 10px; border-radius: 8px; transition: background-color 0.3s ease, color 0.3s ease;
  }
  .toggle-btn-header:hover { background-color: #48cae4; color: white; }
  body.dark .toggle-btn-header { color: #4dd0e1; }
  body.dark .toggle-btn-header:hover { background-color: #0077b6; color: white; }
  .menu-btn { cursor: pointer; font-size: 24px; background: none; border: none; color: white; }
  body.dark .menu-btn { color: #222; }
  .menu {
    display: none; position: absolute; top: 60px; right: 20px; background: #1e293b;
    border-radius: 8px; overflow: hidden; min-width: 160px; z-index: 10;
  }
  body.dark .menu { background: #ccc; }
  .menu a {
    display: block; padding: 12px; text-decoration: none; color: white; border-bottom: 1px solid #334155;
  }
  body.dark .menu a { color: #222; border-bottom: 1px solid #aaa; }
  .menu a:hover { background: #334155; }
  body.dark .menu a:hover { background: #ddd; }
  .main-video { display: flex; justify-content: center; margin-top: 20px; flex-direction: column; align-items: center; gap: 12px; }
  .video-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 20px; }
  iframe { border: none; border-radius: 12px; max-width:100%; }
  .youtube-link { text-align: center; margin-top: 20px; }
  .youtube-link a {
    display: inline-block; padding: 12px 20px; background: #1e293b; color: white;
    text-decoration: none; border-radius: 8px; font-weight: bold;
  }
  .youtube-link a:hover { background: #334155; }
  .btn {
    padding: 12px 24px; background-color: #1e293b; color: white; text-decoration: none;
    border-radius: 8px; font-weight: bold; cursor: pointer; border: none;
    transition: background-color 0.3s ease;
  }
  .btn:hover { background-color: #334155; }

  .divider { max-width: 900px; margin: 40px auto 10px auto; border-top: 2px solid #48cae4; }
  .highlight-title {
    text-align: center; font-size: 1.8rem; font-weight: bold; margin: 20px 0 30px; color: #48cae4;
  }
  body.dark .divider { border-top: 2px solid #0077b6; }
  body.dark .highlight-title { color: #0077b6; }

  .skins-circles {
    max-width: 900px; margin: 0 auto 50px auto; display: flex; justify-content: center; gap: 40px;
  }
  .circle {
    width: 180px; height: 180px; border-radius: 50%; overflow: hidden; position: relative;
    background: #000; box-shadow: 0 0 15px #48cae4;
    filter: brightness(0.8) saturate(1.2); cursor: pointer; transition: filter 0.3s ease, box-shadow 0.3s ease;
  }
  body.dark .circle { filter: brightness(1) saturate(1); box-shadow: 0 0 15px #0077b6; }
  .circle img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 1.2s ease; }
  .circle img.active { opacity: 1; }

  .keys-link { text-align: center; margin-bottom: 40px; }
  body.dark .keys-link .btn { background-color: #ccc; color: #222; }
  body.dark .keys-link .btn:hover { background-color: #aaa; }

  /* Overlay deals slider */
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
    z-index: 9999; display: none;
  }
  .slider {
    background: #fff; width: 80%; max-width: 600px; border-radius: 12px;
    position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.4); color: #000;
  }
  .slide { display: none; text-align: center; padding: 20px; }
  .slide img { width: 100%; border-radius: 8px; }
  .prev, .next {
    cursor: pointer; position: absolute; top: 50%; padding: 12px; color: white;
    font-weight: bold; font-size: 20px; border-radius: 50%; background: rgba(0,0,0,0.5);
    transform: translateY(-50%); user-select: none;
  }
  .prev { left: 10px; } .next { right: 10px; }
  .close-btn { position: absolute; top: 10px; right: 15px; font-size: 28px; font-weight: bold; cursor: pointer; color: #333; }
  .countdown { margin-top: 10px; font-size: 18px; font-weight: bold; color: #e63946; }
  .open-deals { margin: 20px; padding: 10px 20px; background: #0077cc; color: white; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="IMG_2718.png" alt="Logo" class="logo" />
    <span class="site-title">T.B Agar.io</span>
    <button class="toggle-btn-header" id="themeToggleBtn">🌙</button>
  </div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="menu" id="menu">
    <a href="index.html">🏠 Home Pagina</a>
    <a href="agar.io-skins.html">🎱Agar.io Skins</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
    <a href="key-access.html">🔑 Keys</a>
    <a href="buy-account.html">💰 Buy Account</a>
  </div>
</header>

<main>
  <button class="open-deals">Bekijk Deals</button>

  <div class="main-video">
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OEkurL8aaZk" allowfullscreen></iframe>
  </div>

  <div class="youtube-link">
    <a href="https://www.youtube.com/@T.B6/featured" target="_blank">Visit My YouTube Channel</a>
  </div>

  <div class="video-grid">
    <iframe width="360" height="215" src="https://www.youtube.com/embed/diAuO3IC8Hg" allowfullscreen></iframe>
    <iframe width="360" height="215" src="https://www.youtube.com/embed/m0DEe4RhgSw" allowfullscreen></iframe>
  </div>

  <!-- Skins sectie -->
  <div class="divider"></div>
  <div class="highlight-title">The Best Custom Skins</div>
  <div class="skins-circles">
    <div class="circle" id="circle1"></div>
    <div class="circle" id="circle2"></div>
    <div class="circle" id="circle3"></div>
  </div>

  <!-- Keys sectie -->
  <div class="divider"></div>
  <div class="highlight-title">T.B Keys</div>
  <div class="keys-link">
    <a href="key-access.html" class="btn">🔑 Go to the keys</a>
  </div>
</main>

<!-- Deals Overlay -->
<div class="overlay" id="overlay">
  <div class="slider">
    <span class="close-btn">&times;</span>

    <div class="slide">
      <h2>Deal 1</h2>
      <img src="https://via.placeholder.com/500x250?text=Deal+1" alt="Deal 1">
      <p class="countdown" data-time="20"></p>
    </div>

    <div class="slide">
      <h2>Deal 2</h2>
      <img src="https://via.placeholder.com/500x250?text=Deal+2" alt="Deal 2">
      <p class="countdown" data-time="15"></p>
    </div>

    <div class="slide">
      <h2>Nieuws</h2>
      <img src="https://via.placeholder.com/500x250?text=Nieuws" alt="Nieuws">
      <p class="countdown" data-time="10"></p>
    </div>

    <a class="prev">&#10094;</a>
    <a class="next">&#10095;</a>
  </div>
</div>

<script>
  // Menu toggle
  function toggleMenu() {
    const menu = document.getElementById('menu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  }

  // Dark/light mode
  const toggleBtn = document.getElementById('themeToggleBtn');
  const body = document.body;
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') { body.classList.add('dark'); toggleBtn.textContent = '☀️'; } 
  else { toggleBtn.textContent = '🌙'; }
  toggleBtn.addEventListener('click', () => {
    body.classList.toggle('dark');
    if (body.classList.contains('dark')) { toggleBtn.textContent = '☀️'; localStorage.setItem('theme', 'dark'); }
    else { toggleBtn.textContent = '🌙'; localStorage.setItem('theme', 'light'); }
  });

  // Skins cycling
  const skinsCircle1 = ['FB2EDDE2-8F8A-42C2-B720-7879BD6654DB.png','IMG_2978.jpeg','IMG_3164.png'];
  const skinsCircle2 = ['IMG_3156.jpeg','IMG_2718.png','IMG_2819.png'];
  const skinsCircle3 = ['IMG_3520.png','IMG_3533.png','IMG_3512.webp'];
  const intervals = [4000, 4500, 5000];
  function cycleImages(circleId, images, interval) {
    const circle = document.getElementById(circleId);
    let currentIndex = 0;
    images.forEach((src,i)=>{ const img=document.createElement('img'); img.src=src; if(i===0) img.classList.add('active'); circle.appendChild(img); });
    setInterval(()=>{ const imgs=circle.querySelectorAll('img'); imgs[currentIndex].classList.remove('active'); currentIndex=(currentIndex+1)%imgs.length; imgs[currentIndex].classList.add('active'); }, interval);
  }
  cycleImages('circle1', skinsCircle1, intervals[0]);
  cycleImages('circle2', skinsCircle2, intervals[1]);
  cycleImages('circle3', skinsCircle3, intervals[2]);

  // Deals slider
  const overlay = document.getElementById('overlay');
  const slides = overlay.querySelectorAll(".slide");
  const prev = overlay.querySelector(".prev");
  const next = overlay.querySelector(".next");
  const closeBtn = overlay.querySelector(".close-btn");
  let slideIndex = 0;
  let timers = [];

  function showSlide(n){
    timers.forEach(t=>clearInterval(t)); timers=[];
    if(n>=slides.length) slideIndex=0;
    if(n<0) slideIndex=slides.length-1;
    slides.forEach(s=>s.style.display="none");
    slides[slideIndex].style.display="block";
    let countdownElem = slides[slideIndex].querySelector(".countdown");
    let timeLeft = parseInt(countdownElem.dataset.time)||10;
    countdownElem.textContent = "Nog "+timeLeft+" sec";
    let timer=setInterval(()=>{
      timeLeft--;
      if(timeLeft>0) countdownElem.textContent="Nog "+timeLeft+" sec";
      else{ clearInterval(timer); changeSlide(1); }
    },1000);
    timers.push(timer);
  }

  function changeSlide(n){ slideIndex+=n; showSlide(slideIndex); }

  prev.addEventListener("click",()=>changeSlide(-1));
  next.addEventListener("click",()=>changeSlide(1));
  closeBtn.addEventListener("click",()=>overlay.style.display="none");

  document.querySelector(".open-deals").addEventListener("click",()=>{
    overlay.style.display="flex";
    slideIndex=0; showSlide(slideIndex);
  });

  window.onload = () => { document.querySelector(".open-deals").click(); };
</script>

</body>
</html>
