<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.B Agar.io</title>
<style>
  :root{
    --glow:#ff6600;
    --accent:#ffbb55;
    --overlay: rgba(0,0,0,0.62);
  }

  html,body{height:100%; margin:0; font-family:Arial, sans-serif; color:#fff;}
  body{
    background:#111;
    overflow-x: hidden;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: rgba(0,0,0,0.7);
    position: fixed;
    width: 100%;
    top: 0;
    left: 0;
    z-index: 1000;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 15px rgba(255, 100, 0, 0.3);
  }
  .logo-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
  }
  .site-title {
    font-size: 1.3rem;
    font-weight: bold;
    color:#ffae42;
    text-shadow:0 0 8px #ff4500;
  }
  .menu-btn {
    font-size:26px;
    background:none;
    border:none;
    color:#ffae42;
    cursor:pointer;
    transition: transform 0.3s ease;
  }
  .menu-btn:hover{transform:scale(1.2);}
  .menu {
    position:absolute;
    top:70px;
    right:20px;
    background: rgba(30,20,20,0.95);
    border-radius:12px;
    box-shadow:0 0 20px rgba(255,100,0,0.4);
    overflow:hidden;
    display:none;
    flex-direction: column;
    min-width:180px;
  }
  .menu a{
    display:block;
    padding:12px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.1);
    transition: background-color 0.3s, padding-left 0.3s;
  }
  .menu a:hover{background-color:rgba(255,100,0,0.2); padding-left:18px;}

  main{display:flex; justify-content:center; padding:120px 16px 80px; position:relative; z-index:10;}
  .content-wrapper{
    width:100%;
    max-width:1180px;
    background: var(--overlay);
    border-radius:14px;
    padding:28px;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
    position:relative;
    z-index:20;
  }

  .highlight-title{
    text-align:center;
    font-size:1.9rem;
    margin:6px 0 18px;
    color:var(--accent);
    text-shadow:0 0 12px var(--glow);
  }
  .skins-circles{display:flex; justify-content:center; gap:36px; flex-wrap:wrap; margin-bottom:10px;}
  .circle{width:160px;height:160px;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 22px rgba(255,102,0,0.25);position:relative;}
  .circle img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 900ms ease-in-out;}
  .circle img.active{opacity:1;}

  .video-grid{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:20px 0;}
  iframe{border:none;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.6);}

  .floating{
    position:absolute;
    pointer-events:none;
    user-select:none;
    z-index:5;
    opacity:0.95;
    transform:translate(-50%,-50%);
    will-change:transform;
  }

  @media (max-width:900px){
    .circle{width:130px;height:130px}
    iframe[width="560"]{width:100%;height:220px}
  }
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="IMG_2718.png" alt="Logo" class="logo" />
    <span class="site-title" id="siteTitle">T.B Agar.io</span>
  </div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="menu" id="menu">
    <a href="index.html">🏠 Home Pagina</a>
    <a href="agar.io-skins.html">🎱 Agar.io Skins</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
    <a href="key-access.html">🔑 Keys</a>
    <a href="buy-account.html">💰 Buy Account</a>
  </div>
</header>

<main>
  <div class="content-wrapper" id="contentWrapper">

    <div class="highlight-title" id="highlightTitle">Welkom bij T.B Agar.io</div>

    <!-- Skins -->
    <div class="skins-circles" id="skinsContainer">
      <!-- Skins worden hier geladen -->
    </div>

    <!-- YouTube Video's -->
    <div class="video-grid" id="videosContainer">
      <!-- Video's worden hier geladen -->
    </div>

  </div>
</main>

<script>
// Hamburger menu
function toggleMenu(){
  const menu=document.getElementById('menu');
  menu.style.display = menu.style.display==='flex'?'none':'flex';
}

// Laad instellingen
const settings = JSON.parse(localStorage.getItem('siteSettings')) || {};
const skins = JSON.parse(localStorage.getItem('skins')) || [];
const videos = JSON.parse(localStorage.getItem('videos')) || [];
const homeContent = localStorage.getItem('homeContent') || '';

// Achtergrond
if(settings.bgColor) document.body.style.background = settings.bgColor;
if(settings.background) document.body.style.backgroundImage = settings.background;
if(settings.textColor){
  document.getElementById('siteTitle').style.color = settings.textColor;
  document.getElementById('highlightTitle').style.color = settings.textColor;
}

// Figuren
let floats = [];
function createFigures(){
  floats.forEach(f=>f.remove());
  floats=[];
  if(settings.figures==='on'){
    let themeObjects=[];
    switch(settings.figureTheme){
      case 'zomer': themeObjects=['🌞','🏖️','🌴','⛱️']; break;
      case 'lente': themeObjects=['🌸','🐦','🌿','🌷']; break;
      case 'herfst': themeObjects=['🍁','🌰','🎃','🍂']; break;
      case 'winter': themeObjects=['❄️','⛄','🌨️','🎿']; break;
      case 'halloween': themeObjects=['🎃','👻','🦇','🕷️']; break;
      case 'kerst': themeObjects=['🎄','🎅','❄️','🎁']; break;
      case 'pasen': themeObjects=['🐣','🥚','🐰','🌷']; break;
      case 'blackfriday': themeObjects=['🛍️','💰','🛒','🔥']; break;
      default: themeObjects=['⭐']; break;
    }
    for(let i=0;i<50;i++){
      const span=document.createElement('span');
      span.textContent = themeObjects[Math.floor(Math.random()*themeObjects.length)];
      span.className='floating';
      span.style.fontSize=(12+Math.random()*24)+'px';
      span.style.left=Math.random()*window.innerWidth+'px';
      span.style.top=Math.random()*window.innerHeight+'px';
      span.speed=(0.3+Math.random()*1.2)*(Math.random()>0.5?1:-1);
      document.body.appendChild(span);
      floats.push(span);
    }
    animateFloats();
  }
}
function animateFloats(){
  floats.forEach(f=>{
    let x=parseFloat(f.style.left);
    let y=parseFloat(f.style.top);
    x+=f.speed; y+=f.speed/2;
    if(x>window.innerWidth)x=0; if(x<0)x=window.innerWidth;
    if(y>window.innerHeight)y=0; if(y<0)y=window.innerHeight;
    f.style.left=x+'px';
    f.style.top=y+'px';
  });
  requestAnimationFrame(animateFloats);
}
createFigures();

// Skins laden
const skinsContainer = document.getElementById('skinsContainer');
function renderSkins(){
  skinsContainer.innerHTML='';
  for(let i=0;i<skins.length;i+=3){
    const circle = document.createElement('div');
    circle.className='circle';
    const imgs = skins.slice(i,i+3);
    imgs.forEach((src,j)=>{
      const img=document.createElement('img');
      img.src=src;
      if(j===0) img.classList.add('active');
      circle.appendChild(img);
      let idx=j;
      setInterval(()=>{
        circle.querySelectorAll('img').forEach(im=>im.classList.remove('active'));
        img.classList.add('active');
        idx=(idx+1)%imgs.length;
      },4000+j*1000);
    });
    skinsContainer.appendChild(circle);
  }
}
renderSkins();

// YouTube laden
const videosContainer=document.getElementById('videosContainer');
videos.forEach(link=>{
  const iframe=document.createElement('iframe');
  iframe.width=360;
  iframe.height=215;
  iframe.src=link;
  iframe.allowFullscreen=true;
  videosContainer.appendChild(iframe);
});

// Home content
const contentWrapper=document.getElementById('contentWrapper');
if(homeContent) contentWrapper.innerHTML = homeContent;
</script>

</body>
</html>
