<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>T.B Agar.io Website</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  body.dark {
    background: #f0f0f0;
    color: #222;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: #0f172a;
    position: relative;
    transition: background-color 0.3s ease;
  }
  body.dark header {
    background: #e0e0e0;
  }

  .left-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
  }

  .site-title {
    font-size: 1.3rem;
    font-weight: bold;
  }

  .search-bar input {
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    outline: none;
    font-size: 14px;
    width: 180px;
  }

  .toggle-btn-header {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 22px;
    color: #0077b6;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .menu-btn {
    cursor: pointer;
    font-size: 26px;
    background: none;
    border: none;
    color: white;
  }

  .menu {
    display: none;
    position: absolute;
    top: 65px;
    right: 20px;
    background: #1e293b;
    border-radius: 8px;
    overflow: hidden;
    min-width: 170px;
  }

  .menu a {
    display: block;
    padding: 12px;
    color: white;
    text-decoration: none;
    border-bottom: 1px solid #334155;
  }

  .main-video {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  .video-grid {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px;
    flex-wrap: wrap;
  }

  iframe { border: none; border-radius: 12px; }

  .divider {
    max-width: 900px;
    margin: 40px auto 10px auto;
    border-top: 2px solid #48cae4;
  }

  .highlight-title {
    text-align: center;
    font-size: 1.8rem;
    font-weight: bold;
    margin: 20px 0 30px;
    color: #48cae4;
  }

  .skins-circles {
    max-width: 900px;
    margin: 0 auto 50px auto;
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
  }

  .circle-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .circle {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #000;
    box-shadow: 0 0 15px #48cae4;
    cursor: pointer;
  }

  .circle img {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; top: 0; left: 0;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .circle img.active { opacity: 1; }

  .price-badge {
    margin-top: 10px;
    background: #ef4444;
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .price-badge:hover {
    transform: scale(1.05);
  }

  .best-deal-badge {
    position: absolute;
    top: -10px;
    left: -10px;
    background: gold;
    color: black;
    padding: 4px 8px;
    font-weight: bold;
    border-radius: 6px;
    font-size: 0.8rem;
  }

  .btn {
    display: inline-block;
    background: #06b6d4;
    color: #02111a;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
  }

</style>
</head>
<body>

<header>
  <div class="left-header">
    <img src="IMG_2718.png" class="logo" />
    <span class="site-title">T.B Agar.io</span>

    <div class="search-bar">
      <input type="text" placeholder="Zoeken..." />
    </div>

    <button class="toggle-btn-header" id="themeToggleBtn">🌙</button>
  </div>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="menu" id="menu">
    <a href="index.html">🏠 Home Pagina</a>
    <a href="agar.io-skins.html">🎱 Agar.io Skins</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
    <a href="key-access.html">🔑 Keys</a>
    <a href="buy-account.html">💰 Buy Account</a>
    <a href="paidskins.html">💎 Paid Skins</a>
  </div>
</header>

<main>

  <div class="divider"></div>
  <div class="highlight-title">Paid Skins Deals</div>

  <div class="skins-circles" id="paidSkinsContainer">
    <!-- Dynamische skins worden hier geladen -->
  </div>

  <div style="text-align:center; margin-bottom:40px;">
    <a href="paidskins.html" class="btn">View All Skins</a>
  </div>

  <div class="divider"></div>
  <div class="main-video">
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OEkurL8aaZk" allowfullscreen></iframe>
  </div>

  <div class="video-grid">
    <iframe width="360" height="215" src="https://www.youtube.com/embed/diAuO3IC8Hg" allowfullscreen></iframe>
    <iframe width="360" height="215" src="https://www.youtube.com/embed/m0DEe4RhgSw" allowfullscreen></iframe>
  </div>

  <div class="divider"></div>
  <div class="highlight-title">The Best Custom Skins</div>

  <div class="skins-circles">
    <div class="circle" id="circle1"></div>
    <div class="circle" id="circle2"></div>
    <div class="circle" id="circle3"></div>
  </div>

  <div class="divider"></div>
  <div class="highlight-title">T.B Keys</div>

</main>

<script>
function toggleMenu() {
  const menu = document.getElementById('menu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

// DARK MODE
const toggleBtn = document.getElementById('themeToggleBtn');
const body = document.body;
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') {
  body.classList.add('dark');
  toggleBtn.textContent = '☀️';
}
toggleBtn.addEventListener('click', () => {
  body.classList.toggle('dark');
  toggleBtn.textContent = body.classList.contains('dark') ? '☀️' : '🌙';
  localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
});

// PAID SKINS DATA
const paidSkins = [
  {id:"skin_1",img:"IMG_6174.webp",price:"$4.99",best:true},
  {id:"skin_2",img:"IMG_6175.webp",price:"$6.99",best:false},
  {id:"skin_3",img:"IMG_6260.webp",price:"$3.49",best:false},
  {id:"skin_4",img:"IMG_6258.webp",price:"$5.49",best:false},
  {id:"skin_5",img:"IMG_6257.webp",price:"$5.95",best:false}
];

const paidContainer = document.getElementById('paidSkinsContainer');

paidSkins.forEach(skin => {
  const block = document.createElement('div');
  block.className = 'circle-block';

  const circle = document.createElement('div');
  circle.className = 'circle';
  const img = document.createElement('img');
  img.src = skin.img;
  img.classList.add('active');
  circle.appendChild(img);

  // Best Deal badge
  if(skin.best){
    const badge = document.createElement('div');
    badge.className = 'best-deal-badge';
    badge.textContent = 'Best Deal';
    circle.appendChild(badge);
  }

  // Klik functionaliteit: ga naar paidskins.html met skin toegevoegd
  const priceBadge = document.createElement('div');
  priceBadge.className = 'price-badge';
  priceBadge.textContent = skin.price;
  priceBadge.addEventListener('click', () => {
    localStorage.setItem('addSkinId', skin.id); // wordt opgehaald in paidskins.html
    window.location.href = 'paidskins.html';
  });

  block.appendChild(circle);
  block.appendChild(priceBadge);
  paidContainer.appendChild(block);
});

// SKIN CAROUSEL
const skinsCircle1 = ['IMG_2978.jpeg','IMG_3164.png','FB2EDDE2.png'];
const skinsCircle2 = ['IMG_3156.jpeg','IMG_2718.png','IMG_2819.png'];
const skinsCircle3 = ['IMG_3520.png','IMG_3533.png','IMG_3512.webp'];

function cycle(circleId, images, time) {
  const circle = document.getElementById(circleId);
  let i = 0;
  images.forEach((src, index) => {
    const img = document.createElement('img');
    img.src = src;
    if (index===0) img.classList.add('active');
    circle.appendChild(img);
  });
  setInterval(()=>{
    const imgs = circle.querySelectorAll('img');
    imgs[i].classList.remove('active');
    i = (i+1)%imgs.length;
    imgs[i].classList.add('active');
  }, time);
}

cycle('circle1', skinsCircle1, 4000);
cycle('circle2', skinsCircle2, 4500);
cycle('circle3', skinsCircle3, 5000);
</script>

</body>
</html>
