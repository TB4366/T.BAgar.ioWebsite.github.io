  .skins-circles{max-width:900px;margin:0 auto 50px auto;display:flex;justify-content:center;gap:30px;flex-wrap:wrap;}
  .circle-block{display:flex;flex-direction:column;align-items:center;position:relative;}
  .circle{width:170px;height:170px;border-radius:50%;overflow:hidden;position:relative;background:#000;box-shadow:0 0 15px #48cae4;cursor:pointer;}
