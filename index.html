<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.B AGAR.IO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0b1220;
    color:white;
    transition:0.3s;
}

body.light{
    background:#f1f5f9;
    color:#111;
}

/* ===== HEADER ===== */
header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
    background:#0f172a;
    position:relative;
}

body.light header{
    background:#e2e8f0;
}

.left{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#48cae4;
}

.site-name{
    font-size:20px;
    font-weight:bold;
}

.search input{
    padding:6px 10px;
    border-radius:6px;
    border:none;
    outline:none;
}

.right{
    display:flex;
    align-items:center;
    gap:10px;
}

.login-btn{
    padding:6px 14px;
    border:none;
    border-radius:6px;
    background:#48cae4;
    font-weight:bold;
    cursor:pointer;
}

.toggle-theme{
    font-size:20px;
    cursor:pointer;
    background:none;
    border:none;
}

.menu-btn{
    font-size:26px;
    cursor:pointer;
    background:none;
    border:none;
}

/* ===== HAMBURGER MENU ===== */
.menu{
    display:none;
    position:absolute;
    top:60px;
    right:20px;
    background:#1e293b;
    border-radius:8px;
    overflow:hidden;
    min-width:180px;
}

body.light .menu{
    background:#cbd5e1;
}

.menu a{
    display:block;
    padding:12px 16px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid #334155;
}

body.light .menu a{
    color:#111;
    border-color:#94a3b8;
}

.menu a:hover{
    background:#334155;
}

body.light .menu a:hover{
    background:#94a3b8;
}

/* ===== MAIN ===== */
main{
    padding:40px 20px;
    text-align:center;
}

hr{
    width:80%;
    margin:25px auto;
    border:1px solid #334155;
}

body.light hr{
    border-color:#94a3b8;
}

/* ===== VIDEOS ===== */
.videos{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:30px 0;
}

.video{
    width:400px;
    height:225px;
    background:#1e293b;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#94a3b8;
    border-radius:10px;
}

body.light .video{
    background:#cbd5e1;
    color:#111;
}

/* ===== OPTIONS ===== */
.options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    max-width:900px;
    margin:30px auto;
}

.option{
    background:#1e293b;
    padding:30px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

.option:hover{
    background:#48cae4;
    color:black;
}

body.light .option{
    background:#cbd5e1;
}

@media(max-width:800px){
    .options{grid-template-columns:repeat(2,1fr);}
}

@media(max-width:500px){
    .options{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
    <div class="left">
        <div class="logo"></div>
        <div class="site-name">T.B AGAR.IO</div>
        <div class="search">
            <input type="text" placeholder="Search...">
        </div>
    </div>

    <div class="right">
        <button class="login-btn">Login</button>
        <button class="toggle-theme" id="themeBtn">🌙</button>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="https://tb4366.github.io/T.BAgar.ioWebsite.github.io/custom-skins.html">Custom Skins</a>
        <a href="https://tb4366.github.io/T.BAgar.ioWebsite.github.io/key-access.html">Keys</a>
    </div>
</header>

<main>
    <h1>WELCOME!</h1>

    <hr>

    <h2>T.B CHANNEL</h2>

    <div class="videos">
        <!-- Hier later YouTube iframe -->
        <div class="video">Video 1</div>
        <div class="video">Video 2</div>
    </div>

    <hr>

    <h2>Choose your option!</h2>

    <div class="options">
        <div class="option" onclick="location.href='https://tb4366.github.io/T.BAgar.ioWebsite.github.io/custom-skins.html'">
            Custom Skins
        </div>

        <div class="option" onclick="location.href='https://tb4366.github.io/T.BAgar.ioWebsite.github.io/key-access.html'">
            Keys
        </div>

        <div class="option">Option 3</div>
        <div class="option">Option 4</div>
        <div class="option">Option 5</div>
        <div class="option">Option 6</div>
    </div>
</main>

<script>
// Hamburger menu
function toggleMenu(){
    const m=document.getElementById("menu");
    m.style.display=m.style.display==="block"?"none":"block";
}

// Dark mode
const btn=document.getElementById("themeBtn");
const body=document.body;

if(localStorage.getItem("theme")==="light"){
    body.classList.add("light");
    btn.textContent="☀️";
}

btn.onclick=()=>{
    body.classList.toggle("light");
    const light=body.classList.contains("light");
    btn.textContent=light?"☀️":"🌙";
    localStorage.setItem("theme", light?"light":"dark");
};
</script>

</body>
</html>
