<!-- T.B Chat Bot widget (plaats vlak voor </body>) -->
<style>
/* Chat widget styles */
#tb-chat-toggle {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(180deg,#0ea5e9,#1e3a8a);
  border: 3px solid #0ea5e9;
  box-shadow: 0 6px 22px rgba(14,165,233,0.28);
  cursor: pointer;
  z-index: 12000;
  display: flex;
  align-items: center;
  justify-content: center;
}
#tb-chat-toggle img { width: 48px; height: 48px; border-radius: 50%; display:block; }
#tb-chat-panel {
  position: fixed;
  right: 90px;
  bottom: 24px;
  width: 360px;
  max-width: calc(100% - 120px);
  height: 520px;
  background: #071033;
  color: #e6f6fb;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  display: none;
  flex-direction: column;
  overflow: hidden;
  z-index: 12000;
  border: 2px solid #0ea5e9;
  font-family: Arial, sans-serif;
}
#tb-chat-header {
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background: linear-gradient(180deg,#071037,#021026);
}
#tb-chat-header img { width:44px;height:44px;border-radius:50%;display:block; margin-left:6px; }
#tb-chat-header .tb-title { flex:1; text-align:left; color:#a5f3fc; font-weight:bold; font-size:15px; }
#tb-chat-header .tb-sub { display:block; font-size:12px; color:#cfeff6; margin-top:3px; }
#tb-chat-header .tb-close { background:none;border:none;color:#9fe9ff; cursor:pointer; font-size:18px; margin-right:6px; }
#tb-chat-divider { height:1px; background:#0ea5e9; opacity:0.25; }
#tb-chat-body {
  flex:1; padding:12px; overflow:auto; display:flex; flex-direction:column; gap:8px;
  scroll-behavior: smooth;
}
.tb-msg { max-width:78%; padding:10px 12px; border-radius:12px; font-size:14px; line-height:1.3; word-wrap:break-word; }
.tb-msg.user { background: linear-gradient(180deg,#0b2540,#05203a); color:#bfe7ff; margin-left:auto; border:1px solid rgba(255,255,255,0.03); }
.tb-msg.bot { background: linear-gradient(180deg,#04354a,#00313e); color:#e6f6fb; margin-right:auto; border:1px solid rgba(255,255,255,0.03); }
.tb-meta { font-size:11px; color:#9fe9ff; opacity:0.8; margin-top:4px; }
#tb-chat-input-wrap { display:flex; gap:8px; padding:10px; border-top:1px solid rgba(255,255,255,0.03); background:linear-gradient(180deg,#071026,#031624); }
#tb-chat-input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); background:#021324; color:#e6f6fb; outline:none; font-size:14px; }
#tb-chat-send { background:#0ea5e9; border:none; color:#021026; padding:9px 12px; border-radius:10px; cursor:pointer; font-weight:bold; }

/* small screen placement tweak */
@media (max-width:520px){
  #tb-chat-panel { right: 12px; left: 12px; width: auto; height: 72vh; bottom: 12px; }
  #tb-chat-toggle { right: 12px; bottom: 12px; }
}
</style>

<!-- Toggle (round button) -->
<button id="tb-chat-toggle" aria-label="Open T.B Chat Bot" title="T.B Chat Bot">
  <!-- replace src with your small icon if desired -->
  <img src="74BF9245-C3FD-4FAE-9CE1-D1AA11CFA7FF.jpeg" alt="T.B">
</button>

<!-- Panel -->
<div id="tb-chat-panel" role="dialog" aria-modal="true" aria-label="T.B Chat Bot">
  <div id="tb-chat-header">
    <img src="74BF9245-C3FD-4FAE-9CE1-D1AA11CFA7FF.jpeg" alt="icon">
    <div>
      <div class="tb-title">T.B Chat Bot</div>
      <div class="tb-sub">24/7 Support</div>
    </div>
    <button class="tb-close" id="tb-chat-close" aria-label="Close chat">✕</button>
  </div>
  <div id="tb-chat-divider" aria-hidden="true"></div>

  <div id="tb-chat-body" aria-live="polite" aria-atomic="false"></div>

  <div id="tb-chat-input-wrap">
    <input id="tb-chat-input" placeholder="Typ hier je bericht..." aria-label="Type message" />
    <button id="tb-chat-send" aria-label="Send message">Stuur</button>
  </div>
</div>

<script>
/*
T.B Chat Bot - client-side private widget

Behavior summary (as requested):
- Private to this browser (localStorage), persists across refresh.
- Auto-delete after 20 minutes of inactivity (reset on any send/receive).
- Refuses to provide code/html/scripts; redirects to Instagram (@t.bagar.io) when asked for scripts.
- Only provides internal site links (allowedLinks), YouTube channel and social links below.
- If cannot answer, advises: "sorry ik kan je helaas niet hier bij helpen ... Instagram @t.bagar.io"
- Starts with greeting on open: "Hello, how can I help you?" (or localized).
- Basic intent mapping for mods / social contact / youtube.
*/

// --- Configuration: change these to match your site if needed ---
const BOT_NAME = "T.B Chat Bot";
const INSTA_HANDLE = "@t.bagar.io";
const INSTA_LINK = "https://www.instagram.com/t.bagar.io/";
const DISCORD_LINK = "https://discord.gg/qhuXPrVzBx";
const YT_CHANNEL = "https://www.youtube.com/@T.B6"; // T.B channel
const SITE_BASE = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, "/"); // best-effort base

// Allowed internal pages (relative or absolute). Only these links will be shared by the bot.
const allowedLinks = {
  "custom-skins": "custom-skins.html",
  "mod-menu": "mod-menu.html",
  "paidskins": "paidskins.html",
  "agar-skins": "agar.io-skins.html",
  "key-access": "key-access.html",
  "home": "index.html"
};

// localStorage key (per-site)
const STORAGE_KEY = 'tb_chat_' + (location.hostname || 'site');

// inactivity timeout (20 minutes)
const INACTIVITY_MS = 20 * 60 * 1000;

// --- utilities ---
function escapeText(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nowISO(){ return new Date().toISOString(); }

// --- DOM refs ---
const toggleBtn = document.getElementById('tb-chat-toggle');
const panel = document.getElementById('tb-chat-panel');
const closeBtn = document.getElementById('tb-chat-close');
const bodyDiv = document.getElementById('tb-chat-body');
const input = document.getElementById('tb-chat-input');
const sendBtn = document.getElementById('tb-chat-send');

// --- state & storage ---
let state = {
  messages: [], // {role: 'user'|'bot', text, t}
  lastActivity: Date.now()
};

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    // only accept when structure matches
    if (parsed && Array.isArray(parsed.messages)) {
      state = parsed;
      // ensure numeric lastActivity
      if (!state.lastActivity) state.lastActivity = Date.now();
    }
  } catch(e){}
}
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e){}
}
function clearState(){
  state = { messages: [], lastActivity: Date.now() };
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  renderMessages();
}

// --- inactivity / cleanup ---
let inactivityTimer = null;
function resetInactivityTimer(){
  state.lastActivity = Date.now();
  saveState();
  if (inactivityTimer) {
    clearTimeout(inactivityTimer);
  }
  inactivityTimer = setTimeout(() => {
    // clear conversation after timeout
    clearState();
    // optional gentle bot notice (but we clear, so show an ephemeral message first)
    addBotMessage(localize("Je chat is verwijderd wegens inactiviteit. Je kunt opnieuw beginnen."), { transient:true });
  }, INACTIVITY_MS);
}

// --- rendering ---
function renderMessages(){
  bodyDiv.innerHTML = '';
  for (const m of state.messages){
    const div = document.createElement('div');
    div.className = 'tb-msg ' + (m.role === 'user' ? 'user' : 'bot');
    // ensure plain-text only
    div.innerText = m.text;
    bodyDiv.appendChild(div);
  }
  // scroll to bottom
  bodyDiv.scrollTop = bodyDiv.scrollHeight;
}

// add user message
function addUserMessage(text){
  text = text.trim();
  if (!text) return;
  state.messages.push({ role: 'user', text: text, t: nowISO() });
  saveState();
  renderMessages();
  resetInactivityTimer();
}

// add bot message; options.transient won't persist in storage (display-only)
function addBotMessage(text, options = {}){
  // block code-ish characters in any bot message (ensures no code is shown)
  text = String(text).replace(/[<>]/g, '');
  if (!options.transient) {
    state.messages.push({ role: 'bot', text: text, t: nowISO() });
    saveState();
  } else {
    // transient: show but don't persist
    const div = document.createElement('div');
    div.className = 'tb-msg bot';
    div.innerText = text;
    bodyDiv.appendChild(div);
    setTimeout(()=>{ if(div && div.parentNode) div.parentNode.removeChild(div); }, 6000);
  }
  renderMessages();
  resetInactivityTimer();
}

// --- simple localization ---

const lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];

function localize(key){
  // minimal strings in NL and EN (extendable)
  const strings = {
    en: {
      greeting: "Hello, how can I help you?",
      morning: "Good morning, how can I help?",
      unknown_help: "Sorry, I can't help with that here. Please contact T.B via Instagram " + INSTA_HANDLE,
      ask_contact: "You can contact T.B on Instagram: " + INSTA_LINK,
      ask_discord: "Discord invite: " + DISCORD_LINK,
      youtube: "YouTube channel: " + YT_CHANNEL,
      mods_links_intro: "Here are links on this site related to Agar.io mods:",
      removed_code: "I cannot share code or scripts. Please ask T.B via Instagram: " + INSTA_HANDLE,
      deleted_inactive: "Your chat was deleted due to inactivity.",
    },
    nl: {
      greeting: "Hallo, kan ik je ergens mee helpen?",
      morning: "Goedemorgen, hoe kan ik je helpen?",
      unknown_help: "Sorry, ik kan je hier niet mee helpen. Neem contact op met T.B via Instagram " + INSTA_HANDLE,
      ask_contact: "Je kunt T.B bereiken op Instagram: " + INSTA_LINK,
      ask_discord: "Discord invite: " + DISCORD_LINK,
      youtube: "YouTube kanaal: " + YT_CHANNEL,
      mods_links_intro: "Hieronder links op deze site met betrekking tot Agar.io mods:",
      removed_code: "Ik kan geen code of scripts delen. Vraag T.B via Instagram: " + INSTA_HANDLE,
      deleted_inactive: "Je chat is verwijderd wegens inactiviteit.",
    }
  };
  return (strings[lang] && strings[lang][key]) || strings['en'][key] || key;
}

// choose greeting based on local time
function getGreeting(){
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return localize('morning');
  return localize('greeting');
}

// --- intent detection & bot logic (rule-based) ---
function containsAny(s, arr){ s = s.toLowerCase(); return arr.some(w => s.includes(w)); }

function handleUserMessage(text){
  const lc = text.toLowerCase();

  // always reject code/html requests
  if (containsAny(lc, ['script', 'code', '<html', '<script', 'css', 'javascript', 'js file', 'paste code', 'how to make script', 'how do i script', 'give me code', 'source code'])) {
    addBotMessage(localize('removed_code'));
    return;
  }

  // contact requests
  if (containsAny(lc, ['contact', 'instagram', 'insta', 'how to contact', 'how can i contact', 'reach', 'mail'])) {
    addBotMessage(localize('ask_contact'));
    return;
  }

  // discord request
  if (containsAny(lc, ['discord'])) {
    addBotMessage(localize('ask_discord'));
    return;
  }

  // youtube request
  if (containsAny(lc, ['youtube', 'video', 'channel'])) {
    addBotMessage(localize('youtube'));
    return;
  }

  // mods-related requests
  if (containsAny(lc, ['mod', 'mods', 'shrk', 'agar.io mod', 'agario mod', 'agar.io mods', 'agar mods'])) {
    // list available internal links (only site pages)
    let lines = [ localize('mods_links_intro') ];
    for (const k in allowedLinks){
      const rel = allowedLinks[k];
      // build site-link relative
      const url = rel.startsWith('http') ? rel : (location.origin + (rel.startsWith('/') ? rel : '/' + rel));
      lines.push('- ' + k + ': ' + url);
    }
    addBotMessage(lines.join('\n'));
    return;
  }

  // greetings
  if (containsAny(lc, ['hello','hallo','hi','hey','goedemorgen','goedenavond','goedemiddag'])) {
    addBotMessage(getGreeting());
    return;
  }

  // small talk / assistance prompts
  if (containsAny(lc, ['help', 'how can', 'how do i', 'can you', 'what can you do','waarmee'])) {
    addBotMessage(getGreeting());
    return;
  }

  // link requests (generic)
  if (containsAny(lc, ['link', 'links', 'url', 'where can i find', 'where is'])) {
    // prefer instagram if asking for a link to contact
    if (containsAny(lc, ['contact', 'support', 'help'])) {
      addBotMessage(localize('ask_contact'));
    } else {
      addBotMessage("Links on this site: " + Object.values(allowedLinks).map(p => (location.origin + (p.startsWith('/')? p : '/' + p))).join(' | '));
    }
    return;
  }

  // fallback: can't answer -> direct to Instagram
  addBotMessage(localize('unknown_help'));
}

// --- persistence & UI hooks ---
function openPanel(){
  panel.style.display = 'flex';
  // on open show greeting from bot if no messages yet or if last message > short threshold
  if (state.messages.length === 0){
    addBotMessage(getGreeting());
  } else {
    // if last activity was long ago, optionally greet
    const last = state.messages[state.messages.length-1];
    const age = Date.now() - new Date(last.t || Date.now()).getTime();
    if (age > 60*60*1000) addBotMessage(getGreeting());
  }
  resetInactivityTimer();
  input.focus();
}
function closePanel(){
  panel.style.display = 'none';
}

// send flow
function sendCurrent(){
  const text = input.value.trim();
  if (!text) return;
  addUserMessage(text);
  // Bot reply (simulate thinking)
  setTimeout(()=> {
    try {
      handleUserMessage(text);
    } catch(e){
      addBotMessage(localize('unknown_help'));
    }
  }, 350 + Math.random()*400);
  input.value = '';
  input.focus();
}

// init
loadState();
renderMessages();
resetInactivityTimer();

// wire events
toggleBtn.addEventListener('click', ()=> {
  if (panel.style.display === 'flex') { closePanel(); }
  else { openPanel(); }
});
closeBtn.addEventListener('click', ()=> closePanel());
sendBtn.addEventListener('click', sendCurrent);
input.addEventListener('keydown', (e)=> { if (e.key === 'Enter') sendCurrent(); });

// make sure widget doesn't leak html: sanitize any attempt to insert HTML into bot messages (we already used innerText)
// and ensure stored messages are plain text only (we used text values)

// initial auto-greeting only when user opens widget (above)

// clear storage also when tab closed after long idle (best effort)
window.addEventListener('beforeunload', ()=> {
  // if inactivity exceeded, clear now
  if (Date.now() - state.lastActivity > INACTIVITY_MS) {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  } else {
    // keep it for persistence across refresh
    saveState();
  }
});
</script>
