<script>
/* =========================

========================= */
function openMenu(){document.getElementById("side-menu").classList.add("open");document.getElementById("menu-overlay").classList.add("show")}

/* CHAT toggle & send */
function toggleChat(){document.getElementById("chat-box").classList.toggle("open")}
async function sendMessage(){const input=document.getElementById("chat-input");const messages=document.getElementById("chat-messages");const text=(input.value||"").trim(); if(!text) return;const userMessage=document.createElement("div");userMessage.className="chat-message";userMessage.style.background="#0b0610";userMessage.textContent=text;messages.appendChild(userMessage);input.value="";messages.scrollTop=messages.scrollHeight;setTimeout(()=>{const botMessage=document.createElement("div");botMessage.className="chat-message";botMessage.style.background="#0f0810";botMessage.textContent="Thanks! We'll reply on Discord or here soon.";messages.appendChild(botMessage);messages.scrollTop=messages.scrollHeight;},700)}
document.getElementById("chat-input").addEventListener("keydown", function(e){ if(e.key==="Enter") sendMessage() })

/* Loader hide on page load + welcome animation */
window.addEventListener("load", function(){
  const w=document.getElementById("welcome-text");
  function restartAnimation(){ w.classList.remove("animated"); void w.offsetWidth; w.classList.add("animated"); }
  restartAnimation(); setInterval(restartAnimation, 3200);
  setTimeout(()=>{const loader=document.getElementById("loader"); if(loader) loader.style.display="none"},800);
});

/* =========================
   HALLOWEEN countdown
   ends at Nov 1, 2026 23:59 local time
========================= */
const halloweenEnd = new Date("2026-11-01T23:59:00");
function updateCountdown(){ const now=new Date(); const diff=halloweenEnd-now; const el=document.getElementById("hallow-countdown"); const modalEnd=document.getElementById("modal-end-time"); if(diff<=0){ el.textContent="Event ended"; modalEnd.textContent="Ends: Nov 1, 2026 23:59"; return; } const days=Math.floor(diff/(24*3600*1000)); const hours=Math.floor((diff%(24*3600*1000))/(3600*1000)); const mins=Math.floor((diff%(3600*1000))/(60*1000)); el.textContent=`${days} days ${hours} hrs ${mins} min`; modalEnd.textContent=`Ends: Nov 1, 2026 23:59`; }
updateCountdown(); setInterval(updateCountdown,1000);

/* =========================
   HALLOWEEN modal open/close
========================= */
const modal=document.getElementById("halloween-modal");
document.getElementById("open-halloween").addEventListener("click", ()=>{ modal.classList.add("open"); modal.setAttribute("aria-hidden","false"); });
function closeHalloween(){ modal.classList.remove("open"); modal.setAttribute("aria-hidden","true"); }

/* =========================
   SPINNER / WHEEL GIVEAWAY LOGIC
   - one free spin per device (localStorage)
   - if device already used, require a valid code to spin again
   - FIXED code lists per tier: each tier $1..$10 has exactly 10 codes (no random generation)
========================= */
const wheel=document.getElementById("wheel");
const spinButton=document.getElementById("spin-button");
const fastSpinButton=document.getElementById("fast-spin-button");
const codeInput=document.getElementById("code-input");
const spinResult=document.getElementById("spin-result");
const FREE_SPIN_KEY="tb_free_spin_used";
const USED_CODES_KEY="tb_used_codes_v1";

const prizes=["Halloween Agar.io skin","Scar Agar.io skin","5 days bots","2 days bots","1 Gameplay with T.B","Sorry — nothing","Sorry — nothing","Sorry — nothing","Sorry — nothing","Sorry — nothing"];

/* ====== FIXED CODES PER TIER ======
   Each tier (1..10) contains exactly 10 predefined codes.
   Replace these strings with your real/generated codes if needed.
*/
const codesByTier = {
  1: ["TB1-001","TB1-002","TB1-003","TB1-004","TB1-005","TB1-006","TB1-007","TB1-008","TB1-009","TB1-010"],
  2: ["TB2-011","TB2-012","TB2-013","TB2-014","TB2-015","TB2-016","TB2-017","TB2-018","TB2-019","TB2-020"],
  3: ["TB3-021","TB3-022","TB3-023","TB3-024","TB3-025","TB3-026","TB3-027","TB3-028","TB3-029","TB3-030"],
  4: ["TB4-031","TB4-032","TB4-033","TB4-034","TB4-035","TB4-036","TB4-037","TB4-038","TB4-039","TB4-040"],
  5: ["TB5-041","TB5-042","TB5-043","TB5-044","TB5-045","TB5-046","TB5-047","TB5-048","TB5-049","TB5-050"],
  6: ["TB6-051","TB6-052","TB6-053","TB6-054","TB6-055","TB6-056","TB6-057","TB6-058","TB6-059","TB6-060"],
  7: ["TB7-061","TB7-062","TB7-063","TB7-064","TB7-065","TB7-066","TB7-067","TB7-068","TB7-069","TB7-070"],
  8: ["TB8-071","TB8-072","TB8-073","TB8-074","TB8-075","TB8-076","TB8-077","TB8-078","TB8-079","TB8-080"],
  9: ["TB9-081","TB9-082","TB9-083","TB9-084","TB9-085","TB9-086","TB9-087","TB9-088","TB9-089","TB9-090"],
 10: ["TB10-091","TB10-092","TB10-093","TB10-094","TB10-095","TB10-096","TB10-097","TB10-098","TB10-099","TB10-100"]
};

/* For admin/debug: list codes in console (you can remove this in production) */
console.log("Fixed demo codes per tier:", codesByTier);

/* local used codes store */
function loadUsedCodes(){ try{ return JSON.parse(localStorage.getItem(USED_CODES_KEY) || "[]"); }catch(e){return []} }
function markCodeUsed(code){ const arr = loadUsedCodes(); if(!arr.includes(code)){arr.push(code); localStorage.setItem(USED_CODES_KEY, JSON.stringify(arr)); } }

/* Helper: determine weight distribution by tier.
   Returns an array of weights for 10 prizes. Higher tier increases chance for top prizes.
*/
function weightsForTier(tier){
  const base = [5,4,3,2,1,30,20,15,10,10];
  const mult = 1 + (tier - 1) * 0.18;
  const weights = base.map((w,i)=> i<=4 ? Math.max(1, Math.round(w * mult)) : w);
  return weights;
}

/* pick index by weights */
function weightedPick(weights){
  const sum = weights.reduce((a,b)=>a+b,0);
  let r = Math.random() * sum;
  for(let i=0;i<weights.length;i++){
    if(r < weights[i]) return i;
    r -= weights[i];
  }
  return weights.length-1;
}

/* spin action */
let spinning = false;
function performSpin({fast=false, tier=1} = {}){
  if(spinning) return;
  spinning = true;
  spinButton.disabled = true;
  fastSpinButton.disabled = true;
  spinResult.textContent = "Spinning... good luck!";
  const weights = weightsForTier(tier);
  const chosenIndex = weightedPick(weights); // 0..9
  const sliceDeg = 360 / prizes.length;
  const randomOffset = (Math.random()* (sliceDeg - 6)) - (sliceDeg/2 - 3);
  const targetDeg = (360 - (chosenIndex * sliceDeg + sliceDeg/2) + randomOffset) % 360;
  const extraTurns = fast ? (6 + Math.floor(Math.random()*4)) : (3 + Math.floor(Math.random()*3));
  const finalDeg = extraTurns*360 + targetDeg;
  const duration = fast ? 3000 : 5000;
  wheel.style.transition = `transform ${duration}ms cubic-bezier(.12,.85,.2,1)`;
  wheel.style.transform = `rotate(${finalDeg}deg)`;
  wheel._rotation = finalDeg;
  setTimeout(()=> {
    spinning = false;
    wheel.style.transition = "";
    const prize = prizes[chosenIndex] || "Sorry — nothing";
    spinResult.textContent = `Result: ${prize}`;
    if(!localStorage.getItem(FREE_SPIN_KEY)){
      localStorage.setItem(FREE_SPIN_KEY, "1");
    }
    spinButton.disabled = false;
    fastSpinButton.disabled = false;
  }, duration + 50);
}

/* spin button handler */
spinButton.addEventListener("click", ()=> attemptSpin(false));
fastSpinButton.addEventListener("click", ()=> attemptSpin(true));

function attemptSpin(fast){
  if(spinning) return;
  const freeUsed = !!localStorage.getItem(FREE_SPIN_KEY);
  const code = (codeInput.value||"").trim().toUpperCase();
  if(!freeUsed){
    performSpin({fast, tier:1});
    return;
  }
  if(!code){
    spinResult.textContent = "You already used your free spin. Enter a valid code to spin again.";
    return;
  }
  // Validate code across tiers
  let foundTier = null;
  for(let t=1;t<=10;t++){
    const list = codesByTier[t].map(c=>c.toUpperCase());
    if(list.includes(code)){
      foundTier = t;
      break;
    }
  }
  if(!foundTier){
    spinResult.textContent = "Invalid code. Make sure you typed it exactly.";
    return;
  }
  // check used codes
  const used = loadUsedCodes();
  if(used.includes(code)){
    spinResult.textContent = "This code was already used.";
    return;
  }
  // mark code used and spin with that tier
  markCodeUsed(code);
  codeInput.value = "";
  spinResult.textContent = `Code accepted (Tier $${foundTier}). Spinning...`;
  performSpin({fast, tier:foundTier});
}

/* reset demo function */
window._tb_demo_reset_spins = function(){
  localStorage.removeItem(FREE_SPIN_KEY);
  localStorage.removeItem(USED_CODES_KEY);
  alert("Demo spins reset (localStorage cleared).");
};

document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape") closeHalloween();
});
