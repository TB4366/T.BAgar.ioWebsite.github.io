<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>T.B Agar.io Website</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  body.dark {
    background: #f0f0f0;
    color: #222;
  }

  /* Halloween theme */
  body.halloween {
    background: #1a0b0b url('https://i.imgur.com/5D1GxgT.png') repeat top left; /* voorbeeld spinnenweb achtergrond */
    color: #ff7518;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: #0f172a;
    position: relative;
    transition: background-color 0.3s ease;
  }
  body.dark header {
    background: #e0e0e0;
  }
  body.halloween header {
    background: #330000;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 10px;
  }
  .site-title {
    font-size: 1.2rem;
    font-weight: bold;
  }
  .toggle-btn-header {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 22px;
    color: #0077b6;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .toggle-btn-header:hover {
    background-color: #48cae4;
    color: white;
  }
  body.dark .toggle-btn-header {
    color: #4dd0e1;
  }
  body.dark .toggle-btn-header:hover {
    background-color: #0077b6;
    color: white;
  }
  .menu-btn {
    cursor: pointer;
    font-size: 24px;
    background: none;
    border: none;
    color: white;
  }
  body.dark .menu-btn {
    color: #222;
  }
  .menu {
    display: none;
    position: absolute;
    top: 60px;
    right: 20px;
    background: #1e293b;
    border-radius: 8px;
    overflow: hidden;
    min-width: 160px;
    z-index: 10;
  }
  body.dark .menu {
    background: #ccc;
  }
  body.halloween .menu {
    background: #440000;
  }
  .menu a {
    display: block;
    padding: 12px;
    text-decoration: none;
    color: white;
    border-bottom: 1px solid #334155;
  }
  body.dark .menu a {
    color: #222;
    border-bottom: 1px solid #aaa;
  }
  body.halloween .menu a {
    color: #ff7518;
    border-bottom: 1px solid #ff7518;
  }
  .menu a:hover {
    background: #334155;
  }
  body.dark .menu a:hover {
    background: #ddd;
  }
  body.halloween .menu a:hover {
    background: #550000;
  }

  .main-video {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .video-grid {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 20px;
  }
  iframe {
    border: none;
    border-radius: 12px;
  }
  .youtube-link {
    text-align: center;
    margin-top: 20px;
  }
  .youtube-link a {
    display: inline-block;
    padding: 12px 20px;
    background: #1e293b;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
  }
  .youtube-link a:hover {
    background: #334155;
  }

  .btn {
    padding: 12px 24px;
    background-color: #1e293b;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    transition: background-color 0.3s ease;
  }
  .btn:hover {
    background-color: #334155;
  }
  body.halloween .btn {
    background-color: #550000;
    color: #ff7518;
  }
  body.halloween .btn:hover {
    background-color: #aa2200;
  }

  .divider {
    max-width: 900px;
    margin: 40px auto 10px auto;
    border-top: 2px solid #48cae4;
  }
  .highlight-title {
    text-align: center;
    font-size: 1.8rem;
    font-weight: bold;
    margin: 20px 0 30px;
    color: #48cae4;
  }
  body.dark .divider {
    border-top: 2px solid #0077b6;
  }
  body.dark .highlight-title {
    color: #0077b6;
  }
  body.halloween .divider {
    border-top: 2px solid #ff7518;
  }
  body.halloween .highlight-title {
    color: #ff7518;
  }

  .skins-circles {
    max-width: 900px;
    margin: 0 auto 50px auto;
    display: flex;
    justify-content: center;
    gap: 40px;
  }
  .circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #000;
    box-shadow: 0 0 15px #48cae4;
    filter: brightness(0.8) saturate(1.2);
    cursor: pointer;
    transition: filter 0.3s ease, box-shadow 0.3s ease;
  }
  body.dark .circle {
    filter: brightness(1) saturate(1);
    box-shadow: 0 0 15px #0077b6;
  }
  body.halloween .circle {
    box-shadow: 0 0 15px #ff7518;
  }
  .circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0; left: 0;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .circle img.active {
    opacity: 1;
  }

  .keys-link {
    text-align: center;
    margin-bottom: 40px;
  }
  body.dark .keys-link .btn {
    background-color: #ccc;
    color: #222;
  }
  body.dark .keys-link .btn:hover {
    background-color: #aaa;
  }

</style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="IMG_2718.png" alt="Logo" class="logo" />
    <span class="site-title">T.B Agar.io</span>
    <button class="toggle-btn-header" id="themeToggleBtn">🌙</button>
  </div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="menu" id="menu">
    <a href="index.html">🏠 Home Page</a>
    <a href="agar.io-skins.html">🎱Agar.io Skins</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
    <a href="key-access.html">🔑 Keys</a>
    <a href="buy-account.html">💰 Buy Account</a>
  </div>
</header>

<main>
  <div class="main-video">
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OEkurL8aaZk" allowfullscreen></iframe>
  </div>

  <div class="youtube-link">
    <a href="https://www.youtube.com/@T.B6/featured" target="_blank">Visit My YouTube Channel</a>
  </div>

  <div class="video-grid">
    <iframe width="360" height="215" src="https://www.youtube.com/embed/diAuO3IC8Hg" allowfullscreen></iframe>
    <iframe width="360" height="215" src="https://www.youtube.com/embed/m0DEe4RhgSw" allowfullscreen></iframe>
  </div>

  <div class="divider"></div>
  <div class="highlight-title">The Best Custom Skins</div>
  <div class="skins-circles">
    <div class="circle" id="circle1"></div>
    <div class="circle" id="circle2"></div>
    <div class="circle" id="circle3"></div>
  </div>

  <!-- Halloween Button under skins -->
  <div style="text-align:center; margin-bottom:40px;">
    <a href="#" class="btn">🎃 Are you scared to press this button?</a>
  </div>

  <div class="divider"></div>
  <div class="highlight-title">T.B Keys</div>
  <div class="keys-link">
    <a href="key-access.html" class="btn">🔑 Go to the keys</a>
  </div>

  <!-- Halloween Contest Section -->
  <div style="text-align:center; margin-top:50px;">
    <img src="https://i.imgur.com/XI5e1Jj.png" alt="Halloween Contest" style="width:300px; border-radius:12px; margin-bottom:20px;">
    <div style="font-weight:bold; font-size:1.2rem; margin-bottom:20px;">
      Icy Crystal Contest – Join the Discord server to participate in this contest!
    </div>
  </div>
</main>

<script>
  function toggleMenu() {
    const menu = document.getElementById('menu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  }

  const toggleBtn = document.getElementById('themeToggleBtn');
  const body = document.body;
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    body.classList.add('dark');
    toggleBtn.textContent = '☀️';
  } else {
    toggleBtn.textContent = '🌙';
  }
  toggleBtn.addEventListener('click', () => {
    body.classList.toggle('dark');
    if (body.classList.contains('dark')) {
      toggleBtn.textContent = '☀️';
      localStorage.setItem('theme', 'dark');
    } else {
      toggleBtn.textContent = '🌙';
      localStorage.setItem('theme', 'light');
    }
  });

  // Skins images
  const skinsCircle1 = [
    'FB2EDDE2-8F8A-42C2-B720-7879BD6654DB.png',
    'IMG_2978.jpeg',
    'IMG_3164.png'
  ];
  const skinsCircle2 = [
    'IMG_3156.jpeg',
    'IMG_2718.png',
    'IMG_2819.png'
  ];
  const skinsCircle3 = [
    'IMG_3520.png',
    'IMG_3533.png',
    'IMG_3512.webp'
  ];
  const intervals = [4000, 4500, 5000];

  function cycleImages(circleId, images, interval) {
    const circle = document.getElementById(circleId);
    let currentIndex = 0;
    images.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      if (i === 0) img.classList.add('active');
      circle.appendChild(img);
    });
    setInterval(() => {
      const imgs = circle.querySelectorAll('img');
      imgs[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % imgs.length;
      imgs[currentIndex].classList.add('active');
    }, interval);
  }

  cycleImages('circle1', skinsCircle1, intervals[0]);
  cycleImages('circle2', skinsCircle2, intervals[1]);
  cycleImages('circle3', skinsCircle3, intervals[2]);

  // Halloween mode toggle for fun
  // Example: enable halloween theme if today is October
  const today = new Date();
  if(today.getMonth() === 9){ // October (0-indexed)
    body.classList.add('halloween');
  }
</script>

</body>
</html>
