<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Home Editor (Pro, Fixed)</title>
<style>
  :root{--accent:#ffae42;--bg:#111;}
  html,body{height:100%;margin:0;font-family:Arial, sans-serif;background:var(--bg);color:#fff}
  .wrap{max-width:1100px;margin:18px auto;padding:18px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{color:var(--accent);margin:0}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .btn{background:#ff6600;border:none;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
  .btn.secondary{background:#333}
  .panel{background:#151515;border:1px solid #2a2a2a;padding:12px;border-radius:10px;margin-top:12px}
  .editor-area{min-height:260px;border-radius:8px;border:1px dashed #333;padding:8px;background:#0f0f0f;overflow:auto}
  .block{background:#0b0b0b;border:1px solid #222;border-radius:8px;padding:10px;margin:8px 0;cursor:grab}
  .block.dragging{opacity:0.6}
  .block .handle{float:right;cursor:grab}
  label{display:block;margin:6px 0}
  input[type=text],select{width:100%;padding:8px;border-radius:6px;border:1px solid #333;background:#0b0b0b;color:#fff}
  #preview{background:linear-gradient(180deg,#00000055,#00000022);padding:18px;border-radius:10px;margin-top:12px;min-height:180px}
  .small{font-size:13px;color:#bbb}
  .row{display:flex;gap:8px}
  .col{flex:1}
  .top-actions{display:flex;gap:8px;align-items:center}
  .danger{background:#991b1b}
  .floating{position:absolute;pointer-events:none;user-select:none;z-index:5;opacity:0.95;transform:translate(-50%,-50%);will-change:transform}
  #previewWrap{position:relative;min-height:260px}
  @media (max-width:900px){.row{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Admin – Home Editor (Pro)</h1>
    <div class="top-actions">
      <button class="btn" id="btnLogout">🔒 Logout</button>
    </div>
  </header>

  <div class="panel">
    <div class="small">Beveiliging</div>
    <div class="row">
      <div class="col">
        <label>Admin wachtwoord instellen (standaard: admin123)</label>
        <input type="text" id="pwInput" placeholder="Nieuw wachtwoord">
      </div>
      <div style="width:160px;align-self:end">
        <button class="btn" id="btnSetPW">Opslaan wachtwoord</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="small">Invoeg items</div>
    <div class="controls">
      <button class="btn" onclick="addBlock('h2')">+ Titel</button>
      <button class="btn" onclick="addBlock('p')">+ Tekst</button>
      <button class="btn" id="addImageBtn">+ Afbeelding</button>
      <button class="btn" onclick="showVideoDialog()">+ Video</button>
      <button class="btn" onclick="addLink()">+ Link</button>
      <button class="btn" onclick="addHR()">+ Lijn</button>
      <button class="btn secondary" onclick="clearEditor()">🧹 Alles wissen</button>
      <button class="btn" id="btnSave">💾 Opslaan</button>
    </div>

    <div style="margin-top:10px" class="small">Drag & drop: sleep een blok om de volgorde te veranderen.</div>

    <div id="editor" class="editor-area" contenteditable="false" aria-label="Editor content"></div>
  </div>

  <div class="panel">
    <div class="small">Achtergrond & Figuren</div>
    <div class="row">
      <div class="col">
        <label>achtergrondkleur</label>
        <input type="color" id="bgColorPicker">
      </div>
      <div class="col">
        <label>achtergrond afbeelding (url)</label>
        <input type="text" id="bgImageInput" placeholder="https://...">
      </div>
    </div>

    <div style="margin-top:8px" class="row">
      <div class="col">
        <label>zwevende figuren thema</label>
        <select id="figureThemeSelect">
          <option value="none">Geen</option>
          <option value="zomer">Zomer</option>
          <option value="lente">Lente</option>
          <option value="herfst">Herfst</option>
          <option value="winter">Winter</option>
          <option value="halloween">Halloween</option>
          <option value="kerst">Kerst</option>
          <option value="pasen">Pasen</option>
          <option value="blackfriday">Black Friday</option>
          <option value="oudnieuw">Oud & Nieuw</option>
        </select>
      </div>
      <div style="width:160px;align-self:end">
        <button class="btn" id="btnApplyTheme">Toepassen</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="small">Automatisch opslaan & preview</div>
    <div class="row">
      <div class="col">
        <label>Auto-save interval (ms)</label>
        <input type="text" id="autoSaveInterval" value="3000">
      </div>
      <div style="width:160px;align-self:end">
        <button class="btn" id="btnToggleAuto">Toggle Auto-save</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="small">Preview</div>
    <div id="previewWrap">
      <div id="preview"></div>
    </div>
  </div>

  <div style="height:60px"></div>
</div>

<input type="file" id="imagePicker" accept="image/*" style="display:none">
<script>
// ---------- AUTH ----------
const DEFAULT_PW = 'admin123';
function requireAuth(){
  const stored = localStorage.getItem('adminPW') || DEFAULT_PW;
  const attempt = prompt('Voer admin wachtwoord in:');
  if(attempt !== stored){ alert('Verkeerd wachtwoord'); throw new Error('Unauthorized'); }
}
try { requireAuth(); } catch(e){ document.body.innerHTML = '<div style="color:#fff;padding:40px;text-align:center">Toegang geweigerd.</div>'; }

// ---------- EDITOR CORE ----------
let autoSaveTimer=null, autoSaveOn=true;
const editor = document.getElementById('editor');
function getSavedContent(){ return localStorage.getItem('homeContent')||''; }
function setSavedContent(v){ localStorage.setItem('homeContent',v); }

function parseToBlocks(html){
  if(!html) return;
  const temp=document.createElement('div'); temp.innerHTML=html;
  Array.from(temp.childNodes).forEach(n=>{
    const block=document.createElement('div');
    block.className='block'; block.draggable=true;
    block.innerHTML = (n.outerHTML!==undefined ? n.outerHTML : n.textContent);
    addBlockControls(block);
    editor.appendChild(block);
  });
}

function rebuildFromBlocks(){
  const html = Array.from(editor.children)
    .map(b=>b.innerHTML)
    .join('\n'); // FIXED LINE
  document.getElementById('preview').innerHTML = html;
  setSavedContent(html);
}

function loadEditor(){
  editor.innerHTML='';
  const saved=getSavedContent();
  if(saved) parseToBlocks(saved);
  else addBlock('h2','Welkom bij T.B Agar.io');
  applySettingsToPreview();
}
