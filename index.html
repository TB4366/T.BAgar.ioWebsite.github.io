<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>T.B Agar.io Website - Halloween</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #1a0b0b 40%, #000 100%);
    color: #ff7518;
    position: relative;
    overflow-x: hidden;
  }

  /* 🌫️ Mist-animatie */
  .fog, .fog2 {
    position: fixed;
    top: 0; left: 0;
    width: 200%;
    height: 100%;
    background: url('https://i.imgur.com/x1RdcP3.png') repeat-x;
    opacity: 0.07;
    z-index: 0;
    animation: fogmove 120s linear infinite;
  }
  .fog2 {
    animation-duration: 160s;
    opacity: 0.1;
  }

  @keyframes fogmove {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* 🎃 Zwevende decoraties (pompoenen, vleermuizen, spoken) */
  .floating {
    position: fixed;
    top: 0;
    opacity: 0.25;
    z-index: 0;
    pointer-events: none;
    animation: float 12s ease-in-out infinite;
  }

  .floating:nth-child(3) { left: 5%; top: 15%; width: 60px; animation-delay: 2s; }
  .floating:nth-child(4) { left: 80%; top: 25%; width: 50px; animation-delay: 5s; }
  .floating:nth-child(5) { left: 60%; top: 70%; width: 70px; animation-delay: 8s; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px) rotate(3deg); }
  }

  /* 🎃 Vallende pompoenen */
  .pumpkin {
    position: fixed;
    top: -80px;
    width: 40px;
    opacity: 0.2;
    pointer-events: none;
    z-index: 0;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-100px) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }

  /* Rest van jouw originele styling hieronder ⬇️ */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: rgba(51, 0, 0, 0.85);
    backdrop-filter: blur(4px);
    position: relative;
    z-index: 2;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 10px;
  }
  .site-title {
    font-size: 1.2rem;
    font-weight: bold;
  }
  .toggle-btn-header, .menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 22px;
    color: #ff7518;
    padding: 6px 10px;
    border-radius: 8px;
  }

  .menu {
    display: none;
    position: absolute;
    top: 60px;
    right: 20px;
    background: #440000;
    border-radius: 8px;
    overflow: hidden;
    min-width: 160px;
    z-index: 3;
  }
  .menu a {
    display: block;
    padding: 12px;
    text-decoration: none;
    color: #ff7518;
    border-bottom: 1px solid #ff7518;
  }
  .menu a:hover {
    background: #550000;
  }

  .main-video, .video-grid, .youtube-link, .social-buttons {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 1;
  }
  .video-grid {
    flex-wrap: wrap;
    gap: 20px;
    margin: 20px;
  }
  iframe {
    border: none;
    border-radius: 12px;
    box-shadow: 0 0 15px #ff7518;
  }

  .btn {
    padding: 12px 24px;
    background-color: #550000;
    color: #ff7518;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    transition: background-color 0.3s ease;
  }
  .btn:hover {
    background-color: #aa2200;
  }

  .divider {
    max-width: 900px;
    margin: 40px auto 10px auto;
    border-top: 2px solid #ff7518;
  }
  .highlight-title {
    text-align: center;
    font-size: 1.8rem;
    font-weight: bold;
    margin: 20px 0 30px;
    color: #ff7518;
  }

  .skins-circles {
    max-width: 900px;
    margin: 0 auto 50px auto;
    display: flex;
    justify-content: center;
    gap: 40px;
  }
  .circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #000;
    box-shadow: 0 0 15px #ff7518;
    cursor: pointer;
    transition: box-shadow 0.3s ease;
  }
  .circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0; left: 0;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .circle img.active {
    opacity: 1;
  }

  .social-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 50px;
    margin: 50px 0;
    z-index: 1;
    position: relative;
  }
  .social-buttons a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
  }
  .social-discord { background-color: #5865F2; }
  .social-instagram { background-color: #E1306C; }
  .social-youtube { background-color: #FF0000; }

  @keyframes popup {
    0% { transform: translateY(-20px); opacity: 0; }
    50% { transform: translateY(-10px); opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>

<!-- 🌫️ Mist + zwevende decoraties -->
<div class="fog"></div>
<div class="fog2"></div>
<img src="https://i.imgur.com/9Cz8W9G.png" class="floating" alt="">
<img src="https://i.imgur.com/KzT7TgH.png" class="floating" alt="">
<img src="https://i.imgur.com/7hCrc9V.png" class="floating" alt="">

<!-- Pompoenen (vallen willekeurig met JS) -->
<div id="pumpkin-container"></div>

<header>
  <div class="logo-container">
    <img src="IMG_2718.png" alt="Logo" class="logo" />
    <span class="site-title">T.B Agar.io 🎃</span>
    <button class="toggle-btn-header" id="themeToggleBtn">🌙</button>
  </div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="menu" id="menu">
    <a href="index.html">🏠 Home Page</a>
    <a href="agar.io-skins.html">🎱Agar.io Skins</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
    <a href="key-access.html">🔑 Keys</a>
    <a href="buy-account.html">💰 Buy Account</a>
  </div>
</header>

<!-- Jouw volledige originele content blijft hieronder ongewijzigd -->
<main>
  <!-- (alles van je originele code hier, video’s, knoppen, skins, social links, enz.) -->
</main>

<script>
  // Menu toggle
  function toggleMenu() {
    const menu = document.getElementById('menu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  }

  // 🎃 Vallende pompoenen generator
  const pumpkinContainer = document.getElementById('pumpkin-container');
  const pumpkinImg = 'https://i.imgur.com/qtM1Sgr.png'; // doorzichtige pompoen
  for (let i = 0; i < 8; i++) {
    const pumpkin = document.createElement('img');
    pumpkin.src = pumpkinImg;
    pumpkin.className = 'pumpkin';
    pumpkin.style.left = Math.random() * 100 + 'vw';
    pumpkin.style.animationDuration = (10 + Math.random() * 10) + 's';
    pumpkin.style.animationDelay = Math.random() * 10 + 's';
    pumpkinContainer.appendChild(pumpkin);
  }
</script>

</body>
</html>
