<script>
/* loader */
setTimeout(()=>{
  document.getElementById("loader").style.display="none";
},2000 + Math.random()*4000);

/* menu toggles */
function toggleMenu(){
  let menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

/* theme toggles */
function toggleTheme(){
  let body=document.body;
  let btn=document.getElementById("themeBtn");
  body.classList.toggle("light-mode");
  btn.textContent = body.classList.contains("light-mode") ? "🌙" : "☀️";
}

/* slider logic */
let index=0;
let slides=document.getElementById("slides");
let total=7;
let lastTouch=Date.now();

function showVideo(){
  slides.style.transform = "translateX(-"+(index*100)+"%)";
}

function nextVideo(){
  index++;
  if(index>=total) index=0;
  showVideo();
  lastTouch=Date.now();
}

function prevVideo(){
  index--;
  if(index<0) index=total-1;
  showVideo();
  lastTouch=Date.now();
}

setInterval(()=>{
  let now=Date.now();
  if(now-lastTouch>2000){
    index++;
    if(index>=total) index=0;
    showVideo();
  }
},2000);

document.querySelectorAll("iframe").forEach(video=>{
  video.addEventListener("mouseenter",()=>{
    lastTouch=Date.now()+100000;
  });
  video.addEventListener("mouseleave",()=>{
    lastTouch=Date.now();
  });
});

/* popup skins */
let currentSkin="";
function openPopup(image){
  currentSkin=image;
  document.getElementById("popup").style.display="flex";
  document.getElementById("downloadBtn").href=image;
}
function closePopup(){
  document.getElementById("popup").style.display="none";
}

/* --- Xsolla integration: open/close overlay --- */
const xsollaOverlay = document.getElementById('xsollaOverlay');
const xsollaFrame = document.getElementById('xsollaFrame');

function openXsolla(){
  // toon overlay en laad iframe (src al ingesteld), zet aria-hidden
  xsollaOverlay.style.display = 'flex';
  xsollaOverlay.setAttribute('aria-hidden','false');
  // verberg menu als open
  document.getElementById('menu').style.display = 'none';
  // voorkom scrolling van de body
  document.body.style.overflow = 'hidden';
}

function closeXsolla(){
  xsollaOverlay.style.display = 'none';
  xsollaOverlay.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  // als je wilt: xsollaFrame.src = 'about:blank'; // unload de site
}

/* sluit overlay bij klikken buiten container */
xsollaOverlay.addEventListener('click', function(e){
  if(e.target === xsollaOverlay) closeXsolla();
});

/* sluit overlay met ESC */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(xsollaOverlay.style.display === 'flex'){
      closeXsolla();
    }
  }
});
</script>
