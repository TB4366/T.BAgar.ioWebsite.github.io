<!-- 50 Floating Halloween objects -->
<script>
const floatingObjects = [];
const emojis = ["🎃","👻","🦇","🕷️"];
const totalObjects = 50;

for(let i=0;i<totalObjects;i++){
  const div = document.createElement('div');
  div.className='floating';
  div.innerText = emojis[Math.floor(Math.random()*emojis.length)];
  div.style.top=Math.random()*80+'%';
  div.style.left=Math.random()*10+'%'; // left side
  div.speed=(Math.random()*1+0.5)/2;
  div.directionX=1;
  div.directionY=1;
  document.body.appendChild(div);
  floatingObjects.push(div);
  const div2 = div.cloneNode(true);
  div2.style.left = (90+Math.random()*10)+'%'; // right side
  document.body.appendChild(div2);
  floatingObjects.push(div2);
}

// Animate floating objects
function animateFloating(){
  floatingObjects.forEach(o=>{
    let top=parseFloat(o.style.top);
    let left=parseFloat(o.style.left);
    top+=o.directionY*o.speed;
    left+=o.directionX*o.speed;
    if(top<0||top>80)o.directionY*=-1;
    if(left<0||left>10 && left<50)o.directionX*=-1;
    if(left>90||left<50 && left>50)o.directionX*=-1;
    o.style.top=top+'%';
    o.style.left=left+'%';
  });
  requestAnimationFrame(animateFloating);
}
requestAnimationFrame(animateFloating);
</script>

<script>
function toggleMenu(){
  const menu=document.getElementById('menu');
  menu.style.display=menu.style.display==='block'?'none':'block';
}

// Skins animation
function cycleSkins(circleId,interval){
  const circle=document.getElementById(circleId);
  let index=0;
  const imgs=circle.querySelectorAll('img');
  setInterval(()=>{
    imgs.forEach(i=>i.classList.remove('active'));
    index=(index+1)%imgs.length;
    imgs[index].classList.add('active');
  },interval);
}
cycleSkins('circle1',4000);
cycleSkins('circle2',5000);
cycleSkins('circle3',6000);

// Halloween Wheel
const wheelCanvas=document.getElementById('wheelCanvas');
const ctx=wheelCanvas.getContext('2d');
const wheelOverlay=document.getElementById('wheelOverlay');
const prizeText=document.getElementById('prizeText');
const prizes=["🍬 Trick Candy","🎨 Extra Skin","🎁 Small Prize","👻 Fun Emoji"];
const numSegments=prizes.length;
let currentAngle=0;
let spinning=false;

function openWheel(){
  wheelOverlay.style.display='flex';
  drawWheel();
}

function drawWheel(){
  const center=200;
  const radius=180;
  ctx.clearRect(0,0,400,400);
  for(let i=0;i<numSegments;i++){
    ctx.beginPath();
    ctx.moveTo(center,center);
    const startAngle=(i/numSegments)*2*Math.PI;
    const endAngle=((i+1)/numSegments)*2*Math.PI;
    ctx.fillStyle=i%2===0?'#ff7518':'#ffcc66';
    ctx.arc(center,center,radius,startAngle,endAngle);
    ctx.fill();
    ctx.save();
    ctx.translate(center,center);
    ctx.rotate((startAngle+endAngle)/2);
    ctx.textAlign='right';
    ctx.fillStyle='#000';
    ctx.font='16px Arial';
    ctx.fillText(prizes[i],radius-10,5);
    ctx.restore();
  }
}

function spinWheel(){
  if(spinning) return;
  spinning=true;
  prizeText.textContent='';
  let spins=Math.random()*5+5;
  let targetAngle=spins*2*Math.PI+Math.random()*2*Math.PI;
  let start=null;

  function animate(time){
    if(!start) start=time;
    const elapsed=time-start;
    const duration=4000;
    const progress=Math.min(elapsed/duration,1);
    const angle=currentAngle + (targetAngle-currentAngle)*easeOutQuad(progress);
    currentAngle=angle;
    drawWheel();
    wheelCanvas.style.transform=`rotate(${angle}rad)`;
    if(progress<1){
      requestAnimationFrame(animate);
    }else{
      spinning=false;
      const segment=Math.floor((currentAngle%(2*Math.PI))/(2*Math.PI/numSegments));
      prizeText.textContent=`You won: ${prizes[segment]}! 🎉`;
    }
  }
  requestAnimationFrame(animate);
}

function easeOutQuad(t){ return t*(2-t); }
</script>
