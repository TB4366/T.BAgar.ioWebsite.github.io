<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>T.B Agar.io Website</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  body.dark {
    background: #f0f0f0;
    color: #222;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: #0f172a;
    position: relative;
    transition: background-color 0.3s ease;
  }
  body.dark header {
    background: #e0e0e0;
  }
  .logo-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 10px;
  }
  .site-title {
    font-size: 1.2rem;
    font-weight: bold;
  }
  .toggle-btn-header {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 22px;
    color: #0077b6;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .toggle-btn-header:hover {
    background-color: #48cae4;
    color: white;
  }
  body.dark .toggle-btn-header {
    color: #4dd0e1;
  }
  body.dark .toggle-btn-header:hover {
    background-color: #0077b6;
    color: white;
  }
  .menu-btn {
    cursor: pointer;
    font-size: 24px;
    background: none;
    border: none;
    color: white;
  }
  body.dark .menu-btn {
    color: #222;
  }
  .menu {
    display: none;
    position: absolute;
    top: 60px;
    right: 20px;
    background: #1e293b;
    border-radius: 8px;
    overflow: hidden;
    min-width: 160px;
    z-index: 10;
  }
  body.dark .menu {
    background: #ccc;
  }
  .menu a {
    display: block;
    padding: 12px;
    text-decoration: none;
    color: white;
    border-bottom: 1px solid #334155;
  }
  body.dark .menu a {
    color: #222;
    border-bottom: 1px solid #aaa;
  }
  .menu a:hover {
    background: #334155;
  }
  body.dark .menu a:hover {
    background: #ddd;
  }
  .main-video {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .video-grid {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 20px;
  }
  iframe {
    border: none;
    border-radius: 12px;
  }
  .youtube-link {
    text-align: center;
    margin-top: 20px;
  }
  .youtube-link a {
    display: inline-block;
    padding: 12px 20px;
    background: #1e293b;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
  }
  .youtube-link a:hover {
    background: #334155;
  }
  .btn {
    padding: 12px 24px;
    background-color: #1e293b;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    transition: background-color 0.3s ease;
  }
  .btn:hover {
    background-color: #334155;
  }

  /* Skins sectie */
  .divider {
    max-width: 900px;
    margin: 40px auto 10px auto;
    border-top: 2px solid #48cae4;
  }
  .highlight-title {
    text-align: center;
    font-size: 1.8rem;
    font-weight: bold;
    margin: 20px 0 30px;
    color: #48cae4;
  }
  body.dark .divider {
    border-top: 2px solid #0077b6;
  }
  body.dark .highlight-title {
    color: #0077b6;
  }
  .skins-circles {
    max-width: 900px;
    margin: 0 auto 50px auto;
    display: flex;
    justify-content: center;
    gap: 40px;
  }
  .circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #000;
    box-shadow: 0 0 15px #48cae4;
    filter: brightness(0.8) saturate(1.2);
    cursor: pointer;
    transition: filter 0.3s ease, box-shadow 0.3s ease;
  }
  body.dark .circle {
    filter: brightness(1) saturate(1);
    box-shadow: 0 0 15px #0077b6;
  }
  .circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0; left: 0;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .circle img.active {
    opacity: 1;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Event balk en popup */
  .event-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(90deg,#1e293b,#334155);
    color: white;
    text-align: center;
    padding: 6px;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.5);
    z-index: 1000;
  }
  body.dark .event-bar {
    background: linear-gradient(90deg,#ccc,#aaa);
    color: #222;
  }

  .event-popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 320px;
    background: #0f172a;
    color: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    padding: 16px;
    z-index: 1001;
    animation: fadeIn 0.3s ease;
    text-align: center;
  }
  body.dark .event-popup {
    background: #f0f0f0;
    color: #222;
  }
  .event-popup img {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .event-popup .close-btn {
    position: absolute;
    top: 6px;
    right: 10px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="IMG_2718.png" alt="Logo" class="logo" />
    <span class="site-title">T.B Agar.io</span>
    <button class="toggle-btn-header" id="themeToggleBtn">🌙</button>
  </div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="menu" id="menu">
    <a href="index.html">🏠 Home Pagina</a>
    <a href="agar.io-skins.html">🎱Agar.io Skins</a>
    <a href="custom-skins.html">🎨 Custom Skins</a>
    <a href="mod-menu.html">🛠️ Mod Menu</a>
    <a href="key-access.html">🔑 Keys</a>
    <a href="buy-account.html">💰 Buy Account</a>
  </div>
</header>

<main>
  <!-- Je bestaande content blijft ongewijzigd -->
</main>

<!-- Event balk + popup -->
<div class="event-bar" id="eventBar">
  ⏳ <span id="countdownText">Even geduld...</span>
</div>

<div class="event-popup" id="eventPopup">
  <span class="close-btn" onclick="document.getElementById('eventPopup').style.display='none'">×</span>
  <div id="popupContent">
    <p id="popupMessage">Event komt eraan!</p>
    <img id="eventImage" src="IMG_2718.png" alt="Event afbeelding" style="display:none;">
    <p id="eventTimeInfo"></p>
  </div>
</div>

<script>
  function toggleMenu() {
    const menu = document.getElementById('menu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  }

  // Dark/light mode toggle
  const toggleBtn = document.getElementById('themeToggleBtn');
  const body = document.body;
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    body.classList.add('dark');
    toggleBtn.textContent = '☀️';
  } else {
    toggleBtn.textContent = '🌙';
  }
  toggleBtn.addEventListener('click', () => {
    body.classList.toggle('dark');
    if (body.classList.contains('dark')) {
      toggleBtn.textContent = '☀️';
      localStorage.setItem('theme', 'dark');
    } else {
      toggleBtn.textContent = '🌙';
      localStorage.setItem('theme', 'light');
    }
  });

  // Event start en eindtijd instellen
  const eventStart = new Date("2025-09-20T18:00:00");
  const eventEnd   = new Date("2025-09-22T23:59:00");

  function updateCountdown() {
    const now = new Date();
    let text = "";
    let popupMsg = "";
    let showImage = false;
    let timeInfo = "";

    if (now < eventStart) {
      // Voor event
      const diff = eventStart - now;
      const h = Math.floor(diff / (1000*60*60));
      const m = Math.floor((diff % (1000*60*60)) / (1000*60));
      const s = Math.floor((diff % (1000*60)) / 1000);
      text = `Event start over ${h}u ${m}m ${s}s`;
      popupMsg = "Event komt eraan!";
      showImage = false;
      timeInfo = `Start: ${eventStart.toLocaleString("nl-NL")}`;
    } else if (now >= eventStart && now <= eventEnd) {
      // Tijdens event
      const diff = eventEnd - now;
      const h = Math.floor(diff / (1000*60*60));
      const m = Math.floor((diff % (1000*60*60)) / (1000*60));
      const s = Math.floor((diff % (1000*60)) / 1000);
      text = `Event bezig – eindigt over ${h}u ${m}m ${s}s`;
      popupMsg = "Event is nu bezig!";
      showImage = true;
      timeInfo = `Eindigt: ${eventEnd.toLocaleString("nl-NL")}`;
    } else {
      // Na event
      text = "Event afgelopen";
      popupMsg = "Dit event is afgelopen.";
      showImage = false;
      timeInfo = `Gestart: ${eventStart.toLocaleString("nl-NL")}<br>Einde: ${eventEnd.toLocaleString("nl-NL")}`;
    }

    document.getElementById("countdownText").innerHTML = text;
    document.getElementById("popupMessage").innerHTML = popupMsg;
    document.getElementById("eventImage").style.display = showImage ? "block" : "none";
    document.getElementById("eventTimeInfo").innerHTML = timeInfo;
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();

  // Klik op balkje → popup tonen
  document.getElementById("eventBar").addEventListener("click", () => {
    document.getElementById("eventPopup").style.display = "block";
  });
</script>

</body>
</html>
