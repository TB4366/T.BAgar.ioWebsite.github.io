<style>

*{
margin:0;
padding:0;
box-sizing:border-box;

/* LOADING */
#loader{
position:fixed;
inset:0;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
gap:15px;
z-index:9999;
font-size:28px;
}

.spinner{
width:35px;
height:35px;
border:5px solid #1e40af;
border-top:5px solid #38bdf8;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg)}
}


/* DARK MODE */
body{

background:#020617;
color:white;
min-height:100vh;
overflow-x:hidden;

}


/* LIGHT MODE */

.light-mode{

background:#ffffff;
color:#111827;

}


/* HEADER */

header{

display:flex;
justify-content:space-between;
align-items:center;
padding:14px 30px;
background:rgba(0,0,0,.5);
backdrop-filter:blur(15px);
border-bottom:1px solid #2563eb;

}


.left{

display:flex;
align-items:center;
gap:12px;

}


.logo{

width:45px;
height:45px;
border-radius:50%;
overflow:hidden;
box-shadow:0 0 20px #38bdf8;

}

.logo img{

width:100%;
height:100%;
object-fit:cover;

}


.site-name{

font-size:22px;
font-weight:bold;
color:#38bdf8;

}



.search input{

padding:8px;
border-radius:8px;
border:none;

}


.menu-btn,
.theme-btn{

background:none;
border:none;
font-size:24px;
cursor:pointer;
color:white;

}


/* MENU */

.menu{

display:none;
position:absolute;
right:30px;
top:70px;
background:#020617;
border-radius:12px;
overflow:hidden;

}


.menu a{

display:block;
padding:14px 20px;
color:white;
text-decoration:none;

}



/* MAIN */

main{

text-align:center;
padding:40px 20px;

}


h1,h2{

color:#38bdf8;
text-shadow:0 0 20px #2563eb;

}


hr{

width:80%;
margin:35px auto;
border:1px solid #2563eb;

}



/* VIDEO SLIDER */


.slider{

max-width:500px;
margin:auto;
overflow:hidden;
border-radius:20px;

}


.slides{

display:flex;
transition:.5s;

}


.video{

min-width:100%;

}


iframe{

width:100%;
height:280px;
border:none;
border-radius:20px;

}


.slider-buttons{

margin-top:15px;

}


.slider-buttons button{

background:#2563eb;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
cursor:pointer;

}



/* SKINS */


.skins{

display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
margin:40px;

}



.skin{

width:160px;
height:160px;
border-radius:50%;
border:5px solid gold;
box-shadow:0 0 25px gold;
cursor:pointer;
overflow:hidden;

}



.skin img{

width:100%;
height:100%;
object-fit:cover;

}



/* POPUP */

#popup{

display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
justify-content:center;
align-items:center;

}


.popup-box{

background:#020617;
padding:30px;
border-radius:20px;

}


.popup-box button{

margin:10px;
padding:12px 25px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;

}



/* OPTIONS */

.options{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
max-width:1000px;
margin:auto;

}


.option{

padding:35px;
border-radius:20px;

/* SOCIAL */

margin:40px;

.social-buttons a{

color:white;
text-decoration:none;

}


.youtube{background:red;}
.instagram{background:#e1306c;}
.discord{background:#5865F2;}

<script>


/* LOADING */


setTimeout(()=>{

document.getElementById("loader").style.display="none";

},2000 + Math.random()*4000);





/* MENU */


function toggleMenu(){

let menu=document.getElementById("menu");

menu.style.display =
menu.style.display==="block"
?"none"
:"block";

}






/* THEME */


function toggleTheme(){

let body=document.body;

let btn=document.getElementById("themeBtn");


body.classList.toggle("light-mode");


if(body.classList.contains("light-mode")){

btn.textContent="🌙";

}else{

btn.textContent="☀️";

}


}








/* VIDEO SLIDER */


let index=0;

let slides=document.getElementById("slides");

let total=7;


let lastTouch=Date.now();


function showVideo(){

slides.style.transform=
"translateX(-"+index*100+"%)";

}



function nextVideo(){

index++;

if(index>=total){

index=0;

}


showVideo();

lastTouch=Date.now();

}




function prevVideo(){

index--;

if(index<0){

index=total-1;

}


showVideo();

lastTouch=Date.now();

}







/* AUTO SLIDE */


setInterval(()=>{


let now=Date.now();



if(now-lastTouch>2000){


nextVideo();


}



},2000);






/* STOP AUTO ALS VIDEO GEBRUIKT WORDT */


document.querySelectorAll("iframe").forEach(video=>{


video.addEventListener("mouseenter",()=>{

lastTouch=Date.now()+100000;

});


video.addEventListener("mouseleave",()=>{

lastTouch=Date.now();

});


});






/* POPUP */


function openPopup(){

document.getElementById("popup").style.display="flex";

}


function closePopup(){

document.getElementById("popup").style.display="none";

}





</script>
