<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>T.B Agar.io — Skin Shop</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070d18;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    height:70px;
    background:#0b1424;
    border-bottom:1px solid #17283e;
    display:flex;
    align-items:center;
    padding:0 22px;
    gap:18px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:24px;
    font-weight:800;
    color:#19bfff;
    white-space:nowrap;
}

.header-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:10px;
}

.account{
    display:none;
    align-items:center;
    gap:9px;
    background:#101d31;
    border:1px solid #1e344f;
    border-radius:10px;
    padding:7px 11px;
}

.avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#17283e;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#19bfff;
}

.account-name{
    font-weight:bold;
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.currency{
    font-size:13px;
    color:#d9e7f5;
}

.currency span{
    color:#ffd83d;
    font-weight:bold;
}

.login-buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

.login-btn{
    background:#17283e;
    color:#fff;
    border:1px solid #29425e;
    padding:9px 14px;
    border-radius:8px;
    font-weight:bold;
}

.login-btn:hover{
    background:#203650;
}

.logout-btn{
    background:#8b2430;
    color:#fff;
    padding:8px 10px;
    border-radius:7px;
    font-size:12px;
}

.menu{
    position:relative;
}

.menu-button{
    width:42px;
    height:42px;
    border-radius:9px;
    background:#101d31;
    color:#fff;
    font-size:22px;
    border:1px solid #203650;
}

.menu-dropdown{
    display:none;
    position:absolute;
    right:0;
    top:52px;
    width:190px;
    background:#0d1728;
    border:1px solid #203650;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.menu-dropdown.open{
    display:block;
}

.menu-dropdown a{
    display:block;
    color:#dce9f6;
    text-decoration:none;
    padding:13px 15px;
    font-size:14px;
}

.menu-dropdown a:hover{
    background:#14253b;
    color:#19bfff;
}

.container{
    width:min(1400px,94%);
    margin:auto;
    padding:30px 0 60px;
}

.hero{
    background:linear-gradient(135deg,#0b1628,#0c1d31);
    border:1px solid #1a3049;
    border-radius:16px;
    padding:28px;
    margin-bottom:25px;
}

.hero h1{
    margin:0 0 8px;
    font-size:31px;
}

.hero p{
    margin:0;
    color:#8fa7bd;
}

.status{
    margin-top:18px;
    padding:11px 14px;
    background:#091321;
    border:1px solid #182b42;
    border-radius:9px;
    color:#9db4ca;
    font-size:14px;
}

.status.connected{
    border-color:#1d6e55;
    color:#66e2b0;
}

.status.error{
    border-color:#74303a;
    color:#ff8e99;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:22px;
}

.search{
    flex:1;
    min-width:220px;
    background:#0d1728;
    color:#fff;
    border:1px solid #203650;
    border-radius:9px;
    padding:12px 14px;
    outline:none;
}

.search:focus{
    border-color:#19bfff;
}

.filter{
    background:#0d1728;
    color:#fff;
    border:1px solid #203650;
    padding:11px 15px;
    border-radius:9px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:16px;
}

.card{
    background:#0d1728;
    border:1px solid #1a3049;
    border-radius:13px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:#285170;
}

.skin-image{
    width:100%;
    aspect-ratio:1/1;
    background:#09111e;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.skin-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.skin-info{
    padding:13px;
}

.skin-name{
    font-weight:bold;
    margin-bottom:7px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.skin-id{
    font-size:11px;
    color:#657d94;
    margin-bottom:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.price{
    color:#ffd83d;
    font-weight:bold;
    margin-bottom:10px;
}

.buy{
    width:100%;
    padding:10px;
    background:#0d8fca;
    color:#fff;
    border-radius:8px;
    font-weight:bold;
}

.buy:hover{
    background:#12a9ed;
}

.buy:disabled{
    background:#26394c;
    color:#7890a5;
    cursor:not-allowed;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:#7289a0;
}

.loader{
    text-align:center;
    padding:50px;
    color:#8ea7bd;
}

.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    z-index:3000;
    align-items:center;
    justify-content:center;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:min(430px,92%);
    background:#0d1728;
    border:1px solid #27435e;
    border-radius:15px;
    padding:24px;
    box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.modal h2{
    margin-top:0;
}

.modal p{
    color:#91a7ba;
    line-height:1.5;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-actions button{
    flex:1;
    padding:11px;
    border-radius:8px;
    font-weight:bold;
}

.cancel{
    background:#17283e;
    color:#fff;
}

.confirm{
    background:#0d8fca;
    color:#fff;
}

@media(max-width:700px){
    header{
        padding:0 12px;
    }

    .logo{
        font-size:19px;
    }

    .account-name,
    .currency{
        display:none;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">T.B Agar.io</div>

    <div class="header-right">

        <div id="loginButtons" class="login-buttons">
            <button class="login-btn" onclick="loginWithAgar('facebook')">
                Facebook
            </button>

            <button class="login-btn" onclick="loginWithAgar('google')">
                Google
            </button>
        </div>

        <div id="accountBox" class="account">

            <div class="avatar" id="avatar">
                T
            </div>

            <div>
                <div class="account-name" id="accountName">
                    -
                </div>

                <div class="currency">
                    Coins:
                    <span id="coins">0</span>
                    &nbsp; | &nbsp;
                    DNA:
                    <span id="dna">0</span>
                </div>
            </div>

            <button class="logout-btn" onclick="logoutAgar()">
                Log out
            </button>

        </div>

        <div class="menu">

            <button class="menu-button" onclick="toggleMenu()">
                ☰
            </button>

            <div id="menuDropdown" class="menu-dropdown">
                <a href="index.html">Home</a>
                <a href="agar.io-skins.html">Agar.io Skins</a>
                <a href="paidskins.html">Paid Skins</a>
                <a href="custom-skins.html">Custom Skins</a>
                <a href="key-access.html">Key Access</a>
            </div>

        </div>

    </div>

</header>


<div class="container">

    <div class="hero">

        <h1>Paid Skins</h1>

        <p>
            Official Agar.io account-connected skin shop.
        </p>

        <div id="status" class="status">
            Agar.io connection controleren...
        </div>

    </div>


    <div class="controls">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search skins..."
            oninput="renderSkins()"
        >

        <select id="filter" class="filter" onchange="renderSkins()">
            <option value="all">All skins</option>
            <option value="paid">Paid skins</option>
            <option value="free">Free skins</option>
        </select>

    </div>


    <div id="loading" class="loader">
        Skins laden...
    </div>

    <div id="skinGrid" class="grid"></div>

</div>


<div id="modalOverlay" class="modal-overlay">

    <div class="modal">

        <h2 id="modalTitle">
            Purchase
        </h2>

        <p id="modalText">
            -
        </p>

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closePurchaseModal()">
                Cancel
            </button>

            <button
                class="confirm"
                id="confirmPurchase">
                Buy
            </button>

        </div>

    </div>

</div>


<script>

const CONFIG = {

    AGAR_ORIGIN: "https://agar.io",

    SHOP_ORIGIN: window.location.origin,

    CONFIG_API:
        "https://configs-web.agario.miniclippt.com/live/",

    VERSIONS: [
        "v15/10850",
        "v15/3032",
        "v15/3000",
        "v15/2900"
    ]

};


let account = {

    loggedIn:false,
    name:"",
    facebookId:"",
    coins:0,
    dna:0

};


let skins = [];

let agarWindow = null;

let purchaseSkin = null;

let stateTimer = null;


/* =========================
   MENU
========================= */

function toggleMenu(){

    document
        .getElementById("menuDropdown")
        .classList.toggle("open");

}


document.addEventListener("click",function(e){

    if(!e.target.closest(".menu")){

        document
            .getElementById("menuDropdown")
            .classList.remove("open");

    }

});


/* =========================
   STATUS
========================= */

function setStatus(text,type=""){

    const el =
        document.getElementById("status");

    el.textContent = text;

    el.className = "status " + type;

}


/* =========================
   ACCOUNT UI
========================= */

function renderAccount(){

    const loginButtons =
        document.getElementById("loginButtons");

    const accountBox =
        document.getElementById("accountBox");

    if(account.loggedIn){

        loginButtons.style.display = "none";

        accountBox.style.display = "flex";

        document.getElementById("accountName")
            .textContent =
            account.name || "Agar.io Player";

        document.getElementById("coins")
            .textContent =
            Number(account.coins || 0).toLocaleString();

        document.getElementById("dna")
            .textContent =
            Number(account.dna || 0).toLocaleString();

        const letter =
            (account.name || "T")
                .charAt(0)
                .toUpperCase();

        document.getElementById("avatar")
            .textContent = letter;

        setStatus(
            "Agar.io account connected.",
            "connected"
        );

    }else{

        loginButtons.style.display = "flex";

        accountBox.style.display = "none";

        setStatus(
            "Niet ingelogd. Open Agar.io en log in.",
            ""
        );

    }

}


/* =========================
   LOGIN
========================= */

function loginWithAgar(provider){

    try{

        agarWindow =
            window.open(
                "https://agar.io/",
                "TB_AGAR_LOGIN"
            );

        if(!agarWindow){

            alert(
                "Pop-up geblokkeerd. Sta pop-ups voor Agar.io toe."
            );

            return;
        }

        setStatus(
            "Agar.io wordt geopend..."
        );

        setTimeout(function(){

            try{

                agarWindow.postMessage({

                    source:"TB_AGARIO_SHOP",

                    type:"TB_REQUEST_AGAR_LOGIN",

                    provider:provider

                },"https://agar.io");

            }catch(e){}

        },1800);

        startStatePolling();

    }catch(e){

        console.error(e);

    }

}


/* =========================
   LOGOUT
========================= */

function logoutAgar(){

    if(agarWindow && !agarWindow.closed){

        try{

            agarWindow.postMessage({

                source:"TB_AGARIO_SHOP",

                type:"TB_REQUEST_AGAR_LOGOUT"

            },"https://agar.io");

        }catch(e){}

    }

    account = {

        loggedIn:false,
        name:"",
        facebookId:"",
        coins:0,
        dna:0

    };

    renderAccount();

}


/* =========================
   REQUEST STATE
========================= */

function requestAgarState(){

    if(!agarWindow || agarWindow.closed){

        return;

    }

    try{

        agarWindow.postMessage({

            source:"TB_AGARIO_SHOP",

            type:"TB_REQUEST_AGAR_STATE"

        },"https://agar.io");

    }catch(e){}

}


/* =========================
   POLLING
========================= */

function startStatePolling(){

    clearInterval(stateTimer);

    stateTimer =
        setInterval(function(){

            if(!agarWindow){

                return;

            }

            if(agarWindow.closed){

                clearInterval(stateTimer);

                account = {

                    loggedIn:false,
                    name:"",
                    facebookId:"",
                    coins:0,
                    dna:0

                };

                renderAccount();

                return;

            }

            requestAgarState();

        },1200);

}


/* =========================
   MESSAGE LISTENER
========================= */

window.addEventListener("message",function(event){

    if(event.origin !== "https://agar.io"){

        return;

    }

    const data = event.data;

    if(!data || typeof data !== "object"){

        return;

    }


    if(data.type === "TB_AGAR_STATE"){

        const state =
            data.data || {};

        account.loggedIn =
            !!state.loggedIn;

        account.name =
            state.name || "";

        account.facebookId =
            state.facebookId || "";

        account.coins =
            Number(state.coins || 0);

        account.dna =
            Number(state.dna || 0);

        renderAccount();

        return;

    }


    if(data.type === "TB_AGAR_LOGIN_RESULT"){

        if(data.success){

            setStatus(
                "Agar.io login geslaagd.",
                "connected"
            );

        }else{

            setStatus(
                data.reason ||
                "Agar.io login mislukt.",
                "error"
            );

        }

        requestAgarState();

        return;

    }


    if(data.type === "TB_AGAR_LOGOUT_RESULT"){

        account = {

            loggedIn:false,
            name:"",
            facebookId:"",
            coins:0,
            dna:0

        };

        renderAccount();

        return;

    }


    if(data.type === "TB_AGAR_PURCHASE_RESULT"){

        handlePurchaseResult(data);

        return;

    }

});


/* =========================
   PURCHASE RESULT
========================= */

function handlePurchaseResult(data){

    if(data.success){

        setStatus(
            "Aankoop door Agar.io bevestigd.",
            "connected"
        );

        closePurchaseModal();

        /*
         * Vraag direct de echte accountstatus
         * opnieuw op.
         */
        setTimeout(function(){

            requestAgarState();

            setTimeout(function(){

                requestAgarState();

            },1200);

        },700);

    }else{

        setStatus(
            data.reason ||
            "Agar.io heeft de aankoop niet bevestigd.",
            "error"
        );

        alert(
            data.reason ||
            "Aankoop niet uitgevoerd."
        );

    }

}


/* =========================
   LOAD CONFIG
========================= */

async function fetchConfig(version){

    const url =
        CONFIG.CONFIG_API +
        version +
        "/GameConfiguration.json";

    const response =
        await fetch(
            url,
            {
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "Config HTTP " +
            response.status
        );

    }

    return await response.json();

}


/* =========================
   FIND CONFIG ARRAYS
========================= */

function extractSkinArrays(config){

    const arrays = [];

    const knownKeys = [

        "Gameplay - Equippable Skins",
        "Shop - Skins",
        "Visual - Products",
        "Skins",
        "skins",
        "products",
        "Products"

    ];


    for(const key of knownKeys){

        if(Array.isArray(config[key])){

            arrays.push(config[key]);

        }

    }


    function walk(obj,depth){

        if(depth > 5 || !obj || typeof obj !== "object"){

            return;

        }

        if(Array.isArray(obj)){

            if(obj.length){

                const sample =
                    obj[0];

                if(
                    sample &&
                    typeof sample === "object" &&
                    (
                        "skinId" in sample ||
                        "productId" in sample ||
                        "id" in sample
                    )
                ){

                    arrays.push(obj);

                }

            }

            return;

        }


        for(const key of Object.keys(obj)){

            const value =
                obj[key];

            if(
                Array.isArray(value) &&
                value.length
            ){

                const sample =
                    value[0];

                if(
                    sample &&
                    typeof sample === "object" &&
                    (
                        "skinId" in sample ||
                        "productId" in sample ||
                        "id" in sample
                    )
                ){

                    arrays.push(value);

                }

            }else if(
                value &&
                typeof value === "object"
            ){

                walk(value,depth+1);

            }

        }

    }


    walk(config,0);

    return arrays;

}


/* =========================
   PRICE
========================= */

function getPrice(item){

    const candidates = [

        item.price,
        item.cost,
        item.coinPrice,
        item.coins,
        item.shopPrice,
        item.currencyAmount

    ];


    for(const value of candidates){

        if(
            typeof value === "number" &&
            Number.isFinite(value) &&
            value >= 0
        ){

            return value;

        }

        if(
            typeof value === "string" &&
            value.trim() !== "" &&
            !isNaN(Number(value))
        ){

            return Number(value);

        }

    }

    return 0;

}


/* =========================
   IMAGE
========================= */

function getImage(item){

    const candidates = [

        item.image,
        item.imageUrl,
        item.icon,
        item.iconUrl,
        item.thumbnail,
        item.url,
        item.assetUrl

    ];

    for(const value of candidates){

        if(
            typeof value === "string" &&
            value.trim()
        ){

            return value;

        }

    }

    return "";

}


/* =========================
   PARSE SKINS
========================= */

function parseSkins(arrays){

    const map =
        new Map();


    for(const array of arrays){

        for(const item of array){

            if(
                !item ||
                typeof item !== "object"
            ){

                continue;

            }


            const id =
                item.productId ??
                item.skinId ??
                item.id ??
                item.key;


            if(
                id === undefined ||
                id === null
            ){

                continue;

            }


            const name =
                item.name ??
                item.displayName ??
                item.title ??
                ("Skin " + id);


            const price =
                getPrice(item);


            const image =
                getImage(item);


            const paid =
                price > 0;


            const skin = {

                id:String(id),

                name:String(name),

                price:price,

                image:image,

                paid:paid,

                raw:item

            };


            if(!map.has(String(id))){

                map.set(
                    String(id),
                    skin
                );

            }

        }

    }


    return Array.from(map.values());

}


/* =========================
   LOAD SKINS
========================= */

async function loadSkins(){

    const loading =
        document.getElementById("loading");

    loading.style.display = "block";

    loading.textContent =
        "Agar.io skins laden...";


    let found = [];


    for(const version of CONFIG.VERSIONS){

        try{

            const config =
                await fetchConfig(version);

            const arrays =
                extractSkinArrays(config);

            const parsed =
                parseSkins(arrays);


            if(parsed.length){

                found = parsed;

                console.log(
                    "T.B Agar.io: skins loaded from",
                    version,
                    parsed.length
                );

                break;

            }

        }catch(error){

            console.warn(
                "Version failed:",
                version,
                error
            );

        }

    }


    skins = found;


    loading.style.display = "none";


    if(!skins.length){

        document.getElementById("skinGrid")
            .innerHTML =
            `<div class="empty">
                Geen skin-configuratie gevonden.
                <br><br>
                Controleer de actuele Agar.io-configuratieversie.
            </div>`;

        return;

    }


    renderSkins();

}


/* =========================
   RENDER
========================= */

function renderSkins(){

    const grid =
        document.getElementById("skinGrid");

    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const filter =
        document.getElementById("filter")
            .value;


    const filtered =
        skins.filter(function(skin){

            const matchesSearch =
                skin.name
                    .toLowerCase()
                    .includes(search) ||
                skin.id
                    .toLowerCase()
                    .includes(search);


            const matchesFilter =
                filter === "all" ||
                (filter === "paid" && skin.paid) ||
                (filter === "free" && !skin.paid);


            return matchesSearch &&
                   matchesFilter;

        });


    if(!filtered.length){

        grid.innerHTML =
            `<div class="empty">
                Geen skins gevonden.
            </div>`;

        return;

    }


    grid.innerHTML =
        filtered.map(function(skin){

            const image =
                skin.image
                ? `<img
                    src="${escapeHtml(skin.image)}"
                    loading="lazy"
                    onerror="this.style.display='none'"
                   >`
                : "";


            const price =
                skin.paid
                ? `🪙 ${skin.price.toLocaleString()}`
                : "Free";


            const disabled =
                !account.loggedIn ||
                !skin.paid;


            return `

                <div class="card">

                    <div class="skin-image">
                        ${image}
                    </div>

                    <div class="skin-info">

                        <div class="skin-name">
                            ${escapeHtml(skin.name)}
                        </div>

                        <div class="skin-id">
                            ID: ${escapeHtml(skin.id)}
                        </div>

                        <div class="price">
                            ${price}
                        </div>

                        <button
                            class="buy"
                            ${disabled ? "disabled" : ""}
                            onclick="openPurchaseModal('${escapeJs(skin.id)}')"
                        >
                            ${
                                !account.loggedIn
                                ? "Login first"
                                : !skin.paid
                                ? "Free"
                                : "Buy with Coins"
                            }
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   PURCHASE MODAL
========================= */

function openPurchaseModal(id){

    if(!account.loggedIn){

        alert(
            "Log eerst in via Agar.io."
        );

        return;

    }


    const skin =
        skins.find(
            s => s.id === String(id)
        );


    if(!skin){

        return;

    }


    if(!skin.paid){

        alert(
            "Deze skin heeft geen betaalde Coins-prijs."
        );

        return;

    }


    if(
        Number(account.coins) <
        Number(skin.price)
    ){

        alert(
            "Je hebt niet genoeg echte Agar.io Coins."
        );

        return;

    }


    purchaseSkin =
        skin;


    document.getElementById("modalTitle")
        .textContent =
        "Buy " + skin.name;


    document.getElementById("modalText")
        .textContent =
        "Je koopt " +
        skin.name +
        " voor " +
        skin.price.toLocaleString() +
        " Coins. De aankoop wordt via Agar.io uitgevoerd. De website trekt zelf geen Coins af.";


    document.getElementById("modalOverlay")
        .classList.add("show");


    document.getElementById("confirmPurchase")
        .onclick =
        confirmPurchase;

}


function closePurchaseModal(){

    document.getElementById("modalOverlay")
        .classList.remove("show");

    purchaseSkin = null;

}


/* =========================
   CONFIRM PURCHASE
========================= */

function confirmPurchase(){

    if(!purchaseSkin){

        return;

    }


    if(!agarWindow || agarWindow.closed){

        alert(
            "Agar.io moet geopend en ingelogd zijn."
        );

        return;

    }


    if(
        account.coins <
        purchaseSkin.price
    ){

        alert(
            "Niet genoeg Coins."
        );

        return;

    }


    setStatus(
        "Agar.io aankoop starten..."
    );


    try{

        agarWindow.postMessage({

            source:"TB_AGARIO_SHOP",

            type:"TB_REQUEST_AGAR_PURCHASE",

            productId:
                purchaseSkin.id,

            skinName:
                purchaseSkin.name,

            price:
                purchaseSkin.price

        },"https://agar.io");


    }catch(error){

        console.error(error);

        setStatus(
            "Aankoop kon niet naar Agar.io worden gestuurd.",
            "error"
        );

    }

}


/* =========================
   ESCAPE HELPERS
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJs(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}

   START
========================= */

renderAccount();

loadSkins();

startStatePolling();
