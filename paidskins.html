<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T.B Agar.io Skin Shop</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#f5f5f5;font-family:Arial;}

.skin{text-align:center;position:relative;}
.circle{width:90px;height:90px;border-radius:100%;object-fit:cover;margin:auto;}
.badge{position:absolute;top:6px;left:6px;background:red;color:white;font-size:11px;padding:4px 8px;border-radius:5px;}

.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
backdrop-filter: blur(5px);
}

.hidden{display:none;}

/* CART */
.cartItem{
display:flex;
justify-content:space-between;
margin-bottom:6px;
}

/* RECEIPT */
#receipt{
background:white;
width:350px;
padding:20px;
border-radius:10px;
text-align:center;
}

.line{border-top:1px solid #000;margin:10px 0;}
.small{font-size:12px;color:#555;}
</style>
</head>

<body>

<header class="bg-black text-white p-4 flex justify-between">
<h1 class="font-bold">T.B Agar.io Skin Shop</h1>

<button onclick="openCart()" class="bg-teal-500 px-4 py-2 rounded">
Cart (<span id="cartCount">0</span>)
</button>
</header>

<!-- SKINS -->
<div id="grid" class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 p-6"></div>

<!-- CART -->
<div id="cartModal" class="modal hidden">
<div class="bg-white p-6 rounded w-96">

<h2 class="text-xl font-bold mb-3">Cart</h2>

<div id="cartItems"></div>

<div class="mt-3 font-bold">
Total: <span id="cartTotal">$0</span>
</div>

<button onclick="checkout()" class="w-full mt-4 bg-green-600 text-white py-2 rounded">
Checkout
</button>

<button onclick="closeCart()" class="w-full mt-2 bg-gray-300 py-2 rounded">
Close
</button>

</div>
</div>

<!-- RECEIPT -->
<div id="receiptModal" class="modal hidden">
<div id="receipt">

<h2 class="font-bold text-lg">T.B Agar.io</h2>
<div class="line"></div>

<h3 class="font-bold">Skin Shop</h3>

<div class="line"></div>

<p class="font-bold">INSTRUCTIONS</p>
<p class="small">1. Save this receipt and copy the ID</p>
<p class="small">2. Contact Instagram @t.bagar.io or @tbagariosupportteam</p>

<div class="line"></div>

<div id="receiptItems"></div>

<div class="line"></div>

<p>Discount: -€<span id="discountTotal">0</span></p>
<p class="font-bold">TOTAL: €<span id="finalTotal">0</span></p>

<div class="line"></div>

<p class="small">Receipt ID:</p>
<p id="receiptId" class="font-bold"></p>

<button onclick="copyID()" class="mt-3 bg-black text-white px-3 py-2 rounded">
Copy ID
</button>

<button onclick="closeReceipt()" class="mt-2 bg-gray-300 px-3 py-2 rounded w-full">
Close
</button>

</div>
</div>

<script>

// ================= SKINS =================
const skins=[
{ name:"Scar", price:2.89, image:"IMG_7141.webp", discount:25 },
{ name:"Bull King", price:4.29, image:"IMG_7147.webp", discount:15 },
{ name:"Evil master", price:11.49, image:"IMG_5443.webp", discount:10 },
{ name:"Shuriken", price:6.99, image:"IMG_7177.webp", discount:5 },
{ name:"Gryphon", price:6.49, image:"IMG_7468.webp", discount:10 },
{ name:"Ice Crystal", price:7.89, image:"IMG_5938.webp", discount:0 },
{ name:"Sorceress", price:7.99, image:"IMG_7225.webp", discount:0 },
{ name:"Cursed Skull", price:8.49, image:"IMG_6198.webp", discount:0 },
{ name:"Silver Orb", price:4.99, image:"IMG_6199.webp", discount:0 },
{ name:"Dark wings", price:21.99, image:"IMG_7233.webp", discount:0 }
]

// ================= CART =================
let cart=[]

// ================= RENDER SKINS =================
const grid=document.getElementById("grid")

function renderSkins(){
grid.innerHTML=""

skins.forEach((s,i)=>{
let price=(s.price*(100-s.discount)/100).toFixed(2)

grid.innerHTML+=`
<div class="bg-white p-4 rounded shadow skin">
${s.discount>0?`<div class="badge">-${s.discount}%</div>`:''}
<img src="${s.image}" class="circle">
<h3 class="font-bold mt-2">${s.name}</h3>
<p>$${price}</p>

<button onclick="addCart(${i})"
class="bg-green-600 text-white px-3 py-1 mt-2 rounded">
Add
</button>

</div>`
})
}

renderSkins()

// ================= CART SYSTEM =================
function openCart(){
document.getElementById("cartModal").classList.remove("hidden")
updateCart()
}

function closeCart(){
document.getElementById("cartModal").classList.add("hidden")
}

function addCart(i){
cart.push(i)
updateCart()
document.getElementById("cartCount").innerText=cart.length
}

function removeItem(index){
cart.splice(index,1)
updateCart()
document.getElementById("cartCount").innerText=cart.length
}

function updateCart(){
let box=document.getElementById("cartItems")
box.innerHTML=""

let total=0

cart.forEach((i,idx)=>{
let s=skins[i]
let price=s.price*(100-s.discount)/100
total+=price

box.innerHTML+=`
<div class="cartItem">
<span>${s.name}</span>
<span>$${price.toFixed(2)}</span>
<button onclick="removeItem(${idx})">❌</button>
</div>
`
})

document.getElementById("cartTotal").innerText="$"+total.toFixed(2)
}

// ================= CHECKOUT =================
function checkout(){
let receiptId="TB-"+Math.floor(Math.random()*99999999)

let discount=0
let total=0

let itemsBox=document.getElementById("receiptItems")
itemsBox.innerHTML=""

cart.forEach(i=>{
let s=skins[i]
let original=s.price
let final=s.price*(100-s.discount)/100

discount+=original-final
total+=final

itemsBox.innerHTML+=`
<p>${s.name} - €${final.toFixed(2)}</p>
`
})

document.getElementById("discountTotal").innerText=discount.toFixed(2)
document.getElementById("finalTotal").innerText=total.toFixed(2)
document.getElementById("receiptId").innerText=receiptId

document.getElementById("cartModal").classList.add("hidden")
document.getElementById("receiptModal").classList.remove("hidden")

cart=[]
document.getElementById("cartCount").innerText=0
}

// ================= RECEIPT =================
function closeReceipt(){
document.getElementById("receiptModal").classList.add("hidden")
}

function copyID(){
let id=document.getElementById("receiptId").innerText
navigator.clipboard.writeText(id)
alert("Receipt ID copied ✔")
}

</script>

</body>
</html>
