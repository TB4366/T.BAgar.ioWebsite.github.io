<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.B Agar.io Paid Skins</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>

<style>
.card-img{width:120px;height:120px;border-radius:9999px;object-fit:cover}
.small-img{width:90px;height:90px;border-radius:9999px;object-fit:cover}
.imgs-row{display:flex;gap:10px;justify-content:center}
.cart-badge{position:absolute;top:-6px;right:-6px;background:red;color:white;border-radius:9999px;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center}
</style>
</head>

<body class="bg-gray-100">

<!-- NAVBAR -->
<header class="bg-gray-900 text-white">
  <div class="max-w-6xl mx-auto p-4 flex items-center gap-4">
    <div class="flex items-center gap-3">
      <img src="https://via.placeholder.com/40?text=TB" class="rounded-full">
      <span class="font-bold text-lg" data-i18n="title">T.B Agar.io Paid Skins</span>
    </div>

    <input id="search" class="flex-1 px-3 py-2 rounded text-black" placeholder="Search skins...">

    <select id="lang" class="text-black px-2 py-2 rounded">
      <option value="en">English</option>
      <option value="nl">Nederlands</option>
    </select>

    <button id="cartBtn" class="relative bg-teal-500 px-4 py-2 rounded flex items-center gap-2">
      <i data-feather="shopping-cart"></i>
      <span data-i18n="cart">Cart</span>
      <span id="cartCount" class="cart-badge">0</span>
    </button>
  </div>
</header>

<!-- SORT -->
<div class="max-w-6xl mx-auto p-4">
  <select id="sort" class="px-3 py-2 rounded border">
    <option value="default">General</option>
    <option value="low">Low → High</option>
    <option value="high">High → Low</option>
    <option value="popular">Popular</option>
    <option value="shuffle">Shuffle</option>
  </select>
</div>

<!-- GRID -->
<main class="max-w-6xl mx-auto p-6">
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
</main>

<!-- CART MODAL -->
<div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white rounded w-full max-w-xl p-6 relative">
    <button id="closeCart" class="absolute right-4 top-2 text-2xl">&times;</button>
    <h2 class="text-2xl font-bold text-center mb-4" data-i18n="cart">Cart</h2>
    <div id="cartItems" class="space-y-3"></div>
    <hr class="my-4">
    <div class="flex justify-between font-bold text-lg">
      <span data-i18n="total">Total</span>
      <span id="total">$0.00</span>
    </div>
    <a id="paypal" target="_blank" class="block mt-4 bg-yellow-400 text-center py-3 rounded font-bold">
      PayPal
    </a>
  </div>
</div>

<!-- TEMPLATE -->
<template id="card">
  <div class="bg-white p-4 rounded shadow text-center">
    <div class="imgs-row"></div>
    <h3 class="font-bold mt-3 title"></h3>
    <p class="text-sm text-gray-600 desc"></p>
    <p class="font-semibold price mt-2"></p>
    <div class="flex justify-center gap-3 mt-3">
      <button class="share bg-blue-500 text-white px-3 py-2 rounded">Share</button>
      <button class="select bg-green-600 text-white px-3 py-2 rounded">Select</button>
    </div>
  </div>
</template>

];

let cart=JSON.parse(localStorage.getItem("cart")||"[]");
const grid=document.getElementById("grid");

function render(list){
 grid.innerHTML="";
 list.forEach(s=>{
  if(!s.image1 && !s.image2) return;
  const c=document.getElementById("card").content.cloneNode(true);
  const imgs=c.querySelector(".imgs-row");
  if(s.image1){let i=document.createElement("img");i.src=s.image1;i.className=s.image2?"small-img":"card-img";imgs.appendChild(i);}
  if(s.image2){let i=document.createElement("img");i.src=s.image2;i.className="small-img";imgs.appendChild(i);}
  c.querySelector(".title").textContent=s.name.en;
  c.querySelector(".desc").textContent=s.desc.en;
  c.querySelector(".price").textContent="$"+s.price;
  c.querySelector(".select").onclick=()=>{cart.push(s);localStorage.setItem("cart",JSON.stringify(cart));document.getElementById("cartCount").textContent=cart.length};
  grid.appendChild(c);
 });
}

render(skins);
document.getElementById("cartCount").textContent=cart.length;
</script>
</body>
</html>
