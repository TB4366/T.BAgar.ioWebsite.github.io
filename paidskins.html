<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>T.B Agar.io - Skin Shop</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070b14;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    height:72px;
    background:#0b1220;
    border-bottom:1px solid #1d2a40;
    display:flex;
    align-items:center;
    padding:0 25px;
    gap:20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:24px;
    font-weight:900;
    color:#28b8ff;
    white-space:nowrap;
}

.spacer{
    flex:1;
}

.account-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.coins-box,
.dna-box{
    background:#101b2d;
    border:1px solid #223553;
    border-radius:10px;
    padding:9px 13px;
    font-weight:bold;
}

.coins{
    color:#ffd84d;
}

.dna{
    color:#61d5ff;
}

.login-btn,
.logout-btn{
    border:0;
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:bold;
}

.login-btn{
    background:#168dcc;
    color:white;
}

.logout-btn{
    background:#b72828;
    color:white;
}

.account-card{
    display:none;
    align-items:center;
    gap:8px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#172941;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#55caff;
    font-weight:bold;
}

.account-name{
    font-weight:bold;
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
}

.container{
    max-width:1450px;
    margin:auto;
    padding:30px 20px 60px;
}

.hero{
    background:linear-gradient(
        135deg,
        #0d1829,
        #09101c
    );

    border:1px solid #1c2d47;
    border-radius:18px;
    padding:30px;
    margin-bottom:25px;
}

.hero h1{
    margin:0 0 10px;
    font-size:34px;
}

.hero p{
    color:#9fb1c9;
    margin:0;
}

.tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.tab{
    border:1px solid #243653;
    background:#101a2b;
    color:#c8d5e6;
    border-radius:10px;
    padding:11px 18px;
    font-weight:bold;
    cursor:pointer;
}

.tab.active{
    background:#138dcc;
    border-color:#20b7ff;
    color:#fff;
}

.status{
    background:#0d1727;
    border:1px solid #20334e;
    border-radius:10px;
    padding:13px 16px;
    margin-bottom:20px;
    color:#a9bad0;
}

.skin-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
}

.skin-card{
    background:#0d1625;
    border:1px solid #20324c;
    border-radius:15px;
    overflow:hidden;
    transition:.2s;
}

.skin-card:hover{
    transform:translateY(-3px);
    border-color:#1bb7ff;
}

.skin-image-wrap{
    width:100%;
    aspect-ratio:1/1;
    background:#080d15;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.skin-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.skin-placeholder{
    color:#53657d;
    font-size:13px;
    text-align:center;
    padding:15px;
}

.skin-info{
    padding:14px;
}

.skin-name{
    font-size:16px;
    font-weight:800;
    margin-bottom:8px;
    min-height:38px;
    word-break:break-word;
}

.price{
    color:#ffd84d;
    font-weight:bold;
    margin-bottom:12px;
}

.buy-btn{
    width:100%;
    padding:11px;
    border:0;
    border-radius:9px;
    background:#118dcc;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.buy-btn:hover{
    background:#17aaf0;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    color:#74869e;
}

.loading{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    color:#7f94ae;
}

.spinner{
    width:38px;
    height:38px;
    border:4px solid #1e334e;
    border-top-color:#20b7ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:5000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:450px;
    background:#0d1727;
    border:1px solid #29415f;
    border-radius:18px;
    padding:25px;
}

.modal-box h2{
    margin-top:0;
}

.modal-buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.modal-buttons button{
    border:0;
    padding:13px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.facebook{
    background:#1877f2;
    color:#fff;
}

.google{
    background:#fff;
    color:#222;
}

.cancel{
    background:#26364d;
    color:#fff;
}

.notice{
    color:#ffcf5a;
    font-size:13px;
    line-height:1.5;
}

@media(max-width:800px){

    header{
        padding:0 12px;
    }

    .coins-box,
    .dna-box{
        display:none;
    }

    .account-name{
        display:none;
    }

    .hero h1{
        font-size:27px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        T.B Agar.io
    </div>

    <div class="spacer"></div>

    <div class="account-area">

        <div class="coins-box">
            🪙 <span id="coins">0</span>
        </div>

        <div class="account-card" id="accountCard">

            <div class="avatar" id="avatar">

            </div>

            </div>

            id="loginButton">

        <button

            id="logoutButton"

        </button>

    </div>

</header>


<div class="container">

    <section class="hero">

        <h1>
            Agar.io Skin Shop
        </h1>

        <p>
            Bekijk alle beschikbare Agar.io skins en hun Coins-prijs.
        </p>

    </section>


    <div class="tabs">

        <button
            class="tab active"
            data-tab="paid">

        </button>

            data-tab="all">

        id="status">
        Skins laden...
    </div>


    <div
        class="skin-grid"
        id="skinGrid">

            <div class="spinner"></div>

            Agar.io skins laden...

</div>


<!-- LOGIN -->

<div
    class="modal"
    id="loginModal">

    <div class="modal-box">

        <h2>
            Log in met Agar.io
        </h2>

        <p>
            Kies hoe je op Agar.io wilt inloggen.
        </p>

        <div class="modal-buttons">

            <button
                class="facebook"
                onclick="loginWithAgar('facebook')">

                Log in with Facebook

            </button>

            <button
                class="google"
                onclick="loginWithAgar('google')">

                Log in with Google

            </button>

            <button
                class="cancel"
                onclick="closeLoginModal()">

                Cancel

            </button>

        </div>

        <p class="notice">

            Je wachtwoord wordt niet door deze website gevraagd.
            De login gebeurt op Agar.io.

        </p>

    </div>

</div>


<script>

/* =========================================================
   T.B AGAR.IO SHOP
   ========================================================= */

const CONFIG = {

    AGAR_ORIGIN:
        "https://agar.io",

    AGAR_URL:
        "https://agar.io/",

    CONFIG_API:
        "https://configs-web.agario.miniclippt.com/live/",

    /*
       Zet hier andere versies bovenaan als je wilt.
       De eerste werkende config wordt gebruikt.
    */

    VERSIONS: [

        "v15/3032",

        "v15/10850",

        "v15/3000",

        "v15/2900"

    ]

};


let account = {

    loggedIn:false,

    name:"Guest",

    facebookId:"",

    coins:0,

    dna:0

};


let agarWindow = null;

let allSkins = [];

let paidSkins = [];

let currentTab = "paid";

let activeVersion = "";


/* =========================================================
   ELEMENTS
   ========================================================= */

const skinGrid =
    document.getElementById("skinGrid");

const statusElement =
    document.getElementById("status");

const coinsElement =
    document.getElementById("coins");

const dnaElement =
    document.getElementById("dna");

const accountCard =
    document.getElementById("accountCard");

const accountNameElement =
    document.getElementById("accountName");

const avatarElement =
    document.getElementById("avatar");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const loginModal =
    document.getElementById("loginModal");


/* =========================================================
   LOGIN
   ========================================================= */

loginButton.addEventListener(
    "click",
    () => {

        loginModal.classList.add("show");

    }
);


function closeLoginModal(){

    loginModal.classList.remove("show");

}


function loginWithAgar(provider){

    closeLoginModal();

    statusElement.textContent =
        "Agar.io openen...";

    agarWindow =
        window.open(
            CONFIG.AGAR_URL,
            "TB_AGAR_LOGIN",
            "width=1200,height=800"
        );


    if(!agarWindow){

        statusElement.textContent =
            "Popup geblokkeerd. Sta popups toe.";

        return;

    }


    setTimeout(
        () => {

            sendToAgar({

                type:
                    "TB_REQUEST_AGAR_LOGIN",

                provider:
                    provider

            });

        },
        1500
    );

}


/* =========================================================
   SEND TO AGAR
   ========================================================= */

function sendToAgar(data){

    if(
        !agarWindow ||
        agarWindow.closed
    ){

        return;

    }


    agarWindow.postMessage(

        {

            source:
                "TB_AGARIO_SHOP",

            ...data

        },

        CONFIG.AGAR_ORIGIN

    );

}


/* =========================================================
   ACCOUNT STATE
   ========================================================= */

function requestAccountState(){

    sendToAgar({

        type:
            "TB_REQUEST_AGAR_STATE"

    });

}


window.addEventListener(
    "message",
    event => {

        if(
            event.origin !==
            CONFIG.AGAR_ORIGIN
        ){

            return;

        }


        const data =
            event.data;


        if(!data){

            return;

        }


        if(
            data.type ===
            "TB_AGAR_STATE"
        ){

            applyAccountState(
                data.data || {}
            );

            return;

        }


        if(
            data.type ===
            "TB_AGAR_LOGIN_RESULT"
        ){

            applyAccountState({

                loggedIn:
                    data.loggedIn,

                name:
                    data.name,

                facebookId:
                    data.facebookId,

                coins:
                    data.coins,

                dna:
                    data.dna

            });

            return;

        }


        if(
            data.type ===
            "TB_AGAR_PURCHASE_RESULT"
        ){

            if(data.success){

                statusElement.textContent =
                    "Aankoop succesvol verwerkt.";

            }else{

                statusElement.textContent =
                    data.reason ||
                    "Aankoop niet uitgevoerd.";

            }

        }

    }
);


/* =========================================================
   ACCOUNT
   ========================================================= */

function applyAccountState(data){

    account.loggedIn =
        Boolean(data.loggedIn);

    account.name =
        data.name || "Guest";

    account.facebookId =
        data.facebookId || "";

    account.coins =
        Number(data.coins) || 0;

    account.dna =
        Number(data.dna) || 0;


    updateAccountUI();


    if(account.loggedIn){

        statusElement.textContent =
            "Ingelogd als " +
            account.name;

    }

}


function updateAccountUI(){

    coinsElement.textContent =
        account.coins.toLocaleString();

    dnaElement.textContent =
        account.dna.toLocaleString();

    accountNameElement.textContent =
        account.name;

    avatarElement.textContent =
        account.name
        .charAt(0)
        .toUpperCase();


    if(account.loggedIn){

        accountCard.style.display =
            "flex";

        loginButton.style.display =
            "none";

        logoutButton.style.display =
            "block";

    }else{

        accountCard.style.display =
            "none";

        loginButton.style.display =
            "block";

        logoutButton.style.display =
            "none";

    }

}


/* =========================================================
   LOGOUT
   ========================================================= */

logoutButton.addEventListener(
    "click",
    () => {

        sendToAgar({

            type:
                "TB_REQUEST_AGAR_LOGOUT"

        });

    }
);


/* =========================================================
   CONFIG FETCH
   ========================================================= */

async function fetchConfig(version){

    const url =
        CONFIG.CONFIG_API +
        version +
        "/GameConfiguration.json";


    console.log(
        "[T.B] Loading:",
        url
    );


    const response =
        await fetch(
            url,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    return await response.json();

}


/* =========================================================
   FIND GAME CONFIG
   ========================================================= */

function getGameConfig(config){

    /*
       Sommige configs:

       {
          gameConfig:{
             "Gameplay - Equippable Skins":[]
          }
       }

       Andere configs kunnen de arrays direct bevatten.
    */

    if(
        config &&
        config.gameConfig
    ){

        return config.gameConfig;

    }


    if(
        config &&
        config.GameConfiguration
    ){

        return config.GameConfiguration;

    }


    return config || {};

}


/* =========================================================
   IMAGE URL
   ========================================================= */

function createSkinImageUrl(
    image,
    baseUrl
){

    if(!image){

        return "";

    }


    let value =
        String(image).trim();


    if(!value){

        return "";

    }


    /*
       Absolute URL
    */

    if(
        value.startsWith("https://") ||
        value.startsWith("http://")
    ){

        return value;

    }


    /*
       Remove ./ or /
    */

    value =
        value.replace(
            /^\.?\//,
            ""
        );


    /*
       Agar.io configs commonly contain
       a normal image name.

       Try high-resolution variant.
    */

    if(
        /\.(png|jpg|jpeg|webp)$/i.test(value)
    ){

        const hi =
            value.replace(
                /\.(png|jpg|jpeg|webp)$/i,
                "_hi.png"
            );


        return [
            baseUrl + hi,
            baseUrl + value
        ];

    }


    return [
        baseUrl + value
    ];

}


/* =========================================================
   NORMALIZE IMAGE
   ========================================================= */

function normalizeImageResult(
    imageResult
){

    if(
        Array.isArray(imageResult)
    ){

        return imageResult;

    }


    if(imageResult){

        return [
            imageResult
        ];

    }


    return [];

}


/* =========================================================
   PARSE SKIN ARRAYS
   ========================================================= */

function extractSkinArrays(
    gameConfig
){

    const arrays = [];


    const knownKeys = [

        "Gameplay - Equippable Skins",

        "Shop - Skins",

        "Visual - Products",

        "Skins",

        "skins",

        "products",

        "Products"

    ];


    for(
        const key of knownKeys
    ){

        if(
            Array.isArray(
                gameConfig[key]
            )
        ){

            arrays.push(
                gameConfig[key]
            );

        }

    }


    /*
       Search all direct arrays.
    */

    for(
        const key of Object.keys(
            gameConfig || {}
        )
    ){

        if(
            Array.isArray(
                gameConfig[key]
            )
        ){

            arrays.push(
                gameConfig[key]
            );

        }

    }


    /*
       Search one nested object.
    */

    for(
        const key of Object.keys(
            gameConfig || {}
        )
    ){

        const value =
            gameConfig[key];


        if(
            value &&
            typeof value === "object" &&
            !Array.isArray(value)
        ){

            for(
                const nestedKey of Object.keys(value)
            ){

                if(
                    Array.isArray(
                        value[nestedKey]
                    )
                ){

                    arrays.push(
                        value[nestedKey]
                    );

                }

            }

        }

    }


    return arrays;

}


/* =========================================================
   PARSE SKINS
   ========================================================= */

function parseSkins(
    config,
    version
){

    const gameConfig =
        getGameConfig(config);


    const arrays =
        extractSkinArrays(
            gameConfig
        );


    const skins =
        new Map();


    const imageBase =
        CONFIG.CONFIG_API +
        version +
        "/";


    /*
       SHOP PRICE MAP
    */

    const priceMap =
        new Map();


    for(
        const array of arrays
    ){

        for(
            const item of array
        ){

            if(!item){

                continue;

            }


            const productId =
                item.productId ??
                item.productID ??
                item.id ??
                item.skinId ??
                item.skinID;


            if(
                productId === null ||
                productId === undefined
            ){

                continue;

            }


            const id =
                String(productId);


            const price =
                Number(
                    item.price ??
                    item.cost ??
                    item.coinPrice ??
                    item.coins ??
                    item.shopPrice ??
                    0
                );


            if(price > 0){

                priceMap.set(
                    id,
                    price
                );

            }

        }

    }


    /*
       CREATE FINAL SKINS
    */

    for(
        const array of arrays
    ){

        for(
            const item of array
        ){

            if(!item){

                continue;

            }


            const productId =
                item.productId ??
                item.productID ??
                item.id ??
                item.skinId ??
                item.skinID;


            if(
                productId === null ||
                productId === undefined
            ){

                continue;

            }


            const id =
                String(productId);


            if(skins.has(id)){

                /*
                   Update price if a shop entry
                   has the price.
                */

                const existing =
                    skins.get(id);


                const shopPrice =
                    priceMap.get(id);


                if(
                    shopPrice &&
                    shopPrice > 0
                ){

                    existing.price =
                        shopPrice;

                }


                continue;

            }


            const name =
                item.name ||
                item.displayName ||
                item.title ||
                item.label ||
                id;


            const rawImage =
                item.image ||
                item.imageUrl ||
                item.imageURL ||
                item.icon ||
                item.iconUrl ||
                item.texture ||
                item.textureUrl ||
                item.url ||
                "";


            const imageUrls =
                normalizeImageResult(
                    createSkinImageUrl(
                        rawImage,
                        imageBase
                    )
                );


            let price =
                Number(
                    item.price ??
                    item.cost ??
                    item.coinPrice ??
                    item.coins ??
                    item.shopPrice ??
                    0
                );


            if(
                price <= 0 &&
                priceMap.has(id)
            ){

                price =
                    priceMap.get(id);

            }


            skins.set(
                id,
                {

                    id:id,

                    productId:id,

                    name:String(name),

                    price:price,

                    imageUrls:imageUrls,

                    image:
                        imageUrls[0] || "",

                    version:version

                }
            );

        }

    }


    return Array.from(
        skins.values()
    );

}


/* =========================================================
   LOAD SKINS
   ========================================================= */

async function loadSkins(){

    skinGrid.innerHTML = `
        <div class="loading">

            <div class="spinner"></div>

            Agar.io skins laden...

        </div>
    `;


    statusElement.textContent =
        "Agar.io skinconfig zoeken...";


    let loadedConfig =
        null;


    let usedVersion =
        "";


    for(
        const version of CONFIG.VERSIONS
    ){

        try{

            statusElement.textContent =
                "Skinconfig laden: " +
                version;


            const config =
                await fetchConfig(
                    version
                );


            const gameConfig =
                getGameConfig(
                    config
                );


            const arrays =
                extractSkinArrays(
                    gameConfig
                );


            const count =
                arrays.reduce(
                    (
                        total,
                        array
                    ) =>
                        total +
                        array.length,
                    0
                );


            console.log(
                "[T.B] Config",
                version,
                "skin entries:",
                count
            );


            if(count > 0){

                loadedConfig =
                    config;

                usedVersion =
                    version;

                break;

            }

        }catch(error){

            console.warn(
                "[T.B] Version failed:",
                version,
                error
            );

        }

    }


    if(!loadedConfig){

        skinGrid.innerHTML = `
            <div class="empty">

                <h2>
                    Skins konden niet worden geladen
                </h2>

                <p>
                    De Agar.io GameConfiguration kon
                    niet worden gevonden.
                </p>

                <p>
                    Controleer of de gebruikte
                    Agar.io-configversie nog bestaat.
                </p>

            </div>
        `;

        statusElement.textContent =
            "Agar.io config niet beschikbaar.";

        return;

    }


    activeVersion =
        usedVersion;


    allSkins =
        parseSkins(
            loadedConfig,
            activeVersion
        );


    paidSkins =
        allSkins.filter(
            skin =>
                Number(skin.price) > 0
        );


    console.log(
        "[T.B] Total skins:",
        allSkins.length
    );


    console.log(
        "[T.B] Paid skins:",
        paidSkins.length
    );


    statusElement.textContent =
        allSkins.length +
        " skins geladen • " +
        paidSkins.length +
        " betaalde skins • " +
        activeVersion;


    renderCurrentSkins();

}


/* =========================================================
   IMAGE LOADING
   ========================================================= */

function loadSkinImage(
    img,
    urls,
    placeholder
){

    if(!urls.length){

        img.style.display =
            "none";

        placeholder.style.display =
            "block";

        return;

    }


    let index = 0;


    function tryNext(){

        if(
            index >= urls.length
        ){

            img.style.display =
                "none";

            placeholder.style.display =
                "block";

            return;

        }


        const url =
            urls[index++];


        img.onload = () => {

            img.style.display =
                "block";

            placeholder.style.display =
                "none";

        };


        img.onerror = () => {

            tryNext();

        };


        img.src =
            url;

    }


    tryNext();

}


/* =========================================================
   RENDER
   ========================================================= */

function renderCurrentSkins(){

    if(currentTab === "paid"){

        renderSkins(
            paidSkins
        );

    }else{

        renderSkins(
            allSkins
        );

    }

}


function renderSkins(
    skins
){

    skinGrid.innerHTML = "";


    if(!skins.length){

        skinGrid.innerHTML = `
            <div class="empty">
                Geen skins gevonden.
            </div>
        `;

        return;

    }


    for(
        const skin of skins
    ){

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "skin-card";


        const imageWrap =
            document.createElement(
                "div"
            );

        imageWrap.className =
            "skin-image-wrap";


        const img =
            document.createElement(
                "img"
            );

        img.className =
            "skin-image";

        img.alt =
            skin.name;

        img.loading =
            "lazy";


        const placeholder =
            document.createElement(
                "div"
            );

        placeholder.className =
            "skin-placeholder";

        placeholder.textContent =
            "Skin image unavailable";


        imageWrap.appendChild(
            img
        );

        imageWrap.appendChild(
            placeholder
        );


        loadSkinImage(
            img,
            skin.imageUrls,
            placeholder
        );


        const info =
            document.createElement(
                "div"
            );

        info.className =
            "skin-info";


        const name =
            document.createElement(
                "div"
            );

        name.className =
            "skin-name";

        name.textContent =
            skin.name;


        const price =
            document.createElement(
                "div"
            );

        price.className =
            "price";

        price.textContent =
            skin.price > 0
            ? "🪙 " +
              skin.price.toLocaleString()
            : "Free";


        info.appendChild(
            name
        );

        info.appendChild(
            price
        );


        if(
            skin.price > 0
        ){

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "buy-btn";

            button.textContent =
                account.loggedIn
                ? "Buy"
                : "Log in to buy";


            button.addEventListener(
                "click",
                () =>
                    buySkin(skin)
            );


            info.appendChild(
                button
            );

        }


        card.appendChild(
            imageWrap
        );

        card.appendChild(
            info
        );

        skinGrid.appendChild(
            card
        );

    }

}


/* =========================================================
   BUY
   ========================================================= */

function buySkin(
    skin
){

    if(!account.loggedIn){

        loginModal.classList.add(
            "show"
        );

        return;

    }


    if(
        account.coins <
        skin.price
    ){

        alert(
            "Je hebt niet genoeg Coins.\n\n" +

            "Skin: " +
            skin.name +

            "\nPrijs: " +
            skin.price.toLocaleString() +

            "\nJouw Coins: " +
            account.coins.toLocaleString()
        );

        return;

    }


    const confirmPurchase =
        confirm(

            "Skin kopen?\n\n" +

            skin.name +

            "\n\nPrijs: 🪙 " +
            skin.price.toLocaleString() +

            "\nCoins na aankoop: 🪙 " +

            (
                account.coins -
                skin.price
            ).toLocaleString()

        );


    if(!confirmPurchase){

        return;

    }


    statusElement.textContent =
        "Aankoop naar Agar.io sturen...";


    sendToAgar({

        type:
            "TB_REQUEST_AGAR_PURCHASE",

        productId:
            skin.productId,

        price:
            skin.price,

        name:
            skin.name

    });

}


/* =========================================================
   TABS
   ========================================================= */

document
.querySelectorAll(".tab")
.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                document
                .querySelectorAll(".tab")
                .forEach(
                    tab =>
                        tab.classList
                        .remove("active")
                );


                button.classList.add(
                    "active"
                );


                currentTab =
                    button.dataset.tab;


                renderCurrentSkins();

            }
        );

    }
);


/* =========================================================
   AGAR WINDOW MONITOR
   ========================================================= */

setInterval(
    () => {

        if(
            agarWindow &&
            !agarWindow.closed
        ){

            requestAccountState();

        }

    },
    1500
);


/* =========================================================
   START
   ========================================================= */

updateAccountUI();

loadSkins();

</script>
