<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agar.io Skins Shop</title>

<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#111;color:#fff;padding:10px;display:flex;gap:10px;align-items:center}
header input{flex:1;padding:6px}
button{cursor:pointer}
.hidden{display:none}

.skin{background:#fff;padding:10px;margin:10px;border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);
display:flex;align-items:center;justify-content:center}
.modal>div{background:#fff;padding:20px;width:320px;border-radius:8px;position:relative}
.close{position:absolute;right:10px;top:5px;font-size:22px;cursor:pointer}

/* Hamburger menu */
.menu{position:fixed;left:0;top:0;height:100%;width:220px;
background:#020617;color:#fff;padding:15px;transform:translateX(-100%);
transition:.3s;z-index:10}
.menu.open{transform:translateX(0)}
.menu h3{margin-top:0}
.menu button{width:100%;margin-bottom:8px}
</style>
</head>

<body>

<!-- HAMBURGER MENU -->
<div id="menu" class="menu">
<h3>Menu</h3>
<button onclick="openCart()">Cart</button>
<button onclick="openLogin()">Login</button>
<button onclick="openRegister()">Register</button>
<button onclick="logout()">Logout</button>
</div>

<header>
<button onclick="toggleMenu()">☰</button>
<input placeholder="Search skins">
<button onclick="openCart()">🛒</button>

<button id="loginBtn" onclick="openLogin()">Login</button>
<button id="registerBtn" onclick="openRegister()">Register</button>
<button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
<button id="balanceBtn" class="hidden">💰 $<span id="balance">0</span></button>
</header>

<div id="skins"></div>

<!-- LOGIN -->
<div id="loginModal" class="modal hidden">
<div>
<span class="close" onclick="closeAll()">×</span>
<h3>Login</h3>
<input id="loginEmail" placeholder="Email"><br><br>
<input id="loginPass" type="password" placeholder="Password"><br><br>
<input id="loginKey" placeholder="Login key"><br><br>
<button onclick="login()">Login</button>
</div>
</div>

<!-- REGISTER -->
<div id="registerModal" class="modal hidden">
<div>
<span class="close" onclick="closeAll()">×</span>
<h3>Register</h3>
<input id="rName" placeholder="Name"><br><br>
<input id="rEmail" placeholder="Email"><br><br>
<input id="rUID" placeholder="Agar.io UID"><br><br>
<input id="rPass" type="password" placeholder="Password"><br><br>
<input id="rPass2" type="password" placeholder="Repeat password"><br><br>
<button onclick="register()">Register</button>
</div>
</div>

<!-- CART -->
<div id="cartModal" class="modal hidden">
<div>
<span class="close" onclick="closeAll()">×</span>
<h3>Cart</h3>
<div id="cartItems"></div>
<button onclick="payWithBalance()">Pay with my account</button>
</div>
</div>

<script>
/* ================= GLOBAL ================= */
const skinsDiv = document.getElementById("skins");
const cartItems = document.getElementById("cartItems");
const menu = document.getElementById("menu");

let cart = [];
let users = JSON.parse(localStorage.getItem("users")||"[]");
let currentUser = JSON.parse(localStorage.getItem("currentUser")||"null");
let orders = JSON.parse(localStorage.getItem("orders")||"[]");
const SESSION_DAYS = 3;

/* =====================
   30 SKINS
===================== */
const skins = [
 {id:1,name:"Scar",desc:"3250 coins 1 skin Scar",price:2.89,image1:"IMG_7141.webp",image2:null,sold:320},
 {id:2,name:"Scar + Seer",desc:"30000 coins 1 skin Scar 1 skin Seer",price:12.99,image1:"IMG_7141.webp",image2:"IMG_7142.webp",sold:280},
 {id:3,name:"Bull King",desc:"3250 coins 1 skin bull king",price:4.29,image1:"IMG_7147.webp",image2:null,sold:260},
 {id:4,name:"Birthday lol + Bull king",desc:"16000 coins 1 skin birthday lol 1 skin bull king",price:13.49,image1:"IMG_3797.webp",image2:"IMG_7147.webp",sold:240},
 {id:5,name:"Tiny jack + Jade",desc:"30000 coins 1 skin tiny jack 1 skin jade",price:14.39,image1:"IMG_7143.webp",image2:"IMG_4913.webp",sold:220},
 {id:6,name:"Evil master",desc:"16000 coins 1 skin evil master",price:11.49,image1:"IMG_5443.webp",image2:null,sold:210},
 {id:7,name:"Space warden + Evil master",desc:"50000 coins 1 skin space warden 1 skin evil master",price:21.99,image1:"IMG_7150.webp",image2:"IMG_5443.webp",sold:200},
 {id:8,name:"Space warden",desc:"7000 coins 1 skin space warden",price:6.59,image1:"IMG_7150.webp",image2:null,sold:190},
 {id:9,name:"Thund",desc:"Electric eye",price:5.49,image1:"IMG_6185.webp",image2:null,sold:180},
 {id:10,name:"King lion + Magic hat",desc:"50000 coins 1 skin king lion 1 skin magic hat",price:23.99,image1:"IMG_7172.webp",image2:"IMG_7171.webp",sold:170},

 {id:11,name:"Ice Crystal",desc:"3250 coins 1 skin winter ice crystal",price:7.89,image1:"IMG_5938.webp",image2:null,sold:165},
 {id:12,name:"Emerald Eye",desc:"Green gem eye",price:4.39,image1:"IMG_6189.webp",image2:"IMG_6190.webp",sold:160},
 {id:13,name:"Storm Rider",desc:"Storm skin",price:3.49,image1:"IMG_6191.webp",image2:null,sold:150},
 {id:14,name:"Golden Mask",desc:"Gold premium",price:8.19,image1:"IMG_6192.webp",image2:null,sold:145},
 {id:15,name:"Obsidian Orb",desc:"Black stone",price:3.99,image1:"IMG_6193.webp",image2:null,sold:140},
 {id:16,name:"Star Burst",desc:"Star explosion",price:7.59,image1:"IMG_6194.webp",image2:null,sold:135},
 {id:17,name:"Vortex Core",desc:"Energy vortex",price:5.39,image1:"IMG_6195.webp",image2:"IMG_6196.webp",sold:130},
 {id:18,name:"Ruby Fang",desc:"Red fang",price:6.19,image1:"IMG_6197.webp",image2:null,sold:120},
 {id:19,name:"Cursed Skull",desc:"Cursed skin",price:8.49,image1:"IMG_6198.webp",image2:null,sold:110},
 {id:20,name:"Silver Orb",desc:"Silver glow",price:4.99,image1:"IMG_6199.webp",image2:null,sold:105},

 {id:21,name:"Bronze King",desc:"Bronze ruler",price:3.79,image1:"IMG_6200.webp",image2:null,sold:100},
 {id:22,name:"Fire Ball",desc:"Fire sphere",price:7.99,image1:"IMG_6201.webp",image2:null,sold:95},
 {id:23,name:"Aqua Lord",desc:"Water lord",price:5.49,image1:"IMG_6202.webp",image2:null,sold:90},
 {id:24,name:"Plasma Nova",desc:"Plasma energy",price:9.49,image1:"IMG_6203.webp",image2:"IMG_6204.webp",sold:85},
 {id:25,name:"Dark Samurai",desc:"Samurai skin",price:6.79,image1:"IMG_6205.webp",image2:null,sold:80},
 {id:26,name:"Ice Reaper",desc:"Ice skull",price:5.99,image1:"IMG_6206.webp",image2:null,sold:75},
 {id:27,name:"Solar Eye",desc:"Sun eye",price:4.29,image1:"IMG_6207.webp",image2:null,sold:70},
 {id:28,name:"Void Core",desc:"Void energy",price:8.89,image1:"IMG_6208.webp",image2:"IMG_6209.webp",sold:65},
 {id:29,name:"Crystal Fang",desc:"Crystal teeth",price:6.59,image1:"IMG_6210.webp",image2:null,sold:60},
 {id:30,name:"Phantom Glow",desc:"Glow phantom",price:7.19,image1:"IMG_6211.webp",image2:null,sold:55}
];

/* ================= INIT ================= */
renderSkins();
if(currentUser) restoreSession();

/* ================= UI ================= */
function toggleMenu(){
menu.classList.toggle("open");
}
function closeAll(){
document.querySelectorAll(".modal").forEach(m=>m.classList.add("hidden"));
menu.classList.remove("open");
}
function openLogin(){closeAll();loginModal.classList.remove("hidden")}
function openRegister(){closeAll();registerModal.classList.remove("hidden")}
function openCart(){closeAll();cartModal.classList.remove("hidden");renderCart()}

/* ================= AUTH ================= */
function register(){
if(rPass.value!==rPass2.value) return alert("Passwords do not match");
let key=Math.floor(10000+Math.random()*90000);
users.push({
name:rName.value,
email:rEmail.value,
uid:rUID.value,
password:rPass.value,
key,
balance:0
});
localStorage.setItem("users",JSON.stringify(users));
alert("Registered successfully.\nYour login key: "+key);
closeAll();
}

function login(){
let u=users.find(x=>x.email===loginEmail.value &&
x.password===loginPass.value &&
String(x.key)===loginKey.value);
if(!u) return alert("Invalid login details");
currentUser={...u,lastActive:Date.now()};
localStorage.setItem("currentUser",JSON.stringify(currentUser));
updateUI();
closeAll();
}

function logout(){
currentUser=null;
localStorage.removeItem("currentUser");
updateUI();
closeAll();
}

function restoreSession(){
if(Date.now()-currentUser.lastActive>SESSION_DAYS*86400000){
logout();return;
}
currentUser.lastActive=Date.now();
localStorage.setItem("currentUser",JSON.stringify(currentUser));
updateUI();
}

function updateUI(){
loginBtn.classList.toggle("hidden",!!currentUser);
registerBtn.classList.toggle("hidden",!!currentUser);
logoutBtn.classList.toggle("hidden",!currentUser);
balanceBtn.classList.toggle("hidden",!currentUser);
if(currentUser) balance.textContent=currentUser.balance;
}

/* ================= SHOP ================= */
function renderSkins(){
skinsDiv.innerHTML="";
skins.forEach(s=>{
skinsDiv.innerHTML+=`
<div class="skin">
<b>${s.name}</b><br>
$${s.price}<br>
<button onclick="addCart(${s.id})">Add to cart</button>
</div>`;
});
}

function addCart(id){
cart.push(skins.find(s=>s.id===id));
alert("Added to cart");
}

function renderCart(){
cartItems.innerHTML="";
cart.forEach(i=>cartItems.innerHTML+=`<div>${i.name} - $${i.price}</div>`);
}

/* ================= PAYMENT ================= */
function payWithBalance(){
if(!currentUser) return alert("Login first");
let total=cart.reduce((a,b)=>a+b.price,0);
if(currentUser.balance<total) return alert("Not enough balance");
currentUser.balance-=total;
saveOrder();
alert("Payment successful");
cart=[];
closeAll();
}

function saveOrder(){
orders.push({
name:currentUser.name,
uid:currentUser.uid,
items:cart,
method:"balance",
status:"pending",
date:new Date().toISOString()
});
localStorage.setItem("orders",JSON.stringify(orders));
updateUser();
}

function updateUser(){
let i=users.findIndex(u=>u.email===currentUser.email);
users[i]=currentUser;
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("currentUser",JSON.stringify(currentUser));
updateUI();
}
</script>

</body>
</html>
