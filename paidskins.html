<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>T.B Agar.io Skins</title>

  <!-- jQuery required by Ogario -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top right, #075985, transparent 35%),
        #020617;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 18px 5%;
      background: rgba(2, 6, 23, 0.95);
      border-bottom: 1px solid #164e63;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #38bdf8;
    }

    .login-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font-weight: bold;
      color: white;
      background: #1877f2;
    }

    button:hover {
      background: #0d65d9;
    }

    .logout {
      background: #334155;
    }

    .logout:hover {
      background: #475569;
    }

    .profile {
      display: none;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .profile img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    main {
      width: min(1400px, 94%);
      margin: 30px auto;
    }

    .hero {
      text-align: center;
      padding: 35px 15px;
      border: 1px solid #164e63;
      border-radius: 20px;
      background: rgba(8, 47, 73, 0.35);
      margin-bottom: 25px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 52px);
    }

    .hero h1 span {
      color: #38bdf8;
    }

    .hero p {
      color: #cbd5e1;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    input,
    select {
      padding: 12px;
      color: white;
      background: #071a2e;
      border: 1px solid #28506a;
      border-radius: 9px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #38bdf8;
    }

    #search {
      flex: 1;
      min-width: 230px;
    }

    #skinCount {
      align-self: center;
      color: #94a3b8;
      font-size: 14px;
    }

    #skins {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 14px;
    }

    .skin {
      min-width: 0;
      padding: 12px 8px;
      text-align: center;
      background: linear-gradient(145deg, #08243b, #071226);
      border: 1px solid #164e63;
      border-radius: 14px;
      transition: 0.2s ease;
    }

    .skin:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 8px 25px rgba(14, 165, 233, 0.15);
    }

    .skin img {
      display: block;
      width: 100%;
      height: 105px;
      object-fit: contain;
      margin-bottom: 9px;
    }

    .skin-name {
      display: block;
      min-height: 32px;
      font-size: 13px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .skin-price {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 8px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 800;
    }

    .skin-id {
      display: block;
      margin-top: 6px;
      color: #64748b;
      font-size: 9px;
      overflow-wrap: anywhere;
    }

    .skin-buy {
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform .15s ease,
        opacity .15s ease,
        background .15s ease;
    }

    .skin-buy:hover:not(:disabled) {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    .skin-buy:active:not(:disabled) {
      transform: scale(.98);
    }

    .skin-buy:disabled {
      opacity: .45;
      cursor: not-allowed;
      background: #334155;
    }

    .loading,
    .error,
    .empty {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      color: #cbd5e1;
    }

    .error {
      color: #fca5a5;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      color: #64748b;
      border-top: 1px solid #164e63;
      font-size: 13px;
    }

    .tb-purchase-message {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      z-index: 99999;
      background: rgba(15, 23, 42, .97);
      color: #fff;
      padding: 13px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
      font-weight: 600;
      display: none;
      max-width: 90%;
      text-align: center;
    }

    .account-status {
      display: none;
      color: #22c55e;
      font-size: 12px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }

      .login-area {
        width: 100%;
        justify-content: center;
      }

      .profile {
        justify-content: center;
      }
    }

    @media (max-width: 600px) {
      #skins {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .skin {
        padding: 8px 4px;
      }

      .skin img {
        height: 75px;
      }

      .skin-name {
        font-size: 10px;
      }

      .skin-price {
        font-size: 9px;
        padding: 4px 6px;
      }

      .skin-buy {
        padding: 8px 5px;
        font-size: 11px;
      }
    }
  </style>

  <!-- Facebook SDK -->
  <script
    async
    defer
    crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js">
  </script>

  <!-- Your existing Ogario files -->
  <script src="ogario.v4.master.js"></script>
  <script src="ogario.v4.js"></script>

</head>

<body>

  <header>

    <div class="logo">
      T.B <span>Agar.io Skins</span>
    </div>

    <div class="login-area">

      <div id="profile" class="profile">

        <img
          id="profileImage"
          src=""
          alt="Profile"
        >

        <span id="profileName"></span>

        <span id="coins">
          Coins: 0
        </span>

        <span id="dna">
          DNA: 0
        </span>

        <span
          id="accountStatus"
          class="account-status">
          ● Logged in
        </span>

        <button
          class="logout"
          id="logoutButton"
          type="button"
          onclick="logoutFacebook()">
          Logout
        </button>

      </div>

      <button
        id="facebookLogin"
        type="button"
        onclick="loginFacebook()">
        Login with Facebook
      </button>

      <button
        id="googleLogin"
        type="button"
        onclick="loginGoogle()"
        style="background:#ea4335;">
        Login with Google
      </button>

    </div>

  </header>


  <main>

    <section class="hero">

      <h1>
        All <span>Agar.io Skins</span>
      </h1>

      <p>
        Explore the available Agar.io skins from the official game configuration.
      </p>

    </section>


    <div class="toolbar">

      <input
        id="search"
        type="search"
        placeholder="Search for a skin..."
        autocomplete="off"
        oninput="filterSkins()"
      >

      <select
        id="version"
        onchange="changeVersion()">

        <option value="v15/3032">
          v15/3032
        </option>

      </select>

      <span id="skinCount">
        Loading skins...
      </span>

    </div>


    <section id="skins">

      <div class="loading">
        Loading skins...
      </div>

    </section>

  </main>


  <footer>

    © <span id="year"></span>
    T.B Agar.io Skins

  </footer>


  <div
    id="tbPurchaseMessage"
    class="tb-purchase-message">
  </div>


  <script>

    /*
    ==========================================================
    CONFIGURATION
    ==========================================================
    */

    const API =
      "https://configs-web.agario.miniclippt.com/live/";

    let version = "v15/3032";

    let allSkins = [];


    /*
    ==========================================================
    BASIC PAGE
    ==========================================================
    */

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /*
    ==========================================================
    ACCOUNT STATE
    ==========================================================
    */

    let TB_LOGIN_PENDING = false;

    let TB_LOGIN_PROVIDER = "";

    let TB_ACCOUNT_LOGGED_IN = false;


    /*
    ==========================================================
    PURCHASE MESSAGE
    ==========================================================
    */

    function showPurchaseMessage(text) {

      let box =
        document.getElementById(
          "tbPurchaseMessage"
        );

      if (!box) {

        box =
          document.createElement("div");

        box.id =
          "tbPurchaseMessage";

        box.className =
          "tb-purchase-message";

        document.body.appendChild(box);
      }

      box.textContent = text;

      box.style.display = "block";

      clearTimeout(
        window.__tbPurchaseMessageTimer
      );

      window.__tbPurchaseMessageTimer =
        setTimeout(function () {

          box.style.display = "none";

        }, 3500);
    }


    /*
    ==========================================================
    LOGIN
    ==========================================================

    The actual Facebook/Google login is handled by the
    Tampermonkey Real Account Bridge.

    We dispatch a DOM event instead of trying to communicate
    directly with agar.io using postMessage().
    ==========================================================
    */

    function requestRealLogin(provider) {

      TB_LOGIN_PENDING = true;

      TB_LOGIN_PROVIDER = provider;


      const event =
        new CustomEvent(
          "TB_REAL_LOGIN",
          {
            detail: {
              provider: provider
            }
          }
        );


      document.dispatchEvent(event);


      /*
       * The Tampermonkey bridge normally catches the event.
       * This message only appears if the bridge is not installed.
       */

      setTimeout(function () {

        if (
          TB_LOGIN_PENDING &&
          !TB_ACCOUNT_LOGGED_IN
        ) {

          /*
           * Do not automatically open a second
           * OAuth flow here.
           *
           * The Tampermonkey bridge is responsible
           * for opening Agar.io.
           */

        }

      }, 1200);
    }


    function loginFacebook() {

      requestRealLogin(
        "facebook"
      );

    }


    function loginGoogle() {

      requestRealLogin(
        "google"
      );

    }


    /*
    ==========================================================
    REAL PURCHASE REQUEST
    ==========================================================

    This does NOT subtract Coins locally.

    The purchaseId comes from the official Agar.io
    GameConfiguration.

    The Tampermonkey bridge receives this event and calls:

        window.softPurchase(purchaseId)

    inside Agar.io.
    ==========================================================
    */

    function buySkinFromAgar(skin) {

      if (!skin) {

        showPurchaseMessage(
          "Invalid skin."
        );

        return;
      }


      if (!skin.purchaseId) {

        showPurchaseMessage(
          "This skin is not available for purchase."
        );

        return;
      }


      /*
       * Let the Tampermonkey bridge check the real
       * Agar.io login state.
       *
       * We deliberately do not use a fake local
       * Coins balance here.
       */

      const event =
        new CustomEvent(
          "TB_REAL_PURCHASE",
          {
            detail: {

              purchaseId:
                String(
                  skin.purchaseId
                ),

              productId:
                String(
                  skin.id || ""
                ),

              name:
                String(
                  skin.name || ""
                )

            }
          }
        );


      document.dispatchEvent(event);


      showPurchaseMessage(
        "Purchase request sent to Agar.io..."
      );
    }


    /*
    ==========================================================
    LOGOUT
    ==========================================================
    */

    function logoutFacebook() {

      const event =
        new CustomEvent(
          "TB_REAL_LOGOUT"
        );


      document.dispatchEvent(event);


      TB_LOGIN_PENDING = false;

      TB_LOGIN_PROVIDER = "";

      TB_ACCOUNT_LOGGED_IN = false;


      resetAccountUI();
    }


    /*
    ==========================================================
    RESET ACCOUNT UI
    ==========================================================
    */

    function resetAccountUI() {

      const fb =
        document.getElementById(
          "facebookLogin"
        );

      const google =
        document.getElementById(
          "googleLogin"
        );

      const profile =
        document.getElementById(
          "profile"
        );

      const name =
        document.getElementById(
          "profileName"
        );

      const image =
        document.getElementById(
          "profileImage"
        );

      const coins =
        document.getElementById(
          "coins"
        );

      const dna =
        document.getElementById(
          "dna"
        );

      const status =
        document.getElementById(
          "accountStatus"
        );


      if (fb) {

        fb.style.display =
          "block";

      }


      if (google) {

        google.style.display =
          "block";

      }


      if (profile) {

        profile.style.display =
          "none";

      }


      if (name) {

        name.textContent =
          "";

      }


      if (image) {

        image.removeAttribute(
          "src"
        );

      }


      if (coins) {

        coins.textContent =
          "Coins: 0";

      }


      if (dna) {

        dna.textContent =
          "DNA: 0";

      }


      if (status) {

        status.style.display =
          "none";

      }

    }


    /*
    ==========================================================
    ACCOUNT UI
    ==========================================================
    */

    function updateAccountUI(data) {

      if (
        !data ||
        !data.loggedIn
      ) {

        if (
          !TB_ACCOUNT_LOGGED_IN
        ) {

          resetAccountUI();

        }

        return;
      }


      TB_ACCOUNT_LOGGED_IN =
        true;

      TB_LOGIN_PENDING =
        false;


      const fb =
        document.getElementById(
          "facebookLogin"
        );

      const google =
        document.getElementById(
          "googleLogin"
        );

      const profile =
        document.getElementById(
          "profile"
        );

      const name =
        document.getElementById(
          "profileName"
        );

      const image =
        document.getElementById(
          "profileImage"
        );

      const coins =
        document.getElementById(
          "coins"
        );

      const dna =
        document.getElementById(
          "dna"
        );

      const status =
        document.getElementById(
          "accountStatus"
        );


      if (fb) {

        fb.style.display =
          "none";

      }


      if (google) {

        google.style.display =
          "none";

      }


      if (profile) {

        profile.style.display =
          "flex";

      }


      if (name) {

        name.textContent =
          data.name ||
          "Agar.io account";

      }


      if (coins) {

        coins.textContent =
          "Coins: " +
          Number(
            data.coins || 0
          ).toLocaleString();

      }


      if (dna) {

        dna.textContent =
          "DNA: " +
          Number(
            data.dna || 0
          ).toLocaleString();

      }


      if (status) {

        status.style.display =
          "inline";

      }


      if (
        image &&
        data.facebookId
      ) {

        image.src =
          "https://graph.facebook.com/" +
          encodeURIComponent(
            data.facebookId
          ) +
          "/picture?type=small";

      }

    }


    /*
    ==========================================================
    TAMperMONKEY → PAGE ACCOUNT EVENTS
    ==========================================================

    The bridge can dispatch these events in the page context.
    ==========================================================
    */

    document.addEventListener(
      "TB_ACCOUNT_STATE",
      function(event) {

        const data =
          event.detail || {};

        updateAccountUI(
          data
        );

      }
    );


    document.addEventListener(
      "TB_PURCHASE_RESULT",
      function(event) {

        const data =
          event.detail || {};


        if (
          data.success
        ) {

          showPurchaseMessage(
            data.message ||
            "Purchase request accepted by Agar.io."
          );

        } else {

          showPurchaseMessage(
            data.message ||
            "Agar.io could not start this purchase."
          );

        }

      }
    );


    document.addEventListener(
      "TB_LOGOUT_RESULT",
      function() {

        TB_ACCOUNT_LOGGED_IN =
          false;

        TB_LOGIN_PENDING =
          false;

        TB_LOGIN_PROVIDER =
          "";

        resetAccountUI();

      }
    );


    /*
    ==========================================================
    FALLBACK MESSAGE HANDLER
    ==========================================================

    Kept only for compatibility with older versions of the
    bridge. It NEVER closes Agar.io.
    ==========================================================
    */

    window.addEventListener(
      "message",
      function(event) {

        if (
          event.origin !==
          "https://agar.io"
        ) {

          return;

        }


        if (
          !event.data ||
          event.data.source !==
          "TB_AGARIO_BRIDGE"
        ) {

          return;

        }


        const message =
          event.data;


        if (
          message.type ===
          "TB_AGAR_STATE" ||
          message.type ===
          "TB_LOGIN_SUCCESS" ||
          message.type ===
          "TB_RETURN_TO_SHOP"
        ) {

          if (
            message.data &&
            message.data.loggedIn
          ) {

            updateAccountUI(
              message.data
            );

            /*
             * IMPORTANT:
             * Agar.io is NOT closed here.
             */

          }

        }


        if (
          message.type ===
          "TB_PURCHASE_RESULT"
        ) {

          const data =
            message.data || {};


          if (
            data.success
          ) {

            showPurchaseMessage(
              data.message ||
              "Purchase request accepted by Agar.io."
            );

          } else {

            showPurchaseMessage(
              data.message ||
              "Agar.io could not start this purchase."
            );

          }

        }


        if (
          message.type ===
          "TB_LOGOUT_RESULT"
        ) {

          TB_ACCOUNT_LOGGED_IN =
            false;

          resetAccountUI();

        }

      }
    );


    /*
    ==========================================================
    LOAD VERSIONS
    ==========================================================
    */

    async function loadVersions() {

      const select =
        document.getElementById(
          "version"
        );


      try {

        const response =
          await fetch(
            "https://lmsettings.snez.org/",
            {
              headers: {
                username:
                  "LMConfigVersion",

                password:
                  "LMConfigVersionPass"
              }
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "Version request failed"
          );

        }


        const versions =
          await response.json();


        select.innerHTML =
          "";


        let versionList =
          Array.isArray(versions)
            ? versions
            : (
                versions &&
                Array.isArray(
                  versions.versions
                )
                  ? versions.versions
                  : Object.values(
                      versions || {}
                    )
              );


        versionList.forEach(
          function(item) {

            const value =
              item &&
              typeof item ===
              "object"

                ? (
                    item.version ||
                    item.path ||
                    item.value ||
                    item.id
                  )

                : item;


            if (!value) {

              return;

            }


            const cleanVersion =
              String(value)
                .replace(/^\/+/, "")
                .replace(/\/+$/, "");


            if (
              Array.from(
                select.options
              ).some(
                function(option) {

                  return (
                    option.value ===
                    cleanVersion
                  );

                }
              )
            ) {

              return;

            }


            const option =
              document.createElement(
                "option"
              );


            option.value =
              cleanVersion;

            option.textContent =
              cleanVersion;


            select.appendChild(
              option
            );

          }
        );


        const preferred =
          Array.from(
            select.options
          ).find(
            function(option) {

              return (
                option.value ===
                "v15/3032"
              );

            }
          );


        if (preferred) {

          version =
            preferred.value;

          select.value =
            version;

        } else if (
          select.options.length
        ) {

          version =
            select.options[
              select.options.length - 1
            ].value;

          select.value =
            version;

        } else {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            "v15/3032";

          option.textContent =
            "v15/3032";


          select.appendChild(
            option
          );


          version =
            "v15/3032";

        }

      } catch (error) {

        console.error(
          "[T.B Versions]",
          error
        );


        select.innerHTML =
          "";


        const option =
          document.createElement(
            "option"
          );


        option.value =
          version;

        option.textContent =
          version;


        select.appendChild(
          option
        );

      }


      await loadSkins();

    }


    /*
    ==========================================================
    LOAD SKINS
    ==========================================================
    */

    async function loadSkins() {

      const container =
        document.getElementById(
          "skins"
        );

      const count =
        document.getElementById(
          "skinCount"
        );


      container.innerHTML =
        '<div class="loading">Loading skins...</div>';


      count.textContent =
        "Loading...";


      allSkins = [];


      try {

        const url =
          API +
          version +
          "/GameConfiguration.json";


        const response =
          await fetch(
            url,
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "GameConfiguration could not be loaded"
          );

        }


        const config =
          await response.json();


        const gameConfig =
          config &&
          config.gameConfig
            ? config.gameConfig
            : config;


        const gameplaySkins =
          getSectionRows(
            gameConfig,
            "Gameplay - Equippable Skins"
          );


        const shopSkins =
          getSectionRows(
            gameConfig,
            "Shop - Skins"
          );


        const purchases =
          getSectionRows(
            gameConfig,
            "Wallet - Soft Purchases"
          );


        const visualProducts =
          getSectionRows(
            gameConfig,
            "Visual - Products"
          );


        const purchaseById =
          new Map();


        purchases.forEach(
          function(purchase) {

            if (
              !purchase ||
              purchase.id == null
            ) {

              return;

            }


            purchaseById.set(
              String(
                purchase.id
              ),
              purchase
            );

          }
        );


        const shopByProductId =
          new Map();


        shopSkins.forEach(
          function(shop) {

            if (!shop) {

              return;

            }


            const productId =
              firstValue(
                shop,
                [
                  "productIdToQuantify",
                  "productId",
                  "id"
                ]
              );


            if (
              productId != null &&
              productId !== ""
            ) {

              shopByProductId.set(
                String(productId),
                shop
              );

            }

          }
        );


        const visualByProductId =
          new Map();


        visualProducts.forEach(
          function(visual) {

            if (!visual) {

              return;

            }


            const productId =
              firstValue(
                visual,
                [
                  "productId",
                  "id"
                ]
              );


            if (
              productId != null &&
              productId !== ""
            ) {

              visualByProductId.set(
                String(productId),
                visual
              );

            }

          }
        );


        /*
        --------------------------------------------------------
        Gameplay skins
        --------------------------------------------------------
        */

        gameplaySkins.forEach(
          function(skin) {

            if (
              !skin ||
              skin.productId == null
            ) {

              return;

            }


            const id =
              String(
                skin.productId
              );


            const shop =
              shopByProductId.get(
                id
              ) || null;


            const visual =
              visualByProductId.get(
                id
              ) || null;


            const purchaseId =
              findPurchaseId(
                skin,
                shop
              );


            const purchase =
              purchaseId

                ? (
                    purchaseById.get(
                      String(
                        purchaseId
                      )
                    ) || null
                  )

                : null;


            const image =
              resolveSkinImage(
                skin,
                visual
              );


            const price =
              resolveSkinPrice(
                skin,
                shop,
                purchase,
                purchases
              );


            const currency =
              resolveCurrency(
                skin,
                shop,
                purchase
              );


            allSkins.push({

              id:
                id,

              image:
                image,

              name:
                resolveSkinName(
                  skin,
                  shop,
                  id
                ),

              price:
                price,

              currency:
                currency,

              purchaseId:
                purchaseId || ""

            });

          }
        );


        /*
        --------------------------------------------------------
        Fallback shop entries
        --------------------------------------------------------
        */

        if (
          !allSkins.length
        ) {

          shopSkins.forEach(
            function(shop) {

              if (!shop) {

                return;

              }


              const id =
                firstValue(
                  shop,
                  [
                    "productIdToQuantify",
                    "productId",
                    "id"
                  ]
                );


              if (
                id == null ||
                id === ""
              ) {

                return;

              }


              const visual =
                visualByProductId.get(
                  String(id)
                ) || null;


              const purchaseId =
                findPurchaseId(
                  {},
                  shop
                );


              const purchase =
                purchaseId

                  ? (
                      purchaseById.get(
                        String(
                          purchaseId
                        )
                      ) || null
                    )

                  : null;


              allSkins.push({

                id:
                  String(id),

                image:
                  resolveSkinImage(
                    {},
                    visual
                  ),

                name:
                  resolveSkinName(
                    {},
                    shop,
                    String(id)
                  ),

                price:
                  resolveSkinPrice(
                    {},
                    shop,
                    purchase,
                    purchases
                  ),

                currency:
                  resolveCurrency(
                    {},
                    shop,
                    purchase
                  ),

                purchaseId:
                  purchaseId || ""

              });

            }
          );

        }


        /*
        --------------------------------------------------------
        Remove duplicate product IDs
        --------------------------------------------------------
        */

        allSkins =
          Array.from(
            new Map(
              allSkins.map(
                function(skin) {

                  return [
                    skin.id,
                    skin
                  ];

                }
              )
            ).values()
          );


        renderSkins(
          allSkins
        );


      } catch (error) {

        console.error(
          "[T.B Skins]",
          error
        );


        container.innerHTML =
          '<div class="error">Unable to load skins for this version.</div>';


        count.textContent =
          "0 skins";

      }

    }


    /*
    ==========================================================
    GET CONFIGURATION SECTION
    ==========================================================
    */

    function getSectionRows(
      config,
      name
    ) {

      if (
        !config ||
        typeof config !==
        "object"
      ) {

        return [];

      }


      if (
        Array.isArray(
          config[name]
        )
      ) {

        return config[name];

      }


      let found =
        null;


      function walk(value) {

        if (
          found ||
          value == null ||
          typeof value !==
          "object"
        ) {

          return;

        }


        if (
          Array.isArray(
            value
          )
        ) {

          return;

        }


        if (
          Object.prototype.hasOwnProperty.call(
            value,
            name
          )
        ) {

          if (
            Array.isArray(
              value[name]
            )
          ) {

            found =
              value[name];

          }

          return;

        }


        Object.keys(
          value
        ).some(
          function(key) {

            walk(
              value[key]
            );

            return !!found;

          }
        );

      }


      walk(
        config
      );


      return Array.isArray(found)
        ? found
        : [];

    }


    /*
    ==========================================================
    FIRST VALUE
    ==========================================================
    */

    function firstValue(
      object,
      keys
    ) {

      if (
        !object ||
        typeof object !==
        "object"
      ) {

        return null;

      }


      for (
        const key of keys
      ) {

        if (
          object[key] !==
          undefined &&
          object[key] !==
          null &&
          String(
            object[key]
          ).trim() !== ""
        ) {

          return object[key];

        }

      }


      return null;

    }


    /*
    ==========================================================
    FIND PURCHASE ID
    ==========================================================
    */

    function findPurchaseId(
      skin,
      shop
    ) {

      const objects = [
        shop,
        skin
      ];


      const keys = [

        "purchaseId",

        "purchaseID",

        "softPurchaseId",

        "softPurchaseID",

        "referenceValue",

        "referenceId",

        "referenceID",

        "walletProductId"

      ];


      for (
        const object of objects
      ) {

        const value =
          firstValue(
            object,
            keys
          );


        if (
          value != null
        ) {

          return String(
            value
          );

        }

      }


      return "";

    }


    /*
    ==========================================================
    RESOLVE IMAGE
    ==========================================================
    */

    function resolveSkinImage(
      skin,
      visual
    ) {

      const value =
        firstValue(
          skin,
          [
            "image",
            "icon",
            "skinImage",
            "visualSource"
          ]
        ) ||
        firstValue(
          visual,
          [
            "visualSource",
            "image",
            "icon",
            "source"
          ]
        );


      return value == null
        ? ""
        : String(value);

    }


    /*
    ==========================================================
    RESOLVE NAME
    ==========================================================
    */

    function resolveSkinName(
      skin,
      shop,
      id
    ) {

      const value =
        firstValue(
          skin,
          [
            "displayName",
            "localizedName",
            "name",
            "skinName"
          ]
        ) ||
        firstValue(
          shop,
          [
            "displayName",
            "localizedName",
            "name"
          ]
        );


      if (value) {

        return String(
          value
        );

      }


      return String(id)
        .replace(
          /^skin[_-]?/i,
          ""
        )
        .replace(
          /[_-]+/g,
          " "
        );

    }


    /*
    ==========================================================
    RESOLVE PRICE
    ==========================================================
    */

    function resolveSkinPrice(
      skin,
      shop,
      purchase,
      purchases
    ) {

      const direct =
        firstNumber(
          skin,
          [
            "price",
            "cost",
            "currencyAmount"
          ]
        );


      if (
        direct != null
      ) {

        return direct;

      }


      const shopDirect =
        firstNumber(
          shop,
          [
            "price",
            "cost",
            "currencyAmount"
          ]
        );


      if (
        shopDirect != null
      ) {

        return shopDirect;

      }


      const purchasePrice =
        firstNumber(
          purchase,
          [
            "currencyAmount",
            "price",
            "cost"
          ]
        );


      if (
        purchasePrice != null
      ) {

        return purchasePrice;

      }


      /*
      Last-resort relation scan.
      */

      const possibleIds =
        [];


      [skin, shop].forEach(
        function(object) {

          if (
            !object ||
            typeof object !==
            "object"
          ) {

            return;

          }


          Object.keys(
            object
          ).forEach(
            function(key) {

              const value =
                object[key];


              if (
                /purchase|reference/i.test(
                  key
                ) &&
                (
                  typeof value ===
                  "string" ||
                  typeof value ===
                  "number"
                )
              ) {

                possibleIds.push(
                  String(value)
                );

              }

            }
          );

        }
      );


      for (
        const id of possibleIds
      ) {

        const match =
          purchases.find(
            function(row) {

              return (
                row &&
                String(
                  row.id
                ) === id
              );

            }
          );


        const price =
          firstNumber(
            match,
            [
              "currencyAmount",
              "price",
              "cost"
            ]
          );


        if (
          price != null
        ) {

          return price;

        }

      }


      return null;

    }


    /*
    ==========================================================
    FIRST NUMBER
    ==========================================================
    */

    function firstNumber(
      object,
      keys
    ) {

      if (
        !object ||
        typeof object !==
        "object"
      ) {

        return null;

      }


      for (
        const key of keys
      ) {

        if (
          object[key] ===
          undefined ||
          object[key] ===
          null
        ) {

          continue;

        }


        const number =
          Number(
            object[key]
          );


        if (
          Number.isFinite(
            number
          )
        ) {

          return number;

        }

      }


      return null;

    }


    /*
    ==========================================================
    CURRENCY
    ==========================================================
    */

    function resolveCurrency(
      skin,
      shop,
      purchase
    ) {

      const value =
        firstValue(
          purchase,
          [
            "currencyProductId",
            "currency"
          ]
        ) ||
        firstValue(
          shop,
          [
            "currencyProductId",
            "currency"
          ]
        ) ||
        firstValue(
          skin,
          [
            "currencyProductId",
            "currency"
          ]
        ) ||
        "DNA";


      return String(
        value
      ).toUpperCase();

    }


    /*
    ==========================================================
    RENDER SKINS
    ==========================================================
    */

    function renderSkins(
      skins
    ) {

      const container =
        document.getElementById(
          "skins"
        );


      const count =
        document.getElementById(
          "skinCount"
        );


      container.innerHTML =
        "";


      count.textContent =
        skins.length +
        " skins";


      if (
        skins.length === 0
      ) {

        container.innerHTML =
          '<div class="empty">No skins found in the configuration.</div>';

        return;

      }


      skins.forEach(
        function(skin) {

          const card =
            document.createElement(
              "article"
            );


          card.className =
            "skin";


          /*
          ------------------------------------------------------
          IMAGE
          ------------------------------------------------------
          */

          const image =
            document.createElement(
              "img"
            );


          image.loading =
            "lazy";


          image.alt =
            skin.name;


          let imagePath =
            skin.image ||
            "";


          if (
            imagePath &&
            !/^https?:\/\//i.test(
              imagePath
            )
          ) {

            imagePath =
              API +
              version +
              "/" +
              imagePath.replace(
                /^\/+/,
                ""
              );

          }


          image.src =
            imagePath;


          image.onerror =
            function() {

              image.style.display =
                "none";

            };


          /*
          ------------------------------------------------------
          NAME
          ------------------------------------------------------
          */

          const name =
            document.createElement(
              "span"
            );


          name.className =
            "skin-name";


          name.textContent =
            skin.name;


          /*
          ------------------------------------------------------
          PRICE
          ------------------------------------------------------
          */

          const price =
            document.createElement(
              "span"
            );


          price.className =
            "skin-price";


          price.textContent =
            skin.price == null

              ? "Price unavailable"

              : (
                  Number(
                    skin.price
                  ).toLocaleString() +
                  " " +
                  skin.currency
                );


          /*
          ------------------------------------------------------
          ID
          ------------------------------------------------------
          */

          const id =
            document.createElement(
              "span"
            );


          id.className =
            "skin-id";


          id.textContent =
            skin.id;


          /*
          ------------------------------------------------------
          BUY BUTTON
          ------------------------------------------------------
          */

          const buy =
            document.createElement(
              "button"
            );


          buy.className =
            "skin-buy";


          buy.type =
            "button";


          if (
            skin.purchaseId
          ) {

            buy.textContent =
              "Buy";


            buy.disabled =
              false;


            /*
            Store the real purchase ID on
            the button as extra protection
            for the Tampermonkey bridge.
            */

            buy.dataset.purchaseId =
              String(
                skin.purchaseId
              );


            buy.dataset.productId =
              String(
                skin.id || ""
              );


            buy.dataset.skinName =
              String(
                skin.name || ""
              );


            buy.addEventListener(
              "click",
              function(event) {

                event.preventDefault();

                event.stopPropagation();


                buySkinFromAgar(
                  skin
                );

              }
            );


          } else {

            buy.textContent =
              "Unavailable";


            buy.disabled =
              true;

          }


          /*
          ------------------------------------------------------
          ADD ELEMENTS
          ------------------------------------------------------
          */

          card.appendChild(
            image
          );


          card.appendChild(
            name
          );


          card.appendChild(
            price
          );


          card.appendChild(
            id
          );


          card.appendChild(
            buy
          );


          container.appendChild(
            card
          );

        }
      );

    }


    /*
    ==========================================================
    SEARCH
    ==========================================================
    */

    function filterSkins() {

      const query =
        document.getElementById(
          "search"
        )
          .value
          .toLowerCase()
          .trim();


      const filtered =
        allSkins.filter(
          function(skin) {

            return (

              skin.name
                .toLowerCase()
                .includes(
                  query
                )

              ||

              skin.id
                .toLowerCase()
                .includes(
                  query
                )

            );

          }
        );


      renderSkins(
        filtered
      );

    }


    /*
    ==========================================================
    VERSION CHANGE
    ==========================================================
    */

    function changeVersion() {

      version =
        document.getElementById(
          "version"
        ).value;


      loadSkins();

    }


    /*
    ==========================================================
    START
    ==========================================================
    */

    loadVersions();

  </script>
