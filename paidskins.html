
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.B Agar.io Shop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: white;
    }

    header {
      padding: 20px;
      background: #191e2c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      color: #6ca8ff;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #387cff;
      color: white;
    }

    .danger {
      background: #e5484d;
      color: white;
    }

    .secondary {
      background: #30384d;
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .panel {
      background: #191e2c;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .hidden {
      display: none !important;
    }

    .account-info {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .coins {
      color: #ffd65a;
      font-weight: bold;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: #202738;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 170px;
      object-fit: contain;
      border-radius: 8px;
      background: #111520;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      color: #ffd65a;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .modal-content {
      width: 100%;
      max-width: 430px;
      background: #191e2c;
      padding: 25px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 12px;
      border: 1px solid #414b63;
      border-radius: 8px;
      background: #10131c;
      color: white;
    }

    .message {
      margin-top: 12px;
      line-height: 1.5;
      color: #ffcf66;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #30384d;
      padding: 12px 0;
    }

    .cart-total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <header>
    <h1>T.B Agar.io Shop</h1>

    <div class="account-info">
      <span id="accountStatus">You are not logged in</span>
      <span id="coinBalance" class="coins"></span>

      <button class="primary" id="loginButton" onclick="openAuth()">
        Login / Register
      </button>

      <button class="secondary hidden" id="logoutButton" onclick="logout()">
        Logout
      </button>

      <button class="secondary" onclick="openCart()">
        Cart (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Welcome to the T.B Agar.io Shop</h2>
      <p>
        Buy exclusive skins and other items using your coins.
        You must be logged in to make a purchase.
      </p>
    </section>

    <section>
      <h2>Available products</h2>
      <div id="products" class="products"></div>
    </section>
  </main>

  <!-- Login and registration modal -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="authTitle">Login</h2>

      <form onsubmit="submitAuth(event)">
        <label for="username">Username</label>
        <input id="username" required minlength="3" maxlength="32"
               autocomplete="username">

        <label for="password">Password</label>
        <input id="password" type="password" required minlength="8"
               autocomplete="current-password">

        <button class="primary" type="submit" id="authSubmit">
          Login
        </button>
      </form>

      <button class="secondary" onclick="toggleAuthMode()">
        <span id="switchAuthText">Create an account</span>
      </button>

      <button class="danger" onclick="closeAuth()">Close</button>
      <div id="authMessage" class="message"></div>
    </div>
  </div>

  <!-- Cart modal -->
  <div id="cartModal" class="modal hidden">
    <div class="modal-content">
      <h2>Your cart</h2>

      <div id="cartItems"></div>
      <div id="cartTotal" class="cart-total"></div>

      <button class="primary" onclick="payWithCoins()">
        Pay with coins
      </button>

      <button class="secondary" onclick="closeCart()">
        Continue shopping
      </button>

      <button class="danger" onclick="clearCart()">
        Clear cart
      </button>

      <div id="cartMessage" class="message"></div>
    </div>
  </div>

  <script>
    /*
      Your backend must provide these endpoints:

      POST /api/auth/register
      POST /api/auth/login
      POST /api/auth/logout
      GET  /api/me
      POST /api/orders/coins

      The backend must use secure, server-side sessions and hashed
      passwords. Never store passwords or coin balances in this file.
    */

    const API_BASE = "";

    const products = [
      {
        id: "skin-001",
        name: "Dohnut",
        price: 100,
        image: "IMG_5334.webp"
      },
      {
        id: "skin-002",
        name: "Pumpkitty",
        price: 100,
        image: "IMG_0923.webp"
      },
      {
        id: "skin-003",
        name: "Mindseye",
        price: 100,
        image: "IMG_0920.webp"
      },
      {
        id: "skin-004",
        name: "Nomster",
        price: 300,
        image: "IMG_0924.webp"
      }
    ];

    let cart = [];
    let loggedIn = false;
    let authMode = "login";
    let currentUser = null;

    function renderProducts() {
      const container = document.getElementById("products");

      container.innerHTML = products.map(product => `
        <div class="product">
          <img src="${escapeHtml(product.image)}"
               alt="${escapeHtml(product.name)}">

          <h3>${escapeHtml(product.name)}</h3>
          <div class="price">${product.price} coins</div>

          <button class="primary"
                  onclick="addToCart('${product.id}')">
            Add to cart
          </button>
        </div>
      `).join("");
    }

    function addToCart(productId) {
      if (!loggedIn) {
        openAuth();
        showAuthMessage("Please log in before adding items to your cart.");
        return;
      }

      const product = products.find(item => item.id === productId);
      if (!product) return;

      const existing = cart.find(item => item.id === productId);

      if (existing) {
        existing.quantity++;
      } else {
        cart.push({
          id: productId,
          quantity: 1
        });
      }

      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cartItems");
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);

      document.getElementById("cartCount").textContent = count;

      if (cart.length === 0) {
        container.innerHTML = "<p>Your cart is empty.</p>";
        document.getElementById("cartTotal").textContent = "";
        return;
      }

      let total = 0;

      container.innerHTML = cart.map(item => {
        const product = products.find(p => p.id === item.id);
        const subtotal = product.price * item.quantity;
        total += subtotal;

        return `
          <div class="cart-row">
            <span>
              ${escapeHtml(product.name)}
              × ${item.quantity}
            </span>

            <span>${subtotal} coins</span>

            <button class="danger"
                    onclick="removeFromCart('${item.id}')">
              Remove
            </button>
          </div>
        `;
      }).join("");

      document.getElementById("cartTotal").textContent =
        "Total: " + total + " coins";
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      renderCart();
    }

    function clearCart() {
      cart = [];
      renderCart();
      document.getElementById("cartMessage").textContent = "";
    }

    function openCart() {
      if (!loggedIn) {
        openAuth();
        showAuthMessage("Please log in to access your cart.");
        return;
      }

      renderCart();
      document.getElementById("cartModal").classList.remove("hidden");
    }

    function closeCart() {
      document.getElementById("cartModal").classList.add("hidden");
    }

    async function payWithCoins() {
      if (!loggedIn) {
        openAuth();
        showAuthMessage("You must be logged in to purchase items.");
        return;
      }

      if (cart.length === 0) {
        showCartMessage("Your cart is empty.");
        return;
      }

      try {
        const response = await fetch(API_BASE + "/api/orders/coins", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            items: cart
          })
        });

        const data = await response.json();

        if (!response.ok) {
          if (data.error === "INSUFFICIENT_COINS") {
            showCartMessage(
              "You do not have enough coins. " +
              "Please contact T.B Agar.io via Instagram and send " +
              "an Apple Gift Card or Google Play Gift Card worth " +
              "at least €5. After payment, contact T.B Agar.io " +
              "to request more coins."
            );
            return;
          }

          showCartMessage(data.message || "Payment failed.");
          return;
        }

        cart = [];
        renderCart();
        showCartMessage("Purchase completed successfully!");
        await loadCurrentUser();

      } catch (error) {
        showCartMessage("Could not connect to the server.");
      }
    }

    function openAuth() {
      document.getElementById("authModal").classList.remove("hidden");
    }

    function closeAuth() {
      document.getElementById("authModal").classList.add("hidden");
      document.getElementById("authMessage").textContent = "";
    }

    function toggleAuthMode() {
      authMode = authMode === "login" ? "register" : "login";

      document.getElementById("authTitle").textContent =
        authMode === "login" ? "Login" : "Register";

      document.getElementById("authSubmit").textContent =
        authMode === "login" ? "Login" : "Register";

      document.getElementById("switchAuthText").textContent =
        authMode === "login"
          ? "Create an account"
          : "I already have an account";

      document.getElementById("authMessage").textContent = "";
    }

    async function submitAuth(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const endpoint = authMode === "login"
        ? "/api/auth/login"
        : "/api/auth/register";

      try {
        const response = await fetch(API_BASE + endpoint, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showAuthMessage(data.message || "Authentication failed.");
          return;
        }

        await loadCurrentUser();
        closeAuth();

      } catch (error) {
        showAuthMessage("Could not connect to the server.");
      }
    }

    async function logout() {
      await fetch(API_BASE + "/api/auth/logout", {
        method: "POST",
        credentials: "include"
      });

      loggedIn = false;
      currentUser = null;
      cart = [];

      updateAccountDisplay();
      renderCart();
    }

    async function loadCurrentUser() {
      try {
        const response = await fetch(API_BASE + "/api/me", {
          credentials: "include"
        });

        if (!response.ok) {
          loggedIn = false;
          currentUser = null;
        } else {
          currentUser = await response.json();
          loggedIn = true;
        }

        updateAccountDisplay();

      } catch (error) {
        loggedIn = false;
        currentUser = null;
        updateAccountDisplay();
      }
    }

    function updateAccountDisplay() {
      const status = document.getElementById("accountStatus");
      const balance = document.getElementById("coinBalance");
      const loginButton = document.getElementById("loginButton");
      const logoutButton = document.getElementById("logoutButton");

      if (loggedIn && currentUser) {
        status.textContent = "Logged in as " + currentUser.username;
        balance.textContent = "Coins: " + currentUser.coins;
        loginButton.classList.add("hidden");
        logoutButton.classList.remove("hidden");
      } else {
        status.textContent = "You are not logged in";
        balance.textContent = "";
        loginButton.classList.remove("hidden");
        logoutButton.classList.add("hidden");
      }
    }

    function showAuthMessage(message) {
      document.getElementById("authMessage").textContent = message;
    }

    function showCartMessage(message) {
      document.getElementById("cartMessage").textContent = message;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderProducts();
    renderCart();
    loadCurrentUser();
  </script>
</body>
</html>
