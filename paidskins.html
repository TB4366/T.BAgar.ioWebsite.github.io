<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T.B Agar.io Paid Skins</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>

<style>
.circle-big{width:120px;height:120px;border-radius:9999px;object-fit:cover}
.circle-small{width:90px;height:90px;border-radius:9999px;object-fit:cover}
.img-row{display:flex;gap:10px;justify-content:center}
.badge{position:absolute;top:-6px;right:-6px;background:red;color:#fff;border-radius:9999px;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.hidden{display:none}
</style>
</head>

<body class="bg-gray-100">

<header class="bg-gray-900 text-white">
  <div class="max-w-6xl mx-auto p-4 flex items-center gap-3">
    <div class="font-bold text-lg">T.B Agar.io Paid Skins</div>
    <input id="search" placeholder="Search skins..." class="flex-1 px-3 py-2 rounded text-black">
    <button id="cartBtn" class="relative bg-teal-500 px-4 py-2 rounded">
      Cart <span id="cartCount" class="badge">0</span>
    </button>
    <button id="loginBtn" class="bg-blue-500 px-3 py-2 rounded">Login</button>
    <button id="registerBtn" class="bg-green-500 px-3 py-2 rounded">Register</button>
    <button id="accountBtn" class="bg-yellow-500 px-3 py-2 rounded hidden">💰</button>
    <button id="logoutBtn" class="bg-red-500 px-3 py-2 rounded hidden">Logout</button>
  </div>
</header>

<main class="max-w-6xl mx-auto p-6">
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
</main>

<!-- CART -->
<div id="cartModal" class="modal hidden">
  <div class="bg-white p-6 rounded w-full max-w-xl relative">
    <button onclick="cartModal.classList.add('hidden')" class="absolute right-3 top-2 text-xl">×</button>
    <h2 class="text-xl font-bold mb-4">Cart</h2>
    <div id="cartItems"></div>
    <div class="font-bold mt-3">Total: <span id="total">$0.00</span></div>
    <button id="payAccountBtn" class="w-full bg-green-600 text-white py-3 rounded mt-4">
      Pay with Account
    </button>
  </div>
</div>

<!-- LOGIN -->
<div id="loginModal" class="modal hidden">
  <div class="bg-white p-6 rounded w-full max-w-sm">
    <h2 class="font-bold mb-3">Login</h2>
    <input id="loginEmail" placeholder="Email" class="border p-2 w-full mb-2">
    <input id="loginPassword" type="password" placeholder="Password" class="border p-2 w-full mb-2">
    <input id="loginKey" placeholder="Key" class="border p-2 w-full mb-2">
    <button id="loginSubmit" class="bg-blue-500 text-white w-full py-2 rounded">Login</button>
  </div>
</div>

<!-- REGISTER -->
<div id="registerModal" class="modal hidden">
  <div class="bg-white p-6 rounded w-full max-w-sm">
    <h2 class="font-bold mb-3">Register</h2>
    <input id="regName" placeholder="Name" class="border p-2 w-full mb-2">
    <input id="regEmail" placeholder="Email" class="border p-2 w-full mb-2">
    <input id="regUID" placeholder="Agar UID" class="border p-2 w-full mb-2">
    <input id="regPassword" type="password" placeholder="Password" class="border p-2 w-full mb-2">
    <input id="regPassword2" type="password" placeholder="Repeat Password" class="border p-2 w-full mb-2">
    <button id="registerSubmit" class="bg-green-500 text-white w-full py-2 rounded">Register</button>
  </div>
</div>

<!-- ACCOUNT -->
<div id="accountModal" class="modal hidden">
  <div class="bg-white p-6 rounded w-full max-w-sm">
    Balance: $<span id="userBalanceDisplay">0</span>
  </div>
</div>

/* STATE */
let cart = JSON.parse(localStorage.getItem("cart")||"[]");
let users = JSON.parse(localStorage.getItem("users")||"[]");
let currentUser = JSON.parse(localStorage.getItem("currentUser")||"null");

/* RENDER */
const grid=document.getElementById("grid");
function render(){
  grid.innerHTML="";
  skins.forEach(s=>{
    let imgs = `<img src="${s.image1}" class="${s.image2?'circle-small':'circle-big'}">`;
    if(s.image2) imgs+=`<img src="${s.image2}" class="circle-small">`;

    grid.innerHTML+=`
    <div class="bg-white p-4 rounded text-center">
      <div class="img-row">${imgs}</div>
      <b>${s.name}</b>
      <p class="text-sm">${s.desc}</p>
      <p class="font-bold">$${s.price}</p>
      <button onclick="addCart(${s.id})"
        class="bg-green-600 text-white px-3 py-2 rounded mt-2">Add</button>
    </div>`;
  });
}
render();

/* CART */
function addCart(id){
  cart.push(skins.find(s=>s.id===id));
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCart();
}
function updateCart(){
  cartItems.innerHTML="";
  let total=0;
  cart.forEach((s,i)=>{
    total+=s.price;
    cartItems.innerHTML+=`
    <div class="flex justify-between border p-2 mb-2">
      ${s.name} $${s.price}
      <button onclick="removeItem(${i})">×</button>
    </div>`;
  });
  totalEl.textContent="$"+total.toFixed(2);
  cartCount.textContent=cart.length;
}
function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCart();
}

/* LOGIN / REGISTER / PAY (zoals besproken) */

</body>
</html>
