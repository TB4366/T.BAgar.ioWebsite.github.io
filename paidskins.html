<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>T.B Agar.io Paid Skins — Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>

<style>
  .card-img{width:120px;height:120px;object-fit:cover;border-radius:9999px}
  .small-img{width:96px;height:96px;object-fit:cover;border-radius:9999px}
  .imgs-row{display:flex;gap:10px;justify-content:center}
</style>
</head>

<body class="bg-gray-100">

<header class="bg-gray-900 text-white">
  <div class="max-w-6xl mx-auto p-4 flex justify-between items-center">
    <h1 class="font-bold text-lg">T.B Agar.io Paid Skins</h1>

    <div class="flex-1 max-w-lg flex">
      <input id="navbarSearch" placeholder="Zoek skins..."
        class="flex-1 border px-3 py-2 rounded-l">
      <div id="google_translate_element" class="border px-2 rounded-r bg-white"></div>
    </div>

    <button id="cartBtn" class="bg-teal-500 px-4 py-2 rounded flex items-center gap-2">
      <i data-feather="shopping-cart"></i>
      Winkelwagen
      <span id="cartCount"
        class="bg-red-500 text-white px-2 rounded-full text-sm">0</span>
    </button>
  </div>
</header>

<div class="max-w-6xl mx-auto px-6 mt-4 flex gap-3 items-center">
  <label for="sortSelect" class="text-sm font-medium">Categorie & sorteren</label>

  <select id="sortSelect" class="border rounded px-3 py-2">
    <option value="all">Alle skins</option>
    <option value="low">Van laag naar hoog</option>
    <option value="oldpaid">Old Paid Skins</option>
    <option value="high">Van hoog naar laag</option>
    <option value="popular">Populair</option>
    <option value="shuffle">Shuffle</option>
  </select>
</div>

<main class="max-w-6xl mx-auto p-6">
  <div id="grid"
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
</main>

<template id="card-template">
  <div class="bg-white rounded shadow p-4 text-center">
    <div class="imgs-row"></div>
    <h3 class="font-semibold mt-3 card-title"></h3>
    <p class="text-sm text-gray-500 card-cat mt-1"></p>
    <p class="text-sm text-gray-600 card-desc mt-1"></p>
    <p class="font-medium mt-2 card-price"></p>
    <button class="selectBtn bg-green-600 text-white mt-3 px-4 py-2 rounded">
      Select
    </button>
  </div>
</template>

<script>
feather.replace();

/* --------- DATA --------- */
const bundles = [
  {id:"skin_01",cat:"Alle skins",name:"Bananananito Bandito + Trippi Troppi",price:8.49,image1:"IMG_6621.webp",image2:"IMG_6622.webp",note:"9300 coin • 300 dna",sold:300},
  {id:"skin_02",cat:"Alle skins",name:"U din din din dun ma",price:5.99,image1:"IMG_6620.webp",note:"5000 coin",sold:300},

  /* ---- Old Paid Skins (blijven ook in Alle skins) ---- */
  {id:"old_01",cat:"Old Paid Skins",name:"Classic Shadow Orb",price:3.99,image1:"OLD_001.webp",note:"Legacy skin",sold:120},
  {id:"old_02",cat:"Old Paid Skins",name:"Neon Spike",price:2.99,image1:"OLD_002.webp",note:"Legacy skin",sold:95},
];

const grid = document.getElementById("grid");
const tmpl = document.getElementById("card-template");
const cart = [];
const cartCount = document.getElementById("cartCount");

function price(p){return `USD ${p.toFixed(2)}`;}

function makeCard(item){
  const el = tmpl.content.cloneNode(true);
  const imgs = el.querySelector(".imgs-row");

  const img = document.createElement("img");
  img.src = item.image1;
  img.className = item.image2 ? "small-img" : "card-img";
  imgs.appendChild(img);

  if(item.image2){
    const img2=document.createElement("img");
    img2.src=item.image2;
    img2.className="small-img";
    imgs.appendChild(img2);
  }

  el.querySelector(".card-title").textContent=item.name;
  el.querySelector(".card-cat").textContent=`Categorie: ${item.cat}`;
  el.querySelector(".card-desc").textContent=item.note;
  el.querySelector(".card-price").textContent=price(item.price);
  el.querySelector(".selectBtn").onclick=()=>{cart.push(item);cartCount.textContent=cart.length;};

  return el;
}

function render(list){
  grid.innerHTML="";
  list.forEach(i=>grid.appendChild(makeCard(i)));
}

/* ---- SORT / CATEGORY ---- */
const sortSelect=document.getElementById("sortSelect");
const original=bundles.slice();

sortSelect.addEventListener("change",()=>{
  let list=bundles.slice();

  switch(sortSelect.value){
    case "all":
      list = original.slice();
      break;
    case "low":
      list.sort((a,b)=>a.price-b.price);
      break;
    case "high":
      list.sort((a,b)=>b.price-a.price);
      break;
    case "oldpaid":
      list = bundles.filter(b=>b.cat==="Old Paid Skins");
      break;
    case "popular":
      list.sort((a,b)=>(b.sold||0)-(a.sold||0));
      break;
    case "shuffle":
      list.sort(()=>Math.random()-.5);
      break;
  }

  render(list);
});

/* ---- SEARCH ---- */
document.getElementById("navbarSearch").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase();
  render(
    bundles.filter(b =>
      b.name.toLowerCase().includes(q) ||
      b.cat.toLowerCase().includes(q)
    )
  );
});

/* INIT */
render(bundles);
</script>
</body>
</html>
