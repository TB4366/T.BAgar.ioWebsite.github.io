
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>T.B Agar.io Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #080d18;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #101a2e;
      border-bottom: 1px solid #263754;
      padding: 22px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #4ca3ff;
      letter-spacing: 1px;
    }

    .logo span {
      color: white;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .discord-button {
      background: #5865f2;
      color: white;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
    }

    .discord-button:hover {
      background: #4752c4;
    }

    .hero {
      text-align: center;
      padding: 55px 20px 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: #4ca3ff;
    }

    .hero p {
      color: #9caecc;
      font-size: 16px;
    }

    .shop-controls {
      max-width: 1250px;
      margin: 0 auto 30px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 230px;
      background: #111d31;
      border: 1px solid #2b3c58;
      color: white;
      padding: 14px 16px;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .search-box:focus {
      border-color: #4ca3ff;
    }

    .sort-select {
      background: #111d31;
      color: white;
      border: 1px solid #2b3c58;
      padding: 14px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    .products-grid {
      max-width: 1250px;
      margin: 0 auto;
      padding: 0 20px 50px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 22px;
    }

    .product-card {
      background: #111d31;
      border: 1px solid #263754;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: #4ca3ff;
    }

    .product-image-container {
      height: 230px;
      background: radial-gradient(
        circle,
        #253c61 0%,
        #142238 45%,
        #0d1729 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .product-image {
      max-width: 100%;
      max-height: 190px;
      object-fit: contain;
      transition: transform 0.2s;
    }

    .product-card:hover .product-image {
      transform: scale(1.06);
    }

    .product-info {
      padding: 20px;
    }

    .product-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .product-description {
      color: #94a8c6;
      font-size: 13px;
      line-height: 1.5;
      min-height: 40px;
      margin-bottom: 18px;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .product-price {
      color: #55d68a;
      font-size: 20px;
      font-weight: bold;
    }

    .buy-button {
      border: none;
      background: #247ce5;
      color: white;
      padding: 11px 15px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .buy-button:hover {
      background: #1764bf;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: #94a8c6;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #111d31;
      border: 1px solid #344b70;
      border-radius: 14px;
      max-width: 450px;
      width: 100%;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: transparent;
      color: #a7b7d0;
      border: none;
      font-size: 25px;
      cursor: pointer;
    }

    .modal-image {
      max-width: 190px;
      max-height: 190px;
      object-fit: contain;
      margin: 15px auto 20px;
      display: block;
    }

    .modal h2 {
      margin-bottom: 10px;
    }

    .modal p {
      color: #a5b5cd;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .modal-price {
      font-size: 26px;
      font-weight: bold;
      color: #55d68a;
      margin-bottom: 22px;
    }

    .contact-button {
      display: inline-block;
      text-decoration: none;
      background: #247ce5;
      color: white;
      padding: 13px 22px;
      border-radius: 8px;
      font-weight: bold;
    }

    footer {
      background: #101a2e;
      border-top: 1px solid #263754;
      padding: 25px;
      text-align: center;
      color: #7f91ad;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px;
      }

      .hero h1 {
        font-size: 31px;
      }

      .product-image-container {
        height: 210px;
      }

      .product-bottom {
        align-items: stretch;
        flex-direction: column;
      }

      .buy-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      T.B <span>Agar.io Shop</span>
    </div>

    <div class="header-right">
      <a
        class="discord-button"
        href="https://discord.gg/qhuXPrVzBx"
        target="_blank"
      >
        Join Discord
      </a>
    </div>
  </header>

  <section class="hero">
    <h1>Choose Your <span>Skin</span></h1>
    <p>Discover exclusive Agar.io skins from T.B.</p>
  </section>

  <div class="shop-controls">
    <input
      type="text"
      id="searchInput"
      class="search-box"
      placeholder="Search for a skin..."
      aria-label="Search skins"
    >

    <select id="sortSelect" class="sort-select" aria-label="Sort skins">
      <option value="default">Sort by</option>
      <option value="nameAsc">Name: A-Z</option>
      <option value="nameDesc">Name: Z-A</option>
      <option value="priceLow">Price: Low to High</option>
      <option value="priceHigh">Price: High to Low</option>
    </select>
  </div>

  <main id="productsGrid" class="products-grid"></main>

  <div id="buyModal" class="modal-overlay">
    <div class="modal">
      <button
        class="modal-close"
        id="closeModal"
        aria-label="Close modal"
      >
        &times;
      </button>

      <img
        id="modalImage"
        class="modal-image"
        src=""
        alt="Selected skin"
      >

      <h2 id="modalName"></h2>

      <p id="modalDescription"></p>

      <div id="modalPrice" class="modal-price"></div>

      <p>
        To purchase this skin, contact T.B. through Discord.
      </p>

      <a
        class="contact-button"
        href="https://discord.gg/qhuXPrVzBx"
        target="_blank"
      >
        Contact on Discord
      </a>
    </div>
  </div>

  <footer>
    © <span id="currentYear"></span> T.B Agar.io Shop.
    All rights reserved.
  </footer>

  <script>
    /*
      =====================================
      SKINS EN PRIJZEN
      =====================================

      image:
      - Gebruik een bestand in dezelfde map
      - Of gebruik een map zoals images/skin.webp

      price:
      - Gebruik een getal, bijvoorbeeld 1.99
    */

    const products = [
      {
        id: 1,
        name: "Dohnut",
        price: 1.99,
        image: "IMG_5334.webp",
        description: "A unique and delicious Agar.io skin."
      },

      {
        id: 2,
        name: "Pumpkitty",
        price: 1.99,
        image: "IMG_0923.webp",
        description: "A special cat-themed Agar.io skin."
      },

      {
        id: 3,
        name: "Mindseye",
        price: 1.99,
        image: "mindseye.webp",
        description: "A mysterious and powerful skin."
      },

      {
        id: 4,
        name: "Nomster",
        price: 5.99,
        image: "nomster.webp",
        description: "A monster-inspired Agar.io skin."
      },

      {
        id: 5,
        name: "Zen Shaman",
        price: 7.99,
        image: "IMG_9638.webp",
        description: "An exclusive Zen Shaman skin."
      }
    ];

    const productsGrid = document.getElementById("productsGrid");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");

    const buyModal = document.getElementById("buyModal");
    const closeModal = document.getElementById("closeModal");

    const modalImage = document.getElementById("modalImage");
    const modalName = document.getElementById("modalName");
    const modalDescription = document.getElementById("modalDescription");
    const modalPrice = document.getElementById("modalPrice");

    /*
      =====================================
      EUROPRIJS FORMATTEREN
      =====================================
    */

    function formatPrice(price) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "EUR"
      }).format(price);
    }

    /*
      =====================================
      HTML VEILIG MAKEN
      =====================================
    */

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /*
      =====================================
      SKINS WEERGEVEN
      =====================================
    */

    function renderProducts() {
      const searchTerm = searchInput.value
        .trim()
        .toLowerCase();

      const sortValue = sortSelect.value;

      let filteredProducts = products.filter(product => {
        return (
          product.name.toLowerCase().includes(searchTerm) ||
          product.description.toLowerCase().includes(searchTerm)
        );
      });

      if (sortValue === "nameAsc") {
        filteredProducts.sort((a, b) =>
          a.name.localeCompare(b.name)
        );
      }

      if (sortValue === "nameDesc") {
        filteredProducts.sort((a, b) =>
          b.name.localeCompare(a.name)
        );
      }

      if (sortValue === "priceLow") {
        filteredProducts.sort((a, b) =>
          a.price - b.price
        );
      }

      if (sortValue === "priceHigh") {
        filteredProducts.sort((a, b) =>
          b.price - a.price
        );
      }

      if (filteredProducts.length === 0) {
        productsGrid.innerHTML = `
          <div class="empty-message">
            No skins found.
          </div>
        `;

        return;
      }

      productsGrid.innerHTML = filteredProducts.map(product => {
        const originalIndex = products.findIndex(
          item => item.id === product.id
        );

        return `
          <article class="product-card">
            <div class="product-image-container">
              <img
                class="product-image"
                src="${escapeHTML(product.image)}"
                alt="${escapeHTML(product.name)}"
                loading="lazy"
                onerror="this.onerror=null; this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
                  "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='100%' height='100%' fill='#17263d'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='14'>Image missing</text></svg>"
                )}'"
              >
            </div>

            <div class="product-info">
              <h2 class="product-name">
                ${escapeHTML(product.name)}
              </h2>

              <p class="product-description">
                ${escapeHTML(product.description)}
              </p>

              <div class="product-bottom">
                <div class="product-price">
                  ${formatPrice(product.price)}
                </div>

                <button
                  class="buy-button"
                  data-product-index="${originalIndex}"
                >
                  Buy Now
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    /*
      =====================================
      BUY MODAL OPENEN
      =====================================
    */

    function openBuyModal(product) {
      modalImage.src = product.image;
      modalImage.alt = product.name;

      modalName.textContent = product.name;
      modalDescription.textContent = product.description;
      modalPrice.textContent = formatPrice(product.price);

      buyModal.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    /*
      =====================================
      BUY MODAL SLUITEN
      =====================================
    */

    function closeBuyModal() {
      buyModal.classList.remove("active");
      document.body.style.overflow = "";
    }

    /*
      =====================================
      BUY BUTTON EVENT
      =====================================
    */

    productsGrid.addEventListener("click", event => {
      const button = event.target.closest(".buy-button");

      if (!button) {
        return;
      }

      const productIndex = Number(
        button.dataset.productIndex
      );

      const product = products[productIndex];

      if (!product) {
        return;
      }

      openBuyModal(product);
    });

    /*
      =====================================
      SEARCH EN SORTERING
      =====================================
    */

    searchInput.addEventListener("input", renderProducts);
    sortSelect.addEventListener("change", renderProducts);

    /*
      =====================================
      MODAL CONTROLS
      =====================================
    */

    closeModal.addEventListener("click", closeBuyModal);

    buyModal.addEventListener("click", event => {
      if (event.target === buyModal) {
        closeBuyModal();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeBuyModal();
      }
    });

    /*
      =====================================
      JAARTAL EN EERSTE WEERGAVE
      =====================================
    */

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();

    renderProducts();
  </script>

</body>
</html>
