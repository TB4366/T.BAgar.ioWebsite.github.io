
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>T.B Agar.io Skins</title>

  <!-- jQuery is required by ogario.v4.master.js / ogario.v4.js -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top right, #075985, transparent 35%),
        #020617;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 18px 5%;
      background: rgba(2, 6, 23, 0.95);
      border-bottom: 1px solid #164e63;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #38bdf8;
    }

    .login-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font-weight: bold;
      color: white;
      background: #1877f2;
    }

    button:hover {
      background: #0d65d9;
    }

    .logout {
      background: #334155;
    }

    .profile {
      display: none;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .profile img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    main {
      width: min(1400px, 94%);
      margin: 30px auto;
    }

    .hero {
      text-align: center;
      padding: 35px 15px;
      border: 1px solid #164e63;
      border-radius: 20px;
      background: rgba(8, 47, 73, 0.35);
      margin-bottom: 25px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 52px);
    }

    .hero h1 span {
      color: #38bdf8;
    }

    .hero p {
      color: #cbd5e1;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    input,
    select {
      padding: 12px;
      color: white;
      background: #071a2e;
      border: 1px solid #28506a;
      border-radius: 9px;
      outline: none;
    }

    #search {
      flex: 1;
      min-width: 230px;
    }

    #skinCount {
      align-self: center;
      color: #94a3b8;
      font-size: 14px;
    }

    #skins {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 14px;
    }

    .skin {
      min-width: 0;
      padding: 12px 8px;
      text-align: center;
      background: linear-gradient(145deg, #08243b, #071226);
      border: 1px solid #164e63;
      border-radius: 14px;
      transition: 0.2s ease;
    }

    .skin:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 8px 25px rgba(14, 165, 233, 0.15);
    }

    .skin img {
      display: block;
      width: 100%;
      height: 105px;
      object-fit: contain;
      margin-bottom: 9px;
    }

    .skin-name {
      display: block;
      min-height: 32px;
      font-size: 13px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .skin-price {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 8px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 800;
    }

    .skin-id {
      display: block;
      margin-top: 6px;
      color: #64748b;
      font-size: 9px;
      overflow-wrap: anywhere;
    }

    .loading,
    .error,
    .empty {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      color: #cbd5e1;
    }

    .error {
      color: #fca5a5;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      color: #64748b;
      border-top: 1px solid #164e63;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      #skins {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .skin {
        padding: 8px 4px;
      }

      .skin img {
        height: 75px;
      }

      .skin-name {
        font-size: 10px;
      }
    }
  </style>
  <!-- Dependencies used by the existing Ogario scripts -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

  <!-- Your existing files: keep these filenames in the same folder as index.html -->
  <script src="ogario.v4.master.js"></script>
  <script src="ogario.v4.js"></script>

</head>

<body>

  <header>
    <div class="logo">
      T.B <span>Agar.io Skins</span>
    </div>

    <div class="login-area">
      <div id="profile" class="profile">
        <img id="profileImage" src="" alt="Profile">
        <span id="profileName"></span>
        <span id="coins">Coins: 0</span>
        <button class="logout" onclick="logoutFacebook()">Logout</button>
      </div>

      <button id="facebookLogin" onclick="loginFacebook()">
        Login with Facebook
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>All <span>Agar.io Skins</span></h1>
      <p>Explore the available Agar.io skins from the official game configuration.</p>
    </section>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search for a skin..."
        oninput="filterSkins()"
      >

      <select id="version" onchange="changeVersion()">
        <option value="v15/3032">v15/3032</option>
      </select>

      <span id="skinCount">Loading skins...</span>
    </div>

    <section id="skins">
      <div class="loading">Loading skins...</div>
    </section>
  </main>

  <footer>
    © <span id="year"></span> T.B Agar.io Skins
  </footer>

  <script>
    /*
      ==================================================
      CONFIGURATION
      ==================================================
    */

    const API =
      "https://configs-web.agario.miniclippt.com/live/";

    /*
      VUL HIER JOUW FACEBOOK APP ID IN
      Voorbeeld: "123456789012345"
    */

    let version = "v15/3032";
    let allSkins = [];

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /*
      ==================================================
      FACEBOOK LOGIN — CONNECTED TO ogario.v4.master.js
      ==================================================
      This page does NOT create a second Facebook OAuth flow.
      The button calls the Facebook implementation already inside
      ogario.v4.master.js.
    */

    function loginFacebook() {
      if (window.TBFacebook && typeof window.TBFacebook.login === "function") {
        const result = window.TBFacebook.login();
        if (result !== false) return;
      }

      // The Master script can still be initializing while the Facebook SDK loads.
      setTimeout(function () {
        if (window.TBFacebook && typeof window.TBFacebook.login === "function") {
          const result = window.TBFacebook.login();
          if (result !== false) return;
        }
        alert("Facebook login could not be started. Make sure the Facebook SDK is allowed by your browser and try again.");
      }, 1000);
    }

    function logoutFacebook() {
      if (window.TBFacebook && typeof window.TBFacebook.logout === "function") {
        window.TBFacebook.logout();
        return;
      }

      if (window.master && typeof window.master.logout === "function") {
        window.master.logout();
      }
    }

    function updateFacebookUI() {
      const loginButton = document.getElementById("facebookLogin");
      const profile = document.getElementById("profile");
      const profileName = document.getElementById("profileName");
      const profileImage = document.getElementById("profileImage");
      const coins = document.getElementById("coins");

      if (!loginButton || !profile) return;

      const bridge = window.TBFacebook;
      const loggedIn = !!(
        bridge &&
        typeof bridge.isLoggedIn === "function" &&
        bridge.isLoggedIn()
      );

      if (loggedIn) {
        const data = bridge.getProfile ? bridge.getProfile() : {};
        loginButton.style.display = "none";
        profile.style.display = "flex";
        profileName.textContent = data.name || "Facebook account";
        coins.textContent = "Coins: " + (Number(data.coins) || 0).toLocaleString();

        if (data.facebookId) {
          profileImage.src =
            "https://graph.facebook.com/" +
            encodeURIComponent(data.facebookId) +
            "/picture?type=small";
        }
      } else {
        loginButton.style.display = "block";
        profile.style.display = "none";
        profileName.textContent = "";
        profileImage.removeAttribute("src");
        coins.textContent = "Coins: 0";
      }
    }

    window.addEventListener("tb-facebook-state", updateFacebookUI);
    window.addEventListener("load", function () {
      updateFacebookUI();
      setTimeout(updateFacebookUI, 1000);
      setTimeout(updateFacebookUI, 3000);
    });

    /*
      ==================================================
      LOAD VERSIONS
      ==================================================
    */

    async function loadVersions() {
      const select =
        document.getElementById("version");

      try {
        const response = await fetch(
          "https://lmsettings.snez.org/",
          {
            headers: {
              username: "LMConfigVersion",
              password: "LMConfigVersionPass"
            }
          }
        );

        if (!response.ok) {
          throw new Error("Version request failed");
        }

        const versions = await response.json();

        select.innerHTML = "";

        Object.values(versions).forEach(function (item) {
          const cleanVersion = String(item)
            .replace(/\/$/, "");

          const option = document.createElement(
            "option"
          );

          option.value = cleanVersion;
          option.textContent = cleanVersion;

          select.appendChild(option);
        });

        if (select.options.length > 0) {
          version = select.options[
            select.options.length - 1
          ].value;

          select.value = version;
        }
      } catch (error) {
        select.innerHTML = "";

        const option = document.createElement(
          "option"
        );

        option.value = version;
        option.textContent = version;

        select.appendChild(option);
      }

      await loadSkins();
    }


    /*
      ==================================================
      LOAD ALL SKINS FROM GAME CONFIGURATION
      ==================================================

      The catalogue is built directly from the official
      GameConfiguration sections. Nothing is hardcoded:

      Gameplay - Equippable Skins -> every skin productId
      Shop - Skins               -> shop/purchase relation
      Wallet - Soft Purchases    -> current configured price
      Visual - Products          -> skin image
    */

    async function loadSkins() {
      const container = document.getElementById("skins");
      const count = document.getElementById("skinCount");

      container.innerHTML = '<div class="loading">Loading skins...</div>';
      count.textContent = "Loading...";
      allSkins = [];

      try {
        const url = API + version + "/GameConfiguration.json";
        const response = await fetch(url, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("GameConfiguration could not be loaded");
        }

        const config = await response.json();
        const gameConfig = config && config.gameConfig
          ? config.gameConfig
          : config;

        const gameplaySkins = getSectionRows(
          gameConfig,
          "Gameplay - Equippable Skins"
        );
        const shopSkins = getSectionRows(
          gameConfig,
          "Shop - Skins"
        );
        const purchases = getSectionRows(
          gameConfig,
          "Wallet - Soft Purchases"
        );
        const visualProducts = getSectionRows(
          gameConfig,
          "Visual - Products"
        );

        const purchaseById = new Map();
        purchases.forEach(function (purchase) {
          if (!purchase || purchase.id == null) return;
          purchaseById.set(String(purchase.id), purchase);
        });

        const shopByProductId = new Map();
        shopSkins.forEach(function (shop) {
          if (!shop) return;
          const productId = firstValue(shop, [
            "productIdToQuantify",
            "productId",
            "id"
          ]);
          if (productId != null && productId !== "") {
            shopByProductId.set(String(productId), shop);
          }
        });

        const visualByProductId = new Map();
        visualProducts.forEach(function (visual) {
          if (!visual) return;
          const productId = firstValue(visual, ["productId", "id"]);
          if (productId != null && productId !== "") {
            visualByProductId.set(String(productId), visual);
          }
        });

        /*
         * Use every configured gameplay skin. This intentionally does not
         * remove skins just because they are not currently in the shop.
         */
        gameplaySkins.forEach(function (skin) {
          if (!skin || skin.productId == null) return;

          const id = String(skin.productId);
          const shop = shopByProductId.get(id) || null;
          const visual = visualByProductId.get(id) || null;

          const purchaseId = findPurchaseId(skin, shop);
          const purchase = purchaseId
            ? purchaseById.get(String(purchaseId)) || null
            : null;

          const image = resolveSkinImage(skin, visual);
          const price = resolveSkinPrice(skin, shop, purchase, purchases);
          const currency = resolveCurrency(skin, shop, purchase);

          allSkins.push({
            id: id,
            image: image,
            name: resolveSkinName(skin, shop, id),
            price: price,
            currency: currency,
            purchaseId: purchaseId || ""
          });
        });

        /* Some older/newer configurations may not expose a complete
           Gameplay - Equippable Skins list. Fall back to shop entries so
           those configured products are still visible. */
        if (!allSkins.length) {
          shopSkins.forEach(function (shop) {
            if (!shop) return;
            const id = firstValue(shop, [
              "productIdToQuantify",
              "productId",
              "id"
            ]);
            if (id == null || id === "") return;

            const visual = visualByProductId.get(String(id)) || null;
            const purchaseId = findPurchaseId({}, shop);
            const purchase = purchaseId
              ? purchaseById.get(String(purchaseId)) || null
              : null;

            allSkins.push({
              id: String(id),
              image: resolveSkinImage({}, visual),
              name: resolveSkinName({}, shop, String(id)),
              price: resolveSkinPrice({}, shop, purchase, purchases),
              currency: resolveCurrency({}, shop, purchase),
              purchaseId: purchaseId || ""
            });
          });
        }

        allSkins = Array.from(
          new Map(allSkins.map(function (skin) {
            return [skin.id, skin];
          })).values()
        );

        renderSkins(allSkins);
      } catch (error) {
        console.error("[T.B Skins]", error);
        container.innerHTML =
          '<div class="error">Unable to load skins for this version.</div>';
        count.textContent = "0 skins";
      }
    }


    function getSectionRows(config, name) {
      if (!config || typeof config !== "object") return [];

      if (Array.isArray(config[name])) return config[name];

      /* Be tolerant of wrapped/nested configuration formats. */
      let found = null;

      function walk(value) {
        if (found || value == null || typeof value !== "object") return;

        if (Array.isArray(value)) {
          return;
        }

        if (Object.prototype.hasOwnProperty.call(value, name)) {
          if (Array.isArray(value[name])) found = value[name];
          return;
        }

        Object.keys(value).some(function (key) {
          walk(value[key]);
          return !!found;
        });
      }

      walk(config);
      return Array.isArray(found) ? found : [];
    }


    function firstValue(object, keys) {
      if (!object || typeof object !== "object") return null;

      for (const key of keys) {
        if (
          object[key] !== undefined &&
          object[key] !== null &&
          String(object[key]).trim() !== ""
        ) {
          return object[key];
        }
      }

      return null;
    }


    function findPurchaseId(skin, shop) {
      const objects = [shop, skin];
      const keys = [
        "purchaseId",
        "purchaseID",
        "softPurchaseId",
        "softPurchaseID",
        "referenceValue",
        "referenceId",
        "referenceID",
        "walletProductId"
      ];

      for (const object of objects) {
        const value = firstValue(object, keys);
        if (value != null) return String(value);
      }

      return "";
    }


    function resolveSkinImage(skin, visual) {
      const value = firstValue(skin, [
        "image",
        "icon",
        "skinImage",
        "visualSource"
      ]) || firstValue(visual, [
        "visualSource",
        "image",
        "icon",
        "source"
      ]);

      return value == null ? "" : String(value);
    }


    function resolveSkinName(skin, shop, id) {
      const value = firstValue(skin, [
        "displayName",
        "localizedName",
        "name",
        "skinName"
      ]) || firstValue(shop, [
        "displayName",
        "localizedName",
        "name"
      ]);

      if (value) return String(value);

      return String(id)
        .replace(/^skin[_-]?/i, "")
        .replace(/[_-]+/g, " ");
    }


    function resolveSkinPrice(skin, shop, purchase, purchases) {
      const direct = firstNumber(skin, [
        "price",
        "cost",
        "currencyAmount"
      ]);
      if (direct != null) return direct;

      const shopDirect = firstNumber(shop, [
        "price",
        "cost",
        "currencyAmount"
      ]);
      if (shopDirect != null) return shopDirect;

      const purchasePrice = firstNumber(purchase, [
        "currencyAmount",
        "price",
        "cost"
      ]);
      if (purchasePrice != null) return purchasePrice;

      /* Last-resort relation scan for configurations where Shop - Skins
         stores the purchase reference under a differently named field. */
      const possibleIds = [];
      [skin, shop].forEach(function (object) {
        if (!object || typeof object !== "object") return;
        Object.keys(object).forEach(function (key) {
          const value = object[key];
          if (
            /purchase|reference/i.test(key) &&
            (typeof value === "string" || typeof value === "number")
          ) {
            possibleIds.push(String(value));
          }
        });
      });

      for (const id of possibleIds) {
        const match = purchases.find(function (row) {
          return row && String(row.id) === id;
        });
        const price = firstNumber(match, ["currencyAmount", "price", "cost"]);
        if (price != null) return price;
      }

      return null;
    }


    function firstNumber(object, keys) {
      if (!object || typeof object !== "object") return null;

      for (const key of keys) {
        if (object[key] === undefined || object[key] === null) continue;
        const number = Number(object[key]);
        if (Number.isFinite(number)) return number;
      }

      return null;
    }


    function resolveCurrency(skin, shop, purchase) {
      const value = firstValue(purchase, [
        "currencyProductId",
        "currency"
      ]) || firstValue(shop, [
        "currencyProductId",
        "currency"
      ]) || firstValue(skin, [
        "currencyProductId",
        "currency"
      ]) || "DNA";

      return String(value).toUpperCase();
    }


    /*
      ==================================================
      DISPLAY SKINS
      ==================================================
    */

    function renderSkins(skins) {
      const container = document.getElementById("skins");
      const count = document.getElementById("skinCount");

      container.innerHTML = "";
      count.textContent = skins.length + " skins";

      if (skins.length === 0) {
        container.innerHTML =
          '<div class="empty">No skins found in the configuration.</div>';
        return;
      }

      skins.forEach(function (skin) {
        const card = document.createElement("article");
        card.className = "skin";

        const image = document.createElement("img");
        image.loading = "lazy";
        image.alt = skin.name;

        let imagePath = skin.image || "";
        if (imagePath && !/^https?:\/\//i.test(imagePath)) {
          imagePath = API + version + "/" + imagePath.replace(/^\/+/, "");
        }

        image.src = imagePath;
        image.onerror = function () {
          image.style.display = "none";
        };

        const name = document.createElement("span");
        name.className = "skin-name";
        name.textContent = skin.name;

        const price = document.createElement("span");
        price.className = "skin-price";
        price.textContent = skin.price == null
          ? "Price unavailable"
          : Number(skin.price).toLocaleString() + " " + skin.currency;

        const id = document.createElement("span");
        id.className = "skin-id";
        id.textContent = skin.id;

        card.appendChild(image);
        card.appendChild(name);
        card.appendChild(price);
        card.appendChild(id);
        container.appendChild(card);
      });
    }


        /*
      ==================================================
      SEARCH
      ==================================================
    */

    function filterSkins() {
      const query =
        document.getElementById("search")
          .value
          .toLowerCase()
          .trim();

      const filtered =
        allSkins.filter(function (skin) {
          return (
            skin.name.toLowerCase().includes(query) ||
            skin.id.toLowerCase().includes(query)
          );
        });

      renderSkins(filtered);
    }


    /*
      ==================================================
      VERSION CHANGE
      ==================================================
    */

    function changeVersion() {
      version =
        document.getElementById("version").value;

      loadSkins();
    }


    /*
      ==================================================
      START
      ==================================================
    */

    loadVersions();
  </script>

</body>
</html>
