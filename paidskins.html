<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Agar.io Skins - Buy flow</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* (stijl identiek aan jouw huidige styling — bewaar zoals voorheen) */
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;text-align:center;font-weight:bold}
h1{font-size:28px;margin:18px 0}
.sections{display:flex;justify-content:center;gap:0;margin:10px auto 18px;flex-wrap:wrap}
.section-btn{background:#111;color:#fff;border:0;border-bottom:3px solid transparent;padding:12px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.section-btn.active{color:#1683ff;border-bottom-color:#1683ff}
.version-container{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0 18px}
.version-label{font-size:18px}
#uidBar{max-width:900px;margin:8px auto 14px;display:flex;gap:8px;align-items:center;justify-content:center}
#uidBar input{padding:8px;border-radius:6px;border:1px solid #2b3946;background:#07131a;color:#9fd7ff;min-width:340px}
#uidBar button{padding:8px 12px;border-radius:6px;border:0;background:#1683ff;color:#fff;cursor:pointer}
#skins{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;padding:15px;max-width:1400px;margin:auto}
.skin{cursor:pointer;padding:8px;background:#111;border:2px solid #222;border-radius:8px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.skin:hover{border-color:#1683ff}
.skin img{width:90px;height:90px;border-radius:50%;object-fit:cover;display:block;margin-top:8px}
.skin span{display:block;margin-top:8px;font-size:13px;text-align:center}
.buy-btn{display:inline-block;margin-top:8px;background:#16a34a;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
.buy-btn.disabled{background:#666;cursor:not-allowed}
.buy-btn:hover{background:#13803d}
.not-available{margin-top:8px;color:#ff4d4d;font-weight:bold;font-size:13px}
.status{font-size:13px;color:#9bd1ff;margin-left:6px}
#agarioPages{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:20px 15px 40px}
.page-btn{background:#1683ff;color:#fff;border:0;border-radius:7px;padding:8px 12px;font-size:14px;font-weight:bold;cursor:pointer;min-width:36px;box-shadow:0 2px 5px #0008}
.page-btn.active{background:#0753a6}
.hidden{display:none}
@media(max-width:900px){ #skins{grid-template-columns:repeat(3,1fr)} }
@media(max-width:600px){ .skin img{width:80px;height:80px} #skins{grid-template-columns:repeat(4,1fr);gap:8px} }
</style>
</head>
<body>

<h1>Agar.io Skins<br>@t.bagar.io</h1>

<!-- UID input bar: user must paste their Agar.io encoded payment UID here to enable purchases -->
<div id="uidBar">
  <input id="agario_uid_input" placeholder="Paste your encoded Agar.io payment UID (xsolla token) here" aria-label="Encoded UID">
  <button id="saveUidBtn">Save UID</button>
  <span id="uidStatus" class="status"></span>
</div>

<div id="agarioSection">
  <div class="version-container">
    <span class="version-label">Version</span>
    <select id="version"></select>
  </div>

  <div id="skins">Loading skins...</div>
  <div id="agarioPages"></div>
</div>

<script>
/* Config */
const API = "https://configs-web.agario.miniclippt.com/live/";
let version = "v15/3032";

/* Explicit mapping: skinId -> xsolla product id
   Keep this empty or add permanent mappings here.
*/
const xsollaProductMap = {};

/* Load external mapping file if present (overrides embedded map) */
(async function loadXsollaProducts(){
  try{
    const resp = await fetch('/xsolla-products.json', { cache: 'no-cache' });
    if(!resp.ok) {
      console.log('[paidskins] no /xsolla-products.json (status)', resp.status);
      return;
    }
    const data = await resp.json();
    if(data && typeof data === 'object'){
      Object.assign(xsollaProductMap, data);
      console.log('[paidskins] xsollaProductMap loaded from /xsolla-products.json');
    }
  }catch(e){
    console.warn('[paidskins] failed to fetch /xsolla-products.json', e);
  }
})();

/* Helpers */
function setImageWithFallback(imgEl, filename){
  const candidates = [];
  if(API && version) candidates.push(API + version + "/" + filename);
  candidates.push(filename, "images/" + filename, "/images/" + filename);
  let idx = 0;
  imgEl.onerror = function(){
    idx++;
    if(idx < candidates.length) imgEl.src = candidates[idx];
    else {
      imgEl.onerror = null;
      imgEl.src = "data:image/svg+xml;utf8," + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='100%' height='100%' fill='#071022'/><text x='50%' y='50%' font-size='18' fill='#9bd1ff' dominant-baseline='middle' text-anchor='middle'>No image</text></svg>"
      );
    }
  };
  imgEl.src = candidates[0];
}

/* UID handling */
function updateUidStatus(){
  const input = document.getElementById('agario_uid_input');
  const status = document.getElementById('uidStatus');
  const stored = localStorage.getItem('agarioEncodedUID') || '';
  if(stored && stored.length > 10){
    window.agarioEncodedUID = stored;
    input.value = stored;
    status.textContent = 'Logged in (UID saved)';
    status.style.color = '#7ee787';
  } else if(window.agarioEncodedUID && window.agarioEncodedUID.length>10){
    status.textContent = 'Logged in (UID from page)';
    status.style.color = '#7ee787';
    input.value = window.agarioEncodedUID;
  } else {
    window.agarioEncodedUID = null;
    status.textContent = 'Not logged in — paste your encoded UID and click Save';
    status.style.color = '#9bd1ff';
    input.value = '';
  }
  if(window.allSkins) renderAgarioPage(1);
}

document.getElementById('saveUidBtn').addEventListener('click', function(){
  const val = document.getElementById('agario_uid_input').value.trim();
  if(!val || val.length < 20){
    alert('Please paste your full encoded payment UID (xsolla token) before saving.');
    return;
  }
  localStorage.setItem('agarioEncodedUID', val);
  window.agarioEncodedUID = val;
  updateUidStatus();
  alert('UID saved locally. You can now buy skins that have a linked Xsolla product ID.');
});

/* Versions select */
async function versions(){
  const s = document.getElementById("version");
  if(!s) return;
  s.innerHTML = "";
  try{
    const r = await fetch("https://lmsettings.snez.org/", { headers: { username:"LMConfigVersion", password:"LMConfigVersionPass" }});
    if(!r.ok) throw new Error("versions endpoint " + r.status);
    const v = await r.json();
    const vals = Object.values(v || {});
    vals.forEach(x=> s.add(new Option(String(x), String(x).replace(/\/$/,""))));
    if(s.options.length){ s.selectedIndex = s.options.length - 1; version = s.value; }
  }catch(err){
    const fallback = ["v15/3032"];
    fallback.forEach(x => s.add(new Option(x,x)));
    version = s.value = fallback[0];
    console.warn("versions failed, fallback used", err);
  }
  s.onchange = function(e){
    version = (e.target.value||"").replace(/\/$/,"");
    loadSkins();
    renderAgarioPage(1);
  };
  loadSkins();
}

/* Load skins */
async function loadSkins(){
  const box = document.getElementById("skins");
  box.innerHTML = "Loading skins...";
  try{
    const r = await fetch(API + version + "/GameConfiguration.json");
    const text = await r.text();
    const a = text.match(/\[(.*?)\]/g) || [];
    const str = a[25] || "";
    const ids = str.match(/productId":"(.*?)"/g) || str.match(/productId": "(.*?)"/g) || [];
    const imgs = str.match(/image":"(.*?)"/g) || str.match(/image": "(.*?)"/g) || [];
    const skins = [];
    for(let i=0;i<Math.min(ids.length, imgs.length); i++){
      const id = ids[i].replace(/"/g,"").replace(/productId:/,"").replace(/skin_/,"").replace(/id:/,"").trim();
      const img = imgs[i].replace(/"/g,"").replace(/image:/,"").trim();
      if(!img.includes("uses_spine")) skins.push([id,img]);
    }
    skins.reverse();
    window.allSkins = skins;
    renderAgarioPage(1);
  }catch(e){
    box.textContent = "Unable to load skins.";
    window.allSkins = [];
  }
}

/* Render page */
function renderAgarioPage(page){
  window.selectedSkinDiv = null;
  window.selectedSkinId = null;
  const perPage = 120;
  const box = document.getElementById("skins");
  const pages = document.getElementById("agarioPages");
  const skins = window.allSkins || [];
  const total = Math.max(1, Math.ceil(skins.length / perPage));
  box.innerHTML = "";
  const start = (page-1)*perPage;
  skins.slice(start, start+perPage).forEach(([id,img])=>{
    const d = document.createElement("div"); d.className = "skin";
    d.setAttribute("data-id", id);
    d.innerHTML = `<img alt="${id}"><span>${id.replace(/\_/g," ")}</span>`;
    setImageWithFallback(d.querySelector("img"), img);

    // Determine if this skin has an explicit Xsolla mapping
    const purchaseId = xsollaProductMap[id];

    if(purchaseId){
      // If user has UID saved, enable buy; otherwise show disabled buy with tooltip
      const buy = document.createElement('button');
      buy.className = 'buy-btn';
      buy.textContent = 'Buy';
      buy.setAttribute('data-purchase-id', purchaseId);
      if(window.agarioEncodedUID || localStorage.getItem('agarioEncodedUID')){
        buy.onclick = (e)=>{ e.stopPropagation(); startBuyFlow(purchaseId); };
      } else {
        buy.classList.add('disabled');
        buy.onclick = (e)=>{ e.stopPropagation(); alert('You must paste and save your encoded Agar.io payment UID first before buying.'); };
      }
      d.appendChild(buy);
    } else {
      const note = document.createElement('div');
      note.className = 'not-available';
      note.textContent = 'Not available';
      d.appendChild(note);
    }

    d.onclick = ()=> selectSkin(d, id);
    box.appendChild(d);
  });

  pages.innerHTML = "";
  for(let i=1;i<=total;i++){
    const b=document.createElement("button");
    b.className="page-btn"+(i===page?" active":"");
    b.textContent=i;
    b.onclick=()=>renderAgarioPage(i);
    pages.appendChild(b);
  }
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* Validate returned xsolla URL */
function validateXsollaUrl(rawUrl){
  try{
    const u = new URL(rawUrl);
    if(u.protocol !== "https:") return false;
    const h = u.hostname.toLowerCase();
    if(h !== "secure.xsolla.com") return false;
    if(!(u.pathname.startsWith("/paystation3/") || u.pathname.startsWith("/paystation4/"))) return false;
    const token = u.searchParams.get("access_token") || u.searchParams.get("token") || "";
    if(!token || token.length < 16) return false;
    return true;
  }catch(e){ return false; }
}

/* Start buy flow */
async function startBuyFlow(purchaseId){
  const token = window.agarioEncodedUID || localStorage.getItem("agarioEncodedUID") || null;
  if(!token){
    alert('You must paste and save your encoded Agar.io payment UID before buying.');
    return;
  }

  const endpoint = "https://payments.agario.miniclippt.com";
  const currency = "USD";
  const paymentRequestUrl = `${endpoint}/pay/${encodeURIComponent(token)}/${encodeURIComponent(purchaseId)}/${encodeURIComponent(currency)}`;

  try{
    const resp = await fetch(paymentRequestUrl, { method: "GET", credentials: "omit" });
    if(!resp.ok) throw new Error("Payment endpoint returned " + resp.status);
    const data = await resp.json();
    const iframeUrl = data.iframe_url || data.iframeUrl || data.iframe || null;
    if(!iframeUrl) throw new Error("No iframe_url in response");
    if(!validateXsollaUrl(iframeUrl)) throw new Error("Returned URL failed validation");
    window.open(iframeUrl, "_blank", "noopener");
  }catch(err){
    console.error("Buy flow failed:", err);
    alert("Payment request failed: " + (err && err.message ? err.message : "unknown error"));
  }
}

/* Init */
async function init(){
  // attempt to merge external overrides (may have been fetched earlier)
  try{
    const resp = await fetch('/xsolla-products.json', { cache: 'no-cache' });
    if(resp.ok){
      const data = await resp.json();
      Object.assign(xsollaProductMap, data);
      console.log('[paidskins] xsolla-products.json loaded (overrides merged)');
    } else {
      console.log('[paidskins] xsolla-products.json not found, status=', resp.status);
    }
  }catch(e){
    console.warn('[paidskins] failed to fetch /xsolla-products.json', e);
  }

  // Ensure test mappings exist at runtime so you can verify Buy buttons quickly.
  // These are runtime-only (do not persist to the file) and can be removed later.
  window.xsollaProductMap = xsollaProductMap;
  if(!window.xsollaProductMap['jumper']) window.xsollaProductMap['jumper'] = 'skin_jumper';
  if(!window.xsollaProductMap['blue_swirl']) window.xsollaProductMap['blue_swirl'] = 'skin_blue_swirl';
  console.log('[paidskins] runtime xsollaProductMap prepared', { jumper: window.xsollaProductMap['jumper'], blue_swirl: window.xsollaProductMap['blue_swirl'] });

  updateUidStatus();
  loadSkins();
  versions();
}
if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", init); } else { init(); }
</script>
