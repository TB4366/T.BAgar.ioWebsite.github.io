</button>

</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
<div class="bg-white p-6 rounded w-80">
<h2 class="font-bold mb-3">Login</h2>
<input id="loginEmail" placeholder="E-mail" class="w-full mb-2 p-2 border">
<input id="loginPass" type="password" placeholder="Wachtwoord" class="w-full mb-2 p-2 border">
<input id="loginKey" placeholder="Key" class="w-full mb-3 p-2 border">
<button onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded">Login</button>
</div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
<div class="bg-white p-6 rounded w-96">
<h2 class="font-bold mb-3">Registreren</h2>
<input id="rName" placeholder="Naam" class="w-full mb-2 p-2 border">
<input id="rEmail" placeholder="E-mail" class="w-full mb-2 p-2 border">
<input id="rUID" placeholder="Agar.io UID" class="w-full mb-2 p-2 border">
<input id="rPass" type="password" placeholder="Wachtwoord" class="w-full mb-2 p-2 border">
<input id="rPass2" type="password" placeholder="Herhaal wachtwoord" class="w-full mb-3 p-2 border">
<button onclick="register()" class="w-full bg-green-600 text-white py-2 rounded">Registreren</button>
<div id="registerResult" class="mt-3 text-center"></div>
</div>
</div>

<script>
feather.replace();

/* USERS */
let users = JSON.parse(localStorage.getItem("users")||"[]");
let currentUser = JSON.parse(localStorage.getItem("currentUser")||"null");

/* UI */
function updateUI(){
loginBtn.classList.toggle("hidden",!!currentUser);
registerBtn.classList.toggle("hidden",!!currentUser);
moneyBtn.classList.toggle("hidden",!currentUser);
}
updateUI();

/* REGISTER */
function register(){
if(!rName.value||!rEmail.value||!rUID.value||!rPass.value||!rPass2.value) return alert("Alles invullen");
if(rPass.value!==rPass2.value) return alert("Wachtwoorden kloppen niet");
const key=Math.floor(10000+Math.random()*90000);
users.push({name:rName.value,email:rEmail.value,uid:rUID.value,pass:rPass.value,key,balance:0});
localStorage.setItem("users",JSON.stringify(users));
registerResult.innerHTML=`<b>Geslaagd</b><br>Key:<br><b>${key}</b><br>Je moet deze key goed opslaan`;
}

/* LOGIN */
function login(){
const u=users.find(x=>x.email===loginEmail.value&&x.pass===loginPass.value&&x.key==loginKey.value);
if(!u) return alert("Foutieve gegevens");
currentUser=u;
localStorage.setItem("currentUser",JSON.stringify(u));
location.reload();
}
function logout(){
localStorage.removeItem("currentUser");
location.reload();
}

/* RENDER GRID */
let cart=[];
function render(list=skins){
grid.innerHTML="";
list.forEach(s=>{
const d=document.createElement("div");
d.className="bg-white p-4 rounded text-center shadow";
d.innerHTML=`<div class="img-row">
<img src="${s.image1}" class="${s.image2?'circle-small':'circle-big'}">
${s.image2?`<img src="${s.image2}" class="circle-small">`:""}
</div>
<b>${s.name}</b>
<p>${s.desc}</p>
<p>€${s.price}</p>
<button class="bg-green-600 text-white px-3 py-1 rounded mt-2">Select</button>`;
d.querySelector("button").onclick=()=>{
if(!currentUser)return alert("Login vereist");
cart.push(s);cartCount.textContent=cart.length;};
grid.appendChild(d);
});
}

search.oninput=e=>render(skins.filter(s=>s.name.toLowerCase().includes(e.target.value.toLowerCase())));
function toggleMenu(){menu.style.display=menu.style.display==="block"?"none":"block";}

render();
