<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>T.B Agar.io Skin Shop</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#f2f2f2;
font-family:sans-serif;
}

.skinCard{
position:relative;
}

.circle{
width:90px;
height:90px;
border-radius:100%;
object-fit:cover;
margin:auto;
}

.badge{
position:absolute;
top:8px;
left:8px;
background:red;
color:white;
font-size:12px;
padding:4px 8px;
border-radius:6px;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<header class="bg-black text-white p-4 flex justify-between">
<h1 class="font-bold text-xl">T.B Agar.io Paid Skins</h1>
<button id="cartBtn" class="bg-teal-500 px-4 py-2 rounded">
Cart (<span id="cartCount">0</span>)
</button>
</header>

<div class="max-w-6xl mx-auto p-4 flex gap-4">
<input id="search" class="flex-1 border p-2 rounded" placeholder="Search skins">

<select id="sort" class="border p-2 rounded">
<option value="default">Sort</option>
<option value="low">Price Low</option>
<option value="high">Price High</option>
</select>
</div>

<div id="grid" class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 p-6"></div>


<div id="cartModal" class="modal hidden">
<div class="bg-white p-6 rounded w-96">

<h2 class="text-xl font-bold mb-4">Cart</h2>

<input id="email" placeholder="Email" class="border p-2 w-full mb-2">
<input id="uid" placeholder="UID" class="border p-2 w-full mb-3">

<div id="cartItems"></div>

<div class="flex justify-between mt-4 font-bold">
<span>Total</span>
<span id="total">$0</span>
</div>

<button id="payBtn" class="bg-yellow-500 w-full mt-4 py-2 rounded">
Pay with PayPal
</button>

<button onclick="closeCart()" class="w-full mt-2 py-2 bg-gray-300 rounded">
Close
</button>

</div>
</div>


<div id="eventModal" class="modal hidden">

<div class="bg-white p-6 rounded text-center w-96">

<h2 id="eventTitle" class="text-xl font-bold mb-2"></h2>

<img id="eventImage" class="mx-auto mb-4 w-40">

<p id="eventText"></p>

<p id="eventTimer" class="font-bold mt-2"></p>

<button id="eventPay" class="bg-yellow-500 mt-4 px-4 py-2 rounded">
Pay
</button>

<button onclick="closeEvent()" class="block mt-3 mx-auto">
Close
</button>

</div>

</div>


<div id="eventBanner" class="fixed bottom-0 left-0 w-full text-white p-3 flex justify-between items-center cursor-pointer">
<img id="bannerImg" class="w-10 h-10">
<span id="bannerText"></span>
</div>


<script>


const PAYPAL_LINK="https://paypal.com/paypalme/TBYTagario"



const skins=[

{ name:"Scar", price:2.89, discount:0, image:"IMG_7141.webp" },
{ name:"Scar + Seer", price:12.99, discount:0, image:"IMG_7141.webp" },
{ name:"Bull King", price:4.29, discount:0, image:"IMG_7147.webp" },
{ name:"Birthday lol + Bull king", price:13.49, discount:0, image:"IMG_3797.webp" },
{ name:"Tiny jack + Jade", price:14.39, discount:0, image:"IMG_7143.webp" },
{ name:"Evil master", price:11.49, discount:0, image:"IMG_5443.webp" },
{ name:"Space warden + Evil master", price:21.99, discount:25, image:"IMG_7150.webp" },
{ name:"Space warden", price:6.59, discount:0, image:"IMG_7150.webp" },
{ name:"Thund", price:5.49, discount:0, image:"IMG_6185.webp" },
{ name:"King lion + Magic hat", price:23.99, discount:0, image:"IMG_7172.webp" },

{ name:"Ice Crystal", price:7.89, discount:0, image:"IMG_5938.webp" },
{ name:"Moofun", price:11.99, discount:0, image:"IMG_7227.webp" },
{ name:"Sorceress", price:7.99, discount:0, image:"IMG_7225.webp" },
{ name:"Gnome mage", price:11.99, discount:0, image:"IMG_7226.webp" },
{ name:"Steel Ram", price:11.99, discount:0, image:"IMG_6080.webp" },
{ name:"Shuriken", price:6.99, discount:0, image:"IMG_7177.webp" },
{ name:"Shuriken + Shadow", price:21.99, discount:0, image:"IMG_7177.webp" },
{ name:"Rogue samurai", price:6.89, discount:0, image:"IMG_7464.webp" },
{ name:"Cursed Skull", price:8.49, discount:0, image:"IMG_6198.webp" },
{ name:"Silver Orb", price:4.99, discount:0, image:"IMG_6199.webp" },

{ name:"Gryphon", price:6.49, discount:0, image:"IMG_7468.webp" },
{ name:"Dark wings", price:21.99, discount:0, image:"IMG_7233.webp" },
{ name:"Gryphon + Dark wings", price:11.29, discount:0, image:"IMG_7468.webp" },
{ name:"Madjawz", price:18.99, discount:0, image:"IMG_5593.webp" },
{ name:"Skull ribbon", price:5.99, discount:0, image:"IMG_6332.webp" },
{ name:"Eye patch + mega power", price:18.99, discount:0, image:"IMG_6331.webp" },
{ name:"Eye patch + amber", price:7.99, discount:0, image:"IMG_6331.webp" },
{ name:"Eye patch", price:11.99, discount:0, image:"IMG_6331.webp" },
{ name:"Karate parrot", price:2.89, discount:0, image:"IMG_7146.webp" },
{ name:"Karate parrot + Frog thai + Hard shroom", price:12.99, discount:0, image:"IMG_7146.webp" }

]



let cart=[]


const grid=document.getElementById("grid")


function render(list=skins){

grid.innerHTML=""

list.forEach((s,i)=>{

let final=s.price-(s.price*(s.discount/100))

let badge=s.discount>0?`<div class="badge">Action</div>`:""

let priceHTML=s.discount>0
?`<span class="line-through text-gray-500">$${s.price}</span>
<span class="text-green-600 font-bold">$${final.toFixed(2)}</span>`
:`<span>$${s.price}</span>`

let card=document.createElement("div")

card.className="bg-white p-4 rounded shadow skinCard text-center"

card.innerHTML=`

${badge}

<img src="${s.image}" class="circle">

<h3 class="font-bold mt-3">${s.name}</h3>

<p>${priceHTML}</p>

<button onclick="addCart(${i})" class="bg-green-600 text-white px-3 py-1 mt-2 rounded">
Add
</button>

`

grid.appendChild(card)

})

}

render()



function addCart(i){

cart.push(skins[i])
updateCart()

}



function updateCart(){

let items=document.getElementById("cartItems")

items.innerHTML=""

let total=0

cart.forEach((s,i)=>{

let final=s.price-(s.price*(s.discount/100))

total+=final

let div=document.createElement("div")

div.className="flex justify-between"

div.innerHTML=`
<span>${s.name}</span>
<button onclick="removeCart(${i})">❌</button>
`

items.appendChild(div)

})

document.getElementById("total").innerText="$"+total.toFixed(2)

document.getElementById("cartCount").innerText=cart.length

}



function removeCart(i){

cart.splice(i,1)
updateCart()

}



document.getElementById("cartBtn").onclick=()=>{

document.getElementById("cartModal").classList.remove("hidden")

}



function closeCart(){

document.getElementById("cartModal").classList.add("hidden")

}



document.getElementById("payBtn").onclick=()=>{

let email=document.getElementById("email").value
let uid=document.getElementById("uid").value

if(!email||!uid){

alert("Fill email and UID")

return

}

let total=0

cart.forEach(s=>{
total+=s.price-(s.price*(s.discount/100))
})

window.open(PAYPAL_LINK+"/"+total.toFixed(2))

}



document.getElementById("search").oninput=e=>{

let val=e.target.value.toLowerCase()

let filtered=skins.filter(s=>s.name.toLowerCase().includes(val))

render(filtered)

}



document.getElementById("sort").onchange=e=>{

let val=e.target.value

let list=[...skins]

if(val==="low") list.sort((a,b)=>a.price-b.price)

if(val==="high") list.sort((a,b)=>b.price-a.price)

render(list)

}



/* EVENT */

const event={

title:"Special Event Skin",
price:5,
image:"event.webp",
text:"Limited time skin!",
hours:2

}

const banner=document.getElementById("eventBanner")

banner.style.background="#ff5500"

document.getElementById("bannerImg").src=event.image

document.getElementById("bannerText").innerText="Limited Event Skin"

banner.onclick=()=>{

document.getElementById("eventModal").classList.remove("hidden")

document.getElementById("eventTitle").innerText=event.title

document.getElementById("eventImage").src=event.image

document.getElementById("eventText").innerText=event.text

startTimer()

}

function closeEvent(){

document.getElementById("eventModal").classList.add("hidden")

}

function startTimer(){

let end=new Date()

end.setHours(end.getHours()+event.hours)

setInterval(()=>{

let diff=end-new Date()

let h=Math.floor(diff/1000/60/60)

let m=Math.floor(diff/1000/60)%60

let s=Math.floor(diff/1000)%60

document.getElementById("eventTimer").innerText=
h+"h "+m+"m "+s+"s"

},1000)

}

document.getElementById("eventPay").onclick=()=>{

window.open(PAYPAL_LINK+"/"+event.price)

}

</script>

</body>
</html>
