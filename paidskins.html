<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.B Agar.io Paid Skins</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
  .card-img {
    width: 120px; height: 120px;
    object-fit: cover; border-radius: 9999px;
    margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .cart-badge {
    background-color: red; color: white; font-weight: bold;
    border-radius: 9999px; width: 20px; height: 20px;
    font-size: 12px; display: flex; justify-content: center; align-items: center;
    position: absolute; top: -5px; right: -5px;
  }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Navbar -->
<header class="bg-gray-900 text-white">
  <div class="max-w-6xl mx-auto flex items-center justify-between p-4 gap-4">
    <div class="flex items-center gap-3">
      <img src="https://via.placeholder.com/40" alt="Logo" class="w-10 h-10 rounded-full">
      <span class="font-bold text-lg" data-i18n="siteName">T.B Agar.io Paid Skins</span>
    </div>
    <input id="navbarSearch" type="text" placeholder="Search skins..." class="flex-1 rounded px-2 py-1 text-gray-800">
    <div class="flex items-center gap-4">
      <select id="langSelect" class="rounded text-gray-800 px-2 py-1">
        <option value="nl">Nederlands</option>
        <option value="en">English</option>
      </select>
      <button id="cartBtn" class="relative bg-teal-500 px-4 py-2 rounded flex items-center gap-2">
        <i data-feather="shopping-cart"></i>
        <span data-i18n="cart">Winkelwagen</span>
        <span id="cartCount" class="cart-badge">0</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto p-6">
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-6"></div>
</main>

<!-- Winkelwagen Modal -->
<div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
  <div class="bg-white rounded shadow-lg max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
    <h2 class="text-2xl font-bold text-center mb-4" data-i18n="yourCart">Winkelwagen</h2>
    <button id="closeModal" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
    <div id="cartItems" class="space-y-4"></div>
    <hr class="border-gray-300 my-4">
    <div class="flex justify-between font-bold text-lg mb-4">
      <span data-i18n="total">Totaal:</span>
      <span id="totalAmount">0</span>
    </div>
    <div class="flex justify-around gap-4">
      <button class="flex-1 bg-gray-200 p-4 rounded text-center" data-i18n="appleGift">Apple Gift Card</button>
      <a id="paypalBtn" target="_blank" class="flex-1 bg-yellow-400 p-4 rounded text-center text-white font-semibold">PayPal</a>
    </div>
  </div>
</div>

<template id="card-template">
  <div class="bg-white rounded shadow p-4 flex flex-col items-center text-center">
    <img src="" alt="thumb" class="card-img" />
    <h3 class="font-semibold mt-4 card-title text-lg"></h3>
    <p class="text-sm text-gray-600 mt-1 card-desc"></p>
    <p class="text-md font-medium text-gray-800 mt-2 card-price"></p>
    <div class="mt-4 flex gap-3">
      <button class="shareBtn bg-blue-500 text-white rounded px-4 py-2"></button>
      <button class="selectBtn bg-green-600 text-white rounded px-4 py-2"></button>
    </div>
  </div>
</template>

<script>
feather.replace();

// ----------- 30 SKINS HIER ONDER -----------
const bundles = [
  { id:"skin_1", name:{nl:"Jack Odoom",en:"Jack Odoom"}, price:3.99, image:"IMG_6174.webp", note:{nl:"1800 coins + Jack Odoom skin",en:"1800 coins + Jack Odoom skin"} },

  { id:"skin_10", name:{nl:"Emerald Phantom",en:"Emerald Phantom"}, price:4.29, image:"IMG_6183.webp", note:{nl:"3000 coins + Emerald Phantom",en:"3000 coins + Emerald Phantom"} },
  { id:"skin_11", name:{nl:"Inferno Eye",en:"Inferno Eye"}, price:3.99, image:"IMG_6184.webp", note:{nl:"2000 coins + Inferno Eye",en:"2000 coins + Inferno Eye"} },
  { id:"skin_12", name:{nl:"Shadow Lord",en:"Shadow Lord"}, price:6.99, image:"IMG_6185.webp", note:{nl:"7000 coins + Shadow Lord",en:"7000 coins + Shadow Lord"} },
  { id:"skin_13", name:{nl:"Electric Fury",en:"Electric Fury"}, price:5.99, image:"IMG_6186.webp", note:{nl:"5500 coins + Electric Fury",en:"5500 coins + Electric Fury"} },
  { id:"skin_14", name:{nl:"Frost King",en:"Frost King"}, price:4.99, image:"IMG_6187.webp", note:{nl:"3800 coins + Frost King",en:"3800 coins + Frost King"} },

  { id:"skin_16", name:{nl:"Dark Samurai",en:"Dark Samurai"}, price:5.79, image:"IMG_6189.webp", note:{nl:"5200 coins + Dark Samurai",en:"5200 coins + Dark Samurai"} },
  { id:"skin_17", name:{nl:"Venom Fang",en:"Venom Fang"}, price:3.69, image:"IMG_6190.webp", note:{nl:"2400 coins + Venom Fang",en:"2400 coins + Venom Fang"} },
  { id:"skin_18", name:{nl:"Royal Dragon",en:"Royal Dragon"}, price:6.29, image:"IMG_6191.webp", note:{nl:"6500 coins + Royal Dragon",en:"6500 coins + Royal Dragon"} },
  { id:"skin_19", name:{nl:"Galaxy Orb",en:"Galaxy Orb"}, price:4.59, image:"IMG_6192.webp", note:{nl:"3100 coins + Galaxy Orb",en:"3100 coins + Galaxy Orb"} },
  { id:"skin_20", name:{nl:"Storm Rider",en:"Storm Rider"}, price:5.29, image:"IMG_6193.webp", note:{nl:"4700 coins + Storm Rider",en:"4700 coins + Storm Rider"} },
  { id:"skin_21", name:{nl:"Solar Flame",en:"Solar Flame"}, price:3.89, image:"IMG_6194.webp", note:{nl:"1900 coins + Solar Flame",en:"1900 coins + Solar Flame"} },
  { id:"skin_22", name:{nl:"Titan Horn",en:"Titan Horn"}, price:6.79, image:"IMG_6195.webp", note:{nl:"7500 coins + Titan Horn",en:"7500 coins + Titan Horn"} },
  { id:"skin_23", name:{nl:"Mystic Eye",en:"Mystic Eye"}, price:2.79, image:"IMG_6196.webp", note:{nl:"1300 coins + Mystic Eye",en:"1300 coins + Mystic Eye"} },
  { id:"skin_24", name:{nl:"Fire Demon",en:"Fire Demon"}, price:5.89, image:"IMG_6197.webp", note:{nl:"5600 coins + Fire Demon",en:"5600 coins + Fire Demon"} },
  { id:"skin_25", name:{nl:"Ice Reaper",en:"Ice Reaper"}, price:4.79, image:"IMG_6198.webp", note:{nl:"4000 coins + Ice Reaper",en:"4000 coins + Ice Reaper"} },
  { id:"skin_26", name:{nl:"Steel Ghost",en:"Steel Ghost"}, price:3.59, image:"IMG_6199.webp", note:{nl:"2100 coins + Steel Ghost",en:"2100 coins + Steel Ghost"} },
  { id:"skin_27", name:{nl:"Vortex Skull",en:"Vortex Skull"}, price:5.19, image:"IMG_6200.webp", note:{nl:"4900 coins + Vortex Skull",en:"4900 coins + Vortex Skull"} },
  { id:"skin_28", name:{nl:"Oblivion Mask",en:"Oblivion Mask"}, price:6.49, image:"IMG_6201.webp", note:{nl:"6200 coins + Oblivion Mask",en:"6200 coins + Oblivion Mask"} },
  { id:"skin_29", name:{nl:"Thunder Oni",en:"Thunder Oni"}, price:5.59, image:"IMG_6202.webp", note:{nl:"5000 coins + Thunder Oni",en:"5000 coins + Thunder Oni"} },
  { id:"skin_30", name:{nl:"Crimson Flame",en:"Crimson Flame"}, price:4.39, image:"IMG_6203.webp", note:{nl:"3500 coins + Crimson Flame",en:"3500 coins + Crimson Flame"} }
];
// -------------------------------------------

const translations = {
  nl:{siteName:"T.B Agar.io Paid Skins",cart:"Winkelwagen",yourCart:"Winkelwagen",total:"Totaal:",appleGift:"Apple Gift Card",share:"Deel",select:"Selecteer"},
  en:{siteName:"T.B Agar.io Paid Skins",cart:"Cart",yourCart:"Your Cart",total:"Total:",appleGift:"Apple Gift Card",share:"Share",select:"Select"}
};

const grid=document.getElementById('grid');
const template=document.getElementById('card-template');
const cartCount=document.getElementById('cartCount');
const cartItemsContainer=document.getElementById('cartItems');
const totalAmount=document.getElementById('totalAmount');
const cartModal=document.getElementById('cartModal');
const paypalBtn=document.getElementById('paypalBtn');
const navbarSearch=document.getElementById('navbarSearch');
const langSelect=document.getElementById('langSelect');
const fallbackImg="https://via.placeholder.com/120?text=No+Image";
let cart=[];

function render(list){
  grid.innerHTML='';
  const lang = langSelect.value;
  list.forEach(item=>{
    if(!item.name[lang] || !item.image) return;
    const el = template.content.cloneNode(true);
    el.querySelector('.card-title').textContent = item.name[lang];
    el.querySelector('.card-price').textContent = `USD ${item.price}`;
    const img = el.querySelector('.card-img');
    img.src = item.image || fallbackImg;
    img.alt = item.name[lang];
    img.onerror = ()=>{ img.src = fallbackImg };
    el.querySelector('.card-desc').textContent = item.note[lang] || '';
    const shareBtn = el.querySelector('.shareBtn');
    shareBtn.textContent = translations[lang].share;
    shareBtn.addEventListener('click',()=>{
      if(navigator.share){navigator.share({title:item.name[lang],text:`Check deze bundle: ${item.name[lang]}`})} 
      else{navigator.clipboard.writeText(window.location.href+'#bundle='+encodeURIComponent(item.id)); alert('Link gekopieerd');}
    });
    const selectBtn = el.querySelector('.selectBtn');
    selectBtn.textContent = translations[lang].select;
    selectBtn.addEventListener('click',()=>{
      cart.push(item);
      cartCount.textContent=cart.length;
      alert(`${item.name[lang]} toegevoegd aan winkelwagen`);
    });
    grid.appendChild(el);
  });
}

function updateCartModal(){
  cartItemsContainer.innerHTML='';
  const lang = langSelect.value;
  cart.forEach((item,index)=>{
    const div=document.createElement('div');
    div.className='flex items-center justify-between gap-4 p-2 border rounded';
    div.innerHTML=`
      <img src="${item.image}" alt="${item.name[lang]}" class="w-16 h-16 object-cover rounded-full">
      <div class="flex-1">
        <h4 class="font-semibold">${item.name[lang]}</h4>
        <p class="text-gray-600">USD ${item.price}</p>
      </div>
      <button class="text-red-500 font-bold text-xl removeBtn">&times;</button>
    `;
    div.querySelector('.removeBtn').addEventListener('click',()=>{
      cart.splice(index,1);
      cartCount.textContent=cart.length;
      updateCartModal();
    });
    cartItemsContainer.appendChild(div);
  });
  let total = cart.reduce((acc,item)=>acc+parseFloat(item.price),0);
  totalAmount.textContent=`USD ${total.toFixed(2)}`;
  paypalBtn.href=`https://www.paypal.me/TBYTagario/${total.toFixed(2)}`;
}

document.getElementById('cartBtn').addEventListener('click',()=>{
  if(cart.length===0){alert('Je winkelwagen is leeg'); return;}
  updateCartModal();
  cartModal.classList.remove('hidden');
});

document.getElementById('closeModal').addEventListener('click',()=>{cartModal.classList.add('hidden');});

langSelect.addEventListener('change',()=>{
  const lang = langSelect.value;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(translations[lang][key]) el.textContent = translations[lang][key];
  });
  render(bundles);
});

navbarSearch.addEventListener('input',()=>{
  const q = navbarSearch.value.toLowerCase();
  render(bundles.filter(b=>{
    const lang = langSelect.value;
    return b.name[lang] && b.name[lang].toLowerCase().includes(q);
  }));
});

render(bundles);
</script>
</body>
</html>
