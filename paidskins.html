<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T.B Agar.io Skin Shop</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#f5f5f5;font-family:Arial;}

.skin{text-align:center;position:relative;}

.circle{
width:90px;
height:90px;
border-radius:100%;
object-fit:cover;
}

.imageRow{
display:flex;
justify-content:center;
gap:6px;
margin:auto;
flex-wrap:wrap;
}

.badge{
position:absolute;
top:6px;
left:6px;
background:red;
color:white;
font-size:11px;
padding:4px 8px;
border-radius:5px;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
}

.hidden{display:none;}

#eventBar{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#e53935;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
font-weight:bold;
cursor:pointer;
}

#eventSkins{
display:flex;
gap:10px;
overflow-x:auto;
}

.eventCard{
min-width:150px;
background:white;
border-radius:10px;
padding:10px;
text-align:center;
}
</style>
</head>

<body>

<header class="bg-black text-white p-4 flex justify-between">
<h1 class="font-bold">T.B Agar.io Skin Shop</h1>

<button onclick="openCart()" class="bg-teal-500 px-4 py-2 rounded">
Cart (<span id="cartCount">0</span>)
</button>
</header>

<!-- SKINS -->
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-6"></div>

<!-- CART -->
<div id="cartModal" class="modal hidden">
<div class="bg-white p-6 rounded w-96">

<h2 class="font-bold text-xl mb-3">Cart</h2>
<div id="cartItems"></div>

<div class="mt-3 font-bold">Total: €<span id="cartTotal">0</span></div>

<button onclick="checkout()" class="w-full mt-4 bg-green-600 text-white py-2 rounded">
Checkout
</button>

<button onclick="closeCart()" class="w-full mt-2 bg-gray-300 py-2 rounded">
Close
</button>

</div>
</div>

<!-- POPUP -->
<div id="popup" class="modal hidden">
<div class="bg-white p-6 rounded text-center w-72">
<p id="popupText"></p>
<button onclick="closePopup()" class="mt-3 bg-green-600 text-white px-4 py-2 rounded">OK</button>
</div>
</div>

<!-- RECEIPT -->
<div id="receiptModal" class="modal hidden">
<div class="bg-white p-6 rounded w-[350px] text-center">

<h2 class="font-bold">T.B Agar.io</h2>
<hr class="my-2">

<h3 class="font-bold">Skin Shop</h3>

<p class="text-sm mt-2">1. Save this receipt & copy ID</p>
<p class="text-sm">2. Contact @t.bagar.io or @tbagariosupportteam</p>

<hr class="my-2">

<div id="receiptItems"></div>

<hr class="my-2">

<p>Discount: -€<span id="discountTotal">0</span></p>
<p class="font-bold">TOTAL: €<span id="finalTotal">0</span></p>

<hr class="my-2">

<p>Receipt ID:</p>
<p id="receiptId" class="font-bold"></p>

<button onclick="copyID()" class="mt-2 bg-black text-white px-3 py-2 rounded w-full">Copy ID</button>
<button onclick="closeReceipt()" class="mt-2 bg-gray-300 py-2 rounded w-full">Close</button>

</div>
</div>

<!-- EVENT -->
<div id="eventFrame" class="modal hidden">
<div class="bg-white p-6 rounded w-[650px]">

<h2 class="font-bold text-xl mb-4">🔥 Grote Acties</h2>

<div id="eventSkins"></div>

<button onclick="closeEvent()" class="w-full mt-4 bg-gray-300 py-2 rounded">Close</button>

</div>
</div>

<div id="eventBar">
<span>🔥 Grote Acties</span>
<span>OPEN</span>
</div>

<script>

// ================= 30 SKINS =================
const skins = [
 {id:1,name:"Scar",desc:"3250 coins 1 skin Scar",price:2.89,image1:"IMG_7141.webp",image2:null,image3:null,sold:320,discount:25},
 {id:2,name:"Scar + Seer",desc:"30000 coins 1 skin Scar 1 skin Seer",price:12.99,image1:"IMG_7141.webp",image2:"IMG_7142.webp",image3:null,sold:280,discount:0},
 {id:3,name:"Bull King",desc:"3250 coins 1 skin bull king",price:4.29,image1:"IMG_7147.webp",image2:null,image3:null,sold:260,discount:15},
 {id:4,name:"Birthday lol + Bull king",desc:"16000 coins 1 skin birthday lol 1 skin bull king",price:13.49,image1:"IMG_3797.webp",image2:"IMG_7147.webp",image3:null,sold:240,discount:20},
 {id:5,name:"Tiny jack + Jade",desc:"30000 coins 1 skin tiny jack 1 skin jade",price:14.39,image1:"IMG_7143.webp",image2:"IMG_4913.webp",image3:null,sold:220,discount:0},
 {id:6,name:"Evil master",desc:"16000 coins 1 skin evil master",price:11.49,image1:"IMG_5443.webp",image2:null,image3:null,sold:210,discount:10},
 {id:7,name:"Space warden + Evil master",desc:"50000 coins 1 skin space warden 1 skin evil master",price:21.99,image1:"IMG_7150.webp",image2:"IMG_5443.webp",image3:null,sold:200,discount:0},
 {id:8,name:"Space warden",desc:"7000 coins 1 skin space warden",price:6.59,image1:"IMG_7150.webp",image2:null,image3:null,sold:190,discount:5},
 {id:9,name:"Thunder Eye",desc:"Electric eye",price:5.49,image1:"IMG_6185.webp",image2:null,image3:null,sold:180,discount:0},
 {id:10,name:"Night Phantom",desc:"Ghost skin",price:7.99,image1:"IMG_6186.webp",image2:"IMG_6187.webp",image3:null,sold:170,discount:10},

 {id:11,name:"Crimson Blade",desc:"Red blade skin",price:4.59,image1:"IMG_6188.webp",image2:null,image3:null,sold:165,discount:0},
 {id:12,name:"Emerald Eye",desc:"Green gem eye",price:4.39,image1:"IMG_6189.webp",image2:"IMG_6190.webp",image3:null,sold:160,discount:5},
 {id:13,name:"Storm Rider",desc:"Storm skin",price:3.49,image1:"IMG_6191.webp",image2:null,image3:null,sold:150,discount:0},
 {id:14,name:"Golden Mask",desc:"Gold premium",price:8.19,image1:"IMG_6192.webp",image2:null,image3:null,sold:145,discount:15},
 {id:15,name:"Obsidian Orb",desc:"Black stone",price:3.99,image1:"IMG_6193.webp",image2:null,image3:null,sold:140,discount:0},
 {id:16,name:"Star Burst",desc:"Star explosion",price:7.59,image1:"IMG_6194.webp",image2:null,image3:null,sold:135,discount:10},
 {id:17,name:"Vortex Core",desc:"Energy vortex",price:5.39,image1:"IMG_6195.webp",image2:"IMG_6196.webp",image3:null,sold:130,discount:0},
 {id:18,name:"Ruby Fang",desc:"Red fang",price:6.19,image1:"IMG_6197.webp",image2:null,image3:null,sold:120,discount:5},
 {id:19,name:"Cursed Skull",desc:"Cursed skin",price:8.49,image1:"IMG_6198.webp",image2:null,image3:null,sold:110,discount:0},
 {id:20,name:"Silver Orb",desc:"Silver glow",price:4.99,image1:"IMG_6199.webp",image2:null,image3:null,sold:105,discount:0},

 {id:21,name:"Bronze King",desc:"Bronze ruler",price:3.79,image1:"IMG_6200.webp",image2:null,image3:null,sold:100,discount:0},
 {id:22,name:"Fire Ball",desc:"Fire sphere",price:7.99,image1:"IMG_6201.webp",image2:null,image3:null,sold:95,discount:10},
 {id:23,name:"Aqua Lord",desc:"Water lord",price:5.49,image1:"IMG_6202.webp",image2:null,image3:null,sold:90,discount:0},
 {id:24,name:"Plasma Nova",desc:"Plasma energy",price:9.49,image1:"IMG_6203.webp",image2:"IMG_6204.webp",image3:null,sold:85,discount:15},
 {id:25,name:"Dark Samurai",desc:"Samurai skin",price:6.79,image1:"IMG_6205.webp",image2:null,image3:null,sold:80,discount:0},
 {id:26,name:"Ice Reaper",desc:"Ice skull",price:5.99,image1:"IMG_6206.webp",image2:null,image3:null,sold:75,discount:10},
 {id:27,name:"Solar Eye",desc:"Sun eye",price:4.29,image1:"IMG_6207.webp",image2:null,image3:null,sold:70,discount:0},
 {id:28,name:"Void Core",desc:"Void energy",price:8.89,image1:"IMG_6208.webp",image2:"IMG_6209.webp",image3:null,sold:65,discount:5},
 {id:29,name:"Crystal Fang",desc:"Crystal teeth",price:6.59,image1:"IMG_6210.webp",image2:null,image3:null,sold:60,discount:0},
 {id:30,name:"Phantom Glow",desc:"Glow phantom",price:7.19,image1:"IMG_6211.webp",image2:null,image3:null,sold:55,discount:10}
]

// ================= CART =================
let cart=[]

// ================= IMAGE FUNCTION =================
function renderImages(s){
let html=`<div class="imageRow">`

if(s.image1){
html+=`<img src="${s.image1}" class="circle">`
}

if(s.image2){
html+=`<img src="${s.image2}" class="circle">`
}

if(s.image3){
html+=`<img src="${s.image3}" class="circle">`
}

html+=`</div>`

return html
}

// ================= RENDER =================
function render(){
let grid=document.getElementById("grid")
grid.innerHTML=""

skins.forEach((s,i)=>{
let newPrice=(s.price*(100-s.discount)/100).toFixed(2)

grid.innerHTML+=`
<div class="bg-white p-4 rounded shadow skin">

${s.discount>0?`<div class="badge">-${s.discount}%</div>`:''}

${renderImages(s)}

<h3 class="font-bold mt-2">${s.name}</h3>

${s.discount>0 ? `
<p class="text-gray-400 line-through">€${s.price}</p>
<p class="text-green-600 font-bold">€${newPrice}</p>
` : `
<p>€${s.price}</p>
`}

<button onclick="add(${i})"
class="bg-green-600 text-white px-3 py-1 mt-2 rounded">
Add
</button>

</div>`
})
}
render()

// ================= CART =================
function openCart(){
document.getElementById("cartModal").classList.remove("hidden")
updateCart()
}
function closeCart(){
document.getElementById("cartModal").classList.add("hidden")
}

function add(i){
cart.push(i)
document.getElementById("cartCount").innerText=cart.length
showPopup("Added to cart ✔")
updateCart()
}

function remove(i){
cart.splice(i,1)
document.getElementById("cartCount").innerText=cart.length
updateCart()
}

function updateCart(){
let box=document.getElementById("cartItems")
box.innerHTML=""
let total=0

cart.forEach((i,idx)=>{
let s=skins[i]
let price=s.price*(100-s.discount)/100
total+=price

box.innerHTML+=`
<div class="flex justify-between">
<span>${s.name}</span>
<span class="text-green-600">€${price.toFixed(2)}</span>
<button onclick="remove(${idx})">❌</button>
</div>`
})

document.getElementById("cartTotal").innerText=total.toFixed(2)
}

// ================= POPUP =================
function showPopup(t){
document.getElementById("popupText").innerText=t
document.getElementById("popup").classList.remove("hidden")
}
function closePopup(){
document.getElementById("popup").classList.add("hidden")
}

// ================= CHECKOUT =================
function checkout(){

let id="TB-"+Math.floor(Math.random()*999999999)

let box=document.getElementById("receiptItems")
box.innerHTML=""

let total=0

cart.forEach(i=>{
let s=skins[i]
let price=s.price*(100-s.discount)/100
total+=price

box.innerHTML+=`
<p>${s.name} - €${price.toFixed(2)} ${s.discount>0?`(-${s.discount}%)`:''}</p>`
})

document.getElementById("finalTotal").innerText=total.toFixed(2)
document.getElementById("receiptId").innerText=id

cart=[]
document.getElementById("cartCount").innerText=0

document.getElementById("cartModal").classList.add("hidden")
document.getElementById("receiptModal").classList.remove("hidden")
}

// ================= RECEIPT =================
function closeReceipt(){
document.getElementById("receiptModal").classList.add("hidden")
}
function copyID(){
navigator.clipboard.writeText(document.getElementById("receiptId").innerText)
alert("Copied ✔")
}

// ================= EVENT =================
const eventSkinsIndex=[0,1,2,3,5,7,10,11,15,20,22,25,29]

document.getElementById("eventBar").onclick=()=>{
document.getElementById("eventFrame").classList.remove("hidden")

let box=document.getElementById("eventSkins")
box.innerHTML=""

eventSkinsIndex.forEach(i=>{
let s=skins[i]
let newPrice=(s.price*(100-s.discount)/100).toFixed(2)

box.innerHTML+=`
<div class="eventCard">

${s.discount>0?`<div class="badge">-${s.discount}%</div>`:''}

${renderImages(s)}

<p>${s.name}</p>

${s.discount>0 ? `
<p class="text-gray-400 line-through">€${s.price}</p>
<p class="text-green-600 font-bold">€${newPrice}</p>
` : `
<p>€${s.price}</p>
`}

<button onclick="add(${i})"
class="bg-green-600 text-white px-2 py-1 mt-2 rounded">
Add
</button>

</div>`
})
}

function closeEvent(){
document.getElementById("eventFrame").classList.add("hidden")
}

</script>

</body>
</html>
```
