<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>T.B Shop — Config-driven Skins</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  body { background:#f3f4f6; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  .card { background:white; border-radius:10px; box-shadow:0 6px 20px rgba(2,6,23,0.08); }
  .badge { background:#0ea5a3;color:white;padding:4px 8px;border-radius:999px;font-weight:700;font-size:12px; }
  .muted { color:#6b7280; font-size:13px; }
  #shopGrid { display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .skin-img { width:100%; height:160px; object-fit:cover; border-radius:8px; background:#e5e7eb; }
  #toast { position: fixed; right: 18px; bottom: 18px; z-index: 60; }
</style>
</head>
<body class="p-6">

<div class="max-w-6xl mx-auto">
  <header class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">T.B — Shop (config-driven)</h1>
      <div class="text-sm muted">Alleen items in GameConfiguration.json die te koop zijn (Xsolla of coins)</div>
    </div>
    <div class="flex items-center gap-3">
      <div id="loginStatus" class="text-sm muted">Niet ingelogd</div>
      <button id="fbBtn" class="px-3 py-2 bg-blue-600 text-white rounded">Login met Facebook</button>
      <button id="reloadBtn" class="px-3 py-2 bg-gray-200 rounded">Herlaad config</button>
    </div>
  </header>

  <section class="mb-4">
    <div class="flex items-center justify-between mb-3">
      <div class="text-sm muted">Beschikbare skins</div>
      <div class="text-sm muted">Saldo: <span id="coinBalance">—</span> coins</div>
    </div>

    <div id="shopGrid"></div>
  </section>

  <footer class="text-sm muted mt-8">
    <div>Let op: Xsolla aankopen openen de officiële Agar.io betalingspagina. Na betaling is server‑side validatie nodig voor echte toekenning.</div>
    <div class="mt-2">Config source: <code id="configUrlText"></code></div>
  </footer>
</div>

<div id="toast" class="hidden"></div>

<!-- Facebook SDK (will load if FB_APP_ID provided) -->
<script>
  // VERVANG HIER MET JE EIGEN FB APP ID OF LEEG LATEN ALS PAGINA AL FB SDK HEEFT
  const FB_APP_ID = 'FB_APP_ID';
</script>
<script>
  (function loadFb() {
    if (!FB_APP_ID || FB_APP_ID === 'FB_APP_ID') return;
    window.fbAsyncInit = function() {
      FB.init({ appId: FB_APP_ID, cookie: true, xfbml: false, version: 'v16.0' });
    };
    var d = document, s = 'script', id = 'facebook-jssdk';
    if (!document.getElementById(id)) {
      var js = d.createElement(s); js.id = id;
      js.src = "https://connect.facebook.net/en_US/sdk.js";
      d.head.appendChild(js);
    }
  })();
</script>

<script>
/*
  CONFIG:
  - Pas CONFIG_URL aan naar de raw GitHub URL van jouw GameConfiguration.json (raw.githubusercontent.com/.../GameConfiguration.json)
  - De code probeert flexibel producten te vinden in bekende velden.
*/
const CONFIG_URL = 'https://raw.githubusercontent.com/jimboy3100/jimboy3100.github.io/316c6283f78642ca84aec8f56b4862f1b9e0b481/agario/live/GameConfiguration.json'; // voorbeeld — pas aan indien nodig

document.getElementById('configUrlText').innerText = CONFIG_URL;

/* Local state */
let configData = null;
let fbConnected = false;
let fbId = null;
let agarioUid = localStorage.getItem('agarioEncodedUID') || '';
let coinBalance = Number(localStorage.getItem('tb_coins') || 100); // default demo coins
updateCoinDisplay();

/* Helpers */
function toast(msg, time=3000) {
  const t = document.getElementById('toast');
  t.innerHTML = `<div class="px-4 py-2 card">${msg}</div>`;
  t.classList.remove('hidden');
  setTimeout(()=> t.classList.add('hidden'), time);
}

function safeGetProducts(cfg) {
  // attempt to find array of product objects in config
  const candidates = [];
  function walk(o) {
    if (!o || typeof o !== 'object') return;
    if (Array.isArray(o)) {
      // heuristics: array of products often have objects with productId/name fields
      if (o.length && typeof o[0] === 'object' && (o[0].productId || o[0].id || o[0].name || o[0].xsollaSku)) {
        candidates.push(o);
      } else {
        // check sub-objects
        o.forEach(walk);
      }
      return;
    }
    // object
    for (const k of Object.keys(o)) {
      const v = o[k];
      if (Array.isArray(v)) walk(v);
      else if (v && typeof v === 'object') walk(v);
    }
  }
  walk(cfg);
  // choose the largest candidate array as product list
  if (candidates.length === 0) return [];
  candidates.sort((a,b)=> b.length - a.length);
  return candidates[0];
}

function buildImageUrl(product) {
  // Try config fields for an image; fallback to placeholder
  if (product.image) return product.image;
  if (product.imageUrl) return product.imageUrl;
  if (product.visual && product.visual.image) return product.visual.image;
  if (product.visual && product.visual.url) return product.visual.url;
  // nothing found
  return 'https://via.placeholder.com/420x240?text=Skin';
}

function isPurchasable(product) {
  // heuristics: xsollaSku or xsollaProjectId present -> Xsolla buy
  const hasXsolla = !!(product.xsollaSku || product.xsollaProjectId || (product.purchase && product.purchase.xsolla));
  // heuristic for coin purchase: priceCoins, price_in_coins, costCoins, or price with currency 'COINS'
  const hasCoins = !!(product.priceCoins || product.price_in_coins || (product.price && product.price.currency === 'COINS') || (product.purchase && product.purchase.coins));
  return hasXsolla || hasCoins;
}

/* Render */
async function loadAndRender() {
  document.getElementById('shopGrid').innerHTML = '<div class="muted">Config laden…</div>';
  try {
    const res = await fetch(CONFIG_URL);
    if (!res.ok) throw new Error('Config ophalen faalde: ' + res.status);
    const cfg = await res.json();
    configData = cfg;
    const products = safeGetProducts(cfg);
    const purchasable = products.filter(isPurchasable);
    // Remove duplicates by productId
    const unique = [];
    const seen = new Set();
    for (const p of purchasable) {
      const pid = p.productId || p.id || p.sku || p.name;
      if (!pid) continue;
      if (seen.has(pid)) continue;
      seen.add(pid);
      unique.push(p);
    }
    if (unique.length === 0) {
      document.getElementById('shopGrid').innerHTML = '<div class="muted">Geen te koop staande skins gevonden in de config.</div>';
      return;
    }
    renderProducts(unique);
  } catch (err) {
    console.error(err);
    document.getElementById('shopGrid').innerHTML = `<div class="muted">Kon config niet laden: ${err.message}</div>`;
  }
}

function renderProducts(products) {
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  products.forEach(product => {
    const pid = product.productId || product.id || product.sku || product.name;
    const name = product.name || product.displayName || pid;
    // determine price type/amount
    let priceText = '';
    let isXsolla = false;
    let isCoins = false;
    let coinsCost = 0;
    if (product.xsollaSku || product.xsollaProjectId || (product.purchase && product.purchase.xsolla)) {
      isXsolla = true;
      // try to display price if available in config
      if (product.price && product.price.amount) priceText = `€${Number(product.price.amount).toFixed(2)}`;
      else priceText = 'Betaling via Xsolla';
    }
    if (product.priceCoins || product.price_in_coins || (product.price && product.price.currency === 'COINS') || (product.purchase && product.purchase.coins)) {
      isCoins = true;
      coinsCost = product.priceCoins || product.price_in_coins || (product.price && product.price.amount) || (product.purchase && product.purchase.coins) || 0;
      priceText = `${coinsCost} coins`;
    }
    // If both present, show both options
    const imgUrl = buildImageUrl(product);

    const card = document.createElement('div');
    card.className = 'card p-4';
    card.innerHTML = `
      <img class="skin-img mb-3" src="${imgUrl}" alt="${escapeHtml(name)}" onerror="this.style.opacity=0.4">
      <div class="flex items-center justify-between mb-2">
        <div class="font-semibold">${escapeHtml(name)}</div>
        <div>${priceText ? `<span class="badge">${escapeHtml(priceText)}</span>` : ''}</div>
      </div>
      <div class="text-sm muted mb-3">${escapeHtml(product.description || product.summary || '')}</div>
      <div class="flex gap-2">
        ${isXsolla ? `<button class="xs-buy bg-blue-600 text-white px-3 py-2 rounded" data-pid="${escapeHtml(pid)}">Buy (Xsolla)</button>` : ''}
        ${isCoins ? `<button class="coin-buy bg-green-600 text-white px-3 py-2 rounded" data-cost="${coinsCost}" data-pid="${escapeHtml(pid)}">Buy (${coinsCost} coins)</button>` : ''}
      </div>
    `;
    grid.appendChild(card);
  });

  // Attach listeners
  Array.from(document.querySelectorAll('.xs-buy')).forEach(b=>{
    b.addEventListener('click', (e)=>{
      const pid = e.target.getAttribute('data-pid');
      xsollaBuyFlow(pid);
    });
  });
  Array.from(document.querySelectorAll('.coin-buy')).forEach(b=>{
    b.addEventListener('click', (e)=>{
      const pid = e.target.getAttribute('data-pid');
      const cost = Number(e.target.getAttribute('data-cost') || 0);
      coinBuyFlow(pid, cost);
    });
  });
}

/* Purchase flows */
async function ensureFbLogged() {
  // If page already has FB SDK and user logged in, try to pick that up
  if (window.FB && typeof FB.getLoginStatus === 'function') {
    return new Promise(resolve => {
      FB.getLoginStatus(function(resp) {
        if (resp && resp.status === 'connected') {
          fbConnected = true;
          fbId = resp.authResponse.userID;
          localStorage.setItem('agarioFbId', fbId);
          localStorage.setItem('agarioFbToken', resp.authResponse.accessToken);
          updateLoginUI();
          resolve(true);
        } else {
          // open FB login
          FB.login(function(loginRes) {
            if (loginRes && loginRes.authResponse) {
              fbConnected = true;
              fbId = loginRes.authResponse.userID;
              localStorage.setItem('agarioFbId', fbId);
              localStorage.setItem('agarioFbToken', loginRes.authResponse.accessToken);
              updateLoginUI();
              resolve(true);
            } else resolve(false);
          }, {scope:'public_profile,email'});
        }
      });
    });
  } else if (FB_APP_ID && FB_APP_ID !== 'FB_APP_ID') {
    // load SDK and then call ensureFbLogged again
    await new Promise(res => { setTimeout(res, 800); });
    if (window.FB) return ensureFbLogged();
    alert('Facebook SDK niet beschikbaar — zorg dat FB_APP_ID juist is of dat de hostpagina FB laadt.');
    return false;
  } else {
    // fallback: ask user to paste FB id (not ideal)
    const manual = prompt('Geen Facebook SDK beschikbaar. Plak je Facebook ID (of klik Annuleren):', '') || '';
    if (manual.trim()) {
      fbConnected = true;
      fbId = manual.trim();
      localStorage.setItem('agarioFbId', fbId);
      updateLoginUI();
      return true;
    }
    return false;
  }
}

async function xsollaBuyFlow(productId) {
  // require FB login first
  const ok = await ensureFbLogged();
  if (!ok) { toast('Facebook login vereist om te kopen.'); return; }

  // try to use agarioEncodedUID if present (official client)
  let uid = window.agarioEncodedUID || localStorage.getItem('agarioEncodedUID') || '';
  if (!uid) {
    const want = confirm('Geen Agar.io payment UID gevonden. Wil je je UID nu plakken (aanbevolen) of doorgaan zonder?');
    if (want) {
      const pasted = prompt('Plak je Agar.io payment UID (xsollaToken):', '') || '';
      if (pasted.trim()) { uid = pasted.trim(); localStorage.setItem('agarioEncodedUID', uid); }
    }
  }

  // Build payment URL and open in new tab
  const endpoint = 'https://payments.agario.miniclippt.com/pay';
  const paymentUrl = `${endpoint}/${encodeURIComponent(uid || '')}/${encodeURIComponent(productId)}/EUR`;
  window.open(paymentUrl, '_blank');
  toast('Betalingspagina geopend — voltooi de checkout in het nieuwe tabblad.');

  // optional: ask to locally assign (simulation) after opening
  setTimeout(() => {
    if (confirm('Wil je deze skin lokaal toewijzen aan je Facebook-account (simulatie)?')) {
      grantToFb(fbId, productId);
      toast('Skin lokaal toegewezen (simulatie).');
    }
  }, 800);
}

async function coinBuyFlow(productId, cost) {
  const ok = await ensureFbLogged();
  if (!ok) { toast('Facebook login vereist om te kopen.'); return; }

  if (coinBalance < cost) { toast('Onvoldoende coins.'); return; }

  if (!confirm(`Bevestig aankoop van ${productId} voor ${cost} coins?`)) return;

  coinBalance -= cost;
  localStorage.setItem('tb_coins', coinBalance);
  updateCoinDisplay();

  // grant locally
  grantToFb(fbId, productId);
  toast('Aankoop geslaagd en lokaal toegewezen (simulatie).');
}

/* local grant helper */
function grantToFb(fbIdArg, pid) {
  if (!fbIdArg) { console.warn('Geen fbId voor toekenning.'); return; }
  const key = 'lm_fb_grants';
  const grants = JSON.parse(localStorage.getItem(key) || '{}');
  if (!Array.isArray(grants[fbIdArg])) grants[fbIdArg] = [];
  if (!grants[fbIdArg].includes(pid)) grants[fbIdArg].push(pid);
  localStorage.setItem(key, JSON.stringify(grants));
}

/* UI events */
document.getElementById('fbBtn').addEventListener('click', async () => {
  const ok = await ensureFbLogged();
  if (ok) toast('Facebook: ingelogd als ' + fbId);
  else toast('Facebook login niet voltooid');
});

document.getElementById('reloadBtn').addEventListener('click', () => loadAndRender());

function updateCoinDisplay() {
  document.getElementById('coinBalance').innerText = Number(coinBalance).toFixed(0);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Init */
loadAndRender();
updateLoginUI();

/* Update login UI display from stored state */
function updateLoginUI() {
  const st = document.getElementById('loginStatus');
  const fb = localStorage.getItem('agarioFbId') || null;
  if (fb) {
    st.innerText = 'Ingelogd: FB ' + fb;
    document.getElementById('fbBtn').innerText = 'Logout FB';
    document.getElementById('fbBtn').onclick = () => {
      // simple logout: remove stored fb items
      localStorage.removeItem('agarioFbId');
      localStorage.removeItem('agarioFbToken');
      fbConnected = false; fbId = null;
      updateLoginUI();
      toast('Facebook: uitgelogd (lokale sessie).');
      // call FB.logout if SDK present
      if (window.FB && typeof FB.logout === 'function') FB.logout(() => {});
    };
  } else {
    st.innerText = 'Niet ingelogd';
    document.getElementById('fbBtn').innerText = 'Login met Facebook';
    document.getElementById('fbBtn').onclick = async () => {
      const ok = await ensureFbLogged();
      if (ok) toast('Facebook ingelogd: ' + fbId);
      else toast('Facebook login mislukte of geannuleerd.');
    };
  }
}
</script>
</body>
</html>
