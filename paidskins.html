<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T.B Agar.io Skin Shop</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#f5f5f5;font-family:Arial;}

.skin{text-align:center;position:relative;}
.circle{width:90px;height:90px;border-radius:100%;object-fit:cover;margin:auto;}
.badge{position:absolute;top:6px;left:6px;background:red;color:white;font-size:11px;padding:4px 8px;border-radius:5px;}

.modal{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
backdrop-filter: blur(5px);
}

.hidden{display:none;}

#eventBar{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#e53935;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
cursor:pointer;
font-weight:bold;
z-index:50;
}

#eventSkins{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:10px;
}

.eventCard{
min-width:160px;
background:white;
border-radius:10px;
padding:10px;
text-align:center;
}

.original-price{text-decoration:line-through;color:#777;margin-left:5px;}
</style>
</head>

<body>

<header class="bg-black text-white p-4 flex justify-between">
<h1 class="font-bold">T.B Agar.io Skin Shop</h1>

<button onclick="openCart()" class="bg-teal-500 px-4 py-2 rounded">
Cart (<span id="cartCount">0</span>)
</button>
</header>

<!-- GRID -->
<div id="grid" class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 p-6"></div>

<!-- CART -->
<div id="cartModal" class="modal hidden">
<div class="bg-white p-6 rounded w-96">

<h2 class="text-xl font-bold mb-3">Cart</h2>
<div id="cartItems"></div>

<div class="mt-3 font-bold">
Total: <span id="cartTotal">$0</span>
</div>

<button onclick="checkout()" class="w-full mt-4 bg-green-600 text-white py-2 rounded">
Checkout
</button>

<button onclick="closeCart()" class="w-full mt-2 bg-gray-300 py-2 rounded">
Close
</button>

</div>
</div>

<!-- RECEIPT -->
<div id="receiptModal" class="modal hidden">
<div class="bg-white p-6 rounded w-[350px] text-center">

<h2 class="font-bold text-lg">T.B Agar.io</h2>
<div class="border-t my-2"></div>

<h3 class="font-bold">Skin Shop</h3>

<div class="border-t my-2"></div>

<p class="font-bold">INSTRUCTIONS</p>
<p class="text-sm">1. Save receipt & copy ID</p>
<p class="text-sm">2. Contact @t.bagar.io or @tbagariosupportteam</p>

<div class="border-t my-2"></div>

<div id="receiptItems"></div>

<div class="border-t my-2"></div>

<p>Discount: -€<span id="discountTotal">0</span></p>
<p class="font-bold">TOTAL: €<span id="finalTotal">0</span></p>

<div class="border-t my-2"></div>

<p class="text-sm">Receipt ID:</p>
<p id="receiptId" class="font-bold"></p>

<button onclick="copyID()" class="mt-3 bg-black text-white px-3 py-2 rounded">
Copy ID
</button>

<button onclick="closeReceipt()" class="mt-2 bg-gray-300 px-3 py-2 rounded w-full">
Close
</button>

</div>
</div>

<script>

// ================= 30 SKINS =================
const skins=[
{ name:"Scar", price:2.89, discount:25 },
{ name:"Scar + Seer", price:12.99, discount:0 },
{ name:"Bull King", price:4.29, discount:15 },
{ name:"Birthday lol + Bull king", price:13.49, discount:20 },
{ name:"Tiny jack + Jade", price:14.39, discount:0 },
{ name:"Evil master", price:11.49, discount:10 },
{ name:"Space warden + Evil master", price:21.99, discount:0 },
{ name:"Space warden", price:6.59, discount:5 },
{ name:"Thund", price:5.49, discount:0 },
{ name:"King lion + Magic hat", price:23.99, discount:10 },
{ name:"Ice Crystal", price:7.89, discount:0 },
{ name:"Moofun", price:11.99, discount:15 },
{ name:"Sorceress", price:7.99, discount:0 },
{ name:"Gnome mage", price:11.99, discount:10 },
{ name:"Steel Ram", price:11.99, discount:0 },
{ name:"Shuriken", price:6.99, discount:5 },
{ name:"Shuriken + Shadow", price:21.99, discount:0 },
{ name:"Rogue samurai", price:6.89, discount:0 },
{ name:"Cursed Skull", price:8.49, discount:0 },
{ name:"Silver Orb", price:4.99, discount:0 },
{ name:"Gryphon", price:6.49, discount:10 },
{ name:"Dark wings", price:21.99, discount:0 },
{ name:"Gryphon + Dark wings", price:11.29, discount:5 },
{ name:"Madjawz", price:18.99, discount:0 },
{ name:"Skull ribbon", price:5.99, discount:0 },
{ name:"Eye patch + mega power", price:18.99, discount:20 },
{ name:"Eye patch + amber", price:7.99, discount:0 },
{ name:"Eye patch", price:11.99, discount:10 },
{ name:"Karate parrot", price:2.89, discount:0 },
{ name:"Karate parrot + Frog thai + Hard shroom", price:12.99, discount:15 }
]

// ================= EVENT: GROTE ACTIES =================
const events=[
{
title:"🔥 Grote Acties",
start:new Date(Date.now()-1000),
end:new Date(Date.now()+3600000*24),
skins:skins.map(s=>s.name) // ALLE 30 SKINS IN EVENT
}
]

// ================= CART =================
let cart=[]

// ================= RENDER =================
const grid=document.getElementById("grid")

function renderSkins(){
grid.innerHTML=""

skins.forEach((s,i)=>{
let price=(s.price*(100-s.discount)/100).toFixed(2)

grid.innerHTML+=`
<div class="bg-white p-4 rounded shadow skin">
${s.discount>0?`<div class="badge">-${s.discount}%</div>`:''}
<h3 class="font-bold mt-2">${s.name}</h3>
<p>$${price}</p>

<button onclick="addCart(${i})"
class="bg-green-600 text-white px-3 py-1 mt-2 rounded">
Add
</button>
</div>`
})
}

renderSkins()

// ================= CART =================
function openCart(){
document.getElementById("cartModal").classList.remove("hidden")
updateCart()
}

function closeCart(){
document.getElementById("cartModal").classList.add("hidden")
}

function addCart(i){
cart.push(i)
document.getElementById("cartCount").innerText=cart.length
updateCart()
}

function removeItem(index){
cart.splice(index,1)
updateCart()
document.getElementById("cartCount").innerText=cart.length
}

function updateCart(){
let box=document.getElementById("cartItems")
box.innerHTML=""

let total=0

cart.forEach((i,idx)=>{
let s=skins[i]
let price=s.price*(100-s.discount)/100
total+=price

box.innerHTML+=`
<div class="flex justify-between">
<span>${s.name}</span>
<span>$${price.toFixed(2)}</span>
<button onclick="removeItem(${idx})">❌</button>
</div>`
})

document.getElementById("cartTotal").innerText="$"+total.toFixed(2)
}

// ================= CHECKOUT =================
function checkout(){
let id="TB-"+Math.floor(Math.random()*999999999)

let discount=0
let total=0

let box=document.getElementById("receiptItems")
box.innerHTML=""

cart.forEach(i=>{
let s=skins[i]
let final=s.price*(100-s.discount)/100
discount+=s.price-final
total+=final

box.innerHTML+=`<p>${s.name} - €${final.toFixed(2)}</p>`
})

document.getElementById("discountTotal").innerText=discount.toFixed(2)
document.getElementById("finalTotal").innerText=total.toFixed(2)
document.getElementById("receiptId").innerText=id

cart=[]
document.getElementById("cartCount").innerText=0

document.getElementById("cartModal").classList.add("hidden")
document.getElementById("receiptModal").classList.remove("hidden")
}

// ================= RECEIPT =================
function closeReceipt(){
document.getElementById("receiptModal").classList.add("hidden")
}

function copyID(){
navigator.clipboard.writeText(document.getElementById("receiptId").innerText)
alert("Copied ✔")
}

</script>

</body>
</html>
