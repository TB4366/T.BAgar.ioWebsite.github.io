<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T.B Agar.io Skin Shop</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#f5f5f5;font-family:Arial;}
.skin{position:relative;text-align:center;}
.circle{width:90px;height:90px;border-radius:100%;object-fit:cover;margin:auto;transition:0.3s;}
.badge{position:absolute;top:6px;left:6px;background:red;color:white;font-size:11px;padding:4px 8px;border-radius:5px;}
.action-btn{background:red;color:white;padding:4px 8px;border-radius:4px;margin-top:5px;}
.original-price{text-decoration:line-through;color:#777;margin-left:5px;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;}
.hidden{display:none;}
.event-banner{background:#e53935;color:white;padding:6px 10px;display:flex;justify-content:space-between;margin-bottom:5px;cursor:pointer;}
</style>
</head>

<body>

<header class="bg-black text-white p-4 flex justify-between">
<h1 class="font-bold">T.B Agar.io Paid Skins</h1>
<button id="cartBtn" class="bg-teal-500 px-4 py-2 rounded">
Cart (<span id="cartCount">0</span>)
</button>
</header>

<div class="max-w-6xl mx-auto p-4 flex gap-4">
<input id="search" class="border p-2 flex-1 rounded" placeholder="Search skins">
<select id="sort" class="border p-2 rounded">
<option value="default">Sort</option>
<option value="low">Price low</option>
<option value="high">Price high</option>
</select>

<button onclick="renderSkins()" class="bg-gray-600 text-white px-3 rounded">
All
</button>
</div>

<div id="eventsContainer" class="max-w-6xl mx-auto p-2"></div>

<div id="grid" class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 p-6"></div>

<!-- CART -->
<div id="cartModal" class="modal hidden">
<div class="bg-white p-6 rounded w-96">
<h2 class="text-xl font-bold mb-3">Cart</h2>

<input id="email" placeholder="Email" class="border p-2 w-full mb-2">
<input id="uid" placeholder="UID" class="border p-2 w-full mb-3">

<div id="cartItems"></div>

<div class="flex justify-between mt-3 font-bold">
<span>Total</span>
<span id="total">$0</span>
</div>

<button id="payBtn" class="bg-yellow-500 w-full mt-4 py-2 rounded">
Pay with PayPal
</button>

<button onclick="closeCart()" class="w-full mt-2 py-2 bg-gray-300 rounded">
Close
</button>
</div>
</div>

<!-- EVENT POPUP -->
<div id="eventModal" class="modal hidden">
<div class="bg-white p-6 rounded w-[600px]">
<h2 id="eventTitle" class="text-xl font-bold mb-4"></h2>
<div id="eventSkins" class="grid grid-cols-2 gap-4"></div>
<button onclick="closeEvent()" class="w-full mt-4 py-2 bg-gray-300 rounded">Close</button>
</div>
</div>

<script>

// ==== PAYPAL ====
const PAYPAL="https://paypal.com/paypalme/TBYTagario"

// ==== SKINS (30) ====
const skins=[
{ name:"Scar", price:2.89, image1:"IMG_7141.webp", image2:"IMG_7141b.webp", discount:25 },
{ name:"Scar + Seer", price:12.99, image1:"IMG_7141.webp", image2:"IMG_7141b.webp", discount:0 },
{ name:"Bull King", price:4.29, image1:"IMG_7147.webp", image2:"IMG_7147b.webp", discount:15 },
{ name:"Birthday lol + Bull king", price:13.49, image1:"IMG_3797.webp", image2:"IMG_3797b.webp", discount:20 },
{ name:"Tiny jack + Jade", price:14.39, image1:"IMG_7143.webp", image2:"IMG_7143b.webp", discount:0 },
{ name:"Evil master", price:11.49, image1:"IMG_5443.webp", image2:"IMG_5443b.webp", discount:10 },
{ name:"Space warden + Evil master", price:21.99, image1:"IMG_7150.webp", image2:"IMG_7150b.webp", discount:0 },
{ name:"Space warden", price:6.59, image1:"IMG_7150.webp", image2:"IMG_7150b.webp", discount:5 },
{ name:"Thund", price:5.49, image1:"IMG_6185.webp", image2:"IMG_6185b.webp", discount:0 },
{ name:"King lion + Magic hat", price:23.99, image1:"IMG_7172.webp", image2:"IMG_7172b.webp", discount:10 },
{ name:"Ice Crystal", price:7.89, image1:"IMG_5938.webp", image2:"IMG_5938b.webp", discount:0 },
{ name:"Moofun", price:11.99, image1:"IMG_7227.webp", image2:"IMG_7227b.webp", discount:15 },
{ name:"Sorceress", price:7.99, image1:"IMG_7225.webp", image2:"IMG_7225b.webp", discount:0 },
{ name:"Gnome mage", price:11.99, image1:"IMG_7226.webp", image2:"IMG_7226b.webp", discount:10 },
{ name:"Steel Ram", price:11.99, image1:"IMG_6080.webp", image2:"IMG_6080b.webp", discount:0 },
{ name:"Shuriken", price:6.99, image1:"IMG_7177.webp", image2:"IMG_7177b.webp", discount:5 },
{ name:"Shuriken + Shadow", price:21.99, image1:"IMG_7177.webp", image2:"IMG_7177b.webp", discount:0 },
{ name:"Rogue samurai", price:6.89, image1:"IMG_7464.webp", image2:"IMG_7464b.webp", discount:0 },
{ name:"Cursed Skull", price:8.49, image1:"IMG_6198.webp", image2:"IMG_6198b.webp", discount:0 },
{ name:"Silver Orb", price:4.99, image1:"IMG_6199.webp", image2:"IMG_6199b.webp", discount:0 },
{ name:"Gryphon", price:6.49, image1:"IMG_7468.webp", image2:"IMG_7468b.webp", discount:10 },
{ name:"Dark wings", price:21.99, image1:"IMG_7233.webp", image2:"IMG_7233b.webp", discount:0 },
{ name:"Gryphon + Dark wings", price:11.29, image1:"IMG_7468.webp", image2:"IMG_7468b.webp", discount:5 },
{ name:"Madjawz", price:18.99, image1:"IMG_5593.webp", image2:"IMG_5593b.webp", discount:0 },
{ name:"Skull ribbon", price:5.99, image1:"IMG_6332.webp", image2:"IMG_6332b.webp", discount:0 },
{ name:"Eye patch + mega power", price:18.99, image1:"IMG_6331.webp", image2:"IMG_6331b.webp", discount:20 },
{ name:"Eye patch + amber", price:7.99, image1:"IMG_6331.webp", image2:"IMG_6331b.webp", discount:0 },
{ name:"Eye patch", price:11.99, image1:"IMG_6331.webp", image2:"IMG_6331b.webp", discount:10 },
{ name:"Karate parrot", price:2.89, image1:"IMG_7146.webp", image2:"IMG_7146b.webp", discount:0 },
{ name:"Karate parrot + Frog thai + Hard shroom", price:12.99, image1:"IMG_7146.webp", image2:"IMG_7146b.webp", discount:15 }
]

// ==== EVENTS ====
const events=[
{
title:"Double Coins",
start:new Date(new Date().getTime()+5000),
end:new Date(new Date().getTime()+3600*1000*48),
skins:["Scar","Bull King","Moofun"]
},
{
title:"Halloween Special",
start:new Date(new Date().getTime()+3600*1000*10),
end:new Date(new Date().getTime()+3600*1000*60),
skins:["Evil master","Shuriken","Gryphon"]
}
]

// ==== HELPERS ====
function getEventStatus(ev){
let now=new Date()
if(now < ev.start) return "coming"
if(now >= ev.start && now <= ev.end) return "active"
return "ended"
}

// ==== RENDER SKINS ====
const grid=document.getElementById("grid")

function renderSkins(list=skins){
grid.innerHTML=""
list.forEach((s,i)=>{
let div=document.createElement("div")
div.className="bg-white p-4 rounded shadow skin"

let discounted=s.discount>0?(s.price*(100-s.discount)/100):s.price

div.innerHTML=`
${s.discount>0?`<div class="badge">-${s.discount}%</div>`:''}
<img src="${s.image1}" class="circle"
onmouseover="this.src='${s.image2}'"
onmouseout="this.src='${s.image1}'">

<h3 class="font-bold mt-2">${s.name}</h3>

<p>
${s.discount>0?
`<span class="original-price">$${s.price}</span> $${discounted.toFixed(2)}`
:`$${s.price.toFixed(2)}`}
</p>

<button onclick="addCart(${i})"
class="bg-green-600 text-white px-3 py-1 mt-2 rounded">
Add
</button>
`

grid.appendChild(div)
})
}

renderSkins()

// ==== EVENT UI ====
function renderEvents(){
const container=document.getElementById("eventsContainer")
container.innerHTML=""

events.forEach((ev,i)=>{
let status=getEventStatus(ev)
if(status==="ended") return

let div=document.createElement("div")
div.className="event-banner"

div.innerHTML=`
<span>${ev.title} - ${status==="coming"?"Coming Soon":"Active"}</span>
<span id="timer${i}"></span>
`

div.onclick=()=>showEvent(ev)

container.appendChild(div)

function update(){
let now=new Date()

if(status==="coming"){
let diff=ev.start-now
document.getElementById("timer"+i).innerText="Starts soon"
if(diff<=0) renderEvents()
return
}

if(status==="active"){
let diff=ev.end-now
let h=Math.floor(diff/(1000*60*60))
let m=Math.floor(diff/(1000*60)%60)
let s=Math.floor(diff/1000%60)
document.getElementById("timer"+i).innerText=
`Ends in ${h}h ${m}m ${s}s`
if(diff<=0) renderEvents()
}
}

setInterval(update,1000)
update()
})
}

renderEvents()

// ==== EVENT POPUP ====
function showEvent(ev){
document.getElementById("eventModal").classList.remove("hidden")
document.getElementById("eventTitle").innerText=ev.title

let container=document.getElementById("eventSkins")
container.innerHTML=""

let list=skins.filter(s=>ev.skins.includes(s.name))

list.forEach(s=>{
let price=(s.price*(100-(s.discount+10))/100).toFixed(2)

let div=document.createElement("div")
div.className="text-center"

div.innerHTML=`
<div class="badge">EVENT -${s.discount+10}%</div>
<img src="${s.image1}" class="circle">
<p>${s.name}</p>
<p>$${price}</p>
`

container.appendChild(div)
})
}

function closeEvent(){
document.getElementById("eventModal").classList.add("hidden")
}

// ==== CART ====
let cart=[]

function addCart(i){ cart.push(skins[i]); updateCart() }

function updateCart(){
let items=document.getElementById("cartItems")
items.innerHTML=""
let total=0

cart.forEach((s,i)=>{
let price=s.discount>0?(s.price*(100-s.discount)/100):s.price
total+=price

items.innerHTML+=`
<div class="flex justify-between">
<span>${s.name} - $${price.toFixed(2)}</span>
<button onclick="removeCart(${i})">❌</button>
</div>`
})

document.getElementById("total").innerText="$"+total.toFixed(2)
document.getElementById("cartCount").innerText=cart.length
}

function removeCart(i){ cart.splice(i,1); updateCart() }

document.getElementById("cartBtn").onclick=
()=>document.getElementById("cartModal").classList.remove("hidden")

function closeCart(){
document.getElementById("cartModal").classList.add("hidden")
}

document.getElementById("payBtn").onclick=()=>{
let total=0
cart.forEach(s=>{
total+=s.discount>0?(s.price*(100-s.discount)/100):s.price
})
window.open(PAYPAL+"/"+total.toFixed(2))
}

// ==== SEARCH ====
document.getElementById("search").oninput=e=>{
let val=e.target.value.toLowerCase()
renderSkins(skins.filter(s=>s.name.toLowerCase().includes(val)))
}

// ==== SORT ====
document.getElementById("sort").onchange=e=>{
let list=[...skins]

if(e.target.value==="low"){
list.sort((a,b)=>a.price-b.price)
}
if(e.target.value==="high"){
list.sort((a,b)=>b.price-a.price)
}

renderSkins(list)
}

</script>

</body>
</html>
