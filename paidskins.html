<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.B Agar.io — Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #020617;
      color: white;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      background: rgba(2, 6, 23, .95);
      border-bottom: 1px solid #164e63;
    }

    header h1 {
      color: #38bdf8;
      font-size: 22px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .cart-button {
      padding: 12px 16px;
      background: #2563eb;
      color: white;
    }

    .cart-count {
      display: inline-block;
      min-width: 22px;
      margin-left: 6px;
      padding: 3px 7px;
      border-radius: 20px;
      background: #ef4444;
    }

    main {
      width: min(1200px, 100%);
      margin: auto;
      padding: 35px 18px;
    }

    .hero {
      padding: 35px 20px;
      margin-bottom: 35px;
      border-radius: 20px;
      text-align: center;
      background: linear-gradient(145deg, #082f49, #071226);
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero span {
      color: #38bdf8;
    }

    .hero p {
      color: #cbd5e1;
    }

    .uid-box {
      margin: 25px auto;
      max-width: 550px;
    }

    .uid-box label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .uid-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      outline: none;
      background: #0f172a;
      color: white;
    }

    .section-title {
      margin-bottom: 20px;
      text-align: center;
      font-size: 28px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 15px;
      border: 1px solid #164e63;
      border-radius: 18px;
      background: linear-gradient(145deg, #08152a, #071226);
    }

    .product img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      background: #020617;
    }

    .product h3 {
      font-size: 20px;
    }

    .product p {
      color: #94a3b8;
      min-height: 40px;
    }

    .price {
      color: #38bdf8;
      font-size: 24px;
      font-weight: bold;
    }

    .buy-button {
      padding: 13px;
      background: #2563eb;
      color: white;
    }

    .buy-button:hover {
      background: #1d4ed8;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: rgba(0, 0, 0, .75);
    }

    .overlay.visible {
      display: flex;
    }

    .cart-modal {
      width: min(550px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 25px;
      border: 1px solid #164e63;
      border-radius: 18px;
      background: #071226;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-button {
      padding: 8px 12px;
      background: #334155;
      color: white;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #1e293b;
    }

    .cart-item small {
      color: #94a3b8;
    }

    .remove-button {
      padding: 8px;
      background: #dc2626;
      color: white;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      margin: 25px 0;
      font-size: 22px;
      font-weight: bold;
    }

    .checkout-button {
      width: 100%;
      padding: 15px;
      background: #16a34a;
      color: white;
      font-size: 16px;
    }

    .checkout-button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    .empty-cart {
      padding: 25px 0;
      color: #94a3b8;
      text-align: center;
    }

    .message {
      margin-top: 15px;
      color: #fbbf24;
      text-align: center;
    }

    footer {
      padding: 30px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>T.B Agar.io Shop</h1>

  <button class="cart-button" id="openCartButton">
    🛒 Winkelwagen
    <span class="cart-count" id="cartCount">0</span>
  </button>
</header>

<main>
  <section class="hero">
    <h2>T.B <span>Shop</span></h2>
    <p>Koop jouw favoriete Agar.io-skins.</p>

    <div class="uid-box">
      <label for="playerUid">Jouw Agar.io UID</label>
      <input
        id="playerUid"
        type="text"
        placeholder="Vul hier je Agar.io UID in"
        autocomplete="off"
      >
    </div>
  </section>

  <h2 class="section-title">Onze producten</h2>

  <section class="products" id="products"></section>
</main>

<div class="overlay" id="cartOverlay">
  <div class="cart-modal">
    <div class="cart-header">
      <h2>Jouw winkelwagen</h2>

      <button class="close-button" id="closeCartButton">
        ✕
      </button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
      <span>Totaal:</span>
      <span id="cartTotal">€ 0,00</span>
    </div>

    <button
      class="checkout-button"
      id="checkoutButton"
    >
      Afrekenen met iDEAL
    </button>

    <div class="message" id="cartMessage"></div>
  </div>
</div>

<footer>
  © 2026 T.B Agar.io — Alle rechten voorbehouden.
</footer>

<script>
  "use strict";

  const products = [
    {
      id: "skin-001",
      name: "dohnut",
      price: 1.99,
      image: "IMG_5334.webp",
      description: "Een unieke Agar.io-skin."
    },
    {
      id: "skin-002",
      name: "pumpkitty",
      price: 1.99,
      image: "IMG_0923.webp",
      description: "Een unieke Agar.io-skin."
    },
    {
      id: "skin-003",
      name: "mindseye",
      price: 1.99,
      image: "IMG_0920.webp",
      description: "Een unieke Agar.io-skin."
    },
    {
      id: "skin-004",
      name: "nomster",
      price: 5.99,
      image: "IMG_0924.webp",
      description: "Een unieke Agar.io-skin."
    }
  ];

  let cart = [];

  const productsContainer =
    document.getElementById("products");

  const cartOverlay =
    document.getElementById("cartOverlay");

  const cartItemsContainer =
    document.getElementById("cartItems");

  const cartCountElement =
    document.getElementById("cartCount");

  const cartTotalElement =
    document.getElementById("cartTotal");

  const cartMessage =
    document.getElementById("cartMessage");

  const checkoutButton =
    document.getElementById("checkoutButton");

  const playerUidInput =
    document.getElementById("playerUid");

  function formatPrice(price) {
    return new Intl.NumberFormat("nl-NL", {
      style: "currency",
      currency: "EUR"
    }).format(price);
  }

  function renderProducts() {
    productsContainer.innerHTML = "";

    products.forEach(product => {
      const productElement =
        document.createElement("article");

      productElement.className = "product";

      productElement.innerHTML = `
        <img
          src="${product.image}"
          alt="${product.name}"
          onerror="this.style.display='none'"
        >

        <h3>${product.name}</h3>

        <p>${product.description}</p>

        <div class="price">
          ${formatPrice(product.price)}
        </div>

        <button
          class="buy-button"
          data-product-id="${product.id}"
        >
          In winkelwagen
        </button>
      `;

      productElement
        .querySelector(".buy-button")
        .addEventListener("click", () => {
          addToCart(product);
        });

      productsContainer.appendChild(productElement);
    });
  }

  function addToCart(product) {
    const existingItem =
      cart.find(item => item.id === product.id);

    if (existingItem) {
      existingItem.quantity += 1;
    } else {
      cart.push({
        ...product,
        quantity: 1
      });
    }

    renderCart();
    openCart();
  }

  function removeFromCart(productId) {
    cart = cart.filter(item => item.id !== productId);
    renderCart();
  }

  function changeQuantity(productId, change) {
    const item =
      cart.find(product => product.id === productId);

    if (!item) {
      return;
    }

    item.quantity += change;

    if (item.quantity <= 0) {
      removeFromCart(productId);
      return;
    }

    if (item.quantity > 20) {
      item.quantity = 20;
    }

    renderCart();
  }

  function getCartCount() {
    return cart.reduce(
      (total, item) => total + item.quantity,
      0
    );
  }

  function getCartTotal() {
    return cart.reduce(
      (total, item) =>
        total + item.price * item.quantity,
      0
    );
  }

  function renderCart() {
    cartCountElement.textContent = getCartCount();

    cartTotalElement.textContent =
      formatPrice(getCartTotal());

    checkoutButton.disabled = cart.length === 0;

    if (cart.length === 0) {
      cartItemsContainer.innerHTML = `
        <div class="empty-cart">
          Je winkelwagen is leeg.
        </div>
      `;

      return;
    }

    cartItemsContainer.innerHTML = "";

    cart.forEach(item => {
      const itemElement =
        document.createElement("div");

      itemElement.className = "cart-item";

      itemElement.innerHTML = `
        <div>
          <strong>${item.name}</strong><br>
          <small>
            ${formatPrice(item.price)} per stuk
          </small>
          <br>
          <button
            class="close-button decrease-button"
            type="button"
          >
            −
          </button>

          <span> ${item.quantity} </span>

          <button
            class="close-button increase-button"
            type="button"
          >
            +
          </button>
        </div>

        <div>
          <strong>
            ${formatPrice(item.price * item.quantity)}
          </strong>
          <br>
          <button
            class="remove-button"
            type="button"
          >
            Verwijderen
          </button>
        </div>
      `;

      itemElement
        .querySelector(".decrease-button")
        .addEventListener("click", () => {
          changeQuantity(item.id, -1);
        });

      itemElement
        .querySelector(".increase-button")
        .addEventListener("click", () => {
          changeQuantity(item.id, 1);
        });

      itemElement
        .querySelector(".remove-button")
        .addEventListener("click", () => {
          removeFromCart(item.id);
        });

      cartItemsContainer.appendChild(itemElement);
    });
  }

  function openCart() {
    cartOverlay.classList.add("visible");
    cartMessage.textContent = "";
  }

  function closeCart() {
    cartOverlay.classList.remove("visible");
  }

  async function checkout() {
    const uid = playerUidInput.value.trim();

    if (!uid) {
      cartMessage.textContent =
        "Vul eerst je Agar.io UID in.";

      return;
    }

    if (cart.length === 0) {
      cartMessage.textContent =
        "Je winkelwagen is leeg.";

      return;
    }

    checkoutButton.disabled = true;
    checkoutButton.textContent =
      "Betaling voorbereiden...";

    cartMessage.textContent = "";

    try {
      const response = await fetch(
        "/xshop/checkout",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            uid: uid,
            paymentMethod: "ideal",
            items: cart.map(item => ({
              productId: item.id,
              quantity: item.quantity
            }))
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          "De checkout kon niet worden gestart."
        );
      }

      const checkoutUrl =
        data.checkout_url || data.url;

      if (!checkoutUrl) {
        throw new Error(
          "Geen betaalpagina ontvangen."
        );
      }

      window.location.href = checkoutUrl;
    } catch (error) {
      cartMessage.textContent = error.message;
      checkoutButton.disabled = false;
      checkoutButton.textContent =
        "Afrekenen met iDEAL";
    }
  }

  document
    .getElementById("openCartButton")
    .addEventListener("click", openCart);

  document
    .getElementById("closeCartButton")
    .addEventListener("click", closeCart);

  cartOverlay.addEventListener("click", event => {
    if (event.target === cartOverlay) {
      closeCart();
    }
  });

  checkoutButton.addEventListener("click", checkout);

  renderProducts();
  renderCart();
</script>

</body>
</html>
