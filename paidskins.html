<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T.B Agar.io Paid Skins</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>

<style>
.circle{width:100px;height:100px;border-radius:9999px;object-fit:cover}
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:flex;
align-items:center;
justify-content:center;
}
.hidden{display:none;}
</style>
</head>

<body class="bg-gray-100">

<header class="bg-gray-900 text-white p-4">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<h1 class="font-bold text-xl">T.B Agar.io Paid Skins</h1>

<button id="cartBtn" class="bg-teal-500 px-4 py-2 rounded">
Cart (<span id="cartCount">0</span>)
</button>
</div>
</header>

<main class="max-w-6xl mx-auto p-6">
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
</main>

<!-- CART -->
<div id="cartModal" class="modal hidden">

<div class="bg-white p-6 rounded w-full max-w-lg">

<h2 class="text-xl font-bold mb-4">Your Cart</h2>

<div id="cartItems" class="space-y-3"></div>

<div class="flex justify-between font-bold mt-4">
<span>Total</span>
<span id="total">$0.00</span>
</div>

<button id="paypalBtn" class="w-full bg-yellow-500 mt-4 py-3 rounded font-bold">
Pay with PayPal
</button>

<button onclick="closeCart()" class="w-full mt-2 py-2 bg-gray-200 rounded">
Close
</button>

</div>
</div>

<script>

/* =====================
   30 SKINS
===================== */

const skins = [

{ id:1,name:"Scar",price:2.89,image:"IMG_7141.webp"},
{ id:2,name:"Scar + Seer",price:12.99,image:"IMG_7141.webp"},
{ id:3,name:"Bull King",price:4.29,image:"IMG_7147.webp"},
{ id:4,name:"Birthday lol + Bull king",price:13.49,image:"IMG_3797.webp"},
{ id:5,name:"Tiny jack + Jade",price:14.39,image:"IMG_7143.webp"},
{ id:6,name:"Evil master",price:11.49,image:"IMG_5443.webp"},
{ id:7,name:"Space warden + Evil master",price:21.99,image:"IMG_7150.webp"},
{ id:8,name:"Space warden",price:6.59,image:"IMG_7150.webp"},
{ id:9,name:"Thund",price:5.49,image:"IMG_6185.webp"},
{ id:10,name:"King lion + Magic hat",price:23.99,image:"IMG_7172.webp"},
{ id:11,name:"Ice Crystal",price:7.89,image:"IMG_5938.webp"},
{ id:12,name:"Moofun",price:11.99,image:"IMG_7227.webp"},
{ id:13,name:"Sorceress",price:7.99,image:"IMG_7225.webp"},
{ id:14,name:"Gnome mage",price:11.99,image:"IMG_7226.webp"},
{ id:15,name:"Steel Ram",price:11.99,image:"IMG_6080.webp"},
{ id:16,name:"Shuriken",price:6.99,image:"IMG_7177.webp"},
{ id:17,name:"Shuriken + Shadow",price:21.99,image:"IMG_7177.webp"},
{ id:18,name:"Rogue samurai",price:6.89,image:"IMG_7464.webp"},
{ id:19,name:"Cursed Skull",price:8.49,image:"IMG_6198.webp"},
{ id:20,name:"Silver Orb",price:4.99,image:"IMG_6199.webp"},
{ id:21,name:"Gryphon",price:6.49,image:"IMG_7468.webp"},
{ id:22,name:"Dark wings",price:21.99,image:"IMG_7233.webp"},
{ id:23,name:"Gryphon + Dark wings",price:11.29,image:"IMG_7468.webp"},
{ id:24,name:"Madjawz",price:18.99,image:"IMG_5593.webp"},
{ id:25,name:"Skull ribbon",price:5.99,image:"IMG_6332.webp"},
{ id:26,name:"Eye patch + mega power",price:18.99,image:"IMG_6331.webp"},
{ id:27,name:"Eye patch + amber",price:7.99,image:"IMG_6331.webp"},
{ id:28,name:"Eye patch",price:11.99,image:"IMG_6331.webp"},
{ id:29,name:"Karate parrot",price:2.89,image:"IMG_7146.webp"},
{ id:30,name:"Karate parrot + Frog thai + Hard shroom",price:12.99,image:"IMG_7146.webp"}

];

/* CART */

let cart = JSON.parse(localStorage.getItem("cart") || "[]");

const grid = document.getElementById("grid");
const cartItems = document.getElementById("cartItems");
const cartCount = document.getElementById("cartCount");
const totalEl = document.getElementById("total");
const cartModal = document.getElementById("cartModal");

/* RENDER PRODUCTS */

function render(){

grid.innerHTML="";

skins.forEach(s=>{

let div=document.createElement("div");

div.className="bg-white p-4 rounded shadow text-center";

div.innerHTML=`

<img src="${s.image}" class="circle mx-auto">

<h3 class="font-bold mt-3">${s.name}</h3>

<p class="font-semibold">$${s.price}</p>

<button onclick="addToCart(${s.id})"
class="bg-green-600 text-white px-4 py-2 mt-2 rounded">
Add to Cart
</button>

`;

grid.appendChild(div);

});

}

render();

/* ADD TO CART */

function addToCart(id){

let item = skins.find(s=>s.id===id);

cart.push(item);

localStorage.setItem("cart",JSON.stringify(cart));

updateCart();

alert("Added to cart");

}

/* UPDATE CART */

function updateCart(){

cartItems.innerHTML="";

let total=0;

cart.forEach((s,i)=>{

total+=s.price;

let div=document.createElement("div");

div.className="flex justify-between border p-2 rounded";

div.innerHTML=`
<span>${s.name}</span>
<span>$${s.price}</span>
`;

cartItems.appendChild(div);

});

totalEl.textContent="$"+total.toFixed(2);

cartCount.textContent=cart.length;

}

updateCart();

/* CART OPEN */

document.getElementById("cartBtn").onclick=()=>{

cartModal.classList.remove("hidden");

updateCart();

}

/* CART CLOSE */

function closeCart(){

cartModal.classList.add("hidden");

}

/* PAYPAL */

document.getElementById("paypalBtn").onclick=()=>{

let total = cart.reduce((a,b)=>a+b.price,0);

if(total===0){

alert("Cart is empty");

return;

}

let url = "https://www.paypal.com/paypalme/TBYTagario/"+total.toFixed(2);

window.open(url,"_blank");

};

</script>

</body>
</html>
