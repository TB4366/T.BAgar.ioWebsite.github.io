/* ======= Variabelen ======= */
const grid=document.getElementById('grid');
const template=document.getElementById('card-template');
const cartCount=document.getElementById('cartCount');
const cartItemsContainer=document.getElementById('cartItems');
const totalAmount=document.getElementById('totalAmount');
const cartModal=document.getElementById('cartModal');
const paypalBtn=document.getElementById('paypalBtn');
const applePayBtn=document.getElementById('applePayBtn');
const inputUID=document.getElementById('inputUID');
const inputEmail=document.getElementById('inputEmail');
const navbarSearch=document.getElementById('navbarSearch');
const sortSelect=document.getElementById('sortSelect');
const dealBar=document.getElementById('dealBar');
const dealsModal=document.getElementById('dealsModal');
const closeDeals=document.getElementById('closeDeals');
const dealHero=document.getElementById('dealHero');
const dealOrigPriceEl=document.getElementById('dealOrigPrice');
const dealSalePriceEl=document.getElementById('dealSalePrice');
const dealTimerEl=document.getElementById('dealTimer');
const dealCircle1Img=document.getElementById('dealCircle1Img');
const dealCircle2Img=document.getElementById('dealCircle2Img');

const fallbackImg="https://via.placeholder.com/120?text=No+Image";
let cart=[];
let originalOrder=bundles.slice();

/* ======= Basic render / cart functions ======= */
function formatPrice(p){return`USD ${p.toFixed(2)}`;}
function shuffleArray(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function render(list){
  grid.innerHTML='';
  list.forEach(item=>{
    if(!item.image1&&!item.image2)return;
    const el=template.content.cloneNode(true);
    const imgsRow=el.querySelector('.imgs-row');
    if(item.image1){const img=document.createElement('img');img.src=item.image1;img.className=item.image2?'small-img':'card-img';img.onerror=()=>img.src=fallbackImg;imgsRow.appendChild(img);}
    if(item.image2){const img2=document.createElement('img');img2.src=item.image2;img2.className='small-img';img2.onerror=()=>img2.src=fallbackImg;imgsRow.appendChild(img2);}
    el.querySelector('.card-title').textContent=item.name.nl;
    el.querySelector('.card-desc').textContent=item.note.nl;
    el.querySelector('.card-price').textContent=formatPrice(item.price);
    el.querySelector('.shareBtn').addEventListener('click',()=>{navigator.clipboard.writeText(location.href+'#'+item.id);alert('Link gekopieerd');});
    el.querySelector('.selectBtn').addEventListener('click',()=>{
      addToCart(item.id, item.price);
      alert(`${item.name.nl} toegevoegd aan winkelwagen`);
    });
    grid.appendChild(el);
  });
}
function updateCartModal(){
  cartItemsContainer.innerHTML='';
  cart.forEach((item,i)=>{
    const div=document.createElement('div');
    div.className='flex items-center justify-between gap-4 p-2 border rounded';
    div.innerHTML=`<img src="${item.image1||fallbackImg}" class="w-16 h-16 rounded-full"><div class="flex-1"><h4>${item.name.nl}</h4><p>${formatPrice(item.price)}</p></div><button class="removeBtn text-red-500 font-bold text-xl">&times;</button>`;
    div.querySelector('.removeBtn').addEventListener('click',()=>{cart.splice(i,1);cartCount.textContent=cart.length;updateCartModal();});
    cartItemsContainer.appendChild(div);
  });
  const total=cart.reduce((s,it)=>s+it.price,0);
  totalAmount.textContent=formatPrice(total);
}

/* Add to cart by skin id; optional override price */
function addToCart(skinId, overridePrice = null){
  const skin = bundles.find(b => b.id === skinId);
  if(!skin) { alert('Skin niet gevonden'); return; }
  const item = Object.assign({}, skin); // shallow copy
  if(overridePrice !== null){
    item.price = Number(overridePrice);
  }
  cart.push(item);
  cartCount.textContent = cart.length;
  updateCartModal();
}

/* ======= Deal bar & modal logic ======= */

/* initialize deal content from editable constants */
function initDealUI(){
  // background image:
  dealHero.style.backgroundImage = `url('${DEAL_BG_IMAGE}')`;

  // text prices
  dealOrigPriceEl.textContent = DEAL_ORIGINAL_PRICE;
  dealSalePriceEl.textContent = DEAL_SALE_PRICE;

  // for circles we use placeholder images; user can replace the src attributes:
  // dealCircle1Img.src = 'path/to/your-circle1.jpg';
  // dealCircle2Img.src = 'path/to/your-circle2.jpg';
}

/* countdown */
const dealDeadline = Date.now() + Number(DEAL_DURATION_MS);
function updateTimer(){
  const now = Date.now();
  let diff = Math.max(0, dealDeadline - now);
  const hrs = Math.floor(diff / (1000*60*60));
  diff -= hrs*(1000*60*60);
  const mins = Math.floor(diff / (1000*60));
  diff -= mins*(1000*60);
  const secs = Math.floor(diff / 1000);
  dealTimerEl.textContent = `Deal eindigt over ${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  if (dealDeadline - now <= 0) {
    // expired
    dealTimerEl.textContent = `Deal verlopen`;
    clearInterval(timerInterval);
  }
}
const timerInterval = setInterval(updateTimer, 1000);
updateTimer();

/* open deals modal when bottom bar clicked */
dealBar.addEventListener('click', ()=> {
  initDealUI();
  dealsModal.classList.add('active');
});
closeDeals.addEventListener('click', ()=> dealsModal.classList.remove('active'));

/* clicking on sale price adds the deal skin to cart with sale price */
dealSalePriceEl.addEventListener('click', ()=>{
  // sale price as number (strip non-digits)
  const numeric = DEAL_SALE_PRICE.replace(/[^0-9.,]/g,'').replace(',', '.');
  const priceNum = parseFloat(numeric) || null;
  addToCart(DEAL_SKIN_ID, priceNum);
  dealsModal.classList.remove('active');
  alert('Deal toegevoegd aan winkelwagen');
});

/* ======= PayPal / Apple Buttons (unchanged behavior) ======= */
paypalBtn.addEventListener('click',()=>{
  const uid=inputUID.value.trim();
  const email=inputEmail.value.trim();
  if(!uid){alert('Voer eerst een UID in.'); inputUID.focus(); return;}
  if(!email || !email.includes('@')){alert('Voer een geldig e-mail adres in.'); inputEmail.focus(); return;}
  if(cart.length===0){alert('Je winkelwagen is leeg.'); return;}
  const total=cart.reduce((s,it)=>s+it.price,0).toFixed(2);
  const paypalURL=`https://paypal.me/TBYTagario/${total}`;
  window.open(paypalURL,'_blank');
});
applePayBtn.addEventListener('click',()=>{alert('Apple Gift Cardbetaling is in deze demo niet geactiveerd.');});

/* open / close cart modal */
document.getElementById('cartBtn').onclick=()=>{updateCartModal();cartModal.classList.add('active');};
document.getElementById('closeModal').onclick=()=>cartModal.classList.remove('active');

/* Zoek en sorteer */
navbarSearch.addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  const filtered=bundles.filter(b=>b.name.nl.toLowerCase().includes(q));
  render(filtered);
});
sortSelect.addEventListener('change',()=>{
  let sorted=[];
  switch(sortSelect.value){
    case'low':sorted=bundles.slice().sort((a,b)=>a.price-b.price);break;
    case'high':sorted=bundles.slice().sort((a,b)=>b.price-a.price);break;
    case'popular':sorted=bundles.slice().sort((a,b)=>b.sold-a.sold);break;
    case'shuffle':sorted=shuffleArray(bundles);break;
    default:sorted=originalOrder;
  }
  render(sorted);
});

/* initial render */
render(bundles);
cartCount.textContent=cart.length;
initDealUI();

</script>
