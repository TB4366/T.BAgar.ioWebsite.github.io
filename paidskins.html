<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T.B Agar.io Shop</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#f5f5f5;font-family:Arial;}
.skin{text-align:center;position:relative;}
.circle{width:90px;height:90px;border-radius:100%;object-fit:cover;margin:auto;}

.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:flex;align-items:center;justify-content:center;
}

.hidden{display:none;}
#eventBar{
position:fixed;bottom:0;left:0;width:100%;
background:#e53935;color:white;
padding:10px;
display:flex;justify-content:space-between;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<header class="bg-black text-white p-4 flex justify-between">
<h1>T.B Agar.io Shop</h1>
<button onclick="openCart()" class="bg-teal-500 px-3 py-1 rounded">
Cart (<span id="cartCount">0</span>)
</button>
</header>

<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-6"></div>

<!-- CART -->
<div id="cartModal" class="modal hidden">
<div class="bg-white p-6 rounded w-96">

<h2 class="font-bold text-xl mb-3">Cart</h2>
<div id="cartItems"></div>

<div class="mt-3 font-bold">Total: €<span id="cartTotal">0</span></div>

<button onclick="checkout()" class="w-full mt-4 bg-green-600 text-white py-2 rounded">
Checkout
</button>

<button onclick="closeCart()" class="w-full mt-2 bg-gray-300 py-2 rounded">
Close
</button>

</div>
</div>

<!-- RECEIPT (KASSA BON) -->
<div id="receiptModal" class="modal hidden">
<div class="bg-white p-6 rounded w-[350px] text-center">

<h2 class="font-bold text-xl">T.B Agar.io</h2>
<hr class="my-2">

<h3 class="font-bold">Skin Shop Receipt</h3>

<hr class="my-2">

<p class="text-sm font-bold">STEPS:</p>
<p class="text-sm">1. Save this photo & copy ID</p>
<p class="text-sm">2. Contact @t.bagar.io or @tbagariosupportteam</p>

<hr class="my-2">

<div id="receiptItems" class="text-sm"></div>

<hr class="my-2">

<p>Discount: -€<span id="discountTotal">0</span></p>
<p class="font-bold">TOTAL: €<span id="finalTotal">0</span></p>

<hr class="my-2">

<p class="text-sm">Receipt ID:</p>
<p id="receiptId" class="font-bold"></p>

<button onclick="copyID()" class="mt-3 bg-black text-white px-3 py-2 rounded w-full">
Copy ID
</button>

<button onclick="closeReceipt()" class="mt-2 bg-gray-300 py-2 rounded w-full">
Close
</button>

</div>
</div>

<script>

// ================= SKINS =================
const skins=[
{ name:"Scar", price:2.89 },
{ name:"Bull King", price:4.29 },
{ name:"Evil Master", price:11.49 },
{ name:"Shuriken", price:6.99 },
{ name:"Gryphon", price:6.49 },
{ name:"Ice Crystal", price:7.89 },
{ name:"Sorceress", price:7.99 },
{ name:"Cursed Skull", price:8.49 },
{ name:"Silver Orb", price:4.99 },
{ name:"Dark Wings", price:21.99 }
]

// ================= CART =================
let cart=[]

// ================= RENDER =================
const grid=document.getElementById("grid")

function render(){
grid.innerHTML=""
skins.forEach((s,i)=>{
grid.innerHTML+=`
<div class="bg-white p-4 rounded shadow">
<h3 class="font-bold">${s.name}</h3>
<p>€${s.price}</p>
<button onclick="add(${i})" class="bg-green-600 text-white px-3 py-1 mt-2 rounded">
Add
</button>
</div>`
})
}
render()

// ================= CART =================
function openCart(){
document.getElementById("cartModal").classList.remove("hidden")
updateCart()
}

function closeCart(){
document.getElementById("cartModal").classList.add("hidden")
}

function add(i){
cart.push(i)
document.getElementById("cartCount").innerText=cart.length
updateCart()
}

function remove(i){
cart.splice(i,1)
document.getElementById("cartCount").innerText=cart.length
updateCart()
}

function updateCart(){
let box=document.getElementById("cartItems")
box.innerHTML=""
let total=0

cart.forEach((i,idx)=>{
let s=skins[i]
total+=s.price

box.innerHTML+=`
<div class="flex justify-between">
<span>${s.name}</span>
<span>€${s.price}</span>
<button onclick="remove(${idx})">❌</button>
</div>`
})

document.getElementById("cartTotal").innerText=total.toFixed(2)
}

// ================= CHECKOUT + RECEIPT =================
function checkout(){

let id="TB-"+Math.floor(Math.random()*999999999)

let box=document.getElementById("receiptItems")
box.innerHTML=""

let total=0

cart.forEach(i=>{
let s=skins[i]
total+=s.price
box.innerHTML+=`<p>${s.name} - €${s.price}</p>`
})

let discount=0

document.getElementById("discountTotal").innerText=discount.toFixed(2)
document.getElementById("finalTotal").innerText=total.toFixed(2)
document.getElementById("receiptId").innerText=id

cart=[]
document.getElementById("cartCount").innerText=0

document.getElementById("cartModal").classList.add("hidden")
document.getElementById("receiptModal").classList.remove("hidden")
}

// ================= RECEIPT =================
function closeReceipt(){
document.getElementById("receiptModal").classList.add("hidden")
}

function copyID(){
navigator.clipboard.writeText(document.getElementById("receiptId").innerText)
alert("Receipt ID copied ✔")
}

</script>

</body>
</html>
