
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>T.B Agar.io Skins</title>

  <!-- Facebook SDK -->
  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top right, #075985, transparent 35%),
        #020617;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 18px 5%;
      background: rgba(2, 6, 23, 0.95);
      border-bottom: 1px solid #164e63;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #38bdf8;
    }

    .login-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font-weight: bold;
      color: white;
      background: #1877f2;
    }

    button:hover {
      background: #0d65d9;
    }

    .logout {
      background: #334155;
    }

    .profile {
      display: none;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .profile img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    main {
      width: min(1400px, 94%);
      margin: 30px auto;
    }

    .hero {
      text-align: center;
      padding: 35px 15px;
      border: 1px solid #164e63;
      border-radius: 20px;
      background: rgba(8, 47, 73, 0.35);
      margin-bottom: 25px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 52px);
    }

    .hero h1 span {
      color: #38bdf8;
    }

    .hero p {
      color: #cbd5e1;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    input,
    select {
      padding: 12px;
      color: white;
      background: #071a2e;
      border: 1px solid #28506a;
      border-radius: 9px;
      outline: none;
    }

    #search {
      flex: 1;
      min-width: 230px;
    }

    #skinCount {
      align-self: center;
      color: #94a3b8;
      font-size: 14px;
    }

    #skins {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 14px;
    }

    .skin {
      min-width: 0;
      padding: 12px 8px;
      text-align: center;
      background: linear-gradient(145deg, #08243b, #071226);
      border: 1px solid #164e63;
      border-radius: 14px;
      transition: 0.2s ease;
    }

    .skin:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 8px 25px rgba(14, 165, 233, 0.15);
    }

    .skin img {
      display: block;
      width: 100%;
      height: 105px;
      object-fit: contain;
      margin-bottom: 9px;
    }

    .skin-name {
      display: block;
      min-height: 32px;
      font-size: 13px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .skin-id {
      display: block;
      margin-top: 5px;
      color: #64748b;
      font-size: 10px;
    }

    .loading,
    .error,
    .empty {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      color: #cbd5e1;
    }

    .error {
      color: #fca5a5;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      color: #64748b;
      border-top: 1px solid #164e63;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      #skins {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .skin {
        padding: 8px 4px;
      }

      .skin img {
        height: 75px;
      }

      .skin-name {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      T.B <span>Agar.io Skins</span>
    </div>

    <div class="login-area">
      <div id="profile" class="profile">
        <img id="profileImage" src="" alt="Profile">
        <span id="profileName"></span>
        <button class="logout" onclick="logoutFacebook()">Logout</button>
      </div>

      <button id="facebookLogin" onclick="loginFacebook()">
        Login with Facebook
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>All <span>Agar.io Skins</span></h1>
      <p>Explore the available Agar.io skins from the official game configuration.</p>
    </section>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search for a skin..."
        oninput="filterSkins()"
      >

      <select id="version" onchange="changeVersion()">
        <option value="v15/3032">v15/3032</option>
      </select>

      <span id="skinCount">Loading skins...</span>
    </div>

    <section id="skins">
      <div class="loading">Loading skins...</div>
    </section>
  </main>

  <footer>
    © <span id="year"></span> T.B Agar.io Skins
  </footer>

  <script>
    /*
      ==================================================
      CONFIGURATION
      ==================================================
    */

    const API =
      "https://configs-web.agario.miniclippt.com/live/";

    /*
      VUL HIER JOUW FACEBOOK APP ID IN
      Voorbeeld: "123456789012345"
    */

    const FACEBOOK_APP_ID = "YOUR_FACEBOOK_APP_ID";

    let version = "v15/3032";
    let allSkins = [];

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /*
      ==================================================
      FACEBOOK LOGIN
      ==================================================
    */

    window.fbAsyncInit = function () {
      FB.init({
        appId: FACEBOOK_APP_ID,
        cookie: true,
        xfbml: true,
        version: "v24.0"
      });

      FB.getLoginStatus(function (response) {
        handleFacebookStatus(response);
      });
    };


    function loginFacebook() {
      if (
        FACEBOOK_APP_ID === "YOUR_FACEBOOK_APP_ID"
      ) {
        alert(
          "Configure your Facebook App ID first."
        );
        return;
      }

      FB.login(
        function (response) {
          handleFacebookStatus(response);
        },
        {
          scope: "public_profile,email"
        }
      );
    }


    function handleFacebookStatus(response) {
      if (
        response.status === "connected"
      ) {
        FB.api(
          "/me",
          {
            fields: "id,name,picture"
          },
          function (user) {
            if (!user || user.error) {
              alert("Could not load Facebook profile.");
              return;
            }

            document.getElementById(
              "facebookLogin"
            ).style.display = "none";

            document.getElementById(
              "profile"
            ).style.display = "flex";

            document.getElementById(
              "profileName"
            ).textContent = user.name;

            if (
              user.picture &&
              user.picture.data
            ) {
              document.getElementById(
                "profileImage"
              ).src = user.picture.data.url;
            }
          }
        );
      } else {
        document.getElementById(
          "facebookLogin"
        ).style.display = "block";

        document.getElementById(
          "profile"
        ).style.display = "none";
      }
    }


    function logoutFacebook() {
      FB.logout(function () {
        document.getElementById(
          "facebookLogin"
        ).style.display = "block";

        document.getElementById(
          "profile"
        ).style.display = "none";
      });
    }


    /*
      ==================================================
      LOAD VERSIONS
      ==================================================
    */

    async function loadVersions() {
      const select =
        document.getElementById("version");

      try {
        const response = await fetch(
          "https://lmsettings.snez.org/",
          {
            headers: {
              username: "LMConfigVersion",
              password: "LMConfigVersionPass"
            }
          }
        );

        if (!response.ok) {
          throw new Error("Version request failed");
        }

        const versions = await response.json();

        select.innerHTML = "";

        Object.values(versions).forEach(function (item) {
          const cleanVersion = String(item)
            .replace(/\/$/, "");

          const option = document.createElement(
            "option"
          );

          option.value = cleanVersion;
          option.textContent = cleanVersion;

          select.appendChild(option);
        });

        if (select.options.length > 0) {
          version = select.options[
            select.options.length - 1
          ].value;

          select.value = version;
        }
      } catch (error) {
        select.innerHTML = "";

        const option = document.createElement(
          "option"
        );

        option.value = version;
        option.textContent = version;

        select.appendChild(option);
      }

      await loadSkins();
    }


    /*
      ==================================================
      LOAD ALL SKINS
      ==================================================
    */

    async function loadSkins() {
      const container =
        document.getElementById("skins");

      const count =
        document.getElementById("skinCount");

      container.innerHTML =
        '<div class="loading">Loading skins...</div>';

      count.textContent = "Loading...";

      allSkins = [];

      try {
        const url =
          API +
          version +
          "/GameConfiguration.json";

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(
            "GameConfiguration could not be loaded"
          );
        }

        const config = await response.json();

        const skinCollection =
          findSkinCollection(config);

        if (!skinCollection) {
          throw new Error(
            "Skin collection was not found"
          );
        }

        skinCollection.forEach(function (skin) {
          if (!skin || typeof skin !== "object") {
            return;
          }

          const productId =
            skin.productId ||
            skin.id ||
            "";

          const image =
            skin.image ||
            skin.icon ||
            "";

          if (!productId || !image) {
            return;
          }

          if (
            String(image).includes("uses_spine")
          ) {
            return;
          }

          allSkins.push({
            id: String(productId),
            image: String(image),
            name: String(
              skin.displayName ||
              productId
                .replace(/^skin_/, "")
                .replace(/_/g, " ")
            )
          });
        });

        // Remove duplicate skins
        allSkins = Array.from(
          new Map(
            allSkins.map(function (skin) {
              return [skin.id, skin];
            })
          ).values()
        );

        renderSkins(allSkins);
      } catch (error) {
        console.error(error);

        container.innerHTML =
          '<div class="error">' +
          "Unable to load skins for this version." +
          "</div>";

        count.textContent = "0 skins";
      }
    }


    /*
      Find the array containing skin data.
      This supports nested JSON structures.
    */

    function findSkinCollection(data) {
      if (!data || typeof data !== "object") {
        return null;
      }

      if (Array.isArray(data)) {
        const containsSkin = data.some(function (item) {
          return (
            item &&
            typeof item === "object" &&
            (
              item.productId ||
              item.image ||
              item.displayName
            )
          );
        });

        if (containsSkin) {
          return data;
        }

        for (const item of data) {
          const result = findSkinCollection(item);

          if (result) {
            return result;
          }
        }
      }

      if (typeof data === "object") {
        for (const key of Object.keys(data)) {
          const result = findSkinCollection(data[key]);

          if (result) {
            return result;
          }
        }
      }

      return null;
    }


    /*
      ==================================================
      DISPLAY SKINS
      ==================================================
    */

    function renderSkins(skins) {
      const container =
        document.getElementById("skins");

      const count =
        document.getElementById("skinCount");

      container.innerHTML = "";

      count.textContent =
        skins.length + " skins";

      if (skins.length === 0) {
        container.innerHTML =
          '<div class="empty">No skins found.</div>';

        return;
      }

      skins.forEach(function (skin) {
        const card =
          document.createElement("article");

        card.className = "skin";

        const image =
          document.createElement("img");

        image.loading = "lazy";

        image.alt = skin.name;

        image.src =
          API +
          version +
          "/" +
          skin.image;

        image.onerror = function () {
          image.style.display = "none";
        };

        const name =
          document.createElement("span");

        name.className = "skin-name";
        name.textContent = skin.name;

        const id =
          document.createElement("span");

        id.className = "skin-id";
        id.textContent = skin.id;

        card.appendChild(image);
        card.appendChild(name);
        card.appendChild(id);

        container.appendChild(card);
      });
    }


    /*
      ==================================================
      SEARCH
      ==================================================
    */

    function filterSkins() {
      const query =
        document.getElementById("search")
          .value
          .toLowerCase()
          .trim();

      const filtered =
        allSkins.filter(function (skin) {
          return (
            skin.name.toLowerCase().includes(query) ||
            skin.id.toLowerCase().includes(query)
          );
        });

      renderSkins(filtered);
    }


    /*
      ==================================================
      VERSION CHANGE
      ==================================================
    */

    function changeVersion() {
      version =
        document.getElementById("version").value;

      loadSkins();
    }


    /*
      ==================================================
      START
      ==================================================
    */

    loadVersions();
  </script>

</body>
</html>
