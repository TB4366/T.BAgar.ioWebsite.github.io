<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>T.B Agar.io Skins</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 90% 0%,rgba(14,165,233,.25),transparent 32%),
        radial-gradient(circle at 0% 100%,rgba(2,132,199,.20),transparent 30%),
        #020617;
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    padding:15px 4%;

    background:rgba(2,6,23,.94);
    border-bottom:1px solid #164e63;

    backdrop-filter:blur(15px);
}

.logo{
    color:#fff;
    font-size:23px;
    font-weight:900;
    white-space:nowrap;
}

.logo span{
    color:#38bdf8;
}

.header-right{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
}

/* =========================================================
   LOGIN
========================================================= */

.login-area{
    display:flex;
    align-items:center;
    gap:8px;
}

.login-button{
    border:0;
    padding:10px 15px;

    border-radius:9px;

    color:#fff;

    font-size:13px;
    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.login-button:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

#facebookLogin{
    background:#1877f2;
}

#googleLogin{
    background:#ea4335;
}

/* =========================================================
   PROFILE
========================================================= */

.profile{
    display:none;

    align-items:center;
    gap:9px;
}

.profile img{
    width:38px;
    height:38px;

    border-radius:50%;

    object-fit:cover;

    background:#0f172a;
    border:1px solid #334155;
}

.profile-info{
    display:flex;
    flex-direction:column;
    gap:3px;
}

#profileName{
    max-width:180px;

    color:#fff;

    font-size:13px;
    font-weight:800;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.currency-row{
    display:flex;
    align-items:center;
    gap:8px;

    font-size:12px;
    font-weight:700;
}

#coins{
    color:#facc15;
}

#dna{
    color:#38bdf8;
}

.logout{
    border:0;

    padding:9px 12px;

    border-radius:8px;

    background:#334155;
    color:#fff;

    font-size:12px;
    font-weight:800;

    cursor:pointer;
}

.logout:hover{
    background:#475569;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    position:fixed;

    top:80px;
    left:50%;

    transform:translateX(-50%);

    z-index:9999;

    display:none;

    padding:13px 22px;

    border-radius:11px;

    background:#0f172a;
    border:1px solid #334155;

    box-shadow:0 15px 45px rgba(0,0,0,.4);

    color:#fff;

    font-size:14px;
    font-weight:800;
}

/* =========================================================
   AGAR.IO PANEL
========================================================= */

.agar-panel{
    width:min(1400px,94%);

    margin:22px auto 0;

    overflow:hidden;

    border:1px solid #164e63;
    border-radius:18px;

    background:#020617;

    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.agar-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    padding:13px 16px;

    background:#071a2e;

    border-bottom:1px solid #164e63;
}

.agar-title{
    font-weight:900;
}

.agar-title span{
    color:#38bdf8;
}

.open-agar{
    border:0;

    padding:8px 13px;

    border-radius:8px;

    background:#0ea5e9;
    color:#fff;

    font-size:12px;
    font-weight:900;

    cursor:pointer;
}

.open-agar:hover{
    background:#0284c7;
}

.agar-content{
    padding:18px;

    text-align:center;

    color:#94a3b8;

    font-size:13px;
}

.agar-content strong{
    color:#fff;
}

/* =========================================================
   MAIN
========================================================= */

main{
    width:min(1500px,94%);

    margin:25px auto 60px;
}

/* =========================================================
   TITLE
========================================================= */

.page-title{
    text-align:center;

    margin:32px 0 22px;
}

.page-title h1{
    margin:0;

    font-size:34px;
    font-weight:900;

    letter-spacing:-.8px;
}

.page-title h1 span{
    color:#38bdf8;
}

.page-title p{
    margin:9px 0 0;

    color:#94a3b8;

    font-size:14px;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;

    margin-bottom:20px;

    padding:13px;

    border:1px solid #164e63;
    border-radius:13px;

    background:#071a2e;
}

.controls-left{
    display:flex;
    align-items:center;
    gap:10px;

    flex:1;
}

.controls-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.search{
    width:100%;
    max-width:430px;

    padding:11px 13px;

    outline:none;

    border:1px solid #1e3a5f;
    border-radius:9px;

    background:#020617;
    color:#fff;

    font-size:13px;
}

.search:focus{
    border-color:#38bdf8;
}

.version-label{
    color:#94a3b8;

    font-size:12px;
    font-weight:800;
}

#version{
    min-width:130px;

    padding:10px 11px;

    outline:none;

    border:1px solid #1e3a5f;
    border-radius:9px;

    background:#020617;
    color:#fff;

    font-size:12px;
}

.skin-count{
    color:#94a3b8;

    font-size:12px;
    font-weight:800;
}

/* =========================================================
   SKIN GRID
========================================================= */

#skins{
    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:15px;
}

/* =========================================================
   SKIN CARD
========================================================= */

.skin{
    position:relative;

    display:flex;
    flex-direction:column;

    min-width:0;

    padding:13px;

    border:1px solid #123a52;
    border-radius:14px;

    background:
        linear-gradient(
            180deg,
            #08243b 0%,
            #061a2d 100%
        );

    box-shadow:
        0 10px 30px rgba(0,0,0,.18);

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s;
}

.skin:hover{
    transform:translateY(-3px);

    border-color:#0ea5e9;

    box-shadow:
        0 15px 35px rgba(14,165,233,.12);
}

/* =========================================================
   SKIN IMAGE
========================================================= */

.skin-image-wrap{
    width:100%;
    aspect-ratio:1/1;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:11px;

    overflow:hidden;

    border-radius:11px;

    background:
        radial-gradient(
            circle,
            #0b3555,
            #031221
        );

    border:1px solid #164e63;
}

.skin-image{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;
}

.skin-image-fallback{
    color:#475569;

    font-size:12px;
}

/* =========================================================
   SKIN INFO
========================================================= */

.skin-name{
    min-height:34px;

    color:#fff;

    font-size:14px;
    font-weight:900;

    line-height:17px;

    overflow:hidden;
}

.skin-id{
    margin-top:3px;

    color:#64748b;

    font-size:10px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.skin-price-title{
    margin-top:10px;

    color:#64748b;

    font-size:10px;
    font-weight:800;

    text-transform:uppercase;
}

.skin-price{
    margin-top:2px;

    color:#facc15;

    font-size:17px;
    font-weight:900;
}

.skin-currency{
    color:#38bdf8;

    font-size:11px;
    font-weight:800;
}

/* =========================================================
   BUY BUTTON
========================================================= */

.skin-buy{
    width:100%;

    margin-top:12px;

    padding:10px 12px;

    border:0;
    border-radius:9px;

    background:#0ea5e9;
    color:#fff;

    font-size:12px;
    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.skin-buy:hover:not(:disabled){
    background:#0284c7;

    transform:translateY(-1px);
}

.skin-buy:disabled{
    background:#334155;

    color:#64748b;

    cursor:not-allowed;
}

/* =========================================================
   LOADING / ERROR
========================================================= */

.loading,
.empty,
.error{
    grid-column:1/-1;

    padding:60px 20px;

    text-align:center;

    border:1px solid #164e63;
    border-radius:14px;

    background:#071a2e;

    color:#94a3b8;

    font-size:14px;
}

.error{
    color:#fca5a5;

    border-color:#7f1d1d;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    padding:25px 15px 40px;

    text-align:center;

    color:#475569;

    font-size:12px;
}

footer strong{
    color:#38bdf8;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1200px){

    #skins{
        grid-template-columns:
            repeat(4,minmax(0,1fr));
    }

}

@media(max-width:900px){

    #skins{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .controls{
        flex-direction:column;
        align-items:stretch;
    }

    .controls-left,
    .controls-right{
        width:100%;
    }

    .search{
        max-width:none;
    }

}

@media(max-width:650px){

    header{
        padding:12px 3%;

        align-items:flex-start;
        flex-direction:column;
    }

    .header-right{
        width:100%;

        justify-content:space-between;
    }

    .login-area{
        width:100%;
    }

    .login-button{
        flex:1;
    }

    #skins{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:10px;
    }

    .skin{
        padding:9px;
    }

    .page-title h1{
        font-size:27px;
    }

    .agar-panel{
        width:96%;
    }

}

@media(max-width:400px){

    #skins{
        grid-template-columns:1fr;
    }

    .profile img{
        width:32px;
        height:32px;
    }

    #profileName{
        max-width:120px;
    }

}
</style>
</head>

<body>

     HEADER
========================================================= -->

<header>

    <div class="logo">
        T.B <span>Agar.io Skins</span>
    </div>

    <div class="header-right">

            <button

<main>

    <section class="page-title">

        <h1>

            Official Agar.io configuration skins and prices
        </p>

    <!-- CONTROLS -->

    <section class="controls">

<footer>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API =
    "https://configs-web.agario.miniclippt.com/live/";

let version =
    "v15/3032";

let allSkins = [];

/* =========================================================
   ELEMENTS
========================================================= */

const skinsContainer =
    document.getElementById("skins");

const skinCount =
    document.getElementById("skinCount");

const versionSelect =
    document.getElementById("version");

const searchInput =
    document.getElementById("search");

/* =========================================================
   STATUS
========================================================= */

let statusTimer = null;

function showStatus(
    message,
    success = true
){

    const status =
        document.getElementById("status");

    if(!status){
        return;
    }

    status.textContent =
        message;

    status.style.display =
        "block";

    status.style.background =
        success
            ? "#16a34a"
            : "#dc2626";

    clearTimeout(
        statusTimer
    );

    statusTimer =
        setTimeout(
            function(){
                status.style.display =
                    "none";
            },
            5000
        );
}

/* =========================================================
   AGAR.IO BUTTON
========================================================= */

document
    .getElementById("openAgarButton")
    .addEventListener(
        "click",
        function(){

            window.open(
                "https://agar.io/#ffa",
                "TB_AGAR_LOGIN",
                "width=1280,height=850,resizable=yes,scrollbars=yes"
            );

        }
    );

/* =========================================================
   CONFIG HELPERS
========================================================= */

function getSectionRows(
    config,
    name
){

    if(
        !config ||
        typeof config !== "object"
    ){
        return [];
    }

    if(
        Array.isArray(
            config[name]
        )
    ){
        return config[name];
    }

    let found =
        null;

    function walk(value){

        if(
            found ||
            value == null ||
            typeof value !== "object"
        ){
            return;
        }

        if(
            Array.isArray(value)
        ){
            return;
        }

        if(
            Object.prototype.hasOwnProperty.call(
                value,
                name
            )
        ){

            if(
                Array.isArray(
                    value[name]
                )
            ){

                found =
                    value[name];

            }

            return;
        }

        Object.keys(value)
            .some(
                function(key){

                    walk(
                        value[key]
                    );

                    return !!found;

                }
            );

    }

    walk(config);

    return Array.isArray(found)
        ? found
        : [];
}

function firstValue(
    object,
    keys
){

    if(
        !object ||
        typeof object !== "object"
    ){
        return null;
    }

    for(
        const key of keys
    ){

        if(
            object[key] !== undefined &&
            object[key] !== null &&
            String(
                object[key]
            ).trim() !== ""
        ){

            return object[key];

        }

    }

    return null;
}

function firstNumber(
    object,
    keys
){

    if(
        !object ||
        typeof object !== "object"
    ){
        return null;
    }

    for(
        const key of keys
    ){

        if(
            object[key] === undefined ||
            object[key] === null
        ){
            continue;
        }

        const number =
            Number(
                object[key]
            );

        if(
            Number.isFinite(number)
        ){

            return number;

        }

    }

    return null;
}

/* =========================================================
   PURCHASE ID
========================================================= */

function findPurchaseId(
    skin,
    shop
){

    const objects = [
        shop,
        skin
    ];

    const keys = [

        "purchaseId",
        "purchaseID",

        "softPurchaseId",
        "softPurchaseID",

        "referenceValue",

        "referenceId",
        "referenceID",

        "walletProductId"

    ];

    for(
        const object of objects
    ){

        const value =
            firstValue(
                object,
                keys
            );

        if(
            value != null
        ){

            return String(
                value
            );

        }

    }

    return "";
}

/* =========================================================
   IMAGE
========================================================= */

function resolveSkinImage(
    skin,
    visual
){

    const value =
        firstValue(
            skin,
            [
                "image",
                "icon",
                "skinImage",
                "visualSource"
            ]
        ) ||
        firstValue(
            visual,
            [
                "visualSource",
                "image",
                "icon",
                "source"
            ]
        );

    return value == null
        ? ""
        : String(value);
}

/* =========================================================
   NAME
========================================================= */

function resolveSkinName(
    skin,
    shop,
    id
){

    const value =
        firstValue(
            skin,
            [
                "displayName",
                "localizedName",
                "name",
                "skinName"
            ]
        ) ||
        firstValue(
            shop,
            [
                "displayName",
                "localizedName",
                "name"
            ]
        );

    if(value){

        return String(
            value
        );

    }

    return String(id)
        .replace(
            /^skin[_-]?/i,
            ""
        )
        .replace(
            /[_-]+/g,
            " "
        );
}

/* =========================================================
   PRICE
========================================================= */

function resolveSkinPrice(
    skin,
    shop,
    purchase
){

    const direct =
        firstNumber(
            skin,
            [
                "price",
                "cost",
                "currencyAmount"
            ]
        );

    if(
        direct != null
    ){
        return direct;
    }

    const shopDirect =
        firstNumber(
            shop,
            [
                "price",
                "cost",
                "currencyAmount"
            ]
        );

    if(
        shopDirect != null
    ){
        return shopDirect;
    }

    const purchasePrice =
        firstNumber(
            purchase,
            [
                "currencyAmount",
                "price",
                "cost"
            ]
        );

    if(
        purchasePrice != null
    ){
        return purchasePrice;
    }

    return null;
}

/* =========================================================
   CURRENCY
========================================================= */

function resolveCurrency(
    skin,
    shop,
    purchase
){

    const value =
        firstValue(
            purchase,
            [
                "currencyProductId",
                "currency"
            ]
        ) ||
        firstValue(
            shop,
            [
                "currencyProductId",
                "currency"
            ]
        ) ||
        firstValue(
            skin,
            [
                "currencyProductId",
                "currency"
            ]
        ) ||
        "DNA";

    return String(
        value
    ).toUpperCase();
}

/* =========================================================
   LOAD VERSIONS
========================================================= */

async function loadVersions(){

    try{

        const response =
            await fetch(
                "https://lmsettings.snez.org/",
                {
                    headers:{
                        username:
                            "LMConfigVersion",

                        password:
                            "LMConfigVersionPass"
                    },

                    cache:
                        "no-store"
                }
            );

        if(
            !response.ok
        ){
            throw new Error(
                "Version request failed"
            );
        }

        const versions =
            await response.json();

        versionSelect.innerHTML =
            "";

        Object.values(
            versions
        ).forEach(
            function(item){

                const clean =
                    String(item)
                        .replace(
                            /\/$/,
                            ""
                        );

                if(
                    !clean
                ){
                    return;
                }

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    clean;

                option.textContent =
                    clean;

                versionSelect.appendChild(
                    option
                );

            }
        );

        if(
            versionSelect.options.length
        ){

            version =
                versionSelect.options[
                    versionSelect.options.length - 1
                ].value;

            versionSelect.value =
                version;

        }

    }catch(error){

        versionSelect.innerHTML =
            "";

        const option =
            document.createElement(
                "option"
            );

        option.value =
            "v15/3032";

        option.textContent =
            "v15/3032";

        versionSelect.appendChild(
            option
        );

        version =
            "v15/3032";

    }

}

/* =========================================================
   LOAD SKINS
========================================================= */

async function loadSkins(){

    skinsContainer.innerHTML =
        '<div class="loading">Loading skins...</div>';

    skinCount.textContent =
        "Loading...";

    allSkins =
        [];

    try{

        const url =
            API +
            version +
            "/GameConfiguration.json";

        const response =
            await fetch(
                url,
                {
                    cache:
                        "no-store"
                }
            );

        if(
            !response.ok
        ){

            throw new Error(
                "GameConfiguration could not be loaded"
            );

        }

        const config =
            await response.json();

        const gameConfig =
            config &&
            config.gameConfig
                ? config.gameConfig
                : config;

        const gameplaySkins =
            getSectionRows(
                gameConfig,
                "Gameplay - Equippable Skins"
            );

        const shopSkins =
            getSectionRows(
                gameConfig,
                "Shop - Skins"
            );

        const purchases =
            getSectionRows(
                gameConfig,
                "Wallet - Soft Purchases"
            );

        const visualProducts =
            getSectionRows(
                gameConfig,
                "Visual - Products"
            );

        const purchaseById =
            new Map();

        purchases.forEach(
            function(purchase){

                if(
                    !purchase ||
                    purchase.id == null
                ){
                    return;
                }

                purchaseById.set(
                    String(
                        purchase.id
                    ),
                    purchase
                );

            }
        );

        const shopByProductId =
            new Map();

        shopSkins.forEach(
            function(shop){

                if(!shop){
                    return;
                }

                const productId =
                    firstValue(
                        shop,
                        [
                            "productIdToQuantify",
                            "productId",
                            "id"
                        ]
                    );

                if(
                    productId != null &&
                    productId !== ""
                ){

                    shopByProductId.set(
                        String(productId),
                        shop
                    );

                }

            }
        );

        const visualByProductId =
            new Map();

        visualProducts.forEach(
            function(visual){

                if(!visual){
                    return;
                }

                const productId =
                    firstValue(
                        visual,
                        [
                            "productId",
                            "id"
                        ]
                    );

                if(
                    productId != null &&
                    productId !== ""
                ){

                    visualByProductId.set(
                        String(productId),
                        visual
                    );

                }

            }
        );

        /* =====================================================
           MAIN SKIN LIST
        ===================================================== */

        gameplaySkins.forEach(
            function(skin){

                if(
                    !skin ||
                    skin.productId == null
                ){
                    return;
                }

                const id =
                    String(
                        skin.productId
                    );

                const shop =
                    shopByProductId.get(
                        id
                    ) || null;

                const visual =
                    visualByProductId.get(
                        id
                    ) || null;

                const purchaseId =
                    findPurchaseId(
                        skin,
                        shop
                    );

                const purchase =
                    purchaseId
                        ? (
                            purchaseById.get(
                                String(
                                    purchaseId
                                )
                            ) || null
                        )
                        : null;

                allSkins.push({

                    id:id,

                    image:
                        resolveSkinImage(
                            skin,
                            visual
                        ),

                    name:
                        resolveSkinName(
                            skin,
                            shop,
                            id
                        ),

                    price:
                        resolveSkinPrice(
                            skin,
                            shop,
                            purchase
                        ),

                    currency:
                        resolveCurrency(
                            skin,
                            shop,
                            purchase
                        ),

                    purchaseId:
                        purchaseId || ""

                });

            }
        );

        /* =====================================================
           FALLBACK SHOP SKINS
        ===================================================== */

        if(
            !allSkins.length
        ){

            shopSkins.forEach(
                function(shop){

                    if(!shop){
                        return;
                    }

                    const id =
                        firstValue(
                            shop,
                            [
                                "productIdToQuantify",
                                "productId",
                                "id"
                            ]
                        );

                    if(
                        id == null ||
                        id === ""
                    ){
                        return;
                    }

                    const visual =
                        visualByProductId.get(
                            String(id)
                        ) || null;

                    const purchaseId =
                        findPurchaseId(
                            {},
                            shop
                        );

                    const purchase =
                        purchaseId
                            ? (
                                purchaseById.get(
                                    String(
                                        purchaseId
                                    )
                                ) || null
                            )
                            : null;

                    allSkins.push({

                        id:
                            String(id),

                        image:
                            resolveSkinImage(
                                {},
                                visual
                            ),

                        name:
                            resolveSkinName(
                                {},
                                shop,
                                String(id)
                            ),

                        price:
                            resolveSkinPrice(
                                {},
                                shop,
                                purchase
                            ),

                        currency:
                            resolveCurrency(
                                {},
                                shop,
                                purchase
                            ),

                        purchaseId:
                            purchaseId || ""

                    });

                }
            );

        }

        /* =====================================================
           REMOVE DUPLICATES
        ===================================================== */

        allSkins =
            Array.from(
                new Map(
                    allSkins.map(
                        function(skin){

                            return [
                                skin.id,
                                skin
                            ];

                        }
                    )
                ).values()
            );

        renderSkins(
            allSkins
        );

    }catch(error){

        console.error(
            "[T.B Skins]",
            error
        );

        skinsContainer.innerHTML =
            `
            <div class="error">
                Unable to load skins for this version.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
            `;

        skinCount.textContent =
            "0 skins";

    }

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

/* =========================================================
   RENDER SKINS
========================================================= */

function renderSkins(
    skins
){

    skinsContainer.innerHTML =
        "";

    skinCount.textContent =
        skins.length +
        " skins";

    if(
        skins.length === 0
    ){

        skinsContainer.innerHTML =
            `
            <div class="empty">
                No skins found in this configuration.
            </div>
            `;

        return;
    }

    skins.forEach(
        function(skin){

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "skin";

            /* IMAGE */

            const imageWrap =
                document.createElement(
                    "div"
                );

            imageWrap.className =
                "skin-image-wrap";

            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "skin-image";

            image.loading =
                "lazy";

            image.alt =
                skin.name;

            let imagePath =
                skin.image ||
                "";

            if(
                imagePath &&
                !/^https?:\/\//i.test(
                    imagePath
                )
            ){

                imagePath =
                    API +
                    version +
                    "/" +
                    imagePath.replace(
                        /^\/+/,
                        ""
                    );

            }

            if(
                imagePath
            ){

                image.src =
                    imagePath;

            }else{

                image.style.display =
                    "none";

                const fallback =
                    document.createElement(
                        "div"
                    );

                fallback.className =
                    "skin-image-fallback";

                fallback.textContent =
                    "No image";

                imageWrap.appendChild(
                    fallback
                );

            }

            image.onerror =
                function(){

                    image.style.display =
                        "none";

                };

            imageWrap.appendChild(
                image
            );

            /* NAME */

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "skin-name";

            name.textContent =
                skin.name;

            /* ID */

            const id =
                document.createElement(
                    "div"
                );

            id.className =
                "skin-id";

            id.textContent =
                skin.id;

            /* PRICE TITLE */

            const priceTitle =
                document.createElement(
                    "div"
                );

            priceTitle.className =
                "skin-price-title";

            priceTitle.textContent =
                "PRICE";

            /* PRICE */

            const price =
                document.createElement(
                    "div"
                );

            price.className =
                "skin-price";

            if(
                skin.price == null
            ){

                price.textContent =
                    "Price unavailable";

            }else{

                price.textContent =
                    Number(
                        skin.price
                    ).toLocaleString(
                        "en-US"
                    );

            }

            /* CURRENCY */

            const currency =
                document.createElement(
                    "div"
                );

            currency.className =
                "skin-currency";

            currency.textContent =
                skin.currency;

            /* BUY */

            const buy =
                document.createElement(
                    "button"
                );

            buy.type =
                "button";

            buy.className =
                "skin-buy";

            if(
                skin.purchaseId
            ){

                buy.textContent =
                    "BUY";

                buy.disabled =
                    false;

                buy.dataset.purchaseId =
                    String(
                        skin.purchaseId
                    );

                buy.addEventListener(
                    "click",
                    function(){

                        showStatus(
                            "Agar.io purchase wordt gestart...",
                            true
                        );

                    }
                );

            }else{

                buy.textContent =
                    "UNAVAILABLE";

                buy.disabled =
                    true;

            }

            /* BUILD CARD */

            card.appendChild(
                imageWrap
            );

            card.appendChild(
                name
            );

            card.appendChild(
                id
            );

            card.appendChild(
                priceTitle
            );

            card.appendChild(
                price
            );

            card.appendChild(
                currency
            );

            card.appendChild(
                buy
            );

            skinsContainer.appendChild(
                card
            );

        }
    );
}

/* =========================================================
   SEARCH
========================================================= */

function filterSkins(){

    const query =
        searchInput.value
            .trim()
            .toLowerCase();

    if(!query){

        renderSkins(
            allSkins
        );

        return;
    }

    const filtered =
        allSkins.filter(
            function(skin){

                return (
                    String(
                        skin.name
                    )
                    .toLowerCase()
                    .includes(query)
                ) ||
                String(
                    skin.id
                )
                .toLowerCase()
                .includes(query)
                ||
                String(
                    skin.price ?? ""
                )
                .includes(query);

            }
        );

    renderSkins(
        filtered
    );
}

searchInput.addEventListener(
    "input",
    filterSkins
);

/* =========================================================
   VERSION CHANGE
========================================================= */

versionSelect.addEventListener(
    "change",
    function(){

        version =
            this.value;

        loadSkins();

    }
);

/* =========================================================
   INITIAL LOAD
========================================================= */

async function init(){

    await loadVersions();

    await loadSkins();

}

init();

</script>
