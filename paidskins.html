<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>T.B Agar.io Skin Shop</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#f5f5f5;
font-family:Arial;
}

.skin{
position:relative;
text-align:center;
}

.badge{
position:absolute;
top:6px;
left:6px;
background:red;
color:white;
font-size:11px;
padding:4px 8px;
border-radius:5px;
}

.circle{
width:90px;
height:90px;
border-radius:100%;
object-fit:cover;
margin:auto;
transition:0.3s;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header class="bg-black text-white p-4 flex justify-between">

<h1 class="font-bold">T.B Agar.io Paid Skins</h1>

<button id="cartBtn" class="bg-teal-500 px-4 py-2 rounded">
Cart (<span id="cartCount">0</span>)
</button>

</header>


<div class="max-w-6xl mx-auto p-4 flex gap-4">

<input id="search" class="border p-2 flex-1 rounded" placeholder="Search skins">

<select id="sort" class="border p-2 rounded">
<option value="default">Sort</option>
<option value="low">Price low</option>
<option value="high">Price high</option>
</select>

</div>


<div id="grid" class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 p-6"></div>


<div id="cartModal" class="modal hidden">

<div class="bg-white p-6 rounded w-96">

<h2 class="text-xl font-bold mb-3">Cart</h2>

<input id="email" placeholder="Email" class="border p-2 w-full mb-2">
<input id="uid" placeholder="UID" class="border p-2 w-full mb-3">

<div id="cartItems"></div>

<div class="flex justify-between mt-3 font-bold">
<span>Total</span>
<span id="total">$0</span>
</div>

<button id="payBtn" class="bg-yellow-500 w-full mt-4 py-2 rounded">
Pay with PayPal
</button>

<button onclick="closeCart()" class="w-full mt-2 py-2 bg-gray-300 rounded">
Close
</button>

</div>

</div>


<div id="eventBanner" class="fixed bottom-0 left-0 w-full bg-red-600 text-white p-3 flex justify-between items-center cursor-pointer">

<span>🔥 Special Event Ends In:</span>

<span id="eventTimer"></span>

</div>


<script>

const PAYPAL="https://paypal.com/paypalme/TBYTagario"


/* EVENT TIMER */

const eventEnd=new Date()

eventEnd.setDate(eventEnd.getDate()+1)
eventEnd.setHours(eventEnd.getHours()+5)
eventEnd.setMinutes(eventEnd.getMinutes()+30)


function updateTimer(){

const now=new Date()
const diff=eventEnd-now

const days=Math.floor(diff/(1000*60*60*24))
const hours=Math.floor(diff/(1000*60*60)%24)
const minutes=Math.floor(diff/(1000*60)%60)
const seconds=Math.floor(diff/1000%60)

document.getElementById("eventTimer").innerText=
days+"d "+hours+"h "+minutes+"m "+seconds+"s"

}

setInterval(updateTimer,1000)


/* SKINS */

const skins=[

{ name:"Scar", price:2.89, image1:"IMG_7141.webp", image2:"IMG_7141b.webp"},
{ name:"Scar + Seer", price:12.99, image1:"IMG_7141.webp", image2:"IMG_7141b.webp"},
{ name:"Bull King", price:4.29, image1:"IMG_7147.webp", image2:"IMG_7147b.webp"},
{ name:"Birthday lol + Bull king", price:13.49, image1:"IMG_3797.webp", image2:"IMG_3797b.webp"},
{ name:"Tiny jack + Jade", price:14.39, image1:"IMG_7143.webp", image2:"IMG_7143b.webp"},
{ name:"Evil master", price:11.49, image1:"IMG_5443.webp", image2:"IMG_5443b.webp"},
{ name:"Space warden + Evil master", price:21.99, image1:"IMG_7150.webp", image2:"IMG_7150b.webp"},
{ name:"Space warden", price:6.59, image1:"IMG_7150.webp", image2:"IMG_7150b.webp"},
{ name:"Thund", price:5.49, image1:"IMG_6185.webp", image2:"IMG_6185b.webp"},
{ name:"King lion + Magic hat", price:23.99, image1:"IMG_7172.webp", image2:"IMG_7172b.webp"},

{ name:"Ice Crystal", price:7.89, image1:"IMG_5938.webp", image2:"IMG_5938b.webp"},
{ name:"Moofun", price:11.99, image1:"IMG_7227.webp", image2:"IMG_7227b.webp"},
{ name:"Sorceress", price:7.99, image1:"IMG_7225.webp", image2:"IMG_7225b.webp"},
{ name:"Gnome mage", price:11.99, image1:"IMG_7226.webp", image2:"IMG_7226b.webp"},
{ name:"Steel Ram", price:11.99, image1:"IMG_6080.webp", image2:"IMG_6080b.webp"},
{ name:"Shuriken", price:6.99, image1:"IMG_7177.webp", image2:"IMG_7177b.webp"},
{ name:"Shuriken + Shadow", price:21.99, image1:"IMG_7177.webp", image2:"IMG_7177b.webp"},
{ name:"Rogue samurai", price:6.89, image1:"IMG_7464.webp", image2:"IMG_7464b.webp"},
{ name:"Cursed Skull", price:8.49, image1:"IMG_6198.webp", image2:"IMG_6198b.webp"},
{ name:"Silver Orb", price:4.99, image1:"IMG_6199.webp", image2:"IMG_6199b.webp"},

{ name:"Gryphon", price:6.49, image1:"IMG_7468.webp", image2:"IMG_7468b.webp"},
{ name:"Dark wings", price:21.99, image1:"IMG_7233.webp", image2:"IMG_7233b.webp"},
{ name:"Gryphon + Dark wings", price:11.29, image1:"IMG_7468.webp", image2:"IMG_7468b.webp"},
{ name:"Madjawz", price:18.99, image1:"IMG_5593.webp", image2:"IMG_5593b.webp"},
{ name:"Skull ribbon", price:5.99, image1:"IMG_6332.webp", image2:"IMG_6332b.webp"},
{ name:"Eye patch + mega power", price:18.99, image1:"IMG_6331.webp", image2:"IMG_6331b.webp"},
{ name:"Eye patch + amber", price:7.99, image1:"IMG_6331.webp", image2:"IMG_6331b.webp"},
{ name:"Eye patch", price:11.99, image1:"IMG_6331.webp", image2:"IMG_6331b.webp"},
{ name:"Karate parrot", price:2.89, image1:"IMG_7146.webp", image2:"IMG_7146b.webp"},
{ name:"Karate parrot + Frog thai + Hard shroom", price:12.99, image1:"IMG_7146.webp", image2:"IMG_7146b.webp"}

]


let cart=[]

const grid=document.getElementById("grid")


function render(list=skins){

grid.innerHTML=""

list.forEach((s,i)=>{

let div=document.createElement("div")

div.className="bg-white p-4 rounded shadow skin"

div.innerHTML=`

<img src="${s.image1}"
class="circle"
onmouseover="this.src='${s.image2}'"
onmouseout="this.src='${s.image1}'">

<h3 class="font-bold mt-2">${s.name}</h3>

<p>$${s.price}</p>

<button onclick="addCart(${i})"
class="bg-green-600 text-white px-3 py-1 mt-2 rounded">
Add
</button>

`

grid.appendChild(div)

})

}

render()


function addCart(i){

cart.push(skins[i])
updateCart()

}


function updateCart(){

let items=document.getElementById("cartItems")

items.innerHTML=""

let total=0

cart.forEach((s,i)=>{

total+=s.price

let div=document.createElement("div")

div.className="flex justify-between"

div.innerHTML=`
<span>${s.name}</span>
<button onclick="removeCart(${i})">❌</button>
`

items.appendChild(div)

})

document.getElementById("total").innerText="$"+total.toFixed(2)
document.getElementById("cartCount").innerText=cart.length

}


function removeCart(i){

cart.splice(i,1)
updateCart()

}


document.getElementById("cartBtn").onclick=()=>{

document.getElementById("cartModal").classList.remove("hidden")

}


function closeCart(){

document.getElementById("cartModal").classList.add("hidden")

}


document.getElementById("payBtn").onclick=()=>{

let email=document.getElementById("email").value
let uid=document.getElementById("uid").value

if(!email||!uid){

alert("Fill email and UID")

return

}

let total=0
cart.forEach(s=>total+=s.price)

window.open(PAYPAL+"/"+total.toFixed(2))

}


document.getElementById("search").oninput=e=>{

let val=e.target.value.toLowerCase()

render(skins.filter(s=>s.name.toLowerCase().includes(val)))

}


document.getElementById("sort").onchange=e=>{

let list=[...skins]

if(e.target.value==="low") list.sort((a,b)=>a.price-b.price)
if(e.target.value==="high") list.sort((a,b)=>b.price-a.price)

render(list)

}

</script>

</body>
</html>
