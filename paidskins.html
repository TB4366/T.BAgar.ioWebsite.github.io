<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T.B Agar.io Paid Skins</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>

<style>
.circle-big{width:120px;height:120px;border-radius:9999px;object-fit:cover}
.circle-small{width:90px;height:90px;border-radius:9999px;object-fit:cover}
.img-row{display:flex;gap:10px;justify-content:center}
.badge{position:absolute;top:-6px;right:-6px;background:red;color:#fff;border-radius:9999px;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center}
.menu-btn{font-size:24px;background:none;border:none;color:white;cursor:pointer}
.menu{display:none;flex-direction:column;gap:4px;background:#333;color:white;padding:10px;position:absolute;top:60px;right:10px;border-radius:5px}
.menu a{color:white;text-decoration:none}
</style>
</head>
<body class="bg-gray-100">

<!-- TOP BAR -->
<header class="bg-gray-900 text-white relative">
  <div class="max-w-6xl mx-auto p-4 flex items-center gap-4 relative">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold">TB</div>
      <span class="font-bold text-lg">T.B Agar.io Paid Skins</span>
    </div>

    <input id="search" placeholder="Search skins..." class="flex-1 px-3 py-2 rounded text-black">

    <button id="loginBtn" class="bg-blue-500 px-4 py-2 rounded">Login</button>
    <button id="registerBtn" class="bg-green-500 px-4 py-2 rounded">Registreren</button>
    <button id="moneyBtn" class="bg-yellow-400 px-4 py-2 rounded hidden">💰</button>

    <button id="cartBtn" class="relative bg-teal-500 px-4 py-2 rounded flex items-center gap-2">
      <i data-feather="shopping-cart"></i> Cart
      <span id="cartCount" class="badge">0</span>
    </button>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="menu" id="menu">
      <a href="#">🏠 Home Page</a>
      <a href="#">🎱 Agar.io Skins</a>
      <a href="#">🎨 Custom Skins</a>
      <a href="#">🛠️ Mod Menu</a>
      <a href="#">🔑 Keys</a>
      <a href="#">💰 Buy Account</a>
      <a href="#">💎 Paid Skins</a>
    </div>
  </div>
</header>

<!-- SORT -->
<div class="max-w-6xl mx-auto p-4">
  <select id="sort" class="px-3 py-2 rounded border">
    <option value="default">General</option>
    <option value="low">Price: Low → High</option>
    <option value="high">Price: High → Low</option>
    <option value="popular">Popular</option>
    <option value="shuffle">Shuffle</option>
  </select>
</div>

<!-- GRID -->
<main class="max-w-6xl mx-auto p-6">
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
</main>

<!-- CART MODAL -->
<div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-xl p-6 rounded relative">
    <button id="closeCart" class="absolute right-4 top-2 text-2xl">&times;</button>
    <h2 class="text-2xl font-bold text-center mb-4">Cart</h2>
    <div id="cartItems" class="space-y-3"></div>
    <hr class="my-4">
    <div class="flex justify-between text-lg font-bold">
      <span>Total</span>
      <span id="total">$0.00</span>
    </div>
    <div class="flex gap-2 mt-4">
      <button id="giftBtn" class="flex-1 bg-purple-500 text-white py-2 rounded">Pay with Gift Voucher</button>
      <button id="accountPayBtn" class="flex-1 bg-orange-500 text-white py-2 rounded">Betaal met mijn account</button>
    </div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-md p-6 rounded relative">
    <button id="closeLogin" class="absolute right-4 top-2 text-2xl">&times;</button>
    <h2 class="text-2xl font-bold text-center mb-4">Login</h2>
    <input id="loginEmail" type="email" placeholder="Email" class="w-full mb-2 p-2 border rounded">
    <input id="loginPass" type="password" placeholder="Wachtwoord" class="w-full mb-2 p-2 border rounded">
    <input id="loginKey" type="text" placeholder="Key" class="w-full mb-2 p-2 border rounded">
    <button id="loginSubmit" class="w-full bg-blue-500 text-white py-2 rounded">Login</button>
  </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-md p-6 rounded relative">
    <button id="closeRegister" class="absolute right-4 top-2 text-2xl">&times;</button>
    <h2 class="text-2xl font-bold text-center mb-4">Registreren</h2>
    <input id="regName" type="text" placeholder="Vul je naam in" class="w-full mb-2 p-2 border rounded">
    <input id="regEmail" type="email" placeholder="Vul je e-mail adres in" class="w-full mb-2 p-2 border rounded">
    <input id="regUID" type="text" placeholder="Vul je Agario UID in" class="w-full mb-2 p-2 border rounded">
    <input id="regPass" type="password" placeholder="Maak een wachtwoord" class="w-full mb-2 p-2 border rounded">
    <input id="regPass2" type="password" placeholder="Herhaal wachtwoord" class="w-full mb-2 p-2 border rounded">
    <button id="registerSubmit" class="w-full bg-green-500 text-white py-2 rounded">Registreren</button>
  </div>
</div>

<!-- GIFT VOUCHER MODAL -->
<div id="giftModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-md p-6 rounded relative">
    <button onclick="giftModal.classList.add('hidden')" class="absolute right-4 top-2 text-2xl">&times;</button>
    <h2 class="text-xl font-bold mb-4">Gift Voucher</h2>
    <input id="giftCode" type="text" placeholder="Voer 16-letter code in" class="w-full mb-2 p-2 border rounded">
    <div id="giftValue" class="text-center text-lg font-bold mb-2"></div>
    <button id="claimGift" class="w-full bg-purple-500 text-white py-2 rounded">Claim</button>
  </div>
</div>

<!-- ACCOUNT PAYMENT MODAL -->
<div id="accountModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-md p-6 rounded relative">
    <button onclick="accountModal.classList.add('hidden')" class="absolute right-4 top-2 text-2xl">&times;</button>
    <h2 class="text-xl font-bold mb-4">Betalen met account</h2>
    <div class="mb-4">Je saldo: $<span id="accountBalance">0.00</span></div>
    <button id="payWithAccountBtn" class="w-full bg-orange-500 text-white py-2 rounded">Betaal</button>
  </div>
</div>

<!-- CARD TEMPLATE -->
<template id="card">
  <div class="bg-white p-4 rounded shadow text-center">
    <div class="img-row"></div>
    <h3 class="font-bold mt-3 title"></h3>
    <p class="text-sm text-gray-600 desc"></p>
    <p class="font-semibold price mt-2"></p>
    <div class="flex justify-center gap-3 mt-3">
      <button class="share bg-blue-500 text-white px-3 py-2 rounded">Share</button>
      <button class="select bg-green-600 text-white px-3 py-2 rounded">Select</button>
    </div>
  </div>
</template>

<script>
feather.replace();

/* =====================
   30 SKINS
===================== */
const skins = [
 {id:1,name:"Scar",desc:"3250 coins 1 skin Scar",price:2.89,image1:"IMG_7141.webp",image2:null,sold:320},
 {id:2,name:"Scar + Seer",desc:"30000 coins 1 skin Scar 1 skin Seer",price:12.99,image1:"IMG_7141.webp",image2:"IMG_7142.webp",sold:280},
 {id:3,name:"Bull King",desc:"3250 coins 1 skin bull king",price:4.29,image1:"IMG_7147.webp",image2:null,sold:260},
 {id:4,name:"Birthday lol + Bull king",desc:"16000 coins 1 skin birthday lol 1 skin bull king",price:13.49,image1:"IMG_3797.webp",image2:"IMG_7147.webp",sold:240},
 {id:5,name:"Tiny jack + Jade",desc:"30000 coins 1 skin tiny jack 1 skin jade",price:14.39,image1:"IMG_7143.webp",image2:"IMG_4913.webp",sold:220},
 {id:6,name:"Evil master",desc:"16000 coins 1 skin evil master",price:11.49,image1:"IMG_5443.webp",image2:null,sold:210},
 {id:7,name:"Space warden + Evil master",desc:"50000 coins 1 skin space warden 1 skin evil master",price:21.99,image1:"IMG_7150.webp",image2:"IMG_5443.webp",sold:200},
 {id:8,name:"Space warden",desc:"7000 coins 1 skin space warden",price:6.59,image1:"IMG_7150.webp",image2:null,sold:190},
 {id:9,name:"Thund",desc:"Electric eye",price:5.49,image1:"IMG_6185.webp",image2:null,sold:180},
 {id:10,name:"King lion + Magic hat",desc:"50000 coins 1 skin king lion 1 skin magic hat",price:23.99,image1:"IMG_7172.webp",image2:"IMG_7171.webp",sold:170},
 {id:11,name:"Ice Crystal",desc:"3250 coins 1 skin winter ice crystal",price:7.89,image1:"IMG_5938.webp",image2:null,sold:165},
 {id:12,name:"Emerald Eye",desc:"Green gem eye",price:4.39,image1:"IMG_6189.webp",image2:"IMG_6190.webp",sold:160},
 {id:13,name:"Storm Rider",desc:"Storm skin",price:3.49,image1:"IMG_6191.webp",image2:null,sold:150},
 {id:14,name:"Golden Mask",desc:"Gold premium",price:8.19,image1:"IMG_6192.webp",image2:null,sold:145},
 {id:15,name:"Obsidian Orb",desc:"Black stone",price:3.99,image1:"IMG_6193.webp",image2:null,sold:140},
 {id:16,name:"Star Burst",desc:"Star explosion",price:7.59,image1:"IMG_6194.webp",image2:null,sold:135},
 {id:17,name:"Vortex Core",desc:"Energy vortex",price:5.39,image1:"IMG_6195.webp",image2:"IMG_6196.webp",sold:130},
 {id:18,name:"Ruby Fang",desc:"Red fang",price:6.19,image1:"IMG_6197.webp",image2:null,sold:120},
 {id:19,name:"Cursed Skull",desc:"Cursed skin",price:8.49,image1:"IMG_6198.webp",image2:null,sold:110},
 {id:20,name:"Silver Orb",desc:"Silver glow",price:4.99,image1:"IMG_6199.webp",image2:null,sold:105},
 {id:21,name:"Bronze King",desc:"Bronze ruler",price:3.79,image1:"IMG_6200.webp",image2:null,sold:100},
 {id:22,name:"Fire Ball",desc:"Fire sphere",price:7.99,image1:"IMG_6201.webp",image2:null,sold:95},
 {id:23,name:"Aqua Lord",desc:"Water lord",price:5.49,image1:"IMG_6202.webp",image2:null,sold:90},
 {id:24,name:"Plasma Nova",desc:"Plasma energy",price:9.49,image1:"IMG_6203.webp",image2:"IMG_6204.webp",sold:85},
 {id:25,name:"Dark Samurai",desc:"Samurai skin",price:6.79,image1:"IMG_6205.webp",image2:null,sold:80},
 {id:26,name:"Ice Reaper",desc:"Ice skull",price:5.99,image1:"IMG_6206.webp",image2:null,sold:75},
 {id:27,name:"Solar Eye",desc:"Sun eye",price:4.29,image1:"IMG_6207.webp",image2:null,sold:70},
 {id:28,name:"Void Core",desc:"Void energy",price:8.89,image1:"IMG_6208.webp",image2:"IMG_6209.webp",sold:65},
 {id:29,name:"Crystal Fang",desc:"Crystal teeth",price:6.59,image1:"IMG_6210.webp",image2:null,sold:60},
 {id:30,name:"Phantom Glow",desc:"Glow phantom",price:7.19,image1:"IMG_6211.webp",image2:null,sold:55}
];

/* =====================
   USERS & PAYMENTS
===================== */
let users = JSON.parse(localStorage.getItem("users") || "[]");
let cart = JSON.parse(localStorage.getItem("cart") || "[]");
let payments = JSON.parse(localStorage.getItem("payments") || "[]");
let currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");

/* =====================
   HELPERS
===================== */
function saveAll(){
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("cart", JSON.stringify(cart));
  localStorage.setItem("payments", JSON.stringify(payments));
  localStorage.setItem("currentUser", JSON.stringify(currentUser));
}

function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display==="flex"?"none":"flex";
}

/* =====================
   RENDER SKINS
===================== */
const grid = document.getElementById("grid");
function render(list){
  grid.innerHTML="";
  list.forEach(s=>{
    if(!s.image1 && !s.image2) return;
    const c = document.getElementById("card").content.cloneNode(true);
    const imgRow = c.querySelector(".img-row");
    if(s.image1){
      const i=document.createElement("img");
      i.src=s.image1;
      i.className=s.image2?"circle-small":"circle-big";
      imgRow.appendChild(i);
    }
    if(s.image2){
      const i=document.createElement("img");
      i.src=s.image2;
      i.className="circle-small";
      imgRow.appendChild(i);
    }
    c.querySelector(".title").textContent=s.name;
    c.querySelector(".desc").textContent=s.desc;
    c.querySelector(".price").textContent="$"+s.price;
    c.querySelector(".select").onclick=()=>{
      if(!currentUser){ alert("Login eerst"); return; }
      cart.push(s);
      saveAll();
      updateCart();
      alert("Item added to cart");
    };
    c.querySelector(".share").onclick=()=>{
      navigator.clipboard.writeText(s.name+" - $"+s.price);
      alert("Copied to clipboard");
    };
    grid.appendChild(c);
  });
}

/* =====================
   CART
===================== */
const cartBtn = document.getElementById("cartBtn");
const cartModal = document.getElementById("cartModal");
const closeCart = document.getElementById("closeCart");
const cartItems = document.getElementById("cartItems");
const totalEl = document.getElementById("total");
const cartCount = document.getElementById("cartCount");

function updateCart(){
  cartItems.innerHTML="";
  let total=0;
  cart.forEach((s,i)=>{
    total+=s.price;
    const d=document.createElement("div");
    d.className="flex items-center justify-between gap-3 border p-2 rounded";
    d.innerHTML=`
      <div class="flex items-center gap-3">
        <img src="${s.image1}" class="w-12 h-12 rounded-full object-cover">
        <div>
          <div class="font-bold">${s.name}</div>
          <div class="text-sm text-gray-500">$${s.price}</div>
        </div>
      </div>
      <button onclick="removeItem(${i})" class="text-red-600 font-bold text-xl">✕</button>
    `;
    cartItems.appendChild(d);
  });
  totalEl.textContent="$"+total.toFixed(2);
  cartCount.textContent=cart.length;
}

function removeItem(i){
  cart.splice(i,1);
  saveAll();
  updateCart();
}

cartBtn.onclick=()=>cartModal.classList.remove("hidden");
closeCart.onclick=()=>cartModal.classList.add("hidden");

/* =====================
   LOGIN / REGISTER
===================== */
const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");
const moneyBtn = document.getElementById("moneyBtn");
const loginModal = document.getElementById("loginModal");
const closeLogin = document.getElementById("closeLogin");
const loginSubmit = document.getElementById("loginSubmit");
const registerModal = document.getElementById("registerModal");
const closeRegister = document.getElementById("closeRegister");
const registerSubmit = document.getElementById("registerSubmit");

loginBtn.onclick=()=>loginModal.classList.remove("hidden");
closeLogin.onclick=()=>loginModal.classList.add("hidden");
registerBtn.onclick=()=>registerModal.classList.remove("hidden");
closeRegister.onclick=()=>registerModal.classList.add("hidden");

loginSubmit.onclick=()=>{
  const email=document.getElementById("loginEmail").value;
  const pass=document.getElementById("loginPass").value;
  const key=document.getElementById("loginKey").value;
  const user = users.find(u=>u.email===email && u.password===pass && u.key===key);
  if(!user){ alert("Ongeldige gegevens"); return; }
  currentUser = user;
  saveAll();
  loginModal.classList.add("hidden");
  alert("Ingelogd!");
  loginBtn.textContent="Logout";
  registerBtn.style.display="none";
  moneyBtn.style.display="inline-block";
};

registerSubmit.onclick=()=>{
  const name=document.getElementById("regName").value;
  const email=document.getElementById("regEmail").value;
  const uid=document.getElementById("regUID").value;
  const pass=document.getElementById("regPass").value;
  const pass2=document.getElementById("regPass2").value;
  if(!name||!email||!uid||!pass||!pass2){ alert("Vul alles in"); return; }
  if(pass!==pass2){ alert("Wachtwoorden komen niet overeen"); return; }
  const key=Math.floor(10000+Math.random()*90000).toString();
  const user={name,email,uid,password:pass,key,balance:0};
  users.push(user);
  currentUser = user;
  saveAll();
  registerModal.classList.add("hidden");
  alert("Registratie geslaagd! Bewaar je key: "+key);
  loginBtn.textContent="Logout";
  registerBtn.style.display="none";
  moneyBtn.style.display="inline-block";
};

/* =====================
   LOGOUT
===================== */
loginBtn.onclick = ()=>{
  if(currentUser){
    currentUser=null;
    saveAll();
    alert("Uitgelogd!");
    loginBtn.textContent="Login";
    registerBtn.style.display="inline-block";
    moneyBtn.style.display="none";
  } else loginModal.classList.remove("hidden");
};

/* =====================
   MONEY MODAL
===================== */
const giftModal = document.getElementById("giftModal");
const giftBtn = document.getElementById("giftBtn");
const claimGift = document.getElementById("claimGift");
giftBtn.onclick=()=>giftModal.classList.remove("hidden");

claimGift.onclick=()=>{
  const code=document.getElementById("giftCode").value;
  if(code.length!==16){ alert("Code ongeldig"); return; }
  // Simuleer random waarde
  const amount=Math.floor(Math.random()*20)+1;
  currentUser.balance += amount;
  payments.push({userName:currentUser.name,email:currentUser.email,uid:currentUser.uid,amount,status:"Pending",skins:cart.map(c=>c.name)});
  saveAll();
  alert("Geld toegevoegd: $"+amount);
  giftModal.classList.add("hidden");
  document.getElementById("giftCode").value="";
};

/* =====================
   ACCOUNT PAYMENT
===================== */
const accountModal = document.getElementById("accountModal");
const accountBalance = document.getElementById("accountBalance");
const accountPayBtn = document.getElementById("accountPayBtn");
const payWithAccountBtn = document.getElementById("payWithAccountBtn");

moneyBtn.onclick=()=>{
  accountModal.classList.remove("hidden");
  accountBalance.textContent = currentUser.balance.toFixed(2);
};

payWithAccountBtn.onclick=()=>{
  let total = cart.reduce((a,c)=>a+c.price,0);
  if(currentUser.balance<total){ alert("Niet genoeg saldo"); return; }
  currentUser.balance -= total;
  payments.push({userName:currentUser.name,email:currentUser.email,uid:currentUser.uid,amount:total,status:"Pending",skins:cart.map(c=>c.name)});
  saveAll();
  alert("Betaling geslaagd! Je skins zijn in verwerking 2-3 dagen");
  accountModal.classList.add("hidden");
  cart=[];
  saveAll();
  updateCart();
};

document.getElementById("search").oninput=e=>{
  const q=e.target.value.toLowerCase();
  render(skins.filter(s=>s.name.toLowerCase().includes(q)));
};

document.getElementById("sort").onchange=e=>{
  let list=[...skins];
  if(e.target.value==="low") list.sort((a,b)=>a.price-b.price);
  if(e.target.value==="high") list.sort((a,b)=>b.price-a.price);
  if(e.target.value==="popular") list.sort((a,b)=>b.sold-a.sold);
  if(e.target.value==="shuffle") list.sort(()=>Math.random()-0.5);
  render(list);
};

render(skins);
updateCart();
</script>
</body>
</html>
