<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T.B Agar.io Paid Skins</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
.circle-big{width:120px;height:120px;border-radius:9999px;object-fit:cover}
.circle-small{width:90px;height:90px;border-radius:9999px;object-fit:cover}
.img-row{display:flex;gap:10px;justify-content:center}
.badge{position:absolute;top:-6px;right:-6px;background:red;color:#fff;border-radius:9999px;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background-color:rgba(0,0,0,0.5);}
.hidden{display:none;}
</style>
</head>

<body class="bg-gray-100">

<header class="bg-gray-900 text-white">
  <div class="max-w-6xl mx-auto p-4 flex items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold">TB</div>
      <span class="font-bold text-lg">T.B Agar.io Paid Skins</span>
    </div>

    <input id="search" placeholder="Search skins..." class="flex-1 px-3 py-2 rounded text-black">

    <button id="cartBtn" class="relative bg-teal-500 px-4 py-2 rounded flex items-center gap-2">
      <i data-feather="shopping-cart"></i> Cart
      <span id="cartCount" class="badge">0</span>
    </button>

    <button id="menuBtn" class="bg-gray-700 px-3 py-2 rounded">☰</button>

    <button id="loginBtn" class="bg-blue-500 px-3 py-2 rounded">Login</button>
    <button id="registerBtn" class="bg-green-500 px-3 py-2 rounded">Register</button>
    <button id="accountBtn" class="bg-yellow-500 px-3 py-2 rounded hidden">💰</button>
    <button id="logoutBtn" class="bg-red-500 px-3 py-2 rounded hidden">Logout</button>
  </div>
</header>

<main class="max-w-6xl mx-auto p-6">
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
</main>

<!-- CART MODAL -->
<div id="cartModal" class="modal hidden">
  <div class="bg-white w-full max-w-xl p-6 rounded relative">
    <button id="closeCart" class="absolute right-4 top-2 text-2xl">&times;</button>
    <h2 class="text-2xl font-bold text-center mb-4">Cart</h2>
    <div id="cartItems" class="space-y-3"></div>
    <hr class="my-4">
    <div class="flex justify-between text-lg font-bold">
      <span>Total</span>
      <span id="total">$0.00</span>
    </div>
    <button id="payAccountBtn" class="w-full bg-green-600 text-white py-3 rounded font-bold mt-4">
      Pay with My Account
    </button>
  </div>
</div>

<!-- LOGIN -->
<div id="loginModal" class="modal hidden">
  <div class="bg-white p-6 rounded w-full max-w-sm relative">
    <span class="absolute top-2 right-2 text-2xl cursor-pointer" onclick="closeLogin()">×</span>
    <h2 class="text-xl font-bold mb-4">Login</h2>
    <input id="loginEmail" placeholder="Email" class="w-full mb-2 px-3 py-2 border rounded">
    <input id="loginPassword" type="password" placeholder="Password" class="w-full mb-2 px-3 py-2 border rounded">
    <input id="loginKey" placeholder="Key" class="w-full mb-2 px-3 py-2 border rounded">
    <button id="loginSubmit" class="bg-blue-500 text-white w-full py-2 rounded">Login</button>
  </div>
</div>

<!-- REGISTER -->
<div id="registerModal" class="modal hidden">
  <div class="bg-white p-6 rounded w-full max-w-sm relative">
    <span class="absolute top-2 right-2 text-2xl cursor-pointer" onclick="closeRegister()">×</span>
    <h2 class="text-xl font-bold mb-4">Register</h2>
    <input id="regName" placeholder="Your Name" class="w-full mb-2 px-3 py-2 border rounded">
    <input id="regEmail" placeholder="Email" class="w-full mb-2 px-3 py-2 border rounded">
    <input id="regUID" placeholder="Agar.io UID" class="w-full mb-2 px-3 py-2 border rounded">
    <input id="regPassword" type="password" placeholder="Password" class="w-full mb-2 px-3 py-2 border rounded">
    <input id="regPassword2" type="password" placeholder="Repeat Password" class="w-full mb-2 px-3 py-2 border rounded">
    <button id="registerSubmit" class="bg-green-500 text-white w-full py-2 rounded">Register</button>
  </div>
</div>

<!-- ACCOUNT -->
<div id="accountModal" class="modal hidden">
  <div class="bg-white p-6 rounded w-full max-w-sm relative">
    <span class="absolute top-2 right-2 text-2xl cursor-pointer" onclick="closeAccount()">×</span>
    <h2 class="text-xl font-bold mb-4">Account</h2>
    Balance: $<span id="userBalanceDisplay">0</span>
  </div>
</div>

<template id="card">
  <div class="bg-white p-4 rounded shadow text-center">
    <div class="img-row"></div>
    <h3 class="font-bold mt-3 title"></h3>
    <p class="text-sm text-gray-600 desc"></p>
    <p class="font-semibold price mt-2"></p>
    <button class="select bg-green-600 text-white px-3 py-2 rounded mt-3">Select</button>
  </div>
</template>

<script>
let cart, users, currentUser;

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCart();
}

document.addEventListener("DOMContentLoaded",()=>{

feather.replace();

/* === 30 SKINS === */
const skins = [
{id:1,name:"Scar",desc:"3250 coins 1 skin Scar",price:2.89,image1:"IMG_7141.webp"},
{id:2,name:"Scar + Seer",desc:"30000 coins",price:12.99,image1:"IMG_7141.webp",image2:"IMG_7142.webp"},
{id:3,name:"Bull King",desc:"3250 coins",price:4.29,image1:"IMG_7147.webp"},
{id:4,name:"Birthday lol + Bull king",desc:"16000 coins",price:13.49,image1:"IMG_3797.webp",image2:"IMG_7147.webp"},
{id:5,name:"Tiny jack + Jade",desc:"30000 coins",price:14.39,image1:"IMG_7143.webp",image2:"IMG_4913.webp"},
{id:6,name:"Evil master",desc:"16000 coins",price:11.49,image1:"IMG_5443.webp"},
{id:7,name:"Space warden + Evil master",desc:"50000 coins",price:21.99,image1:"IMG_7150.webp",image2:"IMG_5443.webp"},
{id:8,name:"Space warden",desc:"7000 coins",price:6.59,image1:"IMG_7150.webp"},
{id:9,name:"Thund",desc:"Electric eye",price:5.49,image1:"IMG_6185.webp"},
{id:10,name:"King lion + Magic hat",desc:"50000 coins",price:23.99,image1:"IMG_7172.webp",image2:"IMG_7171.webp"},
{id:11,name:"Ice Crystal",desc:"Winter skin",price:7.89,image1:"IMG_5938.webp"},
{id:12,name:"Emerald Eye",desc:"Green gem",price:4.39,image1:"IMG_6189.webp",image2:"IMG_6190.webp"},
{id:13,name:"Storm Rider",desc:"Storm skin",price:3.49,image1:"IMG_6191.webp"},
{id:14,name:"Golden Mask",desc:"Gold",price:8.19,image1:"IMG_6192.webp"},
{id:15,name:"Obsidian Orb",desc:"Black stone",price:3.99,image1:"IMG_6193.webp"},
{id:16,name:"Star Burst",desc:"Explosion",price:7.59,image1:"IMG_6194.webp"},
{id:17,name:"Vortex Core",desc:"Energy",price:5.39,image1:"IMG_6195.webp",image2:"IMG_6196.webp"},
{id:18,name:"Ruby Fang",desc:"Red",price:6.19,image1:"IMG_6197.webp"},
{id:19,name:"Cursed Skull",desc:"Cursed",price:8.49,image1:"IMG_6198.webp"},
{id:20,name:"Silver Orb",desc:"Silver",price:4.99,image1:"IMG_6199.webp"},
{id:21,name:"Bronze King",desc:"Bronze",price:3.79,image1:"IMG_6200.webp"},
{id:22,name:"Fire Ball",desc:"Fire",price:7.99,image1:"IMG_6201.webp"},
{id:23,name:"Aqua Lord",desc:"Water",price:5.49,image1:"IMG_6202.webp"},
{id:24,name:"Plasma Nova",desc:"Plasma",price:9.49,image1:"IMG_6203.webp",image2:"IMG_6204.webp"},
{id:25,name:"Dark Samurai",desc:"Samurai",price:6.79,image1:"IMG_6205.webp"},
{id:26,name:"Ice Reaper",desc:"Ice",price:5.99,image1:"IMG_6206.webp"},
{id:27,name:"Solar Eye",desc:"Sun",price:4.29,image1:"IMG_6207.webp"},
{id:28,name:"Void Core",desc:"Void",price:8.89,image1:"IMG_6208.webp",image2:"IMG_6209.webp"},
{id:29,name:"Crystal Fang",desc:"Crystal",price:6.59,image1:"IMG_6210.webp"},
{id:30,name:"Phantom Glow",desc:"Glow",price:7.19,image1:"IMG_6211.webp"}
];

cart = JSON.parse(localStorage.getItem("cart")||"[]");
users = JSON.parse(localStorage.getItem("users")||"[]");
currentUser = JSON.parse(localStorage.getItem("currentUser")||null);

const grid=document.getElementById("grid");
const cartBtn=document.getElementById("cartBtn");
const cartModal=document.getElementById("cartModal");
const closeCartBtn=document.getElementById("closeCart");
const cartItems=document.getElementById("cartItems");
const totalEl=document.getElementById("total");
const cartCount=document.getElementById("cartCount");
const loginBtn=document.getElementById("loginBtn");
const registerBtn=document.getElementById("registerBtn");
const logoutBtn=document.getElementById("logoutBtn");
const accountBtn=document.getElementById("accountBtn");

const loginModal=document.getElementById("loginModal");
const registerModal=document.getElementById("registerModal");
const accountModal=document.getElementById("accountModal");

/* UI restore */
if(currentUser){
  loginBtn.classList.add("hidden");
  registerBtn.classList.add("hidden");
  logoutBtn.classList.remove("hidden");
  accountBtn.classList.remove("hidden");
}

loginBtn.onclick=()=>loginModal.classList.remove("hidden");
registerBtn.onclick=()=>registerModal.classList.remove("hidden");
logoutBtn.onclick=()=>{localStorage.removeItem("currentUser");location.reload()}
accountBtn.onclick=()=>accountModal.classList.remove("hidden");

window.closeLogin=()=>loginModal.classList.add("hidden");
window.closeRegister=()=>registerModal.classList.add("hidden");
window.closeAccount=()=>accountModal.classList.add("hidden");

/* Render */
function render(){
  grid.innerHTML="";
  skins.forEach(s=>{
    const c=document.getElementById("card").content.cloneNode(true);
    const imgRow=c.querySelector(".img-row");
    let i=document.createElement("img");
    i.src=s.image1;
    i.className="circle-big";
    imgRow.appendChild(i);
    c.querySelector(".title").textContent=s.name;
    c.querySelector(".desc").textContent=s.desc;
    c.querySelector(".price").textContent="$"+s.price;
    c.querySelector(".select").onclick=()=>{cart.push(s);localStorage.setItem("cart",JSON.stringify(cart));updateCart();}
    grid.appendChild(c);
  });
}
render();

/* Cart */
function updateCart(){
  cartItems.innerHTML="";
  let total=0;
  cart.forEach((s,i)=>{
    total+=s.price;
    cartItems.innerHTML+=`<div>${s.name} <button onclick="removeItem(${i})">✕</button></div>`;
  });
  totalEl.textContent="$"+total.toFixed(2);
  cartCount.textContent=cart.length;
}

cartBtn.onclick=()=>{cartModal.classList.remove("hidden");updateCart()}
if(closeCartBtn){closeCartBtn.onclick=()=>cartModal.classList.add("hidden")}

});
</script>

</body>
</html>
