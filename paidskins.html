<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T.B Agar.io Skin Shop</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#f5f5f5;font-family:Arial;}

.skin{text-align:center;position:relative;}
.circle{
width:90px;height:90px;border-radius:100%;
object-fit:cover;margin:auto;
}

.badge{
position:absolute;top:6px;left:6px;
background:red;color:white;
font-size:11px;padding:4px 8px;border-radius:5px;
}

.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:flex;align-items:center;justify-content:center;
}

.hidden{display:none;}

#eventBar{
position:fixed;bottom:0;left:0;width:100%;
background:#e53935;color:white;
padding:10px;
display:flex;justify-content:space-between;
font-weight:bold;cursor:pointer;
}

#eventSkins{
display:flex;
gap:10px;
overflow-x:auto;
}

.eventCard{
min-width:150px;
background:white;
border-radius:10px;
padding:10px;
text-align:center;
}
</style>
</head>

<body>

<header class="bg-black text-white p-4 flex justify-between">
<h1 class="font-bold">T.B Agar.io Skin Shop</h1>

<button onclick="openCart()" class="bg-teal-500 px-4 py-2 rounded">
Cart (<span id="cartCount">0</span>)
</button>
</header>

<!-- SKINS -->
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-6"></div>

<!-- CART -->
<div id="cartModal" class="modal hidden">
<div class="bg-white p-6 rounded w-96">

<h2 class="font-bold text-xl mb-3">Cart</h2>
<div id="cartItems"></div>

<div class="mt-3 font-bold">Total: €<span id="cartTotal">0</span></div>

<button onclick="checkout()" class="w-full mt-4 bg-green-600 text-white py-2 rounded">
Checkout
</button>

<button onclick="closeCart()" class="w-full mt-2 bg-gray-300 py-2 rounded">
Close
</button>

</div>
</div>

<!-- POPUP -->
<div id="popup" class="modal hidden">
<div class="bg-white p-6 rounded text-center w-72">
<p id="popupText"></p>
<button onclick="closePopup()" class="mt-3 bg-green-600 text-white px-4 py-2 rounded">OK</button>
</div>
</div>

<!-- RECEIPT -->
<div id="receiptModal" class="modal hidden">
<div class="bg-white p-6 rounded w-[350px] text-center">

<h2 class="font-bold">T.B Agar.io</h2>
<hr class="my-2">

<h3 class="font-bold">Skin Shop</h3>

<p class="text-sm mt-2">1. Save this receipt & copy ID</p>
<p class="text-sm">2. Contact @t.bagar.io or @tbagariosupportteam</p>

<hr class="my-2">

<div id="receiptItems"></div>

<hr class="my-2">

<p>Discount: -€<span id="discountTotal">0</span></p>
<p class="font-bold">TOTAL: €<span id="finalTotal">0</span></p>

<hr class="my-2">

<p>Receipt ID:</p>
<p id="receiptId" class="font-bold"></p>

<button onclick="copyID()" class="mt-2 bg-black text-white px-3 py-2 rounded w-full">Copy ID</button>
<button onclick="closeReceipt()" class="mt-2 bg-gray-300 py-2 rounded w-full">Close</button>

</div>
</div>

<!-- EVENT -->
<div id="eventFrame" class="modal hidden">
<div class="bg-white p-6 rounded w-[650px]">

<h2 class="font-bold text-xl mb-4">🔥 Grote Acties</h2>

<div id="eventSkins"></div>

<button onclick="closeEvent()" class="w-full mt-4 bg-gray-300 py-2 rounded">Close</button>

</div>
</div>

<div id="eventBar">
<span>🔥 Grote Acties</span>
<span>OPEN</span>
</div>

<script>

// ================= 30 SKINS =================
const skins = [
{ name:"Scar", price:2.89, image:"IMG_7141.webp", discount:25 },
{ name:"Scar + Seer", price:12.99, image:"IMG_7141.webp", discount:0 },
{ name:"Bull King", price:4.29, image:"IMG_7147.webp", discount:15 },
{ name:"Birthday lol + Bull king", price:13.49, image:"IMG_3797.webp", discount:20 },
{ name:"Tiny jack + Jade", price:14.39, image:"IMG_7143.webp", discount:0 },
{ name:"Evil master", price:11.49, image:"IMG_5443.webp", discount:10 },
{ name:"Space warden + Evil master", price:21.99, image:"IMG_7150.webp", discount:0 },
{ name:"Space warden", price:6.59, image:"IMG_7150.webp", discount:5 },
{ name:"Thund", price:5.49, image:"IMG_6185.webp", discount:0 },
{ name:"King lion + Magic hat", price:23.99, image:"IMG_7172.webp", discount:10 },
{ name:"Ice Crystal", price:7.89, image:"IMG_5938.webp", discount:0 },
{ name:"Moofun", price:11.99, image:"IMG_7227.webp", discount:15 },
{ name:"Sorceress", price:7.99, image:"IMG_7225.webp", discount:0 },
{ name:"Gnome mage", price:11.99, image:"IMG_7226.webp", discount:10 },
{ name:"Steel Ram", price:11.99, image:"IMG_6080.webp", discount:0 },
{ name:"Shuriken", price:6.99, image:"IMG_7177.webp", discount:5 },
{ name:"Shuriken + Shadow", price:21.99, image:"IMG_7177.webp", discount:0 },
{ name:"Rogue samurai", price:6.89, image:"IMG_7464.webp", discount:0 },
{ name:"Cursed Skull", price:8.49, image:"IMG_6198.webp", discount:0 },
{ name:"Silver Orb", price:4.99, image:"IMG_6199.webp", discount:0 },
{ name:"Gryphon", price:6.49, image:"IMG_7468.webp", discount:10 },
{ name:"Dark wings", price:21.99, image:"IMG_7233.webp", discount:0 },
{ name:"Gryphon + Dark wings", price:11.29, image:"IMG_7468.webp", discount:5 },
{ name:"Madjawz", price:18.99, image:"IMG_5593.webp", discount:0 },
{ name:"Skull ribbon", price:5.99, image:"IMG_6332.webp", discount:0 },
{ name:"Eye patch + mega power", price:18.99, image:"IMG_6331.webp", discount:20 },
{ name:"Eye patch + amber", price:7.99, image:"IMG_6331.webp", discount:0 },
{ name:"Eye patch", price:11.99, image:"IMG_6331.webp", discount:10 },
{ name:"Karate parrot", price:2.89, image:"IMG_7146.webp", discount:0 },
{ name:"Karate parrot + Frog thai + Hard shroom", price:12.99, image:"IMG_7146.webp", discount:15 }
]

// ================= CART =================
let cart=[]

// ================= RENDER =================
function render(){
let grid=document.getElementById("grid")
grid.innerHTML=""

skins.forEach((s,i)=>{
let price=(s.price*(100-s.discount)/100).toFixed(2)

grid.innerHTML+=`
<div class="bg-white p-4 rounded shadow skin">
${s.discount>0?`<div class="badge">-${s.discount}%</div>`:''}

<img src="${s.image}" class="circle">

<h3 class="font-bold mt-2">${s.name}</h3>
<p>€${price}</p>

<button onclick="add(${i})" class="bg-green-600 text-white px-3 py-1 mt-2 rounded">
Add
</button>
</div>`
})
}
render()

// ================= CART =================
function openCart(){
document.getElementById("cartModal").classList.remove("hidden")
updateCart()
}
function closeCart(){
document.getElementById("cartModal").classList.add("hidden")
}

function add(i){
cart.push(i)
document.getElementById("cartCount").innerText=cart.length
showPopup("Added to cart ✔")
updateCart()
}

function remove(i){
cart.splice(i,1)
document.getElementById("cartCount").innerText=cart.length
updateCart()
}

function updateCart(){
let box=document.getElementById("cartItems")
box.innerHTML=""
let total=0

cart.forEach((i,idx)=>{
let s=skins[i]
let price=s.price*(100-s.discount)/100
total+=price

box.innerHTML+=`
<div class="flex justify-between">
<span>${s.name}</span>
<span>€${price.toFixed(2)}</span>
<button onclick="remove(${idx})">❌</button>
</div>`
})

document.getElementById("cartTotal").innerText=total.toFixed(2)
}

// ================= POPUP =================
function showPopup(t){
document.getElementById("popupText").innerText=t
document.getElementById("popup").classList.remove("hidden")
}
function closePopup(){
document.getElementById("popup").classList.add("hidden")
}

// ================= CHECKOUT =================
function checkout(){

let id="TB-"+Math.floor(Math.random()*999999999)

let box=document.getElementById("receiptItems")
box.innerHTML=""

let total=0

cart.forEach(i=>{
let s=skins[i]
let price=s.price*(100-s.discount)/100
total+=price
box.innerHTML+=`<p>${s.name} - €${price.toFixed(2)}</p>`
})

document.getElementById("finalTotal").innerText=total.toFixed(2)
document.getElementById("receiptId").innerText=id

cart=[]
document.getElementById("cartCount").innerText=0

document.getElementById("cartModal").classList.add("hidden")
document.getElementById("receiptModal").classList.remove("hidden")
}

// ================= RECEIPT =================
function closeReceipt(){
document.getElementById("receiptModal").classList.add("hidden")
}
function copyID(){
navigator.clipboard.writeText(document.getElementById("receiptId").innerText)
alert("Copied ✔")
}

// ================= EVENT =================
const eventSkinsIndex=[0,1,2,3,5,7,10,11,15,20,22,25,29]

document.getElementById("eventBar").onclick=()=>{
document.getElementById("eventFrame").classList.remove("hidden")

let box=document.getElementById("eventSkins")
box.innerHTML=""

eventSkinsIndex.forEach(i=>{
let s=skins[i]

box.innerHTML+=`
<div class="eventCard">
<img src="${s.image}" class="circle">
<p>${s.name}</p>
<p>€${(s.price*(100-s.discount)/100).toFixed(2)}</p>

<button onclick="add(${i})"
class="bg-green-600 text-white px-2 py-1 mt-2 rounded">
Add
</button>
</div>`
})
}

function closeEvent(){
document.getElementById("eventFrame").classList.add("hidden")
}

</script>

</body>
</html>
