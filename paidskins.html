<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.B Agar.io Paid Skins</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
  .card-img { width: 120px; height: 120px; object-fit: cover; border-radius: 9999px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  .cart-badge { background-color: red; color: white; font-weight: bold; border-radius: 9999px; width: 20px; height: 20px; font-size: 12px; display: flex; justify-content: center; align-items: center; position: absolute; top: -5px; right: -5px; }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Navbar -->
<header class="bg-gray-900 text-white">
  <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
    <!-- Logo + site naam -->
    <div class="flex items-center gap-3">
      <img src="https://via.placeholder.com/40" alt="Logo" class="w-10 h-10 rounded-full">
      <span class="font-bold text-lg" data-i18n="siteName">T.B Agar.io Paid Skins</span>
    </div>
    <!-- Taal + winkelwagen -->
    <div class="flex items-center gap-4">
      <select id="langSelect" class="rounded text-gray-800 px-2 py-1">
        <option value="nl">Nederlands</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
      </select>
      <button id="cartBtn" class="relative bg-teal-500 px-4 py-2 rounded flex items-center gap-2">
        <i data-feather="shopping-cart"></i>
        <span data-i18n="cart">Winkelwagen</span>
        <span id="cartCount" class="cart-badge">0</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto p-6">
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-6"></div>
</main>

<!-- Winkelwagen Modal -->
<div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
  <div class="bg-white rounded shadow-lg max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
    <h2 class="text-2xl font-bold text-center mb-4" data-i18n="yourCart">Winkelwagen</h2>
    <button id="closeModal" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
    <div id="cartItems" class="space-y-4"></div>
    <hr class="border-gray-300 my-4">
    <div class="flex justify-between font-bold text-lg mb-4">
      <span data-i18n="total">Totaal:</span>
      <span id="totalAmount">0</span>
    </div>
    <div class="flex justify-around gap-4">
      <button class="flex-1 bg-gray-200 p-4 rounded text-center" data-i18n="appleGift">Apple Gift Card</button>
      <a id="paypalBtn" target="_blank" class="flex-1 bg-yellow-400 p-4 rounded text-center text-white font-semibold">PayPal</a>
    </div>
  </div>
</div>

<template id="card-template">
  <div class="bg-white rounded shadow p-4 flex flex-col items-center text-center">
    <img src="" alt="thumb" class="card-img" />
    <h3 class="font-semibold mt-4 card-title text-lg" data-i18n="skinName">Skin Name</h3>
    <p class="text-sm text-gray-600 mt-1 card-desc" data-i18n="desc">Description</p>
    <p class="text-md font-medium text-gray-800 mt-2 card-price">USD 0.00</p>
    <div class="mt-4 flex gap-3">
      <button class="shareBtn bg-blue-500 text-white rounded px-4 py-2" data-i18n="share">Share</button>
      <button class="selectBtn bg-green-600 text-white rounded px-4 py-2" data-i18n="select">Select</button>
    </div>
  </div>
</template>

<script>
feather.replace();

const bundles = [
  {id:"special_skin_1", name:"Special Skin", price:9.99, image:"IMG_6174.webp", note:"No extra fees or taxes."},
  {id:"demo_skin_2", name:"Demo Skin", price:12.99, image:"https://via.placeholder.com/120", note:"Example bundle."}
];

const translations = {
  nl: {siteName:"T.B Agar.io Paid Skins", cart:"Winkelwagen", yourCart:"Winkelwagen", total:"Totaal:", appleGift:"Apple Gift Card", share:"Share", select:"Select", desc:"Beschrijving"},
  en: {siteName:"T.B Agar.io Paid Skins", cart:"Cart", yourCart:"Your Cart", total:"Total:", appleGift:"Apple Gift Card", share:"Share", select:"Select", desc:"Description"},
  es: {siteName:"T.B Agar.io Paid Skins", cart:"Carrito", yourCart:"Tu Carrito", total:"Total:", appleGift:"Tarjeta de Regalo Apple", share:"Compartir", select:"Seleccionar", desc:"Descripción"},
  fr: {siteName:"T.B Agar.io Paid Skins", cart:"Panier", yourCart:"Votre Panier", total:"Total:", appleGift:"Carte Cadeau Apple", share:"Partager", select:"Sélectionner", desc:"Description"},
  de: {siteName:"T.B Agar.io Paid Skins", cart:"Warenkorb", yourCart:"Ihr Warenkorb", total:"Gesamt:", appleGift:"Apple Geschenk Karte", share:"Teilen", select:"Auswählen", desc:"Beschreibung"}
};

const grid = document.getElementById('grid');
const template = document.getElementById('card-template');
const cartCount = document.getElementById('cartCount');
const cartItemsContainer = document.getElementById('cartItems');
const totalAmount = document.getElementById('totalAmount');
const cartModal = document.getElementById('cartModal');
const paypalBtn = document.getElementById('paypalBtn');
const fallbackImg = "https://via.placeholder.com/120?text=No+Image";
let cart = [];

// Render skins
function render(list){
  grid.innerHTML='';
  list.forEach(item=>{
    const el = template.content.cloneNode(true);
    el.querySelector('.card-title').textContent=item.name||item.id||'Onbekend';
    el.querySelector('.card-price').textContent=`USD ${item.price.toFixed(2)}`;
    const img=el.querySelector('.card-img');
    img.src=item.image||fallbackImg;
    img.alt=item.name||'thumb';
    img.onerror=()=>{img.src=fallbackImg};
    el.querySelector('.card-desc').textContent=item.note||'';
    el.querySelector('.shareBtn').addEventListener('click',()=>{
      if(navigator.share){navigator.share({title:item.name,text:`Check deze bundle: ${item.name}`})} 
      else{navigator.clipboard.writeText(window.location.href+'#bundle='+encodeURIComponent(item.id||item.name)); alert('Link gekopieerd');}
    });
    el.querySelector('.selectBtn').addEventListener('click',()=>{
      cart.push(item);
      cartCount.textContent=cart.length;
      alert(`${item.name} toegevoegd aan winkelwagen`);
    });
    grid.appendChild(el);
  });
}

// Update winkelwagen modal
function updateCartModal(){
  cartItemsContainer.innerHTML='';
  cart.forEach((item,index)=>{
    const div=document.createElement('div');
    div.className='flex items-center justify-between gap-4 p-2 border rounded';
    div.innerHTML=`
      <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded-full">
      <div class="flex-1">
        <h4 class="font-semibold">${item.name}</h4>
        <p class="text-gray-600">USD ${item.price.toFixed(2)}</p>
      </div>
      <button class="text-red-500 font-bold text-xl removeBtn">&times;</button>
    `;
    div.querySelector('.removeBtn').addEventListener('click',()=>{
      cart.splice(index,1);
      cartCount.textContent=cart.length;
      updateCartModal();
    });
    cartItemsContainer.appendChild(div);
  });

  let total = cart.reduce((acc,item)=>acc+item.price,0);
  totalAmount.textContent=`USD ${total.toFixed(2)}`;
  paypalBtn.href=`https://www.paypal.me/TBYTagario/${total.toFixed(2)}`;
}

// Open winkelwagen modal
document.getElementById('cartBtn').addEventListener('click',()=>{
  if(cart.length===0){alert('Je winkelwagen is leeg'); return;}
  updateCartModal();
  cartModal.classList.remove('hidden');
});

// Sluit modal
document.getElementById('closeModal').addEventListener('click',()=>{cartModal.classList.add('hidden');});

// Taalkeuze
document.getElementById('langSelect').addEventListener('change',(e)=>{
  const lang = e.target.value;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(translations[lang][key]) el.textContent = translations[lang][key];
  });
});

render(bundles);
</script>
</body>
</html>
