<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paidskinsmangerpaneel — beheer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#f3f4f6;}
  .table-cell{padding:12px;border-bottom:1px solid #e5e7eb;}
  .nowrap{white-space:nowrap;}
  .code-box{font-family:monospace;padding:6px 10px;border-radius:6px;background:#fff;border:1px dashed #d1d5db;}
</style>
</head>
<body class="p-6">
  <div class="max-w-6xl mx-auto bg-white rounded shadow p-6">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold">PaidSkins Manager Paneel</h1>
      <div class="flex gap-2">
        <button id="refreshBtn" class="px-3 py-2 bg-gray-200 rounded">Ververs</button>
        <button id="exportBtn" class="px-3 py-2 bg-teal-500 text-white rounded">Export CSV</button>
        <button id="clearBtn" class="px-3 py-2 bg-red-500 text-white rounded">Verwijder alles</button>
      </div>
    </div>

    <div id="noData" class="text-gray-600">Geen bestellingen gevonden.</div>

    <div id="ordersTable" class="mt-4 overflow-auto"></div>
  </div>

<script>
/* Manager paneel leest localStorage sleutel 'paidskins_orders' */
const key='paidskins_orders';
const ordersTable=document.getElementById('ordersTable');
const noData=document.getElementById('noData');
document.getElementById('refreshBtn').addEventListener('click',renderOrders);
document.getElementById('clearBtn').addEventListener('click',()=>{
  if(!confirm('Weet je zeker dat je alle opgeslagen bestellingen wilt verwijderen?')) return;
  localStorage.removeItem(key);
  renderOrders();
});
document.getElementById('exportBtn').addEventListener('click',exportCSV);

function readOrders(){
  return JSON.parse(localStorage.getItem(key) || '[]');
}

function renderOrders(){
  const arr=readOrders();
  if(arr.length===0){
    ordersTable.innerHTML=''; noData.style.display='block'; return;
  }
  noData.style.display='none';
  let html = `<table class="w-full"><thead class="text-left bg-gray-50"><tr>
    <th class="table-cell">Datum</th><th class="table-cell">Code</th><th class="table-cell">UID</th><th class="table-cell">E-mail</th><th class="table-cell">Items</th><th class="table-cell">Totaal (USD)</th><th class="table-cell">Acties</th>
  </tr></thead><tbody>`;
  arr.slice().reverse().forEach((o,idx)=>{
    const date = new Date(o.date).toLocaleString('nl-NL');
    const items = (o.items || []).map(it=>`${it.title} (${it.price.toFixed(2)})`).join(', ');
    html += `<tr>
      <td class="table-cell nowrap">${date}</td>
      <td class="table-cell"><div class="code-box">${o.code}</div></td>
      <td class="table-cell">${o.uid}</td>
      <td class="table-cell">${o.email}</td>
      <td class="table-cell">${items}</td>
      <td class="table-cell">USD ${o.total.toFixed(2)}</td>
      <td class="table-cell">
        <button class="mailtoBtn px-2 py-1 bg-gray-200 rounded" data-email="${o.email}" data-code="${o.code}">E-mail klant</button>
        <button class="deleteBtn px-2 py-1 bg-red-100 rounded" data-index="${idx}">Verwijder</button>
      </td>
    </tr>`;
  });
  html += '</tbody></table>';
  ordersTable.innerHTML = html;

  // voeg eventlisteners toe op de knoppen
  document.querySelectorAll('.mailtoBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const email=btn.dataset.email;
      const code=btn.dataset.code;
      const subject = encodeURIComponent('Over je aankoop bij T.B Agar.io');
      const body = encodeURIComponent(`Hoi,\n\nBedankt voor je aankoop. Jouw code: ${code}\n\nAls er iets mis is met je bestelling mail ons aub terug.\n\nGroeten,\nT.B`);
      window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
    });
  });

  document.querySelectorAll('.deleteBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(!confirm('Verwijder deze bestelling permanent?')) return;
      // delete by index (reverse order in rendering)
      const arr = readOrders();
      const revIndex = arr.length - 1 - parseInt(btn.dataset.index,10);
      arr.splice(revIndex,1);
      localStorage.setItem(key, JSON.stringify(arr));
      renderOrders();
    });
  });
}

function exportCSV(){
  const arr = readOrders();
  if(arr.length===0){ alert('Geen data om te exporteren'); return; }
  const rows = [['datum','code','uid','email','items','total']];
  arr.forEach(o=>{
    const items = (o.items || []).map(it=>`${it.title} (${it.price})`).join(' | ');
    rows.push([o.date, o.code, o.uid, o.email, items, o.total]);
  });
  const csv = rows.map(r=>r.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'paidskins_orders_export.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* Init */
renderOrders();
</script>
</body>
</html>
