<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agar.io Skins & Deals</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#1b2230;
    color:white;

}

/* HEADER */

header{

    background:#273246;
    padding:18px 25px;
    font-size:30px;
    font-weight:bold;
    user-select:none;

}

/* TABS */

.tabs{

    position:relative;
    display:flex;
    background:#202a3b;
    border-bottom:1px solid #31405b;

}

.tab{

    padding:18px 28px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
    color:#9ec7ff;

}

.tab:hover{

    color:white;

}

.tab.active{

    color:white;

}

/* BLUE BAR */

.slider{

    position:absolute;
    bottom:0;
    left:0;

    width:175px;
    height:4px;

    background:#3fa9ff;

    transition:.25s;

}

/* TOP BAR */

.top{

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:22px;

}

.current{

    line-height:28px;

}

.current span{

    color:#5cb6ff;

}

/* SEARCH */

.search{

    width:280px;
    padding:11px;

    border-radius:9px;

    border:1px solid #46566f;

    background:#2c3950;

    color:white;

    outline:none;

}

.search::placeholder{

    color:#9aa8bd;

}

/* GRID */

.grid{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(185px,1fr));

    gap:18px;

    padding:20px;

}

/* CARD */

.card{

    background:#2a3448;

    border-radius:12px;

    padding:12px;

    text-align:center;

    border:2px solid transparent;

    transition:.2s;

}

.card:hover{

    border-color:#3fa9ff;

}

.skin{

    width:115px;

    height:115px;

    margin:auto;

    border-radius:50%;

    overflow:hidden;

    background:#415470;

}

.skin img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.card h3{

    margin-top:12px;

    font-size:18px;

}

.buttons{

    margin-top:12px;

}

.buy{

    background:#28a5ff;

}

.view{

    background:#445b7a;

}

.buy,
.view{

    color:white;

    border:none;

    padding:9px 13px;

    border-radius:8px;

    cursor:pointer;

    margin:4px;

}

/* SPECIAL DEALS */

#dealsPage{

    display:none;

    padding:50px;

    text-align:center;

}

/* POPUP */

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

}

.popup{

    width:420px;

    max-width:90%;

    background:#2a3448;

    margin:70px auto;

    border-radius:12px;

    overflow:hidden;

}

.popupHeader{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:16px;

    background:#34435d;

}

.close{

    cursor:pointer;

    font-size:24px;

    font-weight:bold;

}

.popupBody{

    padding:20px;

}

.line{

    height:1px;

    background:#445b7a;

    margin:15px 0;

}

.email{

    width:100%;

    padding:10px;

    border:none;

    border-radius:8px;

    background:#28a5ff;

    color:white;

    cursor:pointer;

}

</style>

</head>

<body>

<header>
Agar.io Skins & Deals
</header>

<div class="tabs">

<div class="tab active" id="skinsTab">
AGAR.IO SKINS
</div>

<div class="tab" id="dealsTab">
SPECIAL DEALS
</div>

<div class="slider" id="slider"></div>

</div>

<div class="top">

<div class="current">

<b>Currently Equipped Skin</b>

<br>

<span>Default</span>

</div>

<input
class="search"
id="search"
placeholder="Search skins..."
>

</div>

<div id="skinsPage">

<div class="grid" id="grid">

<!-- Skins komen hier automatisch -->

</div>

</div>

<div id="dealsPage">

<h2>Special Deals</h2>

<p>No deals available yet.</p>

</div>

<div class="modal" id="modal">

<div class="popup">

<div class="popupHeader">

<h2 id="productName">
Skin
</h2>

<div class="close" id="closePopup">
✕
</div>

</div>

<div class="popupBody">

<p id="description">
Description...
</p>

<div class="line"></div>

<p id="coins"></p>

<p id="dna"></p>

<div class="line"></div>

<p>
For questions or assistance, please contact our support team!
</p>

<br>

<a
id="emailButton"
href="mailto:support@example.com"
>

<button class="email">

Send Email

</button>

</a>

</div>

</div>

</div>
