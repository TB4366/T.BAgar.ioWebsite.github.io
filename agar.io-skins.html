<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Skin Shop</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#0b0b0b; color:#eee; padding:20px; text-align:center; }
  h1 { color:#0af; margin-bottom:6px; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; }
  input, button, select { padding:8px 12px; border-radius:999px; border:0; font-size:14px; }
  button { cursor:pointer; background:#0af; color:#000; }
  .skins { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin-top:10px; }
  .skinContainer { width:160px; display:flex; flex-direction:column; align-items:center; }
  .skin { width:150px; height:150px; border-radius:50%; overflow:hidden; position:relative; background:#222; display:flex; align-items:center; justify-content:center; transition:transform .12s, filter .12s; }
  .skin img { width:100%; height:100%; object-fit:cover; user-select:none; pointer-events:none; display:block; }
  .skin:hover { transform:translateY(-4px); }
  .grayed img { filter:grayscale(100%); opacity:.45; }
  .lock { position:absolute; top:6px; left:6px; background:rgba(0,0,0,.6); padding:6px; border-radius:50%; font-size:16px; }
  .skinName { margin-top:8px; font-size:14px; }
  .skinPrice { color:#ddd; font-size:13px; margin-top:4px; }
  #message { color:yellow; margin-bottom:8px; }
  #purchasedTitle { margin-top:28px; font-size:18px; text-decoration:underline; }
  #purchasedSkins { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:10px; }
  #purchasedSkins img { width:96px; height:96px; border-radius:50%; border:2px solid #0af; object-fit:cover; }

  #currency { display:flex; gap:18px; align-items:center; justify-content:flex-end; font-size:16px; }
  .currencyItem { display:flex; gap:6px; align-items:center; background:rgba(255,255,255,0.03); padding:6px 10px; border-radius:999px; }

  /* event bar */
  #eventBarContainer { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:999; max-width:90%; overflow:auto; padding:6px; }
  .eventCard { width:220px; height:2.2cm; border:2px solid #0af; border-radius:6px; overflow:hidden; position:relative; cursor:pointer; background:#111; }
  .eventCard img { width:100%; height:100%; object-fit:cover; display:block; }
  .eventCountdown { position:absolute; bottom:0; left:0; width:100%; background:rgba(0,0,0,0.6); color:#fff; font-size:12px; text-align:center; padding:4px 2px; }

  /* deal modal */
  #dealModal { display:none; position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:#151515; color:#fff; border:2px solid #0af; padding:18px; border-radius:10px; z-index:2000; width:320px; max-width:90%; }
  #dealModal img { width:100%; height:160px; object-fit:cover; border-radius:8px; }
  #dealCountdown { font-weight:600; margin-top:8px; }
  #dealNav { display:flex; justify-content:space-between; margin-top:10px; gap:8px; }
  #dealModal button { margin-top:10px; }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div class="top-bar">
  <div id="infoText">Contact admin to top up coins / money</div>
  <div id="currency">
    <div class="currencyItem">💰 <span id="money">0.00</span></div>
    <div class="currencyItem">🪙 <span id="coins">0</span></div>
  </div>
</div>

<div id="message">Enter your key to load your account (or browse available coins skins below)</div>

<div style="margin:8px 0 12px;">
  <input id="keyInput" placeholder="Enter your key here">
  <button onclick="loadKey()">Load Key</button>
  <button onclick="clearKey()">Clear</button>
</div>

<h3>Available Skins</h3>
<div class="skins" id="skinsGrid"></div>

<div id="purchasedSection">
  <div id="purchasedTitle">With these skins and deals you have purchased:</div>
  <div id="purchasedSkins"></div>
</div>

<!-- Event bar -->
<div id="eventBarContainer"></div>

<!-- Deal modal -->
<div id="dealModal" role="dialog" aria-modal="true">
  <h3 id="dealModalTitle"></h3>
  <img id="dealModalImage" src="" alt="Deal image">
  <p id="dealModalDesc" style="margin:8px 0 0;"></p>
  <div id="dealCountdown"></div>
  <div id="dealNav">
    <button onclick="prevDeal()">⬅ Previous</button>
    <button onclick="nextDeal()">Next ➡</button>
  </div>
  <button id="buyDealBtn">Buy Deal</button>
  <button onclick="closeDealModal()" style="margin-left:8px;">Close</button>
</div>

<script>
let currentKey = null;
let coins = 0, money = 0;
let owned = [];
let purchasedDeals = [];
let events = [];
let currentEventDeals = [];
let currentDealIndex = 0;
let dealCountdownInterval = null;

function showMessage(msg){ document.getElementById('message').textContent = msg; }

// ================= KEY HANDLING =================
function getPublishedKeys(){
  return JSON.parse(localStorage.getItem('skinshop_publishedKeys') || '{}');
}

function savePublishedKeys(keys){
  localStorage.setItem('skinshop_publishedKeys', JSON.stringify(keys));
}

async function loadKey(){
  const key = document.getElementById('keyInput').value.trim();
  if(!key){ showMessage('Please enter your key'); return; }

  // FIRST: try to load from server (so key works on ALL devices)
  // Server endpoint expected: POST /api/key/load { key: "theKey" }
  // Response expected: { success: true, keyData: { coins, money, owned, purchasedDeals, name } }
  // If server returns success:true we use that data. If server not available or returns error, fallback to localStorage.
  try {
    const resp = await fetch('/api/key/load', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key })
    });
    if(resp.ok){
      const json = await resp.json();
      if(json && json.success && json.keyData){
        const kd = json.keyData;
        currentKey = key;
        coins = kd.coins || 0;
        money = kd.money || 0;
        owned = Array.isArray(kd.owned) ? kd.owned.slice() : [];
        purchasedDeals = Array.isArray(kd.purchasedDeals) ? kd.purchasedDeals.slice() : [];
        showMessage('✅ Key loaded from server: ' + (kd.name || key));
        renderSkins();
        renderEventBar();
        return;
      } else {
        // server replied but says key not found -> fallback to local
        if(json && json.error){
          showMessage('Server: ' + json.error + ' — falling back to local keys');
        }
      }
    } else {
      // non-200 -> fallback
      console.warn('Server loadKey responded with status', resp.status);
    }
  } catch (err){
    // network/server error -> fallback to localStorage silently
    console.warn('Could not reach server to load key, using localStorage fallback.', err);
  }

  // FALLBACK: load from localStorage (existing behavior)
  const allKeys = getPublishedKeys();
  if(!allKeys[key]){
    showMessage('❌ Invalid key!');
    currentKey = null; coins = 0; money = 0; owned = []; purchasedDeals = [];
    renderSkins(); return;
  }

  currentKey = key;
  coins = allKeys[key].coins || 0;
  money = allKeys[key].money || 0;
  owned = allKeys[key].owned || [];
  purchasedDeals = allKeys[key].purchasedDeals || [];

  showMessage('✅ Key loaded: ' + (allKeys[key].name || key));
  renderSkins();
  renderEventBar();
}

async function clearKey(){
  currentKey = null; coins = 0; money = 0; owned = []; purchasedDeals = [];
  document.getElementById('keyInput').value = '';
  showMessage('Key cleared (you can still browse available skins)');
  renderSkins();
}

// When saving user data we will attempt to sync to the server so the key updates across devices.
// Server endpoint expected: POST /api/key/save { key: "theKey", keyData: { coins, money, owned, purchasedDeals } }
// Response expected: { success: true } or { success:false, error: "..." }
async function saveUserData(){
  if(!currentKey) return;

  // Update local first
  const allKeys = getPublishedKeys();
  if(!allKeys[currentKey]) {
    // if key doesn't exist locally create a placeholder so local browsing still works
    allKeys[currentKey] = { name: currentKey, coins, money, owned, purchasedDeals };
  } else {
    allKeys[currentKey].coins = coins;
    allKeys[currentKey].money = money;
    allKeys[currentKey].owned = owned;
    allKeys[currentKey].purchasedDeals = purchasedDeals;
  }
  savePublishedKeys(allKeys);

  // Try to push to server
  try {
    const resp = await fetch('/api/key/save', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        key: currentKey,
        keyData: { coins, money, owned, purchasedDeals }
      })
    });
    if(resp.ok){
      const json = await resp.json();
      if(json && json.success){
        console.log('Saved user data to server.');
      } else {
        console.warn('Server saveKey responded with error:', json && json.error);
      }
    } else {
      console.warn('Server saveKey responded status', resp.status);
    }
  } catch (err){
    console.warn('Could not reach server to save key data; localStorage updated only.', err);
  }
}

// ================= SKINS =================
function getPublishedSkinsAll(){
  return JSON.parse(localStorage.getItem('skinsDataPublished') || '[]');
}

function renderSkins(){
  const allSkins = getPublishedSkinsAll() || [];
  const coinsSkins = allSkins.filter(s => s.useFor === 'coins');

  const grid = document.getElementById('skinsGrid');
  const purchasedContainer = document.getElementById('purchasedSkins');
  grid.innerHTML = '';
  purchasedContainer.innerHTML = '';

  coinsSkins.forEach(skin=>{
    const isOwned = owned.includes(skin.id);
    if(isOwned){
      addPurchasedItem(skin.image, skin.name);
      return;
    }
    const container = document.createElement('div'); container.className = 'skinContainer';
    const card = document.createElement('div'); card.className = 'skin grayed';
    const img = document.createElement('img'); img.src = skin.image || ''; img.alt = skin.name || 'skin';
    card.appendChild(img);

    const lock = document.createElement('div'); lock.className = 'lock'; lock.textContent = '🔒';
    card.appendChild(lock);

    card.addEventListener('click', ()=>{
      if(!currentKey){ showMessage('Enter your key first to buy skins'); return; }
      buySkin(skin.id, skin.price);
    });

    container.appendChild(card);
    const nameDiv = document.createElement('div'); nameDiv.className='skinName'; nameDiv.textContent = skin.name || '';
    const priceDiv = document.createElement('div'); priceDiv.className='skinPrice'; priceDiv.textContent = 'Price: '+(skin.price||0)+' 🪙';
    container.appendChild(nameDiv); container.appendChild(priceDiv);

    grid.appendChild(container);
  });

  // Purchased skins
  const dealSkinsOwned = allSkins.filter(s => s.useFor === 'deals' && owned.includes(s.id));
  dealSkinsOwned.forEach(skin => addPurchasedItem(skin.image, skin.name));

  document.getElementById('coins').textContent = coins;
  document.getElementById('money').textContent = money.toFixed(2);
}

function addPurchasedItem(imgSrc, name){
  const container = document.getElementById('purchasedSkins');
  const img = document.createElement('img');
  img.src = imgSrc || '';
  img.alt = name || '';
  container.appendChild(img);
}

// BUY SKIN: modified to call server action endpoint for cross-device validation (optional).
// Server endpoint expected (alternative): POST /api/action { key, action:'buySkin', skinId, price }
// Response: { success:true, coins, owned } or { success:false, error: "..."}
async function buySkin(skinId, price){
  if(!currentKey){ showMessage('Enter your key first'); return; }
  if(owned.includes(skinId)){ showMessage('You already own this skin'); return; }

  // Try server-side purchase first (preferred if server available)
  try {
    const resp = await fetch('/api/action', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key: currentKey, action: 'buySkin', skinId, price })
    });
    if(resp.ok){
      const json = await resp.json();
      if(json && json.success){
        coins = json.coins !== undefined ? json.coins : coins - price;
        owned = Array.isArray(json.owned) ? json.owned.slice() : (owned.concat([skinId]));
        await saveUserData(); // ensure both local + server (server already saved but sync)
        showMessage('✅ Skin purchased (server).');
        renderSkins();
        return;
      } else if(json && json.error){
        showMessage('❌ ' + json.error);
        return;
      }
    }
  } catch (err) {
    console.warn('Server action buySkin failed, falling back to local purchase if possible.', err);
  }

  // FALLBACK: local-only purchase (existing behavior)
  if(coins < price){ showMessage('Not enough coins'); return; }
  coins -= price;
  owned.push(skinId);
  saveUserData();
  showMessage('✅ Skin purchased!');
  renderSkins();
}

// ================= EVENTS & DEALS =================
function getPublishedDeals(){
  return JSON.parse(localStorage.getItem('dealDataPublished') || '[]');
}

function getPublishedEvents(){
  return JSON.parse(localStorage.getItem('eventDataPublished') || '[]');
}

function renderEventBar(){
  events = getPublishedEvents() || [];
  const container = document.getElementById('eventBarContainer');
  container.innerHTML = '';
  events.forEach((ev, idx) => {
    const activeDeals = getPublishedDeals().filter(d=>d.eventId===ev.id && d.status==='active' && (!purchasedDeals.includes(d.id)));
    if(activeDeals.length===0) return;
    const card = document.createElement('div'); card.className = 'eventCard';
    const img = document.createElement('img'); img.src = ev.barImage||ev.image||''; img.alt = ev.name||'';
    card.appendChild(img);
    const countdown = document.createElement('div'); countdown.className = 'eventCountdown'; countdown.textContent='';
    card.appendChild(countdown);
    card.dataset.eventIndex = idx;
    card.addEventListener('click', ()=> openEventDeals(ev));
    container.appendChild(card);
  });
}

function openEventDeals(ev){
  if(ev.status==='coming'){ alert('⏳ This event is coming soon'); return; }
  currentEventDeals = getPublishedDeals().filter(d => d.eventId===ev.id && d.status==='active' && !purchasedDeals.includes(d.id));
  if(currentEventDeals.length===0){ alert('No active deals for this event'); return; }
  currentDealIndex = 0;
  showDeal(currentEventDeals[currentDealIndex]);
}

function showDeal(deal){
  document.getElementById('dealModalTitle').textContent = deal.name;
  document.getElementById('dealModalDesc').textContent = deal.desc||'';
  document.getElementById('dealModalImage').src = deal.image||'';
  document.getElementById('dealModal').style.display = 'block';
  updateDealCountdown(deal);
  if(dealCountdownInterval) clearInterval(dealCountdownInterval);
  dealCountdownInterval = setInterval(()=>updateDealCountdown(deal),1000);
  const buyBtn = document.getElementById('buyDealBtn');
  buyBtn.disabled = purchasedDeals.includes(deal.id);
  buyBtn.onclick = ()=> buyDeal(deal);
}

function updateDealCountdown(deal){
  const now = Date.now();
  let remaining = deal.endTime - now;
  if(remaining<0) remaining=0;
  const d = Math.floor(remaining/86400000);
  const h = Math.floor((remaining%86400000)/3600000);
  const m = Math.floor((remaining%3600000)/60000);
  const s = Math.floor((remaining%60000)/1000);
  document.getElementById('dealCountdown').textContent=`Ends in: ${d}d ${h}h ${m}m ${s}s - Price: ${deal.price} 💰`;
}

function closeDealModal(){
  document.getElementById('dealModal').style.display='none';
  if(dealCountdownInterval){ clearInterval(dealCountdownInterval); dealCountdownInterval=null; }
}

function prevDeal(){ if(!currentEventDeals.length) return; currentDealIndex=(currentEventDeals.length+currentDealIndex-1)%currentEventDeals.length; showDeal(currentEventDeals[currentDealIndex]); }
function nextDeal(){ if(!currentEventDeals.length) return; currentDealIndex=(currentDealIndex+1)%currentEventDeals.length; showDeal(currentEventDeals[currentDealIndex]); }

// BUY DEAL: attempt server-side purchase first, fallback to local logic.
// Server endpoint: POST /api/action { key, action:'buyDeal', dealId }  -> returns { success:true, money, owned, purchasedDeals }
async function buyDeal(deal){
  if(!currentKey){ showMessage('Enter your key first'); return; }

  // Try server-side purchase
  try {
    const resp = await fetch('/api/action', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key: currentKey, action: 'buyDeal', dealId: deal.id })
    });
    if(resp.ok){
      const json = await resp.json();
      if(json && json.success){
        money = json.money !== undefined ? json.money : (money - deal.price);
        purchasedDeals = Array.isArray(json.purchasedDeals) ? json.purchasedDeals.slice() : (purchasedDeals.concat([deal.id]));
        if(Array.isArray(json.owned)) owned = json.owned.slice();
        await saveUserData();
        showMessage('✅ Deal purchased (server) — skins added to your inventory');
        renderSkins();
        closeDealModal();
        return;
      } else if(json && json.error){
        showMessage('❌ ' + json.error);
        return;
      }
    }
  } catch (err) {
    console.warn('Server action buyDeal failed, falling back to local purchase if possible.', err);
  }

  // FALLBACK: local purchase
  if(money<deal.price){ showMessage('Not enough money'); return; }
  money -= deal.price;
  if(!purchasedDeals.includes(deal.id)) purchasedDeals.push(deal.id);

  const allSkins = getPublishedSkinsAll();
  if(Array.isArray(deal.skins)){
    deal.skins.forEach(sid=>{
      if(!owned.includes(sid)) owned.push(sid);
    });
  }

  saveUserData();
  showMessage('✅ Deal purchased — skins added to your inventory');
  renderSkins();
  closeDealModal();
}

// ================= INIT =================
(function init(){
  renderSkins();
  renderEventBar();
})();
</script>

</body>
</html>
