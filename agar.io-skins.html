<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agar.io Skin Viewer</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

#skins{
display:grid;
grid-template-columns:repeat(auto-fill,120px);
gap:12px;
justify-content:center;
}

.skin{
background:#1e1e1e;
padding:10px;
border-radius:10px;
transition:0.2s;
}

.skin:hover{
transform:scale(1.05);
}

.skin img{
width:100px;
height:100px;
border-radius:50%;
}

.skin p{
font-size:12px;
margin-top:5px;
}

</style>
</head>

<body>

<h1>Agar.io Skins</h1>

<div id="skins"></div>

<script>

const configURL =
"https://configs-web.agario.miniclippt.com/live/v15/10890/GameConfiguration.json";

const skinBase =
"https://configs-web.agario.miniclippt.com/live/v15/10890/";

fetch(configURL)
.then(r => r.json())
.then(data => {

console.log(data);

let skins =
data.skins ||
data.shopSkins ||
data.defaultSkins ||
[];

// nieuwste bovenaan
skins = skins.reverse();

const container = document.getElementById("skins");

skins.forEach(skin => {

let name =
skin.name ||
skin.id ||
"unknown";

const div = document.createElement("div");
div.className = "skin";

const img = document.createElement("img");
img.src = skinBase + name + "_hi.png";

const label = document.createElement("p");
label.textContent = name;

div.appendChild(img);
div.appendChild(label);

container.appendChild(div);

});

});

</script>

</body>
</html>
