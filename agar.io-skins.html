<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Agar.io Shop</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0a0a0a;
        color: white;
    }

    .topbar {
        background: #111;
        padding: 15px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        border-bottom: 2px solid #333;
    }

    .uid-box {
        text-align: center;
        margin-top: 10px;
    }

    .uid-box input {
        padding: 10px;
        width: 250px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 16px;
    }

    .offers {
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
    }

    .offer {
        background: #1d1d1d;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        cursor: pointer;
        border: 2px solid #2c2c2c;
        transition: 0.15s;
    }

    .offer:hover {
        transform: scale(1.05);
        border-color: #5af;
    }

    .offer img {
        width: 110px;
        height: 110px;
        border-radius: 10px;
    }

    .offer-title {
        font-size: 16px;
        margin-top: 10px;
        font-weight: bold;
    }

    .offer-price {
        margin-top: 5px;
        color: #5af;
        font-size: 14px;
    }

    /* POPUP */
    .popup-bg {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        display: none;
        justify-content: center;
        align-items: center;
    }

    .popup {
        background: #222;
        padding: 25px;
        border-radius: 12px;
        width: 320px;
        text-align: center;
    }

    .popup button {
        margin: 10px;
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 16px;
    }

    .btn-yes {
        background: #5af;
        font-weight: bold;
        color: black;
    }

    .btn-no {
        background: #555;
        color: white;
    }
</style>
</head>

<body>

<div class="topbar">Agar.io Shop</div>

<div class="uid-box">
    <input id="uidInput" placeholder="Voer jouw UID in…">
</div>

<div class="offers" id="offers">Aan het laden…</div>

<div class="popup-bg" id="popupBg">
    <div class="popup">
        <div id="popupText">Je staat op het punt te betalen…</div>
        <button class="btn-yes" id="confirmBuy">Toestaan</button>
        <button class="btn-no" onclick="closePopup()">Annuleren</button>
    </div>
</div>

<script>
const configURL = "https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json";

// DIT VERVANG JIJ STRAKS MET JE ECHTE XSOLLA TEMPLATE:
let XSOLLA_TEMPLATE = "https://secure.xsolla.com/paystation3/?project_id=JOUWID&purchase={PRODUCT}&uid={UID}";

let selectedProduct = null;

async function loadOffers() {
    try {
        const res = await fetch(configURL);
        const json = await res.json();

        const container = document.getElementById("offers");
        container.innerHTML = "";

        json.store.offers.forEach(ofr => {
            if (!ofr.productId) return;

            let div = document.createElement("div");
            div.className = "offer";

            div.innerHTML = `
                <img src="${ofr.imageUrl}">
                <div class="offer-title">${ofr.title}</div>
                <div class="offer-price">${ofr.price.amount} ${ofr.price.currency}</div>
            `;

            div.onclick = () => openPopup(ofr);

            container.appendChild(div);
        });

    } catch (err) {
        document.getElementById("offers").innerHTML = "Fout bij laden…";
    }
}

function openPopup(ofr) {
    selectedProduct = ofr;
    document.getElementById("popupText").innerHTML =
        `Venster openen om <b>${ofr.title}</b> te kopen?`;

    document.getElementById("popupBg").style.display = "flex";
}

function closePopup() {
    document.getElementById("popupBg").style.display = "none";
}

document.getElementById("confirmBuy").onclick = () => {
    const uid = document.getElementById("uidInput").value.trim();

    if (!uid) {
        alert("Voer eerst je UID in!");
        return;
    }

    closePopup();

    let url = XSOLLA_TEMPLATE
        .replace("{PRODUCT}", selectedProduct.productId)
        .replace("{UID}", uid);

    window.open(url, "_blank");
};

loadOffers();
</script>

</body>
</html>
