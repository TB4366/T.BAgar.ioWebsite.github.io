<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; text-align:center;}
h1 { color:#0af; font-size:28px; margin-bottom:10px; }
#coins, #money { font-weight:bold; }
#eventBar { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); width:2cm; height:1cm; cursor:pointer; overflow:hidden; border:2px solid orange; border-radius:5px; z-index:999; }
#eventBar img { width:100%; height:100%; object-fit:cover; }
#eventModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#222; padding:20px; border:2px solid orange; border-radius:10px; z-index:1000; max-width:400px; color:#fff; }
#eventModal img { width:100%; border-radius:10px; margin-bottom:10px; }
#eventModal button { margin-top:10px; }
#swipeButtons { display:flex; justify-content:space-between; margin-top:10px; }
#swipeButtons button { padding:5px 10px; cursor:pointer; border-radius:5px; border:none; background:#0af; color:#000; }
</style>
</head>
<body>

<h1>Skin Shop</h1>
<div>
  Coins: <span id="coins">0</span> 💠 | Money (€): <span id="money">0.00</span>
</div>

<!-- Event bar -->
<div id="eventBar"><img id="eventBarImage" src=""></div>

<!-- Event modal -->
<div id="eventModal">
  <h3 id="modalName"></h3>
  <img id="modalImage" src="">
  <p id="modalDesc"></p>
  <div id="modalPrice" style="font-weight:bold; margin:10px 0;"></div>
  <button id="buyDealBtn">Buy Now</button>
  <div id="swipeButtons">
    <button onclick="prevEvent()">⬅️ Previous</button>
    <button onclick="nextEvent()">Next ➡️</button>
  </div>
  <button onclick="closeModal()">Close</button>
</div>

<script>
let currentKey = null;
let coins = 0, money = 0;
let events = [];
let currentEventIndex = 0;

// =======================
// Load user key
// =======================
function loadKey(){
  const key = prompt("Enter your key:");
  if(!key) return alert('No key entered');
  const data = JSON.parse(localStorage.getItem('skinshop_'+key)||'{}');
  if(!data || data.coins===undefined){ alert('Invalid key'); return; }
  currentKey = key;
  coins = data.coins||0;
  money = data.money||0;
  document.getElementById('coins').textContent = coins;
  document.getElementById('money').textContent = money.toFixed(2);
}

// =======================
// Load events
// =======================
function loadEvents(){
  events = JSON.parse(localStorage.getItem('eventDataPublished')||'[]')
            .filter(e => e.status==='active' || e.status==='coming');
  updateEventBar();
}

// =======================
// Event Bar
// =======================
function updateEventBar(){
  if(events.length===0){ document.getElementById('eventBarImage').src=''; return; }
  document.getElementById('eventBarImage').src = events[0].image || '';
}

document.getElementById('eventBar').onclick = ()=>{
  if(events.length===0) return;
  currentEventIndex = 0;
  openModal(events[currentEventIndex]);
};

// =======================
// Modal
// =======================
function openModal(event){
  document.getElementById('modalName').textContent = event.name;
  document.getElementById('modalDesc').textContent = event.desc;
  document.getElementById('modalImage').src = event.image;
  document.getElementById('modalPrice').textContent = "💵 Price: €"+(event.price||0).toFixed(2);
  document.getElementById('eventModal').style.display='block';
  document.getElementById('buyDealBtn').disabled = event.status!=='active';
  document.getElementById('buyDealBtn').onclick = ()=>buyDeal(event);
}

function closeModal(){
  document.getElementById('eventModal').style.display='none';
}

function prevEvent(){
  if(events.length===0) return;
  currentEventIndex = (currentEventIndex-1+events.length)%events.length;
  openModal(events[currentEventIndex]);
}

function nextEvent(){
  if(events.length===0) return;
  currentEventIndex = (currentEventIndex+1)%events.length;
  openModal(events[currentEventIndex]);
}

// =======================
// Buy Deal
// =======================
function buyDeal(event){
  if(!currentKey) return alert('Enter your key first');
  if(money < (event.price||0)) return alert('Not enough money');
  money -= event.price||0;
  let data = JSON.parse(localStorage.getItem('skinshop_'+currentKey));
  data.money = money;
  localStorage.setItem('skinshop_'+currentKey, JSON.stringify(data));
  document.getElementById('money').textContent = money.toFixed(2);
  alert('✅ Deal purchased!');
}

// =======================
// Init
// =======================
loadKey();
loadEvents();
</script>

</body>
</html>
