<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; text-align:center;}
h1 { color:#0af; font-size:28px; margin-bottom:10px; }
.top-bar { display:flex; justify-content:flex-end; align-items:center; gap:20px; margin-bottom:20px; }
.top-bar div { display:flex; align-items:center; gap:5px; font-size:16px; }
.skins { display:flex; flex-wrap: wrap; gap:25px; justify-content:center; margin-top:20px; }
.skinContainer { display:flex; flex-direction:column; align-items:center; }
.skin { width:150px; height:150px; border-radius:50%; background:#333; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; transition: transform 0.1s, filter 0.1s;}
.skin img { width:100%; height:100%; object-fit:cover; border-radius:50%; transition: filter 0.2s, opacity 0.2s; }
.skin:hover { filter: brightness(1.2); }
.lock { position:absolute; top:5px; left:5px; font-size:18px; background:rgba(0,0,0,0.6); padding:3px 6px; border-radius:50%; }
.grayed img { filter: grayscale(100%); opacity:0.5; pointer-events:none; }
.skinName, .skinPrice { margin-top:5px; font-size:14px; }
#keyInput { width:300px; font-size:18px; text-align:center; }
#message { font-size:18px; margin-top:10px; color:yellow; }
#purchasedTitle { margin-top:30px; font-size:20px; text-decoration:underline; }
#purchasedSkins { display:flex; flex-wrap: wrap; justify-content:center; gap:20px; margin-top:10px;}
#purchasedSkins img { width:100px; height:100px; border-radius:50%; border:2px solid #0af; }

/* Event bar */
#eventBar { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); width:180px; height:90px; border-radius:10px; overflow:hidden; cursor:pointer; border:2px solid #0af; display:flex; align-items:center; justify-content:center; }
#eventBar img { width:100%; height:100%; object-fit:cover; transition: opacity 1s ease-in-out; position:absolute; top:0; left:0; }
#eventModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#222; padding:20px; border:2px solid #0af; border-radius:10px; z-index:1000; max-width:400px; color:#fff; }
#eventModal button { margin-top:10px; }
#dealContent { display:flex; flex-direction:column; align-items:center; gap:10px; }
#dealControls { display:flex; justify-content:space-between; width:100%; margin-top:10px; }

/* Fade animation for swipe */
#dealContent img {
  max-width:200px;
  border-radius:10px;
  transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
  opacity:1;
}
.fade-out { opacity:0; transform:translateX(-50px); }
.fade-in { opacity:1; transform:translateX(0); }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div class="top-bar">
  <div><img src="coins_icon.png" width="24"> <span id="coins">0</span></div>
  <div><img src="money_icon.png" width="24"> <span id="money">0.00</span></div>
</div>

<div id="message">Enter your key below to load your coins and skins:</div>

<input id="keyInput" placeholder="Enter your key here">
<button onclick="loadKey()">Load Key</button>

<h3>Available Skins</h3>
<div class="skins" id="skinsGrid"></div>

<div id="purchasedSection">
  <div id="purchasedTitle">With these skins you have purchased:</div>
  <div id="purchasedSkins"></div>
</div>

<!-- Event bar -->
<div id="eventBar"></div>

<!-- Event modal -->
<div id="eventModal">
  <h3 id="modalName"></h3>
  <p id="modalDesc"></p>
  <div id="dealContent"></div>
  <div id="dealControls">
    <button onclick="prevDeal()">◀ Prev</button>
    <button onclick="nextDeal()">Next ▶</button>
  </div>
  <div id="dealTimer"></div>
  <button onclick="closeModal()">Close</button>
</div>

<script>
let currentKey = null, coins = 0, money = 0, owned = [];
let deals = [], currentDealIndex = 0;
let eventIndex = 0, eventImages = [];

// =======================
// User / Skins
// =======================
function getPublishedSkins(){ return JSON.parse(localStorage.getItem("skinsDataPublished") || "[]"); }
function getPublishedDeals(){ return JSON.parse(localStorage.getItem("dealDataPublished") || "[]"); }
function getPublishedEvents(){ return JSON.parse(localStorage.getItem("eventDataPublished") || "[]"); }

function showMessage(msg){ document.getElementById('message').textContent=msg; }
function saveData(){ if(!currentKey) return; localStorage.setItem('skinshop_'+currentKey, JSON.stringify({coins,money,owned})); }

function renderSkins(){
  const skins = getPublishedSkins();
  const grid = document.getElementById('skinsGrid');
  grid.innerHTML='';
  const purchasedContainer = document.getElementById('purchasedSkins');
  purchasedContainer.innerHTML='';

  if(skins.length === 0){ grid.innerHTML = "<p>No skins available. Contact the admin.</p>"; }

  skins.forEach(skin=>{
    const isOwned = owned.includes(skin.id);
    const container = document.createElement('div'); container.className='skinContainer';
    const div = document.createElement('div'); div.className='skin '+(isOwned?'':'grayed');
    div.innerHTML=`<img src="${skin.image}" alt="${skin.name}">`;

    if(!isOwned){
      const lock = document.createElement('div'); lock.className='lock'; lock.textContent='🔒'; div.appendChild(lock);
      div.onclick = ()=>buySkin(skin.id, skin.price);
    } else {
      const lock = document.createElement('div'); lock.className='lock'; lock.textContent='✓'; div.appendChild(lock);
    }

    container.appendChild(div);
    const nameDiv = document.createElement('div'); nameDiv.className='skinName'; nameDiv.textContent=skin.name; container.appendChild(nameDiv);
    const priceDiv = document.createElement('div'); priceDiv.className='skinPrice'; priceDiv.textContent='Price: '+skin.price+' 💠'; container.appendChild(priceDiv);
    grid.appendChild(container);

    if(isOwned){
      const pImg = document.createElement('img'); pImg.src = skin.image; pImg.alt = skin.name; purchasedContainer.appendChild(pImg);
    }
  });
  document.getElementById('coins').textContent=coins;
  document.getElementById('money').textContent=money.toFixed(2);
}

function loadKey(){
  const key = document.getElementById('keyInput').value.trim();
  if(!key) return showMessage('Please enter your key');
  const data = JSON.parse(localStorage.getItem('skinshop_'+key)||'{}');
  if(!data || data.coins===undefined){ showMessage('❌ Invalid key!'); currentKey=null; coins=0; money=0; owned=[]; renderSkins(); return; }
  currentKey = key; coins = data.coins||0; money = data.money||0; owned = data.owned||[];
  showMessage('✅ Key loaded successfully!');
  deals = getPublishedDeals();
  renderSkins();
  initEventBar();
}

// =======================
// Buy Skin
// =======================
function buySkin(id,price){
  if(!currentKey) return showMessage('Enter your key first');
  if(owned.includes(id)) return showMessage('You already own this skin');
  if(coins<price) return showMessage('Not enough coins');
  coins-=price; owned.push(id); saveData(); showMessage('Skin purchased!'); renderSkins();
}

// =======================
// Event Bar
// =======================
function initEventBar(){
  const events = getPublishedEvents().filter(e=>e.status!=='inactive');
  if(events.length===0) return;
  eventImages = events.map(e=>e.barImage || e.image || '');
  const bar = document.getElementById('eventBar');
  bar.innerHTML = '';
  eventIndex = 0;
  const img = document.createElement('img');
  img.src = eventImages[eventIndex];
  bar.appendChild(img);

  setInterval(()=>{
    img.style.opacity = 0;
    setTimeout(()=>{
      eventIndex = (eventIndex+1)%eventImages.length;
      img.src = eventImages[eventIndex];
      img.style.opacity = 1;
    },1000);
  },5000);

  bar.onclick = ()=>openModal();
}

// =======================
// Modal & Deal Swipe
// =======================
function openModal(){
  if(deals.length===0) return;
  currentDealIndex = 0;
  showDeal(currentDealIndex);
  document.getElementById('eventModal').style.display='block';
}

function closeModal(){ document.getElementById('eventModal').style.display='none'; }

function showDeal(index){
  const deal = deals[index];
  if(!deal) return;
  const content = document.getElementById('dealContent');
  const newImg = document.createElement('img');
  newImg.src = deal.status==='coming'?deal.comingImage:deal.image;
  newImg.classList.add('fade-out');
  content.innerHTML = '';
  content.appendChild(newImg);
  content.innerHTML += `<p>Coins: ${deal.coins} | DNA: ${deal.dna} | MassBoost: x${deal.massBoost} | Skin: ${deal.skin}</p>
                        <p>Price: €${deal.price}</p>`;
  setTimeout(()=>{ newImg.classList.remove('fade-out'); newImg.classList.add('fade-in'); },50);
  document.getElementById('modalName').textContent = deal.name;
  document.getElementById('modalDesc').textContent = deal.desc;
  updateTimer();
}

function prevDeal(){ currentDealIndex = (currentDealIndex-1+deals.length)%deals.length; showDeal(currentDealIndex); }
function nextDeal(){ currentDealIndex = (currentDealIndex+1)%deals.length; showDeal(currentDealIndex); }

function updateTimer(){
  const deal = deals[currentDealIndex];
  if(!deal) return;
  const now = Date.now();
  const end = deal.endTime;
  const diff = Math.max(end-now,0);
  const hours = Math.floor(diff/3600000);
  const mins = Math.floor((diff%3600000)/60000);
  const secs = Math.floor((diff%60000)/1000);
  document.getElementById('dealTimer').textContent = `Offer Ends in: ${hours}h ${mins}m ${secs}s`;
  if(diff>0) setTimeout(updateTimer,1000);
}

// Initial render
renderSkins();
</script>

</body>
</html>
