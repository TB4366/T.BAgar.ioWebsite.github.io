<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prize Wheel</title>
<style>
body {margin:0;font-family:Arial,sans-serif;background:#0b1220;color:white;}
header {display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background:#09172c;border-bottom:2px solid #48cae4;}
.logo {font-size:1.5rem;font-weight:bold;color:#48cae4;}
.nav a {margin-left:20px;color:#48cae4;text-decoration:none;font-weight:bold;}
.btn-login {background:#48cae4;color:#02111a;padding:8px 15px;border-radius:6px;text-decoration:none;font-weight:bold;}
#wheel-container {text-align:center;margin-top:60px;}
#wheel {width:350px;height:350px;border-radius:50%;border:10px solid #48cae4;margin:auto;transition:5s;}
#spinBtn, #freeBtn {margin-top:20px;padding:12px 25px;font-size:1rem;font-weight:bold;border:none;border-radius:8px;cursor:pointer;}
#spinBtn {background:#48cae4;color:#02111a;}
#freeBtn {background:#06b6d4;color:#02111a;}
.message {margin-top:20px;font-size:1.2rem;color:#48cae4;}
</style>
</head>
<body>
<header>
<div class="logo">T.B Agar.io</div>
<div class="nav">
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Contact</a>
<a href="#" class="btn-login" id="loginBtn">Login</a>
</div>
</header>

<div id="wheel-container">
<canvas id="wheel" width="350" height="350"></canvas>
<br>
<button id="freeBtn">Play 1 Time Free</button>
<button id="spinBtn">Spin ($2)</button>
<div class="message" id="msg"></div>
</div>

<script>
let loggedIn=false;
let freeUsed=false;
let userBalance=10;
let prizes=["Skin","Coins","Nothing","2x Coins","VIP 1 Day","Booster"];
const wheel=document.getElementById("wheel");
const ctx=wheel.getContext("2d");
function drawWheel(){
  let arc=Math.PI*2/prizes.length;
  for(let i=0;i<prizes.length;i++){
    ctx.beginPath();
    ctx.fillStyle=i%2?"#14334d":"#0e2238";
    ctx.moveTo(175,175);
    ctx.arc(175,175,175,i*arc,(i+1)*arc);
    ctx.fill();
    ctx.save();
    ctx.translate(175,175);
    ctx.rotate(i*arc+arc/2);
    ctx.fillStyle="#48cae4";
    ctx.font="17px Arial";
    ctx.fillText(prizes[i],60,5);
    ctx.restore();
  }
}
drawWheel();

document.getElementById("loginBtn").onclick=()=>{
  loggedIn=true;
  alert("Logged in successfully!");
};

document.getElementById("freeBtn").onclick=()=>{
  if(!loggedIn) return alert("You must be logged in!");
  if(freeUsed) return alert("Free spin already used!");
  spinWheel(true);
};

document.getElementById("spinBtn").onclick=()=>{
  if(!loggedIn) return alert("You must be logged in!");
  if(userBalance<2) return alert("Not enough balance!");
  userBalance-=2;
  spinWheel(false);
};

function spinWheel(isFree){
  freeUsed = freeUsed || isFree;
  let rand=Math.random()*360 + 1800;
  wheel.style.transform=`rotate(${rand}deg)`;
  setTimeout(()=>{
    let actual=(rand%360);
    let arc=360/prizes.length;
    let index=Math.floor(actual/arc);
    let prize=prizes[prizes.length-index-1];
    document.getElementById("msg").textContent="You won: "+prize;
  },5000);
}
</script>

</body>
</html>
