<title>Agar.io Skin - @t.bagar.io</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    font-weight:bold;
}

h1{
    font-size:28px;
    margin:18px 0;
}

/* =========================
   SECTIONS
========================= */

.sections{
    display:flex;
    justify-content:center;
    gap:0;
    margin:10px auto 18px;
}

.section-btn{
    background:#111;
    color:#fff;
    border:0;
    border-bottom:3px solid transparent;
    padding:12px 25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.section-btn:hover{
    background:#181818;
}

.section-btn.active{
    color:#1683ff;
    border-bottom-color:#1683ff;
}


/* =========================
   VERSION
========================= */

.version-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:8px 0 18px;
}

.version-label{
    font-size:20px;
}

#version{
    font-size:20px;
    padding:4px;
}


/* =========================
   AGARIO SKINS
   10 x 12 = 120
========================= */

#skins{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:10px;
    padding:15px;
    max-width:1400px;
    margin:auto;
}


/* =========================
   YOUTUBER SKINS
   6 x 5 = 30
========================= */

#youtuberSkins{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:14px;
    padding:15px;
    max-width:1100px;
    margin:auto;
}

/* =========================
   AGARIO YOUTUBERS (LIST)
   6 x 5 = 30 (only name + status)
========================= */

#youtubersList{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:14px;
    padding:15px;
    max-width:1100px;
    margin:auto;
}

/* =========================
   SKIN CARDS
========================= */

.skin{
    cursor:pointer;
    padding:8px;
    background:#111;
    border:2px solid #222;
    border-radius:8px;
}

.skin:hover{
    border-color:#1683ff;
}

.skin img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:contain;
}

#youtuberSkins .skin img{
    width:120px;
    height:120px;
}

.skin span{
    display:block;
    margin-top:6px;
    font-size:13px;
}

/* For name-only cards */
.name-only{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:18px 8px;
    min-height:120px;
}

.name-only .youtuber-name{
    font-size:16px;
    margin-top:6px;
}

/* =========================
   PAGINATION
========================= */

#pages{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    padding:30px 15px 40px;
}

.page-btn{
    background:#1683ff;
    color:#fff;
    border:0;
    border-radius:7px;
    padding:9px 14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    min-width:42px;
    box-shadow:0 2px 5px #0008;
}

.page-btn:hover{
    background:#0b6ed6;
}

.page-btn.active{
    background:#0753a6;
}


/* =========================
   SOCIAL BUTTONS
========================= */

.social-buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin:0 0 15px;
}

.social-buttons a{
    display:inline-block;
    color:#fff;
    text-decoration:none;
    padding:9px 16px;
    border-radius:7px;
    font-size:15px;
    font-weight:bold;
    transition:0.2s;
}

.social-buttons a:hover{
    transform:translateY(-2px);
    opacity:0.9;
}

.youtube{
    background:#ff0000;
}

.instagram{
    background:#e1306c;
}

.discord{
    background:#5865f2;
}


/* =========================
   HIDDEN
========================= */

.hidden{
    display:none;
}

/* =========================
   YOUTUBER STATUS
========================= */
.youtuber-name{
    display:block;
    margin-top:8px;
    font-size:15px;
}

.youtuber-status{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    margin-top:6px;
    font-size:13px;
}

.status-label{
    color:#fff;
}

.status-value{
    font-weight:bold;
}

.status-active{ color:#22c55e; }
.status-less-active{ color:#facc15; }
.status-not-active{ color:#f97316; }
.status-inactive{ color:#ef4444; }

.skin-instruction{
    margin-top:7px;
    font-size:12px;
    line-height:1.35;
    color:#bbb;
}

.skin-instruction strong{
    color:#fff;
}

/* Modal */
.modal-overlay{
    position:fixed;
    left:0;
    top:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,0.75);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 20px;
    z-index:9999;
}

.modal{
    background:#0f1724;
    border:1px solid #223;
    padding:18px;
    max-width:1000px;
    width:100%;
    border-radius:10px;
    color:#fff;
}

.modal-header{
    display:flex;
    justify-content:space-between;

.modal-title{
    font-size:20px;
    font-weight:bold;

.modal-close{

    color:#fff;
    border:0;
    padding:8px 10px;
    border-radius:6px;

.modal-body{

<script>

const API =
    "https://configs-web.agario.miniclippt.com/live/";

let version = "v15/3032";

let allSkins = [];
let youtuberSkins = [];

let currentAgarioPage = 1;
let currentYoutuberPage = 1;
let currentYoutubersListPage = 1;

/* =====================================================
   SECTION SWITCHING
===================================================== */

function showSection(section){

    const agario =
        document.getElementById("agarioSection");

    const youtuber =
        document.getElementById("youtuberSection");

    const youtubersList =
        document.getElementById("agarioYoutubersSection");

    const agarioBtn =
        document.getElementById("agarioSectionBtn");

    const youtuberBtn =
        document.getElementById("youtuberSectionBtn");

    const youtubersListBtn =
        document.getElementById("youtubersListBtn");


    // hide all
    agario.classList.add("hidden");
    youtuber.classList.add("hidden");
    youtubersList.classList.add("hidden");

    agarioBtn.classList.remove("active");
    youtuberBtn.classList.remove("active");
    youtubersListBtn.classList.remove("active");

    if(section === "agario"){

        agario.classList.remove("hidden");
        agarioBtn.classList.add("active");

    }else if(section === "youtuber"){

        youtuber.classList.remove("hidden");
        youtuberBtn.classList.add("active");

        if(youtuberSkins.length === 0){
            loadYoutuberSkins();
        }

    }else if(section === "youtubersList"){

        youtubersList.classList.remove("hidden");
        youtubersListBtn.classList.add("active");

        if(youtuberSkins.length === 0){
            loadYoutuberSkins();
        }else{
            renderYoutubersListPage(1);
        }

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   VERSIONS
===================================================== */

async function versions(){

    const s =
        document.getElementById("version");

    try{

        const r =
            await fetch(
                "https://lmsettings.snez.org/",
                {
                    headers:{
                        username:"LMConfigVersion",
                        password:"LMConfigVersionPass"
                    }
                }
            );

        const v =
            await r.json();

        Object.values(v).forEach(x=>{

            const o =
                new Option(
                    x,
                    x.replace(/\/$/,"")
                );

            s.add(o);

        });

        if(s.options.length){

            version =
                s.value =
                s.options[
                    s.options.length - 1
                ].value;

        }

    }catch(e){

        s.add(
            new Option(
                version,
                version
            )
        );

    }

    loadSkins();
}


/* =====================================================
   LOAD AGARIO SKINS
===================================================== */

async function loadSkins(){

    const box =
        document.getElementById("skins");

    box.innerHTML =
        "Loading skins...";

    try{

        const r =
            await fetch(
                API +
                version +
                "/GameConfiguration.json"
            );

        const text =
            await r.text();

        const a =
            text.match(
                /\[(.*?)\]/g
            ) || [];

        const str =
            a[25] || "";

        const ids =
            str.match(
                /productId":"(.*?)"/g
            ) ||
            str.match(
                /productId": "(.*?)"/g
            ) ||
            [];

        const imgs =
            str.match(
                /image":"(.*?)"/g
            ) ||
            str.match(
                /image": "(.*?)"/g
            ) ||
            [];

        const skins = [];

        for(
            let i = 0;
            i < Math.min(
                ids.length,
                imgs.length
            );
            i++
        ){

            const id =
                ids[i]
                    .replace(/"/g,"")
                    .replace(/productId:/,"")
                    .replace(/skin_/,"")
                    .replace(/id:/,"")
                    .replace(" ","");

            const img =
                imgs[i]
                    .replace(/"/g,"")
                    .replace(/image:/,"")
                    .replace(" ","");

            if(
                !img.includes(
                    "uses_spine"
                )
            ){

                skins.push([
                    id,
                    img
                ]);

            }

        }

        /*
         * Nieuwste eerst
         */
        skins.reverse();

        allSkins = skins;

        renderAgarioPage(1);

    }catch(e){

        box.textContent =
            "Unable to load skins.";

    }
}


/* =====================================================
   AGARIO PAGINATION
   120 PER PAGE
===================================================== */

function renderAgarioPage(page){

    const perPage = 120;

    const box =
        document.getElementById("skins");

    const pages =
        document.getElementById(
            "agarioPages"
        );

    const total =
        Math.ceil(
            allSkins.length /
            perPage
        );

    currentAgarioPage = page;

    box.innerHTML = "";

    const start =
        (page - 1) *
        perPage;

    allSkins
        .slice(
            start,
            start + perPage
        )
        .forEach(
            ([id,img])=>{

                const d =
                    document.createElement(
                        "div"
                    );

                d.className =
                    "skin";

                d.innerHTML = `
                    <img
                        src="${API + version + "/" + img}"
                        alt="${id}"
                    >

                    <span>
                        ${id.replace(/\_/g," ")}
                    </span>
                `;

                box.appendChild(d);

            }
        );


    pages.innerHTML = "";

    for(
        let i = 1;
        i <= total;
        i++
    ){

        const b =
            document.createElement(
                "button"
            );

        b.className =
            "page-btn" +
            (
                i === page
                ? " active"
                : ""
            );

        b.textContent = i;

        b.onclick =
            ()=>renderAgarioPage(i);

        pages.appendChild(b);

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

/* =====================================================
   LOAD YOUTUBER SKINS
   This also populates the youtubers list content.
===================================================== */

async function loadYoutuberSkins(){

    const box =
        document.getElementById(
            "youtuberSkins"
        );

    box.innerHTML =
        "Loading Youtuber skins...";

    /*
     * De daadwerkelijke afbeelding-URL's
     * worden automatisch opgehaald van
     * agario-skins.top.
     */

    try{

        const sourceUrl =
            "https://www.agario-skins.top/youtuber-skins/";

        let response;
        let html = "";

        /*
         * The original direct fetch can be blocked by CORS.
         * Use a CORS-friendly proxy first, then try the direct URL.
         */
        try {
            response = await fetch(
                "https://api.allorigins.win/raw?url=" +
                encodeURIComponent(sourceUrl)
            );

            if (!response.ok) {
                throw new Error("Proxy request failed");
            }

            html = await response.text();
        } catch (proxyError) {
            response = await fetch(sourceUrl);

            if (!response.ok) {
                throw new Error("Unable to load Youtuber skins");
            }

            html = await response.text();
        }

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(
                html,
                "text/html"
            );

        const found = [];

        const headings =
            doc.querySelectorAll(
                "h2"
            );

        headings.forEach(h2=>{

            const name =
                h2.textContent.trim();

            let img =
                h2.previousElementSibling;

            while(
                img &&
                img.tagName !== "IMG"
            ){

                img =
                    img.previousElementSibling;

            }

            if(
                img &&
                img.src
            ){

                found.push([
                    name,
                    img.src
                ]);

            }

        });


        /*
         * Als de website-afbeeldingen gevonden zijn,
         * gebruiken we deze.
         */
        if(found.length){

            youtuberSkins =
                found.map(([name, img]) => {
                    const custom = YOUTUBER_DATA.find(x => x[0] === name);
                    return [name, img, custom ? custom[2] : `Set the nick **${name}** to use this skin.`];
                });

        }else{

            youtuberSkins =
                YOUTUBER_DATA;

        }

        renderYoutuberPage(1);
        renderYoutubersListPage(1);

    }catch(e){

        /*
         * Fallback
         */
        youtuberSkins =
            YOUTUBER_DATA;

        renderYoutuberPage(1);
        renderYoutubersListPage(1);

    }
}


/* =====================================================
   YOUTUBER PAGINATION (image cards)
   30 PER PAGE
   6 x 5
===================================================== */

function renderYoutuberPage(page){

    const perPage = 30;

    const box =
        document.getElementById(
            "youtuberSkins"
        );

    const pages =
        document.getElementById(
            "youtuberPages"
        );

    const total =
        Math.ceil(
            youtuberSkins.length /
            perPage
        );

    currentYoutuberPage =
        page;

    box.innerHTML = "";

    const start =
        (page - 1) *
        perPage;


    youtuberSkins
        .slice(
            start,
            start + perPage
        )
        .forEach(
            (skin)=>{

                const name = skin[0];
                const img = skin[1];
                const instruction = skin[2] || `Set the nick **${name}** to use this skin.`;

                const d =
                    document.createElement(
                        "div"
                    );

                d.className =
                    "skin";

                const statusKey = getYoutuberStatus(name);
                const status = STATUS_INFO[statusKey] || STATUS_INFO["inactive"];

                d.innerHTML = `
                    <img
                        src="${img}"
                        alt="${name}"
                    >

                    <span class="youtuber-name">
                        ${name}
                    </span>

                    <div class="youtuber-status">
                        <span class="status-label">Status:</span>
                        <span class="status-value ${status.className}">
                            ${status.label}
                        </span>
                    </div>

                    <div class="skin-instruction">
                        ${instruction.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")}
                    </div>
                `;

                box.appendChild(d);

            }
        );


    pages.innerHTML = "";

    for(
        let i = 1;
        i <= total;
        i++
    ){

        const b =
            document.createElement(
                "button"
            );

        b.className =
            "page-btn" +
            (
                i === page
                ? " active"
                : ""
            );

        b.textContent = i;

        b.onclick =
            ()=>renderYoutuberPage(i);

        pages.appendChild(b);

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

/* =====================================================
   YOUTUBER MODAL
   - show description (AI-fallback)
   - fetch 3 YouTube videos via search page (proxy fallback)
   - try to fetch channel about description
   Note: scraping YouTube HTML can be blocked; for production use the YouTube Data API or server-side proxy.
===================================================== */

function openYoutuberModal(name, img){
    const modal = document.getElementById("youtuberModal");
    const title = document.getElementById("modalTitle");
    const statusValue = document.getElementById("modalStatusValue");
    const desc = document.getElementById("modalDescription");
    const videos = document.getElementById("modalVideos");
    const channelDesc = document.getElementById("modalChannelDescription");

    title.textContent = name;
    const statusKey = getYoutuberStatus(name);
    const status = STATUS_INFO[statusKey] || STATUS_INFO["inactive"];
    statusValue.textContent = status.label;
    statusValue.className = "status-value " + status.className;

    desc.innerHTML = "Loading description...";
    videos.innerHTML = "";
    channelDesc.textContent = "Loading channel info...";

    modal.classList.remove("hidden");

    // Fetch videos + channel info
    fetchYouTubeData(name).then(data=>{
        // description
        desc.innerHTML = data.generatedDescription || "No description available.";

        // channel description
        channelDesc.innerHTML = data.channelDescription || "";

        // videos (take up to 3)
        videos.innerHTML = "";

        const ids = data.videoIds || [];

        for(let i=0;i<3;i++){
            const vid = ids[i];
            if(vid){
                const ifr = document.createElement("iframe");
                ifr.src = "https://www.youtube.com/embed/" + vid + "?rel=0";
                ifr.allow = "accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture";
                ifr.allowFullscreen = true;
                videos.appendChild(ifr);
            }else{
                const placeholder = document.createElement("div");
                placeholder.style.width = (i===1?"100%":"100%");
                placeholder.style.color = "#8892a8";
                placeholder.style.background = "#071022";
                placeholder.style.border = "1px dashed #223";
                placeholder.style.borderRadius = "6px";
                placeholder.style.padding = "16px";
                placeholder.style.fontSize = "13px";
                placeholder.style.flex = "1";
                placeholder.textContent = "No video found";
                videos.appendChild(placeholder);
            }
        }

    }).catch(e=>{
        desc.innerHTML = "Description unavailable.";
        channelDesc.textContent = "";
        videos.innerHTML = "<div style='color:#f88'>Unable to fetch videos (CORS or network error).</div>";
    });

    // show modal overlay
    document.getElementById("youtuberModal").classList.remove("hidden");
}

function closeYoutuberModal(e){
    if(e && e.target && e.target.classList && e.target.classList.contains("modal-overlay")){
        // click outside content: close
    }
    const modal = document.getElementById("youtuberModal");
    modal.classList.add("hidden");
}

/* =====================================================
   fetchYouTubeData(name)
   - tries a CORS-proxied fetch of YouTube search results
   - extracts video IDs from /watch?v= links
   - tries to find a channel link and fetch the about description
   - returns { videoIds:[], channelDescription, generatedDescription }
   NOTE: This is a best-effort client-side scraping approach.
===================================================== */

async function fetchYouTubeData(name){
    // build a search query; include "Agar.io" to bias results
    const query = encodeURIComponent(name + " Agar.io");
    const searchUrl = "https://www.youtube.com/results?search_query=" + query;

    // Use allorigins proxy first; fallback to direct fetch.
    const proxies = [
        url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
        url => url
    ];

    let html = "";
    let lastError = null;

    for(const makeUrl of proxies){
        try{
            const resp = await fetch(makeUrl(searchUrl));
            if(!resp.ok) throw new Error("Fetch failed: " + resp.status);
            html = await resp.text();
            if(html && html.length>200) break;
        }catch(err){
            lastError = err;
            continue;
        }
    }

    // extract video IDs
    const ids = [];
    if(html){
        // find /watch?v=VIDEO_ID occurrences
        const re = /\/watch\?v=([A-Za-z0-9_\-]{11})/g;
        let m;
        while((m = re.exec(html)) !== null){
            const id = m[1];
            if(!ids.includes(id)) ids.push(id);
            if(ids.length >= 12) break;
        }
    }

    // try to find a channel link
    let channelDescription = "";
    let channelUrl = "";

    if(html){
        // look for /channel/ or /@ or /user/ links in results
        const channelRe = /href="(\/channel\/[A-Za-z0-9_\-]+|\/@[^"]+|\/user\/[^"]+)"/g;
        let m;
        while((m = channelRe.exec(html)) !== null){
            const link = m[1];
            if(link && !link.includes("watch")){
                channelUrl = "https://www.youtube.com" + link;
                break;
            }
        }
    }

    if(channelUrl){
        // fetch channel page (about) to extract description (proxy fallback)
        const aboutUrl = channelUrl + "/about";
        for(const makeUrl of proxies){
            try{
                const resp = await fetch(makeUrl(aboutUrl));
                if(!resp.ok) throw new Error("Channel fetch failed: " + resp.status);
                const chHtml = await resp.text();

                // try to extract meta description
                let meta = "";
                let m = chHtml.match(/<meta name="description" content="([^"]+)"/);
                if(m && m[1]) meta = m[1];
                else {
                    // fallback to og:description
                    m = chHtml.match(/<meta property="og:description" content="([^"]+)"/);
                    if(m && m[1]) meta = m[1];
                }

                if(!meta){
                    // try to find an about text block (best-effort)
                    m = chHtml.match(/"description":\s*"([^"]+)"/);
                    if(m && m[1]) meta = m[1];
                }

                if(meta){
                    channelDescription = decodeHtmlEntities(meta);
                    break;
                }

            }catch(err){
                lastError = err;
                continue;
            }
        }
    }

    const generatedDescription = generateAIDescription(name, channelDescription);

    return {
        videoIds: ids,
        channelDescription,
        generatedDescription
    };
}

// small helper to decode HTML entities
function decodeHtmlEntities(str){
    try{
        const txt = document.createElement("textarea");
        txt.innerHTML = str;
        return txt.value;
    }catch(e){
        return str;
    }
}

/* =====================================================
   generateAIDescription(name, channelDescription)
   - If channelDescription exists, use it.
   - Otherwise, create a short "AI-like" description using available data.
   This is a simple client-side generator; for real AI-generated text use a server-side LLM.
===================================================== */

function generateAIDescription(name, channelDescription){
    if(channelDescription && channelDescription.trim().length > 30){
        return channelDescription;
    }

    // try to find extra info in YOUTUBER_DATA
    const custom = YOUTUBER_DATA.find(x => x[0] === name);
    if(custom && custom[2]){
        return custom[2].replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    }

    // heuristic generated text
    const simple = `${name} is a content creator associated with Agar.io. On their channel they shared gameplay, tips and moments from Agar.io matches. Some videos include tutorials, highlight clips and community sessions. Use the nick <strong>${name}</strong> to use their skin in Agar.io.`;

    return simple;
}
