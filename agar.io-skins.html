<meta charset="UTF-8" />
<title>Agar.io Skin - @t.bagar.io</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
/* Basis styling */
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;text-align:center;font-weight:bold}
h1{font-size:28px;margin:18px 0}

/* Sections */
.sections{display:flex;justify-content:center;gap:0;margin:10px auto 18px;flex-wrap:wrap}
.section-btn{background:#111;color:#fff;border:0;border-bottom:3px solid transparent;padding:12px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.section-btn:hover{background:#181818}
.section-btn.active{color:#1683ff;border-bottom-color:#1683ff}

/* Version */
.version-container{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0 18px}
.version-label{font-size:18px}
#version{font-size:16px;padding:4px}

/* Grids */
#skins{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;padding:15px;max-width:1400px;margin:auto}
#youtuberSkins{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:15px;max-width:1100px;margin:auto}
#youtubersList{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:15px;max-width:1100px;margin:auto}

/* Cards */
.skin{cursor:pointer;padding:8px;background:#111;border:2px solid #222;border-radius:8px}
.skin:hover{border-color:#1683ff}
.skin img{width:90px;height:90px;border-radius:50%;object-fit:cover;display:block;margin:0 auto}
#youtuberSkins .skin img{width:120px;height:120px;border-radius:50%}
.yt-card-img{width:120px;height:120px;border-radius:50%;object-fit:cover;display:block;margin:0 auto}
.skin span{display:block;margin-top:6px;font-size:13px}

/* Pagination & buttons */
#pages,#youtuberPages,#youtubersPages,#agarioPages{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:20px 15px 40px}
.page-btn{background:#1683ff;color:#fff;border:0;border-radius:7px;padding:8px 12px;font-size:14px;font-weight:bold;cursor:pointer;min-width:36px;box-shadow:0 2px 5px #0008}
.page-btn:hover{background:#0b6ed6}
.page-btn.active{background:#0753a6}

/* Social */
.social-buttons{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 15px}
.social-buttons a{display:inline-block;color:#fff;text-decoration:none;padding:9px 14px;border-radius:7px;font-size:14px;font-weight:bold;transition:0.2s}
.social-buttons a:hover{transform:translateY(-2px);opacity:0.9}
.youtube{background:#ff0000}
.instagram{background:#e1306c}
.discord{background:#5865f2}

/* Hidden helper */
.hidden{display:none}

/* Status */
.youtuber-status{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px;font-size:13px}
.status-label{color:#fff}
.status-value{font-weight:bold}
.status-active{ color:#22c55e }
.status-less-active{ color:#facc15 }
.status-not-active{ color:#f97316 }
.status-inactive{ color:#ef4444 }

/* Long description */
.skin-instruction{margin-top:10px;font-size:13px;line-height:1.5;color:#bbb;white-space:normal;text-align:left;max-height:220px;overflow:auto}
.skin-instruction strong{ color:#fff }

/* Modal */
.modal-overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:flex;justify-content:center;align-items:flex-start;padding:40px 20px;z-index:9999}
.modal{background:#0f1724;border:1px solid #223;padding:18px;max-width:1000px;width:100%;border-radius:10px;color:#fff}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-title{font-size:20px;font-weight:bold}
.modal-close{background:#111;color:#fff;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
.modal-body{margin-top:12px;display:grid;grid-template-columns:1fr;gap:12px}
.modal-videos{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.modal-videos iframe{width:32%;height:220px;border-radius:8px;border:0;background:#000}
.modal-meta{color:#cbd5e1;margin-top:8px;font-size:13px;text-align:left}

/* Edit form inside modal */
.edit-controls{margin-top:10px;text-align:left;background:#071022;padding:10px;border-radius:8px;border:1px solid #223}
.edit-controls textarea{width:100%;min-height:80px;background:#061223;color:#fff;border:1px solid #223;padding:8px;border-radius:6px}
.edit-controls input[type="text"]{width:100%;padding:8px;border-radius:6px;border:1px solid #223;background:#061223;color:#fff;margin-top:6px}

/* small loader badge */
.loader-badge{display:inline-block;padding:4px 8px;border-radius:12px;background:#07223a;color:#9bd1ff;font-size:12px;margin-left:8px}

/* responsive */
@media(max-width:900px){
  #youtuberSkins{grid-template-columns:repeat(3,1fr)}
  #youtubersList{grid-template-columns:repeat(3,1fr)}
  .modal-videos{flex-direction:column}
  .modal-videos iframe{width:100%;height:200px}
}
@media(max-width:600px){
  #youtuberSkins{grid-template-columns:repeat(2,1fr)}
  .skin img{width:80px;height:80px}
  #skins{grid-template-columns:repeat(4,1fr);gap:8px}
  #youtubersList{grid-template-columns:repeat(2,1fr)}
}
</style>

/* =========================
   Image fallback helper
========================= */
function setImageWithFallback(imgEl, filename){
  const candidates = [];
  if(API && version) candidates.push(API + version + "/" + filename);
  candidates.push(filename);
  candidates.push("images/" + filename);
  candidates.push("/images/" + filename);

  let idx = 0;
  imgEl.onerror = function(){
    idx++;
    if(idx < candidates.length){
      imgEl.src = candidates[idx];
    } else {
      imgEl.onerror = null;
      imgEl.src = "data:image/svg+xml;utf8," + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'>" +
        "<rect width='100%' height='100%' fill='#071022'/>" +
        "<text x='50%' y='50%' font-size='18' fill='#9bd1ff' dominant-baseline='middle' text-anchor='middle'>No image</text>" +
        "</svg>"
      );
    }
  };

  imgEl.src = candidates[0];
}

  youtuber.classList.add("hidden");
  agarioList.classList.add("hidden");

}

/* =========================
   versions() - improved (replaces prior)
   Fetches versions and wires onchange to reload skins
========================= */
async function versions(){
  const s = document.getElementById("version");
  if(!s) return;

  s.innerHTML = "";

  try{
    const r = await fetch("https://lmsettings.snez.org/", {
      headers: {
        username: "LMConfigVersion",
        password: "LMConfigVersionPass"
      }
    });

    if(!r.ok) throw new Error("Versions endpoint returned " + r.status);

    const v = await r.json();
    const vals = Object.values(v || {});

    if(!vals.length) throw new Error("No versions found in response");

    vals.forEach(x=>{
      const clean = String(x).replace(/\/$/,"");
      const opt = new Option(String(x), clean);
      s.add(opt);
    });

    if(s.options.length){
      s.selectedIndex = s.options.length - 1;
      version = s.value;
    }

  }catch(err){
    const fallback = ["v15/3032","v14/2900","v13/2800"];
    fallback.forEach(x=> s.add(new Option(x, x)));
    version = s.value = fallback[0];
    console.warn("Failed to fetch versions, using fallback:", err);
  }

  s.onchange = function(e){
    const val = (e.target.value || "").replace(/\/$/,"");
    if(val){
      version = val;
      loadSkins();
      renderAgarioPage(1);
      renderYoutuberPage(1);
      renderAgarioYoutubersPage(1);
    }
  };

  loadSkins();
}

/* =========================
   Load Agario skins (GameConfiguration)
========================= */
async function loadSkins(){
  const box = document.getElementById("skins");
  box.innerHTML = "Loading skins...";
  try{
    const r = await fetch(API + version + "/GameConfiguration.json");
    const text = await r.text();
    const a = text.match(/\[(.*?)\]/g) || [];
    const str = a[25] || "";
    const ids = str.match(/productId":"(.*?)"/g) || str.match(/productId": "(.*?)"/g) || [];
    const imgs = str.match(/image":"(.*?)"/g) || str.match(/image": "(.*?)"/g) || [];
    const skins = [];
    for(let i=0;i<Math.min(ids.length, imgs.length); i++){
      const id = ids[i].replace(/"/g,"").replace(/productId:/,"").replace(/skin_/,"").replace(/id:/,"").replace(" ","");
      const img = imgs[i].replace(/"/g,"").replace(/image:/,"").replace(" ","");
      if(!img.includes("uses_spine")) skins.push([id,img]);
    }
    skins.reverse();
    allSkins = skins;
    renderAgarioPage(1);
  }catch(e){
    box.textContent = "Unable to load skins.";
  }
}

/* Render agario skins grid */
function renderAgarioPage(page){
  const perPage = 120;
  const box = document.getElementById("skins");
  const pages = document.getElementById("agarioPages");
  const total = Math.ceil(allSkins.length / perPage);
  box.innerHTML = "";
  const start = (page-1)*perPage;
  allSkins.slice(start, start+perPage).forEach(([id,img])=>{
    const d = document.createElement("div"); d.className = "skin";
    d.innerHTML = `<img alt="${id}"><span>${id.replace(/\_/g," ")}</span>`;
    const imgEl = d.querySelector("img");
    setImageWithFallback(imgEl, img);
    box.appendChild(d);
  });
  pages.innerHTML = "";
  for(let i=1;i<=total;i++){
    const b = document.createElement("button"); b.className = "page-btn" + (i===page?" active":""); b.textContent = i; b.onclick = ()=>renderAgarioPage(i); pages.appendChild(b);
  }
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* =========================
   Modal + custom edit support for Agario-only items
   - Custom data saved in localStorage under key: "agario_custom_<name>"
   - Allows entering custom description and 3 video URLs/IDs
========================= */

function isAgarioOnly(name){
  return AGARIO_YOUTUBERS.some(x => x[0] === name);
}

function localStorageKeyFor(name){ return "agario_custom_" + name.replace(/\s+/g,"_"); }

function loadCustomFor(name){
  try{
    const raw = localStorage.getItem(localStorageKeyFor(name));
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function saveCustomFor(name, obj){
  try{
    localStorage.setItem(localStorageKeyFor(name), JSON.stringify(obj));
    return true;
  }catch(e){ return false; }
}

function extractVideoId(input){
  if(!input) return null;
  input = input.trim();
  // If plain 11-char id
  const idRe = /^[A-Za-z0-9_\-]{11}$/;
  if(idRe.test(input)) return input;
  // youtu.be short links
  let m = input.match(/youtu\.be\/([A-Za-z0-9_\-]{11})/);
  if(m && m[1]) return m[1];
  // youtube watch?v=
  m = input.match(/[?&]v=([A-Za-z0-9_\-]{11})/);
  if(m && m[1]) return m[1];
  // /embed/ID
  m = input.match(/\/embed\/([A-Za-z0-9_\-]{11})/);
  if(m && m[1]) return m[1];
  // last path segment of a url (fallback)
  try{
    const u = new URL(input);
    const parts = u.pathname.split("/");
    const last = parts.pop() || parts.pop();
    if(last && idRe.test(last)) return last;
  }catch(e){}
  return null;
}

let currentModalName = null;

function enterEditMode(){
  document.getElementById("modalEditArea").classList.remove("hidden");
  document.getElementById("modalEditBtn").style.display = "none";
}

function exitEditMode(reload){
  document.getElementById("modalEditArea").classList.add("hidden");
  document.getElementById("modalEditBtn").style.display = isAgarioOnly(currentModalName) ? "inline-block" : "none";
  if(reload) {
    // re-populate modal using saved custom data
    const meta = youtuberMeta[currentModalName];
    if(meta) populateModalFromMeta(currentModalName, meta);
  }
}

function saveCustomModal(){
  const name = currentModalName;
  if(!name) return;
  const desc = document.getElementById("modalCustomDescription").value || "";
  const v1 = document.getElementById("modalVideo1").value || "";
  const v2 = document.getElementById("modalVideo2").value || "";
  const v3 = document.getElementById("modalVideo3").value || "";
  const ids = [extractVideoId(v1), extractVideoId(v2), extractVideoId(v3)].filter(Boolean);

  const obj = { customDescription: desc, customVideoIds: ids };
  saveCustomFor(name, obj);

  // store in youtuberMeta for immediate usage
  youtuberMeta[name] = youtuberMeta[name] || {};
  youtuberMeta[name].customDescription = desc;
  youtuberMeta[name].customVideoIds = ids;
  youtuberMeta[name].loaded = true; // mark loaded so modal uses it

  exitEditMode(true);
}

/* open modal: if agario-only show Edit button and load saved custom values */
function openYoutuberModal(name, img){
  currentModalName = name;
  const modal = document.getElementById("youtuberModal");
  const title = document.getElementById("modalTitle");
  const statusValue = document.getElementById("modalStatusValue");
  const desc = document.getElementById("modalDescription");
  const videos = document.getElementById("modalVideos");
  const channelDesc = document.getElementById("modalChannelDescription");
  const modalLoader = document.getElementById("modalLoader");
  const editBtn = document.getElementById("modalEditBtn");

  title.textContent = name;
  const statusKey = getYoutuberStatus(name);
  const status = STATUS_INFO[statusKey] || STATUS_INFO["inactive"];
  statusValue.textContent = status.label;
  statusValue.className = "status-value " + status.className;

  desc.innerHTML = "Loading description...";
  videos.innerHTML = "";
  channelDesc.textContent = "Channel info...";
  modalLoader.style.display = "inline-block";
  modal.classList.remove("hidden");

  // show Edit button only for Agario-only names
  if(isAgarioOnly(name)){
    editBtn.style.display = "inline-block";
    // load saved custom into edit fields
    const saved = loadCustomFor(name);
    document.getElementById("modalCustomDescription").value = (saved && saved.customDescription) ? saved.customDescription : "";
    document.getElementById("modalVideo1").value = (saved && saved.customVideoIds && saved.customVideoIds[0]) ? saved.customVideoIds[0] : "";
    document.getElementById("modalVideo2").value = (saved && saved.customVideoIds && saved.customVideoIds[1]) ? saved.customVideoIds[1] : "";
    document.getElementById("modalVideo3").value = (saved && saved.customVideoIds && saved.customVideoIds[2]) ? saved.customVideoIds[2] : "";
    // hide edit area by default
    document.getElementById("modalEditArea").classList.add("hidden");
  } else {
    editBtn.style.display = "none";
  }

  // If cached and loaded and has custom, use it immediately
  const meta = youtuberMeta[name];
  if(meta && (meta.loaded || meta.customDescription || meta.customVideoIds)){
    populateModalFromMeta(name, meta);
    modalLoader.style.display = "none";
    return;
  }

  // else fetch
  fetchYouTubeData(name).then(data=>{
    youtuberMeta[name] = { loaded:true, logo:data.logo||null, channelDescription:data.channelDescription||data.generatedDescription, videoIds:data.videoIds||[] };
    // but if user has saved custom data in localStorage, prefer it for agario-only items
    if(isAgarioOnly(name)){
      const saved = loadCustomFor(name);
      if(saved){
        youtuberMeta[name].customDescription = saved.customDescription || null;
        youtuberMeta[name].customVideoIds = saved.customVideoIds || null;
      }
    }
    populateModalFromMeta(name, youtuberMeta[name]);
  }).catch(err=>{
    desc.innerHTML = "Description unavailable.";
    videos.innerHTML = "<div style='color:#f88'>Unable to fetch videos.</div>";
    channelDesc.textContent = "";
  }).finally(()=>{ modalLoader.style.display = "none"; });
}

/* populate modal: respects customDescription and customVideoIds if present */
function populateModalFromMeta(name, meta){
  const desc = document.getElementById("modalDescription");
  const videos = document.getElementById("modalVideos");
  const channelDesc = document.getElementById("modalChannelDescription");

  // prefer custom description
  const descriptionToShow = (meta && meta.customDescription) ? meta.customDescription : (meta && meta.channelDescription ? meta.channelDescription : (generateAIDescription(name, null)));
  desc.innerHTML = descriptionToShow;

  channelDesc.innerHTML = (meta && meta.channelDescription && !meta.customDescription) ? meta.channelDescription : "";

  videos.innerHTML = "";
  // if customVideoIds exist, use them; else use scraped ids
  let ids = [];
  if(meta && meta.customVideoIds && meta.customVideoIds.length) ids = meta.customVideoIds;
  else ids = meta && meta.videoIds ? meta.videoIds.slice(0,3) : [];

  for(let i=0;i<3;i++){
    const vid = ids[i];
    if(vid){
      const ifr = document.createElement("iframe");
      ifr.src = "https://www.youtube.com/embed/" + vid + "?rel=0";
      ifr.allow = "accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture";
      ifr.allowFullscreen = true;
      videos.appendChild(ifr);
    } else {
      const placeholder = document.createElement("div");
      placeholder.style.flex = "1";
      placeholder.style.color = "#8892a8";
      placeholder.style.background = "#071022";
      placeholder.style.border = "1px dashed #223";
      placeholder.style.borderRadius = "6px";
      placeholder.style.padding = "16px";
      placeholder.style.fontSize = "13px";
      placeholder.textContent = "No video found";
      videos.appendChild(placeholder);
    }
  }
}

/* =========================
   YouTube scraping helper (best-effort)
========================= */
async function fetchYouTubeData(name){
  const query = encodeURIComponent(name + " Agar.io");
  const searchUrl = "https://www.youtube.com/results?search_query=" + query;
  const proxies = [ url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url), url => url ];
  let html = "";
  for(const makeUrl of proxies){
    try{
      const resp = await fetch(makeUrl(searchUrl));
      if(!resp.ok) throw new Error("Fetch failed: " + resp.status);
      html = await resp.text();
      if(html && html.length > 200) break;
    }catch(err){
      continue;
    }
  }

  const ids = [];
  if(html){
    const re = /\/watch\?v=([A-Za-z0-9_\-]{11})/g;
    let m;
    while((m = re.exec(html)) !== null){
      const id = m[1];
      if(!ids.includes(id)) ids.push(id);
      if(ids.length >= 12) break;
    }
  }

  let channelUrl = "";
  if(html){
    const channelRe = /href="(\/channel\/[A-Za-z0-9_\-]+|\/@[^"]+|\/user\/[^"]+)"/g;
    let m;
    while((m = channelRe.exec(html)) !== null){
      const link = m[1];
      if(link && !link.includes("watch")){
        channelUrl = "https://www.youtube.com" + link;
        break;
      }
    }
  }

  let channelDescription = "";
  let logo = null;
  if(channelUrl){
    const aboutUrl = channelUrl + "/about";
    for(const makeUrl of proxies){
      try{
        const resp = await fetch(makeUrl(aboutUrl));
        if(!resp.ok) throw new Error("Channel fetch failed: " + resp.status);
        const chHtml = await resp.text();
        let meta = "";
        let m = chHtml.match(/<meta name="description" content="([^"]+)"/);
        if(m && m[1]) meta = m[1];
        else { m = chHtml.match(/<meta property="og:description" content="([^"]+)"/); if(m && m[1]) meta = m[1]; }
        if(!meta){ m = chHtml.match(/"description":\s*"([^"]+)"/); if(m && m[1]) meta = m[1]; }
        if(meta) channelDescription = decodeHtmlEntities(meta);
        m = chHtml.match(/<meta property="og:image" content="([^"]+)"/);
        if(m && m[1]) logo = m[1];
        if(!logo){ m = chHtml.match(/"avatar":\s*\[\s*\{\s*"url":"([^"]+)"/); if(m && m[1]) logo = m[1].replace(/\\u0026/g,"&"); }
        break;
      }catch(err){
        continue;
      }
    }
  }

  if(!logo && ids.length){
    logo = "https://i.ytimg.com/vi/" + ids[0] + "/hqdefault.jpg";
  }

  const generatedDescription = generateAIDescription(name, channelDescription);
  return { videoIds: ids, channelDescription, logo, generatedDescription };
}

/* helper */
function decodeHtmlEntities(str){
  try{ const t = document.createElement("textarea"); t.innerHTML = str; return t.value; }catch(e){ return str; }
}

function generateAIDescription(name, channelDescription){
  if(channelDescription && channelDescription.trim().length>30) return channelDescription;
  const custom = YOUTUBER_DATA.find(x => x[0]===name);
  if(custom && custom[2]) return custom[2].replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  return `${name} is a content creator associated with Agar.io. Their channel contains gameplay, tips and highlight videos. Use the nick <strong>${name}</strong> to use their skin in Agar.io.`;
}

/* =========================
   Preload metadata in background (optional)
========================= */
async function startPreloadAllYoutubers(){
  const statusBadge = document.getElementById("preloadStatus");
  if(statusBadge) statusBadge.style.display = "inline-block";
  const batchSize = 6;
  const delayBetweenBatches = 800;
  const names = [...YOUTUBER_DATA.map(x=>x[0]), ...AGARIO_YOUTUBERS.map(x=>x[0])];
  names.forEach(n => { youtuberMeta[n] = { loaded:false, logo:null, channelDescription:null, videoIds:[] } });
  for(let i=0;i<names.length;i+=batchSize){
    const batch = names.slice(i, i+batchSize);
    await Promise.all(batch.map(name => preloadYoutuber(name)));
    await sleep(delayBetweenBatches);
  }
  if(statusBadge) statusBadge.style.display = "none";
}

async function preloadYoutuber(name){
  if(youtuberMeta[name] && youtuberMeta[name].loaded) return;
  try{
    const data = await fetchYouTubeData(name);
    youtuberMeta[name] = { loaded:true, logo:data.logo||null, channelDescription:data.channelDescription||data.generatedDescription||null, videoIds:data.videoIds||[] };
    // if user saved custom data, merge it
    const saved = loadCustomFor(name);
    if(saved){
      youtuberMeta[name].customDescription = saved.customDescription || null;
      youtuberMeta[name].customVideoIds = saved.customVideoIds || null;
    }
  }catch(e){
    youtuberMeta[name] = { loaded:true, logo:null, channelDescription:null, videoIds:[] };
  }
}
