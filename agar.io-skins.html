<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Skin Shop (Shared via GitHub)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#0b0b0b; color:#eee; padding:20px; text-align:center; }
  h1 { color:#0af; margin-bottom:6px; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; }
  input, button, select { padding:8px 12px; border-radius:999px; border:0; font-size:14px; }
  button { cursor:pointer; background:#0af; color:#000; }
  .skins { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin-top:10px; }
  .skinContainer { width:160px; display:flex; flex-direction:column; align-items:center; }
  .skin { width:150px; height:150px; border-radius:50%; overflow:hidden; position:relative; background:#222; display:flex; align-items:center; justify-content:center; transition:transform .12s, filter .12s; }
  .skin img { width:100%; height:100%; object-fit:cover; user-select:none; pointer-events:none; display:block; }
  .skin:hover { transform:translateY(-4px); }
  .grayed img { filter:grayscale(100%); opacity:.45; }
  .lock { position:absolute; top:6px; left:6px; background:rgba(0,0,0,.6); padding:6px; border-radius:50%; font-size:16px; }
  .skinName { margin-top:8px; font-size:14px; }
  .skinPrice { color:#ddd; font-size:13px; margin-top:4px; }
  #message { color:yellow; margin-bottom:8px; }
  #purchasedTitle { margin-top:28px; font-size:18px; text-decoration:underline; }
  #purchasedSkins { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:10px; }
  #purchasedSkins img { width:96px; height:96px; border-radius:50%; border:2px solid #0af; object-fit:cover; }

  #currency { display:flex; gap:18px; align-items:center; justify-content:flex-end; font-size:16px; }
  .currencyItem { display:flex; gap:6px; align-items:center; background:rgba(255,255,255,0.03); padding:6px 10px; border-radius:999px; }

  #eventBarContainer { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:999; max-width:90%; overflow:auto; padding:6px; }
  .eventCard { width:220px; height:2.2cm; border:2px solid #0af; border-radius:6px; overflow:hidden; position:relative; cursor:pointer; background:#111; }
  .eventCard img { width:100%; height:100%; object-fit:cover; display:block; }
  .eventCountdown { position:absolute; bottom:0; left:0; width:100%; background:rgba(0,0,0,0.6); color:#fff; font-size:12px; text-align:center; padding:4px 2px; }

  #dealModal { display:none; position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:#151515; color:#fff; border:2px solid #0af; padding:18px; border-radius:10px; z-index:2000; width:320px; max-width:90%; }
  #dealModal img { width:100%; height:160px; object-fit:cover; border-radius:8px; }
  #dealCountdown { font-weight:600; margin-top:8px; }
  #dealNav { display:flex; justify-content:space-between; margin-top:10px; gap:8px; }
  #dealModal button { margin-top:10px; }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div class="top-bar">
  <div id="infoText">Contact admin to top up coins / money</div>
  <div id="currency">
    <div class="currencyItem">💰 <span id="money">0.00</span></div>
    <div class="currencyItem">🪙 <span id="coins">0</span></div>
  </div>
</div>

<div id="message">Enter your key to load your account (shared data from GitHub)</div>

<div style="margin:8px 0 12px;">
  <input id="keyInput" placeholder="Enter your key here">
  <button onclick="loadKey()">Load Key</button>
  <button onclick="clearKey()">Clear</button>
</div>

<h3>Available Skins</h3>
<div class="skins" id="skinsGrid"></div>

<div id="purchasedSection">
  <div id="purchasedTitle">With these skins and deals you have purchased:</div>
  <div id="purchasedSkins"></div>
</div>

<div id="eventBarContainer"></div>

<div id="dealModal" role="dialog" aria-modal="true">
  <h3 id="dealModalTitle"></h3>
  <img id="dealModalImage" src="" alt="Deal image">
  <p id="dealModalDesc" style="margin:8px 0 0;"></p>
  <div id="dealCountdown"></div>
  <div id="dealNav">
    <button onclick="prevDeal()">⬅ Previous</button>
    <button onclick="nextDeal()">Next ➡</button>
  </div>
  <button id="buyDealBtn">Buy Deal</button>
  <button onclick="closeDealModal()" style="margin-left:8px;">Close</button>
</div>

<script>
// 🔗 Pas dit aan naar jouw GitHub repo:
const GITHUB_BASE_URL = "https://raw.githubusercontent.com/<JOUW-GITHUB-NAAM>/<REPO>/main/";

let currentKey = null;
let userData = {};
let skinsData = [];
let dealsData = [];
let eventsData = [];
let currentDealIndex = 0;
let currentEventDeals = [];
let dealCountdownInterval = null;

function showMessage(msg){ document.getElementById('message').textContent = msg; }

// ============ FETCH FUNCTIONS ============
async function fetchJSON(file){
  try {
    const res = await fetch(GITHUB_BASE_URL + file);
    if(!res.ok) throw new Error(res.status);
    return await res.json();
  } catch(e){
    console.error("Fetch error:", file, e);
    return [];
  }
}

async function loadData(){
  [skinsData, dealsData, eventsData] = await Promise.all([
    fetchJSON("skins.json"),
    fetchJSON("deals.json"),
    fetchJSON("events.json")
  ]);
  renderSkins();
  renderEventBar();
}

// ============ KEY LOADING ============
async function loadKey(){
  const key = document.getElementById('keyInput').value.trim();
  if(!key){ showMessage('Please enter your key'); return; }

  const keysData = await fetchJSON("keys.json");
  if(!keysData[key]){ showMessage('❌ Invalid key'); return; }

  currentKey = key;
  userData = keysData[key];
  showMessage(`✅ Key loaded: ${userData.name}`);
  renderSkins();
  renderEventBar();
}

function clearKey(){
  currentKey = null; userData = {};
  document.getElementById('keyInput').value = '';
  showMessage('Key cleared — browse as guest');
  renderSkins();
}

function getUserCoins(){ return userData.coins || 0; }
function getUserMoney(){ return userData.money || 0; }
function getUserOwned(){ return userData.owned || []; }
function getPurchasedDeals(){ return userData.purchasedDeals || []; }

// ============ SKINS ============
function renderSkins(){
  const grid = document.getElementById('skinsGrid');
  const purchasedContainer = document.getElementById('purchasedSkins');
  grid.innerHTML = '';
  purchasedContainer.innerHTML = '';

  const coins = getUserCoins();
  const owned = getUserOwned();

  skinsData.forEach(skin=>{
    const isOwned = owned.includes(skin.id);
    if(isOwned){ addPurchasedItem(skin.image, skin.name); return; }

    const container = document.createElement('div'); container.className = 'skinContainer';
    const card = document.createElement('div'); card.className = 'skin grayed';
    const img = document.createElement('img'); img.src = skin.image; card.appendChild(img);
    const lock = document.createElement('div'); lock.className = 'lock'; lock.textContent = '🔒'; card.appendChild(lock);

    card.addEventListener('click', ()=>{
      if(!currentKey){ showMessage('Enter your key first to buy'); return; }
      if(coins < skin.price){ showMessage('Not enough coins'); return; }
      userData.coins -= skin.price;
      userData.owned.push(skin.id);
      showMessage('✅ Skin purchased!');
      renderSkins();
    });

    container.appendChild(card);
    container.innerHTML += `<div class="skinName">${skin.name}</div><div class="skinPrice">Price: ${skin.price} 🪙</div>`;
    grid.appendChild(container);
  });

  document.getElementById('coins').textContent = getUserCoins();
  document.getElementById('money').textContent = getUserMoney().toFixed(2);
}

function addPurchasedItem(imgSrc, name){
  const img = document.createElement('img'); img.src = imgSrc; img.alt = name;
  document.getElementById('purchasedSkins').appendChild(img);
}

// ============ EVENTS & DEALS ============
function renderEventBar(){
  const container = document.getElementById('eventBarContainer');
  container.innerHTML = '';
  eventsData.forEach((ev, idx)=>{
    const activeDeals = dealsData.filter(d=>d.eventId===ev.id && d.status==='active');
    if(activeDeals.length===0) return;
    const card = document.createElement('div'); card.className = 'eventCard';
    const img = document.createElement('img'); img.src = ev.barImage || ev.image || ''; card.appendChild(img);
    const countdown = document.createElement('div'); countdown.className = 'eventCountdown'; countdown.textContent='';
    card.appendChild(countdown);
    card.addEventListener('click', ()=>openEventDeals(ev));
    container.appendChild(card);
  });
}

function openEventDeals(ev){
  currentEventDeals = dealsData.filter(d=>d.eventId===ev.id && d.status==='active');
  if(currentEventDeals.length===0){ alert('No active deals'); return; }
  currentDealIndex=0;
  showDeal(currentEventDeals[currentDealIndex]);
}

function showDeal(deal){
  document.getElementById('dealModalTitle').textContent = deal.name;
  document.getElementById('dealModalDesc').textContent = deal.desc;
  document.getElementById('dealModalImage').src = deal.image;
  document.getElementById('dealModal').style.display = 'block';
  updateDealCountdown(deal);
  if(dealCountdownInterval) clearInterval(dealCountdownInterval);
  dealCountdownInterval=setInterval(()=>updateDealCountdown(deal),1000);

  const buyBtn=document.getElementById('buyDealBtn');
  buyBtn.onclick=()=>buyDeal(deal);
}

function updateDealCountdown(deal){
  const now=Date.now();
  let rem=deal.endTime-now;
  if(rem<0) rem=0;
  const d=Math.floor(rem/86400000);
  const h=Math.floor((rem%86400000)/3600000);
  const m=Math.floor((rem%3600000)/60000);
  const s=Math.floor((rem%60000)/1000);
  document.getElementById('dealCountdown').textContent=`Ends in: ${d}d ${h}h ${m}m ${s}s - Price: ${deal.price} 💰`;
}

function buyDeal(deal){
  if(!currentKey){ showMessage('Enter key first'); return; }
  if(getUserMoney()<deal.price){ showMessage('Not enough money'); return; }
  userData.money -= deal.price;
  if(!userData.purchasedDeals.includes(deal.id)) userData.purchasedDeals.push(deal.id);
  if(Array.isArray(deal.skins)) deal.skins.forEach(sid=>{ if(!userData.owned.includes(sid)) userData.owned.push(sid); });
  showMessage('✅ Deal purchased!');
  renderSkins();
  closeDealModal();
}

function closeDealModal(){
  document.getElementById('dealModal').style.display='none';
  if(dealCountdownInterval){ clearInterval(dealCountdownInterval); dealCountdownInterval=null; }
}

function prevDeal(){ if(!currentEventDeals.length)return; currentDealIndex=(currentDealIndex+currentEventDeals.length-1)%currentEventDeals.length; showDeal(currentEventDeals[currentDealIndex]); }
function nextDeal(){ if(!currentEventDeals.length)return; currentDealIndex=(currentDealIndex+1)%currentEventDeals.length; showDeal(currentEventDeals[currentDealIndex]); }

// ============ INIT ============
loadData();
</script>

</body>
</html>
