<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agar.io Shop</title>
<style>
    body {
        margin: 0;
        background: #141414;
        font-family: Arial, sans-serif;
        color: #fff;
        display: flex;
    }

    /* Sidebar */
    #sidebar {
        width: 220px;
        background: #0c0c0c;
        padding: 20px;
        border-right: 2px solid #1f1f1f;
        height: 100vh;
    }

    #sidebar h2 {
        margin-top: 0;
        font-size: 20px;
        color: #00d4ff;
        text-align: center;
    }

    /* UID Input */
    #uidInput {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: none;
        margin-top: 10px;
        background: #1b1b1b;
        color: white;
    }

    /* Main shop grid */
    #shop {
        padding: 20px;
        flex-grow: 1;
    }

    #shop h1 {
        text-align: center;
        font-size: 26px;
        margin-bottom: 20px;
    }

    #items {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 20px;
    }

    .item {
        background: #1a1a1a;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        border: 1px solid #2b2b2b;
        transition: 0.2s;
    }

    .item:hover {
        transform: scale(1.04);
        border-color: #00ffcc;
    }

    .item img {
        width: 130px;
        height: 130px;
        margin-bottom: 10px;
        object-fit: contain;
    }

    .buy {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        font-size: 15px;
        border: none;
        border-radius: 6px;
        background: #00ff88;
        color: #000;
        cursor: pointer;
    }

    .buy:hover {
        background: #14ff9f;
    }

    #log {
        white-space: pre-wrap;
        margin-top: 20px;
        background: #0e0e0e;
        padding: 10px;
        border-radius: 10px;
        font-size: 12px;
        color: #00ffcc;
    }

</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
    <h2>Agar.io Shop</h2>
    <label>UID:</label>
    <input id="uidInput" placeholder="Enter your UID">

    <div id="log"></div>
</div>

<!-- Main shop -->
<div id="shop">
    <h1>Store Offers</h1>
    <div id="items">Loading...</div>
</div>


<script>
// REAL AGARIO CONFIG URL
const CONFIG_URL = "https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json";

// CORS BYPASS PROXY (werkt altijd)
const PROXY = "https://corsproxy.io/?";

const XSOLLA = "https://secure.xsolla.com/paystation3/?purchase=";

function log(text) {
    document.getElementById("log").innerText += text + "\n";
}

async function loadConfig() {
    try {
        log("Downloading live Agar.io config...");
        const res = await fetch(PROXY + CONFIG_URL);
        const config = await res.json();
        log("Config loaded!");

        renderShop(config);
    } catch (e) {
        log("Error loading config: " + e);
        document.getElementById("items").innerHTML = "Could not load shop (CORS).";
    }
}

function renderShop(cfg) {

    const offers = [];
    const areas = [
        cfg?.Shop?.SoftCurrencies,
        cfg?.Shop?.HardCurrencies,
        cfg?.Shop?.Boosts,
        cfg?.Shop?.SkinsSale
    ];

    areas.forEach(section => {
        if (!section) return;

        Object.values(section).forEach(item => {
            offers.push({
                id: item.ProductId,
                name: item.Title || "Offer",
                price: item.Price?.PriceAmount || "?",
                img: item.ImageUrl || ""
            });
        });
    });

    const shop = document.getElementById("items");
    shop.innerHTML = "";

    offers.forEach(o => {
        const card = document.createElement("div");
        card.className = "item";

        card.innerHTML = `
            <img src="${o.img}">
            <h3>${o.name}</h3>
            <p><b>${o.price}$</b></p>
            <button class="buy" onclick="buy('${o.id}')">Buy</button>
        `;

        shop.appendChild(card);
    });

    log(`Loaded ${offers.length} shop items.`);
}

function buy(productId) {
    const uid = document.getElementById("uidInput").value.trim();
    if (!uid) {
        alert("Enter your UID first.");
        return;
    }

    const url = `${XSOLLA}${productId}&uid=${encodeURIComponent(uid)}`;
    log("Opening payment: " + url);

    window.open(url, "_blank");
}

loadConfig();
</script>

</body>
</html>
