<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agar.io Skin Loader</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

#skins{
display:grid;
grid-template-columns:repeat(auto-fill,120px);
gap:12px;
justify-content:center;
}

.skin{
background:#1b1b1b;
padding:10px;
border-radius:10px;
}

.skin img{
width:100px;
height:100px;
border-radius:50%;
}

.skin p{
font-size:12px;
}

</style>
</head>

<body>

<h1>Agar.io Skins</h1>

<div id="skins"></div>

<script>

const CONFIG =
"https://configs-web.agario.miniclippt.com/live/v15/10890/GameConfiguration.json";

const CDN =
"https://configs-web.agario.miniclippt.com/live/v15/10890/";

fetch(CONFIG)
.then(r=>r.json())
.then(data=>{

const container=document.getElementById("skins");

let skins=[];

// ALLE keys in JSON doorzoeken
function scan(obj){

for(let key in obj){

let value=obj[key];

if(typeof value==="string"){

// skin naam herkennen
if(value.includes(".png") || value.includes("_hi")){
skins.push(value.replace(".png","").replace("_hi",""));
}

}

if(typeof value==="object"){
scan(value);
}

}

}

scan(data);

// duplicaten verwijderen
skins=[...new Set(skins)];

// nieuwste bovenaan
skins.reverse();

skins.forEach(name=>{

const div=document.createElement("div");
div.className="skin";

const img=document.createElement("img");
img.loading="lazy";
img.src=CDN+name+"_hi.png";

const label=document.createElement("p");
label.textContent=name;

div.appendChild(img);
div.appendChild(label);

container.appendChild(div);

});

});

</script>

</body>
</html>
