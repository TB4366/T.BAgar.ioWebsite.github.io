<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; text-align:center;}
h1 { color:#0af; font-size:28px; margin-bottom:10px; }
.top-bar { display:flex; justify-content:flex-end; align-items:center; gap:20px; margin-bottom:20px; position:relative; z-index:100; }
.top-bar div { display:flex; align-items:center; gap:5px; font-size:16px; color:#fff; }
.skins { display:flex; flex-wrap: wrap; gap:25px; justify-content:center; margin-top:20px; }
.skinContainer { display:flex; flex-direction:column; align-items:center; }
.skin { width:150px; height:150px; border-radius:50%; background:#333; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; transition: transform 0.1s, filter 0.1s;}
.skin img { width:100%; height:100%; object-fit:cover; border-radius:50%; transition: filter 0.2s, opacity 0.2s; }
.skin:hover { filter: brightness(1.2); }
.lock { position:absolute; top:5px; left:5px; font-size:18px; background:rgba(0,0,0,0.6); padding:3px 6px; border-radius:50%; }
.grayed img { filter: grayscale(100%); opacity:0.5; pointer-events:none; }
.skinName, .skinPrice { margin-top:5px; font-size:14px; }
#eventBar { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); width:200px; height:100px; border-radius:10px; overflow:hidden; cursor:pointer; border:2px solid #0af; display:flex; align-items:center; justify-content:center; z-index:1000; background:#222; }
#eventBar img { width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; transition: opacity 1s ease-in-out; }
#eventModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#222; padding:20px; border:2px solid #0af; border-radius:10px; z-index:2000; max-width:400px; color:#fff; }
#dealContent { display:flex; flex-direction:column; align-items:center; gap:10px; }
#dealControls { display:flex; justify-content:space-between; width:100%; margin-top:10px; }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div class="top-bar">
  <div><img src="coins_icon.png" width="24"> <span id="coins">0</span></div>
  <div><img src="money_icon.png" width="24"> <span id="money">0.00</span></div>
</div>

<input id="keyInput" placeholder="Enter your key here">
<button onclick="loadKey()">Load Key</button>

<div class="skins" id="skinsGrid"></div>

<!-- Event bar -->
<div id="eventBar">
  <img id="eventImage" src="" style="opacity:1;">
</div>

<!-- Modal -->
<div id="eventModal">
  <h3 id="modalName"></h3>
  <p id="modalDesc"></p>
  <div id="dealContent"></div>
  <div id="dealControls">
    <button onclick="prevDeal()">◀ Prev</button>
    <button onclick="nextDeal()">Next ▶</button>
  </div>
  <div id="dealTimer"></div>
  <button onclick="closeModal()">Close</button>
</div>

<script>
let currentKey=null, coins=0, money=0, owned=[], deals=[], currentDealIndex=0;
let events=[], eventIndex=0;

// Dummy data als voorbeeld
events = [
  {name:'Halloween', image:'https://i.imgur.com/7ZQ6kYv.png', barImage:'https://i.imgur.com/7ZQ6kYv.png'},
  {name:'Winter Sale', image:'https://i.imgur.com/Z3k0TXG.png', barImage:'https://i.imgur.com/Z3k0TXG.png'}
];
deals = [
  {name:'Deal1', desc:'Spooky deal', image:'https://i.imgur.com/7ZQ6kYv.png', coins:100, dna:50, massBoost:1, skin:'Pumpkin', price:5, endTime:Date.now()+60000},
  {name:'Deal2', desc:'Winter deal', image:'https://i.imgur.com/Z3k0TXG.png', coins:200, dna:100, massBoost:2, skin:'Snow', price:10, endTime:Date.now()+120000}
];

function renderSkins(){ document.getElementById('coins').textContent=coins; document.getElementById('money').textContent=money.toFixed(2); }

function loadKey(){ currentKey='dummy'; coins=500; money=20.00; owned=[]; renderSkins(); initEventBar(); }

function initEventBar(){
  if(events.length===0) return;
  const imgEl=document.getElementById('eventImage');
  imgEl.src = events[eventIndex].barImage;
  setInterval(()=>{
    imgEl.style.opacity=0;
    setTimeout(()=>{
      eventIndex=(eventIndex+1)%events.length;
      imgEl.src=events[eventIndex].barImage;
      imgEl.style.opacity=1;
    },500);
  },5000);
  document.getElementById('eventBar').onclick=()=>openModal();
}

// Modal
function openModal(){ currentDealIndex=0; showDeal(currentDealIndex); document.getElementById('eventModal').style.display='block'; }
function closeModal(){ document.getElementById('eventModal').style.display='none'; }
function showDeal(i){
  const deal=deals[i]; if(!deal) return;
  const content=document.getElementById('dealContent');
  content.innerHTML=`<img src="${deal.image}" width="200"><p>${deal.desc}</p><p>Price: €${deal.price}</p>`;
  document.getElementById('modalName').textContent=deal.name;
  updateTimer();
}
function prevDeal(){ currentDealIndex=(currentDealIndex-1+deals.length)%deals.length; showDeal(currentDealIndex); }
function nextDeal(){ currentDealIndex=(currentDealIndex+1)%deals.length; showDeal(currentDealIndex); }
function updateTimer(){
  const deal=deals[currentDealIndex]; if(!deal) return;
  const diff=Math.max(deal.endTime-Date.now(),0);
  const h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
  document.getElementById('dealTimer').textContent=`Offer ends in ${h}h ${m}m ${s}s`;
  if(diff>0) setTimeout(updateTimer,1000);
}
</script>
</body>
</html>
