<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skin Shop - User</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#fff; text-align:center; padding:20px; }
    h1 { color:#0af; }
    .skin, .deal { display:inline-block; margin:10px; padding:10px; border:1px solid #555; border-radius:8px; background:#222; width:150px; }
    .skin img, .deal img { width:100px; height:100px; object-fit:cover; border-radius:6px; }
    .owned { border:2px solid lime; }
    .locked { opacity:0.5; }
    button { margin-top:5px; padding:5px 10px; border:none; border-radius:4px; background:#0af; color:#fff; cursor:pointer; }
    #eventBar { margin-top:20px; display:flex; justify-content:center; gap:10px; overflow-x:auto; }
    .eventCard { width:160px; border:1px solid #0af; border-radius:6px; padding:5px; background:#222; cursor:pointer; position:relative; }
    .eventCard img { width:100%; height:80px; object-fit:cover; border-radius:4px; }
    .eventCountdown { position:absolute; bottom:4px; left:4px; right:4px; background:rgba(0,0,0,0.6); font-size:12px; border-radius:3px; color:#fff; }
  </style>
</head>
<body>

  <h1>Skin Shop</h1>
  <div>
    <input id="keyInput" placeholder="Enter your key">
    <button onclick="login()">Login</button>
  </div>

  <div id="userInfo" style="margin-top:20px; display:none;">
    <h2>Welcome, <span id="userName"></span></h2>
    <p>Coins: <span id="userCoins">0</span> | Money: $<span id="userMoney">0.00</span></p>
  </div>

  <h2>Available Skins</h2>
  <div id="skins"></div>

  <h2>Deals</h2>
  <div id="deals"></div>

  <h2>Events</h2>
  <div id="eventBar"></div>

<script>
let currentKey = null;
const API_BASE = "http://localhost:3000/api"; // Backend endpoint

async function login(){
  const key = document.getElementById("keyInput").value.trim();
  if(!key) return alert("Enter a key!");

  try {
    const res = await fetch(`${API_BASE}/keys/${key}`);
    if(!res.ok) throw new Error("Invalid key");
    const data = await res.json();

    currentKey = key;
    document.getElementById("userInfo").style.display="block";
    document.getElementById("userName").textContent = data.name;
    document.getElementById("userCoins").textContent = data.coins;
    document.getElementById("userMoney").textContent = data.money.toFixed(2);

    loadSkins(data);
    loadDeals(data);
    loadEvents(data);
  } catch(err){
    alert("❌ Invalid key");
  }
}

async function loadSkins(userData){
  const res = await fetch(`${API_BASE}/skins`);
  const skins = await res.json();
  const container = document.getElementById("skins");
  container.innerHTML="";

  skins.forEach(skin=>{
    const owned = userData.owned.includes(skin.id);
    const div = document.createElement("div");
    div.className = "skin " + (owned ? "owned":"locked");
    div.innerHTML = `
      <img src="${skin.image}" alt="">
      <p>${skin.name}</p>
      <p>${skin.price} coins</p>
      ${owned ? "<p>Owned</p>" : `<button onclick="buySkin('${skin.id}',${skin.price})">Buy</button>`}
    `;
    container.appendChild(div);
  });
}

async function buySkin(skinId, price){
  if(!currentKey) return;
  const res = await fetch(`${API_BASE}/buy-skin`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ key: currentKey, skinId, price })
  });
  const data = await res.json();
  if(data.error) return alert("❌ " + data.error);
  alert("✅ Skin purchased!");
  login();
}

async function loadDeals(userData){
  const res = await fetch(`${API_BASE}/deals`);
  const deals = await res.json();
  const container = document.getElementById("deals");
  container.innerHTML="";

  deals.forEach(deal=>{
    const alreadyBought = userData.deals && userData.deals.includes(deal.id);
    if(alreadyBought) return;

    const div = document.createElement("div");
    div.className = "deal";
    div.innerHTML = `
      <img src="${deal.image}" alt="">
      <p>${deal.name}</p>
      <p>${deal.price} coins</p>
      <button onclick="buyDeal('${deal.id}',${deal.price})">Buy Deal</button>
    `;
    container.appendChild(div);
  });
}

async function buyDeal(dealId, price){
  if(!currentKey) return;
  const res = await fetch(`${API_BASE}/buy-deal`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ key: currentKey, dealId, price })
  });
  const data = await res.json();
  if(data.error) return alert("❌ " + data.error);
  alert("✅ Deal purchased!");
  login();
}

async function loadEvents(userData){
  const res = await fetch(`${API_BASE}/events`);
  const events = await res.json();
  const container = document.getElementById("eventBar");
  container.innerHTML="";

  events.forEach(ev=>{
    const div = document.createElement("div");
    div.className = "eventCard";
    div.innerHTML = `
      <img src="${ev.image}" alt="">
      <div class="eventCountdown"></div>
      <p>${ev.name}</p>
    `;
    container.appendChild(div);

    setInterval(()=>{
      const now = Date.now();
      let remaining = ev.status==="coming" ? ev.startTime-now : ev.endTime-now;
      if(remaining<0) remaining=0;
      const d = Math.floor(remaining/86400000);
      const h = Math.floor((remaining%86400000)/3600000);
      const m = Math.floor((remaining%3600000)/60000);
      const s = Math.floor((remaining%60000)/1000);
      div.querySelector(".eventCountdown").textContent = `${d}d ${h}h ${m}m ${s}s`;
    },1000);
  });
}
</script>

</body>
</html>
