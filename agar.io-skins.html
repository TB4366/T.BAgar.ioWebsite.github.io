<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Agar.io Shop</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: white;
    }

    .header {
        padding: 15px;
        text-align: center;
        background: #111;
        font-size: 22px;
        font-weight: bold;
    }

    .uid-box {
        text-align: center;
        margin: 10px 0;
    }

    .uid-box input {
        padding: 8px;
        width: 200px;
        border-radius: 6px;
        border: none;
        outline: none;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
        padding: 20px;
    }

    .offer {
        background: #1a1a1a;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
        border: 2px solid #333;
    }

    .offer:hover {
        border-color: #5af;
        transform: scale(1.05);
    }

    .offer img {
        width: 100px;
        height: 100px;
    }

    .offer-title {
        margin-top: 10px;
        font-size: 16px;
        font-weight: bold;
    }

    .offer-price {
        margin-top: 5px;
        font-size: 15px;
        color: #5af;
    }

    /* CONFIRM POPUP */

    .popup-bg {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.75);
        display: none;
        justify-content: center;
        align-items: center;
    }

    .popup {
        background: #222;
        padding: 25px;
        border-radius: 12px;
        width: 300px;
        text-align: center;
    }

    .popup button {
        margin: 10px;
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 16px;
    }

    .allow-btn {
        background: #5af;
        color: black;
        font-weight: bold;
    }

    .cancel-btn {
        background: #555;
        color: white;
    }

</style>
</head>

<body>

<div class="header">Agar.io Skin Shop</div>

<div class="uid-box">
    <input id="uidInput" placeholder="Vul hier je UID in">
</div>

<div class="container" id="offerContainer">Aan het laden...</div>

<!-- POPUP -->
<div class="popup-bg" id="popupBg">
    <div class="popup">
        <div id="popupText">Dit venster wil een betaling openen.</div>
        <button class="allow-btn" id="allowBtn">Toestaan</button>
        <button class="cancel-btn" onclick="closePopup()">Annuleren</button>
    </div>
</div>

<script>

// Load real Agar.io config
const CONFIG_URL = "https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json";

let selectedProductId = null;

async function loadOffers() {
    try {
        const res = await fetch(CONFIG_URL);
        const data = await res.json();

        const offers = data.store?.offers ?? [];
        const container = document.getElementById("offerContainer");
        container.innerHTML = "";

        offers.forEach(o => {
            if (!o.productId) return;

            const div = document.createElement("div");
            div.className = "offer";

            div.innerHTML = `
                <img src="${o.imageUrl || 'https://via.placeholder.com/100'}">
                <div class="offer-title">${o.title}</div>
                <div class="offer-price">${o.price.amount} ${o.price.currency}</div>
            `;

            div.onclick = () => openConfirm(o.productId, o.title);

            container.appendChild(div);
        });

    } catch (e) {
        document.getElementById("offerContainer").innerHTML = "Fout bij laden...";
    }
}

function openConfirm(productId, title) {
    selectedProductId = productId;
    document.getElementById("popupText").innerHTML =
        `Je staat op het punt <b>${title}</b> te kopen.<br>Venster openen?`;

    document.getElementById("popupBg").style.display = "flex";
}

function closePopup() {
    document.getElementById("popupBg").style.display = "none";
}

document.getElementById("allowBtn").onclick = () => {
    const uid = document.getElementById("uidInput").value.trim();
    if (!uid) {
        alert("Vul eerst je UID in!");
        return;
    }

    closePopup();

    // REAL Xsolla URL moet hier ingevuld door JOU
    const xsollaURL =
        `https://secure.xsolla.com/paystation3/?purchase=${selectedProductId}&uid=${uid}`;

    window.open(xsollaURL, "_blank");
};

loadOffers();

</script>

</body>
</html>
