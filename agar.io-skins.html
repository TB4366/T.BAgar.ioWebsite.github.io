<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; text-align:center;}
h1 { color:#0af; font-size:28px; margin-bottom:10px; }
.top-bar { display:flex; justify-content:space-between; margin-bottom:20px; align-items:center; }
input, button { padding:10px; margin:5px; border-radius:50px; border:none; font-size:16px; }
button { cursor:pointer; }
.skins { display:flex; flex-wrap: wrap; gap:25px; justify-content:center; margin-top:20px; }
.skinContainer { display:flex; flex-direction:column; align-items:center; }
.skin { width:150px; height:150px; border-radius:50%; background:#333; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; transition: transform 0.1s, filter 0.1s;}
.skin img { width:100%; height:100%; object-fit:cover; border-radius:50%; transition: filter 0.2s, opacity 0.2s; user-select:none; pointer-events:none;}
.skin:hover { filter: brightness(1.2); }
.lock { position:absolute; top:5px; left:5px; font-size:18px; background:rgba(0,0,0,0.6); padding:3px 6px; border-radius:50%; }
.grayed img { filter: grayscale(100%); opacity:0.5; }
.skinName, .skinPrice { margin-top:5px; font-size:14px; }
#keyInput { width:300px; font-size:18px; text-align:center; }
#message { font-size:18px; margin-top:10px; color:yellow; }
#purchasedTitle { margin-top:30px; font-size:20px; text-decoration:underline; }
#purchasedSkins { display:flex; flex-wrap: wrap; justify-content:center; gap:20px; margin-top:10px;}
#purchasedSkins img { width:100px; height:100px; border-radius:50%; border:2px solid #0af; }

/* Coins & Money */
#currency { display:flex; justify-content:flex-end; gap:20px; align-items:center; font-size:16px; margin-bottom:10px; }
.currencyItem { display:flex; align-items:center; gap:5px; }

/* Event bar */
#eventBarContainer { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); height:2cm; display:flex; gap:5px; overflow:hidden; border-radius:5px; z-index:999; }

/* Countdown overlay */
.eventCountdown { position:absolute; bottom:0; left:0; width:100%; background:rgba(0,0,0,0.6); color:#fff; font-size:12px; text-align:center; padding:2px 0; }

/* Deal modal */
#dealModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#222; padding:20px; border:2px solid #0af; border-radius:10px; z-index:1000; max-width:400px; color:#fff; }
#dealModal img { width:100%; border-radius:8px; margin:10px 0; user-select:none; pointer-events:none; }
#dealCountdown { font-weight:bold; margin-top:10px; }
#dealNav { display:flex; justify-content:space-between; margin-top:10px; }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div class="top-bar">
  <div>Contact Admin to buy more coins!</div>
  <div id="currency">
    <div class="currencyItem">💰 <span id="money">0.00</span></div>
    <div class="currencyItem">🪙 <span id="coins">0</span></div>
  </div>
</div>

<div id="message">Enter your key below to load your coins and skins:</div>

<input id="keyInput" placeholder="Enter your key here">
<button onclick="loadKey()">Load Key</button>

<h3>Available Skins</h3>
<div class="skins" id="skinsGrid"></div>

<div id="purchasedSection">
  <div id="purchasedTitle">With these skins and deals you have purchased:</div>
  <div id="purchasedSkins"></div>
</div>

<!-- Event bar -->
<div id="eventBarContainer"></div>

<!-- Deal modal -->
<div id="dealModal">
  <h3 id="dealModalTitle"></h3>
  <img id="dealModalImage" src="">
  <p id="dealModalDesc"></p>
  <p id="dealCountdown"></p>
  <div id="dealNav">
    <button onclick="prevDeal()">⬅ Previous</button>
    <button onclick="nextDeal()">Next ➡</button>
  </div>
  <button id="buyDealBtn">Buy Deal</button>
  <button onclick="closeDealModal()">Close</button>
</div>

<script>
let currentKey=null, coins=0, money=0, owned=[], purchasedDeals=[];
let events=[], currentEventDeals=[], currentDealIndex=0, dealCountdownInterval=null;

function showMessage(msg){ document.getElementById('message').textContent=msg; }
function saveData(){ if(!currentKey) return; localStorage.setItem('skinshop_'+currentKey, JSON.stringify({coins,money,owned})); }
function savePurchasedDeals(){ if(!currentKey) return; localStorage.setItem('purchasedDeals_'+currentKey, JSON.stringify(purchasedDeals)); }
function loadPurchasedDeals(){ purchasedDeals=JSON.parse(localStorage.getItem('purchasedDeals_'+currentKey)||'[]'); }

function getPublishedSkins(){ return JSON.parse(localStorage.getItem('skinsDataPublished')||'[]'); }

function renderSkins(){
  const skins=getPublishedSkins();
  const grid=document.getElementById('skinsGrid');
  grid.innerHTML='';
  const purchasedContainer=document.getElementById('purchasedSkins');
  purchasedContainer.innerHTML='';

  skins.forEach(skin=>{
    const isOwned=owned.includes(skin.id);
    if(isOwned) return; // gekocht skins verdwijnen uit beschikbare skins
    const container=document.createElement('div'); container.className='skinContainer';
    const div=document.createElement('div'); div.className='skin grayed';
    div.innerHTML=`<img src="${skin.image}" alt="${skin.name}">`;
    const lock=document.createElement('div'); lock.className='lock'; lock.textContent='🔒'; div.appendChild(lock);
    div.onclick=()=>buySkin(skin.id, skin.price);
    container.appendChild(div);
    const nameDiv=document.createElement('div'); nameDiv.className='skinName'; nameDiv.textContent=skin.name; container.appendChild(nameDiv);
    const priceDiv=document.createElement('div'); priceDiv.className='skinPrice'; priceDiv.textContent='Price: '+skin.price+' 💠'; container.appendChild(priceDiv);
    grid.appendChild(container);
  });

  // gekocht skins
  owned.forEach(id=>{
    const skin=getPublishedSkins().find(s=>s.id===id);
    if(skin) addPurchasedItem(skin.image,skin.name,false);
  });

  purchasedDeals.forEach(did=>{
    const allDeals=JSON.parse(localStorage.getItem('dealDataPublished')||'[]');
    const deal=allDeals.find(dd=>dd.id===did);
    if(deal) addPurchasedItem(deal.image,deal.name,true);
  });

  document.getElementById('coins').textContent=coins;
  document.getElementById('money').textContent=money.toFixed(2);
}

function addPurchasedItem(imgSrc,name,isDeal=false){
  const purchasedContainer=document.getElementById('purchasedSkins');
  const img=document.createElement('img');
  img.src=imgSrc; img.alt=name; 
  img.style.opacity='1';
  img.style.pointerEvents='auto';
  purchasedContainer.appendChild(img);
}

function loadKey(){
  const key=document.getElementById('keyInput').value.trim();
  if(!key) return showMessage('Please enter your key');
  const data=JSON.parse(localStorage.getItem('skinshop_'+key)||'{}');
  if(!data || data.coins===undefined){ showMessage('❌ Invalid key!'); currentKey=null; coins=0; money=0; owned=[]; purchasedDeals=[]; renderSkins(); return; }
  currentKey=key; coins=data.coins||0; money=data.money||0; owned=data.owned||[];
  loadPurchasedDeals();
  showMessage('✅ Key loaded successfully!');
  renderSkins();
}

function buySkin(id,price){
  if(!currentKey) return showMessage('Enter your key first');
  if(owned.includes(id)) return showMessage('Already own this skin');
  if(coins<price) return showMessage('Not enough coins');
  coins-=price; owned.push(id); saveData(); showMessage('✅ Skin purchased!'); renderSkins();
}

// ================= Event & Deals =================
function loadEvents(){
  events=JSON.parse(localStorage.getItem('eventDataPublished')||'[]');
  renderEventBar();
  startEventCountdowns();
}

function renderEventBar(){
  const container=document.getElementById('eventBarContainer');
  container.innerHTML='';
  events.forEach((event,index)=>{
    const div=document.createElement('div');
    div.style.width='5cm'; div.style.height='2cm'; div.style.border='2px solid #0af'; div.style.borderRadius='5px';
    div.style.overflow='hidden'; div.style.cursor='pointer'; div.style.flexShrink='0'; div.style.position='relative';

    const img=document.createElement('img');
    img.src=event.barImage||event.image;
    img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover';
    div.appendChild(img);

    const countdownDiv=document.createElement('div'); countdownDiv.className='eventCountdown';
    div.appendChild(countdownDiv);

    div.onclick=()=>openEventDeals(event);
    div.dataset.eventIndex=index;
    container.appendChild(div);
  });
}

function startEventCountdowns(){
  setInterval(()=>{
    const now=Date.now();
    const container=document.getElementById('eventBarContainer');
    Array.from(container.children).forEach(div=>{
      const idx=div.dataset.eventIndex;
      const event=events[idx];
      const countdownDiv=div.querySelector('.eventCountdown');

      let remaining=0;
      if(event.status==='coming'){ remaining=event.startTime-now; }
      else if(event.status==='active'){ remaining=event.endTime-now; }

      if(remaining<0){
        if(event.status==='coming'){ event.status='active'; }
        if(event.status==='active'){ event.status='inactive'; }
        localStorage.setItem('eventDataPublished',JSON.stringify(events));
        renderEventBar();
      } else {
        const d=Math.floor(remaining/86400000), h=Math.floor((remaining%86400000)/3600000), m=Math.floor((remaining%3600000)/60000), s=Math.floor((remaining%60000)/1000);
        countdownDiv.textContent=`${d}d ${h}h ${m}m ${s}s`;
      }
    });
  },1000);
}

function openEventDeals(event){
  if(event.status==='coming'){ alert("⏳ This event is coming soon!"); return; }
  const allDeals=JSON.parse(localStorage.getItem('dealDataPublished')||'[]');
  currentEventDeals=allDeals.filter(d=>d.eventId===event.id && d.status==='active');
  if(currentEventDeals.length===0){ alert("No active deals for this event."); return; }
  currentDealIndex=0;
  showDeal(currentEventDeals[currentDealIndex]);
}

// ===== Deal modal functions =====
function showDeal(deal){
  const isPurchased=purchasedDeals.includes(deal.id);
  document.getElementById('dealModalTitle').textContent=deal.name;
  document.getElementById('dealModalDesc').textContent=deal.desc;
  const img=document.getElementById('dealModalImage'); img.src=deal.image; img.style.opacity='1';
  document.getElementById('dealModal').style.display='block';
  updateDealCountdown(deal);
  if(dealCountdownInterval) clearInterval(dealCountdownInterval);
  dealCountdownInterval=setInterval(()=>updateDealCountdown(deal),1000);

  const buyBtn=document.getElementById('buyDealBtn');
  buyBtn.disabled=isPurchased;
  buyBtn.onclick=()=>buyDeal(deal);
}

function buyDeal(deal){
  if(!currentKey) return showMessage('Enter key first');
  if(money<deal.price) return showMessage('Not enough money!');
  money-=deal.price; saveData();

  // voeg deal toe aan purchasedDeals
  if(!purchasedDeals.includes(deal.id)) purchasedDeals.push(deal.id);
  savePurchasedDeals();

  // geef skins die bij de deal horen
  if(deal.skins && deal.skins.length>0){
    deal.skins.forEach(skinId=>{
      if(!owned.includes(skinId)){
        owned.push(skinId);
      }
    });
    saveData();
  }

  addPurchasedItem(deal.image,deal.name,true);
  renderSkins();
  closeDealModal();
}

function prevDeal(){ if(currentEventDeals.length===0) return; currentDealIndex=(currentDealIndex-1+currentEventDeals.length)%currentEventDeals.length; showDeal(currentEventDeals[currentDealIndex]); }
function nextDeal(){ if(currentEventDeals.length===0) return; currentDealIndex=(currentDealIndex+1)%currentEventDeals.length; showDeal(currentEventDeals[currentDealIndex]); }
function updateDealCountdown(deal){
  const now=Date.now(); let remaining=deal.endTime-now; if(remaining<0) remaining=0;
  const d=Math.floor(remaining/86400000), h=Math.floor((remaining%86400000)/3600000), m=Math.floor((remaining%3600000)/60000), s=Math.floor((remaining%60000)/1000);
  document.getElementById('dealCountdown').textContent=`Ends in: ${d}d ${h}h ${m}m ${s}s - Price: ${deal.price} 💰`;
}
function closeDealModal(){ document.getElementById('dealModal').style.display='none'; if(dealCountdownInterval) clearInterval(dealCountdownInterval); }

renderSkins();
loadEvents();
</script>

</body>
</html>
