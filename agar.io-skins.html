<!DOCTYPE html><html><head><meta charset='utf-8'><title>Agar.io</title><style>
body{margin:0;background:#1b2230;color:#fff;font-family:Arial}header{background:#273246;padding:18px;font-size:28px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.auth-btn{background:#3fa9ff;color:#fff;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;font-weight:bold}
.auth-btn:hover{background:#2d8bc4}
.fb-btn{background:#1877f2!important}
.fb-btn:hover{background:#165ec9!important}
.tabs{display:flex;position:relative;background:#202a3b}.tab{padding:14px 24px;cursor:pointer;font-weight:bold}.active{color:#fff}.slider{position:absolute;bottom:0;height:4px;width:160px;background:#3fa9ff;transition:.2s}
.top{display:flex;justify-content:space-between;padding:20px}input{padding:8px;width:250px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:20px}.card{background:#2a3448;padding:10px;border-radius:10px;text-align:center}.skin img{width:110px;height:110px;border-radius:50%}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:1000}.box{width:360px;margin:8% auto;background:#2a3448;padding:18px;border-radius:10px;position:relative}.close{position:absolute;right:10px;top:8px;cursor:pointer;font-size:28px}
#deals{display:none;padding:40px}button{margin:4px}
.form-group{margin:15px 0}.form-group input{width:100%;padding:10px;box-sizing:border-box;background:#1b2230;border:1px solid #3fa9ff;border-radius:5px;color:#fff}
.form-group label{display:block;margin-bottom:5px;font-weight:bold}
.error{color:#ff6b6b;font-size:12px;margin-top:5px}
.success{color:#51cf66;font-size:12px;margin-top:5px}
.auth-divider{text-align:center;margin:15px 0;color:#888}
.auth-divider::before{content:"";display:inline-block;width:40%;border-top:1px solid #555;vertical-align:middle;margin-right:10px}
.auth-divider::after{content:"";display:inline-block;width:40%;border-top:1px solid #555;vertical-align:middle;margin-left:10px}
.user-info{background:#1b2230;padding:10px;border-radius:5px;margin-top:10px;text-align:center}
</style></head><body>
<header>
  <span>Agar.io Skins & Deals</span>
  <div>
    <button class="auth-btn" id=loginBtn onclick="openLoginModal()">Login</button>
    <button class="auth-btn" id=logoutBtn onclick="logout()" style="display:none">Logout</button>
  </div>
</header>
<div class=tabs><div class="tab active" id=t1>AGAR.IO SKINS</div><div class=tab id=t2>SPECIAL DEALS</div><div class=slider id=sl></div></div>
<div class=top><div><b>Currently Equipped Skin</b><br><span id=currentSkin>Default</span></div><input id=search placeholder='Search skins...'></div>
<div id=skinsPage><div id=grid class=grid></div></div><div id=deals><h2>Special Deals</h2></div>

<!-- Login Modal -->
<div id=loginModal class=modal>
  <div class=box>
    <div class=close onclick='closeLoginModal()'>&times;</div>
    <h2>Login</h2>
    
    <!-- Facebook Login Button -->
    <button class="auth-btn fb-btn" style="width:100%;padding:10px;margin-bottom:10px" onclick="facebookLogin()">📘 Login with Facebook</button>
    
    <div class=auth-divider>of</div>
    
    <!-- Email/Password Login -->
    <form id=loginForm onsubmit="handleLogin(event)">
      <div class=form-group>
        <label for=email>Email:</label>
        <input type=email id=email placeholder='your@email.com'>
        <div class=error id=emailError></div>
      </div>
      <div class=form-group>
        <label for=password>Password:</label>
        <input type=password id=password placeholder='••••••••'>
        <div class=error id=passwordError></div>
      </div>
      <button type=submit style="width:100%;padding:10px;background:#3fa9ff;border:none;border-radius:5px;cursor:pointer;font-weight:bold;color:#fff">Login</button>
      <div class=error id=loginError style="text-align:center;margin-top:10px"></div>
      <div class=success id=loginSuccess style="text-align:center;margin-top:10px"></div>
    </form>
  </div>
</div>

<!-- Product Modal -->
<div id=m class=modal><div class=box><div class=close onclick='m.style.display="none"'>&times;</div><h2 id=n></h2><hr><p id=d></p><p id=c></p><p id=dna></p><hr><p>For questions or assistance, please contact our support team!</p><a id=mail href='mailto:support@example.com'><button>Send Email</button></a></div></div>

<!-- Facebook SDK -->
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v18.0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></script>

<script>
// Facebook SDK initialization
window.fbAsyncInit = function() {
  FB.init({
    appId      : 'YOUR_FACEBOOK_APP_ID_HERE', // Replace with your App ID
    xfbml      : true,
    version    : 'v18.0'
  });
  
  FB.AppEvents.logPageView();
  checkLoginStatus();
};

const skins=[
{name:"Zen Shaman",image:"IMG_9638.webp",coins:"1250 Coins",dna:"75 DNA",description:"A mysterious warrior blessed with ancient powers."},
{name:"Celestial Plague",image:"IMG_9639.webp",coins:"2500 Coins",dna:"120 DNA",description:"Spread fear across the arena."},
{name:"Neon Skull",image:"IMG_9640.webp",coins:"1800 Coins",dna:"90 DNA",description:"A glowing futuristic skull."}
];

let currentUser=null;

function facebookLogin(){
  FB.login(function(response){
    if(response.authResponse){
      FB.api('/me', {fields:'id,name,email,picture'}, function(user){
        currentUser={
          username:user.name,
          email:user.email||'facebook_user@agar.io',
          id:user.id,
          picture:user.picture.data.url,
          loginMethod:'facebook'
        };
        localStorage.setItem("authToken","fb_token_"+user.id);
        localStorage.setItem("userData",JSON.stringify(currentUser));
        updateUIForLogin();
        closeLoginModal();
      });
    }else{
      alert("Login failed. Please try again.");
    }
  }, {scope:'public_profile,email'});
}

function checkLoginStatus(){
  const token=localStorage.getItem("authToken");
  if(token){
    currentUser=JSON.parse(localStorage.getItem("userData"));
    updateUIForLogin();
  }
}

function updateUIForLogin(){
  document.getElementById("loginBtn").style.display="none";
  document.getElementById("logoutBtn").style.display="block";
  document.getElementById("currentSkin").textContent=currentUser.username||"Player";
}

function updateUIForLogout(){
  document.getElementById("loginBtn").style.display="block";
  document.getElementById("logoutBtn").style.display="none";
  document.getElementById("currentSkin").textContent="Default";
}

function openLoginModal(){
  document.getElementById("loginModal").style.display="block";
  document.getElementById("loginForm").reset();
  clearErrors();
}

function closeLoginModal(){
  document.getElementById("loginModal").style.display="none";
  document.getElementById("loginForm").reset();
  clearErrors();
}

function clearErrors(){
  document.getElementById("emailError").textContent="";
  document.getElementById("passwordError").textContent="";
  document.getElementById("loginError").textContent="";
  document.getElementById("loginSuccess").textContent="";
}

function handleLogin(event){
  event.preventDefault();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const emailError=document.getElementById("emailError");
  const passwordError=document.getElementById("passwordError");
  const loginError=document.getElementById("loginError");
  const loginSuccess=document.getElementById("loginSuccess");
  
  clearErrors();
  
  // Client-side validation
  if(!email){emailError.textContent="Email is required";return}
  if(!email.includes("@")){emailError.textContent="Invalid email format";return}
  if(!password){passwordError.textContent="Password is required";return}
  if(password.length<8){passwordError.textContent="Password must be at least 8 characters";return}
  
  loginSuccess.textContent="✓ Securely sending to server...";
  loginSuccess.style.color="#51cf66";
  
  setTimeout(()=>{
    currentUser={username:email.split("@")[0],email:email,loginMethod:'email'};
    localStorage.setItem("authToken","secure_token_"+Date.now());
    localStorage.setItem("userData",JSON.stringify(currentUser));
    updateUIForLogin();
    closeLoginModal();
  },1500);
}

function logout(){
  if(confirm("Are you sure you want to logout?")){
    if(currentUser?.loginMethod==='facebook'){
      FB.logout(function(response){
        localStorage.removeItem("authToken");
        localStorage.removeItem("userData");
        currentUser=null;
        updateUIForLogout();
      });
    }else{
      localStorage.removeItem("authToken");
      localStorage.removeItem("userData");
      currentUser=null;
      updateUIForLogout();
    }
  }
}

function draw(f=""){
  grid.innerHTML="";
  skins.filter(x=>x.name.toLowerCase().includes(f.toLowerCase())).forEach(s=>{
    let e=document.createElement("div");
    e.className="card";
    e.innerHTML=`<div class=skin><img src="${s.image}"></div><h3>${s.name}</h3><button>BUY</button><button>VIEW PRODUCT</button>`;
    e.querySelectorAll("button")[1].onclick=()=>{
      n.textContent=s.name;
      d.textContent=s.description;
      c.textContent=s.coins;
      dna.textContent=s.dna;
      m.style.display="block"
    };
    grid.appendChild(e);
  })
}

draw();

search.oninput=e=>draw(e.target.value);
t1.onclick=()=>{t1.classList.add("active");t2.classList.remove("active");sl.style.left="0";skinsPage.style.display="block";deals.style.display="none";}
t2.onclick=()=>{t2.classList.add("active");t1.classList.remove("active");sl.style.left=t1.offsetWidth+"px";skinsPage.style.display="none";deals.style.display="block";}

window.onclick=e=>{if(e.target===document.getElementById("loginModal")){closeLoginModal()}if(e.target===m){m.style.display="none"}}
</script></body></html>
