<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; font-size:28px; }
.top-bar { display:flex; justify-content: space-between; margin-bottom: 20px; }
input, button { padding:8px; margin:5px; border-radius:4px; border:none; font-size:16px; }
button { cursor:pointer; }
.skins { display:flex; flex-wrap: wrap; gap:15px; margin-top:20px; }
.skin { background:#333; padding:10px; border-radius:8px; width:150px; text-align:center; cursor:pointer; transition: transform 0.1s, filter 0.1s; position:relative;}
.skin:hover { filter: brightness(1.2); }
.skin:active { transform: scale(0.97); }
.lock { position:absolute; top:5px; left:5px; font-size:14px; background:rgba(0,0,0,0.6); padding:2px 5px; border-radius:4px; }
.grayed { filter: grayscale(100%); }
#keyInput { width:300px; font-size:18px; text-align:center; }
#message { font-size:18px; margin-top:10px; color:yellow; }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div class="top-bar">
  <div>Contact Admin to buy more coins!</div>
  <div>
    <div style="font-size:12px;color:#aaa;">Your Coins</div>
    <div id="coins">0</div>
  </div>
</div>

<div id="message">Enter your key below to load your coins and skins:</div>

<input id="keyInput" placeholder="Enter your key here">
<button onclick="loadKey()">Load Key</button>

<h3>Skins</h3>
<div class="skins" id="skinsGrid"></div>

<script>
// Skin data
const skins = [
  {id:'skin1', name:'Stealth Ops', price:100},
  {id:'skin2', name:'Crimson Viper', price:250},
  {id:'skin3', name:'Glacier', price:500},
  {id:'skin4', name:'Midnight', price:750},
  {id:'skin5', name:'Solar Flare', price:1200},
];

let currentKey = null;
let coins = 0;
let owned = [];

// Helper functions
function showMessage(msg){ document.getElementById('message').textContent=msg; }

function saveData(){
  if(!currentKey) return;
  localStorage.setItem('skinshop_'+currentKey, JSON.stringify({coins, owned}));
}

function renderSkins(){
  const grid = document.getElementById('skinsGrid');
  grid.innerHTML='';
  skins.forEach(skin=>{
    const isOwned = owned.includes(skin.id);
    const div = document.createElement('div');
    div.className='skin '+(isOwned?'':'grayed');
    div.innerHTML=`
      <div class="lock">${isOwned?'✓':'🔒'}</div>
      <div style="margin-top:20px;">${skin.name}</div>
      <div>Price: ${skin.price} 💠</div>
      <button onclick="buySkin('${skin.id}',${skin.price})">Buy</button>
    `;
    grid.appendChild(div);
  });
  document.getElementById('coins').textContent=coins;
}

// Load key
function loadKey(){
  const key = document.getElementById('keyInput').value.trim();
  if(!key) return showMessage('Please enter your key');
  const data = JSON.parse(localStorage.getItem('skinshop_'+key)||'{}');
  if(!data || data.coins===undefined){
    showMessage('❌ Invalid key! Please check your key with the admin.');
    currentKey = null;
    coins = 0;
    owned = [];
    renderSkins();
    return;
  }
  currentKey = key;
  coins = data.coins||0;
  owned = data.owned||[];
  showMessage('✅ Key loaded successfully!');
  renderSkins();
}

// Buy skin
function buySkin(id,price){
  if(!currentKey) return showMessage('Enter your key first');
  if(owned.includes(id)) return showMessage('You already own this skin');
  if(coins<price) return showMessage('Not enough coins');
  coins-=price;
  owned.push(id);
  saveData();
  showMessage('Skin purchased!');
  renderSkins();
}

// Initial render
renderSkins();
</script>

</body>
</html>
