<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Shop - User Panel</title>
<style>
body { font-family: Arial; background:#0b0b0b; color:#fff; text-align:center; margin:0; padding:20px; }
h1 { color:#0af; }
input, button { padding:8px; margin:5px; border:none; border-radius:5px; }
button { cursor:pointer; background:#0af; color:#fff; }
.skin-card { display:inline-block; background:#111; border:1px solid #333; border-radius:8px; margin:10px; padding:10px; width:180px; }
.skin-card img { width:150px; height:150px; border-radius:8px; }
.skin-card h3 { margin:5px 0; }
#skinsContainer, #dealsContainer, #eventsContainer { display:flex; flex-wrap:wrap; justify-content:center; }
#userInfo { margin:20px 0; }
</style>
</head>
<body>

<h1>🎮 Skin Shop</h1>

<div id="loginSection">
  <input id="userKeyInput" placeholder="Enter your key">
  <button onclick="login()">Login</button>
  <div id="loginMessage" style="color:yellow; margin-top:10px;"></div>
</div>

<div id="userPanel" style="display:none;">
  <div id="userInfo"></div>

  <h2>🧥 Available Skins</h2>
  <div id="skinsContainer"></div>

  <h2>🔥 Deals</h2>
  <div id="dealsContainer"></div>

  <h2>🎉 Events</h2>
  <div id="eventsContainer"></div>
</div>

<script>
const GITHUB_BASE = "https://raw.githubusercontent.com/USERNAME/REPO/main/data/"; 
// 👆 Zet hier jouw echte GitHub gebruikersnaam en repo naam

let allKeys = [];
let allSkins = [];
let allDeals = [];
let allEvents = [];
let currentUser = null;

async function fetchJSON(file){
  try {
    const res = await fetch(GITHUB_BASE + file);
    if(!res.ok) throw new Error("404");
    return await res.json();
  } catch(err){
    console.error("Fout bij ophalen van", file, err);
    return [];
  }
}

async function loadAllData(){
  [allKeys, allSkins, allDeals, allEvents] = await Promise.all([
    fetchJSON("keys.json"),
    fetchJSON("skins.json"),
    fetchJSON("deals.json"),
    fetchJSON("events.json")
  ]);
  console.log("✅ Data geladen van GitHub");
}

function login(){
  const key = document.getElementById("userKeyInput").value.trim();
  if(!key) return alert("Vul je key in!");
  const match = allKeys.find(k => k.key === key || k.id === key);
  if(!match){ 
    document.getElementById("loginMessage").textContent = "❌ Ongeldige key!";
    return;
  }
  currentUser = match;
  document.getElementById("loginSection").style.display = "none";
  document.getElementById("userPanel").style.display = "block";
  renderUserInfo();
  renderSkins();
  renderDeals();
  renderEvents();
}

function renderUserInfo(){
  const info = document.getElementById("userInfo");
  info.innerHTML = `
    <h2>Welkom, ${currentUser.name}!</h2>
    <p>💰 Coins: <b>${currentUser.coins}</b> | 💵 Money: <b>${currentUser.money}</b></p>
  `;
}

function renderSkins(){
  const container = document.getElementById("skinsContainer");
  container.innerHTML = "";
  allSkins.forEach(skin => {
    const owned = currentUser.owned?.includes(skin.id);
    const div = document.createElement("div");
    div.className = "skin-card";
    div.innerHTML = `
      <img src="${skin.image}" alt="${skin.name}">
      <h3>${skin.name}</h3>
      <p>Prijs: ${skin.price} ${skin.useFor === 'coins' ? '🪙' : '💵'}</p>
      <button ${owned ? "disabled" : ""} onclick="buySkin('${skin.id}')">
        ${owned ? "✅ Owned" : "Koop"}
      </button>
    `;
    container.appendChild(div);
  });
}

function renderDeals(){
  const container = document.getElementById("dealsContainer");
  container.innerHTML = "";
  const activeDeals = allDeals.filter(d => d.status === "active");
  activeDeals.forEach(deal => {
    const div = document.createElement("div");
    div.className = "skin-card";
    div.innerHTML = `
      <img src="${deal.image}" alt="${deal.name}">
      <h3>${deal.name}</h3>
      <p>${deal.desc}</p>
      <p>Prijs: ${deal.price}</p>
      <p>Status: ${deal.status}</p>
    `;
    container.appendChild(div);
  });
}

function renderEvents(){
  const container = document.getElementById("eventsContainer");
  container.innerHTML = "";
  const activeEvents = allEvents.filter(e => e.status === "active");
  activeEvents.forEach(event => {
    const div = document.createElement("div");
    div.className = "skin-card";
    div.innerHTML = `
      <img src="${event.image}" alt="${event.name}">
      <h3>${event.name}</h3>
      <p>${event.desc}</p>
      <p>Status: ${event.status}</p>
    `;
    container.appendChild(div);
  });
}

function buySkin(skinId){
  const skin = allSkins.find(s => s.id === skinId);
  if(!skin) return alert("Skin niet gevonden");
  const currency = skin.useFor === "coins" ? "coins" : "money";
  if(currentUser[currency] < skin.price){
    alert("Niet genoeg " + currency);
    return;
  }
  currentUser[currency] -= skin.price;
  if(!currentUser.owned) currentUser.owned = [];
  currentUser.owned.push(skin.id);
  alert(`✅ Je hebt ${skin.name} gekocht!`);
  renderUserInfo();
  renderSkins();
}

window.onload = async () => {
  await loadAllData();
};
</script>

</body>
</html>
