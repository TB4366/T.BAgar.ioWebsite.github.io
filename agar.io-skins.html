<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Shop User</title>
<style>
body { font-family: Arial; background:#222; color:#fff; padding:20px; }
input, button { padding:6px; margin:5px; border-radius:4px; border:none; font-size:14px; }
button { cursor:pointer; }
.skinThumb { width:60px; height:60px; border-radius:50%; margin:5px; border:2px solid transparent; cursor:pointer; }
.skinThumb.locked { opacity:0.4; cursor:default; }
.skinThumb.selected { border-color:#0af; }
#skinsContainer { display:flex; flex-wrap:wrap; }
#eventsContainer, #dealsContainer { margin-top:20px; }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div>
  <input id="userKey" placeholder="Enter your key">
  <button onclick="login()">Login</button>
</div>
<div id="userMessage" style="color:yellow;"></div>

<div id="shopContent" style="display:none;">
  <h2>Your Coins: <span id="userCoins">0</span> | Money: <span id="userMoney">0</span></h2>
  
  <h3>Skins</h3>
  <div id="skinsContainer"></div>

  <h3>Events</h3>
  <div id="eventsContainer"></div>

  <h3>Deals</h3>
  <div id="dealsContainer"></div>
</div>

<script>
// ====== User Data ======
let currentUserKey = null;
let currentUserData = null;

function showUserMessage(msg){ document.getElementById('userMessage').textContent = msg; }

// ====== Login ======
function login(){
  const keyInput = document.getElementById('userKey').value.trim();
  if(!keyInput) return showUserMessage('Enter a key');
  const storedData = localStorage.getItem('skinshop_'+keyInput);
  if(!storedData) return showUserMessage('Invalid Key');
  currentUserKey = 'skinshop_'+keyInput;
  currentUserData = JSON.parse(storedData);
  showUserMessage('✅ Logged in as '+currentUserData.name);
  document.getElementById('shopContent').style.display='block';
  updateUserDisplay();
}

function updateUserDisplay(){
  if(!currentUserData) return;
  document.getElementById('userCoins').textContent=currentUserData.coins||0;
  document.getElementById('userMoney').textContent=currentUserData.money||0;
  renderSkins();
  renderEvents();
  renderDeals();
}

// ====== Skins ======
function renderSkins(){
  const container = document.getElementById('skinsContainer');
  container.innerHTML='';
  const skins = JSON.parse(localStorage.getItem('skinsDataPublished')||'[]');
  skins.forEach(skin=>{
    const img=document.createElement('img');
    img.src=skin.image||'';
    img.title=skin.name+' - Price: '+skin.price;
    const owned = currentUserData.owned.includes(skin.id);
    img.className='skinThumb '+(owned?'selected':'locked');
    if(!owned && skin.useFor==='coins'){
      img.onclick = ()=>buySkin(skin);
    }
    container.appendChild(img);
  });
}

function buySkin(skin){
  if(currentUserData.owned.includes(skin.id)) return;
  if(currentUserData.coins<skin.price) return alert('Not enough coins');
  currentUserData.coins -= skin.price;
  currentUserData.owned.push(skin.id);
  saveUserData();
  updateUserDisplay();
}

// ====== Events ======
function renderEvents(){
  const container = document.getElementById('eventsContainer');
  container.innerHTML='';
  const events = JSON.parse(localStorage.getItem('eventDataPublished')||'[]');
  const now = Date.now();
  events.forEach(e=>{
    if(e.status==='inactive') return;
    if(e.status==='coming' && e.startTime>now) return;
    const div=document.createElement('div');
    div.innerHTML=`<strong>${e.name}</strong>: ${e.desc}`;
    container.appendChild(div);
  });
}

// ====== Deals ======
function renderDeals(){
  const container = document.getElementById('dealsContainer');
  container.innerHTML='';
  const deals = JSON.parse(localStorage.getItem('dealDataPublished')||'[]');
  const now = Date.now();
  deals.forEach(d=>{
    if(d.status==='inactive') return;
    if(d.status==='coming' && d.startTime>now) return;
    const div=document.createElement('div');
    const canBuy = currentUserData.money>=d.price;
    div.innerHTML=`<strong>${d.name}</strong>: ${d.desc} - $${d.price} <button ${canBuy?'':'disabled'} onclick="buyDeal(${JSON.stringify(d)})">Buy</button>`;
    container.appendChild(div);
  });
}

function buyDeal(deal){
  if(currentUserData.money<deal.price) return alert('Not enough money');
  currentUserData.money -= deal.price;
  deal.skins.forEach(sid=>{
    if(!currentUserData.owned.includes(sid)) currentUserData.owned.push(sid);
  });
  saveUserData();
  updateUserDisplay();
}

// ====== Save User ======
function saveUserData(){
  localStorage.setItem(currentUserKey, JSON.stringify(currentUserData));
}

</script>

</body>
</html>
