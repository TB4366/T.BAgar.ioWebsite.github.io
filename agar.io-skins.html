<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; text-align:center;}
h1 { color:#0af; font-size:28px; margin-bottom:10px; }
.top-bar { display:flex; justify-content: space-between; margin-bottom: 20px; }
input, button { padding:10px; margin:5px; border-radius:50px; border:none; font-size:16px; }
button { cursor:pointer; }
.skins { display:flex; flex-wrap: wrap; gap:25px; justify-content:center; margin-top:20px; }
.skinContainer { display:flex; flex-direction:column; align-items:center; }
.skin { width:150px; height:150px; border-radius:50%; background:#333; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; transition: transform 0.1s, filter 0.1s;}
.skin img { width:100%; height:100%; object-fit:cover; border-radius:50%; transition: filter 0.2s, opacity 0.2s; }
.skin:hover { filter: brightness(1.2); }
.lock { position:absolute; top:5px; left:5px; font-size:18px; background:rgba(0,0,0,0.6); padding:3px 6px; border-radius:50%; }
.grayed img { filter: grayscale(100%); opacity:0.5; pointer-events:none; }
.skinName, .skinPrice { margin-top:5px; font-size:14px; }
#keyInput { width:300px; font-size:18px; text-align:center; }
#message { font-size:18px; margin-top:10px; color:yellow; }
#purchasedTitle { margin-top:30px; font-size:20px; text-decoration:underline; }
#purchasedSkins { display:flex; flex-wrap: wrap; justify-content:center; gap:20px; margin-top:10px;}
#purchasedSkins img { width:100px; height:100px; border-radius:50%; border:2px solid #0af; }

/* Event bar */
#eventBar { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:999; }
.eventItem { width:80px; height:80px; border-radius:50%; overflow:hidden; cursor:pointer; position:relative; border:3px solid orange; transition: transform 0.2s, box-shadow 0.2s; }
.eventItem:hover { transform: scale(1.1); box-shadow: 0 0 15px orange; }
.eventItem img { width:100%; height:100%; object-fit:cover; }
.eventCountdown { position:absolute; bottom:0; left:0; width:100%; background:rgba(0,0,0,0.7); color:#fff; font-size:12px; text-align:center; border-top:1px solid orange; border-radius:0 0 50% 50%; }

/* Event modal */
#eventModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background: linear-gradient(145deg, #ff7f50, #8b00ff); padding:20px; border:2px solid #fff; border-radius:15px; z-index:1000; max-width:400px; color:#fff; box-shadow: 0 0 20px purple; text-align:center; }
#eventModal h3 { margin-top:10px; color:#fffa65; }
#eventModal p { white-space: pre-line; font-size:16px; margin:10px 0; }
#eventModal button { margin-top:10px; padding:10px 20px; border:none; border-radius:50px; background:#fff; color:#222; font-weight:bold; cursor:pointer; transition: transform 0.1s; }
#eventModal button:hover { transform: scale(1.05); }
#modalImage { max-width:100%; border-radius:10px; box-shadow:0 0 10px #000; }
#modalTimer { font-size:18px; margin-top:5px; color:yellow; font-weight:bold; }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div class="top-bar">
  <div>Contact Admin to buy more coins!</div>
  <div>
    <div style="font-size:12px;color:#aaa;">Your Coins</div>
    <div id="coins">0</div>
  </div>
</div>

<div id="message">Enter your key below to load your coins and skins:</div>

<input id="keyInput" placeholder="Enter your key here">
<button onclick="loadKey()">Load Key</button>

<h3>Available Skins</h3>
<div class="skins" id="skinsGrid"></div>

<div id="purchasedSection">
  <div id="purchasedTitle">With these skins you have purchased:</div>
  <div id="purchasedSkins"></div>
</div>

<!-- Event bar -->
<div id="eventBar"></div>

<!-- Event modal -->
<div id="eventModal">
  <img id="modalImage" src="" alt="Event Image">
  <h3 id="modalName"></h3>
  <p id="modalDesc"></p>
  <div id="modalTimer"></div>
  <button onclick="closeModal()">Close</button>
</div>

<script>
// =======================
// Halloween Event toevoegen
// =======================
const halloweenEvent = {
    id: 'halloween_horrors',
    name: '🔥 Halloween Horrors',
    desc: 'Spooky deals straight from the haunted graveyard!\n\n💰 Coins: 12 000\n🧬 DNA: 950\n⚡ 3x Mass Boost 24h: x1\n🎃 Skin: Pumpkin Reaper\n💵 Price: €7,99',
    image: 'https://i.imgur.com/1b6aZlG.png', // pompoen + vleermuizen
    comingImage: 'https://i.imgur.com/1b6aZlG.png',
    startTime: Date.now(),
    endTime: Date.now() + (2*24*60*60*1000 + 14*60*60*1000 + 36*60*1000)
};

let events = JSON.parse(localStorage.getItem('eventDataPublished') || '[]');
if(!events.some(e => e.id === halloweenEvent.id)){
    events.push(halloweenEvent);
    localStorage.setItem('eventDataPublished', JSON.stringify(events));
}

// =======================
// User / Skins
// =======================
function getPublishedSkins(){ return JSON.parse(localStorage.getItem("skinsDataPublished") || "[]"); }
let currentKey = null, coins = 0, owned = [];

function showMessage(msg){ document.getElementById('message').textContent=msg; }

function saveData(){ if(!currentKey) return; localStorage.setItem('skinshop_'+currentKey, JSON.stringify({coins, owned})); }

function renderSkins(){
  const skins = getPublishedSkins();
  const grid = document.getElementById('skinsGrid');
  grid.innerHTML='';
  const purchasedContainer = document.getElementById('purchasedSkins');
  purchasedContainer.innerHTML='';

  if(skins.length === 0){ grid.innerHTML = "<p>No skins available. Contact the admin.</p>"; }

  skins.forEach(skin=>{
    const isOwned = owned.includes(skin.id);
    const container = document.createElement('div'); container.className='skinContainer';
    const div = document.createElement('div'); div.className='skin '+(isOwned?'':'grayed');
    div.innerHTML=`<img src="${skin.image}" alt="${skin.name}">`;

    if(!isOwned){
      const lock = document.createElement('div'); lock.className='lock'; lock.textContent='🔒'; div.appendChild(lock);
      div.onclick = ()=>buySkin(skin.id, skin.price);
    } else {
      const lock = document.createElement('div'); lock.className='lock'; lock.textContent='✓'; div.appendChild(lock);
    }

    container.appendChild(div);
    const nameDiv = document.createElement('div'); nameDiv.className='skinName'; nameDiv.textContent=skin.name; container.appendChild(nameDiv);
    const priceDiv = document.createElement('div'); priceDiv.className='skinPrice'; priceDiv.textContent='Price: '+skin.price+' 💠'; container.appendChild(priceDiv);
    grid.appendChild(container);

    if(isOwned){
      const pImg = document.createElement('img'); pImg.src = skin.image; pImg.alt = skin.name; purchasedContainer.appendChild(pImg);
    }
  });
  document.getElementById('coins').textContent=coins;
}

function loadKey(){
  const key = document.getElementById('keyInput').value.trim();
  if(!key) return showMessage('Please enter your key');
  const data = JSON.parse(localStorage.getItem('skinshop_'+key)||'{}');
  if(!data || data.coins===undefined){ showMessage('❌ Invalid key!'); currentKey=null; coins=0; owned=[]; renderSkins(); return; }
  currentKey = key; coins = data.coins||0; owned = data.owned||[];
  showMessage('✅ Key loaded successfully!');
  renderSkins();
}

function buySkin(id,price){
  if(!currentKey) return showMessage('Enter your key first');
  if(owned.includes(id)) return showMessage('You already own this skin');
  if(coins<price) return showMessage('Not enough coins');
  coins-=price; owned.push(id); saveData(); showMessage('Skin purchased!'); renderSkins();
}

// =======================
// Event bar & Modal
// =======================
let currentEventIndex = 0;

function getPublishedEvents(){ return JSON.parse(localStorage.getItem('eventDataPublished')||'[]'); }

function renderEventBar(){
  const bar = document.getElementById('eventBar');
  bar.innerHTML='';
  const now = Date.now();
  getPublishedEvents().forEach((event,index)=>{
    const div = document.createElement('div'); div.className='eventItem';
    let imgSrc = event.comingImage, countdownText='';
    if(now>=event.startTime && now<=event.endTime){ imgSrc=event.image; }
    else if(now<event.startTime){ 
      const diff = Math.max(event.startTime-now,0);
      const mins = Math.floor(diff/60000), secs=Math.floor((diff%60000)/1000);
      countdownText=`${mins}m ${secs}s`;
    } else { return; }

    div.innerHTML=`<img src="${imgSrc}"><div class="eventCountdown">${countdownText}</div>`;
    div.onclick=()=>openModal(index);
    bar.appendChild(div);
  });
}

function openModal(index){
  const event = getPublishedEvents()[index];
  currentEventIndex = index;
  document.getElementById('modalName').textContent=event.name;
  document.getElementById('modalDesc').textContent=event.desc;
  document.getElementById('modalImage').src = event.image;
  updateTimer();
  document.getElementById('eventModal').style.display='block';
}

function closeModal(){ document.getElementById('eventModal').style.display='none'; }

function updateTimer(){
  const timerDiv = document.getElementById('modalTimer');
  const events = getPublishedEvents();
  const ev = events[currentEventIndex];
  if(!ev) return;
  const now = Date.now();
  let diff = ev.endTime - now;
  if(diff <= 0){ timerDiv.textContent = "Offer Ended"; return; }
  const d = Math.floor(diff/(24*3600*1000));
  diff%=24*3600*1000;
  const h = Math.floor(diff/(3600*1000));
  diff%=3600*1000;
  const m = Math.floor(diff/(60*1000));
  const s = Math.floor((diff%60000)/1000);
  timerDiv.textContent = `Offer Ends: ${d}d ${h}h ${m}m ${s}s`;
}

// update countdown elke seconde
setInterval(()=>{
  renderEventBar();
  if(document.getElementById('eventModal').style.display==='block'){ updateTimer(); }
},1000);

// Swipe functionaliteit
let startX = 0;
document.getElementById('eventModal').addEventListener('touchstart', e=>{
  startX = e.changedTouches[0].screenX;
});
document.getElementById('eventModal').addEventListener('touchend', e=>{
  let endX = e.changedTouches[0].screenX;
  if(endX - startX > 50) showPrevEvent();
  else if(startX - endX > 50) showNextEvent();
});

// Keyboard support
document.addEventListener('keydown', e=>{
  if(document.getElementById('eventModal').style.display==='block'){
    if(e.key==='ArrowLeft') showPrevEvent();
    if(e.key==='ArrowRight') showNextEvent();
  }
});

function showPrevEvent(){
  let evs = getPublishedEvents();
  if(currentEventIndex > 0){ openModal(currentEventIndex-1); }
  else { openModal(evs.length-1); }
}
function showNextEvent(){
  let evs = getPublishedEvents();
  if(currentEventIndex < evs.length-1){ openModal(currentEventIndex+1); }
  else { openModal(0); }
}

// initial render
renderSkins();
renderEventBar();
</script>

</body>
</html>
