<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agar.io Shop</title>
<style>
    body { font-family: Arial; background:#111; color:#fff; margin:0; padding:20px; }
    h1 { text-align:center; }
    .uid-box { margin:20px auto; text-align:center; }
    input { padding:10px; width:320px; border-radius:5px; border:none; }
    #offers { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin-top:30px; }
    .offer {
        background:#1e1e1e;
        border:1px solid #333;
        border-radius:10px;
        width:260px;
        padding:15px;
        text-align:center;
        transition:0.2s;
    }
    .offer:hover { transform:scale(1.05); border-color:#0f0; }
    .offer img { width:120px; height:120px; object-fit:contain; margin-bottom:10px; }
    .buy-button {
        margin-top:10px;
        padding:10px;
        width:100%;
        background:#28a745;
        border:none;
        border-radius:5px;
        font-size:16px;
        cursor:pointer;
        color:#fff;
    }
    .buy-button:hover { background:#34d058; }
</style>
</head>
<body>

<h1>Agar.io Store</h1>

<div class="uid-box">
    <label>Your UID:<br>
    <input type="text" id="uidInput" placeholder="Enter your Agar.io UID">
    </label>
</div>

<div id="offers">Loading offers…</div>

<script>
// LIVE AGARIO CONFIG
const CONFIG_URL = "https://configs-web.agario.miniclippt.com/live/v15/10850/GameConfiguration.json";

// Fallback Xsolla Paystation
const XSOLLA_BASE = "https://secure.xsolla.com/paystation3/?purchase=";

async function loadConfig() {
    try {
        const res = await fetch(CONFIG_URL);
        const json = await res.json();

        console.log("Loaded config:", json);
        renderOffers(json);
    } catch (err) {
        document.getElementById("offers").innerHTML = "Failed to load configuration.";
    }
}

function renderOffers(config) {
    const container = document.getElementById("offers");
    container.innerHTML = "";

    const allOffers = [];

    // HARD CURRENCY / COINS
    if (config?.Shop?.SoftCurrencies) {
        Object.values(config.Shop.SoftCurrencies).forEach(item => {
            allOffers.push({
                id: item.ProductId,
                name: item.Title || "Coins Pack",
                icon: item.ImageUrl,
                price: item.Price?.PriceAmount || 0
            });
        });
    }

    // HARD CURRENCY / DNA
    if (config?.Shop?.HardCurrencies) {
        Object.values(config.Shop.HardCurrencies).forEach(item => {
            allOffers.push({
                id: item.ProductId,
                name: item.Title || "DNA Pack",
                icon: item.ImageUrl,
                price: item.Price?.PriceAmount || 0
            });
        });
    }

    // SKINS
    if (config?.Shop?.SkinsSale) {
        config.Shop.SkinsSale.forEach(item => {
            allOffers.push({
                id: item.ProductId,
                name: item.Title || "Skin",
                icon: item.ImageUrl,
                price: item.Price?.PriceAmount || 0
            });
        });
    }

    // BOOSTS / OFFERS
    if (config?.Shop?.Boosts) {
        config.Shop.Boosts.forEach(item => {
            allOffers.push({
                id: item.ProductId,
                name: item.Title || "Boost",
                icon: item.ImageUrl,
                price: item.Price?.PriceAmount || 0
            });
        });
    }

    // RENDER ALL
    allOffers.forEach(o => {
        const div = document.createElement("div");
        div.className = "offer";

        div.innerHTML = `
            <img src="${o.icon}" alt="">
            <h3>${o.name}</h3>
            <p><b>${o.price}$</b></p>
            <button class="buy-button" onclick="buy('${o.id}')">Buy</button>
        `;

        container.appendChild(div);
    });
}

function buy(productId) {
    const uid = document.getElementById("uidInput").value.trim();

    if (!uid) {
        alert("Enter your UID first!");
        return;
    }

    const url = `${XSOLLA_BASE}${productId}&uid=${encodeURIComponent(uid)}`;

    window.open(url, "_blank");
}

loadConfig();
</script>

</body>
</html>
