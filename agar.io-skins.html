<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
.top-bar { display:flex; justify-content: space-between; margin-bottom: 20px; }
input, button { padding:6px; margin:3px; border-radius:4px; border:none; }
button { cursor:pointer; }
.skins { display:flex; flex-wrap: wrap; gap:10px; }
.skin { background:#333; padding:10px; border-radius:8px; width:150px; text-align:center; cursor:pointer; transition: transform 0.1s, filter 0.1s; position:relative;}
.skin:hover { filter: brightness(1.2); }
.skin:active { transform: scale(0.97); }
.lock { position:absolute; top:5px; left:5px; font-size:14px; background:rgba(0,0,0,0.6); padding:2px 5px; border-radius:4px; }
.grayed { filter: grayscale(100%); }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div class="top-bar">
  <div>Contact T.B to buy more coins!</div>
  <div>
    <div style="font-size:12px;color:#aaa;">Your coins</div>
    <div id="coins">0</div>
  </div>
</div>

<div id="message" style="color:yellow;"></div>

<h3>Create / Load Key</h3>
<div id="keySection">
  <input id="nameInput" placeholder="Enter your name">
  <button onclick="createKey()">Create Key</button>
</div>

<div id="keyLoadSection" style="display:none;">
  <input id="keyInput" placeholder="Enter your key">
  <button onclick="loadKey()">Load Key</button>
</div>

<h3>Skins</h3>
<div class="skins" id="skinsGrid"></div>

<script>
const skins = [
  {id:'skin1', name:'Stealth Ops', price:100},
  {id:'skin2', name:'Crimson Viper', price:250},
  {id:'skin3', name:'Glacier', price:500},
  {id:'skin4', name:'Midnight', price:750},
  {id:'skin5', name:'Solar Flare', price:1200},
];

let currentKey = null;
let coins = 0;
let owned = [];
let userName = '';

function showMessage(msg){ document.getElementById('message').textContent = msg; }

function saveData(){
  if(!currentKey) return;
  localStorage.setItem('skinshop_'+currentKey, JSON.stringify({coins, owned, name:userName}));
}

function renderSkins(){
  const grid = document.getElementById('skinsGrid');
  grid.innerHTML='';
  skins.forEach(skin=>{
    const isOwned = owned.includes(skin.id);
    const div = document.createElement('div');
    div.className='skin '+(isOwned?'':'grayed');
    div.innerHTML=`
      <div class="lock">${isOwned?'✓':'🔒'}</div>
      <div style="margin-top:20px;">${skin.name}</div>
      <div>Price: ${skin.price} 💠</div>
      <button onclick="buySkin('${skin.id}',${skin.price})">Buy</button>
    `;
    grid.appendChild(div);
  });
  document.getElementById('coins').textContent=coins;
}

function createKey(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name) return showMessage('Enter your name');
  // check if name already has a key
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('skinshop_')){
      const data = JSON.parse(localStorage.getItem(k));
      if(data.name === name) return showMessage('You already have a key');
    }
  }
  const key = Math.random().toString(36).substring(2,10);
  currentKey = key;
  coins=0;
  owned=[];
  userName=name;
  localStorage.setItem('skinshop_'+key, JSON.stringify({coins, owned, name}));
  showMessage('Your key: '+key);
  document.getElementById('keySection').style.display='none';
  document.getElementById('keyLoadSection').style.display='block';
  document.getElementById('keyInput').value=key;
  renderSkins();
}

function loadKey(){
  const key = document.getElementById('keyInput').value.trim();
  if(!key) return showMessage('Enter your key');
  const data = JSON.parse(localStorage.getItem('skinshop_'+key) || '{}');
  if(!data.name) return showMessage('Invalid key');
  currentKey = key;
  coins = data.coins;
  owned = data.owned;
  userName = data.name;
  showMessage('Key loaded for '+userName);
  renderSkins();
}

function buySkin(id,price){
  if(!currentKey) return showMessage('Enter your key first');
  if(owned.includes(id)) return showMessage('You already own this skin');
  if(coins<price) return showMessage('Not enough coins');
  coins-=price;
  owned.push(id);
  saveData();
  showMessage('Skin purchased!');
  renderSkins();
}

renderSkins();
</script>
</body>
</html>
