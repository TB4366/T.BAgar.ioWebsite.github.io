<!DOCTYPE html><html><head><meta charset='utf-8'><title>Shop</title>
<style>
body{font-family:Arial;margin:0;background:#1b2230;color:#fff}header{background:#273246;padding:16px;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;padding:20px}
.card{background:#2a3448;padding:10px;border-radius:10px;text-align:center}.skin img{width:110px;height:110px;border-radius:50%}
button{margin:4px;padding:8px 10px}.modal{display:none;position:fixed;inset:0;background:#0008}.box{background:#2a3448;width:360px;margin:8% auto;padding:18px;border-radius:12px;position:relative}.close{position:absolute;right:12px;top:8px;cursor:pointer}
hr{border-color:#556}
</style></head><body><header>Agar.io Skins & Deals</header><div id='grid' class='grid'></div>
<div id='m' class='modal'><div class='box'><div class='close' onclick='m.style.display="none"'>&times;</div><h2 id='n'></h2><hr><p id='d'></p><p><b id='c'></b><br><b id='dna'></b></p><hr><p>For questions or assistance, please contact our support team!</p><a id='mail'><button>Send Email</button></a></div></div>
<script>
const support="support@example.com";
const skins=[
{name:"Zen Shaman",image:"IMG_9638.webp",coins:"1250 Coins",dna:"75 DNA",description:"A mysterious warrior blessed with ancient powers."}
// Kopieer dit blok voor nieuwe skins:
// ,{name:"Nieuwe Skin",image:"IMG_9999.webp",coins:"1000 Coins",dna:"50 DNA",description:"Beschrijving"}
];
grid.innerHTML="";
skins.forEach(s=>{
let e=document.createElement("div");
e.className="card";
e.innerHTML=`<div class=skin><img src="${s.image}"></div><h3>${s.name}</h3><button>BUY</button><button>VIEW PRODUCT</button>`;
e.querySelectorAll("button")[1].onclick=()=>{
n.textContent=s.name;d.textContent=s.description;c.textContent=s.coins;dna.textContent=s.dna;
mail.href="mailto:"+support;m.style.display="block";}
grid.appendChild(e);
});
</script></body></html>
