<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; text-align:center; margin-bottom:140px;}
h1 { color:#0af; font-size:28px; margin-bottom:10px; }
.top-bar { display:flex; justify-content: space-between; margin-bottom: 20px; }
input, button { padding:10px; margin:5px; border-radius:50px; border:none; font-size:16px; }
button { cursor:pointer; }
.skins { display:flex; flex-wrap: wrap; gap:25px; justify-content:center; margin-top:20px; }
.skinContainer { display:flex; flex-direction:column; align-items:center; }
.skin { width:150px; height:150px; border-radius:50%; background:#333; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; transition: transform 0.1s, filter 0.1s;}
.skin img { width:100%; height:100%; object-fit:cover; border-radius:50%; transition: filter 0.2s, opacity 0.2s; }
.skin:hover { filter: brightness(1.2); }
.lock { position:absolute; top:5px; left:5px; font-size:18px; background:rgba(0,0,0,0.6); padding:3px 6px; border-radius:50%; }
.grayed img { filter: grayscale(100%); opacity:0.5; pointer-events:none; }
.skinName, .skinPrice { margin-top:5px; font-size:14px; }
#keyInput { width:300px; font-size:18px; text-align:center; }
#message { font-size:18px; margin-top:10px; color:yellow; }
#purchasedTitle { margin-top:30px; font-size:20px; text-decoration:underline; }
#purchasedSkins { display:flex; flex-wrap: wrap; justify-content:center; gap:20px; margin-top:10px;}
#purchasedSkins img { width:100px; height:100px; border-radius:50%; border:2px solid #0af; }

/* Multi-event bar */
#eventBarContainer {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 800px;
  height: 60px;
  overflow-x: auto;
  display: flex;
  gap:10px;
  z-index:1000;
  padding:5px;
}
.eventItem {
  min-width: 200px;
  background: #222;
  border: 2px solid #0af;
  border-radius: 20px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 5px 10px;
  cursor: pointer;
  flex-shrink: 0;
}

/* Popup */
#eventPopup {
  display: none;
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 500px;
  max-height: 70%;
  background: #111;
  border: 2px solid #0af;
  border-radius: 20px;
  padding: 20px;
  overflow-y: auto;
  z-index:1001;
}
#eventPopup h2 { color:#0af; }
#closePopup { background:#0af; color:#111; margin-top:10px; padding:5px 10px; border:none; border-radius:10px; cursor:pointer;}
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div class="top-bar">
  <div>Contact Admin to buy more coins!</div>
  <div>
    <div style="font-size:12px;color:#aaa;">Your Coins</div>
    <div id="coins">0</div>
  </div>
</div>

<div id="message">Enter your key below to load your coins and skins:</div>

<input id="keyInput" placeholder="Enter your key here">
<button onclick="loadKey()">Load Key</button>

<h3>Available Skins</h3>
<div class="skins" id="skinsGrid"></div>

<div id="purchasedSection">
  <div id="purchasedTitle">With these skins you have purchased:</div>
  <div id="purchasedSkins"></div>
</div>

<!-- Multi-event bar -->
<div id="eventBarContainer"></div>

<!-- Popup -->
<div id="eventPopup">
  <h2 id="popupTitle"></h2>
  <p id="popupDesc"></p>
  <button id="closePopup" onclick="togglePopup()">Close</button>
</div>

<script>
// ===== Skins code =====
function getPublishedSkins(){ return JSON.parse(localStorage.getItem("skinsDataPublished") || "[]"); }

let currentKey = null;
let coins = 0;
let owned = [];

function showMessage(msg){ document.getElementById('message').textContent=msg; }

function saveData(){
  if(!currentKey) return;
  localStorage.setItem('skinshop_'+currentKey, JSON.stringify({coins, owned}));
}

function renderSkins(){
  const skins = getPublishedSkins();
  const grid = document.getElementById('skinsGrid');
  grid.innerHTML='';
  const purchasedContainer = document.getElementById('purchasedSkins');
  purchasedContainer.innerHTML='';

  if(skins.length === 0){
    grid.innerHTML = "<p>No skins available. Contact the admin.</p>";
  }

  skins.forEach(skin=>{
    const isOwned = owned.includes(skin.id);
    const container = document.createElement('div');
    container.className='skinContainer';
    
    const div = document.createElement('div');
    div.className='skin '+(isOwned?'':'grayed');
    div.innerHTML=`<img src="${skin.image}" alt="${skin.name}">`;
    
    if(!isOwned){
      const lock = document.createElement('div');
      lock.className='lock';
      lock.textContent='🔒';
      div.appendChild(lock);
      div.onclick = ()=>buySkin(skin.id, skin.price);
    } else {
      const lock = document.createElement('div');
      lock.className='lock';
      lock.textContent='✓';
      div.appendChild(lock);
    }
    
    container.appendChild(div);
    const nameDiv = document.createElement('div');
    nameDiv.className='skinName';
    nameDiv.textContent=skin.name;
    container.appendChild(nameDiv);

    const priceDiv = document.createElement('div');
    priceDiv.className='skinPrice';
    priceDiv.textContent='Price: '+skin.price+' 💠';
    container.appendChild(priceDiv);

    grid.appendChild(container);

    if(isOwned){
      const pImg = document.createElement('img');
      pImg.src = skin.image;
      pImg.alt = skin.name;
      purchasedContainer.appendChild(pImg);
    }
  });
  document.getElementById('coins').textContent=coins;
}

function loadKey(){
  const key = document.getElementById('keyInput').value.trim();
  if(!key) return showMessage('Please enter your key');
  const data = JSON.parse(localStorage.getItem('skinshop_'+key)||'{}');
  if(!data || data.coins===undefined){
    showMessage('❌ Invalid key! Please check your key with the admin.');
    currentKey = null;
    coins = 0;
    owned = [];
    renderSkins();
    return;
  }
  currentKey = key;
  coins = data.coins||0;
  owned = data.owned||[];
  showMessage('✅ Key loaded successfully!');
  renderSkins();
}

function buySkin(id,price){
  if(!currentKey) return showMessage('Enter your key first');
  if(owned.includes(id)) return showMessage('You already own this skin');
  if(coins<price) return showMessage('Not enough coins');
  coins-=price;
  owned.push(id);
  saveData();
  showMessage('Skin purchased!');
  renderSkins();
}

renderSkins();

// ===== Multi-event systeem =====
let events = JSON.parse(localStorage.getItem('eventDataPublished')||'[]');

function renderEventBar(){
  const container = document.getElementById('eventBarContainer');
  container.innerHTML='';
  const now = Date.now();
  events.forEach((event,index)=>{
    const div = document.createElement('div');
    div.className='eventItem';
    div.dataset.index=index;
    div.onclick = ()=>openEventPopup(index);

    let timerText = '';
    let imgUrl = '';

    if(now < event.startTime){
      // Event komt nog
      const dist = event.startTime - now;
      let m = Math.floor(dist/60000);
      let s = Math.floor((dist%60000)/1000);
      timerText = `${m}m ${s}s until start`;
      imgUrl = event.comingImage;
    } else if(now >= event.startTime && now <= event.endTime){
      // Event is actief
      const dist = event.endTime - now;
      let h = Math.floor(dist/(1000*60*60));
      let m = Math.floor((dist%(1000*60*60))/(1000*60));
      let s = Math.floor((dist%(1000*60))/1000);
      timerText = `${h}h ${m}m ${s}s`;
      imgUrl = event.image;
    } else {
      // Event voorbij
      return;
    }

    div.innerHTML = `<span>${event.name}</span> ⏳ <span>${timerText}</span>`;
    if(imgUrl) {
      const img = document.createElement('img');
      img.src = imgUrl;
      img.style.height = '40px';
      img.style.borderRadius = '10px';
      img.style.marginLeft = '5px';
      div.appendChild(img);
    }

    container.appendChild(div);
  });
}

function updateEventTimers(){
  const now = Date.now();
  const container = document.getElementById('eventBarContainer');
  container.querySelectorAll('.eventItem').forEach(div=>{
    const index = div.dataset.index;
    const event = events[index];
    if(!event) return;
    const span = div.querySelector('span:nth-child(2)');
    if(now < event.startTime){
      const dist = event.startTime - now;
      let m = Math.floor(dist/60000);
      let s = Math.floor((dist%60000)/1000);
      span.textContent = `${m}m ${s}s until start`;
    } else if(now >= event.startTime && now <= event.endTime){
      const dist = event.endTime - now;
      let h = Math.floor(dist/(1000*60*60));
      let m = Math.floor((dist%(1000*60*60))/(1000*60));
      let s = Math.floor((dist%(1000*60))/1000);
      span.textContent = `${h}h ${m}m ${s}s`;
    }
  });
}

function openEventPopup(index){
  const event = events[index];
  if(!event) return;
  document.getElementById("popupTitle").textContent = event.name;
  document.getElementById("popupDesc").textContent = event.desc;
  document.getElementById("eventPopup").style.display='block';
}

function togglePopup(){
  const popup = document.getElementById("eventPopup");
  popup.style.display = popup.style.display==="block" ? "none" : "block";
}

renderEventBar();
setInterval(()=>{
  events = JSON.parse(localStorage.getItem('eventDataPublished')||'[]');
  renderEventBar();
  updateEventTimers();
},1000);
</script>

</body>
</html>
