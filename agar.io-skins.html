<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agar.io All Skins</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
}

#skins{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.skin{
    width:120px;
    text-align:center;
}

.skin img{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#222;
}
</style>
</head>

<body>

<h2>Agar.io Skins Gallery</h2>

<div id="skins"></div>

<script>

const configURL =
"https://configs-web.agario.miniclippt.com/live/v15/10890/GameConfiguration.json";

// CDN waar skins staan
const skinBase =
"https://configs-web.agario.miniclippt.com/live/v15/10890/";

// laad config
fetch(configURL)
.then(r => r.json())
.then(data => {

    console.log(data);

    const container = document.getElementById("skins");

    // probeer skins uit config te halen
    const skins = data.skins || data.shopSkins || [];

    skins.forEach(skin => {

        const div = document.createElement("div");
        div.className = "skin";

        const img = document.createElement("img");

        // naam van de skin
        const name = skin.name || skin.id;

        img.src = skinBase + name + "_hi.png";

        const label = document.createElement("div");
        label.textContent = name;

        div.appendChild(img);
        div.appendChild(label);

        container.appendChild(div);

    });

});

</script>

</body>
</html>
