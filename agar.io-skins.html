<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color:#0af; }
.skin { border:1px solid #555; padding:10px; margin:5px; display:inline-block; width:150px; text-align:center; }
.eventBar { display:flex; gap:10px; margin:20px 0; }
.eventCircle { width:100px; height:100px; border-radius:50%; overflow:hidden; border:2px solid #0af; display:flex; justify-content:center; align-items:center; cursor:pointer; position:relative; }
.eventCircle img { width:100%; height:100%; object-fit:cover; }
.countdown { font-size:12px; color:#ff0; position:absolute; bottom:-18px; width:100%; text-align:center; }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div>
  <label>Enter Key:</label>
  <input id="userKey" placeholder="Enter your key">
  <button onclick="loadUser()">Load</button>
</div>

<h2>Available Skins</h2>
<div id="skinsContainer"></div>

<h2>Events</h2>
<div class="eventBar" id="eventBar"></div>

<!-- Deal Modal -->
<div id="dealModal" style="display:none; position:fixed; top:10%; left:20%; background:#222; border:2px solid #0af; padding:20px; width:300px;">
  <h2 id="dealModalTitle"></h2>
  <img id="dealModalImage" src="" style="max-width:100%;">
  <p id="dealModalDesc"></p>
  <div id="dealCountdown"></div>
  <button id="buyDealBtn">Buy</button>
  <button onclick="closeDealModal()">Close</button>
</div>

<script>
let currentKey=null;
let userData=null;
let purchasedDeals=[];
let currentEventDeals=[];
let currentDealIndex=0;
let dealCountdownInterval=null;

// =======================
// Load User
// =======================
function loadUser(){
  const key=document.getElementById('userKey').value.trim();
  if(!key){ alert("No key entered! You can still view skins but can't buy."); currentKey=null; userData=null; renderSkins(); return; }
  const data=localStorage.getItem('skinshop_'+key);
  if(!data){ alert("Invalid key!"); return; }
  currentKey=key; userData=JSON.parse(data);
  purchasedDeals=userData.purchasedDeals||[];
  renderSkins();
}

// =======================
// Render Skins
// =======================
function renderSkins(){
  const container=document.getElementById('skinsContainer');
  container.innerHTML='';
  const skins=JSON.parse(localStorage.getItem('skinsDataPublished')||'[]');
  skins.forEach(skin=>{
    const div=document.createElement('div');
    div.className='skin';
    div.innerHTML=`<img src="${skin.image}" style="max-width:100px;"><br>${skin.name}<br>Price: ${skin.price}<br>`;
    const btn=document.createElement('button');
    btn.textContent='Buy';
    btn.onclick=()=>buySkin(skin);
    div.appendChild(btn);
    container.appendChild(div);
  });
}

// =======================
// Buy Skin
// =======================
function buySkin(skin){
  if(!currentKey){ alert("❌ You must enter a key to buy!"); return; }
  if(!userData) return;
  if(userData.coins < skin.price){ alert("Not enough coins!"); return; }
  userData.coins -= skin.price;
  userData.owned.push(skin.id);
  localStorage.setItem('skinshop_'+currentKey, JSON.stringify(userData));
  alert("✅ Purchased "+skin.name);
}

// =======================
// Events & Deals
// =======================
function loadEvents(){
  const events=JSON.parse(localStorage.getItem('eventDataPublished')||'[]');
  const deals=JSON.parse(localStorage.getItem('dealDataPublished')||'[]');
  const bar=document.getElementById('eventBar');
  bar.innerHTML='';
  events.forEach(event=>{
    const circle=document.createElement('div');
    circle.className='eventCircle';
    let now=Date.now();

    if(event.status==='coming' || now<event.startTime){
      // Coming soon mode
      const img=document.createElement('img');
      img.src=event.comingImage||event.image||'';
      circle.appendChild(img);

      const cd=document.createElement('div');
      cd.className='countdown';
      circle.appendChild(cd);

      updateCountdown(cd,event.startTime,()=>{
        event.status='active';
        saveEventStatus(event.id,'active');
        loadEvents(); // rerender
      });
    } else if(event.status==='active' && now>=event.startTime && now<event.endTime){
      // Active mode
      const img=document.createElement('img');
      img.src=event.barImage||event.image||'';
      circle.appendChild(img);
      circle.onclick=()=>openDealsForEvent(event,deals);
    }

    bar.appendChild(circle);
  });
}

function updateCountdown(el,targetTime,onEnd){
  function tick(){
    let now=Date.now();
    let diff=targetTime-now;
    if(diff<=0){ clearInterval(interval); el.textContent="Now Active!"; if(onEnd) onEnd(); return; }
    let d=Math.floor(diff/86400000);
    let h=Math.floor((diff%86400000)/3600000);
    let m=Math.floor((diff%3600000)/60000);
    let s=Math.floor((diff%60000)/1000);
    el.textContent=`${d}d ${h}h ${m}m ${s}s`;
  }
  tick();
  let interval=setInterval(tick,1000);
}

function saveEventStatus(eventId,status){
  let events=JSON.parse(localStorage.getItem('eventDataPublished')||'[]');
  events=events.map(ev=>ev.id===eventId?{...ev,status:status}:ev);
  localStorage.setItem('eventDataPublished',JSON.stringify(events));
}

function openDealsForEvent(event,deals){
  currentEventDeals=deals.filter(d=>d.eventId===event.id && d.status==='active');
  if(currentEventDeals.length===0){ alert('No active deals for this event'); return; }
  currentDealIndex=0;
  showDeal(currentEventDeals[currentDealIndex]);
}

function showDeal(deal){
  document.getElementById('dealModalTitle').textContent=deal.name;
  document.getElementById('dealModalImage').src=deal.image;
  document.getElementById('dealModalDesc').textContent=deal.desc||'';
  document.getElementById('dealModal').style.display='block';
  updateDealCountdown(deal);
  const buyBtn=document.getElementById('buyDealBtn');
  buyBtn.onclick=()=>buyDeal(deal);
}

function closeDealModal(){
  document.getElementById('dealModal').style.display='none';
  clearInterval(dealCountdownInterval);
}

function updateDealCountdown(deal){
  clearInterval(dealCountdownInterval);
  dealCountdownInterval=setInterval(()=>{
    const now=Date.now();
    let remaining=deal.endTime-now;
    if(remaining<0) remaining=0;
    const d=Math.floor(remaining/86400000);
    const h=Math.floor((remaining%86400000)/3600000);
    const m=Math.floor((remaining%3600000)/60000);
    const s=Math.floor((remaining%60000)/1000);
    document.getElementById('dealCountdown').textContent=`Ends in: ${d}d ${h}h ${m}m ${s}s`;
  },1000);
}

function buyDeal(deal){
  if(!currentKey){ alert("❌ You must enter a key to buy deals!"); return; }
  if(purchasedDeals.includes(deal.id)){ alert("Already purchased this deal"); return; }
  purchasedDeals.push(deal.id);
  userData.purchasedDeals=purchasedDeals;
  localStorage.setItem('skinshop_'+currentKey, JSON.stringify(userData));
  alert("✅ Deal purchased!");
}

// =======================
// Init
// =======================
renderSkins();
loadEvents();
</script>

</body>
</html>
