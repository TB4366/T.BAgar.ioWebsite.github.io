<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Skin Shop</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
h1 { color: #0af; }
.top-bar { display:flex; justify-content: space-between; margin-bottom: 20px; }
input, button { padding:6px; margin:3px; border-radius:4px; border:none; }
button { cursor:pointer; }
.skins { display:flex; flex-wrap: wrap; gap:10px; }
.skin { background:#333; padding:10px; border-radius:8px; width:150px; text-align:center; cursor:pointer; transition: transform 0.1s, filter 0.1s; }
.skin:hover { filter: brightness(1.2); }
.skin:active { transform: scale(0.97); }
.lock { position:absolute; top:5px; left:5px; font-size:14px; background:rgba(0,0,0,0.6); padding:2px 5px; border-radius:4px; }
</style>
</head>
<body>

<h1>Skin Shop</h1>

<div class="top-bar">
  <div>Contact T.B to buy more coins!</div>
  <div>
    <div style="font-size:12px;color:#aaa;">Your coins</div>
    <div id="coins">0</div>
  </div>
</div>

<div id="message" style="color:yellow;"></div>

<h3>Key aanmaken / laden</h3>
<input id="ownerInput" placeholder="Jouw email of naam">
<button onclick="createKey()">Maak key</button>
<br>
<input id="keyInput" placeholder="Of voer bestaande key in">
<button onclick="loadKey()">Load Key</button>

<h3>Skins</h3>
<div class="skins" id="skinsGrid"></div>

<script>
// ----- Data -----
const skins = [
  {id:'skin1', name:'Stealth Ops', price:100},
  {id:'skin2', name:'Crimson Viper', price:250},
  {id:'skin3', name:'Glacier', price:500},
  {id:'skin4', name:'Midnight', price:750},
  {id:'skin5', name:'Solar Flare', price:1200},
];

let currentKey = null;
let coins = 0;
let owned = [];

// ----- Helpers -----
function showMessage(msg) {
  document.getElementById('message').textContent = msg;
}
function saveData() {
  if (!currentKey) return;
  localStorage.setItem('skinshop_'+currentKey, JSON.stringify({coins, owned}));
}
function renderSkins() {
  const grid = document.getElementById('skinsGrid');
  grid.innerHTML = '';
  skins.forEach(skin => {
    const isOwned = owned.includes(skin.id);
    const div = document.createElement('div');
    div.className = 'skin';
    div.innerHTML = `
      <div style="position:relative;">
        <div class="lock">${isOwned?'✓':'🔒'}</div>
        <div style="margin-top:20px;">${skin.name}</div>
        <div>Prijs: ${skin.price} 💠</div>
        <button onclick="buySkin('${skin.id}',${skin.price})">Koop</button>
      </div>
    `;
    grid.appendChild(div);
  });
  document.getElementById('coins').textContent = coins;
}

// ----- Key maken -----
function createKey() {
  const owner = document.getElementById('ownerInput').value.trim();
  if (!owner) return showMessage('Vul je naam of email in.');
  // check of er al een key is
  for (let i=0;i<localStorage.length;i++) {
    const key = localStorage.key(i);
    if (key.startsWith('skinshop_')) {
      const data = JSON.parse(localStorage.getItem(key));
      if (data.owner === owner) return showMessage('Je hebt al een key!');
    }
  }
  // maak nieuwe key
  const key = Math.random().toString(36).substring(2,10);
  currentKey = key;
  coins = 0;
  owned = [];
  localStorage.setItem('skinshop_'+key, JSON.stringify({coins, owned, owner}));
  document.getElementById('keyInput').value = key;
  showMessage('Jouw nieuwe key: '+key);
  renderSkins();
}

// ----- Key laden -----
function loadKey() {
  const key = document.getElementById('keyInput').value.trim();
  if (!key) return showMessage('Voer je key in.');
  const data = JSON.parse(localStorage.getItem('skinshop_'+key) || '{}');
  if (!data || data.owner===undefined) return showMessage('Ongeldige key!');
  currentKey = key;
  coins = data.coins;
  owned = data.owned;
  showMessage('Key geladen!');
  renderSkins();
}

// ----- Skin kopen -----
function buySkin(id,price) {
  if (!currentKey) return showMessage('Load je key eerst!');
  if (owned.includes(id)) return showMessage('Skin al gekocht!');
  if (coins<price) return showMessage('Niet genoeg coins!');
  coins -= price;
  owned.push(id);
  saveData();
  showMessage('Skin gekocht!');
  renderSkins();
}

// ----- Init -----
renderSkins();
</script>

</body>
</html>
