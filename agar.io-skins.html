<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agar.io Skin - The Legend Mod Project</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;text-align:center;font-weight:bold}
h1{font-size:28px;margin:18px 0}
#version{font-size:20px;margin:8px 0 18px;padding:4px}
#skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:15px;max-width:1200px;margin:auto}
.skin{cursor:pointer;padding:6px;background:#111;border:2px solid #222;border-radius:8px}
.skin:hover,.selected{border-color:#0f0}
.skin img{width:90px;height:90px;border-radius:50%;object-fit:contain}
.skin span{display:block;margin-top:4px;font-size:13px}
</style>
</head>
<body>

<h1>Agar.io SKIN ROTATOR<br>The Legend Mod Project</h1>

<select id="version"></select>
<div id="skins">Loading skins...</div>

<script>
const API="https://configs-web.agario.miniclippt.com/live/";
let version="v15/3032";

async function versions(){
  const s=document.getElementById("version");
  try{
    const r=await fetch("https://lmsettings.snez.org/",{
      headers:{username:"LMConfigVersion",password:"LMConfigVersionPass"}
    });
    const v=await r.json();
    Object.values(v).forEach(x=>{
      const o=new Option(x,x.replace(/\/$/,""));
      s.add(o);
    });
    if(s.options.length)version=s.value=s.options[s.options.length-1].value;
  }catch(e){
    s.add(new Option(version,version));
  }
  loadSkins();
}

async function loadSkins(){
  const box=document.getElementById("skins");
  box.innerHTML="Loading skins...";
  try{
    const r=await fetch(API+version+"/GameConfiguration.json");
    const text=await r.text();
    const a=text.match(/\[(.*?)\]/g)||[];
    const str=a[25]||"";
    const ids=str.match(/productId":"(.*?)"/g)||str.match(/productId": "(.*?)"/g)||[];
    const imgs=str.match(/image":"(.*?)"/g)||str.match(/image": "(.*?)"/g)||[];
    const skins=[];
    for(let i=0;i<Math.min(ids.length,imgs.length);i++){
      const id=ids[i].replace(/"/g,"").replace(/productId:/,"").replace(/skin_/,"").replace(/id:/,"").replace(" ","");
      const img=imgs[i].replace(/"/g,"").replace(/image:/,"").replace(" ","");
      if(!img.includes("uses_spine"))skins.push([id,img]);
    }
    box.innerHTML="";
    skins.forEach(([id,img])=>{
      const d=document.createElement("div");
      d.className="skin";
      d.innerHTML=`<img src="${API+version+"/"+img}"><span>${id.replace(/_/g," ")}</span>`;
      box.appendChild(d);
    });
  }catch(e){box.textContent="Unable to load skins."}
}

document.getElementById("version").onchange=e=>{
  version=e.target.value;
  loadSkins();
};
versions();
</script>
</body>
</html>
