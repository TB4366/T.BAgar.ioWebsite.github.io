/* =========================
   SECTIONS
========================= */

/* =========================

========================= */

========================= */

    "https://configs-web.agario.miniclippt.com/live/";

let youtuberSkins = [];

let currentAgarioPage = 1;
let currentYoutuberPage = 1;


/* =====================================================
   SECTION SWITCHING
===================================================== */

function showSection(section){

    const agario =
        document.getElementById("agarioSection");

    const youtuber =
        document.getElementById("youtuberSection");

    const agarioBtn =
        document.getElementById("agarioSectionBtn");

    const youtuberBtn =
        document.getElementById("youtuberSectionBtn");


    if(section === "agario"){

        agario.classList.remove("hidden");
        youtuber.classList.add("hidden");

        agarioBtn.classList.add("active");
        youtuberBtn.classList.remove("active");

    }else{

        agario.classList.add("hidden");
        youtuber.classList.remove("hidden");

        agarioBtn.classList.remove("active");
        youtuberBtn.classList.add("active");

        if(youtuberSkins.length === 0){

            loadYoutuberSkins();

        }

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   VERSIONS
===================================================== */

async function versions(){

    const s =
        document.getElementById("version");

    try{

        const r =
            await fetch(
                "https://lmsettings.snez.org/",
                {
                    headers:{
                        username:"LMConfigVersion",
                        password:"LMConfigVersionPass"
                    }
                }
            );

        const v =
            await r.json();

        Object.values(v).forEach(x=>{

            const o =
                new Option(
                    x,
                    x.replace(/\/$/,"")
                );

            s.add(o);

        });

        if(s.options.length){

            version =
                s.value =
                s.options[
                    s.options.length - 1
                ].value;

        }

    }catch(e){

        s.add(
            new Option(
                version,
                version
            )
        );

    }

    loadSkins();
}


/* =====================================================
   LOAD AGARIO SKINS
===================================================== */

async function loadSkins(){

    const box =
        document.getElementById("skins");

    box.innerHTML =
        "Loading skins...";

    try{

        const r =
            await fetch(
                API +
                version +
                "/GameConfiguration.json"
            );

        const text =
            await r.text();

        const a =
            text.match(
                /\[(.*?)\]/g
            ) || [];

        const str =
            a[25] || "";

        const ids =
            str.match(
                /productId":"(.*?)"/g
            ) ||
            str.match(
                /productId": "(.*?)"/g
            ) ||
            [];

        const imgs =
            str.match(
                /image":"(.*?)"/g
            ) ||
            str.match(
                /image": "(.*?)"/g
            ) ||
            [];

        const skins = [];

        for(
            let i = 0;
            i < Math.min(
                ids.length,
                imgs.length
            );
            i++
        ){

            const id =
                ids[i]
                    .replace(/"/g,"")
                    .replace(/productId:/,"")
                    .replace(/skin_/,"")
                    .replace(/id:/,"")
                    .replace(" ","");

            const img =
                imgs[i]
                    .replace(/"/g,"")
                    .replace(/image:/,"")
                    .replace(" ","");

            if(
                !img.includes(
                    "uses_spine"
                )
            ){

                skins.push([
                    id,
                    img
                ]);

            }

        }

        /*
         * Nieuwste eerst
         */
        skins.reverse();

        allSkins = skins;

        renderAgarioPage(1);

    }catch(e){

        box.textContent =
            "Unable to load skins.";

    }
}


/* =====================================================
   AGARIO PAGINATION
   120 PER PAGE
===================================================== */

function renderAgarioPage(page){

    const perPage = 120;

    const box =
        document.getElementById("skins");

    const pages =
        document.getElementById(
            "agarioPages"
        );

    const total =
        Math.ceil(
            allSkins.length /
            perPage
        );

    currentAgarioPage = page;

    box.innerHTML = "";

    const start =
        (page - 1) *
        perPage;

    allSkins
        .slice(
            start,
            start + perPage
        )
        .forEach(
            ([id,img])=>{

                const d =
                    document.createElement(
                        "div"
                    );

                d.className =
                    "skin";

                d.innerHTML = `
                    <img
                        src="${API + version + "/" + img}"
                        alt="${id}"
                    >

                    <span>
                        ${id.replace(/\_/g," ")}
                    </span>
                `;

                box.appendChild(d);

            }
        );


    pages.innerHTML = "";

    for(
        let i = 1;
        i <= total;
        i++
    ){

        const b =
            document.createElement(
                "button"
            );

        b.className =
            "page-btn" +
            (
                i === page
                ? " active"
                : ""
            );

        b.textContent = i;

        b.onclick =
            ()=>renderAgarioPage(i);

        pages.appendChild(b);

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

/* =====================================================
   LOAD YOUTUBER SKINS
===================================================== */

async function loadYoutuberSkins(){

    const box =
        document.getElementById(
            "youtuberSkins"
        );

    box.innerHTML =
        "Loading Youtuber skins...";

    /*
     * De daadwerkelijke afbeelding-URL's
     * worden automatisch opgehaald van
     * agario-skins.top.
     */

    try{

        const response =
            await fetch(
                "https://www.agario-skins.top/youtuber-skins/"
            );

        const html =
            await response.text();

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(
                html,
                "text/html"
            );

        const found = [];

        const headings =
            doc.querySelectorAll(
                "h2"
            );

        headings.forEach(h2=>{

            const name =
                h2.textContent.trim();

            let img =
                h2.previousElementSibling;

            while(
                img &&
                img.tagName !== "IMG"
            ){

                img =
                    img.previousElementSibling;

            }

            if(
                img &&
                img.src
            ){

                found.push([
                    name,
                    img.src
                ]);

            }

        });


        /*
         * Als de website-afbeeldingen gevonden zijn,
         * gebruiken we deze.
         */
        if(found.length){

            youtuberSkins =
                found;

        }else{

            youtuberSkins =
                YOUTUBER_DATA;

        }

        renderYoutuberPage(1);

    }catch(e){

        /*
         * Fallback
         */
        youtuberSkins =
            YOUTUBER_DATA;

        renderYoutuberPage(1);

    }
}


/* =====================================================
   YOUTUBER PAGINATION
   30 PER PAGE
   6 x 5
===================================================== */

function renderYoutuberPage(page){

    const box =
        document.getElementById(
            "youtuberSkins"
        );

    const pages =
        document.getElementById(
            "youtuberPages"
        );

    const total =
        Math.ceil(
            youtuberSkins.length /
            perPage
        );

    currentYoutuberPage =
        page;

    box.innerHTML = "";

    const start =
        (page - 1) *
        perPage;


    youtuberSkins
        .slice(
            start,
            start + perPage
        )
        .forEach(
            ([name,img])=>{

                const d =
                    document.createElement(
                        "div"
                    );

                d.className =
                    "skin";

                d.innerHTML = `
                    <img
                        src="${img}"
                        alt="${name}"
                    >

                    <span>
                        ${name}
                    </span>
                `;

                box.appendChild(d);

            }
        );


    pages.innerHTML = "";

    for(
        let i = 1;
        i <= total;
        i++
    ){

        const b =
            document.createElement(
                "button"
            );

        b.className =
            "page-btn" +
            (
                i === page
                ? " active"
                : ""
            );

        b.textContent = i;

        b.onclick =
            ()=>renderYoutuberPage(i);

        pages.appendChild(b);

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}
