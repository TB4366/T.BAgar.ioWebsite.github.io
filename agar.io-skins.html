<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skin Shop</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; }
    .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .skins { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: 15px; }
    .skin { background: rgba(200,200,200,0.15); border: 1px solid #555; border-radius: 10px;
            padding: 15px; position: relative; cursor: pointer; transition: transform 0.15s, filter 0.15s; }
    .skin:hover { filter: brightness(1.2); }
    .skin:active { transform: scale(0.97); }
    .skin.locked { filter: grayscale(100%); }
    .skin .lock { position: absolute; top: 8px; left: 8px; font-size: 14px; background: rgba(0,0,0,0.6);
                  padding: 2px 6px; border-radius: 4px; }
    .skin .price { margin-top: 8px; display: flex; justify-content: space-between; font-size: 14px; }
    .key-bar { background: #333; padding: 10px; border-radius: 8px; display: flex; gap: 10px; margin-bottom: 20px; }
    .key-bar input { flex: 1; padding: 6px; border-radius: 4px; border: none; }
    .key-bar button { padding: 6px 12px; border: none; border-radius: 4px; background: #0af; color: #fff; cursor: pointer; }
    .message { margin-top: 10px; font-size: 14px; color: gold; }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar">
    <div><strong>Contact T.B</strong> to buy more coins!</div>
    <div>
      <div style="font-size:12px;color:#aaa;">Your coins</div>
      <div id="coins" style="font-size:20px;font-weight:bold;">0</div>
    </div>
  </div>

  <!-- Key input -->
  <div class="key-bar">
    <input id="keyInput" placeholder="Enter your key...">
    <button onclick="loadKey()">Load key</button>
  </div>

  <!-- Skins grid -->
  <div class="skins" id="skinsGrid"></div>

  <!-- Message -->
  <div class="message" id="message"></div>

<script>
  const skins = [
    { id: "skin1", name: "Stealth Ops", price: 100 },
    { id: "skin2", name: "Crimson Viper", price: 250 },
    { id: "skin3", name: "Glacier", price: 500 },
    { id: "skin4", name: "Midnight", price: 750 },
    { id: "skin5", name: "Solar Flare", price: 1200 },
  ];

  let currentKey = null;
  let coins = 0;
  let owned = [];

  const coinsEl = document.getElementById("coins");
  const messageEl = document.getElementById("message");
  const skinsGrid = document.getElementById("skinsGrid");

  function renderSkins() {
    skinsGrid.innerHTML = "";
    skins.forEach(skin => {
      const isOwned = owned.includes(skin.id);
      const div = document.createElement("div");
      div.className = "skin " + (isOwned ? "" : "locked");
      div.innerHTML = `
        <div class="lock">${isOwned ? "✓" : "🔒"}</div>
        <div style="text-align:center;margin-top:20px;">${skin.name}</div>
        <div class="price"><span>${skin.name}</span><span>${skin.price} 💠</span></div>
      `;
      div.onclick = () => purchaseSkin(skin);
      skinsGrid.appendChild(div);
    });
  }

  function showMessage(msg) {
    messageEl.textContent = msg;
  }

  function loadKey() {
    const key = document.getElementById("keyInput").value.trim();
    if (!key) return showMessage("Please enter a key.");
    // Simpel: key opgeslagen in localStorage
    const data = JSON.parse(localStorage.getItem("skinshop_"+key) || "{}");
    currentKey = key;
    coins = data.coins || 0;
    owned = data.owned || [];
    coinsEl.textContent = coins;
    renderSkins();
    showMessage("Key loaded!");
  }

  function saveData() {
    if (!currentKey) return;
    localStorage.setItem("skinshop_"+currentKey, JSON.stringify({ coins, owned }));
  }

  function purchaseSkin(skin) {
    if (!currentKey) return showMessage("Load your key first!");
    if (owned.includes(skin.id)) return showMessage("You already own this skin.");
    if (coins < skin.price) return showMessage("Not enough coins.");
    coins -= skin.price;
    owned.push(skin.id);
    coinsEl.textContent = coins;
    saveData();
    renderSkins();
    showMessage("Purchased "+skin.name+"!");
  }

  renderSkins();
</script>

</body>
</html>
