body { font-family: system-ui, sans-serif; margin:0; background:#0b1220; color:#fff; padding:0; }
.menu { background:#0f172a; display:flex; flex-wrap:wrap; overflow-x:auto; }
.menu a { display:flex; align-items:center; gap:8px; padding:12px 16px; text-decoration:none; color:white; border-bottom:1px solid #334155; }
.menu a:hover { background:#334155; }
header { padding:20px 0; text-align:center; margin-bottom:20px; }
h1 { margin:0; }

.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; padding:20px; }

.card {
  background:#1e293b; border-radius:12px; padding:12px; text-align:center;
  box-shadow:0 0 8px #0f172a; position:relative;
  transition:0.3s ease;
}

.card img { width:100%; border-radius:8px; margin-bottom:10px; object-fit:cover; }

.card a button {
  display:block; width:100%; padding:8px;
  background:#3b82f6; color:white; font-weight:bold;
  border:none; border-radius:8px; cursor:pointer; margin-bottom:8px;
  transition:0.3s ease;
}

button.locked { background:#4b5563 !important; cursor:not-allowed; }

.card .info { font-size:0.9rem; color:#cbd5e1; margin-bottom:4px; }

.status-label {
  position:absolute; top:10px; left:10px;
  background:red; color:white; padding:3px 8px;
  border-radius:4px; font-weight:bold; display:none;
}

.overlay {
  position:absolute; top:0; left:0;
  width:100%; height:100%; border-radius:12px;
  background:rgba(0,0,0,0.65);
  display:none; align-items:center; justify-content:center;
  font-size:1.1rem; text-align:center; padding:10px;
}

.icon {
  font-size:1.6rem;
  margin-bottom:6px;
  display:block;
}

hr { border:none; height:2px; background:#3b82f6; margin:40px 0; }
.section-title { text-align:center; font-size:1.5rem; font-weight:bold; margin-bottom:20px; }

.help-section { text-align:center; padding-bottom:40px; }
.help-section p { font-size:1.2rem; margin-bottom:20px; }
.help-button {
  background:#3b82f6; color:white; padding:12px 24px;
  border:none; border-radius:8px; font-size:1rem; font-weight:bold;
  cursor:pointer; text-decoration:none; transition:0.3s ease;
}
.help-button:hover { background:#2563eb; }

@media (max-width:1024px) { .grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:640px) { .grid { grid-template-columns:1fr; } }

<script>
document.querySelectorAll(".card").forEach(card => {
  const status = card.dataset.status;
  const overlay = card.querySelector(".overlay");
  const button = card.querySelector("a button");
  const label = card.querySelector(".status-label");

  if(status === "inactive"){
    overlay.style.display = "flex";
    overlay.innerHTML = "<span>This mod is no longer available</span>";
    card.style.opacity = "0.4";
    button.classList.add("locked");
  }

  if(status === "soon"){
    overlay.style.display = "flex";
    overlay.innerHTML = "<span class='icon'>🔒</span>Coming Soon";
    button.classList.add("locked");
  }

  if(status === "update"){
    overlay.style.display = "flex";
    overlay.innerHTML = "<span class='icon'>⏳</span>Update Required";
    label.style.display = "block";
    button.classList.add("locked");
  }

  if(status === "active"){
    overlay.style.display = "none";
    button.classList.remove("locked");
    label.style.display = "none";
  }
});
</script>
