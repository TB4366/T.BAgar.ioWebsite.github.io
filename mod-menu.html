align-items:center;
gap:6px;

}

.status-indicator.available{

<script>

// ============================================

  },
  {

    updateTimer: null,
  },
  {
    img: "IMG_6587.png",
    link: "https://github.com/QxAngel/qxangel.github.io/releases/download/2/26.6.0.kahraba+shark.ipa",
    version: "26.6.0",
    date: "05-07-2026",
    name: "Kahraba + Shark Mod",
    status: "available",
    updateTimer: null,
  },
  {
    img: "IMG_6587.png",
    link: "https://github.com/QxAngel/qxangel.github.io/releases/download/2/26.6.0.myu.ipa",
    version: "26.6.0",
    date: "05-07-2026",
    name: "Myu mod",

  },
  {

    link: "https://github.com/QxAngel/qxangel.github.io/releases/download/1/EeveeSpotify.ipa",
    version: "9.0.66",
    date: "03-08-2025",
    name: "Spotify Premium Mod",
    status: "available",
    updateTimer: null,
  },
];

// ============================================
// INITIALIZE
// ============================================

setTimeout(() => {
  document.getElementById("loader").style.display = "none";
}, 2000 + Math.random() * 2000);

// Render mods
const modsGrid = document.getElementById("modsGrid");
MODS_CONFIG.forEach((mod, index) => {
  modsGrid.appendChild(createModCard(mod, index));
});

// ============================================
// CREATE MOD CARD
// ============================================

function createModCard(mod, index) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.status = mod.status;
  card.dataset.modIndex = index;

  let statusLabelHTML = "";
  if (mod.updateTimer) {
    statusLabelHTML = `
      <div class="status-label timer" id="timer-${index}">
        ${mod.updateTimer.showLabel}
      </div>
    `;
  }

  const statusTexts = {
    available: "🟢 Available",
    processing: "🟠 Processing",
    unavailable: "🔴 Unavailable",
  };

  const statusClasses = {
    available: "available",
    processing: "processing",
    unavailable: "unavailable",
  };

  const downloadBtn = mod.status === "unavailable" 
    ? `<button class="download" onclick="notAvailable(event)">Download</button>`
    : `<a href="${mod.link}"><button class="download">Download</button></a>`;

  const html = `
    ${statusLabelHTML}
    <img src="${mod.img}">
    <div class="button-container">
      ${downloadBtn}
      <button class="status-indicator ${statusClasses[mod.status]}">
        ${statusTexts[mod.status]}
      </button>
    </div>
    <div class="info">Version: ${mod.version}</div>
    <div class="info">Date: ${mod.date}</div>
    <div class="info">${mod.name}</div>
    <div class="overlay"></div>
  `;

  card.innerHTML = html;

  // Initialize timer if exists
  if (mod.updateTimer) {
    initializeTimer(index, mod.updateTimer);
  }

  return card;
}

// ============================================
// TIMER SYSTEM
// ============================================

const timers = {};

function initializeTimer(modIndex, timerConfig) {
  let totalSeconds = (timerConfig.hours || 0) * 3600 + 
                     (timerConfig.minutes || 0) * 60 + 
                     (timerConfig.seconds || 0);
  
  const timerLabel = document.getElementById(`timer-${modIndex}`);
  
  function updateTimerDisplay() {
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    
    let timeStr = "";
    if (hours > 0) {
      timeStr = `${hours}h ${minutes}m ${seconds}s`;
    } else {
      timeStr = `${minutes}m ${seconds}s`;
    }
    
    timerLabel.textContent = timeStr;
  }
  
  updateTimerDisplay();
  
  timers[modIndex] = setInterval(() => {
    totalSeconds--;
    
    if (totalSeconds <= 0) {
      clearInterval(timers[modIndex]);
      timerLabel.textContent = timerConfig.showLabel === "UPDATE" 
        ? "NEW UPDATE!" 
        : "NEW UPDATE!";
      timerLabel.style.animation = "none";
      setTimeout(() => {
        timerLabel.style.animation = "";
      }, 10);
      return;
    }
    
    updateTimerDisplay();
  }, 1000);
}

// ============================================
// MENU
// ============================================

function toggleMenu() {
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

// Close menu when clicking outside
document.addEventListener("click", (e) => {
  const menu = document.getElementById("menu");
  const menuBtn = document.querySelector(".menu-btn");
  
  if (!menu.contains(e.target) && !menuBtn.contains(e.target)) {
    menu.style.display = "none";
  }
});

// ============================================
// UNAVAILABLE MOD
// ============================================

function notAvailable(e) {
  e.preventDefault();
  alert("This mod is not available");
}

// ============================================
// DOWNLOAD WITH VERIFICATION (OPTIONAL)
// ============================================

document.addEventListener("click", (e) => {
  if (e.target.classList.contains("download") && e.target.tagName !== "BUTTON") return;
  if (!e.target.classList.contains("download")) return;
  
  const card = e.target.closest(".card");
  if (!card) return;
  
  const modIndex = card.dataset.modIndex;
  if (modIndex === undefined) return; // Links don't have modIndex
  
  const mod = MODS_CONFIG[modIndex];
  if (!mod || mod.status === "unavailable") return;
  
  e.preventDefault();
  
  const overlay = card.querySelector(".overlay");
  overlay.style.display = "flex";
  overlay.innerHTML = `
    <div>
      Downloading ${mod.name}...
      <div class="spinner"></div>
    </div>
  `;

  setTimeout(() => showVerify(card, mod), random(3000, 6000));
});

function showVerify(card, mod) {
  const overlay = card.querySelector(".overlay");

  let ytDone = false;
  let igDone = false;

  overlay.innerHTML = `
    <div class="verify-box">
      <div class="verify-title">Verification</div>
      <hr style="margin:10px 0;">
      <button id="ytBtn">Subscribe on YouTube</button>
      <div class="status" id="ytStatus">⏳</div>
      <br>
      <button id="igBtn">Follow on Instagram</button>
      <div class="status" id="igStatus">⏳</div>
      <br>
      <button id="unlockBtn" style="background:gray;padding:10px;border-radius:10px;border:none;color:white;cursor:pointer;">
        🔒 Locked
      </button>
    </div>
  `;

  document.getElementById("ytBtn").onclick = () => {
    window.open("https://www.youtube.com/@T.B6", "_blank");
    setTimeout(() => {
      ytDone = true;
      document.getElementById("ytStatus").innerHTML = "✔";
      checkUnlock();
    }, random(5000, 12000));
  };

  document.getElementById("igBtn").onclick = () => {
    window.open("https://www.instagram.com/t.bagar.io/", "_blank");
    setTimeout(() => {
      igDone = true;
      document.getElementById("igStatus").innerHTML = "✔";
      checkUnlock();
    }, random(5000, 12000));
  };

  const unlockBtn = document.getElementById("unlockBtn");

  function checkUnlock() {
    if (ytDone && igDone) {
      unlockBtn.style.background = "#22c55e";
      unlockBtn.innerHTML = "🔓 Unlock";
      unlockBtn.onclick = () => startDownload(card, mod);
    }
  }
}

function startDownload(card, mod) {
  const overlay = card.querySelector(".overlay");
  let texts = ["Downloading...", "Please wait...", "Preparing file..."];
  let i = 0;

  overlay.innerHTML = `
    <div>
      <div id="dlText">${texts[0]}</div>
      <div class="spinner"></div>
    </div>
  `;

  let interval = setInterval(() => {
    i = (i + 1) % texts.length;
    document.getElementById("dlText").innerText = texts[i];
  }, 2000);

  setTimeout(() => {
    clearInterval(interval);
    overlay.innerHTML = `
      <div style="text-align:center;">
        ✔ Download complete
      </div>
    `;

    setTimeout(() => {
      window.location.href = mod.link;
    }, 1500);
  }, random(10000, 20000));
}

function random(min, max) {
  return Math.random() * (max - min) + min;
}

</script>
