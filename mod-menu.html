<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mod Menu — T.B Agar.io Website</title>
<style>
  :root{
    --bg:#0b1220;
    --panel:#1e293b;
    --muted:#94a3b8;
    --accent:#3b82f6;
    --card-border:#172032;
    --label-update:#ef4444;
    --label-soon:#2563eb;
    --label-not:#7c3aed;
  }

  html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
  .menu{background:#0f172a;display:flex;flex-wrap:wrap;padding:8px 12px;gap:8px;border-bottom:1px solid #18202a}
  .menu a{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;color:#fff;text-decoration:none;border-radius:8px}
  .menu a:hover{background:#10304a}

  header{padding:18px 12px;text-align:center}
  header h1{margin:0;font-size:1.6rem}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:20px}
  @media (max-width:1024px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--panel);
    border-radius:12px;
    padding:12px;
    text-align:center;
    box-shadow:0 4px 18px rgba(2,6,23,0.6);
    position:relative;
    border:1px solid var(--card-border);
    min-height:300px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .card img{width:100%;height:160px;object-fit:cover;border-radius:8px;background:linear-gradient(180deg,#0b1220,#111827)}

  .status-label{
    position:absolute; top:12px; left:12px; padding:6px 8px; border-radius:8px;
    font-weight:700; display:none; font-size:0.85rem;
  }
  .status-label.update{ background:var(--label-update); color:white; }
  .status-label.soon{ background:var(--label-soon); color:white; }
  .status-label.not{ background:var(--label-not); color:white; }

  .card .info{ font-size:0.92rem; color:var(--muted); margin-top:4px; }

  .download {
    border:none; padding:10px; border-radius:8px; background:var(--accent);
    color:#fff; font-weight:700; cursor:pointer; width:100%;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .download.locked {
    background:#475569 !important; color:#e2e8f0; cursor:not-allowed;
  }

  .overlay {
    position:absolute; inset:0; display:none; justify-content:center; align-items:center; text-align:center;
    padding:12px; border-radius:12px; font-weight:700; font-size:1rem; color:#fff;
    background:rgba(0,0,0,0.55);
  }

  hr.section-line{border:none;height:3px;background:var(--accent);margin:28px 0;border-radius:4px}
  .section-title{text-align:center;font-size:1.15rem;margin-bottom:12px}

  .help-section{text-align:center;padding:28px 12px}
  .help-button{display:inline-block;background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:700}
  .help-button:hover{background:#2563eb}

  .btn-icon{font-size:1.05rem}
</style>
</head>
<body>

<!-- Menu -->
<div class="menu">
  <a href="index.html">🏠 Home Page</a>
  <a href="custom-skins.html">🎨 Custom Skins</a>
  <a href="mod-menu.html">🛠️ Mod Menu</a>
  <a href="key-access.html">🔑 Keys</a>
  <a href="buy-account.html">💰 Buy Account</a>
  <a href="sell-account.html">📤 Sell Account</a>
</div>

<header><h1>Mod Menu</h1></header>

<!-- ========== 16 HOOFDMODS ========== -->
<div class="grid">

  <!-- MOD 1 -->
  <div class="card"
       data-status="update"
       data-update-msg="Deze update is klaar en is over 1 uur beschikbaar"
       data-soon-msg="De mod komt zo"
       data-notavail-msg="This mod is no longer available.">
    <div class="status-label update">UPDATE</div>
    <img src="EDFC02D9-A95F-479D-BD21-3709C77B8FF5.jpeg" alt="Mod 1">
    <a href="#"><button class="download">Download</button></a>
    <div class="info">Version: 2.30.5</div>
    <div class="info">Date: 08-09-2025</div>
    <div class="info">T.B Mod (Kabrah) Unlock skin</div>
    <div class="overlay"></div>
  </div>

  <!-- MOD 2 t/m MOD 16 voorbeeldcards -->
  <div class="card" data-status="soon" data-update-msg="" data-soon-msg="" data-notavail-msg="This mod is no longer available.">
    <div class="status-label update">UPDATE</div>
    <img src="#" alt="Mod">
    <a href="#"><button class="download">Download</button></a>
    <div class="info"></div><div class="info"></div><div class="info"></div>
    <div class="overlay"></div>
  </div>
  <!-- Herhaal dit voor alle 16 mods, pas data-status aan per mod -->

</div>

<hr class="section-line">
<div class="section-title">DNS PROFILE</div>

<!-- ========== 8 EXTRA MODS ========== -->
<div class="grid">

  <!-- Extra Mod 1 t/m Extra Mod 8 -->
  <div class="card" data-status="inactive" data-update-msg="" data-soon-msg="" data-notavail-msg="This mod is no longer available.">
    <div class="status-label update">UPDATE</div>
    <img src="#" alt="Extra Mod">
    <a href="#"><button class="download">Download</button></a>
    <div class="info"></div><div class="info"></div><div class="info"></div>
    <div class="overlay"></div>
  </div>
  <!-- Herhaal dit voor alle 8 extra mods -->

</div>

<hr class="section-line">

<div class="help-section">
  <p><strong>How do I get the mod?</strong></p>
  <a class="help-button" href="mods-help.html">Help Mods</a>
</div>

<script>
document.querySelectorAll('.card').forEach(card => {
  const status = (card.getAttribute('data-status') || 'inactive').trim();
  const btn = card.querySelector('button.download');
  const label = card.querySelector('.status-label');
  const overlay = card.querySelector('.overlay');

  const setLocked = (icon, text, clickMsg) => {
    if(!btn) return;
    btn.classList.add('locked');
    btn.innerHTML = `<span class="btn-icon">${icon}</span> ${text}`;
    btn.onclick = (e) => { e.preventDefault(); alert(clickMsg); };
    btn.setAttribute('aria-disabled','true');
  };

  const setActiveButton = () => {
    if(!btn) return;
    btn.classList.remove('locked');
    btn.innerHTML = 'Download';
    btn.onclick = null;
    btn.removeAttribute('aria-disabled');
  };

  if(label) label.style.display = 'none';
  if(overlay) overlay.style.display = 'none';
  card.style.display = '';
  card.style.opacity = '';

  if(status === 'active'){
    setActiveButton();
  } else if(status === 'update') {
    if(label){ label.className='status-label update'; label.textContent='UPDATE'; label.style.display='block'; }
    const msg = card.getAttribute('data-update-msg') || 'This update is ready.';
    setLocked('⏳','Update', msg);
  } else if(status === 'soon' || status === 'coming-soon') {
    if(label){ label.className='status-label soon'; label.textContent='COMING SOON'; label.style.display='block'; }
    const msg = card.getAttribute('data-soon-msg') || 'De mod komt zo';
    setLocked('🔒','Coming Soon', msg);
  } else if(status === 'available') {
    if(label){ label.className='status-label not'; label.textContent='NOT AVAILABLE'; label.style.display='block'; }
    const msg = card.getAttribute('data-notavail-msg') || 'This mod is no longer available.';
    if(overlay){ overlay.textContent=msg; overlay.style.display='flex'; overlay.style.background='rgba(0,0,0,0.55)'; }
    setLocked('🔒','Not available', msg);
    card.style.opacity='0.45';
  } else if(status === 'inactive') {
    card.style.display='none';
  } else {
    card.style.display='none';
  }
});
</script>

</body>
</html>
