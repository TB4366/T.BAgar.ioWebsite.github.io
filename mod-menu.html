<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Mod Menu — T.B Agar.io Website</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

/* LOADER */
#loader{
position:fixed;
inset:0;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
gap:15px;
color:white;
font-size:28px;
z-index:9999;
}

.spinner{
width:38px;
height:38px;
border:5px solid #1e40af;
border-top:5px solid #38bdf8;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

/* BODY */
body{
background:#020617;
color:white;
min-height:100vh;
overflow-x:hidden;
}

.light-mode{
background:#fff;
color:#111827;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 30px;
background:rgba(0,0,0,.5);
backdrop-filter:blur(15px);
border-bottom:1px solid #2563eb;
}

.left-header{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:45px;
height:45px;
border-radius:50%;
overflow:hidden;
box-shadow:0 0 20px #38bdf8;
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
}

.site-title{
font-size:22px;
font-weight:bold;
color:#38bdf8;
}

.header-buttons{
display:flex;
gap:10px;
}

.menu-btn,.theme-btn{
background:none;
border:none;
font-size:25px;
cursor:pointer;
color:white;
}

/* MENU */
.menu{
display:none;
position:absolute;
right:30px;
top:75px;
background:#020617;
border-radius:12px;
z-index:1000;
box-shadow:0 0 25px black;
}

.menu a{
display:block;
padding:14px 20px;
color:white;
text-decoration:none;
border-bottom:1px solid #1e3a8a;
}

.menu a:hover{
background:#2563eb;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:#0f172a;
border-radius:15px;
border:1px solid #1e40af;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
position:relative;
}

.card img{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
border-radius:10px;
}

.info{
color:#94a3b8;
font-size:.9rem;
}

/* STATUS LABEL */
.status-label{
position:absolute;
top:10px;
left:10px;
padding:5px 8px;
font-size:12px;
border-radius:6px;
font-weight:bold;
display:none;
}

.status-label.update{background:#ef4444;}
.status-label.not{background:#7c3aed;}

/* BUTTONS */
.download,.Site,.Install{
padding:10px;
background:#2563eb;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
}

/* CHAT */
.chat-toggle{
position:fixed;
bottom:20px;
right:20px;
width:70px;
height:70px;
border-radius:50%;
overflow:hidden;
cursor:pointer;
z-index:9999;
border:3px solid #38bdf8;
box-shadow:0 0 20px #38bdf8;
}

.chat-toggle img{
width:100%;
height:100%;
object-fit:cover;
}

.chat-box{
display:none;
position:fixed;
bottom:100px;
right:20px;
width:360px;
height:520px;
background:#0f172a;
border-radius:20px;
border:2px solid #2563eb;
flex-direction:column;
z-index:9999;
}

.chat-box.large{
width:500px;
height:700px;
}

.chat-banner{
width:100%;
height:120px;
object-fit:cover;
}

.chat-header{
text-align:center;
padding:10px;
}

.chat-header-logo{
width:65px;
height:65px;
border-radius:50%;
border:3px solid #38bdf8;
margin-top:-35px;
object-fit:cover;
background:#020617;
}

.chat-title{
font-size:20px;
font-weight:bold;
color:#38bdf8;
}

.chat-line{
height:2px;
background:#2563eb;
margin-top:10px;
}

.chat-messages{
flex:1;
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
}

.bot-message{
background:#1e293b;
padding:10px;
border-radius:12px;
max-width:85%;
align-self:flex-start;
}

.user-message{
background:#2563eb;
padding:10px;
border-radius:12px;
max-width:85%;
align-self:flex-end;
}

.chat-input-area{
display:flex;
padding:10px;
gap:8px;
border-top:1px solid #2563eb;
}

.chat-input{
flex:1;
padding:10px;
border:none;
border-radius:10px;
}

.chat-send{
padding:10px 14px;
background:#2563eb;
border:none;
color:white;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<script>

/* LOADER */
setTimeout(()=>document.getElementById("loader").style.display="none",2500);

/* MENU */
function toggleMenu(){
let m=document.getElementById("menu");
m.style.display=m.style.display==="block"?"none":"block";
}

/* THEME */
function toggleTheme(){
document.body.classList.toggle("light-mode");
}

/* CHAT */
const box=document.getElementById("chatBox");
const msgs=document.getElementById("chatMessages");
const input=document.getElementById("chatInput");

function toggleChat(){
box.style.display=box.style.display==="flex"?"none":"flex";
if(msgs.innerHTML==="") welcome();
}

function addBot(t){
let d=document.createElement("div");
d.className="bot-message";
d.textContent=t;
msgs.appendChild(d);
msgs.scrollTop=msgs.scrollHeight;
}

function addUser(t){
let d=document.createElement("div");
d.className="user-message";
d.textContent=t;
msgs.appendChild(d);
msgs.scrollTop=msgs.scrollHeight;
}

function welcome(){
let h=new Date().getHours();
let g="Good night";
if(h<12) g="Good morning";
else if(h<18) g="Good afternoon";
else if(h<23) g="Good evening";
addBot(g+", can I help you?");
}

function sendMessage(){
let t=input.value.trim();
if(!t) return;
addUser(t);
input.value="";
reply(t.toLowerCase());
}

function reply(m){

if(m.includes("shark")) return addBot("Shark Mod 26.6.0");
if(m.includes("dns")) return addBot("DNS Profile link in site");
if(m.includes("kahraba")) return addBot("Kahraba Mod 26.5.0");
if(m.includes("bite")) return addBot("Bite Mod 26.5.0");

addBot("Try: shark, dns, kahraba, bite");
}

</script>
