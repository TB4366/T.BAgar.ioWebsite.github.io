<style>

/* ===== RESET ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
min-height:100vh;
overflow-x:hidden;
}

/* LIGHT MODE */
.light-mode{
background:#ffffff;
color:#111827;
}

/* ===== HEADER ===== */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 30px;
background:rgba(0,0,0,.5);
backdrop-filter:blur(15px);
border-bottom:1px solid #2563eb;
position:relative;
z-index:1000;
}

.left-header{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:45px;
height:45px;
border-radius:50%;
overflow:hidden;
box-shadow:0 0 20px #38bdf8;
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
}

.site-title{
font-size:22px;
font-weight:bold;
color:#38bdf8;
}

.header-buttons{
display:flex;
gap:10px;
position:relative;
z-index:100000;
}

.menu-btn,
.theme-btn{
background:none;
border:none;
font-size:25px;
cursor:pointer;
color:white;
}

/* HAMBURGER MENU */
.menu{
display:none;
position:absolute;
right:30px;
top:75px;
background:#020617;
border-radius:12px;
overflow:hidden;
z-index:99999;
box-shadow:0 0 25px black;
}

.menu a{
display:block;
padding:14px 20px;
color:white;
text-decoration:none;
border-bottom:1px solid #1e3a8a;
}

.menu a:hover{
background:#2563eb;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:#0f172a;
border-radius:15px;
border:1px solid #1e40af;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
position:relative;
box-shadow:0 0 20px rgba(0,140,255,.3);
}

.light-mode .card{
background:#ffffff;
}

.card img{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
border-radius:10px;
}

/* BUTTONS */
.download{
padding:10px;
background:#2563eb;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
}

/* INFO */
.info{
color:#94a3b8;
font-size:.9rem;
}

/* SECTION */
hr.section-line{
border:none;
height:3px;
background:#2563eb;
margin:30px 0;
border-radius:5px;
}

.section-title{
text-align:center;
font-size:22px;
color:#38bdf8;
}

.help-section{
text-align:center;
padding:30px;
}

.help-button{
background:#2563eb;
padding:12px 25px;
border-radius:10px;
color:white;
text-decoration:none;
font-weight:bold;
}

/* ===== CHAT ===== */
.chat-toggle{
position:fixed;
bottom:20px;
right:20px;
width:70px;
height:70px;
border-radius:50%;
overflow:hidden;
cursor:pointer;
z-index:9999;
border:3px solid #38bdf8;
box-shadow:0 0 20px #38bdf8;
}

.chat-toggle img{
width:100%;
height:100%;
object-fit:cover;
}

.chat-box{
display:none;
position:fixed;
bottom:100px;
right:20px;
width:360px;
height:520px;
background:#0f172a;
border:2px solid #2563eb;
border-radius:20px;
overflow:hidden;
z-index:99999;
flex-direction:column;
}

.chat-box.large{
width:500px;
height:700px;
}

.chat-banner{
width:100%;
height:120px;
object-fit:cover;
}

.chat-header{
text-align:center;
padding:10px;
}

.chat-header-logo{
width:65px;
height:65px;
border-radius:50%;
border:3px solid #38bdf8;
margin-top:-35px;
background:#020617;
object-fit:cover;
}

.chat-title{
font-size:20px;
font-weight:bold;
color:#38bdf8;
margin-top:8px;
}

.chat-line{
height:2px;
background:#2563eb;
margin-top:10px;
}

.chat-messages{
flex:1;
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
}

.bot-message{
background:#1e293b;
padding:10px;
border-radius:12px;
max-width:85%;
align-self:flex-start;
}

.user-message{
background:#2563eb;
padding:10px;
border-radius:12px;
max-width:85%;
align-self:flex-end;
}

.chat-input-area{
display:flex;
padding:10px;
gap:8px;
border-top:1px solid #2563eb;
}

.chat-input{
flex:1;
padding:10px;
border:none;
border-radius:10px;
outline:none;
}

.chat-send{
padding:10px 14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
font-weight:bold;
}

.chat-controls{
position:absolute;
top:10px;
right:10px;
display:flex;
gap:6px;
}

.chat-controls button{
background:#2563eb;
color:white;
border:none;
width:32px;
height:32px;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<div class="left-header">

<header>
<h1>Mod Menu</h1>
</header>

<!-- ===== HELP BUTTON ===== -->
<div class="help-section">
<p><strong>How do I get the mod?</strong></p>

</div>

<img src="chat-logo.png">
</div>

<img src="chat-banner.png" class="chat-banner">

<div class="chat-controls">
<button onclick="toggleSize()">□</button>
<button onclick="closeChat()">✕</button>
</div>

<div class="chat-header">
<img src="chat-logo.png" class="chat-header-logo">
<div class="chat-title">T.B Service</div>
<div class="chat-line"></div>
</div>

<div class="chat-messages" id="chatMessages"></div>

<div class="chat-input-area">
<input id="chatInput" class="chat-input" placeholder="Type a message...">
<button class="chat-send" onclick="sendMessage()">Send</button>
</div>

</div>

<!-- ===== SCRIPT ===== -->
<script>

function toggleMenu(){
let menu=document.getElementById("menu");
menu.style.display = menu.style.display==="block"?"none":"block";
}

/* THEME FIX */
function toggleTheme(){
let body=document.body;
let btn=document.getElementById("themeBtn");

body.classList.toggle("light-mode");

let isLight = body.classList.contains("light-mode");

btn.textContent = isLight ? "🌙" : "☀️";

localStorage.setItem("theme", isLight ? "light":"dark");
}

window.onload = () => {
let saved = localStorage.getItem("theme");
if(saved==="light"){
document.body.classList.add("light-mode");
document.getElementById("themeBtn").textContent="🌙";
}
};

/* CHAT */
const chatBox=document.getElementById("chatBox");
const chatMessages=document.getElementById("chatMessages");
const chatInput=document.getElementById("chatInput");

function toggleChat(){
chatBox.style.display = chatBox.style.display==="flex"?"none":"flex";
if(chatMessages.innerHTML==="") welcome();
}

function closeChat(){ chatBox.style.display="none"; }

function toggleSize(){ chatBox.classList.toggle("large"); }

function add(text,type){
let div=document.createElement("div");
div.className= type==="user"?"user-message":"bot-message";
div.textContent=text;
chatMessages.appendChild(div);
chatMessages.scrollTop=chatMessages.scrollHeight;
}

function welcome(){
let h=new Date().getHours();
let msg =
h<12?"Good morning, can I help you?":
h<18?"Good afternoon, can I help you?":
h<23?"Good evening, can I help you?":
"Good night, can I help you?";
add(msg,"bot");
}

function sendMessage(){
let text=chatInput.value.trim();
if(!text) return;

add(text,"user");
chatInput.value="";
reply(text.toLowerCase());
}

chatInput.addEventListener("keydown",(e)=>{
if(e.key==="Enter") sendMessage();
});

function reply(msg){

if(msg.includes("shark")) return add("Shark Mod: https://rekonise.com/shark-mod-update-2660-gmlcy","bot");
if(msg.includes("kahraba")) return add("Kahraba Mod: https://rekonise.com/agario-2650-kahraba-mod-alrrj","bot");
if(msg.includes("bite")) return add("Bite Mod: https://rekonise.com/agario-2650-biteytvip-2ed1e","bot");
if(msg.includes("dns")) return add("DNS Profile: https://github.com/dns-khoindvn/top-country-stats/releases/download/DNS/signed_khoindvn_fullchain.mobileconfig","bot");

if(msg.includes("help")) return add("Go to Help Mods page: mods-help.html","bot");

return add("Try: Shark, Kahraba, Bite, DNS or Help.","bot");
}

</script>
