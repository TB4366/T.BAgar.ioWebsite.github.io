body { font-family: system-ui, sans-serif; margin:0; background:#0b1220; color:#fff; padding:0; }
.menu { background:#0f172a; display:flex; flex-wrap:wrap; overflow-x:auto; }
.menu a { display:flex; align-items:center; gap:8px; padding:12px 16px; text-decoration:none; color:white; border-bottom:1px solid #334155; }
.menu a:hover { background:#334155; }
header { padding:20px 0; text-align:center; margin-bottom:20px; }
h1 { margin:0; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; padding:20px; }
.card { background:#1e293b; border-radius:12px; padding:12px; text-align:center; box-shadow:0 0 8px #0f172a; transition: transform 0.2s ease, box-shadow 0.2s ease; position:relative; }
.card:hover { transform:translateY(-5px); box-shadow:0 8px 20px rgba(0,0,0,0.3); }
.card img { width:100%; border-radius:8px; margin-bottom:10px; object-fit:cover; }
.card a button { display:block; width:100%; padding:8px; background:#3b82f6; color:white; font-weight:bold; border:none; border-radius:8px; cursor:pointer; margin-bottom:8px; transition:background 0.3s ease; }
.card a button.locked { background:#555; cursor:not-allowed; }
.card .info { font-size:0.9rem; color:#cbd5e1; margin-bottom:4px; }
.card .status-label { position:absolute; top:10px; left:10px; background:red; color:white; padding:2px 6px; border-radius:4px; font-weight:bold; display:none; }
.status-controls { display:flex; justify-content:center; gap:5px; margin-bottom:10px; flex-wrap:wrap; }
.status-controls button { padding:4px 8px; border:none; border-radius:4px; cursor:pointer; font-size:0.8rem; }
.status-controls button.active { background:green; color:white; }
.status-controls button.soon { background:orange; color:white; }
.status-controls button.inactive { background:gray; color:white; }
.status-controls button.update { background:red; color:white; }
.overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); color:white; display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:1rem; border-radius:12px; display:none; text-align:center; }
hr { border:none; height:2px; background:#3b82f6; margin:40px 0; }
.section-title { text-align:center; font-size:1.5rem; font-weight:bold; margin-bottom:20px; }
.help-section { text-align:center; padding-bottom:20px; }
.help-section p { font-size:1.2rem; margin-bottom:20px; }
.help-button { background:#3b82f6; color:white; padding:10px 20px; border:none; border-radius:8px; font-size:1rem; font-weight:bold; cursor:pointer; transition:background 0.3s ease; text-decoration:none; display:inline-block; }
.help-button:hover { background:#2563eb; }
@media (max-width:1024px) { .grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:640px) { .grid { grid-template-columns:1fr; } }
</style>
